"W-242","term":"一般物体認識","category":6,"short":"特定の物に限らず、身の回りのさまざまな種類の物を見分ける画像認識のこと。","body":"特定の製品の傷を見つけるような決まった物の認識ではなく、犬、車、椅子など、いろいろな種類の物を幅広く認識します。\nImageNetのように、たくさんの種類の物を集めたデータセットで研究が進みました。","related":["W-241","W-052"],"sources":[{"title":"Alexander Kirillov ほか \"Panoptic Segmentation\" (arXiv:1801.00868)","url":"https://arxiv.org/abs/1801.00868"},{"title":"Shaoqing Ren ほか \"Faster R-CNN\" (arXiv:1506.01497)","url":"https://arxiv.org/abs/1506.01497"},{"title":"Kaiming He ほか \"Mask R-CNN\" (arXiv:1703.06870)","url":"https://arxiv.org/abs/1703.06870"}]},{"id":"W-243","term":"物体検出","category":6,"short":"画像の中の物の位置を四角い枠で囲み、それぞれの物の種類を答える画像認識の課題。","body":"1枚の画像に写っている複数の物について、それぞれの位置（バウンディングボックス）と種類を答えます。\n代表的なモデルに、R-CNNの系列（Faster R-CNNなど）や、YOLO、SSDがあります。","example":"道路の写真から、車や歩行者を四角い枠で囲んで見つけるのが物体検出です。","related":["W-259","W-261","W-262","W-245","W-182"],"sources":[{"title":"Alexander Kirillov ほか \"Panoptic Segmentation\" (arXiv:1801.00868)","url":"https://arxiv.org/abs/1801.00868"},{"title":"Shaoqing Ren ほか \"Faster R-CNN\" (arXiv:1506.01497)","url":"https://arxiv.org/abs/1506.01497"},{"title":"Kaiming He ほか \"Mask R-CNN\" (arXiv:1703.06870)","url":"https://arxiv.org/abs/1703.06870"},{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Ross Girshick \"Fast R-CNN\" (arXiv:1504.08083)","url":"https://arxiv.org/abs/1504.08083"},{"title":"Joseph Redmon ほか \"You Only Look Once: Unified, Real-Time Object Detection\" (arXiv:1506.02640)","url":"https://arxiv.org/abs/1506.02640"},{"title":"Wei Liu ほか \"SSD: Single Shot MultiBox Detector\" (arXiv:1512.02325)","url":"https://arxiv.org/abs/1512.02325"},{"title":"Tsung-Yi Lin ほか \"Feature Pyramid Networks for Object Detection\" (arXiv:1612.03144)","url":"https://arxiv.org/abs/1612.03144"}]},{"id":"W-244","term":"セマンティックセグメンテーション","category":6,"short":"画像の画素（点）の一つひとつに、「道路」「空」「人」などのクラスを割り当てる画像認識の課題。","body": urces":[{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Ross Girshick \"Fast R-CNN\" (arXiv:1504.08083)","url":"https://arxiv.org/abs/1504.08083"},{"title":"Shaoqing Ren ほか \"Faster R-CNN\" (arXiv:1506.01497)","url":"https://arxiv.org/abs/1506.01497"},{"title":"Kaiming He ほか \"Mask R-CNN\" (arXiv:1703.06870)","url":"https://arxiv.org/abs/1703.06870"}]},{"id":"W-261","term":"YOLO","aliases":["You Only Look Once"],"category":6,"short":"画像全体を1回見るだけで、物の位置と種類を同時に予測する、速い物体検出のモデル。","body":"名前は「You Only Look Once（一度見るだけ）」の頭文字です。\n領域の候補を別に出してから分類する方法と違い、1つのネットワークで一度に予測するので高速です。\n基本のモデルでも1秒に45枚の画像を処理でき、リアルタイムで検出できます。","related":["W-262","W-259","W-243","W-061"],"sources":[{"title":"Joseph Redmon ほか \"You Only Look Once: Unified, Real-Time Object Detection\" (arXiv:1506.02640)","url":"https://arxiv.org/abs/1506.02640"},{"title":"Wei Liu ほか \"SSD: Single Shot MultiBox Detector\" (arXiv:1512.02325)","url":"https://arxiv.org/abs/1512.02325"},{"title":"Tsung-Yi Lin ほか \"Feature Pyramid Networks for Object Detection\" (arXiv:1612.03144)","url":"https://arxiv.org/abs/1612.03144"}]},{"id":"W-262","term":"SSD","aliases":["Single Shot MultiBox Detector"],"category":6,"short":"YOLOと同じく、1つのネットワークで物の位置と種類を一度に予測する物体検出のモデル。","body":"特徴マップの各位置に、縦横の比や大きさの違う基準の枠を用意し、それぞれについて物の有無や種類、枠のずれを予測します。\n解像度の違う複数の特徴マップの予測を組み合わせて、いろいろな大きさの物に対応します。","related":["W-261","W-263","W-243","W-186"],"sources":[{"title":"Joseph Redmon ほか \"You Only Look Once: Unified, Real-Time Object Detection\" (arXiv:1506.02640)","url":"https://arxiv.org/abs/1506.02640"},{"title":"Wei Liu ほか \"SSD: Single Shot MultiBox Detector\" (arXiv:1512.02325)","url":"https://arxiv.org/abs/1512.02325"},{"title":"Tsung-Yi Lin ほか \"Feature Pyramid Networks for Object Detection\" (arXiv:1612.03144)","url":"https://arxiv.org/abs/1612.03144"}]},{"id":"W-263","term":"FPN","aliases":["Feature Pyramid Networks","特徴ピラミッド"],"category":6,"short":"深い層の意味の強い特徴を、浅い層へ伝えて組み合わせ、いろいろな大きさの物を見つけやすくする仕組み。","body":"CNNの深い層ほど、物の意味をよくとらえますが、細かい位置の情報は失われていきます。\nFPNは、深い層の特徴を浅い層に伝えて組み合わせ、大きさの違う物をうまく検出できるようにします。\n多くの物体検出のモデルで使われています。","related":["W-262","W-243","W-182"],"sources":[{"title":"Joseph Redmon ほか \"You Only Look Once: Unified, Real-Time Object Detection\" (arXiv:1506.02640)","url":"https://arxiv.org/abs/1506.02640"},{"title":"Wei Liu ほか \"SSD: Single Shot MultiBox Detector\" (arXiv:1512.02325)","url":"https://arxiv.org/abs/1512.02325"},{"title":"Tsung-Yi Lin ほか \"Feature Pyramid Networks for Object Detection\" (arXiv:1612.03144)","url":"https://arxiv.org/abs/1612.03144"}]},{"id":"W-264","term":"FCN（Fully Convolutional Network）","aliases":["FCN","Fully Convolutional Network"],"category":6,"short":"全結合層を使わず、畳み込み層だけで作った、画素ごとに予測するセマンティックセグメンテーションのモデル。","body":"画像分類のCNNの全結合層を、畳み込み層に置き換えました。\nどんな大きさの画像でも入力でき、それに対応する大きさの出力を画素ごとに得られます。","related":["W-244","W-265","W-266","W-179","W-183","W-241","W-182"],"sources":[{"title":"Jonathan Long ほか \"Fully Convolutional Networks for Semantic Segmentation\" (arXiv:1411.4038)","url":"https://arxiv.org/abs/1411.4038"},{"title":"Vijay Badrinarayanan ほか \"SegNet\" (arXiv:1511.00561)","url":"https://arxiv.org/abs/1511.00561"},{"title":"Olaf Ronneberger ほか \"U-Net: Convolutional Networks for Biomedical Image Segmentation\" (arXiv:1505.04597)","url":"https://arxiv.org/abs/1505.04597"},{"title":"Hengshuang Zhao ほか \"Pyramid Scene Parsing Network\" (arXiv:1612.01105)","url":"https://arxiv.org/abs/1612.01105"},{"title":"Liang-Chieh Chen ほか \"DeepLab\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}]},{"id":"W-265","term":"SegNet","category":6,"short":"エンコーダで特徴を取り出し、対応するデコーダで元の解像度に戻して、画素ごとに分類するモデル。","body":"エンコーダは、VGG16の畳み込み層と同じ構造です。\nデコーダが、小さくなった特徴マップを元の大きさに戻してから、画素ごとに分類します。","related":["W-264","W-266","W-244","W-061","W-249","W-183","W-186"],"sources":[{"title":"Jonathan Long ほか \"Fully Convolutional Networks for Semantic Segmentation\" (arXiv:14  ほか \"U-Net: Convolutional Networks for Biomedical Image Segmentation\" (arXiv:1505.04597)","url":"https://arxiv.org/abs/1505.04597"},{"title":"Hengshuang Zhao ほか \"Pyramid Scene Parsing Network\" (arXiv:1612.01105)","url":"https://arxiv.org/abs/1612.01105"},{"title":"Liang-Chieh Chen ほか \"DeepLab\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}]},{"id":"W-268","term":"DeepLab","category":6,"short":"すき間を空けた畳み込みを使い、画像を小さくせずに広い範囲の情報を集めるセグメンテーションのモデル。","body":"すき間の幅が違う畳み込みを並べて、いろいろな大きさの範囲の情報を集める仕組み（ASPP）も使います。","related":["W-190","W-189","W-244","W-267","W-184"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"},{"title":"Fisher Yu, Vladlen Koltun \"Multi-Scale Context Aggregation by Dilated Convolutions\" (arXiv:1511.07122)","url":"https://arxiv.org/abs/1511.07122"},{"title":"Liang-Chieh Chen ほか \"DeepLab: Semantic Image Segmentation with Deep Convolutional Nets, Atrous Convolution, and Fully Connected CRFs\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"},{"title":"Jonathan Long ほか \"Fully Convolutional Networks for Semantic Segmentation\" (arXiv:1411.4038)","url":"https://arxiv.org/abs/1411.4038"},{"title":"Vijay Badrinarayanan ほか \"SegNet\" (arXiv:1511.00561)","url":"https://arxiv.org/abs/1511.00561"},{"title":"Olaf Ronneberger ほか \"U-Net: Convolutional Networks for Biomedical Image Segmentation\" (arXiv:1505.04597)","url":"https://arxiv.org/abs/1505.04597"},{"title":"Hengshuang Zhao ほか \"Pyramid Scene Parsing Network\" (arXiv:1612.01105)","url":"https://arxiv.org/abs/1612.01105"},{"title":"Liang-Chieh Chen ほか \"DeepLab\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}]},{"id":"W-269","term":"OpenPose","aliases":["Open Pose","Part Affinity Fields"],"category":6,"short":"画像に写った複数の人の姿勢を、リアルタイムで推定するモデル。","body":"体の部位の位置と、部位どうしのつながりを表す情報（Part Affinity Fields）を同時に学習します。\nつながりの情報を使うことで、たくさんの部位を、どの人のものかに正しく結び付けられます。\n写っている人数に関係なく、リアルタイムで処理できます。","related":["W-247"],"sources":[{"title":"Zhe Cao ほか \"Realtime Multi-Person 2D Pose Estimation using Part Affinity Fields\" (arXiv:1611.08050)","url":"https://arxiv.org/abs/1611.08050"}]},{"id":"W-270","term":"Vision Transformer","aliases":["ViT"],"category":6,"short":"画像を小さなパッチに分け、単語の列のように並べて、Transformerで処理して分類するモデル。","body":"画像を、例えば16×16画素の小さな区画（パッチ）に分けます。\nパッチを単語のように並べた列として、畳み込みを使わないTransformerで処理します。\n大量のデータで事前学習すると、優れたCNNに匹敵する、またはそれを上回る精度を示しました。","related":["W-218","W-182","W-225","W-061","W-184"],"sources":[{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}]},{"id":"W-271","term":"自然言語処理","aliases":["NLP"],"category":6,"short":"人が日常で使う言葉（自然言語）を、コンピュータで扱う技術。","body":"翻訳、要約、質問への回答、文章の分類など、いろいろな課題があります。\nかつては人が書いた規則を使う方法が中心でしたが、統計的な方法を経て、今はディープラーニングを使う方法が主流です。","related":["W-048","W-287","W-290","W-285","W-061"],"sources":[{"title":"\"Deep Learning and Machine Learning - Natural Language Processing: From Theory to Application\" (arXiv:2411.05026) 1.1","url":"https://arxiv.org/abs/2411.05026"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-272","term":"ワンホットベクトル","aliases":["one-hotベクトル"],"category":6,"short":"語彙の数だけの長さを持ち、その単語に対応する位置だけが1、ほかはすべて0の数値の並び。","body":"単語を数値で表す、最も単純な方法です。\nただし、単語どうしの意味の近さは表せません。「犬」と「猫」も「犬」と「机」も、同じくらい離れたものとして扱われます。","example":"語彙が「犬・猫・鳥」の3語なら、「猫」は（0, 1, 0）と表します。","related":["W-276","W-273"],"sources":[{"title":"scikit-learn User Guide 8.2.3 Text feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-273","term":"BoW（Bag-of-Words）","aliases":["BoW","Bag-of-Words"],"category":6,"short":"文書を、その中に出てくる単語の回数だけで表す方法。語順は考えない。","body":"文書を単語に分け、それぞれの単語が何回出てきたかを数えて表します。\n単語を袋（バッグ）に入れて混ぜたように、並び順の情報は使いません。","example":"「犬が猫を追う」と「猫が犬を追う」は、同じ単語が同じ回数出てくるので、BoWでは同じ表し方になります。","related":["W-274","W-275","W-272"],"sources":[{"title":"scikit-learn User Guide 8.2.3 Text feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-274","term":"n-gram","aliases":["Nグラム"],"category":6,"short":"文の中で連続するn個の単語（または文字）の組のこと。","body":"2個の組をバイグラム、3個の組をトライグラムといいます。\nBoWで、単語1つずつではなくn-gramを数えるようにすると、近くの語順の情報を少し取り込めます。","example":"「私は 犬が 好き」の2-gram（2単語の組）は、「私は 犬が」「犬が 好き」です。","related":["W-273"],"sources":[{"title":"scikit-learn User Guide 8.2.3 Text feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-275","term":"TF-IDF","category":6,"short":"ある単語が、その文書の中でどれくらい大事かを表す重み。多くの文書に出てくる単語の重みは小さくする。","body":"TFは、その文書の中での単語の出てくる回数です。\nIDFは、その単語がどれくらい少ない文書にしか出てこないかを表し、多くの文書に出てくる単語ほど小さくなります。\nこの2つを掛け合わせることで、「どの文書にも出てくる言葉」の重みを下げ、その文書らしい言葉の重みを上げます。","example":"「は」「です」のようにどの文書にも出てくる言葉は重みが小さく、ある文書にだけ何度も出てくる専門用語は重みが大きくなります。","related":["W-273","W-292","W-180"],"sources":[{"title":"scikit-learn User Guide 8.2.3 Text feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-276","term":"分散表現","aliases":["単語ベクトル"],"category":6,"short":"単語を、意味の近い単語どうしが近くなるような、数百程度の数値の並び（ベクトル）で表したもの。","body":"ワンホットベクトルと違い、単語どうしの意味の近さを表せます。\n「同じような文脈に出てくる単語は、意味も似ている」という考え方で、大量の文章から学習します。\n代表的な学習方法に、word2vecがあります。","related":["W-277","W-278","W-272"],"sources":[{"title":"Tomas Mikolov ほか \"Efficient Estimation of Word Representations in Vector Space\" (arXiv:1301.3781)","url":"https://arxiv.org/abs/1301.3781"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"},{"title":"scikit-learn User Guide 8.2.3 Text feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html"}]},{"id":"W-277","term":"単語埋め込み","aliases":["Word Embedding"],"category":6,"short":"単語を、意味をとらえた数値の並び（ベクトル）に変換すること。また、その変換した結果。","body":"単語を、ある空間の中の1つの点として「埋め込む」ことから、こう呼ばれます。\n分散表現とほぼ同じ意味で使われます。","related":["W-276","W-278","W-281","W-282"],"sources":[{"title":"Tomas Mikolov ほか \"Efficient Estimation of Word Representations in Vector Space\" (arXiv:1301.3781)","url":"https://arxiv.org/abs/1301.3781"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-278","term":"word2vec","category":6,"short":"大量の文章から、単語の分散表現（意味をとらえた数値の並び）を効率よく学習する方法。","body":"ミコロフらが提案しました。\n周りの単語から真ん中の単語を当てるCBOWと、真ん中の単語から周りの単語を当てるスキップグラムの2つのやり方があります。\n16億語のデータからでも、1日以内で質の高い単語のベクトルを学習できました。","related":["W-279","W-280","W-276","W-281"],"sources":[{"title":"Tomas Mikolov ほか \"Efficient Estimation of Word Representations in Vector Space\" (arXiv:1301.3781)","url":"https://arxiv.org/abs/1301.3781"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-279","term":"CBOW","aliases":["Continuous Bag-of-Words"],"category":6,"short":"word2vecのやり方の一つ。周りの単語から、真ん中の単語を当てるように学習する。","body":"周りの単語のベクトルを平均して使うので、周りの単語の並び順は影響しません。","example":"「私は ［ ？ ］ が 好き」の周りの単語から、［ ？ ］に入る単語を当てるように学習します。","related":["W-280","W-278"],"sources":[{"title":"Tomas Mikolov ほか \"Efficient Estimation of Word Representations in Vector Space\" (arXiv:1301.3781)","url":"https://arxiv.org/abs/1301.3781"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-280","term":"スキップグラム","aliases":["Skip-gram"],"category":6,"short":"word2vecのやり方の一つ。真ん中の単語から、その前後にある単語を当てるように学習する。","body":"CBOWとは、予測する向きが逆になっています。\nfastTextも、スキップグラムをもとにしています。","example":"「犬」という単語から、その前後に出てきやすい「散歩」「飼う」などの単語を当てるように学習します。","related":["W-279","W-278","W-281"],"sources":[{"title":"Tomas Mikolov ほか \"Efficient Estimation of Word Representations in Vector Space\" (arXiv:1301.3781)","url":"https://arxiv.org/abs/1301.3781"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-281","term":"fastText","category":6,"short":"単語を文字のn-gramの集まりとして表し、学習データにない単語や珍しい単語にもベクトルを作れるようにした方法。","body":"スキップグラムをもとにしています。\n単語のベクトルを、その単語に含まれる文字の組（n-gram）のベクトルの合計で表します。\nそのため、語形が変化した単語や、あまり出てこない単語にも対応しやすくなりました。","related":["W-278","W-280","W-274"],"sources":[{"title":"Piotr Bojanowski ほか \"Enriching Word Vectors with Subword Information\" (arXiv:1607.04606)","url":"https://arxiv.org/abs/1607.04606"},{"title":"Matthew E. Peters ほか \"Deep contextualized word representations\" (arXiv:1802.05365)","url":"https://arxiv.org/abs/1802.05365"}]},{"id":"W-282","term":"ELMo","aliases":["エルモ"],"category":6,"short":"文脈によって変わる単語の表現を、双方向の言語モデルから作る方法。同じ単語でも文脈で違うベクトルになる。","body":"前から後ろ、後ろから前の両方向の言語モデルを、大量の文章であらかじめ学習させます。\nその内部の状態から単語の表現を作るので、同じ単語でも文脈によって違う表現になります。\nそのため、いくつもの意味を持つ単語（多義語）の違いも表せます。","example":"「電話をかける」と「眼鏡をかける」の「かける」のように、同じ言葉でも文脈によって意味が違う場合を、区別して表せます。","related":["W-283","W-211","W-276"],"sources":[{"title":"Piotr Bojanowski ほか \"Enriching Word Vectors with Subword Information\" (arXiv:1607.04606)","url":"https://arxiv.org/abs/1607.04606"},{"title":"Matthew E. Peters ほか \"Deep contextualized word representations\" (arXiv:1802.05365)","url":"https://arxiv.org/abs/1802.05365"}]},{"id":"W-283","term":"BERT","aliases":["バート"],"category":6,"short":"Transformerを使い、文の前後の文脈を同時に考えて事前学習した言語モデル。いろいろな課題に合わせて調整して使う。","body":"グーグルが2018年に発表しました。\nラベルのない大量の文章を使って、文の左右両方の文脈を同時に考える表現を事前学習します。\n出力層を1つ加えて調整（ファインチューニング）するだけで、質問応答など多くの課題で当時の最高の性能を出しました。","related":["W-218","W-342","W-284","W-343","W-282","W-225","W-130","W-291"],"sources":[{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Alex Wang ほか \"GLUE: A Multi-Task Benchmark and Analysis Platform for Natural Language Understanding\" (arXiv:1804.07461)","url":"https://arxiv.org/abs/1804.07461"}]},{"id":"W-284","term":"GLUE","aliases":["General Language Understanding Evaluation"],"category":6,"short":"言葉を理解する力を、いくつもの課題でまとめて評価するためのベンチマーク（性能を比べる物差し）。","body":"文の分類や、文どうしの関係の推論など、いろいろな課題をまとめて、モデルがどれだけ幅広く言葉を扱えるかを評価します。\nBERTなどの事前学習済みモデルの性能を比べるのによく使われました。","related":["W-283","W-061","W-343"],"sources":[{"title":"Alex Wang ほか \"GLUE: A Multi-Task Benchmark and Analysis Platform for Natural Language Understanding\" (arXiv:1804.07461)","url":"https://arxiv.org/abs/1804.07461"}]},{"id":"W-285","term":"大規模言語モデル（LLM）","aliases":["大規模言語モデル","LLM","Large Language Model"],"category":6,"short":"大量の文章で事前学習した、とても多くのパラメータを持つ言語モデル。","body":"Transformerをもとに、非常に大きな規模で学習させたモデルです。\n規模を大きくすることで、少しの例を示すだけで（few-shot）、いろいろな課題をこなせるようになりました。\n1750億のパラメータを持つGPT-3（2020年）や、5400億のパラメータを持つPaLM（2022年）などがあります。","example":"チャット形式で質問に答えたり、文章の要約や翻訳をしたりするAIサービスの中心になっています。","related":["W-218","W-286","W-344","W-330","W-055","W-358","W-225","W-123"],"sources":[{"title":"Wayne Xin Zhao ほか \"A Survey of Large Language Models\" (arXiv:2303.18223)","url":"https://arxiv.org/abs/2303.18223"},{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Aakanksha Chowdhery ほか \"PaLM: Scaling Language Modeling with Pathways\" (arXiv:2204.02311)","url":"https://arxiv.org/abs/2204.02311"}]},{"id":"W-286","term":"PaLM","aliases":["パーム"],"category":6,"short":"グーグルが2022年に開発した、5400億のパラメータを持つ大規模言語モデル。","body":"TPU v4を6144個使って学習させました。\n規模を大きくすることで、少しの例を示すだけで課題をこなす性能（few-shot）が高まることを示しました。","related":["W-285","W-133","W-123","W-344"],"sources":[{"title":"Wayne Xin Zhao ほか \"A Survey of Large Language Models\" (arXiv:2303.18223)","url":"https://arxiv.org/abs/2303.18223"},{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Aakanksha Chowdhery ほか \"PaLM: Scaling Language Modeling with Pathways\" (arXiv:2204.02311)","url":"https://arxiv.org/abs/2204.02311"}]},{"id":"W-287","term":"形態素解析","category":6,"short":"文を、意味を持つ最小の単位（形態素）に分けて、それぞれの品詞などを調べる処理。","body":"日本語のように、単語の間に空白がない言語では、最初に行う大事な処理です。","example":"「私は犬が好きだ」を「私／は／犬／が／好き／だ」のように分け、「私」は名詞、「は」は助詞、のように調べます。","related":["W-288","W-271"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-288","term":"構文解析","category":6,"short":"文の中の単語どうしの、文法的な関係（どの言葉がどの言葉にかかるか）を調べる処理。","body":"形態素解析で分けた単語どうしが、どのように結び付いているか（係り受け）を調べます。","example":"「赤い 花の 絵」で、「赤い」が「花」にかかるのか「絵」にかかるのかを調べます。","related":["W-287","W-271"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-289","term":"感情分析","aliases":["センチメント分析","感情認識"],"category":6,"short":"文章や声に表れた意見や感情が、肯定的か否定的か、どんな感情かなどを判定する課題。","body":"文章では、商品のレビューやSNSの投稿が、良い意見か悪い意見かを判定するのに使われます。\n音声処理でも、声から話している人の感情を推定する課題を指します。","example":"「この商品は最高です」は肯定的、「二度と買いません」は否定的と判定します。","related":["W-271","W-305"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"},{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-290","term":"機械翻訳","category":6,"short":"ある言語の文を、コンピュータで別の言語の文に自動で変換すること。","body":"人が書いた規則を使うルールベース機械翻訳、統計を使う統計的機械翻訳を経て、今はニューラルネットワークを使う方式が主流です。\nSeq2SeqやAttention、Transformerは、機械翻訳の研究の中で発展してきました。","related":["W-017","W-015","W-213","W-218","W-122","W-214"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"},{"title":"情報通信研究機構研究報告 Vol.68 No.2（2022）「2-1 多言語コミュニケーション技術の概要」p.4","url":"https://www.nict.go.jp/publication/shuppan/kihou-journal/houkoku68-2_HTML/2022U-02-01.pdf"},{"title":"Felix Stahlberg \"Neural Machine Translation: A Review and Survey\" (arXiv:1912.02047)","url":"https://arxiv.org/abs/1912.02047"}]},{"id":"W-291","term":"質問応答","category":6,"short":"質問に対して、答えを返す自然言語処理の課題。","body":"文章を読んで、その内容についての質問に答える課題などがあります。\nIBMのワトソンや、BERTなどのモデルで大きく進歩しました。","related":["W-039","W-040","W-283","W-271"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-292","term":"情報検索","category":6,"short":"大量の文書の中から、求める情報を含む文書を探し出す課題。","body":"検索エンジンは、その代表的な例です。\n単語の重要度を表すTF-IDFなども、文書を探すのに使われてきました。","related":["W-275","W-271"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}]},{"id":"W-293","term":"文書要約","category":6,"short":"長い文章の要点を、短くまとめる自然言語処理の課題。","body":"Seq2Seqのような、系列を別の系列に変換するモデルが使われます。","related":["W-271","W-213"],"sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"},{"title":"Ilya Sutskever ほか \"Sequence to Sequence Learning with Neural Networks\" (arXiv:1409.3215)","url":"https://arxiv.org/abs/1409.3215"},{"title":"Dzmitry Bahdanau ほか \"Neural Machine Translation by Jointly Learning to Align and Translate\" (arXiv:1409.0473)","url":"https://arxiv.org/abs/1409.0473"}]},{"id":"W-294","term":"CEC","aliases":["Constant Error Carousel","定誤差カルーセル"],"category":6,"short":"LSTMの記憶セルの中にある、重み1で自分自身につながる経路。誤差を時間を越えて弱めずに伝える。","body":"隣り合う時刻を一定の重みでつなぐので、誤差が時間をさかのぼって伝わるときにも、小さくなりすぎたり大きくなりすぎたりしません。\nこれにより、ふつうのRNNで起きやすい勾配消失問題を和らげ、長い系列の関係を学べるようにしています。\nLSTMの中心となる仕組みです。後に、内容を忘れられるようにする忘却ゲートが加えられました。","related":["W-209","W-139","W-180","W-204"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-295","term":"A-D変換","aliases":["アナログ-デジタル変換","AD変換"],"category":6,"short":"連続的に変わる音の波（アナログの信号）を、コンピュータで扱える数値の列（デジタル）に変換すること。","body":"まず、音の大きさを一定の時間の間隔で測ります（標本化、サンプリング）。\n次に、測った値を決まった段階の数値に丸めます（量子化）。\n測る間隔が短いほど、元の音を細かく記録できます。","example":"1秒間に何万回も音の大きさを測り、それぞれを数値にして並べます。","related":["W-296","W-305"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-296","term":"パルス符号変調器（PCM）","aliases":["パルス符号変調","PCM"],"category":6,"short":"標本化と量子化をした音の値を、そのまま数値の列として記録する方式。","body":"A-D変換で得た数値を、そのまま並べて記録します。\n音をデジタルで記録する、基本的な方式です。","related":["W-295"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-297","term":"高速フーリエ変換（FFT）","aliases":["高速フーリエ変換","FFT","フーリエ変換"],"category":6,"short":"音などの波を、どの高さ（周波数）の成分がどれくらい含まれているかに分解する計算を、速く行う方法。","body":"音の波を周波数ごとの成分に分けたものを、スペクトルといいます。\nフーリエ変換は、波をスペクトルに変換する計算で、それを速く計算する方法が高速フーリエ変換です。","example":"和音を、ド・ミ・ソのそれぞれの音にどれくらいの強さで分けられるかを調べるようなものです。","related":["W-298","W-302"],"sources":[{"title":"Ryan Cotterell, Jason Eisner \"A Deep Generative Model of Vowel Formant Typology\" (arXiv:1807.02745)","url":"https://arxiv.org/abs/1807.02745"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"NumPy Documentation \"Discrete Fourier Transform (numpy.fft)\"","url":"https://numpy.org/doc/stable/reference/routines.fft.html"}]},{"id":"W-298","term":"スペクトル包絡","category":6,"short":"音の周波数ごとの強さ（スペクトル）の細かい凹凸をならした、大まかな形。声の響き方の特徴を表す。","body":"声は、声帯で作られた音が、のど・口・鼻などを通るときに響いて作られます。\nスペクトル包絡は、この響き方の特徴を表しています。\nスペクトル包絡に現れる山を、フォルマントといいます。","related":["W-299","W-297","W-302"],"sources":[{"title":"Ryan Cotterell, Jason Eisner \"A Deep Generative Model of Vowel Formant Typology\" (arXiv:1807.02745)","url":"https://arxiv.org/abs/1807.02745"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"NumPy Documentation \"Discrete Fourier Transform (numpy.fft)\"","url":"https://numpy.org/doc/stable/reference/routines.fft.html"}]},{"id":"W-299","term":"フォルマント","category":6,"short":"声を出すときに、のどや口の中の響き（共鳴）によって、スペクトル包絡に現れる山。","body":"周波数の低いほうから、第1フォルマント、第2フォルマントと呼びます。\nフォルマントの位置の組み合わせが、「あ」「い」などの母音の違いを特徴づけます。\n口の開き方や舌の位置で変わり、話す人によっても違います。","related":["W-300","W-298"],"sources":[{"title":"Ryan Cotterell, Jason Eisner \"A Deep Generative Model of Vowel Formant Typology\" (arXiv:1807.02745)","url":"https://arxiv.org/abs/1807.02745"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"NumPy Documentation \"Discrete Fourier Transform (numpy.fft)\"","url":"https://numpy.org/doc/stable/reference/routines.fft.html"}]},{"id":"W-300","term":"フォルマント周波数","category":6,"short":"フォルマント（スペクトル包絡の山）が現れる周波数。その組み合わせが母音の違いを表す。","body":"第1フォルマントと第2フォルマントの周波数の組み合わせで、どの母音かをおおよそ見分けられます。","related":["W-299","W-298"],"sources":[{"title":"Ryan Cotterell, Jason Eisner \"A Deep Generative Model of Vowel Formant Typology\" (arXiv:1807.02745)","url":"https://arxiv.org/abs/1807.02745"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"NumPy Documentation \"Discrete Fourier Transform (numpy.fft)\"","url":"https://numpy.org/doc/stable/reference/routines.fft.html"}]},{"id":"W-301","term":"メル尺度","category":6,"short":"人の耳の、音の高さの感じ方をまねた尺度。低い音は細かく、高い音は粗く区切る。","body":"人の耳は、低い音の違いには敏感で、高い音の違いには比較的鈍感です。\nメル尺度は、この感じ方に合わせて周波数を区切り直したものです。\n音声の特徴量であるMFCCを計算するのに使われます。","related":["W-302","W-059"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-302","term":"メル周波数ケプストラム係数（MFCC）","aliases":["メル周波数ケプストラム係数","MFCC"],"category":6,"short":"メル尺度を使って計算する、音声の特徴を少ない数でまとめた値。音声認識や話者識別で使われてきた。","body":"短い時間ごとの音の周波数の特徴（スペクトル包絡の形）を、少ない数の値でうまく表せます。\n音声認識や話者識別などで、音声の特徴量として広く使われてきました。","related":["W-301","W-298","W-305","W-310","W-059"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-303","term":"音韻","category":6,"short":"ある言葉の中で、意味の区別に使われる音のまとまりや、その仕組み。","body":"言語学では、言葉の音の仕組みを研究する分野を、音韻論といいます。\n音韻論では、意味に影響する音の単位を「音素」と呼びます。\n日本語では、音の高さ（アクセント）が意味の区別に使われることもあります。","example":"「雨」と「飴」は、使う音は同じでも、音の高さの違いで意味を区別します。","related":["W-304","W-305"],"sources":[{"title":"国立国語研究所 ことば研究館「研究室から『失われた意味を求めて』」","url":"https://kotoba.ninjal.ac.jp/mado/10/10-02/"}]},{"id":"W-304","term":"音素","category":6,"short":"言葉の意味を区別する、音の最小の単位。","body":"音素を1つ入れ替えると、別の意味の言葉になります。\n音声認識では、音声を、音素や文字の並びに変換します。","example":"「傘（kasa）」と「肩（kata）」は、sとtが違うだけで意味が変わるので、sとtはどちらも音素です。","related":["W-303","W-305","W-306"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"国立国語研究所 ことば研究館「研究室から『失われた意味を求めて』」","url":"https://kotoba.ninjal.ac.jp/mado/10/10-02/"}]},{"id":"W-305","term":"音声認識","category":6,"short":"人が話した声を、コンピュータで文字に変換すること。","body":"音声の特徴量を、音素や文字の並びに変換します。\n長い間、隠れマルコフモデルが中心的な方法でしたが、今はディープラーニングを使う方法が主流です。\n音声と文字の長さが違っても学習できるCTCなどの方法が使われます。","example":"スマートフォンに話しかけて、文字を入力する機能が音声認識です。","related":["W-306","W-307","W-304","W-302","W-308","W-059"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"}]},{"id":"W-306","term":"隠れマルコフモデル","aliases":["HMM","Hidden Markov Model"],"category":6,"short":"直接は見えない「隠れた状態」の移り変わりと、そこから出てくる観測を組み合わせて、系列を確率で表すモデル。","body":"音声認識では、音素などを隠れた状態、音声の特徴量を観測として考えます。\n長い間、音声認識の中心的な方法として使われてきました。","related":["W-305","W-307","W-048","W-304","W-059"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-307","term":"CTC","aliases":["Connectionist Temporal Classification"],"category":6,"short":"入力（音声）と出力（文字）の長さが違っても、その対応のさせ方を学習できる方法。","body":"出力の文字の間を表す「空白」の記号を使い、考えられるすべての対応のさせ方の確率を足し合わせて学習します。\n事前に、音声のどこがどの文字にあたるかを合わせておかなくても学習できます。","example":"1秒間に100コマある音声から、「こんにちは」の5文字を出すように、長さの違う系列を対応させます。","related":["W-305","W-306"],"sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-308","term":"音声合成","aliases":["テキスト音声合成","TTS"],"category":6,"short":"文字から、人が話しているような声を、コンピュータで作り出すこと。","body":"ディープラーニングを使ったWaveNetなどで、人が聞いてとても自然な声を作れるようになりました。","example":"カーナビの案内の声や、文章を読み上げる機能に使われています。","related":["W-309","W-305","W-340"],"sources":[{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-309","term":"WaveNet","aliases":["ウェーブネット"],"category":6,"short":"ディープマインドが2016年に発表した、音の波を1点ずつ予測して作り出すモデル。自然な音声合成を実現した。","body":"波形の各点を、それより前のすべての点をもとに予測して作ります（自己回帰型）。\n文字から音声を作る音声合成に使うと、従来の方法より、人が聞いてはるかに自然な声になりました。\n音楽を作ることもできます。","related":["W-308","W-340"],"sources":[{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-310","term":"話者識別","aliases":["話者認識"],"category":6,"short":"声から、話している人が誰かを判定する音声処理の課題。","body":"声の特徴は人によって違うので、それを手がかりに話している人を見分けます。","example":"声で本人かどうかを確かめる、声による認証に使われます。","related":["W-305","W-302"],"sources":[{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-311","term":"深層強化学習","category":6,"short":"ディープラーニングと強化学習を組み合わせた方法。画面の画像のような複雑な入力から、直接よい行動を学べる。","body":"強化学習で使う価値関数や方策を、ディープラーニングのニューラルネットワークで表します。\nゲームの画面の画素のような、たくさんの数値からなる入力をそのまま使って学習できます。\nDQNやアルファ碁が代表例です。","related":["W-312","W-058","W-054","W-122"],"sources":[{"title":"Volodymyr Mnih ほか \"Playing Atari with Deep Reinforcement Learning\" (arXiv:1312.5602)","url":"https://arxiv.org/abs/1312.5602"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"}]},{"id":"W-312","term":"DQN","aliases":["Deep Q-Network"],"category":6,"short":"Q学習とCNNを組み合わせ、ゲームの画面をそのまま入力として、よい行動を学んだ深層強化学習の方法。","body":"ディープマインドが提案しました。\nCNNで行動価値関数（Q値）を表し、Atari 2600のゲーム画面の画素をそのまま入力にして学習しました。\nゲームごとに調整しなくても多くのゲームで従来の方法を上回り、一部では人間の熟練者も上回りました。","related":["W-098","W-313","W-314","W-316","W-311","W-182","W-097"],"sources":[{"title":"Volodymyr Mnih ほか \"Playing Atari with Deep Reinforcement Learning\" (arXiv:1312.5602)","url":"https://arxiv.org/abs/1312.5602"}]},{"id":"W-313","term":"ダブルDQN","aliases":["Double DQN"],"category":6,"short":"行動を選ぶネットワークと、その価値を評価するネットワークを分けて、DQNが行動の価値を高く見積もりすぎるのを抑えた方法。","body":"Q学習には、条件によって行動の価値を実際より高く見積もってしまう性質があり、DQNでもそれが性能を下げていました。\nダブルDQNは、選ぶ役と評価する役を分けることで、この見積もりすぎを抑えました。","related":["W-312","W-314","W-316","W-098"],"sources":[{"title":"Hado van Hasselt ほか \"Deep Reinforcement Learning with Double Q-learning\" (arXiv:1509.06461)","url":"https://arxiv.org/abs/1509.06461"},{"title":"Ziyu Wang ほか \"Dueling Network Architectures for Deep Reinforcement Learning\" (arXiv:1511.06581)","url":"https://arxiv.org/abs/1511.06581"},{"title":"Meire Fortunato ほか \"Noisy Networks for Exploration\" (arXiv:1706.10295)","url":"https://arxiv.org/abs/1706.10295"},{"title":"Matteo Hessel ほか \"Rainbow: Combining Improvements in Deep Reinforcement Learning\" (arXiv:1710.02298)","url":"https://arxiv.org/abs/1710.02298"}]},{"id":"W-314","term":"デュエリングネットワーク","aliases":["Dueling Network"],"category":6,"short":"「その状態自体のよさ」と「その状態での各行動の有利さ」を分けて推定する、DQNの改良版。","body":"ネットワークの出力を、状態の価値（状態価値関数）と、各行動の相対的な有利さ（アドバンテージ）の2つに分けます。\nその2つを組み合わせて、行動の価値を求めます。","related":["W-312","W-313","W-096"],"sources":[{"title":"Hado van Hasselt ほか \"Deep Reinforcement Learning with Double Q-learning\" (arXiv:1509.06461)","url":"https://arxiv.org/abs/1509.06461"},{"title":"Ziyu Wang ほか \"Dueling Network Architectures for Deep Reinforcement Learning\" (arXiv:1511.06581)","url":"https://arxiv.org/abs/1511.06581"},{"title":"Meire Fortunato ほか \"Noisy Networks for Exploration\" (arXiv:1706.10295)","url":"https://arxiv.org/abs/1706.10295"},{"title":"Matteo Hessel ほか \"Rainbow: Combining Improvements in Deep Reinforcement Learning\" (arXiv:1710.02298)","url":"https://arxiv.org/abs/1710.02298"}]},{"id":"W-315","term":"ノイジーネットワーク","aliases":["Noisy Network"],"category":6,"short":"ネットワークの重みに学習できるノイズ（揺らぎ）を加え、それを新しい行動を試す探索に使う方法。","body":"ε-greedy方策のような、ランダムに行動を試す工夫の代わりに使えます。","related":["W-312","W-104","W-316","W-180"],"sources":[{"title":"Hado van Hasselt ほか \"Deep Reinforcement Learning with Double Q-learning\" (arXiv:1509.06461)","url":"https://arxiv.org/abs/1509.06461"},{"title":"Ziyu Wang ほか \"Dueling Network Architectures for Deep Reinforcement Learning\" (arXiv:1511.06581)","url":"https://arxiv.org/abs/1511.06581"},{"title":"Meire Fortunato ほか \"Noisy Networks for Exploration\" (arXiv:1706.10295)","url":"https://arxiv.org/abs/1706.10295"},{"title":"Matteo Hessel ほか \"Rainbow: Combining Improvements in Deep Reinforcement Learning\" (arXiv:1710.02298)","url":"https://arxiv.org/abs/1710.02298"}]},{"id":"W-316","term":"Rainbow","aliases":["レインボー"],"category":6,"short":"DQNに対する6つの改良を組み合わせて、高い性能を示した方法。","body":"ダブルDQN、デュエリングネットワーク、ノイジーネットワークなどの改良をまとめて使いました。\nAtariのゲームで高い性能を示しました。","related":["W-312","W-313","W-314","W-315"],"sources":[{"title":"Hado van Hasselt ほか \"Deep Reinforcement Learning with Double Q-learning\" (arXiv:1509.06461)","url":"https://arxiv.org/abs/1509.06461"},{"title":"Ziyu Wang ほか \"Dueling Network Architectures for Deep Reinforcement Learning\" (arXiv:1511.06581)","url":"https://arxiv.org/abs/1511.06581"},{"title":"Meire Fortunato ほか \"Noisy Networks for Exploration\" (arXiv:1706.10295)","url":"https://arxiv.org/abs/1706.10295"},{"title":"Matteo Hessel ほか \"Rainbow: Combining Improvements in Deep Reinforcement Learning\" (arXiv:1710.02298)","url":"https://arxiv.org/abs/1710.02298"}]},{"id":"W-317","term":"A3C","aliases":["Asynchronous Advantage Actor-Critic"],"category":6,"short":"複数のエージェントが、それぞれ環境とやり取りしながら、同時に（非同期に）学習する深層強化学習の方法。","body":"Actor-Criticを、複数のエージェントで並行して学習させる方法です。\n並行して学ぶことで学習が安定し、GPUを使う従来の方法より短い時間で、CPUだけでも高い性能を示しました。","related":["W-102","W-318","W-005","W-311","W-132","W-131"],"sources":[{"title":"Volodymyr Mnih ほか \"Asynchronous Methods for Deep Reinforcement Learning\" (arXiv:1602.01783)","url":"https://arxiv.org/abs/1602.01783"},{"title":"Dan Horgan ほか \"Distributed Prioritized Experience Replay\" (arXiv:1803.00933)","url":"https://arxiv.org/abs/1803.00933"}]},{"id":"W-318","term":"Ape-X","category":6,"short":"多数のエージェントが集めた経験を共有のメモリにため、重要な経験を優先して学習する、分散型の深層強化学習の方法。","body":"行動する役（actor）と、学習する役（learner）を分けます。\n多数のactorが、それぞれの環境で行動して経験をためます。\nlearnerは、重要な経験を優先的に取り出して学習します（優先度付き経験再生）。","related":["W-317","W-312","W-005","W-311"],"sources":[{"title":"Volodymyr Mnih ほか \"Asynchronous Methods for Deep Reinforcement Learning\" (arXiv:1602.01783)","url":"https://arxiv.org/abs/1602.01783"},{"title":"Dan Horgan ほか \"Distributed Prioritized Experience Replay\" (arXiv:1803.00933)","url":"https://arxiv.org/abs/1803.00933"}]},{"id":"W-319","term":"Agent57","category":6,"short":"ディープマインドが開発した、Atariの57のゲームすべてで、人間の基準の成績を初めて上回ったエージェント。","body":"Atariの57のゲームは、強化学習の性能を比べる標準的なベンチマークです。\nその全ゲームで人間の基準を超えたのは、Agent57が初めてでした。","related":["W-312","W-320","W-321","W-005","W-058"],"sources":[{"title":"Adrià Puigdomènech Badia ほか \"Agent57: Outperforming the Atari Human Benchmark\" (arXiv:2003.13350)","url":"https://arxiv.org/abs/2003.13350"},{"title":"OpenAI \"Dota 2 with Large Scale Deep Reinforcement Learning\" (arXiv:1912.06680)","url":"https://arxiv.org/abs/1912.06680"},{"title":"Kaiqing Zhang ほか \"Multi-Agent Reinforcement Learning: A Selective Overview of Theories and Algorithms\" (arXiv:1911.10635)","url":"https://arxiv.org/abs/1911.10635"}]},{"id":"W-320","term":"OpenAI Five","category":6,"short":"OpenAIが開発した、対戦型ゲーム「Dota 2」のAI。2019年に世界王者のチームに勝った。","body":"Dota 2は、5人ずつのチームで戦うeスポーツのゲームです。\n長い時間にわたる判断、相手の情報がすべては見えない状況、複雑な操作が必要で、大規模な分散学習で実現しました。","related":["W-319","W-321","W-331"],"sources":[{"title":"Adrià Puigdomènech Badia ほか \"Agent57: Outperforming the Atari Human Benchmark\" (arXiv:2003.13350)","url":"https://arxiv.org/abs/2003.13350"},{"title":"OpenAI \"Dota 2 with Large Scale Deep Reinforcement Learning\" (arXiv:1912.06680)","url":"https://arxiv.org/abs/1912.06680"},{"title":"Kaiqing Zhang ほか \"Multi-Agent Reinforcement Learning: A Selective Overview of Theories and Algorithms\" (arXiv:1911.10635)","url":"https://arxiv.org/abs/1911.10635"}]},{"id":"W-321","term":"アルファスター（AlphaStar）","aliases":["AlphaStar","アルファスター"],"category":6,"short":"ディープマインドが開発した、リアルタイムの戦略ゲーム「StarCraft II」のAI。","body":"StarCraft IIは、各プレイヤーが限られた情報しか見えない中で、リアルタイムに判断する必要があるゲームです。\n複数のエージェントが関わる強化学習（マルチエージェント強化学習）の研究の舞台にもなっています。","related":["W-320","W-319","W-331","W-005","W-058"],"sources":[{"title":"Adrià Puigdomènech Badia ほか \"Agent57: Outperforming the Atari Human Benchmark\" (arXiv:2003.13350)","url":"https://arxiv.org/abs/2003.13350"},{"title":"OpenAI \"Dota 2 with Large Scale Deep Reinforcement Learning\" (arXiv:1912.06680)","url":"https://arxiv.org/abs/1912.06680"},{"title":"Kaiqing Zhang ほか \"Multi-Agent Reinforcement Learning: A Selective Overview of Theories and Algorithms\" (arXiv:1911.10635)","url":"https://arxiv.org/abs/1911.10635"}]},{"id":"W-322","term":"PPO","aliases":["Proximal Policy Optimization"],"category":6,"short":"方策が一度に大きく変わりすぎないようにして、同じデータで何度も学習できるようにした方策勾配法。","body":"2017年にOpenAIのシュルマンらが提案しました。\nふつうの方策勾配法は、データ1つにつき1回しか更新できませんが、PPOは同じデータで複数回の更新ができます。\n実装がシンプルで性能もよいため、広く使われています。大規模言語モデルを人の評価で調整するRLHFでも使われています。","related":["W-100","W-330","W-285"],"sources":[{"title":"John Schulman ほか \"Proximal Policy Optimization Algorithms\" (arXiv:1707.06347)","url":"https://arxiv.org/abs/1707.06347"},{"title":"Long Ouyang ほか \"Training language models to follow instructions with human feedback\" (arXiv:2203.02155)","url":"https://arxiv.org/abs/2203.02155"}]},{"id":"W-323","term":"連続値制御","category":6,"short":"ロボットの関節の角度のように、行動が連続した値をとる問題を制御すること。","body":"DQNは、行動の選択肢が決まっている問題向けなので、行動が連続した値をとる問題にはそのままでは使えません。\nDDPGは、DQNの考え方を連続した値の行動に広げた方法で、振り子の振り上げや物のつかみ上げなど、20以上の課題を解きました。","related":["W-312","W-102","W-324"],"sources":[{"title":"Timothy P. Lillicrap ほか \"Continuous control with deep reinforcement learning\" (arXiv:1509.02971)","url":"https://arxiv.org/abs/1509.02971"},{"title":"Volodymyr Mnih ほか \"Playing Atari with Deep Reinforcement Learning\" (arXiv:1312.5602)","url":"https://arxiv.org/abs/1312.5602"}]},{"id":"W-324","term":"sim2real","aliases":["シムツーリアル"],"category":6,"short":"シミュレータの中で学習したモデルを、現実のロボットなどに移して使うこと。","body":"現実のロボットで強化学習をすると、時間や費用がかかり、壊れる危険もあります。\nそこで、シミュレータの中で学習してから、現実に移します。\nただし、シミュレータと現実には見た目や物理の差があり、そのままではうまく動かないことがあります。","related":["W-325","W-323","W-058"],"sources":[{"title":"Josh Tobin ほか \"Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World\" (arXiv:1703.06907)","url":"https://arxiv.org/abs/1703.06907"}]},{"id":"W-325","term":"ドメインランダマイゼーション","category":6,"short":"シミュレータの色や照明などの条件をランダムに変えながら学習させ、現実でも使えるようにする方法。","body":"いろいろな条件で学習しておくと、モデルにとって現実の世界も「変化の一つ」に見えるようになります。\nこれにより、シミュレータで学習したモデルを、現実に移しやすくなります（sim2real）。","example":"シミュレータの中の机の色や光の当たり方を毎回変えて学習させると、本物の部屋でも物をつかめるようになる、といった使い方です。","related":["W-324"],"sources":[{"title":"Josh Tobin ほか \"Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World\" (arXiv:1703.06907)","url":"https://arxiv.org/abs/1703.06907"}]},{"id":"W-326","term":"オフライン強化学習","category":6,"short":"新しく環境とやり取りせず、すでに集めたデータだけを使って行動の仕方を学ぶ強化学習。","body":"実際に試行錯誤させるのが危険だったり、費用がかかったりする分野で期待されています。\n「オフライン」は、インターネットにつながっていないという意味ではありません。","example":"医療や自動運転のように、実際に失敗させられない分野で、過去の記録から学ばせる使い方が考えられます。","related":["W-058","W-327"],"sources":[{"title":"Sergey Levine ほか \"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems\" (arXiv:2005.01643)","url":"https://arxiv.org/abs/2005.01643"},{"title":"Henrik Müller, Daniel Kudenko \"Improving the Effectiveness of Potential-Based Reward Shaping in Reinforcement Learning\" (arXiv:2502.01307)","url":"https://arxiv.org/abs/2502.01307"},{"title":"Timothée Lesort ほか \"State Representation Learning for Control: An Overview\" (arXiv:1802.04181)","url":"https://arxiv.org/abs/1802.04181"},{"title":"Tobias Johannink ほか \"Residual Reinforcement Learning for Robot Control\" (arXiv:1812.03201)","url":"https://arxiv.org/abs/1812.03201"}]},{"id":"W-327","term":"報酬成形","category":6,"short":"学習を助けるために、本来の報酬に、補助的な報酬を足して与える方法。","body":"報酬がまれにしかもらえない問題では、何をすればよいかの手がかりが少なく、学習が進みにくくなります。\n途中のよい行動にも小さな報酬を与えることで、学習を進めやすくします。","example":"迷路のゴールだけでなく、ゴールに近づくたびに小さな報酬を与えるのが一例です。","related":["W-058","W-326"],"sources":[{"title":"Sergey Levine ほか \"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems\" (arXiv:2005.01643)","url":"https://arxiv.org/abs/2005.01643"},{"title":"Henrik Müller, Daniel Kudenko \"Improving the Effectiveness of Potential-Based Reward Shaping in Reinforcement Learning\" (arXiv:2502.01307)","url":"https://arxiv.org/abs/2502.01307"},{"title":"Timothée Lesort ほか \"State Representation Learning for Control: An Overview\" (arXiv:1802.04181)","url":"https://arxiv.org/abs/1802.04181"},{"title":"Tobias Johannink ほか \"Residual Reinforcement Learning for Robot Control\" (arXiv:1812.03201)","url":"https://arxiv.org/abs/1812.03201"}]},{"id":"W-328","term":"状態表現学習","category":6,"short":"強化学習で、エージェントの行動によって変わる環境の様子を、扱いやすい少ない数の値で表すように学ぶこと。","body":"カメラの画像のような大量の数値から、制御に必要な情報だけを取り出して表します。\nロボットの制御などに向いています。","related":["W-058","W-084","W-005"],"sources":[{"title":"Sergey Levine ほか \"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems\" (arXiv:2005.01643)","url":"https://arxiv.org/abs/2005.01643"},{"title":"Henrik Müller, Daniel Kudenko \"Improving the Effectiveness of Potential-Based Reward Shaping in Reinforcement Learning\" (arXiv:2502.01307)","url":"https://arxiv.org/abs/2502.01307"},{"title":"Timothée Lesort ほか \"State Representation Learning for Control: An Overview\" (arXiv:1802.04181)","url":"https://arxiv.org/abs/1802.04181"},{"title":"Tobias Johannink ほか \"Residual Reinforcement Learning for Robot Control\" (arXiv:1812.03201)","url":"https://arxiv.org/abs/1812.03201"}]},{"id":"W-329","term":"残差強化学習","category":6,"short":"従来の制御の方法でうまくいく部分はそのまま使い、うまくいかない残りの部分だけを強化学習で学ぶ方法。","body":"物の接触や摩擦のように、数式で表しにくい部分（残差）を、強化学習で補います。\n実際の制御は、従来の方法の信号と、強化学習の信号を足し合わせたものになります。","related":["W-058","W-323"],"sources":[{"title":"Sergey Levine ほか \"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems\" (arXiv:2005.01643)","url":"https://arxiv.org/abs/2005.01643"},{"title":"Henrik Müller, Daniel Kudenko \"Improving the Effectiveness of Potential-Based Reward Shaping in Reinforcement Learning\" (arXiv:2502.01307)","url":"https://arxiv.org/abs/2502.01307"},{"title":"Timothée Lesort ほか \"State Representation Learning for Control: An Overview\" (arXiv:1802.04181)","url":"https://arxiv.org/abs/1802.04181"},{"title":"Tobias Johannink ほか \"Residual Reinforcement Learning for Robot Control\" (arXiv:1812.03201)","url":"https://arxiv.org/abs/1812.03201"}]},{"id":"W-330","term":"RLHF","aliases":["人間のフィードバックによる強化学習","Reinforcement Learning from Human Feedback"],"category":6,"short":"人がAIの出力を比べて評価したデータを使い、人の意図に合う出力をするように、強化学習でモデルを調整する方法。","body":"言語モデルを大きくするだけでは、事実と違う内容や有害な内容を出すことがあります。\nRLHFでは、モデルの複数の出力を人が比べて順位を付け、そのデータをもとに強化学習でモデルを調整します。\nInstructGPTの研究では、パラメータが100分の1の小さなモデルでも、この調整で大きなモデルより人に好まれる出力をしました。","related":["W-285","W-322","W-058","W-123"],"sources":[{"title":"Long Ouyang ほか \"Training language models to follow instructions with human feedback\" (arXiv:2203.02155)","url":"https://arxiv.org/abs/2203.02155"}]},{"id":"W-331","term":"マルチエージェント強化学習（MARL）","aliases":["マルチエージェント強化学習","MARL"],"category":6,"short":"複数のエージェントが同じ環境の中で、協力したり競い合ったりしながら、それぞれ強化学習で行動を学ぶこと。","body":"エージェントどうしが協力する場合、競い合う場合、その両方が混ざる場合があります。\nゲーム、ロボット、自動運転など、多くの応用に複数のエージェントが関わるため、注目されています。","related":["W-058","W-005","W-321","W-320"],"sources":[{"title":"Kaiqing Zhang ほか \"Multi-Agent Reinforcement Learning: A Selective Overview of Theories and Algorithms\" (arXiv:1911.10635)","url":"https://arxiv.org/abs/1911.10635"}]},{"id":"W-332","term":"敵対的生成ネットワーク（GAN）","aliases":["敵対的生成ネットワーク","GAN","Generative Adversarial Networks"],"category":6,"short":"データを作る「生成器」と、本物か偽物かを見分ける「識別器」を競わせながら学習させる生成モデル。","body":"2014年にグッドフェローらが提案しました。\n生成器は識別器をだませるように、識別器は見破れるように、互いに競い合って学習します。\nうまく学習できると、生成器は本物そっくりのデータを作れるようになります。","example":"偽札を作る人（生成器）と、偽札を見破る警察（識別器）が競い合ううちに、偽札がどんどん本物に近づいていくイメージです。","related":["W-333","W-334","W-335","W-336","W-338"],"sources":[{"title":"Ian J. Goodfellow ほか \"Generative Adversarial Networks\" (arXiv:1406.2661)","url":"https://arxiv.org/abs/1406.2661"},{"title":"Alec Radford ほか \"Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks\" (arXiv:1511.06434)","url":"https://arxiv.org/abs/1511.06434"}]},{"id":"W-333","term":"DCGAN","category":6,"short":"GANに畳み込みニューラルネットワーク（CNN）を取り入れた、画像の生成に向いたモデル。","body":"GANの生成器と識別器に、CNNを使いました。\nGANの代表的な発展形の一つです。","related":["W-332","W-182"],"sources":[{"title":"Ian J. Goodfellow ほか \"Generative Adversarial Networks\" (arXiv:1406.2661)","url":"https://arxiv.org/abs/1406.2661"},{"title":"Alec Radford ほか \"Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks\" (arXiv:1511.06434)","url":"https://arxiv.org/abs/1511.06434"}]},{"id":"W-334","term":"Pix2Pix","category":6,"short":"入力の画像と出力の画像の組（ペア）で学習し、ある種類の画像を別の種類の画像に変換するモデル。","body":"条件付きのGANを使っています。\n地図から写真を作る、線画から写真のような画像を作る、白黒の画像に色を付ける、などの変換に、同じ方法で対応できます。","related":["W-335","W-332"],"sources":[{"title":"Phillip Isola ほか \"Image-to-Image Translation with Conditional Adversarial Networks\" (arXiv:1611.07004)","url":"https://arxiv.org/abs/1611.07004"},{"title":"Jun-Yan Zhu ほか \"Unpaired Image-to-Image Translation using Cycle-Consistent Adversarial Networks\" (arXiv:1703.10593)","url":"https://arxiv.org/abs/1703.10593"}]},{"id":"W-335","term":"CycleGAN","category":6,"short":"組になっていない2種類の画像の集まりから、互いに変換する方法を学習するモデル。","body":"多くの変換では、対応する画像の組を集めることができません。\nCycleGANは、変換した画像を元に戻したら元の画像になる、という条件（サイクル一貫性）を使うことで、組がなくても学習できます。","related":["W-334","W-332"],"sources":[{"title":"Phillip Isola ほか \"Image-to-Image Translation with Conditional Adversarial Networks\" (arXiv:1611.07004)","url":"https://arxiv.org/abs/1611.07004"},{"title":"Jun-Yan Zhu ほか \"Unpaired Image-to-Image Translation using Cycle-Consistent Adversarial Networks\" (arXiv:1703.10593)","url":"https://arxiv.org/abs/1703.10593"}]},{"id":"W-336","term":"Diffusion Model","aliases":["拡散モデル"],"category":6,"short":"データに少しずつノイズを加える過程の逆に、ノイズを少しずつ取り除く過程を学習して、画像などを作る生成モデル。","body":"学習後は、ランダムなノイズから始めて、少しずつノイズを取り除いていくことで、新しい画像などを作れます。\n2020年のDDPMという研究で、質の高い画像を作れることが示されました。\n文章から画像を作るサービスなどで、広く使われています。","example":"砂嵐のようなノイズの画像から、少しずつノイズを消していくと、だんだん絵が浮かび上がってくるイメージです。","related":["W-332","W-338","W-355","W-055"],"sources":[{"title":"Jonathan Ho ほか \"Denoising Diffusion Probabilistic Models\" (arXiv:2006.11239)","url":"https://arxiv.org/abs/2006.11239"}]},{"id":"W-337","term":"NeRF","aliases":["Neural Radiance Fields","ナーフ"],"category":6,"short":"いくつかの方向から撮った写真から、場面を立体的に表し、撮っていない方向から見た画像を作る方法。","body":"空間の位置と見る方向を入力すると、その点の色と密度（物の詰まり具合）を出すネットワークで、場面を表します。\n見る方向に沿って光線をたどり、色を積み重ねて画像を描きます。\n複雑な場面でも、写真のようにリアルな新しい視点の画像を作れます。","related":["W-338"],"sources":[{"title":"Ben Mildenhall ほか \"NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis\" (arXiv:2003.08934)","url":"https://arxiv.org/abs/2003.08934"}]},{"id":"W-338","term":"画像生成","category":6,"short":"AIで新しい画像を作り出すこと。","body":"GANや、Diffusion Model（拡散モデル）などの生成モデルが使われます。\n文章から画像を作るText-To-Imageも、画像生成の一つです。","related":["W-332","W-336","W-355","W-055"],"sources":[{"title":"Ian J. Goodfellow ほか \"Generative Adversarial Networks\" (arXiv:1406.2661)","url":"https://arxiv.org/abs/1406.2661"},{"title":"Alec Radford ほか \"Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks\" (arXiv:1511.06434)","url":"https://arxiv.org/abs/1511.06434"},{"title":"Jonathan Ho ほか \"Denoising Diffusion Probabilistic Models\" (arXiv:2006.11239)","url":"https://arxiv.org/abs/2006.11239"}]},{"id":"W-339","term":"文章生成","category":6,"short":"AIで新しい文章を作り出すこと。","body":"大規模言語モデル（LLM）は、前の言葉に続く言葉を予測することを繰り返して、文章を作ります。\nGPT-3は、人が書いた記事と見分けにくいニュース記事を作れることが報告されました。","related":["W-285","W-055"],"sources":[{"title":"Wayne Xin Zhao ほか \"A Survey of Large Language Models\" (arXiv:2303.18223)","url":"https://arxiv.org/abs/2303.18223"},{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Aakanksha Chowdhery ほか \"PaLM: Scaling Language Modeling with Pathways\" (arXiv:2204.02311)","url":"https://arxiv.org/abs/2204.02311"}]},{"id":"W-340","term":"音声生成","category":6,"short":"AIで新しい音声や音を作り出すこと。","body":"文字から声を作る音声合成が代表例です。\nWaveNetは、音の波を1点ずつ予測して作り、自然な声や音楽を作れることを示しました。","related":["W-308","W-309","W-055"],"sources":[{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}]},{"id":"W-341","term":"転移学習","category":6,"short":"ある課題で学習した知識を、別の課題に生かす方法。","body":"ディープラーニングでは、大量のデータで事前学習したモデルを土台にして、目的の課題に合わせて調整するのが一般的です。\n目的の課題のデータが少なくても、高い性能を出しやすいのが利点です。","example":"たくさんの写真で「物を見分ける力」を身につけたモデルを土台に、少しの画像で「部品の傷を見分ける」ように学ばせるのが一例です。","related":["W-342","W-343","W-225"],"sources":[{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}]},{"id":"W-342","term":"ファインチューニング","aliases":["微調整"],"category":6,"short":"事前学習済みモデルの重みを初期値にして、目的の課題のデータで重みをさらに調整すること。","body":"転移学習の代表的なやり方です。\n一部の層の重みは固定して、出力に近い層だけを学習し直すやり方もあります。\n画像認識でも自然言語処理（BERTなど）でも、広く使われています。","related":["W-341","W-343","W-283","W-349","W-180","W-271"],"sources":[{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}]},{"id":"W-343","term":"事前学習済みモデル","category":6,"short":"大量のデータであらかじめ学習させておいたモデル。これを土台に、目的の課題に合わせて調整して使う。","body":"一から学習させるより、少ないデータと計算で、高い性能を出しやすくなります。\nImageNetで学習した画像認識のモデルや、BERT、大規模言語モデルなどがあります。","related":["W-225","W-342","W-341","W-358","W-052","W-283","W-285"],"sources":[{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}]},{"id":"W-344","term":"Few-shot","aliases":["フューショット","Few-shot学習"],"category":6,"short":"モデルの重みを変えずに、課題の説明といくつかの例を示すだけで、課題を解かせるやり方。","body":"GPT-3の論文では、指示の文章（プロンプト）の中で、課題の説明に加えて、いくつかの例（入力と答えの組）を示しました。\nファインチューニングのような重みの更新はしません。","example":"「英語を日本語に訳してください。dog→犬、cat→猫、bird→？」のように、例をいくつか見せてから答えさせます。","related":["W-345","W-346","W-285","W-180","W-342"],"sources":[{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"}]},{"id":"W-345","term":"One-shot","aliases":["ワンショット"],"category":6,"short":"モデルの重みを変えずに、課題の説明と例を1つだけ示して、課題を解かせるやり方。","body":"人に仕事を頼むときのやり方に、最も近い形だとされています。","related":["W-344","W-346","W-180"],"sources":[{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"}]},{"id":"W-346","term":"Zero-shot","aliases":["ゼロショット"],"category":6,"short":"例を1つも示さず、課題の説明だけで、モデルに課題を解かせるやり方。","body":"最も手軽ですが、最も難しい設定です。\n画像の分野でも、CLIPのように、学習のときに見ていない種類の画像を、説明の文だけで分類することをZero-shotと呼びます。","related":["W-344","W-345","W-351","W-061"],"sources":[{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"}]},{"id":"W-347","term":"自己教師あり学習","category":6,"short":"人が付けた正解ではなく、データ自体から自動で作った課題を解くことで、データのよい表し方を学ぶ方法。","body":"文の一部を隠して当てる、同じ画像を加工した2枚が同じ画像から来たかを見分ける、といった課題を自動で作ります。\nラベル付けの手間がいらないので、大量のデータを使えます。\nBERTやGPTの事前学習も、文章から作った課題で学ぶ自己教師あり学習です。","example":"「今日は［？］が降っている」の［？］を当てる練習を、大量の文章で自動で作って学習するのが一例です。","related":["W-348","W-225","W-283"],"sources":[{"title":"Ting Chen ほか \"A Simple Framework for Contrastive Learning of Visual Representations\" (arXiv:2002.05709)","url":"https://arxiv.org/abs/2002.05709"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"}]},{"id":"W-348","term":"半教師あり学習","category":6,"short":"少しの正解付きデータと、大量の正解なしデータを組み合わせて学習する方法。","body":"教師あり学習と教師なし学習を組み合わせたものです。\n正解を付ける手間を減らせます。","related":["W-347","W-056","W-057"],"sources":[{"title":"Ting Chen ほか \"A Simple Framework for Contrastive Learning of Visual Representations\" (arXiv:2002.05709)","url":"https://arxiv.org/abs/2002.05709"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"}]},{"id":"W-349","term":"破滅的忘却","aliases":["破壊的忘却"],"category":6,"short":"新しい課題を学習すると、以前に学習した課題の性能が大きく下がってしまう現象。","body":"課題を順番に学習させると、新しい学習で以前の知識が上書きされてしまいます。\n人のように、次々に学びながら古い知識も保つ（継続学習）ことは、ニューラルネットワークにとって難しい課題です。\n以前の課題に大事な重みを変えにくくする方法（EWC）などが提案されています。","related":["W-342","W-341","W-122","W-180"],"sources":[{"title":"James Kirkpatrick ほか \"Overcoming catastrophic forgetting in neural networks\" (arXiv:1612.00796)","url":"https://arxiv.org/abs/1612.00796"}]},{"id":"W-350","term":"マルチモーダル","category":6,"short":"画像と文章、音声と映像のように、種類の違うデータ（モダリティ）を組み合わせて扱うこと。","body":"「モダリティ」は、データの種類（画像、文章、音声など）のことです。\n種類の違うデータを一緒に扱うことで、画像について質問に答えたり、文章から画像を作ったりできます。","related":["W-351","W-352","W-353","W-357","W-356"],"sources":[{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"},{"title":"Aditya Ramesh ほか \"Zero-Shot Text-to-Image Generation\" (arXiv:2102.12092)","url":"https://arxiv.org/abs/2102.12092"},{"title":"Jean-Baptiste Alayrac ほか \"Flamingo: a Visual Language Model for Few-Shot Learning\" (arXiv:2204.14198)","url":"https://arxiv.org/abs/2204.14198"},{"title":"Jiasen Lu ほか \"Unified-IO: A Unified Model for Vision, Language, and Multi-Modal Tasks\" (arXiv:2206.08916)","url":"https://arxiv.org/abs/2206.08916"}]},{"id":"W-351","term":"CLIP","category":6,"short":"大量の画像と説明文の組から、どの説明文がどの画像に合うかを当てるように学習した、画像と文章をつなぐモデル。","body":"OpenAIが2021年に発表しました。\n学習後は、種類の名前を説明文として与えるだけで、学習のときに見ていない種類の画像も分類できます（Zero-shot）。","related":["W-346","W-350","W-352","W-061"],"sources":[{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"}]},{"id":"W-352","term":"DALL-E","aliases":["ダリ"],"category":6,"short":"文章から画像を作る（Text-To-Image）モデル。","body":"文章の単語と画像の部品を1つの並びとして、Transformerで順番に予測して画像を作りました。","related":["W-355","W-351","W-218","W-338"],"sources":[{"title":"Aditya Ramesh ほか \"Zero-Shot Text-to-Image Generation\" (arXiv:2102.12092)","url":"https://arxiv.org/abs/2102.12092"},{"title":"Jean-Baptiste Alayrac ほか \"Flamingo: a Visual Language Model for Few-Shot Learning\" (arXiv:2204.14198)","url":"https://arxiv.org/abs/2204.14198"},{"title":"Jiasen Lu ほか \"Unified-IO: A Unified Model for Vision, Language, and Multi-Modal Tasks\" (arXiv:2206.08916)","url":"https://arxiv.org/abs/2206.08916"}]},{"id":"W-353","term":"Flamingo","aliases":["フラミンゴ"],"category":6,"short":"画像と文章が混ざった入力を扱える、画像と言葉のモデル（VLM）。少しの例で新しい課題に対応できる。","body":"あらかじめ学習させた画像のモデルと言葉のモデルを、うまくつなぐ工夫をしています。\n少しの例（Few-shot）を示すだけで、新しい課題に素早く対応できます。","related":["W-350","W-344","W-357"],"sources":[{"title":"Aditya Ramesh ほか \"Zero-Shot Text-to-Image Generation\" (arXiv:2102.12092)","url":"https://arxiv.org/abs/2102.12092"},{"title":"Jean-Baptiste Alayrac ほか \"Flamingo: a Visual Language Model for Few-Shot Learning\" (arXiv:2204.14198)","url":"https://arxiv.org/abs/2204.14198"},{"title":"Jiasen Lu ほか \"Unified-IO: A Unified Model for Vision, Language, and Multi-Modal Tasks\" (arXiv:2206.08916)","url":"https://arxiv.org/abs/2206.08916"}]},{"id":"W-354","term":"Unified-IO","category":6,"short":"画像、言葉、画像と言葉を組み合わせた、たくさんの種類の課題を、1つのモデルでこなすモデル。","body":"姿勢推定、物体検出、画像生成などの画像の課題、画像の説明文の生成などの画像と言葉の課題、質問応答などの言葉の課題を、1つでこなします。","related":["W-350","W-359","W-247","W-243","W-338","W-291"],"sources":[{"title":"Aditya Ramesh ほか \"Zero-Shot Text-to-Image Generation\" (arXiv:2102.12092)","url":"https://arxiv.org/abs/2102.12092"},{"title":"Jean-Baptiste Alayrac ほか \"Flamingo: a Visual Language Model for Few-Shot Learning\" (arXiv:2204.14198)","url":"https://arxiv.org/abs/2204.14198"},{"title":"Jiasen Lu ほか \"Unified-IO: A Unified Model for Vision, Language, and Multi-Modal Tasks\" (arXiv:2206.08916)","url":"https://arxiv.org/abs/2206.08916"}]},{"id":"W-355","term":"Text-To-Image","aliases":["テキストから画像"],"category":6,"short":"文章（テキスト）を入力として、その内容に合う画像を作ること。","body":"DALL-Eや、Diffusion Model（拡散モデル）を使ったサービスなどがあります。","example":"「夕焼けの海辺を走る犬」と入力すると、その場面の画像が作られます。","related":["W-352","W-336","W-338"],"sources":[{"title":"Aditya Ramesh ほか \"Zero-Shot Text-to-Image Generation\" (arXiv:2102.12092)","url":"https://arxiv.org/abs/2102.12092"},{"title":"Jean-Baptiste Alayrac ほか \"Flamingo: a Visual Language Model for Few-Shot Learning\" (arXiv:2204.14198)","url":"https://arxiv.org/abs/2204.14198"},{"title":"Jiasen Lu ほか \"Unified-IO: A Unified Model for Vision, Language, and Multi-Modal Tasks\" (arXiv:2206.08916)","url":"https://arxiv.org/abs/2206.08916"},{"title":"Jonathan Ho ほか \"Denoising Diffusion Probabilistic Models\" (arXiv:2006.11239)","url":"https://arxiv.org/abs/2006.11239"}]},{"id":"W-356","term":"Image Captioning","aliases":["画像説明文生成","キャプション生成"],"category":6,"short":"画像の内容を説明する文章を、自動で作る課題。","body":"画像の理解と、文章の生成をつなぐ課題です。\nShow and Tellという研究では、CNNで画像の特徴を取り出し、RNNで文章を作るモデルが提案されました。","example":"公園の写真から、「芝生の上で子どもがボールで遊んでいる」という説明文を作ります。","related":["W-357","W-350","W-182","W-204"],"sources":[{"title":"Oriol Vinyals ほか \"Show and Tell: A Neural Image Caption Generator\" (arXiv:1411.4555)","url":"https://arxiv.org/abs/1411.4555"},{"title":"Aishwarya Agrawal ほか \"VQA: Visual Question Answering\" (arXiv:1505.00468)","url":"https://arxiv.org/abs/1505.00468"}]},{"id":"W-357","term":"Visual Question Answering","aliases":["VQA","視覚的質問応答"],"category":6,"short":"画像と、その画像についての質問を受け取り、答えを言葉で返す課題。","body":"質問も答えも自由な言葉なので、画像の細かい部分や背景まで理解する必要があります。\n目の見えない人を助けるような、現実の場面での使い方も想定されています。","example":"台所の写真と「冷蔵庫の横には何がありますか？」という質問から、「電子レンジ」と答えます。","related":["W-356","W-350","W-291"],"sources":[{"title":"Oriol Vinyals ほか \"Show and Tell: A Neural Image Caption Generator\" (arXiv:1411.4555)","url":"https://arxiv.org/abs/1411.4555"},{"title":"Aishwarya Agrawal ほか \"VQA: Visual Question Answering\" (arXiv:1505.00468)","url":"https://arxiv.org/abs/1505.00468"}]},{"id":"W-358","term":"基盤モデル","aliases":["Foundation Model","ファウンデーションモデル"],"category":6,"short":"幅広いデータで大規模に学習し、いろいろな課題に合わせて使えるモデル。","body":"BERT、DALL-E、GPT-3などがその例です。\nスタンフォード大学の研究者らが名付けました。\n大きな可能性がある一方で、偏りや悪用などのリスクについても議論されています。","related":["W-285","W-343","W-359","W-055","W-283","W-352"],"sources":[{"title":"Rishi Bommasani ほか \"On the Opportunities and Risks of Foundation Models\" (arXiv:2108.07258)","url":"https://arxiv.org/abs/2108.07258"},{"title":"Sebastian Ruder \"An Overview of Multi-Task Learning in Deep Neural Networks\" (arXiv:1706.05098)","url":"https://arxiv.org/abs/1706.05098"}]},{"id":"W-359","term":"マルチタスク学習","category":6,"short":"関係のある複数の課題を、1つのモデルで同時に学習する方法。","body":"課題どうしで知識を共有することで、それぞれの課題の性能を高めることを目指します。","example":"1つのモデルに、写真に写った人の年齢と性別を同時に当てさせる、といった学び方です。","related":["W-358","W-354"],"sources":[{"title":"Rishi Bommasani ほか \"On the Opportunities and Risks of Foundation Models\" (arXiv:2108.07258)","url":"https://arxiv.org/abs/2108.07258"},{"title":"Sebastian Ruder \"An Overview of Multi-Task Learning in Deep Neural Networks\" (arXiv:1706.05098)","url":"https://arxiv.org/abs/1706.05098"}]},{"id":"W-360","term":"説明可能AI（XAI）","aliases":["説明可能AI","XAI","Explainable AI"],"category":6,"short":"AIがなぜその判断をしたのかを、人が理解できるように示すための技術や考え方。","body":"ディープラーニングのような複雑なモデルは、判断の理由がわかりにくい（ブラックボックス）という問題があります。\n判断に大事だった画像の領域を示すCAMやGrad-CAM、各特徴量の貢献を示すLIMEやSHAPなどがあります。","related":["W-361","W-362","W-363","W-364","W-365","W-486","W-487","W-059"],"sources":[{"title":"Bolei Zhou ほか \"Learning Deep Features for Discriminative Localization\" (arXiv:1512.04150)","url":"https://arxiv.org/abs/1512.04150"},{"title":"Ramprasaath R. Selvaraju ほか \"Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization\" (arXiv:1610.02391)","url":"https://arxiv.org/abs/1610.02391"},{"title":"Marco Tulio Ribeiro ほか \"Why Should I Trust You?: Explaining the Predictions of Any Classifier\" (arXiv:1602.04938)","url":"https://arxiv.org/abs/1602.04938"},{"title":"Scott Lundberg, Su-In Lee \"A Unified Approach to Interpreting Model Predictions\" (arXiv:1705.07874)","url":"https://arxiv.org/abs/1705.07874"},{"title":"scikit-learn User Guide 4.2 Permutation feature importance","url":"https://scikit-learn.org/stable/modules/permutation_importance.html"},{"title":"Alejandro Barredo Arrieta ほか \"Explainable Artificial Intelligence (XAI): Concepts, Taxonomies, Opportunities and Challenges toward Responsible AI\" (arXiv:1910.10045)","url":"https://arxiv.org/abs/1910.10045"}]},{"id":"W-361","term":"CAM","aliases":["Class Activation Mapping"],"category":6,"short":"画像認識のCNNが、あるクラスと判断するのに大事だった画像の領域を、色で示す方法。","body":"グローバルアベレージプーリング（GAP）を持つCNNで使えます。\n画像全体の正解だけで学習しても、物の位置を特定する力が備わることを示しました。\nGAPを持つ構造が必要なのが制約です。","related":["W-362","W-200","W-360","W-182"],"sources":[{"title":"Bolei Zhou ほか \"Learning Deep Features for Discriminative Localization\" (arXiv:1512.04150)","url":"https://arxiv.org/abs/1512.04150"},{"title":"Ramprasaath R. Selvaraju ほか \"Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization\" (arXiv:1610.02391)","url":"https://arxiv.org/abs/1610.02391"}]},{"id":"W-362","term":"Grad-CAM","category":6,"short":"予測に対する勾配を使って、判断に大事だった画像の領域を示す方法。CAMより多くの種類のCNNに使える。","body":"予測したいクラスについての勾配が、最後の畳み込み層にどう流れ込むかを使って、大事な領域をおおまかに示す地図を作ります。\n全結合層を持つCNNなど、構造を変えずに多くのモデルに使えます。","example":"「犬」と判断した画像で、犬の顔のあたりが赤く表示されれば、そこを見て判断したとわかります。","related":["W-361","W-360","W-126","W-182","W-183","W-179"],"sources":[{"title":"Bolei Zhou ほか \"Learning Deep Features for Discriminative Localization\" (arXiv:1512.04150)","url":"https://arxiv.org/abs/1512.04150"},{"title":"Ramprasaath R. Selvaraju ほか \"Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization\" (arXiv:1610.02391)","url":"https://arxiv.org/abs/1610.02391"}]},{"id":"W-363","term":"LIME","aliases":["ライム"],"category":6,"short":"説明したい1つの予測の周りで、わかりやすい単純なモデルを作ってまねさせ、どの特徴量が効いたかを示す方法。","body":"どんな分類モデルの予測にも使えます。\n1つの予測の近くだけを、線形モデルのような解釈しやすいモデルで近似し、その予測の理由を示します。","related":["W-364","W-360","W-059","W-061"],"sources":[{"title":"Marco Tulio Ribeiro ほか \"Why Should I Trust You?: Explaining the Predictions of Any Classifier\" (arXiv:1602.04938)","url":"https://arxiv.org/abs/1602.04938"},{"title":"Scott Lundberg, Su-In Lee \"A Unified Approach to Interpreting Model Predictions\" (arXiv:1705.07874)","url":"https://arxiv.org/abs/1705.07874"}]},{"id":"W-364","term":"SHAP","aliases":["シャップ"],"category":6,"short":"ゲーム理論のシャープレイ値の考え方を使って、ある予測に各特徴量がどれだけ貢献したかを求める方法。","body":"チームの成果を、メンバーの貢献度に応じて公平に分ける考え方（シャープレイ値）を、予測の説明に応用しました。\nいくつかの説明方法を、まとめて扱える枠組みになっています。","example":"ローンの審査で「年収が＋0.3、借入額が−0.2」のように、各項目が結果にどれだけ効いたかを示します。","related":["W-363","W-360","W-059"],"sources":[{"title":"Marco Tulio Ribeiro ほか \"Why Should I Trust You?: Explaining the Predictions of Any Classifier\" (arXiv:1602.04938)","url":"https://arxiv.org/abs/1602.04938"},{"title":"Scott Lundberg, Su-In Lee \"A Unified Approach to Interpreting Model Predictions\" (arXiv:1705.07874)","url":"https://arxiv.org/abs/1705.07874"}]},{"id":"W-365","term":"Permutation Importance","aliases":["順列重要度","並べ替え重要度"],"category":6,"short":"ある特徴量の値だけをバラバラに並べ替えたとき、モデルの性能がどれだけ下がるかで、その特徴量の大事さを測る方法。","body":"並べ替えると、その特徴量と正解との関係が壊れます。\n性能が大きく下がる特徴量ほど、モデルが大事にしていると考えられます。\n中身がわかりにくいモデルにも使えます。","related":["W-360","W-364","W-059"],"sources":[{"title":"scikit-learn User Guide 4.2 Permutation feature importance","url":"https://scikit-learn.org/stable/modules/permutation_importance.html"},{"title":"Alejandro Barredo Arrieta ほか \"Explainable Artificial Intelligence (XAI): Concepts, Taxonomies, Opportunities and Challenges toward Responsible AI\" (arXiv:1910.10045)","url":"https://arxiv.org/abs/1910.10045"}]},{"id":"W-366","term":"モデル圧縮","category":6,"short":"モデルの性能をなるべく保ったまま、大きさや計算量を小さくすること。","body":"スマートフォンなどの計算資源が限られた機器で動かすために必要になります。\n代表的な方法に、蒸留、プルーニング（枝刈り）、量子化があります。\nこれらを組み合わせて、モデルの容量を大きく減らした研究（Deep Compression）もあります。","related":["W-367","W-368","W-370","W-371"],"sources":[{"title":"Benoit Jacob ほか \"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference\" (arXiv:1712.05877)","url":"https://arxiv.org/abs/1712.05877"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"},{"title":"Andrew G. Howard ほか \"MobileNets\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}]},{"id":"W-367","term":"蒸留","aliases":["知識の蒸留","Knowledge Distillation"],"category":6,"short":"大きな「先生」のモデルが学んだ知識を、小さな「生徒」のモデルに移して、少ない計算で近い性能を出す方法。","body":"生徒のモデルは、正解だけでなく、先生のモデルが出す各クラスの確率もまねるように学習します。\nヒントンらが提案し、実際に使われている音声認識のモデルの性能を向上させました。","example":"ベテランの先生の考え方を、要点をしぼって新人に教え込むようなイメージです。","related":["W-366","W-368","W-370","W-305"],"sources":[{"title":"Geoffrey Hinton ほか \"Distilling the Knowledge in a Neural Network\" (arXiv:1503.02531)","url":"https://arxiv.org/abs/1503.02531"}]},{"id":"W-368","term":"プルーニング","aliases":["枝刈り"],"category":6,"short":"学習したネットワークから、重要でないつながり（重み）を取り除いて、モデルを小さくする方法。","body":"パラメータを大きく減らしても、精度を保ったまま、必要な記憶の容量を減らし、推論を速くできることがあります。","related":["W-369","W-366","W-367","W-180","W-123"],"sources":[{"title":"Jonathan Frankle, Michael Carbin \"The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks\" (arXiv:1803.03635)","url":"https://arxiv.org/abs/1803.03635"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"}]},{"id":"W-369","term":"宝くじ仮説","category":6,"short":"大きなネットワークの中に、単独でも元と同じくらいよく学べる小さな部分（当たりくじ）がある、という仮説。","body":"フランクルとカービンが示しました。\n当たりくじは、学習に特に向いた初期の重みを持っていると考えられます。\n元の10〜20％以下の大きさの当たりくじが見つかりました。","related":["W-368","W-180"],"sources":[{"title":"Jonathan Frankle, Michael Carbin \"The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks\" (arXiv:1803.03635)","url":"https://arxiv.org/abs/1803.03635"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"}]},{"id":"W-370","term":"量子化","category":6,"short":"モデルの重みなどの数値を、少ない桁数（ビット数）で表して、モデルを小さく、計算を速くする方法。","body":"32ビットの小数の代わりに、8ビットの整数などで表します。\nモデルが小さくなり、計算が速くなり、電力も減らせます。\n工夫すれば、精度をほぼ保ったまま量子化できます。","related":["W-366","W-371","W-180"],"sources":[{"title":"Benoit Jacob ほか \"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference\" (arXiv:1712.05877)","url":"https://arxiv.org/abs/1712.05877"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"},{"title":"Andrew G. Howard ほか \"MobileNets\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}]},{"id":"W-371","term":"エッジAI","category":6,"short":"スマートフォンや家電、車などの端末（エッジ）の側で、AIの処理を行うこと。","body":"通信の遅れがなく、データを外部に送らずに済むといった利点があります。\n一方、端末の計算資源は限られるので、モデルを小さく速くする工夫（モデル圧縮）が必要です。","example":"スマートフォンの中だけで、顔を見分けて画面のロックを解除する機能などが、エッジAIの例です。","related":["W-366","W-370","W-257"],"sources":[{"title":"Benoit Jacob ほか \"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference\" (arXiv:1712.05877)","url":"https://arxiv.org/abs/1712.05877"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"},{"title":"Andrew G. Howard ほか \"MobileNets\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}]},{"id":"W-372","term":"AIのビジネス活用","category":7,"short":"AIを使って、事業の課題を解決したり、新しい価値を生み出したりすること。","body":"AIはあくまで道具であり、大事なのは「AIで何を解決したいのか」という事業上の課題を決めることです。\n情報通信白書によると、日本企業は、AIを導入する効果がはっきりしないことや、導入を引っ張る組織・人材が足りないことを課題と感じています。\nそのため、効果を段階的に確かめながら進めることや、社内外の人材を育て、生かすことが大切になります。","related":["W-373","W-377","W-381","W-382"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"},{"title":"総務省 平成30年版 情報通信白書「AI・IoTの導入にあたっての課題」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h30/html/nd132220.html"}]},{"id":"W-373","term":"AIプロジェクトの進め方","category":7,"short":"AIを作って使うまでの、段階を分けた進め方。課題の設定から、運用後の見直しまでを含む。","body":"AIの開発は、作ってみないとどれくらいうまくいくかがわかりにくいため、試しながら段階的に進めます。\n経済産業省の契約ガイドラインは、アセスメント、PoC、開発、追加学習の段階に分けて進める方式（探索的段階型）を勧めています。\n使い始めた後も、性能が落ちていないかを見張り、必要に応じて学習し直すことが大切です（MLOps）。","related":["W-377","W-374","W-376","W-456","W-379"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"},{"title":"Dominik Kreuzberger ほか \"Machine Learning Operations (MLOps): Overview, Definition, and Architecture\" (arXiv:2205.02302)","url":"https://arxiv.org/abs/2205.02302"},{"title":"Stefan Studer ほか \"Towards CRISP-ML(Q): A Machine Learning Process Model with Quality Assurance Methodology\" (arXiv:2003.05155)","url":"https://arxiv.org/abs/2003.05155"}]},{"id":"W-374","term":"CRISP-DM","category":7,"short":"データ分析のプロジェクトの進め方を、6つの段階で示したモデル。産業界で広く使われてきた。","body":"ビジネスの理解、データの理解、データの準備、モデルの作成、評価、展開（使い始めること）の6つの段階からなります。\n一方向に進むのではなく、必要に応じて前の段階に戻りながら進めます。","related":["W-375","W-373"],"sources":[{"title":"Stefan Studer ほか \"Towards CRISP-ML(Q): A Machine Learning Process Model with Quality Assurance Methodology\" (arXiv:2003.05155)","url":"https://arxiv.org/abs/2003.05155"}]},{"id":"W-375","term":"CRISP-ML","aliases":["CRISP-ML(Q)"],"category":7,"short":"CRISP-DMを機械学習向けに広げた進め方のモデル。使い始めた後の見張りと保守の段階を加えている。","body":"正式にはCRISP-ML(Q)と書き、Qは品質保証（Quality Assurance）を表します。\nデータが使えるかどうかがプロジェクトの成否を左右しやすいため、ビジネスの理解とデータの理解を1つの段階にまとめています。\n周りの変化でモデルの性能が落ちる危険があるため、使い始めた後の見張り（モニタリング）と保守の段階を加えました。","related":["W-374","W-376","W-505"],"sources":[{"title":"Stefan Studer ほか \"Towards CRISP-ML(Q): A Machine Learning Process Model with Quality Assurance Methodology\" (arXiv:2003.05155)","url":"https://arxiv.org/abs/2003.05155"}]},{"id":"W-376","term":"MLOps","aliases":["Machine Learning Operations"],"category":7,"short":"機械学習のモデルを作って本番で使い、自動化して運用し続けるための考え方や実践の集まり。","body":"モデルの開発から、本番の環境への組み込み、運用までを自動化し、継続して回していくことを目指します。\n使い始めた後も、周りの変化でモデルの性能が落ちていないかを見張り、必要に応じて学習し直します。\nデータサイエンティスト、開発者、運用の担当者などが協力して進めます。","related":["W-375","W-505","W-388","W-381"],"sources":[{"title":"Dominik Kreuzberger ほか \"Machine Learning Operations (MLOps): Overview, Definition, and Architecture\" (arXiv:2205.02302)","url":"https://arxiv.org/abs/2205.02302"},{"title":"Stefan Studer ほか \"Towards CRISP-ML(Q): A Machine Learning Process Model with Quality Assurance Methodology\" (arXiv:2003.05155)","url":"https://arxiv.org/abs/2003.05155"}]},{"id":"W-377","term":"PoC","aliases":["概念実証","Proof of Concept"],"category":7,"short":"本格的に開発する前に、考えた方法が本当にうまくいくかを、小さく試して確かめること。","body":"「概念実証」と訳されます。\nAIの開発では、学習用のデータを使って、求める精度のモデルを作れるかどうかを確かめる段階です。\n成果物は、報告書や試作版のモデルなどです。契約としては、導入検証契約などを結びます。","related":["W-373","W-456","W-459"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"},{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}]},{"id":"W-378","term":"ウォーターフォール","aliases":["ウォーターフォール型"],"category":7,"short":"要件定義、設計、プログラミング、テストなどの工程を、上から下へ順番に進めていく開発の方式。","body":"滝（ウォーターフォール）の水が上から下へ流れるように、工程を順に進めます。\n仕様を最初に決めるので、後から変えるのは難しいことが多い方式です。\nAIのモデル作りは、作ってみないと結果がわからないため、この方式は合わない場合が多いとされています。","related":["W-379","W-373"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}]},{"id":"W-379","term":"アジャイル","aliases":["アジャイル型","アジャイル開発"],"category":7,"short":"大事な機能から、要求・開発・テスト・公開を短い期間で繰り返しながら、少しずつ作り上げていく開発の方式。","body":"お客さんの要求に合わせて優先度の高い機能から作り、動くソフトウェアを少しずつ育てていきます。\n途中で仕様が変わることにも対応しやすい方式です。\n試行錯誤が欠かせないAIの開発には、このような繰り返し型の方式が向いているとされています。","related":["W-378","W-373"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}]},{"id":"W-380","term":"ステークホルダーのニーズ","category":7,"short":"AIのプロジェクトに関わる人たち（利用者、発注する会社、開発する会社など）が、何を求めているかということ。","body":"「ステークホルダー」は、利害関係者という意味です。\nAIの開発では、利用する側が「何を解決したいのか」を明らかにし、その課題の設定に主体的に関わることが大切です。\n課題と評価の指標（KPI）がはっきりして初めて、どんなデータが必要かを検討できます。","related":["W-372","W-373"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}]},{"id":"W-381","term":"データサイエンティスト","category":7,"short":"データを分析して、ビジネスの課題の解決に生かす専門家。","body":"統計や機械学習の知識、プログラミングの技術、そして事業の理解を組み合わせて、データから役立つ答えを導きます。\n情報通信白書では、日本企業は、AIの導入を引っ張る組織や人材の不足を、他の国より強く課題と感じているとされています。","related":["W-372","W-376"],"sources":[{"title":"総務省 平成30年版 情報通信白書「AI・IoTの導入にあたっての課題」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h30/html/nd132220.html"}]},{"id":"W-382","term":"BPR","aliases":["ビジネス・プロセス・リエンジニアリング","業務改革"],"category":7,"short":"仕事の進め方（業務プロセス）を、根本から見直してつくり直すこと。","body":"「ビジネス・プロセス・リエンジニアリング」の略で、業務改革とも呼ばれます。\nAIなどのデジタル技術を入れるときは、今の仕事の一部をそのまま置き換えるだけでは効果が限られます。\n利用する人の目線で、仕事の流れ全体を見直すことが大切です。","related":["W-372"],"sources":[{"title":"総務省「自治体DX全体手順書【第4.0版】」（2025年3月）pp.6-7","url":"https://www.soumu.go.jp/main_content/000944054.pdf"}]},{"id":"W-383","term":"オープン・イノベーション","category":7,"short":"自社の中だけで開発するのではなく、外部の知識や技術、人材を取り入れて、新しい価値を生み出すこと。","body":"会社の枠を超えた新しい事業の開発や、社外の専門家の起用などが含まれます。\n自社だけで何でもやろうとする「自前主義」から抜け出すことが大切だとされています。","related":["W-384","W-385"],"sources":[{"title":"総務省 平成29年版 情報通信白書「オープンイノベーションの進展」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h29/html/nc131220.html"}]},{"id":"W-384","term":"産学連携","category":7,"short":"企業（産業界）と、大学や研究機関（学術界）が協力して、研究や開発を進めること。","body":"AIの開発には、データ、専門的な技術、人材、仕事の知識など、多くの要素が必要です。\n大学や研究機関と協力することで、自社だけでは得られない知識や技術を取り込めます。","related":["W-383","W-385"],"sources":[{"title":"総務省 平成29年版 情報通信白書「オープンイノベーションの進展」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h29/html/nc131220.html"}]},{"id":"W-385","term":"他企業や他業種との連携","category":7,"short":"ほかの会社や、違う業種の会社と協力して、AIの活用や新しい事業を進めること。","body":"自社にないデータや技術、仕事の知識を持つ会社と組むことで、自社だけではできない取り組みが可能になります。\nベンチャー企業との連携なども重視されています。","related":["W-383","W-384"],"sources":[{"title":"総務省 平成29年版 情報通信白書「オープンイノベーションの進展」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h29/html/nc131220.html"}]},{"id":"W-386","term":"Python","aliases":["パイソン"],"category":7,"short":"学びやすく、機械学習やデータ分析の道具（ライブラリ）が豊富な、AIの開発でよく使われるプログラミン
