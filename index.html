グ言語。","body":"文法がシンプルで、書いたプログラムをすぐに動かして試せます。\nscikit-learnやPyTorchなど、機械学習のライブラリがたくさんあります。","related":["W-387"],"sources":[{"title":"Project Jupyter Documentation","url":"https://docs.jupyter.org/en/latest/"},{"title":"Python Documentation \"The Python Tutorial\"","url":"https://docs.python.org/3/tutorial/index.html"}]},{"id":"W-387","term":"Jupyter Notebook","aliases":["ジュピターノートブック","JupyterLab"],"category":7,"short":"プログラムと説明の文章、実行結果のグラフなどを、1つの文書にまとめて書ける道具。","body":"ブラウザで使う道具で、プログラムを少しずつ実行して、結果をすぐに確かめられます。\n試作やデータ分析、機械学習の実験に広く使われています。","related":["W-386"],"sources":[{"title":"Project Jupyter Documentation","url":"https://docs.jupyter.org/en/latest/"},{"title":"Python Documentation \"The Python Tutorial\"","url":"https://docs.python.org/3/tutorial/index.html"}]},{"id":"W-388","term":"Docker","aliases":["ドッカー","コンテナ"],"category":7,"short":"アプリを、動かすための環境ごと「コンテナ」という箱にまとめて、どこでも同じように動かせるようにする仕組み。","body":"開発したパソコンと本番のサーバーで環境が違うと、同じプログラムでも動かないことがあります。\nDockerは、必要な道具（ライブラリ）の種類や版まで含めて箱にまとめるので、こうした問題を減らせます。\n機械学習のモデルの開発や、本番への組み込みでもよく使われます。","related":["W-376","W-390"],"sources":[{"title":"Docker Docs \"What is Docker?\"（Apache License 2.0）","url":"https://docs.docker.com/get-started/docker-overview/"}]},{"id":"W-389","term":"Web API","aliases":["API"],"category":7,"short":"インターネットを通じて、ほかのサービスの機能を、簡単な呼び出し方で使えるようにする窓口。","body":"APIは、複雑な機能を簡単に使えるように用意された窓口のことです。\nそのうち、インターネットを通じて呼び出せるものをWeb APIといいます。\n画像認識や翻訳などのAIの機能を、サービスとして提供するのにもよく使われます。","example":"電化製品を、電線に直接つながずに、コンセントに差すだけで使えるのに似ています。","related":["W-390","W-462"],"sources":[{"title":"MDN Web Docs \"Introduction to web APIs\"（CC BY-SA 2.5）","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Client-side_APIs/Introduction"},{"title":"NIST SP 800-145 \"The NIST Definition of Cloud Computing\"","url":"https://csrc.nist.gov/pubs/sp/800/145/final"}]},{"id":"W-390","term":"クラウド","aliases":["クラウドコンピューティング"],"category":7,"short":"サーバーやストレージなどの計算資源を、インターネットを通じて、必要なときに必要な分だけ使える仕組み。","body":"自分で機器を持たなくても、すぐに使い始めたり、やめたりできます。\nディープラーニングの大量の計算にも、クラウドのGPUなどがよく使われます。","related":["W-389","W-462","W-388","W-132"],"sources":[{"title":"MDN Web Docs \"Introduction to web APIs\"（CC BY-SA 2.5）","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Client-side_APIs/Introduction"},{"title":"NIST SP 800-145 \"The NIST Definition of Cloud Computing\"","url":"https://csrc.nist.gov/pubs/sp/800/145/final"}]},{"id":"W-391","term":"アノテーション","category":7,"short":"学習用のデータに、正解のラベル（「この画像は猫」など）を付ける作業。","body":"教師あり学習には欠かせない作業です。\nただし、大量のデータに一つひとつラベルを付けるのは手間がかかり、データ活用の難しさの一因になっています。","example":"写真の中の車を四角で囲んで「車」と書き込む作業も、アノテーションです。","related":["W-056","W-392"],"sources":[{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"内山将夫（情報通信研究機構）「コーパスベースの機械翻訳」","url":"https://www2.nict.go.jp/astrec-att/member/mutiyama/corpmt/cbmt.pdf"}]},{"id":"W-392","term":"オープンデータセット","category":7,"short":"誰でも使えるように公開されているデータセット（データの集まり）。","body":"画像認識のImageNetや、手書き数字のMNISTなどがあり、研究や開発に広く使われています。\nただし、使う前に利用条件（ライセンス）を確かめる必要があります。","related":["W-052","W-391","W-393"],"sources":[{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"内山将夫（情報通信研究機構）「コーパスベースの機械翻訳」","url":"https://www2.nict.go.jp/astrec-att/member/mutiyama/corpmt/cbmt.pdf"}]},{"id":"W-393","term":"コーパス","category":7,"short":"言葉の研究や自然言語処理のために集めた、大量の文章の集まり。","body":"機械翻訳では、元の文と訳文を組にした「対訳コーパス」が使われます。\n統計的な方法やディープラーニングで言葉を扱うための、学習データになります。","related":["W-015","W-048","W-392","W-271","W-290"],"sources":[{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"内山将夫（情報通信研究機構）「コーパスベースの機械翻訳」","url":"https://www2.nict.go.jp/astrec-att/member/mutiyama/corpmt/cbmt.pdf"},{"title":"情報通信研究機構研究報告 Vol.68 No.2（2022）「2-1 多言語コミュニケーション技術の概要」p.4","url":"https://www.nict.go.jp/publication/shuppan/kihou-journal/houkoku68-2_HTML/2022U-02-01.pdf"},{"title":"Felix Stahlberg \"Neural Machine Translation: A Review and Survey\" (arXiv:1912.02047)","url":"https://arxiv.org/abs/1912.02047"}]},{"id":"W-394","term":"データリーケージ","aliases":["データ漏洩","リーケージ"],"category":7,"short":"本来は予測のときに手に入らないはずの情報が、モデル作りに使われてしまい、評価が実際より良く見えること。","body":"よくある原因は、学習用とテスト用のデータをきちんと分けずに扱うことです。\nたとえば、データを整える処理（標準化など）の計算に、テスト用のデータまで含めてしまうと、テスト用の情報が学習に漏れてしまいます。\n本番で本当に新しいデータを予測すると、性能が下がってしまいます。\n言葉は似ていますが、外部への情報の流出（情報漏えい）とは別の意味です。","example":"明日の売上を予測するのに、明日にならないとわからない情報を学習に使ってしまう、というのが典型的な例です。","related":["W-108","W-106"],"sources":[{"title":"scikit-learn User Guide 11. Common pitfalls and recommended practices（Data leakage）","url":"https://scikit-learn.org/stable/common_pitfalls.html"}]},{"id":"W-395","term":"平均","aliases":["平均値","算術平均"],"category":8,"short":"すべてのデータの値を足して、データの個数で割った値。","body":"データの集まりの、中心的な値を表す代表値の一つです。\nすべての値を使って計算するので、他から大きく離れた値（外れ値）の影響を受けやすいという特徴があります。","example":"3、5、5、7、100 の平均は、（3＋5＋5＋7＋100）÷5＝24 です。100という外れ値に引っ張られて、大きな値になっています。","related":["W-396","W-397","W-398","W-399"],"sources":[{"title":"総務省統計局「なるほど統計学園」中心的な傾向を捉える","url":"https://www.stat.go.jp/naruhodo/5_tokucho/chushin.html"}]},{"id":"W-396","term":"中央値","aliases":["メディアン"],"category":8,"short":"データを小さい順に並べたときに、真ん中にくる値。","body":"データの個数が奇数なら真ん中の値、偶数なら真ん中の2つの値の平均が中央値です。\n外れ値が加わっても、多くの場合あまり影響を受けません。","example":"3、5、5、7、100 の中央値は、真ん中（3番目）の 5 です。","related":["W-395","W-397","W-398"],"sources":[{"title":"総務省統計局「なるほど統計学園」中心的な傾向を捉える","url":"https://www.stat.go.jp/naruhodo/5_tokucho/chushin.html"}]},{"id":"W-397","term":"最頻値","aliases":["モード"],"category":8,"short":"データの中で、最も多く現れる値。","body":"外れ値の影響は、ほとんど受けません。\n度数分布（ヒストグラム）では、度数が一番多い階級の値になります。","example":"3、5、5、7、100 では、5 が2回出てきて最も多いので、最頻値は 5 です。","related":["W-395","W-396","W-401","W-398"],"sources":[{"title":"総務省統計局「なるほど統計学園」中心的な傾向を捉える","url":"https://www.stat.go.jp/naruhodo/5_tokucho/chushin.html"}]},{"id":"W-398","term":"外れ値","category":8,"short":"他の多くのデータから、大きく離れた値。","body":"平均や、誤差を2乗する指標（平均二乗誤差など）は、外れ値の影響を大きく受けます。\n中央値や最頻値は、外れ値の影響を受けにくい代表値です。","example":"3、5、5、7、100 の中の 100 は、外れ値です。","related":["W-395","W-396","W-118","W-116","W-397"],"sources":[{"title":"総務省統計局「なるほど統計学園」中心的な傾向を捉える","url":"https://www.stat.go.jp/naruhodo/5_tokucho/chushin.html"}]},{"id":"W-399","term":"分散","category":8,"short":"データの散らばりの大きさを表す値。各データと平均との差を2乗して、平均したもの。","body":"各データと平均との差（偏差）をそのまま足すと、プラスとマイナスが打ち消し合って0になってしまいます。\nそこで、偏差を2乗してから平均します。\n値が大きいほど、データが大きく散らばっていることを表します。","example":"2、4、6、8 の平均は5です。偏差は −3、−1、1、3 で、2乗すると 9、1、1、9。その平均の 20÷4＝5 が分散です。","related":["W-400","W-395","W-402"],"sources":[{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"}]},{"id":"W-400","term":"標準偏差","category":8,"short":"分散の正の平方根。元のデータと同じ単位で、散らばりの大きさを表す。","body":"分散は偏差を2乗しているので、単位も2乗になってしまいます。\n平方根をとることで、元のデータと単位がそろい、散らばりの程度がわかりやすくなります。\nテストの偏差値も、平均と標準偏差を使って計算されます。","example":"分散が5なら、標準偏差は √5 ≒ 2.24 です。","related":["W-399","W-415"],"sources":[{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"},{"title":"総務省統計局「なるほど統計学園」統計用語辞典（さ行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/sa-gyo.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"}]},{"id":"W-401","term":"度数分布","aliases":["度数分布表","ヒストグラム"],"category":8,"short":"データをいくつかの区間（階級）に分けて、それぞれの区間に入るデータの数（度数）を数えたもの。","body":"度数分布を表にしたものを度数分布表、柱の形のグラフにしたものをヒストグラムといいます。\nデータがどのあたりに多く集まっているか、左右対称か、偏っているかなどを見るのに使います。","example":"クラスのテストの点数を、0〜9点、10〜19点…と区切り、それぞれに何人いるかを数えるのが度数分布です。","related":["W-397","W-411"],"sources":[{"title":"総務省統計局「なるほど統計学園」ヒストグラム","url":"https://www.stat.go.jp/naruhodo/4_graph/shokyu/histogram.html"}]},{"id":"W-402","term":"共分散","category":8,"short":"2つの数量が、一緒に同じ向きに変わるか、逆向きに変わるかを表す値。","body":"同じ向きに変わる傾向（片方が大きいとき、もう片方も大きい）があれば、プラスになります。\n逆の向きに変わる傾向があれば、マイナスになります。\n共分散を、それぞれの標準偏差の積で割ると、相関係数になります。","related":["W-403","W-399","W-422","W-400"],"sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"}]},{"id":"W-403","term":"相関係数","category":8,"short":"2つの数量が、どれくらい一緒に増えたり減ったりするかを、−1から1の数で表したもの。","body":"片方が増えると、もう片方も増える関係に近いほど、1に近づきます（正の相関）。\n片方が増えると、もう片方は減る関係に近いほど、−1に近づきます（負の相関）。\n0に近いときは、そうした直線的な関係がほとんどないことを表します。\n相関があっても、一方が他方の原因とは限らない点に注意が必要です（疑似相関）。","example":"身長が高い人ほど体重も重い傾向があるので、身長と体重の相関係数は正の値になります。","related":["W-402","W-404","W-405","W-400"],"sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"}]},{"id":"W-404","term":"疑似相関","aliases":["見せかけの相関"],"category":8,"short":"2つの数量に直接の関係がないのに、関係があるように見えてしまうこと。","body":"別の数量（第3の変数）が、2つの数量の両方に影響しているときなどに起こります。\nまったく関係のない数量でも、偶然に相関があるように見えることもあります。\n相関だけでは、因果関係（原因と結果の関係）は証明できません。","example":"アイスクリームの売上と水の事故の件数には正の相関があります。でもこれは、気温が高いとどちらも増えるためで、アイスが事故の原因ではありません。","related":["W-403","W-405"],"sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"},{"title":"\"Bayes Factor Functions for Testing Partial Correlation Coefficients\" (arXiv:2503.10787)","url":"https://arxiv.org/abs/2503.10787"}]},{"id":"W-405","term":"偏相関係数","category":8,"short":"第3の変数の影響を取り除いたうえで、2つの数量の関係の強さを表す値。","body":"疑似相関のように、第3の変数が2つの数量の両方に影響しているとき、その影響を除いて本当の関係を確かめるのに使います。","example":"アイスの売上と水の事故の関係を、気温の影響を取り除いて調べると、関係が弱くなることが考えられます。","related":["W-403","W-404"],"sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"},{"title":"\"Bayes Factor Functions for Testing Partial Correlation Coefficients\" (arXiv:2503.10787)","url":"https://arxiv.org/abs/2503.10787"}]},{"id":"W-406","term":"最小二乗法","category":8,"short":"実際の値と予測の値の差（誤差）を2乗して合計した値が、最も小さくなるように、式を決める方法。","body":"回帰分析で、データの点の集まりの「真ん中を通る線」を求めるのに使われます。\n差をそのまま足すとプラスとマイナスが打ち消し合うので、2乗してから合計します。\n線形回帰の代表的な求め方です。","related":["W-063","W-116","W-060"],"sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"},{"title":"scikit-learn User Guide 1.1 Linear Models（Ordinary Least Squares）","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-407","term":"移動平均","category":8,"short":"時系列データで、ある時点の値の代わりに、その時点を含む一定期間の平均を使う方法。","body":"細かな上下の変動をならして、全体の傾向をとらえやすくします。\nその時点と前後の時点の平均を使うものを、中央移動平均といいます。\n季節による変動をならす方法（季節調整）の一つとしても使われます。","example":"1月10、2月20、3月30、4月40 のとき、3月を中心とした3か月の移動平均は、（20＋30＋40）÷3＝30 です。","related":["W-203"],"sources":[{"title":"総務省統計局「なるほど統計学園」その他のデータ分析手法","url":"https://www.stat.go.jp/naruhodo/10_tokucho/sonota.html"}]},{"id":"W-408","term":"帰無仮説","category":8,"short":"統計的仮説検定で、確かめたい主張と反対の立場として立てる仮説。「差はない」「効果はない」などの形になる。","body":"データを見て、帰無仮説が正しいとしたら非常にまれなことが起きていれば、帰無仮説を捨てます（棄却）。\nそして、確かめたかった主張（対立仮説）を採ります。\n「まれ」かどうかの基準の確率を有意水準といい、0.05（5％）や0.01（1％）がよく使われます。","example":"「新しい薬は効くか」を確かめたいとき、帰無仮説は「新しい薬は効かない（前の薬と差がない）」です。","related":["W-409"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計的推定と統計的仮説検定","url":"https://www.stat.go.jp/naruhodo/11_tokusei/kentei.html"}]},{"id":"W-409","term":"対立仮説","category":8,"short":"統計的仮説検定で、本当に確かめたい主張を表す仮説。","body":"帰無仮説が棄却されたとき、対立仮説を採ります。\n確かめたい主張は、帰無仮説ではなく対立仮説のほうです。","example":"「新しい薬は効くか」を確かめたいとき、対立仮説は「新しい薬は効く（前の薬と差がある）」です。","related":["W-408"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計的推定と統計的仮説検定","url":"https://www.stat.go.jp/naruhodo/11_tokusei/kentei.html"}]},{"id":"W-410","term":"確率変数","category":8,"short":"サイコロの目のように、どの値をとるかが確率によって決まる変数。","body":"どの値になるかは確実にはわかりませんが、それぞれの値になる確率は決まっています。","example":"サイコロを振ったときに出る目は、1〜6の値をそれぞれ1/6の確率でとる確率変数です。","related":["W-411","W-413"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（か行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/ka-gyo.html"},{"title":"SciPy Documentation scipy.stats.rv_continuous.expect","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.expect.html"}]},{"id":"W-411","term":"確率分布","category":8,"short":"確率変数が、それぞれの値をどれくらいの確率でとるかを表したもの。","body":"サイコロの目のように、とる値がとびとびの場合と、身長のように連続した値をとる場合があります。\n連続した値の場合は、確率密度を使って表します。\n代表的なものに、正規分布、二項分布、ポアソン分布などがあります。","related":["W-410","W-412","W-415","W-417","W-418"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（か行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/ka-gyo.html"},{"title":"SciPy Documentation scipy.stats.rv_continuous.expect","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.expect.html"},{"title":"総務省統計局「なるほど統計学園」統計用語辞典（さ行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/sa-gyo.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"}]},{"id":"W-412","term":"確率密度","aliases":["確率密度関数"],"category":8,"short":"連続した値をとる確率変数で、ある値の付近がどれくらい出やすいかを表す値。","body":"身長のように連続した値では、「ちょうど170.000…cm」になる確率は0になってしまいます。\nそこで、値の付近の「出やすさの濃さ」を確率密度で表し、ある範囲に入る確率は、その範囲の面積で求めます。","related":["W-411","W-415","W-410"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（さ行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/sa-gyo.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"}]},{"id":"W-413","term":"期待値","category":8,"short":"確率変数がとる値に、その値をとる確率を掛けて、すべて足し合わせた値。平均的にどれくらいの値になるかを表す。","body":"何回も繰り返したときの、平均的な値を表します。\n期待値は、実際にとりうる値（サイコロなら1〜6の整数）である必要はありません。","example":"サイコロの目の期待値は、1×1/6＋2×1/6＋…＋6×1/6＝21÷6＝3.5 です。","related":["W-410","W-395"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（か行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/ka-gyo.html"},{"title":"SciPy Documentation scipy.stats.rv_continuous.expect","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.expect.html"}]},{"id":"W-414","term":"条件付き確率","category":8,"short":"あることが起きたという条件のもとで、別のことが起きる確率。","body":"「Aが起きたとき、Bが起きる確率」は、「AとBが両方起きる確率」÷「Aが起きる確率」で求められます。\nベイズの定理の土台になり、単純ベイズ分類器などの機械学習の方法でも使われます。","example":"社員100人のうち60人がアプリを使い、そのうち30人が毎日使っているなら、使っている人が毎日使っている確率は 30÷60＝0.5 です。","related":["W-411","W-061"],"sources":[{"title":"scikit-learn User Guide 1.9 Naive Bayes","url":"https://scikit-learn.org/stable/modules/naive_bayes.html"}]},{"id":"W-415","term":"正規分布","aliases":["ガウス分布"],"category":8,"short":"平均を中心に左右対称な、釣鐘の形をした確率分布。平均から離れるほど出にくくなる。","body":"データが平均のまわりに最も多く集まり、大きい方にも小さい方にも同じように離れるほど少なくなります。\n平均と標準偏差の2つで、形が決まります。\n人の身長など、自然や社会の多くの現象の分布は、正規分布に近くなることが知られています。","related":["W-400","W-411","W-412"],"sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（さ行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/sa-gyo.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"}]},{"id":"W-416","term":"ベルヌーイ分布","category":8,"short":"1回の試しで、成功（1）か失敗（0）のどちらかが起きるときの確率分布。","body":"成功の確率が決まれば、失敗の確率も決まります（1から成功の確率を引いた値）。\nこの試しを何回も繰り返したときの成功の回数は、二項分布に従います。","example":"コインを1回投げて、表なら1、裏なら0とするのが、ベルヌーイ分布の例です。","related":["W-417","W-411"],"sources":[{"title":"SciPy Documentation scipy.stats.binom","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html"},{"title":"SciPy Documentation scipy.stats.bernoulli","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bernoulli.html"}]},{"id":"W-417","term":"二項分布","category":8,"short":"成功の確率が同じ試しを、決まった回数くり返したときの、成功の回数の確率分布。","body":"ベルヌーイ分布に従う試しを、n回くり返したときの成功の回数を表します。","example":"表が出る確率が0.5のコインを3回投げて、表がちょうど2回出る確率は、並び方が3通りあるので、3×0.125＝0.375 です。","related":["W-416","W-418","W-411"],"sources":[{"title":"SciPy Documentation scipy.stats.binom","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html"},{"title":"SciPy Documentation scipy.stats.bernoulli","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bernoulli.html"}]},{"id":"W-418","term":"ポアソン分布","category":8,"short":"一定の時間や範囲の中で、めったに起きない出来事が何回起きるかを表す確率分布。","body":"起きる回数（0回、1回、2回…）の分布で、マイナスの値はとりません。\n平均の回数だけで、形が決まります。","example":"1時間にお店に来るお客さんの数や、1日に起きる事故の件数などを表すのに使われます。","related":["W-417","W-411"],"sources":[{"title":"SciPy Documentation scipy.stats.poisson","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.poisson.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"title":"SciPy Documentation scipy.stats.bernoulli","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bernoulli.html"}]},{"id":"W-419","term":"最尤法","aliases":["最尤推定","さいゆうほう"],"category":8,"short":"実際に手に入ったデータが得られる確率（尤度）が、最も大きくなるように、確率分布のパラメータを決める方法。","body":"「尤度（ゆうど）」は、「そのパラメータのもとで、今のデータが得られる確からしさ」です。\nパラメータを変えながら尤度を比べ、最も尤度が大きくなる値を推定値とします。","example":"コインを10回投げて7回表が出たとき、「表が出る確率」を0.7と推定するのは、この確率のときに「10回中7回表」が最も起きやすいからです。","related":["W-411","W-123"],"sources":[{"title":"SciPy Documentation scipy.stats.rv_continuous.fit","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.fit.html"}]},{"id":"W-420","term":"相互情報量","category":8,"short":"2つの確率変数が、どれくらい関係し合っているか（一方を知るともう一方がどれくらいわかるか）を表す値。","body":"常に0以上で、2つが無関係（独立）のときに、またそのときに限り0になります。\n相関係数が直線的な関係しかとらえられないのに対し、曲線的な関係など、より一般的な関係もとらえられます。\n機械学習では、予測に役立つ特徴量を選ぶのに使われます。","related":["W-403","W-059","W-410"],"sources":[{"title":"scikit-learn API sklearn.feature_selection.mutual_info_classif","url":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.mutual_info_classif.html"}]},{"id":"W-421","term":"ユークリッド距離","category":8,"short":"2つの点を結んだ、まっすぐな線の長さ（いわゆる直線距離）。","body":"各座標の差を2乗して合計し、その平方根をとって求めます。\nデータどうしの近さを測るのに使われます。","example":"点（1, 2）と点（4, 6）のユークリッド距離は、√(3²＋4²)＝√25＝5 です。","related":["W-422","W-423"],"sources":[{"title":"SciPy Documentation scipy.spatial.distance.euclidean","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.euclidean.html"},{"title":"SciPy Documentation scipy.spatial.distance.cityblock","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.cityblock.html"}]},{"id":"W-422","term":"マハラノビス距離","category":8,"short":"データの散らばり方や、項目どうしの関係（共分散）を考えに入れて測る距離。","body":"散らばりの大きい向きの差は小さく、散らばりの小さい向きの差は大きく評価します。\nそのため、データの分布の形に合わせた距離になります。","example":"身長と体重のデータでは、「背が高くて重い人」はよくいますが、「背が低くてとても重い人」は珍しいので、後者のほうが遠い（珍しい）と評価されます。","related":["W-421","W-402"],"sources":[{"title":"SciPy Documentation scipy.spatial.distance.cosine","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.cosine.html"},{"title":"SciPy Documentation scipy.spatial.distance.mahalanobis","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.mahalanobis.html"}]},{"id":"W-423","term":"コサイン類似度","category":8,"short":"2つのベクトル（数値の並び）の向きが、どれくらい近いかを表す値。同じ向きで1、逆向きで−1。","body":"ベクトルの長さではなく、向きの近さを表します。直角なら0になります。\n文書や単語のベクトルの似ている度合いを測るのに、よく使われます。","related":["W-421","W-276"],"sources":[{"title":"SciPy Documentation scipy.spatial.distance.cosine","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.cosine.html"},{"title":"SciPy Documentation scipy.spatial.distance.mahalanobis","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.mahalanobis.html"}]},{"id":"W-424","term":"個人情報保護法","aliases":["個人情報の保護に関する法律"],"category":9,"short":"個人情報を扱う事業者などが守るべきルールを定めた日本の法律。","body":"正式な名前は「個人情報の保護に関する法律」です。\n個人情報を取り扱うときの利用目的の特定、第三者への提供の制限、安全な管理などのルールを定めています。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-425","W-427","W-430","W-431","W-434","W-433"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-425","term":"個人情報","category":9,"short":"生きている個人に関する情報で、特定の個人を見分けられるもの。","body":"氏名や生年月日などから、特定の人がわかる情報です。\nほかの情報と簡単に照らし合わせて、特定の人がわかるものも含みます。\n顔の特徴のデータや旅券番号のような「個人識別符号」を含む情報は、それだけで個人情報になります。\n亡くなった人の情報は、原則として含まれません。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","example":"氏名と住所が書かれた顧客名簿は、個人情報の集まりです。","related":["W-426","W-427","W-429","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-426","term":"個人識別符号","category":9,"short":"顔や指紋の特徴のデータや、旅券番号などのように、それだけで特定の個人を見分けられる符号。","body":"体の特徴（顔、指紋など）をコンピュータで使える形にしたもので、本人を見分けられるものが含まれます。\n旅券番号や運転免許証番号のように、一人ひとりに割り当てられる番号も含まれます。\nどれが当たるかは、政令で決められています。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-425","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-427","term":"個人データ","category":9,"short":"コンピュータで検索できるように整理された個人情報の集まり（個人情報データベース等）に含まれる個人情報。","body":"個人情報のうち、データベースなどに整理されて入っているものが個人データです。\n第三者への提供の制限などのルールは、個人データを対象にしています。\n個人情報 ⊃ 個人データ ⊃ 保有個人データ という関係になります。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-425","W-428","W-431","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-428","term":"保有個人データ","category":9,"short":"事業者が、本人からの開示、訂正、消去などの求めに応じる権限を持っている個人データ。","body":"本人から「自分のデータを見せてほしい」と求められたときなどに、応じる対象になるデータです。\n委託を受けて預かっているだけで、開示などの権限がないデータは、預かっている側の保有個人データには当たりません。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-427","W-425","W-432","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-429","term":"要配慮個人情報","category":9,"short":"人種、信条、病歴、犯罪の経歴など、差別や偏見につながらないように、特に注意して扱う必要がある個人情報。","body":"法令に基づく場合などの例外を除き、取得するときは、あらかじめ本人の同意が必要です。\n本人が断らない限り提供できる「オプトアウト」という手続では、第三者に提供できません。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-425","W-431","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-430","term":"利用目的","category":9,"short":"事業者が、個人情報を何のために使うかという目的。できる限り具体的に決める必要がある。","body":"個人情報を扱うときは、利用目的をできる限り特定しなければなりません。\n取得したときは、原則として、本人に知らせるか、公表する必要があります。\n利用目的を超えて使うときは、原則として本人の同意が必要です。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","example":"「事業に使うため」のようなあいまいな書き方ではなく、「商品の発送と、新商品のお知らせのため」のように具体的に決めます。","related":["W-425","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-431","term":"第三者提供","category":9,"short":"個人データを、本人と事業者以外の人や会社に渡すこと。原則として本人の同意が必要。","body":"法令に基づく場合などの例外を除き、あらかじめ本人の同意を得ないで、個人データを第三者に渡してはいけません。\nただし、仕事を任せる（委託する）ために渡す場合は、渡し先は「第三者」に当たらないとされています。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-432","W-427","W-429","W-434","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"},{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"}],"timeSensitive":true},{"id":"W-432","term":"委託","category":9,"short":"個人データの取り扱いの一部または全部を、ほかの会社などに任せること。","body":"利用目的の範囲内で取り扱いを任せるために個人データを渡す場合、任された先（委託先）は「第三者」に当たりません。\nそのため、本人の同意は不要ですが、任せた側は、委託先がデータを安全に扱うよう監督する必要があります。\n委託先が、そのデータを自分の別の目的に使うことは、委託の範囲を超えます。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","example":"AIの開発をベンダに任せて顧客データを渡す場合、利用目的の範囲内で任せるなら委託になります。","related":["W-431","W-427","W-430","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"},{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"}],"timeSensitive":true},{"id":"W-433","term":"仮名加工情報","category":9,"short":"ほかの情報と照らし合わせない限り、誰のことかわからないように加工した個人に関する情報。","body":"氏名などの一部を消したり、別の記号に置き換えたりして作ります。\n主に社内での分析に使うことが想定されています。\n法令に基づく場合を除き、第三者に渡してはいけません。誰の情報かを突き止めるために、ほかの情報と照らし合わせることも禁止されています。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","related":["W-434","W-425","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-434","term":"匿名加工情報","category":9,"short":"誰のことかわからないように加工し、元にも戻せないようにした、個人に関する情報。","body":"個人情報保護法で決められている言葉です。\n名前を消したり、細かすぎる情報をぼかしたりして、特定の人がわからないようにします。さらに元の情報に戻せない状態にしたものが、匿名加工情報です。\n含まれる項目を公表するなどの手続きを守れば、本人の同意がなくても、ほかの会社に渡せます。\n作った会社も、誰の情報かを突き止めようとしてはいけません。\n似た言葉の仮名加工情報は、ほかの情報と照らし合わせれば誰かわかる状態のもので、主に社内の分析に使います。\n個人情報保護法は、2026年7月に改正法が公布されています（2028年7月16日までに施行予定）。この説明は、基準日時点で施行されている内容です。","example":"買い物の記録から名前や住所を消し、年齢を「30代」のようにまとめて、商品開発の調査用に他社へ提供する場合です。","related":["W-433","W-425","W-426","W-431","W-424"],"sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-435","term":"GDPR","aliases":["一般データ保護規則","General Data Protection Regulation"],"category":9,"short":"EU（ヨーロッパ連合）の、個人データの保護に関するルール。EU外の会社にも適用されることがある。","body":"EUの中に拠点がない会社でも、EUの中にいる人に商品やサービスを提供する場合などには適用されます。そのため、日本の会社も対象になることがあります。\n個人データには、氏名などのほか、位置データやオンラインの識別子なども含まれます。\n人間が関わらない自動処理だけで、本人に重大な影響のある決定をされない権利も定めています。\nEUは2019年に、日本が十分なレベルで個人データを保護しているとする「十分性認定」を行っています。","related":["W-424","W-427"],"sources":[{"title":"EUR-Lex \"Regulation (EU) 2016/679 (General Data Protection Regulation)\"","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679"},{"title":"EUR-Lex \"Commission Implementing Decision (EU) 2019/419\"（日本の十分性認定）","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019D0419"}],"timeSensitive":true},{"id":"W-436","term":"著作物","category":9,"short":"思想や感情を、創作的に表現したもの。文芸、学術、美術、音楽などの作品。","body":"著作権法で守られる対象です。\nただの事実やデータ、表現になっていないアイデアそのものは、著作物に当たりません。\n著作物であるためには、表現に創作性があることが必要です。","example":"小説、絵、写真、音楽、プログラムなどは著作物になりえます。「東京タワーの高さは333m」という事実は著作物ではありません。","related":["W-437","W-438","W-439"],"sources":[{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true},{"id":"W-437","term":"創作性","category":9,"short":"作った人の個性が、表現に表れていること。著作物として守られるための条件の一つ。","body":"ありふれた表現や、誰が書いても同じになる表現には、創作性は認められにくくなります。\nAIで作ったもの（AI生成物）が著作物になるかどうかも、人の創作的な関わり（創作的寄与）があるかで判断されます。","related":["W-436","W-439"],"sources":[{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true},{"id":"W-438","term":"著作権","category":9,"short":"著作物を作った人（著作者）が持つ、作品の使われ方を決める権利。","body":"著作物を作った時点で、登録などの手続なしに、自動的に生まれます。\n原則として、著作者が亡くなった後70年まで続きます。\nAIは法的な人格を持たないので、著作者にはなりません。","related":["W-436","W-440","W-441","W-443"],"sources":[{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"e-Gov法令検索「刑法」（明治40年法律第45号）","url":"https://laws.e-gov.go.jp/law/140AC0000000045"},{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true},{"id":"W-439","term":"AI生成物","category":9,"short":"生成AIを使って作られた文章や画像などのこと。","body":"文化庁の考え方では、AIへの指示が、表現に至らないアイデアにとどまる場合、AI生成物は著作物とは認められないとされています。\n詳しく具体的な指示を出す、生成物を見ながら指示を直して何度も試す、といった人の創作的な関わりが積み重なると、著作物と認められることもあります。\nただ回数を多く試すだけや、たくさんの中から選ぶだけでは、創作的な関わりとはいえないとされています。\n人が、AI生成物に創作的な手直しを加えた部分は、ふつう著作物として認められます。","related":["W-436","W-437","W-440","W-055"],"sources":[{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true},{"id":"W-440","term":"著作権侵害","category":9,"short":"著作権者の許しを得ずに、著作物を著作権法に反する形で使うこと。","body":"既存の著作物と似ていること（類似性）と、それをもとにして作ったこと（依拠性）の両方が認められると、著作権侵害になります。\n生成AIで作ったものでも、人がAIを使わずに作る場合と同じように判断されます。\n作風や画風のようなアイデアが似ているだけでは、侵害とは認められないと考えられています。","related":["W-438","W-439","W-441","W-436","W-055"],"sources":[{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true},{"id":"W-441","term":"著作権法第30条の4","aliases":["30条の4","情報解析"],"category":9,"short":"作品を楽しむ目的ではない使い方（AIの学習のための情報解析など）なら、原則として許可なく著作物を使えるという規定。","body":"著作物に表現された思想や感情を「楽しむ（享受する）」ことを目的としない使い方を認めています。\nその例として、大量の情報から要素を取り出して比べたり分類したりする「情報解析」が挙げられています。\nただし、著作権者の利益を不当に害する場合は認められません。\n使う目的の中に、一つでも楽しむ目的が含まれていれば、この規定は使えません。","related":["W-438","W-440","W-442","W-436"],"sources":[{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true},{"id":"W-442","term":"利用規約","category":9,"short":"サービスやデータを使うときのルールを、提供する側が定めたもの。","body":"AIのサービスを使うときは、入力したデータがどう扱われるか（学習に使われるかなど）を、利用規約で確かめることが大切です。\n利用規約は、提供する側によって変更されることがあります。日本の民法では、一定の条件を満たせば、一人ひとりの同意がなくても変更できる場合があります。\nそのため、使う側は、変更の状況を定期的に確かめる体制を整えることが望ましいとされています。","related":["W-462","W-463"],"sources":[{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"},{"title":"e-Gov法令検索「民法」（明治29年法律第89号）","url":"https://laws.e-gov.go.jp/law/129AC0000000089"}],"timeSensitive":true},{"id":"W-443","term":"知的財産権","category":9,"short":"人が考え出したアイデアや作品などを守るための権利の総称。特許権や著作権などがある。","body":"特許権：発明を守ります。特許庁に出願し、審査を経て登録されると生まれます。\n著作権：作品の表現を守ります。作った時点で、手続なしに生まれます。\n営業秘密は、不正競争防止法で守られます。秘密として管理している間、不正な持ち出しなどから守られます。","related":["W-447","W-438","W-451","W-444","W-450"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"},{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true},{"id":"W-444","term":"発明","category":9,"short":"特許法では、自然法則を利用した、技術的なアイデアの創作のうち、高度なもの。","body":"自然法則を利用していない人の決め事（ゲームのルールなど）そのものは、発明に当たりません。\n特許を受けるには、新規性や進歩性などの条件を満たす必要があります。","related":["W-445","W-446","W-447","W-448"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true},{"id":"W-445","term":"新規性","category":9,"short":"特許の条件の一つ。出願する前に、世の中に知られていない発明であること。","body":"出願前に、すでに公に知られていたり、使われていたり、本やインターネットで公開されていたりする発明は、特許を受けられません。\nただし、一定の条件のもとで、自分で公開した場合の例外の規定もあります。","related":["W-446","W-444","W-447"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true},{"id":"W-446","term":"進歩性","category":9,"short":"特許の条件の一つ。その分野の専門家が、すでにある技術から簡単には思いつけない発明であること。","body":"新しくても、すでにある技術を少し組み合わせただけのように、専門家なら簡単に考えつくものは、特許を受けられません。","related":["W-445","W-444","W-447"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true},{"id":"W-447","term":"特許権","category":9,"short":"発明を、決まった期間、独占して使える権利。原則として出願から20年続く。","body":"特許庁に出願し、審査を経て登録されることで生まれます。\n出願から1年6か月たつと、出願の内容は公開されます。発明を公開する代わりに、独占して使える権利を得る仕組みです。\n発明を秘密のまま守りたい場合は、営業秘密として管理する方法もあります。","related":["W-444","W-445","W-446","W-449","W-443","W-451"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"},{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true},{"id":"W-448","term":"発明者","category":9,"short":"実際にその発明をした人。","body":"特許を受ける権利は、原則として発明者に生まれます。\n会社の仕事として行った発明（職務発明）については、あらかじめ決めておけば、その権利を会社に持たせることができます。","related":["W-449","W-444"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true},{"id":"W-449","term":"職務発明","category":9,"short":"会社などで働く人が、会社の仕事として行った発明。","body":"会社の業務の範囲に入り、しかもその人の仕事として行った発明が、職務発明です。\n契約や勤務の規則であらかじめ決めておけば、特許を受ける権利は、生まれた時から会社のものになります。\nその場合、発明した人は、お金などの「相当の利益」を受ける権利を持ちます。","related":["W-448","W-447","W-444"],"sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true},{"id":"W-450","term":"不正競争防止法","category":9,"short":"会社どうしの公正な競争を守るため、営業秘密の不正な持ち出しなどを禁止している日本の法律。","body":"営業秘密や限定提供データを、不正に手に入れたり使ったりする行為を、不正競争として禁止しています。\n登録などの手続がなくても、条件を満たせば守られます。","related":["W-451","W-452"],"sources":[{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true},{"id":"W-451","term":"営業秘密","category":9,"short":"秘密として管理され、事業に役立ち、世の中に知られていない、技術や営業の情報。","body":"不正競争防止法で守られるには、次の3つの条件（三要件）を満たす必要があります。\n秘密管理性（秘密として管理されている）、有用性（事業に役立つ）、非公知性（世の中に知られていない）です。\nAIの学習用データや学習済みモデル、ノウハウなども、条件を満たせば営業秘密として守られます。\n秘密でなくなれば（外に漏れて知られれば）、守られなくなります。","related":["W-452","W-447","W-450"],"sources":[{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true},{"id":"W-452","term":"限定提供データ","category":9,"short":"会員などの決まった相手に提供するために、電子的に大量にためて管理しているデータ。不正競争防止法で守られる。","body":"データを他の会社などに提供して、活用が進むことを想定して作られた仕組みです。\n業として特定の相手に提供すること、電子的に相当な量をためていること、電子的に管理していること、が条件です。\n営業秘密に当たるものは除かれます。","example":"会員に有料で提供している、大量の地図のデータや気象のデータなどが想定されます。","related":["W-451","W-450"],"sources":[{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true},{"id":"W-453","term":"独占禁止法","aliases":["私的独占の禁止及び公正取引の確保に関する法律","独禁法"],"category":9,"short":"公正で自由な競争を守るため、私的独占や、会社どうしで価格を決めるカルテルなどを禁止している日本の法律。","body":"私的独占、不当な取引制限（カルテルなど）、不公正な取引方法を禁止しています。\nAIやアルゴリズムを使った事業にも適用されます。\n公正取引委員会は、生成AIをめぐる競争の問題についても調べ、報告書を出しています。","related":["W-454","W-455","W-055"],"sources":[{"title":"e-Gov法令検索「私的独占の禁止及び公正取引の確保に関する法律」（昭和22年法律第54号）","url":"https://laws.e-gov.go.jp/law/322AC0000000054"},{"title":"公正取引委員会「生成AIに関する実態調査報告書 ver.2.0」（令和8年4月）","url":"https://www.jftc.go.jp/houdou/pressrelease/2026/apr/260416_generativeai02.pdf"}],"timeSensitive":true},{"id":"W-454","term":"競争制限","aliases":["競争の実質的制限"],"category":9,"short":"ある市場での競争を、実質的に制限すること。私的独占や不当な取引制限が違法になるかどうかの基準。","body":"独占禁止法では、私的独占や不当な取引制限（カルテルなど）は、一定の市場での競争を実質的に制限するものが対象になります。\n公正取引委員会は、生成AIの基になるデータやアルゴリズムが共通になることで、会社どうしの価格の決め方などが似てしまい、競争に影響する可能性を論点に挙げています。","related":["W-455","W-453","W-055"],"sources":[{"title":"e-Gov法令検索「私的独占の禁止及び公正取引の確保に関する法律」（昭和22年法律第54号）","url":"https://laws.e-gov.go.jp/law/322AC0000000054"},{"title":"公正取引委員会「生成AIに関する実態調査報告書 ver.2.0」（令和8年4月）","url":"https://www.jftc.go.jp/houdou/pressrelease/2026/apr/260416_generativeai02.pdf"}],"timeSensitive":true},{"id":"W-455","term":"公正競争阻害性","category":9,"short":"公正な競争を妨げるおそれがあること。不公正な取引方法が違法になるかどうかの基準。","body":"独占禁止法の「不公正な取引方法」は、公正な競争を妨げるおそれ（公正競争阻害性）があるものが対象です。\n競争を実質的に制限するほどでなくても、このおそれがあれば問題になりえます。","related":["W-454","W-453"],"sources":[{"title":"e-Gov法令検索「私的独占の禁止及び公正取引の確保に関する法律」（昭和22年法律第54号）","url":"https://laws.e-gov.go.jp/law/322AC0000000054"}],"timeSensitive":true},{"id":"W-456","term":"AI・データの利用に関する契約ガイドライン","aliases":["契約ガイドライン"],"category":9,"short":"経済産業省が、AIの開発やデータの利用に関する契約の考え方をまとめた手引き。","body":"AI編では、AIのモデル作りを、アセスメント、PoC、開発、追加学習の段階に分けて進める方式（探索的段階型）を勧めています。\n段階ごとに、秘密保持契約、導入検証契約、ソフトウェア開発契約などを結ぶ形を示しています。\n2025年には、生成AIの普及を踏まえた「AIの利用・開発に関する契約チェックリスト」も公表されました。","related":["W-377","W-457","W-459","W-460","W-373","W-055"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"},{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"}],"timeSensitive":true},{"id":"W-457","term":"NDA","aliases":["秘密保持契約","Non-Disclosure Agreement"],"category":9,"short":"取引の中で知った相手の秘密の情報を、外に漏らさないことを約束する契約。秘密保持契約ともいう。","body":"AIの開発では、最初のアセスメントの段階で、ベンダがユーザと結んでから、ユーザのデータを受け取ります。","related":["W-456","W-377"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"timeSensitive":true},{"id":"W-458","term":"請負契約","category":9,"short":"決められた仕事を完成させることを約束し、その結果に対してお金を払う契約。","body":"仕事を完成させる責任を負います（民法第632条）。\n仕様が決まった通常のソフトウェアの開発の工程では、請負型の契約が合っていることが多いとされています。\n一方、AIのモデル作りは、仕様や完成の基準を事前に決めにくいため、請負型にはなじみにくいとされています。","related":["W-459","W-460"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"},{"title":"e-Gov法令検索「民法」（明治29年法律第89号）","url":"https://laws.e-gov.go.jp/law/129AC0000000089"}],"timeSensitive":true},{"id":"W-459","term":"準委任契約","category":9,"short":"仕事の完成ではなく、決められた作業（事務）を行うこと自体を約束する契約。","body":"完成を約束するのではなく、専門家として求められる注意を払いながら作業を行う責任（善良な管理者の注意）を負います（民法第644条、第656条）。\n経済産業省の契約ガイドラインは、AIのモデル作りでは、どの段階でも準委任型の契約が合っているとしています。","related":["W-458","W-460","W-456"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"},{"title":"e-Gov法令検索「民法」（明治29年法律第89号）","url":"https://laws.e-gov.go.jp/law/129AC0000000089"}],"timeSensitive":true},{"id":"W-460","term":"精度保証","aliases":["性能保証"],"category":9,"short":"AIのモデルが、決めた精度（性能）を出すことを約束すること。","body":"AIのモデルは、見たことのない新しいデータに対して、想定外の動きをしないと保証するのが難しいとされています。\nただし、決まった評価用のデータに対する性能なら、条件を適切に決めれば、保証に合理性がある場合もあります。\n契約のときは、何を、どんな条件で保証するのかを、はっきり決めておくことが大切です。","related":["W-459","W-458","W-462"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"timeSensitive":true},{"id":"W-461","term":"保守契約","aliases":["保守運用契約"],"category":9,"short":"納品した後のシステムやモデルの手入れ（不具合の修正、学習し直しなど）について定める契約。","body":"AIのモデルは、使い続けるうちに周りの変化で性能が落ちることがあるため、納品後の手入れが大切です。\n経済産業省の契約ガイドラインでは、納品したモデルに追加のデータで学習させる「追加学習」について、保守運用契約の中で定めることなどが考えられるとしています。","related":["W-456","W-376"],"sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"timeSensitive":true},{"id":"W-462","term":"SaaS","aliases":["Software as a Service","サース"],"category":9,"short":"ソフトウェアを自分で持たずに、インターネットを通じてサービスとして使う形。","body":"提供する会社が決めた利用規約に従って使うことが多くあります。\nAIのサービスでは、入力したデータの扱いや、利用規約の変更などに注意が必要です。\n提供する会社が海外にある場合は、海外の法律が利用規約の決まり（準拠法）とされることが多いため、確かめることが望ましいとされています。","related":["W-442","W-463","W-390","W-389"],"sources":[{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"},{"title":"e-Gov法令検索「民法」（明治29年法律第89号）","url":"https://laws.e-gov.go.jp/law/129AC0000000089"}],"timeSensitive":true},{"id":"W-463","term":"データ利用権","category":9,"short":"提供したデータや、そこから作られた成果物を、誰がどこまで使えるかという権利や条件。","body":"AIのサービスに入力したデータが、サービスの改良（汎用的なAIの学習）に使われる場合、一度学習に取り込まれた情報を取り除くのは一般に難しいとされています。\nそのため、不要な情報を入力に含めないことが基本とされています。\n契約では、入力したデータや作られた成果物を、誰がどこまで使えるのかをはっきり決めておくことが大切です。","related":["W-442","W-462","W-456"],"sources":[{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"},{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"timeSensitive":true},{"id":"W-508","term":"AI事業者ガイドライン","category":10,"short":"AIを開発・提供・利用する事業者向けに、総務省と経済産業省が望ましい取り組みをまとめた手引き。","body":"法的な拘束力のない「ソフトロー」として作られています。\n「人間中心」「安全性」「公平性」「プライバシー保護」「透明性」など、10項目の共通の指針を示しています。\n技術や社会の変化に合わせて改訂が続けられており、第1.2版は2026年3月に公表されました。","related":["W-468","W-465","W-466","W-469","W-477"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"e-Gov法令検索「人工知能関連技術の研究開発及び活用の推進に関する法律」（令和7年法律第53号）","url":"https://laws.e-gov.go.jp/law/507AC0000000053"}],"timeSensitive":true},{"id":"W-509","term":"EU AI法","aliases":["AI Act"],"category":10,"short":"EU（ヨーロッパ連合）が定めた、AIについての法的な拘束力のあるルール。リスクの大きさに応じて規制する。","body":"法的な拘束力を持つ「ハードロー」の代表例です。\n許されないリスクのAIは禁止し、リスクの高いAIには満たすべき条件を定め、一部のAIには透明性の義務を定めています。\nディープフェイクを作るAIを使う人には、AIで作ったものであることを示す義務があります。\n軍事や国防の目的だけで使うAIには、適用されません。","related":["W-467","W-469","W-484","W-498"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"}],"timeSensitive":true},{"id":"W-510","term":"AI推進法","category":10,"short":"日本で2025年に成立した、AIの研究開発と活用を進めるための法律。罰則はない。","body":"正式な名前は「人工知能関連技術の研究開発及び活用の推進に関する法律」です。\n内閣に人工知能戦略本部を置くことや、国が国際的な規範に沿った指針を整えることなどを定めています。\nAIが不正な目的や不適切な方法で使われないよう、透明性の確保などの施策を講じることも基本理念に含まれています。\n罰則の規定はありません。","related":["W-468","W-508","W-509","W-466"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"e-Gov法令検索「人工知能関連技術の研究開発及び活用の推進に関する法律」（令和7年法律第53号）","url":"https://laws.e-gov.go.jp/law/507AC0000000053"}],"timeSensitive":true},{"id":"W-464","term":"AI倫理","category":10,"short":"AIを作ったり使ったりするときに、人や社会に害を与えないために考えるべき、善悪や価値の問題。","body":"公平性、プライバシー、安全性、透明性、人間の尊厳などが、主な論点です。\n日本の「人間中心のAI社会原則」やAI事業者ガイドラインなど、国内外でさまざまな指針が作られています。","related":["W-466","W-465","W-508","W-468","W-477"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true},{"id":"W-465","term":"AIガバナンス","category":10,"short":"AIのリスクを抑えながら便益を生かすために、組織としてルールや体制を整え、運用して見直していく取り組み。","body":"経営層のリーダーシップのもとで、目標（AIポリシーなど）を決め、仕組みを作り、運用し、評価して見直します。\n技術や社会の変化に合わせて、仕組みを素早く見直していく考え方を、アジャイル・ガバナンスといいます。","related":["W-500","W-502","W-503","W-505","W-508","W-379"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true},{"id":"W-466","term":"価値原則","aliases":["人間中心のAI社会原則","基本理念"],"category":10,"short":"AIを使う社会が大切にすべき価値。日本の「人間中心のAI社会原則」では3つの価値を掲げている。","body":"2019年に日本政府が策定した「人間中心のAI社会原則」は、次の3つの価値を基本理念として掲げています。\n人間の尊厳が尊重される社会、多様な背景を持つ人々が多様な幸せを追求できる社会、持続可能な社会です。\nAI事業者ガイドラインも、これを基本理念として引き継いでいます。","related":["W-464","W-496","W-497","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true},{"id":"W-467","term":"ハードロー","category":10,"short":"法律のように、法的な拘束力があり、違反すると罰などを受けうるルール。","body":"EUのAI法（AI Act）は、AIについてのハードローの例です。\n守らせる力は強い一方で、作ったり変えたりするのに時間がかかり、技術の進歩に追いつきにくい面もあります。","related":["W-468","W-509"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"e-Gov法令検索「人工知能関連技術の研究開発及び活用の推進に関する法律」（令和7年法律第53号）","url":"https://laws.e-gov.go.jp/law/507AC0000000053"}],"timeSensitive":true},{"id":"W-468","term":"ソフトロー","category":10,"short":"ガイドラインや業界の自主ルールのように、法的な拘束力はないが、関係者の自主的な取り組みを促すルール。","body":"日本のAI事業者ガイドラインは、ソフトローとして作られています。\n法律の整備が技術の進歩に追いつかないことや、細かすぎる規制が新しい技術の開発を妨げるおそれがあることが、理由として挙げられています。","related":["W-467","W-508","W-510"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"e-Gov法令検索「人工知能関連技術の研究開発及び活用の推進に関する法律」（令和7年法律第53号）","url":"https://laws.e-gov.go.jp/law/507AC0000000053"}],"timeSensitive":true},{"id":"W-469","term":"リスクベースアプローチ","category":10,"short":"AIがもたらすリスクの大きさに応じて、対策やルールの厳しさを変える考え方。","body":"すべてのAIに同じ厳しさの規制をかけるのではなく、リスクの大きいものほど厳しく扱います。\nEUのAI法も、この考え方で、禁止するAI、条件を課すAI、透明性の義務を課すAIに分けています。\nAI事業者ガイドラインは、リスクがゼロになるまでAIを使わない、という姿勢は適切ではないとしています。","related":["W-509","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"}],"timeSensitive":true},{"id":"W-470","term":"カメラ画像利活用ガイドブック","category":10,"short":"店舗などでカメラの画像を商用目的で使う事業者が、人々のプライバシーに配慮するための手引き。経済産業省と総務省が作成。","body":"設計、事前の告知、取得、取り扱い、管理などの段階ごとに、配慮すべきことを整理しています。\n撮影を始める前に、利用目的や連絡先などを、十分な期間をもって知らせることが求められています。\nすでに撮った画像を新しい目的で使う場合は、写っている人の同意を改めて得る必要があるため、基本的に使えないとされています。","related":["W-471","W-430"],"sources":[{"title":"IoT推進コンソーシアム・総務省・経済産業省「カメラ画像利活用ガイドブック ver3.0」（令和4年3月）","url":"https://www.meti.go.jp/policy/it_policy/privacy/01_CameraGuideBook_ver3.0.pdf"}],"timeSensitive":true},{"id":"W-471","term":"プライバシー・バイ・デザイン","category":10,"short":"問題が起きてから対応するのではなく、システムの企画や設計の段階から、プライバシーの保護を組み込んでおく考え方。","body":"AI事業者ガイドラインでは、個人情報へのアクセスを管理・制限する仕組みを、システムの実装の過程で取り入れることなどが示されています。","related":["W-483","W-470","W-508","W-425"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"IoT推進コンソーシアム・総務省・経済産業省「カメラ画像利活用ガイドブック ver3.0」（令和4年3月）","url":"https://www.meti.go.jp/policy/it_policy/privacy/01_CameraGuideBook_ver3.0.pdf"}],"timeSensitive":true},{"id":"W-472","term":"データの偏り","category":10,"short":"学習データに、特定の属性のデータが多すぎたり少なすぎたりして、現実を正しく映していないこと。","body":"偏ったデータで学習すると、AIの出力も偏り、差別的な結果につながることがあります。\nラベルを付ける人の思い込みが、データに入り込むこともあります。","example":"過去10年分の応募書類のほとんどが男性のものだったため、採用AIが女性を不利に評価するようになった事例が報告されています。","related":["W-473","W-474","W-477"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"}]},{"id":"W-473","term":"サンプリングバイアス","aliases":["サンプリング・バイアス","標本の偏り"],"category":10,"short":"データを集めるときに、一部の集団から偏って集めてしまうことで生じる偏り。","body":"無作為ではない集め方をすると、ある集団で見つけた傾向が、別の集団には当てはまらなくなります。","example":"平日の昼にだけアンケートをとると、昼に働いている人の意見が入りにくくなります。","related":["W-472","W-474"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"}]},{"id":"W-474","term":"アルゴリズムバイアス","category":10,"short":"データではなく、AIの計算の仕組み（アルゴリズム）の作り方によって生じる偏り。","body":"入力のデータに偏りがなくても、最適化の方法などの設計の選び方によって、結果に偏りが加わることがあります。","related":["W-472","W-473","W-477"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"}]},{"id":"W-475","term":"センシティブ属性","aliases":["保護属性"],"category":10,"short":"人種、性別、宗教などのように、差別につながるおそれがあり、扱いに注意が必要な属性。","body":"センシティブ属性をデータから取り除いても、それと関係の深い別の項目（代理変数）から類推されてしまうことがあります。\nまた、複数の属性の組み合わせによって、偏りが生じることもあります（交差バイアス）。","related":["W-476","W-477"],"sources":[{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}]},{"id":"W-476","term":"代理変数","aliases":["プロキシ変数"],"category":10,"short":"センシティブ属性などの代わりとして、結果的に働いてしまう別の項目（変数）。","body":"人種の列をデータから消しても、人種と関係の深い別の項目があると、それが人種の代わりになって、差別的な結果が残ることがあります。","example":"住んでいる地域の郵便番号が、人種と関係が深い場合、ローンの審査に使うと、人種による差別につながるおそれがあると指摘されています。","related":["W-475","W-477"],"sources":[{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}]},{"id":"W-477","term":"公平性の定義","aliases":["公平性"],"category":10,"short":"AIの予測が公平かどうかを判断するための、いくつもの考え方。どれを重視するかは場面によって変わる。","body":"属性に関係なく、陽性と予測される割合を等しくする考え方（Demographic Parity）があります。\n実際の正解が同じ人どうしで、予測の当たり方を等しくする考え方（Equalized Odds）もあります。\nこれらは別の条件を求めていて、一般にはすべてを同時に満たせない場合があります。","related":["W-475","W-472","W-474"],"sources":[{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"},{"title":"Moritz Hardt ほか \"Equality of Opportunity in Supervised Learning\" (arXiv:1610.02413)","url":"https://arxiv.org/abs/1610.02413"}]},{"id":"W-478","term":"Adversarial Attack（Adversarial Examples）","aliases":["Adversarial Attack","Adversarial Examples","敵対的攻撃","敵対的サンプル"],"category":10,"short":"人にはほとんどわからない小さなノイズを入力に加えて、AIに自信満々で間違った予測をさせる攻撃。","body":"ノイズを加えたデータを、敵対的サンプルといいます。\nある研究では、「パンダ」と認識されていた画像に小さなノイズを加えると、「テナガザル」と高い確信度で誤認識されました。\n敵対的サンプルを学習に加える（敵対的学習）ことで、モデルを強くできます。","related":["W-479","W-483"],"sources":[{"title":"Ian J. Goodfellow ほか \"Explaining and Harnessing Adversarial Examples\" (arXiv:1412.6572)","url":"https://arxiv.org/abs/1412.6572"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-479","term":"データ汚染","aliases":["データポイズニング"],"category":10,"short":"学習データに不正なデータを混ぜ込んで、AIの性能を落としたり、間違った判断をさせたりする攻撃。","body":"あるチャットボットが、悪意のある人たちに組織的に教え込まれて、差別的な発言をするようになった事例があります。","related":["W-480","W-478"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-480","term":"モデル汚染","aliases":["モデルポイズニング"],"category":10,"short":"学習済みのモデルそのものに細工をして、攻撃する人の思いどおりの動きをさせる攻撃。","body":"外部から手に入れた学習済みモデルに、細工がされている場合などが考えられます。","related":["W-479"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-481","term":"モデル窃取","aliases":["モデル抽出攻撃"],"category":10,"short":"公開されているAIに何度も問い合わせて、その入力と出力から、モデルの機能をまねして盗む攻撃。","body":"攻撃する人がモデルの中身を知らなくても、問い合わせの結果から、同じような働きのモデルを作れてしまうことがあります。\n対策として、問い合わせの回数を制限する、出力する情報を加工する、などがあります。","related":["W-482"],"sources":[{"title":"Florian Tramèr ほか \"Stealing Machine Learning Models via Prediction APIs\" (arXiv:1609.02943)","url":"https://arxiv.org/abs/1609.02943"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-482","term":"データ窃取","category":10,"short":"AIへの攻撃によって、学習に使われたデータの情報を漏れさせること。","body":"学習データに医療の情報などのセンシティブな情報が含まれていると、プライバシーの侵害などにつながるおそれがあります。\n対策として、プライバシーを守りながら学習する方法などがあります。","related":["W-481"],"sources":[{"title":"Florian Tramèr ほか \"Stealing Machine Learning Models via Prediction APIs\" (arXiv:1609.02943)","url":"https://arxiv.org/abs/1609.02943"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-483","term":"セキュリティ・バイ・デザイン","category":10,"short":"問題が起きてから対応するのではなく、システムの企画や設計の段階から、セキュリティ対策を組み込んでおく考え方。","body":"AI事業者ガイドラインでは、AIシステムの開発の過程を通じて、使う技術の特性に合わせて適切にセキュリティ対策を講じることが示されています。","related":["W-471","W-478","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"IoT推進コンソーシアム・総務省・経済産業省「カメラ画像利活用ガイドブック ver3.0」（令和4年3月）","url":"https://www.meti.go.jp/policy/it_policy/privacy/01_CameraGuideBook_ver3.0.pdf"}],"timeSensitive":true},{"id":"W-484","term":"ディープフェイク","aliases":["deep fake"],"category":10,"short":"実在する人や出来事に似せて、AIで作ったり加工したりした、本物のように見える画像・音声・映像。","body":"偽の画像や動画が、情報操作や世論の誘導に悪用される例が、各国で相次いでいます。\nEUのAI法は、ディープフェイクを作るAIを使う人に、AIで作ったものであることを示す義務を定めています。","example":"「国防総省の近くで爆発が起きた」とする偽の画像がSNSで広がり、株価が一時下がった事例があります。","related":["W-485","W-509"],"sources":[{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true},{"id":"W-485","term":"フェイクニュース","aliases":["偽情報"],"category":10,"short":"事実と違う情報を、ニュースのように広めること。また、その情報。","body":"AIの普及以前からある問題ですが、生成AIによって、本物らしい偽情報を大量に作りやすくなったことが心配されています。\n選挙のように、社会に大きな影響を与える場面では、特に注意が必要です。","related":["W-484","W-489","W-490","W-055"],"sources":[{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-486","term":"ブラックボックス","category":10,"short":"中でどんな処理をしているかが、外からはわからない状態。複雑なAIの判断の理由がわかりにくいことを指す。","body":"ディープラーニングのような複雑なモデルは、判断の根拠が人にわかりにくくなりがちです。\n理由を説明できないと、差別の疑いがかけられたときに答えられない、といった問題が起きます。","example":"同じ年収の男性と女性で、女性のクレジットカードの利用限度額が低いと報告されたのに、会社がアルゴリズムの理由を説明できなかった事例があります。","related":["W-487","W-360","W-488"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-487","term":"説明可能性","aliases":["解釈可能性"],"category":10,"short":"AIがなぜその判断をしたのかを、人が理解できる形で説明できること。","body":"AI事業者ガイドラインは、透明性の一つとして、説明可能性・解釈可能性の向上を挙げています。\nただし、すべての情報を無条件に公開することまでは求められておらず、必要かつ技術的に可能な範囲で、合理的に情報を提供することが求められています。","related":["W-486","W-360","W-507","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true},{"id":"W-488","term":"データの来歴","aliases":["データリネージ"],"category":10,"short":"データがどこから来て、どのように集められ、管理され、移動してきたかという経緯。","body":"データの出所を把握できるようにしておくと、問題が起きたときに、さかのぼって原因を確かめられます。\nAI事業者ガイドラインは、データの来歴を把握する仕組み（データリネージ）を作ることを挙げています。","related":["W-507","W-486","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true},{"id":"W-489","term":"フィルターバブル","category":10,"short":"おすすめの仕組みによって、見たい情報ばかりが表示され、考えの違う情報から切り離されてしまう状態。","body":"アルゴリズムが検索やクリックの履歴を学習し、その人が見たい情報を優先して表示します。\nその結果、自分の考えの「泡（バブル）」の中に閉じこもったような状態になります。\n人が本来得られるはずの選択肢が、知らないうちに狭められるおそれがあります。","example":"動画サイトで同じような意見の動画ばかり勧められ、反対の意見の動画を目にしなくなる、といった状態です。","related":["W-490","W-485"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true},{"id":"W-490","term":"エコーチェンバー","category":10,"short":"自分と似た考えの人の意見ばかりが周りから返ってきて、同じ意見が繰り返し強められていく現象。","body":"閉じた部屋で声がこだま（エコー）するように、同じ意見が響き合って大きくなります。\n利用者が極端な考えを持つようになったり、社会が分断されたりすることが心配されています。","related":["W-489","W-485"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true},{"id":"W-491","term":"モデル学習の電力消費","category":10,"short":"大きなAIのモデルを学習させたり使ったりするときに、大量の電力を使うこと。","body":"大規模なモデルの精度向上は、大量の計算と、それに伴う大量のエネルギーの消費に支えられています。\nAIの利用の広がりで、データセンターのエネルギーの使用量が増えることが心配されています。","related":["W-492","W-132"],"sources":[{"title":"Emma Strubell ほか \"Energy and Policy Considerations for Deep Learning in NLP\" (arXiv:1906.02243)","url":"https://arxiv.org/abs/1906.02243"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-492","term":"気候変動","category":10,"short":"地球の気候が長い期間にわたって変わること。AIの電力消費による二酸化炭素の排出との関係が議論されている。","body":"AIの学習や利用で使う大量の電力は、二酸化炭素の排出を通じて、環境に負荷を与えるおそれがあります。\n一方で、エネルギーの管理にAIを使って電力を効率よく使うなど、AIが環境に役立つ可能性もあります。","related":["W-491"],"sources":[{"title":"Emma Strubell ほか \"Energy and Policy Considerations for Deep Learning in NLP\" (arXiv:1906.02243)","url":"https://arxiv.org/abs/1906.02243"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}]},{"id":"W-493","term":"AIとの協働","category":10,"short":"人とAIが、それぞれの得意なことを生かして、一緒に仕事を進めること。","body":"AIの導入で、仕事の中身や働く人の役割が変わりつつあります。\n業務の負担の軽減や、生産性の向上が期待されています。\nロボットなどのフィジカルAIには、人と協力して、少子高齢化による働き手の不足を補うことも期待されています。","related":["W-494","W-495","W-504"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}]},{"id":"W-494","term":"労働力不足","category":10,"short":"少子高齢化などによって、働き手が足りなくなること。AIやロボットで補うことが期待されている。","body":"ロボットのように、現実の世界で体を持って動くAIを、フィジカルAIといいます。\nAI事業者ガイドラインでは、フィジカルAIが労働力不足を補い、人と協働して生産性を高めることが期待されるとしています。","related":["W-493","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}]},{"id":"W-495","term":"スキルの喪失","category":10,"short":"AIに頼りすぎることで、人が本来持っていた能力や技能が衰えてしまうこと。","body":"人がAIの判断を信じすぎて、自分で確かめるのを怠ってしまうこと（自動化バイアス）が心配されています。\n教育の場で、生成AIが作ったレポートをそのまま使うと、自分で考える力が育たないことも心配されています。","related":["W-493","W-504","W-055"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}]},{"id":"W-496","term":"インクルージョン","aliases":["包摂性","多様性・包摂性"],"category":10,"short":"さまざまな人を排除せずに、包み込むこと。AIの恩恵を、より多くの人が受けられるようにすること。","body":"AI事業者ガイドラインは、いわゆる情報弱者や技術弱者を生まないよう、誰もが使いやすいデザインやアクセシビリティに配慮することを求めています。\n「人間中心のAI社会原則」の価値の一つ、「多様な背景を持つ人々が多様な幸せを追求できる社会」にも関わります。","related":["W-501","W-466","W-508"],"sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true},{"id":"W-497","term":"人間の自律性","category":10,"short":"人が、自分のことを自分の意思で考えて決められること。AIによる操作から守るべき価値とされる。","body":"AI事業者ガイドラインは、人間の尊厳と個人の自律を尊重することを求めています。\n人の意思決定や感情を、不当に、または本人が気づかない方法で操作するAIは、作ったり使ったりしないとしています。\nEUのAI法も、人の意識の外で働く技術で行動をゆがめるAIを禁止しています。","related"
