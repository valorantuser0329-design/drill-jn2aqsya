います。変更の条件や手続は、利用規約の変更に関する条項や、規約が選ぶ準拠法によって決まります。ベンダが海外にある場合は海外の法律が準拠法とされることが多いため、その法律のルールを確認することが望ましいとしています。\n日本の民法では、利用規約が「定型約款」に当たる場合、変更が相手方の一般の利益に適合するときや、契約の目的に反せず、変更の必要性や変更後の内容の相当性などに照らして合理的なときには、個別に合意しなくても契約の内容を変更できます（民法第548条の4第1項）。その場合、変更する旨、変更後の内容、効力発生時期を、インターネットなどで周知する必要があります（同条第2項）。\nそのため、変更に気づかずに利用を続けると、契約違反に当たる行為や、想定外のインプットの利用が生じるおそれがあります。","sources":[{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"},{"title":"e-Gov法令検索「民法」（明治29年法律第89号）","url":"https://laws.e-gov.go.jp/law/129AC0000000089"}],"timeSensitive":true,"status":"active"},{"id":"Q-238","category":10,"question":"AIのルールづくりにおける「ハードロー」と「ソフトロー」に関する説明として、最も適切なものはどれか。","choices":["ハードローは法的な拘束力を持つ法律などのルールで、ソフトローはガイドラインのように拘束力を持たず、関係者の自主的な取組を促すルールである","ソフトローは違反すると必ず刑事罰が科されるルールで、ハードローは法的な拘束力を持たない業界の自主ルールである","日本の「AI事業者ガイドライン」は、違反した事業者に罰金を科すハードローとして定められている","ソフトローは細かな行為義務をすべて法律で定めるため、技術の変化に最も追いつきにくいルールである"],"answer":0,"explanation":"ハードローは、法律のように法的な拘束力を持ち、違反すると制裁などが科されうるルールです。ソフトローは、ガイドラインや自主規制のように法的な拘束力を持たないルールです。\n総務省と経済産業省の「AI事業者ガイドライン」は、法律の整備が技術の発展のスピードに追いつかずタイムラグが生じることや、細かな行為義務を定めるルールベースの規制がイノベーションを阻害する可能性があることなどを踏まえ、関係者の自主的な取組を促す「非拘束的なソフトロー」として、ゴールベースの考え方で作られています。\n一方、EUのAI法（AI Act）は、AIシステムについて拘束力のあるルールを定めたハードローの例です。\n日本では2025年に「人工知能関連技術の研究開発及び活用の推進に関する法律」（AI推進法）が成立しましたが、この法律には罰則の規定はなく、国が指針を整備することなどを定めています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"e-Gov法令検索「人工知能関連技術の研究開発及び活用の推進に関する法律」（令和7年法律第53号）","url":"https://laws.e-gov.go.jp/law/507AC0000000053"}],"timeSensitive":true,"status":"active"},{"id":"Q-239","category":10,"question":"AIの規制やガバナンスにおける「リスクベースアプローチ」の説明として、最も適切なものはどれか。","choices":["AIがもたらすリスクの大きさに応じて、対策やルールの程度を変える考え方である","リスクの大きさに関係なく、すべてのAIに同じ厳しさの規制を一律に適用する考え方である","リスクが完全にゼロになることが証明されるまで、AIを一切使わないようにする考え方である","AIのリスクは考えずに、便益の大きさだけで利用するかどうかを判断する考え方である"],"answer":0,"explanation":"リスクベースアプローチは、AIがもたらすリスクの大きさに対応させて、対策の程度を決める考え方です。AI事業者ガイドラインは、この考え方がAI先進国の間で広く共有されているとしています。\nEUのAI法（AI Act）も、リスクの強さと範囲に応じてルールの種類と内容を変えるリスクベースアプローチをとっています。例えば、次のように分けています。\n・許容できないリスクのAI: 禁止する（人の意識の外で働くサブリミナルな技術で行動をゆがめるAI、社会的な行動などにもとづいて人を評価・分類し不利益な扱いにつなげるAIなど。第5条）\n・高リスクのAI: 満たすべき要件を定める\n・一部のAI: 透明性の義務を定める（ディープフェイクであることの表示など）\nまた、AI事業者ガイドラインは、リスクを恐れるあまりリスクがゼロになるまでAIを活用しないことは適切ではないとしています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"}],"timeSensitive":true,"status":"active"},{"id":"Q-240","category":10,"question":"日本の「人間中心のAI社会原則」（2019年）が掲げ、AI事業者ガイドラインが「基本理念」として引き継いでいる3つの価値の組み合わせとして、最も適切なものはどれか。","choices":["人間の尊厳が尊重される社会、多様な背景を持つ人々が多様な幸せを追求できる社会、持続可能な社会","経済成長が最優先される社会、AIが人間の判断をすべて代行する社会、競争のない社会","国がすべてのAIを管理する社会、AIの利用が一部の専門家に限られる社会、変化のない社会","効率性だけが追求される社会、AIに人間が依存する社会、特定の価値観に統一された社会"],"answer":0,"explanation":"日本政府が2019年3月に策定した「人間中心のAI社会原則」は、次の3つの価値を「基本理念」として尊重し、その実現を追求する社会を構築していくべきだとしています。AI事業者ガイドラインも、これを基本理念としています。\n・人間の尊厳が尊重される社会（Dignity）: 人間がAIに過度に依存したり、人間の行動をコントロールするためにAIが使われたりするのではなく、人間がAIを道具として使いこなして能力を発揮できる社会\n・多様な背景を持つ人々が多様な幸せを追求できる社会（Diversity & Inclusion）\n・持続可能な社会（Sustainability）\nAI事業者ガイドラインの共通の指針でも、「多様性・包摂性の確保」として、いわゆる情報弱者や技術弱者を生じさせず、より多くの人がAIの恩恵を受けられるよう、ユニバーサルデザインやアクセシビリティに配慮することが挙げられています。このように、多様な人々を排除せずに包み込むことをインクルージョン（包摂性）といいます。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-241","category":10,"question":"AI事業者ガイドライン（第1.2版）が、AI開発者・AI提供者・AI利用者に共通して取り組むべき事項として示す「共通の指針」に含まれるものの組み合わせとして、最も適切なものはどれか。","choices":["人間中心、安全性、公平性、プライバシー保護、セキュリティ確保、透明性、アカウンタビリティなど","利益の最大化、開発速度の優先、データの独占、競合他社の排除など","人間の判断の完全な排除、AIの出力の無条件の信頼、情報の非公開など","法令の遵守を除いた自主規制のみ、リスク評価の省略、説明の不要化など"],"answer":0,"explanation":"AI事業者ガイドラインは、各主体が取り組むべき「共通の指針」として、次の10項目を挙げています。\n1) 人間中心、2) 安全性、3) 公平性、4) プライバシー保護、5) セキュリティ確保、6) 透明性、7) アカウンタビリティ、8) 教育・リテラシー、9) 公正競争確保、10) イノベーション\n各主体がバリューチェーン全体で連携して取り組むことが求められていて、憲法、知的財産関連法令、個人情報保護法などの関連法令を遵守すべきだとしています。\nさらに、これらを実践するための「AIガバナンスの構築」として、環境・リスク分析、ゴール設定、システムデザイン、運用、評価と、その見直しを繰り返す「アジャイル・ガバナンス」の考え方が示されています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-242","category":10,"question":"日本の「人工知能関連技術の研究開発及び活用の推進に関する法律」（AI推進法、2025年）に関する説明として、最も適切なものはどれか。","choices":["AIの研究開発と活用の推進を目的とし、内閣への人工知能戦略本部の設置や、国による指針の整備などを定めている","AIの開発や利用を原則として禁止し、国の許可を受けた一部の事業者だけがAIを使えるようにする法律である","EUのAI法と同じように、高リスクのAIの規定に違反した事業者へ高額の制裁金を科す罰則を定めている","AIの活用によって国民の権利利益の侵害が生じても、国は情報の収集や調査を一切行わないと定めている"],"answer":0,"explanation":"AI推進法は2025年6月に公布され、同年9月に全面施行された法律で、AI関連技術の研究開発と活用の推進に関する施策の基本理念や基本的な計画などを定めています（第1条）。主な内容は次のとおりです。\n・基本理念として、AIが不正な目的や不適切な方法で研究開発・活用されると、犯罪への利用、個人情報の漏えい、著作権の侵害などを助長するおそれがあることから、透明性の確保などの必要な施策を講じることなどを定めている（第3条）\n・国は、研究開発と活用の適正な実施を図るため、国際的な規範の趣旨に即した指針を整備する（第13条）。これにもとづき、2025年12月に「人工知能関連技術の研究開発及び活用の適正性確保に関する指針」が策定された\n・国は、国民の権利利益の侵害が生じた事案の分析や対策の検討などの調査研究を行い、事業者への指導、助言、情報の提供などの措置を講じる（第16条）\n・内閣に人工知能戦略本部を置く（第19条）\nこの法律には罰則の規定はありません。","sources":[{"title":"e-Gov法令検索「人工知能関連技術の研究開発及び活用の推進に関する法律」（令和7年法律第53号）","url":"https://laws.e-gov.go.jp/law/507AC0000000053"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-243","category":10,"question":"経済産業省・総務省の「カメラ画像利活用ガイドブック ver3.0」が示す、カメラ画像を商用目的で利活用する事業者の配慮として、最も適切なものはどれか。","choices":["撮影や利活用を始める前に、利用目的や運用主体の連絡先などを十分な期間をもって事前に告知し、生活者とのコミュニケーションを図る","カメラを設置したことは、防犯上の理由から、生活者に一切知らせないことが望ましいとされている","撮影して保存済みの画像は、あとから新たな目的を追加して、自由に利活用してよいとされている","データの保存期間や閲覧できる人の範囲は定めず、できるだけ多くのデータを長く保存することが望ましいとされている"],"answer":0,"explanation":"カメラ画像利活用ガイドブックは、店舗や公共空間などでカメラ画像を商用目的で利活用する事業者が、生活者のプライバシーに配慮するための事項を、設計時、事前告知時、取得時、取扱い時、管理時などの段階ごとに整理しています。例えば、次のような配慮が示されています。\n・設計時: データのライフサイクル（取得・処理・保存・利活用・破棄）を明確にし、利用目的の正当性や必要性、利用が必要最小限の範囲であること（カメラの台数、撮影範囲、データの保存期間、閲覧できるメンバーなど）を確認する\n・事前告知時: 撮影と利活用を始める前に、十分な期間をもって、ポスターの掲示やウェブサイトなどで事前告知を行う。告知の内容には、カメラ画像の利用目的、運用実施主体の名称と連絡先、生活者のメリット、カメラの設置位置と撮影範囲、第三者提供の有無などを含める\n既設のカメラで撮影・保存済みの画像を新たな目的で利活用する場合は、写っている生活者から改めて同意を得る必要があるため、基本的に利用できないとされています。","sources":[{"title":"IoT推進コンソーシアム・総務省・経済産業省「カメラ画像利活用ガイドブック ver3.0」（令和4年3月）","url":"https://www.meti.go.jp/policy/it_policy/privacy/01_CameraGuideBook_ver3.0.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-244","category":10,"question":"「プライバシー・バイ・デザイン」と「セキュリティ・バイ・デザイン」の説明として、最も適切なものはどれか。","choices":["問題が起きてから対応するのではなく、システムの企画・設計の段階から、プライバシー保護やセキュリティ対策を組み込んでおく考え方である","システムを完成させて運用を始めたあとに、問題が起きた時点で初めてプライバシーやセキュリティの対策を検討する考え方である","プライバシーやセキュリティの対策は、システムのデザイン（見た目）を美しくすることで達成できるという考え方である","プライバシーやセキュリティの対策は利用者だけの責任で、開発者や提供者は考慮しなくてよいという考え方である"],"answer":0,"explanation":"「バイ・デザイン」は、あとから対策を付け足すのではなく、企画や設計の段階から対策を組み込んでおくという考え方です。\nAI事業者ガイドラインでは、例えば次のように示されています。\n・プライバシー・バイ・デザイン: AIシステムの実装の過程を通じて、採用する技術の特性に照らして、個人情報へのアクセスを管理・制限する仕組みの導入などのプライバシー保護の対策を講じる。AI開発者は、学習データを適正に収集し、個人情報などが含まれる場合には法令に従って適切に扱うことを、AIのライフサイクル全体を通じて確保する\n・セキュリティ・バイ・デザイン: AIシステムの開発や提供の過程を通じて、採用する技術の特性に照らして適切にセキュリティ対策を講じる\nカメラ画像利活用ガイドブックも、設計の段階でプライバシーのリスク分析を行い、リスクを低減できるシステムと運用ルールを設計することを求めています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"IoT推進コンソーシアム・総務省・経済産業省「カメラ画像利活用ガイドブック ver3.0」（令和4年3月）","url":"https://www.meti.go.jp/policy/it_policy/privacy/01_CameraGuideBook_ver3.0.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-245","category":10,"question":"ローンの審査AIの学習データから、人種などのセンシティブ属性の列を削除した。この対応に関する説明として、最も適切なものはどれか。","choices":["郵便番号のように、センシティブ属性と関係の深い他の特徴量が代理変数となり、差別的な結果が残るおそれがある","センシティブ属性の列を削除すれば、どのようなデータであっても、差別的な結果が生じることは完全になくなる","センシティブ属性を削除すると、モデルの予測は必ずランダムになり、審査には使えなくなる","センシティブ属性の列を削除したデータは、公平性の点検をしなくても、必ず公平であることが保証される"],"answer":0,"explanation":"人種、性別、宗教などのように、差別につながるおそれがあり、取扱いに注意が必要な属性を、センシティブ属性（保護属性）といいます。\n「センシティブ属性を判断に明示的に使わなければ公平である」とする考え方は Fairness Through Unawareness と呼ばれますが、それだけでは不十分な場合があります。例えば、居住地の郵便番号は人種と関係が深いことがあり、ローンの審査などに使うと、人種を直接使わなくても人種による差別につながるおそれがあると指摘されています。このように、ある属性の代わりとして働いてしまう変数を代理変数（プロキシ）といいます。\nAI事業者ガイドラインも、人種や性別などの明らかなセンシティブ属性を取り除いたデータでも、関連する情報からセンシティブ属性が類推されてしまう場合や、複数の属性の組み合わせによってバイアスが生じる場合（交差バイアス）があるとしています。そのため、学習データやモデルに不公正なバイアスがないかを点検することが大切です。","sources":[{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"status":"active"},{"id":"Q-246","category":10,"question":"機械学習の公平性の定義に関する説明として、最も適切なものはどれか。","choices":["Demographic Parityは属性によらず陽性と予測される確率が等しいこと、Equalized Oddsは正解が同じ人の間で予測の傾向が等しいことを求める","Demographic ParityとEqualized Oddsは、同じ条件を別の名前で呼んでいるだけで、求める内容に違いはまったくない","公平性の定義は1つしかなく、どの場面でもその定義を満たしさえすれば、他の観点の公平性も自動的に満たされる","Equalized Oddsは、予測の精度を無視して、保護属性に関係なく全員を陽性と予測することを求める定義である"],"answer":0,"explanation":"機械学習の公平性には、いくつかの異なる定義があります。代表的なものは次のとおりです。\n・Demographic Parity（統計的パリティ）: 予測 Ŷ が陽性になる確率が、保護属性 A の値によらず等しいこと。P(Ŷ=1 | A=0) = P(Ŷ=1 | A=1)\n・Equalized Odds: 実際の正解 Y が同じ人どうしで、予測が陽性になる確率が保護属性によらず等しいこと。つまり、真陽性率と偽陽性率がグループ間で等しいこと。Hardt らが2016年に提案した\n・Equal Opportunity: Equalized Odds の条件のうち、正解が陽性（Y=1）の人についてだけ等しさを求めるもの\nこれらの定義は互いに異なる条件を求めていて、一般には同時にすべてを満たすことはできない場合があります。そのため、AIを使う場面や目的に応じて、どの公平性を重視するかを検討する必要があります。","sources":[{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"},{"title":"Moritz Hardt ほか \"Equality of Opportunity in Supervised Learning\" (arXiv:1610.02413)","url":"https://arxiv.org/abs/1610.02413"}],"status":"active"},{"id":"Q-247","category":10,"question":"ある企業が過去10年分の応募書類で採用AIを学習させたところ、女性を不利に評価する傾向が見つかった。応募者のほとんどが男性だったことが原因とされている。このようなバイアスの説明として、最も適切なものはどれか。","choices":["学習データに特定の属性が偏って含まれていたことによるデータの偏りで、サンプリングバイアスなどと関係がある","アルゴリズムが内部で乱数を使っていることだけが原因で、学習データの内容とはまったく関係がない","学習データの量が多すぎたことだけが原因で、データの量を減らせば偏りは必ず解消する","女性の応募者のほうが能力が低いという事実を、AIが客観的に正しく発見した結果である"],"answer":0,"explanation":"AI事業者ガイドラインの別添は、IT企業が開発した採用AIが女性を差別するという欠陥が判明した事例を紹介しています。学習に使った過去10年間の履歴書で応募者のほとんどが男性だったため、男性を採用することが好ましいとAIが認識したためといわれています。企業はプログラムの改善を試みましたが、別の差別を生むとして運用を取りやめました。\nこのように、学習データに特定の属性が過剰に含まれていたり、ラベルを付ける人の主観的なバイアスが含まれていたりすると、出力に偏りが生じることがあります。\nバイアスには、次のような種類があるとされています。\n・サンプリングバイアス: 部分集団からの無作為でない抽出によって生じるバイアス。ある集団で推定した傾向が、別の集団に当てはまらなくなる\n・アルゴリズムバイアス: 入力データにはなく、最適化の方法などアルゴリズムの設計によって加わるバイアス\nこの事例は、過去の社会の偏りを反映したデータから学習したことによるもので、AIが客観的な事実を発見したわけではありません。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"Ninareh Mehrabi ほか \"A Survey on Bias and Fairness in Machine Learning\" (arXiv:1908.09635)","url":"https://arxiv.org/abs/1908.09635"}],"status":"active"},{"id":"Q-248","category":10,"question":"画像認識モデルに対する「敵対的サンプル（Adversarial Examples）」を使った攻撃の説明として、最も適切なものはどれか。","choices":["人間にはほとんど分からない小さなノイズを入力に加えることで、モデルに高い確信度で誤った予測をさせる攻撃である","学習データを大量に盗み出して、別の会社に販売することを目的とした攻撃である","モデルを動かすサーバーに大量の通信を送りつけて、サービスを停止させることを目的とした攻撃である","モデルの学習に使うGPUを物理的に破壊して、学習を止めることを目的とした攻撃である"],"answer":0,"explanation":"敵対的サンプルは、データに、人間にはほとんど気づかれないような小さな、しかし意図的に作った摂動（ノイズ）を加えたもので、モデルに高い確信度で誤った答えを出させます。Goodfellow らの論文では、57.7%の確信度で「パンダ」と認識されていた画像に小さなノイズを加えると、99.3%の確信度で「テナガザル」と誤認識される例が示されました。\n同論文は、ニューラルネットワークがこうした摂動に弱い主な原因は、その線形的な性質にあると主張し、損失の勾配の符号を使って敵対的サンプルを素早く作る方法（Fast Gradient Sign Method、FGSM）を提案しました。また、敵対的サンプルを学習に使う敵対的学習（Adversarial Training）で、モデルを頑健にできることも示しました。\nAI事業者ガイドラインも、推論用データに微細な情報を混入させることで意図しない判断が行われる可能性を踏まえ、AIシステムの脆弱性を完全に排除することはできないと認識するよう求めています。対策として、敵対的データに対する頑健性の向上や、敵対的データの検知などが挙げられています。","sources":[{"title":"Ian J. Goodfellow ほか \"Explaining and Harnessing Adversarial Examples\" (arXiv:1412.6572)","url":"https://arxiv.org/abs/1412.6572"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"status":"active"},{"id":"Q-249","category":10,"question":"AIシステムへの「データ汚染（データポイズニング）」や「モデル汚染（モデルポイズニング）」の攻撃の説明として、最も適切なものはどれか。","choices":["学習データや学習済みモデルに不正なデータや細工を混入させ、性能の劣化や誤分類、攻撃者の意図した挙動を引き起こす攻撃である","推論のときに入力画像へ小さなノイズを加えるだけで、学習データやモデルには一切関係しない攻撃である","AIの学習にかかる電力を増やして、地球温暖化を進めることを目的とした攻撃である","モデルの出力をインターネットで公開して、多くの人に使ってもらうことを目的とした行為である"],"answer":0,"explanation":"データ汚染（データポイズニング）攻撃は、学習データに不正なデータを混入させて、モデルの性能を劣化させたり、誤分類を起こさせたりする攻撃です。モデル汚染（モデルポイズニング）攻撃は、学習済みモデルそのものに細工をして、攻撃者の意図した挙動をさせる攻撃です。\nAI事業者ガイドラインの別添は、学習時の不正データの混入や、運用時のプロンプトを通した攻撃などをリスクとして挙げ、例えば、あるチャットボットが悪意のある集団による組織的な学習によって、ヘイトスピーチを発するようになった事例を紹介しています。また、AIエージェントやマルチモーダルな生成AIでは、入力経路や外部との連携が増えるため、データ汚染などのリスクがさらに高まると懸念されています。\n推論時に入力へノイズを加える攻撃は、回避攻撃（敵対的サンプル）です。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"status":"active"},{"id":"Q-250","category":10,"question":"AIシステムに対する「モデル窃取（モデル抽出攻撃）」や「データ窃取」の説明として、最も適切なものはどれか。","choices":["予測APIへの多数の問い合わせの入出力から、モデルの機能を複製したり学習データの情報を漏えいさせたりする攻撃である","学習済みモデルのファイルを、開発者が自らの判断でオープンソースとして公開することを指している","モデルの予測結果に確信度を付けて出力することが、モデル窃取の対策として最も効果が高いとされている","モデル窃取は、攻撃者がモデルの内部のパラメータを直接見られる場合にしか起きない攻撃である"],"answer":0,"explanation":"モデル抽出攻撃（モデル窃取）は、攻撃者がモデルのパラメータや学習データを知らなくても、公開された予測APIなどに問い合わせて得た入出力をもとに、モデルの機能を複製する（盗む）攻撃です。Tramèr らの論文は、有料の予測APIとして提供される機械学習サービスで、確信度などの出力情報を手がかりに、モデルをブラックボックスのまま抽出できることを示しました。\nAI事業者ガイドラインの別添は、モデルのパラメータなどの非公開情報を漏えいさせる攻撃が営業秘密の漏えいにつながる場合や、学習データに含まれるセンシティブな情報を漏えいさせる攻撃（データ窃取）がプライバシーの侵害などにつながる場合があるとしています。\n対策の例として、モデルへの入力の制限（アクセス権の制限、アクセスの回数や頻度の制限）、モデル抽出攻撃の検知、モデルの出力情報の加工、プライバシー保護学習などが挙げられています。確信度をそのまま出力することは、攻撃の手がかりになりえます。","sources":[{"title":"Florian Tramèr ほか \"Stealing Machine Learning Models via Prediction APIs\" (arXiv:1609.02943)","url":"https://arxiv.org/abs/1609.02943"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"status":"active"},{"id":"Q-251","category":10,"question":"ディープフェイクとフェイクニュースに関する説明として、最も適切なものはどれか。","choices":["ディープフェイクは実在の人物などに似せてAIで作った本物らしい画像・音声・映像で、EUのAI法は生成されたことの開示を義務づけている","ディープフェイクは、AIで作った画像のうち、誰が見てもすぐに偽物だと分かるもののことだけを指している","フェイクニュースは、AIが普及する前には存在せず、生成AIによって初めて生まれた新しい問題である","SNSで拡散した偽情報は、株価など社会や経済に影響を与えることはないとされている"],"answer":0,"explanation":"EUのAI法（AI Act）は、ディープフェイク（deep fake）を、実在する人物、物、場所、出来事などに似せてAIで生成・加工した画像、音声、映像で、人に本物や真実であるかのように誤って見えるものと定義しています（第3条）。そして、ディープフェイクを生成・加工するAIシステムを使う者（deployer）に、そのコンテンツが人工的に生成・加工されたものであることを開示する義務を定めています（第50条第4項。犯罪の捜査などで法律が認める場合などの例外あり）。\nAI事業者ガイドラインの別添は、ディープフェイクの悪用例が各国で相次いでいることを挙げ、「国防総省付近で爆発が起きた」とする生成AIで作られた偽画像がSNSで拡散し、平均株価が一時下落した事例を紹介しています。\nこのように事実と異なる情報をニュースのように広めるフェイクニュース（偽情報）は、AIの普及以前から問題になっていましたが、生成AIによって本物らしい偽情報を大量に作りやすくなったことが懸念されています。","sources":[{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-252","category":10,"question":"「フィルターバブル」と「エコーチェンバー」の説明の組み合わせとして、最も適切なものはどれか。","choices":["フィルターバブルは推薦で見たい情報ばかり表示され異なる情報から隔離される状態、エコーチェンバーは似た意見が反響し増幅される現象である","フィルターバブルは似た考えの人の間で意見が増幅される現象で、エコーチェンバーは画像のノイズを除くフィルタ処理の名前である","フィルターバブルとエコーチェンバーは、多様な意見に触れる機会を増やし、社会の分断を防ぐ効果を持つ仕組みの名前である","フィルターバブルは、検索エンジンがすべての利用者に対して、まったく同じ検索結果を表示する状態のことである"],"answer":0,"explanation":"・フィルターバブル: アルゴリズムが利用者の検索履歴やクリック履歴を分析して学習することで、望むと望まざるとにかかわらず、その人が見たい情報が優先的に表示され、観点に合わない情報から隔離されて、自分の考え方や価値観の「バブル（泡）」の中に孤立する情報環境\n・エコーチェンバー: 自分と同じような考えばかりが周囲から返ってくる現象。閉じた部屋で音が反響するように、同じ意見が繰り返されて増幅される\nAI事業者ガイドラインは、これらを、もともとある人間の傾向とネットメディアの特性の相互作用による現象としています。そして、利用者が極端な考えを持つようになる懸念や、社会の分断につながることを指摘し、人間が本来得られるべき選択肢が不本意に制限されるようなAIの活用に注意を払うよう求めています。特に、選挙などの社会に重大な影響を与える手続に関係しうる場合は、AIの出力を慎重に扱うべきだとしています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-253","category":10,"question":"AIの判断のブラックボックス化と、透明性・説明可能性に関する説明として、最も適切なものはどれか。","choices":["判断の根拠を説明できないと差別の疑いに答えられないなどの問題が生じるため、検証可能性の確保や説明可能性の向上が求められる","AIの判断の根拠は、予測の精度さえ高ければ、誰に対しても説明する必要はまったくないとされている","透明性を確保するためには、AIのソースコードや学習データをすべて無条件に公開しなければならない","ブラックボックス化の問題はディープラーニング以外の手法では起こらないため、考慮する必要はない"],"answer":0,"explanation":"ディープラーニングなどのモデルは、判断の根拠が人間に分かりにくく、ブラックボックスになりやすいという特性があります。AI事業者ガイドラインの別添は、あるクレジットカードで、同じ年収の男性と女性で女性の利用限度額が低いという報告が広がり、金融当局がアルゴリズムの正当性の証明を求めたものの、企業がアルゴリズムの機能や動作を説明できなかった事例を紹介しています。\nAI事業者ガイドラインは、共通の指針の「透明性」として、AIシステムの検証可能性を確保しながら、必要かつ技術的に可能な範囲で、ステークホルダーに合理的な範囲で情報を提供することを求めています。その中には、説明可能性・解釈可能性の向上も含まれています。\nただし、情報提供は「必要かつ技術的に可能な範囲」「合理的な範囲」で行うもので、すべてを無条件に公開することまでは求められていません。プライバシーや営業秘密などとのバランスも考える必要があります。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-254","category":10,"question":"AIガバナンスにおける「データの来歴」と「トレーサビリティ」に関する説明として、最も適切なものはどれか。","choices":["データの出所や収集・管理・移動の経緯を把握できるようにし、問題が起きたときにさかのぼって原因を確認できるようにすること","データの出所は記録せず、問題が起きたときには、そのたびに担当者の推測で原因を判断すること","AIシステムの設計や開発の記録は、情報漏えいを防ぐために、できるだけ作成せずに済ませること","トレーサビリティとは、AIの出力をできるだけ速く利用者に届けるための通信技術のことである"],"answer":0,"explanation":"AI事業者ガイドラインは、共通の指針の「アカウンタビリティ」の最初の項目として「トレーサビリティの向上」を挙げています。トレーサビリティは、データの出所や、AIシステムの開発・提供・利用の過程で行われた意思決定などを、あとから追跡できるようにすることです。\n別添は、技術的に可能で合理的な範囲で、データの出所を把握する手段として「データリネージ（来歴メカニズム）」の構築を挙げています。これは、データがもともとどこから来たのか、どのように収集・管理され、時間の経過とともにどのように移動したのかを知ることです。\nまた、AI提供者には、トレーサビリティと透明性の向上のため、システムアーキテクチャやデータの処理プロセスなどを文書化することが求められています。AI開発者も、予期せぬ事故が起きた際に、どのような関与をしたかを合理的に説明できるよう、記録を残すことが重要だとされています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-255","category":10,"question":"AIと環境保護に関する説明として、最も適切なものはどれか。","choices":["大規模なモデルの学習や利用は大量の電力を使い環境への負荷が懸念される一方、AIによる効率的な電力利用などの貢献も期待される","AIの学習は電力をほとんど使わないため、環境への影響については考える必要がまったくないとされている","モデルの規模を大きくするほど、学習に必要な計算量と電力は必ず少なくなることが分かっている","AIは環境に負荷を与えるだけで、エネルギーの効率的な利用などに役立つことはないとされている"],"answer":0,"explanation":"Strubell らの論文（2019年）は、自然言語処理の大規模なニューラルネットワークの精度向上が、非常に大きな計算資源と、それに伴う大量のエネルギー消費に支えられていることを指摘しました。そして、代表的なモデルの学習にかかる金銭的コストと、二酸化炭素排出などの環境的コストを概算し、研究者に向けて提言を行いました。\nAI事業者ガイドラインの別添も、AIの利用拡大で計算資源の需要が増え、データセンターのエネルギー使用量の増加が懸念されているとし、特にマルチモーダルな生成AIなど計算量の多いモデルでは環境への影響が大きくなる場合があるとしています。\n一方で、エネルギー管理にAIを導入することで効率的な電力利用が可能になるなど、AIが環境に貢献できる可能性もあることを忘れてはならないとしています。","sources":[{"title":"Emma Strubell ほか \"Energy and Policy Considerations for Deep Learning in NLP\" (arXiv:1906.02243)","url":"https://arxiv.org/abs/1906.02243"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"}],"status":"active"},{"id":"Q-256","category":10,"question":"AIが雇用や働き方に与える影響に関する説明として、最も適切なものはどれか。","choices":["業務負担の軽減や労働力不足を補う協働が期待される一方、失業リスクや、AIへの過度な依存による能力の低下も懸念されている","AIの導入によって、すべての仕事が近いうちに完全になくなることが、すでに確実になっているとされている","AIは人間の仕事にまったく影響を与えないため、働き方の見直しや教育、リスキリングは必要ない","AIの判断は常に正しいため、人間は内容を確認せずに、そのまま従うことが推奨されている"],"answer":0,"explanation":"AI事業者ガイドラインの別添は、生成AIなどの新しい技術が、仕事の内容（タスク）や労働者の役割を変えつつあるとしています。業務負担の軽減や労働生産性の向上が期待できる一方、失業リスクや格差の拡大なども一部で懸念されています。\nまた、フィジカルAIには、少子高齢化による労働力不足を補い、人と協働して生産性を向上させることが期待されています。\n一方で、AIへの過度な依存のリスクも指摘されています。例えば、人がAIの判断を過度に信頼して自らの判断や確認を怠る「自動化バイアス」や、教育の場で生成AIが作ったレポートをそのまま使うことで、学生の独自性や批判的思考の発展が妨げられることが懸念されています。こうした依存が続くと、人間のスキルが失われる（スキルの喪失）おそれがあります。\nそのため、AIの特性を理解するための教育やリスキリングが重要だとされています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"status":"active"},{"id":"Q-257","category":10,"question":"AIと人間の自律性、軍事利用に関する説明として、最も適切なものはどれか。","choices":["EUのAI法は、人の意識の外で働く技術で行動をゆがめるAIを禁止しているが、軍事や国防の目的だけで使われるAIシステムには適用されない","AI事業者ガイドラインは、人間の意思決定や感情を、本人が気づかない方法でAIが操作することを推奨している","EUのAI法は、軍事目的のAIシステムに最も厳しい規制を適用し、民生用のAIには規制を設けていない","人間の自律性の尊重は、AI倫理の議論では取り上げられていない論点である"],"answer":0,"explanation":"AI事業者ガイドラインは、共通の指針「人間中心」の中で、人間の尊厳と個人の自律を尊重することを求めています。また、人間の意思決定、認知、感情を不当に操作することを目的とした、または意識的に知覚できないレベルでの操作を前提としたAIの開発・提供・利用は行わないとしています。\nEUのAI法も、人の意識の外で働くサブリミナルな技術や、意図的に操作的・欺瞞的な技術によって、人の行動を大きくゆがめるAIを禁止しています（第5条）。\n一方、EUのAI法は、軍事、国防、国家安全保障の目的だけで市場に出されたり使われたりするAIシステムには適用されないと定めています（第2条第3項）。AIの軍事利用、特に人間の関与なしに攻撃の判断を行う自律型の兵器については、国際的な議論が続いています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"EUR-Lex \"Regulation (EU) 2024/1689 (Artificial Intelligence Act)\"","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"}],"timeSensitive":true,"status":"active"},{"id":"Q-258","category":10,"question":"AI事業者ガイドラインが示す、企業がAIガバナンスを実践するための取組として、最も適切なものはどれか。","choices":["経営層の下でAIポリシーなどのゴールを設定し、独立した監査やモニタリング、多様な視点での倫理審査を行って継続的に改善する","AIガバナンスは開発担当者だけの問題なので、経営層や法務などの他の部門は関与しないことが望ましい","一度ルールを決めたら、技術や社会の変化があっても、見直さずにそのまま使い続けることが望ましい","AIの出力は常に同じ結果を再現できるため、判断の記録や証跡を残す必要はないとされている"],"answer":0,"explanation":"AI事業者ガイドラインは、AIガバナンスの構築について、例えば次のような取組を示しています。\n・経営層のリーダーシップの下で、AIのもたらしうる便益とリスク、社会的受容、自社のAI習熟度などを考慮し、AIガバナンス・ゴール（例えばAIポリシー）を設定するかを検討し、設定したゴールはステークホルダーに公開することが期待される\n・AIマネジメントシステムが適切に機能しているかをモニタリングし、その結果をもとに継続的に改善する。その評価は、設計や運用から独立した専門性を持つ者（内部監査部門、外部監査主体など）が行うことが想定される\n・事例として、法務・開発・DE&I（ダイバーシティ、エクイティ＆インクルージョン）・事業部門などの合議によるAI倫理審査や、AI倫理影響評価（倫理アセスメント）の取組が紹介されている\n・アジャイル・ガバナンスに従い、仕組み、ルール、体制を見直す\nまた、生成AIのリスクは外部環境や技術動向で変化し、「再現性」がなくエラーの原因も特定しにくいため、文脈に合わせた適切な証跡を確保することが重要だとしています。AIの判断を人間が承認する際には、人間自身が承認の理由や根拠を考えてから承認すべきことなども提案されています。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」別添（付属資料）（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_3.pdf"},{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-259","category":10,"question":"亡くなった人の姿や声、話し方をAIで再現して、新しい映像や会話を作る場合の考え方として、最も適切なものはどれか。","choices":["故人は反論できないため、尊厳や遺族の気持ちに配慮し、同意の確認や生成物であることの明示などを検討することが望ましい","亡くなった人に関する情報は、どの法律でも一切保護されないため、どのような内容でも自由に作って公開してよい","故人の著作物の著作権は、著作者が亡くなった時点ですぐに消滅するため、誰でも自由に利用できる","亡くなった人の個人情報は、個人情報保護法で生存する個人とまったく同じように保護されている"],"answer":0,"explanation":"AIで故人を再現する取組は、倫理的な課題が指摘されているテーマです。故人は、AIが作った発言や姿に対して反論も訂正もできません。そのため、故人が実際には言っていないことを言わせたり、故人のイメージを書き換えたりしないよう、故人の尊厳（死者への敬意）や遺族の気持ちに配慮することが大切です。一般的には、遺族などの同意を確認すること、AIで生成したものであることを明示すること、故人の生前の考えに反する使い方をしないことなどが考えられます。AI事業者ガイドラインも、共通の指針「人間中心」の中で、人間の尊厳を尊重することを求めています。\n法律でも、亡くなった人に関わる利益は一定の範囲で保護されています。\n・著作権法: 著作権は原則として著作者の死後70年まで存続します（第51条第2項）。また、著作者が亡くなった後も、生きていれば著作者人格権の侵害となる行為をしてはならないとされ（第60条）、遺族は差止めなどを請求できます（第116条）\n・刑法: 死者の名誉を毀損した場合も、虚偽の事実を示して行ったときは処罰の対象になります（第230条第2項）\n一方、個人情報保護法の「個人情報」は生存する個人に関する情報に限られるため（第2条第1項）、亡くなった人の情報は原則として対象外です。法律で禁止されていないことでも、倫理的な配慮が必要な場合があります。","sources":[{"title":"総務省・経済産業省「AI事業者ガイドライン（第1.2版）」本編（令和8年3月31日）","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_1.pdf"},{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"e-Gov法令検索「刑法」（明治40年法律第45号）","url":"https://laws.e-gov.go.jp/law/140AC0000000045"},{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true,"status":"active"}],"changelog":[{"version":"α0.3","date":"2026-09-28","changes":["新しいURL（GitHub Pages）に移りました。Safari やログインしていないブラウザでも、学習記録が残るようになりました","ホーム画面に追加して、アプリのように使えるようになりました。一度開けば通信がなくても使えます","記録の書き出し・読み込みを追加しました。別の端末やブラウザに記録を移せます","新しい版が出たときにお知らせを出すようにしました"],"fixedQuestions":[]},{"version":"α0.2","date":"2026-09-28","changes":["単語集を追加しました。シラバスの全キーワードを含む510語を、やさしい言葉で説明しています","用語を見た回数と進み具合、「あとで見直す」の印、続きから、関連する用語から元の用語に戻る機能を使えます","問題の解説から、その問題に出てくる用語の説明を開けるようにしました","ホームを「用語を学ぶ」「練習問題を解く」「模擬試験を受ける」の3つの入口にしました"],"fixedQuestions":[]},{"version":"α0.1","date":"2026-09-27","changes":["アルファ版を公開しました。シラバスの全10分野、259問を収録しています","練習（分野別・ランダム10問・復習・ブックマーク）、模擬試験（72問・50分）、今日の1問、学習記録、誤り報告・要望のフォームを使えます"],"fixedQuestions":[]}],"glossary":[{"id":"W-001","term":"人工知能","aliases":["AI","Artificial Intelligence"],"category":1,"short":"人間のように考えたり判断したりする働きを、コンピュータで実現しようとする技術や研究のこと。","body":"「AI」とも呼ばれます。\n実は、研究者の間で広く統一された定義はありません。そもそも「知能とは何か」を決めるのが難しいためです。\nロボットのような体を持っている必要はありません。また、人間の脳と同じ仕組みで動いている必要もありません。\n1956年のダートマス会議で、ジョン・マッカーシーが使ったのが、この言葉の始まりとされています。","example":"スマートフォンの音声アシスタントや、写真に写った顔を見分ける機能などに使われています。","related":["W-009","W-002","W-003","W-014"],"sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"人工知能学会「人工知能のFAQ」","url":"https://www.ai-gakkai.or.jp/whatsai/AIfaq.html"},{"title":"人工知能学会「人工知能の話題: ダートマス会議」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics5.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-002","term":"機械学習","aliases":["Machine Learning"],"category":1,"short":"たくさんのデータからコンピュータが自分で規則を見つけ出し、予測や判断に使う方法。","body":"人が「こういうときはこうする」という規則を一つひとつ書くのではなく、データから規則を学ばせます。\n学んだ規則を使って、新しいデータを見分けたり、先のことを予測したりします。\nインターネットの普及で大量のデータ（ビッグデータ）が集まり、計算機の性能も上がったことで、大きく進歩しました。\n学び方によって、教師あり学習、教師なし学習、強化学習の3つに大きく分けられます。","example":"「迷惑メール」と「普通のメール」の例をたくさん見せて、新しく届いたメールを自動で振り分けるのが代表例です。","related":["W-056","W-057","W-058","W-003","W-044"],"sources":[{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Ion Androutsopoulos ほか \"An evaluation of Naive Bayesian anti-spam filtering\" (arXiv:cs/0006013)","url":"https://arxiv.org/abs/cs/0006013"}]},{"id":"W-003","term":"ディープラーニング","aliases":["深層学習","Deep Learning"],"category":1,"short":"人間の脳の神経回路をまねた仕組みを何層にも重ねて、データから特徴を自分で見つけ出す機械学習の方法。","body":"機械学習の方法の一つで、ニューラルネットワークの層をたくさん重ねたものです。\nそれまでの機械学習では、データのどこに注目すればよいか（特徴量）を人が考えて決めていました。\nディープラーニングは、この注目すべき点をデータから自分で見つけ出せるのが大きな特徴です。\n2012年の画像認識のコンテストで大きな成果を上げ、今のAIブーム（第三次AIブーム）の中心になりました。","example":"大量の写真を学習させると、「猫らしさ」の手がかりを自分で見つけて、猫の写真を見分けられるようになります。","related":["W-122","W-059","W-002","W-053"],"sources":[{"title":"JDLA「G検定の試験出題範囲（シラバス）G2024#6～」","url":"https://www.jdla.org/download/g%e6%a4%9c%e5%ae%9a%e3%81%ae%e8%a9%a6%e9%a8%93%e5%87%ba%e9%a1%8c%e7%af%84%e5%9b%b2-%ef%bc%88%e3%82%b7%e3%83%a9%e3%83%90%e3%82%b9%ef%bc%89g20246%ef%bd%9ev1-4/"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Olga Russakovsky ほか \"ImageNet Large Scale Visual Recognition Challenge\" (arXiv:1409.0575)","url":"https://arxiv.org/abs/1409.0575"},{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-004","term":"AI効果","category":1,"short":"AIがある問題を解けるようになると、その問題は「知能が必要なもの」とは思われなくなっていく現象。","body":"多くの問題は、本格的な知能がなくても解けてしまいます。\n解ける仕組みがわかると、「ただの計算だ」「ただの自動化だ」と受け止められ、AIの成果として数えられなくなります。\nその結果、「AI」と呼ばれるものは、いつも「まだ解けていない問題」の側に移っていきます。","example":"ある問題をAIが解けるようになり、その仕組みが知られると、「それは計算が速いだけで、知能とは言えない」と受け止められるようになる、という変化です。","related":["W-001"],"sources":[{"title":"José Hernández-Orallo \"AI Evaluation: past, present and future\" (arXiv:1408.6908) p.1","url":"https://arxiv.org/abs/1408.6908"}]},{"id":"W-005","term":"エージェント","category":1,"short":"周りの状況に合わせて、自分で判断して行動するプログラムやシステムのこと。","body":"AIを「計算機の中で答えを出すもの」ではなく、「周りの環境の中で自分の判断で動くもの」としてとらえた呼び方です。\nインターネットで情報を集めて回るプログラムから、ロボットまで、幅広いものがエージェントと呼ばれます。\n複数のエージェントが関わり合って働く仕組みは、マルチエージェントシステムと呼ばれます。","example":"部屋の中の様子を見ながら、ぶつからないように動き回るお掃除ロボットは、エージェントの一つです。","related":["W-058","W-331"],"sources":[{"title":"人工知能学会「私のブックマーク: 知的エージェント（WWWを中心に）」（学会誌 Vol.14 No.5, 1999）","url":"https://www.ai-gakkai.or.jp/resource/my-bookmark/my-bookmark_vol14-no5/"}]},{"id":"W-006","term":"シンギュラリティ","aliases":["技術的特異点"],"category":1,"short":"人間の知能を超えるAIが生まれる時点のこと。「技術的特異点」とも呼ばれる。","body":"レイ・カーツワイル博士は、その時点が2045年に来ると予測しました。\nただし、この予測には異論もあります。\n日本の総務省の研究会（2015年）では、次のような見方が主でした。\n2045年の時点では、一部の能力で人間を上回るAIはできても、人間と同じように社会の中で働けるAIはまだできない、という見方です。","related":["W-001","W-014"],"sources":[{"title":"総務省「インテリジェント化が加速するICTの未来像に関する研究会 報告書2015」（2015年6月）pp.5, 7","url":"https://www.soumu.go.jp/main_content/000363712.pdf"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"}]},{"id":"W-007","term":"シンボルグラウンディング問題","aliases":["記号接地問題"],"category":1,"short":"コンピュータが扱う記号（言葉）を、それが指す現実のものや体験と結び付けられないという問題。","body":"コンピュータは「りんご」という記号を、「赤い果物」のような別の記号で説明することはできます。\nしかし、りんごを見たり、触ったり、食べたりした経験と結び付けて理解しているわけではありません。\n研究者のハルナッドは、記号の意味は、感覚から得られる体験に根ざしている必要があると論じました。\nこの問題は、体を通して経験することの大切さ（身体性）の議論につながっています。","related":["W-008","W-016","W-013"],"sources":[{"title":"人工知能学会「人工知能の話題: フレーム問題」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics1.html"},{"title":"Stevan Harnad \"The Symbol Grounding Problem\" (arXiv:cs/9906002)","url":"https://arxiv.org/abs/cs/9906002"},{"title":"総務省 平成28年版 情報通信白書「代表的な研究テーマ」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142130.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}]},{"id":"W-008","term":"身体性","category":1,"short":"知能や言葉の意味を理解するには、体を通して周りを感じ取り、働きかける経験が大切だという考え方。","body":"人は、物を見たり触ったりする体験を通して、言葉の意味を身につけていきます。\n記号だけを扱うコンピュータには、この体験がありません（シンボルグラウンディング問題）。\nそこで、ロボットのような体を通してAIが経験を積めるようにすることが、研究の課題の一つになっています。\nただし、AIを使うのに、必ずしもロボットの体が必要なわけではありません。","example":"「重い」という言葉の意味は、実際に重い物を持ち上げた経験があってこそ、よく理解できます。","related":["W-007"],"sources":[{"title":"Stevan Harnad \"The Symbol Grounding Problem\" (arXiv:cs/9906002)","url":"https://arxiv.org/abs/cs/9906002"},{"title":"総務省 平成28年版 情報通信白書「代表的な研究テーマ」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142130.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}]},{"id":"W-009","term":"ダートマス会議","category":1,"short":"1956年にアメリカのダートマス大学で開かれた研究会。「人工知能」という言葉が初めて使われた。","body":"ジョン・マッカーシーらが呼びかけた、夏の研究会です。\nここでマッカーシーが「Artificial Intelligence（人工知能）」という言葉を使ったのが、この言葉の始まりとされています。\n呼びかけ人には、マービン・ミンスキー、クロード・シャノン、ナサニエル・ロチェスターもいました。\nこの会議で、最初のAIプログラムといわれる「ロジック・セオリスト」も発表されました。","related":["W-001"],"sources":[{"title":"人工知能学会「人工知能の話題: ダートマス会議」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics5.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-010","term":"トイ・プロブレム","aliases":["おもちゃの問題"],"category":1,"short":"迷路やパズルのように、ルールやゴールがはっきり決まった、現実よりずっと単純な問題のこと。","body":"「トイ」は「おもちゃ」という意味です。\n第一次AIブーム（1950年代後半〜1960年代）のAIは、探索や推論を使って、こうした問題を解けるようになりました。\nしかし、さまざまな要因が複雑に絡み合う現実の問題は解けないことがわかり、ブームは下火になりました。","example":"ハノイの塔や迷路、定理の証明は、トイ・プロブレムの代表例です。","related":["W-022","W-019","W-016"],"sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"\"The weighted Tower of Hanoi\" (arXiv:2208.06705)","url":"https://arxiv.org/abs/2208.06705"}]},{"id":"W-011","term":"知識獲得のボトルネック","category":1,"short":"AIに必要な知識を、人が集めて書き出す作業が大変すぎて、AIづくりの壁になってしまうこと。","body":"「ボトルネック」とは、瓶の首のように、全体の流れを悪くしている狭いところのことです。\n1980年代の第二次AIブームでは、専門家の知識をコンピュータに教え込む「エキスパートシステム」がたくさん作られました。\nしかし当時のコンピュータは、必要な知識を自分で集められず、人が一つひとつ書き出して与える必要がありました。\n世の中の膨大な知識をすべて書き出すことはできないため、この作業が大きな壁になりました。","example":"病気の診断のように専門的な分野では、専門家の知識を漏れなく言葉にして書き出すのは、簡単ではありません。","related":["W-030","W-032","W-038"],"sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-012","term":"チューリングテスト","category":1,"short":"会話の相手が人間か機械かを見分けられなければ、その機械には知能があるとみなす、という判定の方法。","body":"数学者のアラン・チューリングが、1950年の論文で提案しました。\n判定する人は、姿や声がわからないように、画面の文字だけで人間と機械の両方と会話します。\nどちらが人間かを見分けられなければ、その機械には知能があるとみなします。\nこのテストが見るのは、外から見た受け答えだけです。機械の中の仕組みは問いません。","example":"チャットで会話していて、相手がAIだと最後まで気づかなければ、そのAIは合格ということになります。","related":["W-013","W-018"],"sources":[{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"},{"title":"人工知能学会「人工知能のFAQ」","url":"https://www.ai-gakkai.or.jp/whatsai/AIfaq.html"}]},{"id":"W-013","term":"中国語の部屋","category":1,"short":"知能があるような受け答えができても、意味を理解しているとは限らない、ということを示そうとした思考実験。","body":"哲学者のジョン・サールが考えた、頭の中で行う実験（思考実験）です。\n中国語がわからない人が部屋の中にいて、「この文字が来たら、この文字を返す」という完璧な手順書を持っています。\nこの人は手順書どおりに作業するだけで、中国語の質問に正しく答えられます。\nしかし、この人は中国語の意味をまったく理解していません。\nサールはこの例で、チューリングテストに合格しても、本当に理解しているとは言えないと主張しました。","related":["W-012","W-014","W-007"],"sources":[{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"}]},{"id":"W-014","term":"強いAIと弱いAI","aliases":["強いAI","弱いAI"],"category":1,"short":"本当に心や理解を持つAIを「強いAI」、知的に見える働きをするだけのAIを「弱いAI」と分ける考え方。","body":"哲学者のジョン・サールが示した分け方です。\n強いAIは、人間と同じように、本当に考えたり意味を理解したりする心を持つAIです。\n弱いAIは、心は持たず、人間の知的な働きの一部を道具としてこなすAIです。\nサールは「中国語の部屋」の思考実験を使って、強いAIは実現できないと主張しました。","related":["W-013","W-006"],"sources":[{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"}]},{"id":"W-015","term":"統計的機械翻訳","category":1,"short":"大量の「元の文と訳文の組」から、訳し方の規則とその確からしさを、統計の方法で自動的に学ぶ翻訳の方式。","body":"元の文と訳文を組にした大量のデータを、対訳コーパスといいます。\n統計的機械翻訳は、このデータを使って「この言葉はこう訳されることが多い」という確率を学び、翻訳します。\n人が規則を書くルールベース機械翻訳より、いろいろな表現に対応しやすくなりました。\n情報通信研究機構（NICT）の研究では、2000年代ごろに主流になり、2010年代半ばからはニューラルネットワークを使う方式に移りました。","related":["W-017","W-393","W-290","W-122"],"sources":[{"title":"情報通信研究機構研究報告 Vol.68 No.2（2022）「2-1 多言語コミュニケーション技術の概要」p.4","url":"https://www.nict.go.jp/publication/shuppan/kihou-journal/houkoku68-2_HTML/2022U-02-01.pdf"},{"title":"Felix Stahlberg \"Neural Machine Translation: A Review and Survey\" (arXiv:1912.02047)","url":"https://arxiv.org/abs/1912.02047"}]},{"id":"W-016","term":"フレーム問題","category":1,"short":"無数にある物事の中から、今の行動に関係することだけを選び出すのが、AIにはとても難しいという問題。","body":"1969年に、ジョン・マッカーシーとパトリック・ヘイズが指摘しました。\n現実の世界で何かをしようとすると、考えられることは無数にあります。\nその中から、今の行動に関係のあることだけを選び出すのは、実はとても難しいのです。\nチェスのように扱う範囲が決まった問題では起きませんが、いろいろな場面で働くAIでは避けて通れません。","example":"「机の上のコップを取ってきて」と頼まれたロボットを考えます。コップを動かしたら何が起きるかを、関係のないことまですべて確かめようとして、いつまでも動けなくなってしまいます。","related":["W-007","W-010"],"sources":[{"title":"人工知能学会「人工知能の話題: フレーム問題」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics1.html"},{"title":"Stevan Harnad \"The Symbol Grounding Problem\" (arXiv:cs/9906002)","url":"https://arxiv.org/abs/cs/9906002"}]},{"id":"W-017","term":"ルールベース機械翻訳","category":1,"short":"人が書いた文法の規則と辞書に従って、文を別の言語に訳す翻訳の方式。","body":"「ルール」は規則という意味です。\n人が「この形の文はこう訳す」という規則と、単語の辞書を用意し、それに従って訳します。\n人が矛盾なく書ける規則の数には限りがあるため、いろいろな言い回しに対応するのが難しいという限界がありました。\n情報通信研究機構（NICT）の研究では、1980年代ごろに主流でしたが、その後、統計的機械翻訳に移っていきました。","related":["W-015","W-290"],"sources":[{"title":"情報通信研究機構研究報告 Vol.68 No.2（2022）「2-1 多言語コミュニケーション技術の概要」p.4","url":"https://www.nict.go.jp/publication/shuppan/kihou-journal/houkoku68-2_HTML/2022U-02-01.pdf"},{"title":"Felix Stahlberg \"Neural Machine Translation: A Review and Survey\" (arXiv:1912.02047)","url":"https://arxiv.org/abs/1912.02047"}]},{"id":"W-018","term":"ローブナーコンテスト","aliases":["ローブナー賞"],"category":1,"short":"チューリングテストの考え方で、どれだけ人間らしく会話できるプログラムかを競った大会。","body":"1991年から2019年まで、毎年開かれました。\n判定する人が文字で会話し、相手がプログラムか人間かを見分けます。人間らしく会話できるプログラムほど高く評価されました。\n一方で、「本当の知能よりも、判定する人をだますことが重視されている」といった批判もありました。","related":["W-012"],"sources":[{"title":"Avraham Rahimov, Orel Zamler, Amos Azaria \"The Turing Test is More Relevant Than Ever\" (arXiv:2505.02558)","url":"https://arxiv.org/abs/2505.02558"},{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}]},{"id":"W-019","term":"探索木","category":2,"short":"問題の状態を枝分かれの図（木）で表し、その中をたどって答えを探す方法。","body":"「今の状態」から「次にとれる状態」へと、枝分かれするように広げていった図を探索木といいます。\nゴールにたどり着くまで、この木の中を順に調べていきます。\n第一次AIブームの中心的な研究テーマでした。\n調べる順番の違いで、幅優先探索と深さ優先探索に分けられます。","example":"迷路なら、分かれ道ごとに枝分かれさせた図を描き、出口に着く道を探します。","related":["W-020","W-021","W-010"],"sources":[{"title":"Pat Morin \"Open Data Structures\" 12.3 Graph Traversal（CC BY）","url":"https://opendatastructures.org/ods-python/12_3_Graph_Traversal.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-020","term":"幅優先探索","category":2,"short":"出発点に近いところから順番に調べていく探索の方法。最短の道を見つけるのに向いている。","body":"出発点のすぐ隣、その隣、さらにその隣…というように、近いものから順に調べます。\n近い順に見つかるので、最初に見つかった答えが最短の道になります。\nただし、途中の候補をたくさん覚えておく必要があります。","example":"池に石を投げたときの波紋のように、同じ距離のところをまとめて調べながら広がっていくイメージです。","related":["W-021","W-019"],"sources":[{"title":"Pat Morin \"Open Data Structures\" 12.3 Graph Traversal（CC BY）","url":"https://opendatastructures.org/ods-python/12_3_Graph_Traversal.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-021","term":"深さ優先探索","category":2,"short":"一つの道を行き止まりまでたどってから戻り、次の道を調べる探索の方法。","body":"行ける所まで一本の道を進み、行き止まりになったら一つ前の分かれ道に戻って、別の道を試します。\n覚えておく候補が少なくて済みます。\nただし、最初に見つかった答えが最短の道とは限りません。","example":"迷路で「右の壁に手をつけて進み、行き止まりなら引き返す」ような進み方です。","related":["W-020","W-019"],"sources":[{"title":"Pat Morin \"Open Data Structures\" 12.3 Graph Traversal（CC BY）","url":"https://opendatastructures.org/ods-python/12_3_Graph_Traversal.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-022","term":"ハノイの塔","category":2,"short":"3本の棒と大きさの違う円盤を使うパズル。ルールがはっきりしたトイ・プロブレムの代表例。","body":"円盤をすべて別の棒に移すのが目的です。\n一度に動かせるのは一番上の1枚だけで、小さい円盤の上に大きい円盤を置いてはいけません。\n円盤がn枚のとき、最も少ない移動回数は「2のn乗−1」回です。\n探索の例題としてよく使われます。","example":"円盤が3枚なら、最も少なくて 2×2×2−1＝7回で移せます。","related":["W-010","W-019"],"sources":[{"title":"\"The weighted Tower of Hanoi\" (arXiv:2208.06705)","url":"https://arxiv.org/abs/2208.06705"}]},{"id":"W-023","term":"ブルートフォース","aliases":["総当たり","しらみつぶし"],"category":2,"short":"考えられる組み合わせを、一つ残らずすべて試して答えを探す方法。","body":"「力ずく」という意味の言葉で、総当たりやしらみつぶしとも呼ばれます。\n確実に答えが見つかりますが、組み合わせの数が多いと、現実的な時間では調べ終わりません。\n囲碁のように打ち方の組み合わせが膨大なゲームでは、すべてを調べ尽くすことはできません。","example":"4桁の数字の鍵を、0000から9999まで順番に全部試して開けるようなやり方です。","related":["W-026","W-024"],"sources":[{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"},{"title":"Aske Plaat \"Deep Reinforcement Learning\" (arXiv:2201.02135) 17.1 Move-Level Self-Play","url":"https://arxiv.org/abs/2201.02135"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-024","term":"Mini-Max法","aliases":["ミニマックス法"],"category":2,"short":"対戦ゲームで、自分は得点が最大、相手は自分の得点が最小になる手を選ぶと考えて、最善の手を決める方法。","body":"自分の番では、自分にとって一番よい手を選ぶと考えます。\n相手の番では、相手も相手にとって一番よい手、つまり自分にとって一番困る手を選ぶと考えます。\nこうして先の展開を読み、今打つべき手を決めます。\n最後まで読み切れないときは、決めた深さまで読み、そこで盤面の良し悪しを点数（評価関数）で見積もります。","related":["W-025","W-026","W-019"],"sources":[{"title":"Aske Plaat \"Deep Reinforcement Learning\" (arXiv:2201.02135) 17.1 Move-Level Self-Play","url":"https://arxiv.org/abs/2201.02135"},{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"}]},{"id":"W-025","term":"αβ法","aliases":["アルファベータ法"],"category":2,"short":"Mini-Max法で、結果に関係しないとわかった枝の探索を途中でやめ、計算を減らす工夫。","body":"先を読んでいくと、「この先をいくら調べても、選ばれることはない」とわかる枝が出てきます。\nαβ法は、そうした枝を調べるのを途中でやめます。これを枝刈りといいます。\nMini-Max法と同じ答えを、より少ない計算で出せます。","example":"すでに「この手を選べば最低でも10点取れる」とわかっているとき、明らかに10点未満になる手は、最後まで調べなくてよい、という考え方です。","related":["W-024","W-019"],"sources":[{"title":"Aske Plaat \"Deep Reinforcement Learning\" (arXiv:2201.02135) 17.1 Move-Level Self-Play","url":"https://arxiv.org/abs/2201.02135"},{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"}]},{"id":"W-026","term":"モンテカルロ法","aliases":["モンテカルロ木探索"],"category":2,"short":"ある局面から最後までランダムに打つ試しを何度も繰り返し、勝った割合が高い手を選ぶ方法。","body":"囲碁のように盤面の良し悪しを点数にしにくいゲームで、大きな成果を上げました。\n専門家が作った点数の付け方（評価関数）がなくても、ゲームのルールさえわかれば使えます。\nアルファ碁は、この方法とディープラーニングを組み合わせていました。","example":"ある手を打った後、最後までデタラメに打つ試合を1000回して、600回勝てば「勝率60％の手」とみなす、というイメージです。","related":["W-054","W-024","W-023"],"sources":[{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"},{"title":"Aske Plaat \"Deep Reinforcement Learning\" (arXiv:2201.02135) 17.1 Move-Level Self-Play","url":"https://arxiv.org/abs/2201.02135"}]},{"id":"W-027","term":"STRIPS","aliases":["ストリップス"],"category":2,"short":"行動を「始める条件」「増える事実」「なくなる事実」の組で表し、目標までの行動の手順を立てる方法。","body":"1971年にファイクスとニルソンが発表した、自動で計画を立てる（プランニング）ための仕組みです。\nそれぞれの行動を、「行う前に成り立っている必要があること（前提条件）」「行った後に新しく成り立つこと」「成り立たなくなること」の3つで表します。\nこれを使って、初めの状態から目標の状態にたどり着く行動の並びを探します。","example":"「箱を持ち上げる」という行動なら、前提条件は「手が空いている」、増える事実は「箱を持っている」、なくなる事実は「手が空いている」です。","related":["W-028"],"sources":[{"title":"Diego Aineto ほか \"Learning Strips Action Models with Classical Planning\" (arXiv:1903.01153)","url":"https://arxiv.org/abs/1903.01153"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-028","term":"SHRDLU","aliases":["シュルドゥルー"],"category":2,"short":"積み木の世界について英語の指示を理解し、ロボットアームで積み木を動かした、1970年代初めのプログラム。","body":"テリー・ウィノグラードが1971年にデモを行いました。\n積み木が置かれた限られた世界（積み木の世界）で、人が英語で出した指示を理解し、そのとおりに積み木を動かしました。\n言葉の理解と行動を結び付けた点で注目されました。","related":["W-027","W-029"],"sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-029","term":"イライザ（ELIZA）","aliases":["ELIZA","イライザ"],"category":2,"short":"1960年代に作られた会話プログラム。意味を理解せずに、決まった型で受け答えして会話しているように見せた。","body":"ジョセフ・ワイゼンバウムが1960年代半ばに作りました。\n入力された文を決まったパターンに当てはめ、相手の言葉の一部を使って返事を組み立てます。\n精神科医（カウンセラー）をまねたバージョンが特に知られています。\n意味は理解していないのに、多くの人がまるで話をわかってくれているように感じたことが話題になりました。","example":"「頭が痛い」と入力すると、「なぜ頭が痛いのですか？」と、相手の言葉を使って聞き返す、といった受け答えです。","related":["W-012","W-028"],"sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"\"Deep Learning and Machine Learning - Natural Language Processing: From Theory to Application\" (arXiv:2411.05026) 1.1","url":"https://arxiv.org/abs/2411.05026"}]},{"id":"W-030","term":"エキスパートシステム","category":2,"short":"専門家の知識をコンピュータに取り込み、その分野の専門家のように推論して答えるプログラム。","body":"1980年代の第二次AIブームで、たくさん作られました。\n知識は「もし〜ならば〜」という形の規則（ルール）で表すことが多く、それを組み合わせて結論を出します。\n医療の診断を助けるマイシン（MYCIN）などが知られています。\nただし、必要な知識を人が書き出して与える必要があり、その作業が壁になりました（知識獲得のボトルネック）。","related":["W-032","W-031","W-011","W-033"],"sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-031","term":"DENDRAL","aliases":["デンドラル"],"category":2,"short":"化合物の分析データから、その化合物の構造を推定した、初期の知識を使うプログラム。","body":"1967年にファイゲンバウムらが開発しました。\n分子を分解したときにできる破片の重さの分布（質量スペクトル）を調べ、元の化合物の構造を推定しました。\n専門家の知識を使って科学の分析に成功した、最も初期のプログラムとされています。","related":["W-030","W-032"],"sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-032","term":"マイシン（MYCIN）","aliases":["MYCIN","マイシン"],"category":2,"short":"病気の診断を助けるために作られた、代表的なエキスパートシステム。","body":"1974年ごろにショートリフが示したシステムです。\n医療の診断の知識を「もし〜ならば〜」という規則で表し、それを使って推論しました。\n規則を使って推論する方法（ルールベースシステム）の有効性を示し、最初のエキスパートシステムと呼ばれています。","related":["W-030","W-031","W-011"],"sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}]},{"id":"W-033","term":"インタビューシステム","category":2,"short":"専門家との質問と回答のやり取りを通して、専門家が持つ知識を引き出して整理するための仕組み。","body":"エキスパートシステムを作るには、専門家の知識を集めて書き出す必要があります。\nしかし、専門家の知識には、本人もうまく言葉にできないものが多く含まれます。\nそこで、質問を投げかけて答えてもらう形で、知識を少しずつ引き出していきます。","example":"「この症状のとき、どんな点に注意して判断しますか？」のような質問を重ねて、専門家の判断の決め手を聞き出します。","related":["W-030","W-011"],"sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"Huaying Zhang ほか \"Evaluating the Capability of Video Question Generation for Expert Knowledge Elicitation\" (arXiv:2512.15006)","url":"https://arxiv.org/abs/2512.15006"}]},{"id":"W-034","term":"is-aの関係・has-aの関係・part-ofの関係","aliases":["is-aの関係","has-aの関係","part-ofの関係","is-a","part-of"],"category":2,"short":"知識を表すときに使う、概念どうしの関係の種類。「〜の一種」「〜を持つ」「〜の一部」を区別する。","body":"is-a（〜の一種）は、上位と下位の関係です。「自動車は車両の一種」のように使います。\npart-of（〜の一部）は、部分と全体の関係です。「エンジンは自動車の一部」のように使います。\nhas-a（〜を持つ）は、全体の側から見た関係で、「自動車はエンジンを持つ」のように使います。\nis-a の関係では、「AはBの一種」「BはCの一種」なら「AはCの一種」と言えます（推移律）。\nこれらを混ぜると、「車両に言えることはエンジンにも言える」といった誤った推論につながるため、区別します。","related":["W-035","W-036"],"sources":[{"title":"W3C \"Simple part-whole relations in OWL Ontologies\"","url":"https://www.w3.org/2001/sw/BestPractices/OEP/SimplePartWhole/"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-035","term":"意味ネットワーク","category":2,"short":"概念を点、概念どうしの関係を矢印で結んで、知識を網の目のように表す方法。","body":"「犬」「動物」「しっぽ」のような概念を点で表します。\nその間を、「犬 → 動物（〜の一種）」「しっぽ → 犬（〜の一部）」のような関係の矢印で結びます。\n1966年にキリアンがデモを行いました。","related":["W-034","W-036"],"sources":[{"title":"W3C \"Simple part-whole relations in OWL Ontologies\"","url":"https://www.w3.org/2001/sw/BestPractices/OEP/SimplePartWhole/"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-036","term":"オントロジー","category":2,"short":"ある分野の知識を表すための言葉（概念）と、その関係を、コンピュータで扱える形で決めたもの。","body":"医療や製造など、ある分野で使う基本的な概念と、概念どうしの関係を定義します。\n人やコンピュータのプログラムが、分野の情報を同じ意味で共有したり、再利用したりできるようにするために使われます。\nウェブ上のデータに意味を持たせるセマンティックWebでは、オントロジーを書くための言語（OWL）が標準になっています。","related":["W-037","W-035","W-034","W-038"],"sources":[{"title":"W3C \"OWL Web Ontology Language Use Cases and Requirements\"","url":"https://www.w3.org/TR/webont-req/"},{"title":"W3C Semantic Web Activity \"What is the Semantic Web?\"","url":"https://www.w3.org/2001/sw/"}]},{"id":"W-037","term":"セマンティックWeb","category":2,"short":"ウェブ上のデータに意味を持たせ、アプリや組織の垣根を越えて共有・再利用できるようにする取り組み。","body":"ウェブの標準を決める団体（W3C）が中心になって進めてきました。\nウェブを、人が読む文書の集まりから、コンピュータが意味を扱える「データのウェブ」にすることを目指します。\nデータに意味を与える共通の決まり（RDF）や、概念の関係を決めるオントロジーの言語（OWL）を使います。","related":["W-036"],"sources":[{"title":"W3C Semantic Web Activity \"What is the Semantic Web?\"","url":"https://www.w3.org/2001/sw/"},{"title":"W3C \"OWL Web Ontology Language Use Cases and Requirements\"","url":"https://www.w3.org/TR/webont-req/"}]},{"id":"W-038","term":"Cycプロジェクト","aliases":["Cyc","サイクプロジェクト"],"category":2,"short":"人間が持っている一般常識をすべてコンピュータに教え込もうとした、長期の研究プロジェクト。","body":"1984年にダグラス・レナートが始めました。\n専門分野に限ったエキスパートシステムでは扱えない、誰もが当たり前に知っている常識を、大量の知識として書き出そうとしました。\n人が知識を書き出していく方式のため、膨大な作業が必要になりました。","related":["W-011","W-036","W-030"],"sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-039","term":"Question-Answering","aliases":["質問応答システム","QAシステム"],"category":2,"short":"人が言葉で出した質問に、コンピュータが答えを返す仕組み。","body":"質問の意味を読み取り、たくさんの知識や文書の中から答えを探して返します。\nIBMのワトソンは、この技術で2011年に米国のクイズ番組で歴代の強豪チャンピオンに勝ちました。\n答えるだけでなく、自分の答えにどれくらい自信があるかを見積もることも大切でした。","related":["W-040","W-291"],"sources":[{"title":"Gerald Tesauro ほか \"Analysis of Watson's Strategies for Playing Jeopardy!\" (arXiv:1402.0571)","url":"https://arxiv.org/abs/1402.0571"},{"title":"Santanu Acharjee, Upashana Gogoi \"The limit of human intelligence\" (arXiv:2310.10792)","url":"https://arxiv.org/abs/2310.10792"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}]},{"id":"W-040","term":"ワトソン","aliases":["Watson"],"category":2,"short":"IBMが開発した質問応答システム。2011年に米国のクイズ番組で強豪チャンピオンに勝った。","body":"米国のクイズ番組「ジェパディ！」で、歴代の強豪チャンピオン2人に勝ちました。\n言葉で出される難しい問題に、幅広い知識をもとに素早く答える必要があり、質問応答の技術を大きく進歩させました。","related":["W-039","W-291"],"sources":[{"title":"Gerald Tesauro ほか \"Analysis of Watson's Strategies for Playing Jeopardy!\" (arXiv:1402.0571)","url":"https://arxiv.org/abs/1402.0571"},{"title":"Santanu Acharjee, Upashana Gogoi \"The limit of human intelligence\" (arXiv:2310.10792)","url":"https://arxiv.org/abs/2310.10792"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}]},{"id":"W-041","term":"東ロボくん","aliases":["ロボットは東大に入れるか"],"category":2,"short":"大学入試を問題として使い、AIに何ができて何ができないかを調べた、日本のAIの研究プロジェクト。","body":"国立情報学研究所が中心になって、2011年に始めた「ロボットは東大に入れるか」というプロジェクトのAIの名前です。\n大学入試を、性能をはかる物差し（ベンチマーク）として使いました。\n文章の理解や数式の処理など、AIのいろいろな技術の精度を高めることを目指しました。","related":["W-048"],"sources":[{"title":"文部科学省 中央教育審議会 資料3-1 新井紀子「AIが大学入試を突破する時代に求められる人材育成」（2016年6月30日）","url":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo14/shiryo/__icsFiles/afieldfile/2016/07/04/1373986_3_1.pdf"}]},{"id":"W-042","term":"データマイニング","category":2,"short":"大量のデータの中に埋もれている規則や傾向を、自動で見つけ出す技術。","body":"「マイニング」は、鉱山から鉱石を掘り出すという意味です。\n1990年代半ばに生まれました。\n人が気づかなかった、役に立つ規則や知識を、データから掘り出します。","example":"スーパーの売上の記録から、「この商品を買う人は、あの商品も一緒に買うことが多い」という傾向を見つける、といった使い方です。","related":["W-043","W-044"],"sources":[{"title":"人工知能学会「人工知能の話題: Web構造マイニング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics6.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-043","term":"ウェブマイニング","category":2,"short":"ウェブの文章やページのつながり、閲覧の記録などから、役に立つ知識を見つけ出す技術。","body":"データマイニングの一つの分野です。\nウェブに書かれた内容から情報を取り出すもの、ページどうしのリンクのつながり方を調べるもの、閲覧の記録を調べるものなどがあります。\nリンクのつながりを調べる研究は、検索結果の表示順を決める技術などにも使われています。","related":["W-042"],"sources":[{"title":"人工知能学会「人工知能の話題: Web構造マイニング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics6.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}]},{"id":"W-044","term":"ビッグデータ","category":2,"short":"インターネットの普及などで集まるようになった、とても大量で多様なデータのこと。","body":"1990年代にウェブが広まり、2000年代に家庭にもネットワークが普及すると、やり取りされるデータの量が大きく増えました。\n研究に使えるデータを大量に手に入れられるようになり、コンピュータの計算能力も上がりました。\nこれが機械学習を大きく進歩させ、第三次AIブームのきっかけになりました。","related":["W-002","W-042"],"sources":[{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-045","term":"スパムフィルタ","aliases":["迷惑メールフィルタ"],"category":2,"short":"届いたメールが迷惑メール（スパム）かどうかを自動で見分けて、振り分ける仕組み。","body":"機械学習を使うスパムフィルタは、「迷惑メール」と「普通のメール」に分けた大量の例から、見分け方を自動で学びます。\n学んだ見分け方を使って、新しく届いたメールを振り分けます。\n機械学習の身近な応用例の代表です。","example":"「今すぐクリック」「当選しました」のような言葉が多いメールは迷惑メールらしい、という傾向を、例から自動で学びます。","related":["W-002","W-061"],"sources":[{"title":"Ion Androutsopoulos ほか \"An evaluation of Naive Bayesian anti-spam filtering\" (arXiv:cs/0006013)","url":"https://arxiv.org/abs/cs/0006013"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-046","term":"レコメンデーションエンジン","aliases":["推薦システム","レコメンデーション"],"category":2,"short":"その人が興味を持ちそうな商品や情報を選んで勧める仕組み。","body":"通販サイトの「この商品を買った人はこんな商品も買っています」のような機能に使われています。\n主な方法に、好みの似た人の評価をもとに勧める協調フィルタリングと、商品の内容をもとに勧めるコンテンツベースフィルタリングがあります。","related":["W-091","W-092","W-093"],"sources":[{"title":"人工知能学会「人工知能の話題: 協調フィルタリング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics2.html"}]},{"id":"W-047","term":"次元の呪い","category":2,"short":"データを表す特徴の数（次元）が増えると、よいモデルを作るのに必要なデータの量が急激に増えてしまう現象。","body":"1961年にリチャード・ベルマンが名付けた言葉です。\n特徴の数が増えるほど、データは広い空間の中にまばらに散らばり、限られたデータでは空間を覆いきれなくなります。\nそのため、役に立つ特徴を選んだり、次元を減らしたりする工夫（次元削減）が行われます。","example":"1本の線の上なら10個の点で端から端まで覆えても、正方形なら100個、立方体なら1000個必要になる、というように、次元が増えるほど必要な数は一気に増えます。","related":["W-084","W-059","W-106"],"sources":[{"title":"Pádraig Cunningham ほか \"Feature Selection Tutorial with Python Examples\" (arXiv:2106.06437)","url":"https://arxiv.org/abs/2106.06437"}]},{"id":"W-048","term":"統計的自然言語処理","category":2,"short":"大量の文章から、言葉の使われ方の確率を学んで、言葉を処理する方法。","body":"人の言葉（自然言語）をコンピュータで扱うことを、自然言語処理といいます。\nかつては、専門家が手で書いた規則を使う方法が中心でしたが、現実の言葉の複雑さに対応しきれませんでした。\nそこで、大量の文章の集まり（コーパス）から確率のモデルを学ぶ方法に移っていきました。これが統計的自然言語処理です。\n2010年代以降は、ディープラーニングを使う方法が主流になっています。","related":["W-393","W-015","W-306","W-271"],"sources":[{"title":"\"Deep Learning and Machine Learning - Natural Language Processing: From Theory to Application\" (arXiv:2411.05026) 1.1","url":"https://arxiv.org/abs/2411.05026"}]},{"id":"W-049","term":"人間の神経回路","category":2,"short":"脳の中で、神経細胞がつながり合って情報を伝え合う仕組み。ニューラルネットワークの手本になった。","body":"ニューラルネットワークは、この神経回路の仕組みを手本にして作られた計算の仕組みです。\nただし、脳の神経細胞を正確に再現しているわけではありません。あくまで「手本にした」ものです。\n1943年に、マカロックとピッツが、神経細胞をまねた計算のモデル（人工ニューロン）を提案しました。","related":["W-122","W-128"],"sources":[{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-050","term":"ネオコグニトロン","category":2,"short":"福島邦彦が1979年ごろに発表した、今の畳み込みニューラルネットワーク（CNN）によく似た構造の初期のネットワーク。","body":"画像の小さな範囲から特徴を取り出す処理（畳み込み）や、それを縮める処理（のちのプーリング）を組み合わせていました。\n「深い」と呼べる、最も初期のネットワークの一つとされています。","related":["W-051","W-182","W-184","W-196"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-051","term":"LeNet","aliases":["ルネット"],"category":2,"short":"ルカンらが作った、手書きの数字を読み取るための初期の畳み込みニューラルネットワーク（CNN）。","body":"ルカンらは1989年に、誤差逆伝播法で学習するCNNを、手書きの郵便番号の読み取りに使いました。\nこの流れのネットワークが、LeNetとして知られています。\n手書き数字の画像を集めたデータセット（MNIST）も有名になりました。","related":["W-050","W-182","W-127"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-052","term":"ImageNet","aliases":["イメージネット"],"category":2,"short":"大量の画像に、写っている物の名前を付けた、大規模な画像のデータセット。","body":"画像認識の研究に広く使われています。\nこれを使った画像認識のコンテスト（ILSVRC）では、1000種類の物を見分ける課題などで、性能が競われました。","related":["W-053","W-248"],"sources":[{"title":"Olga Russakovsky ほか \"ImageNet Large Scale Visual Recognition Challenge\" (arXiv:1409.0575)","url":"https://arxiv.org/abs/1409.0575"},{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-053","term":"ILSVRC","category":2,"short":"ImageNetの画像を使って、画像認識の正確さを競ったコンテスト。2012年にディープラーニングが大差で優勝した。","body":"2010年から毎年開かれました。\n2012年に、GPU（計算の速い処理装置）で学習させた深い畳み込みニューラルネットワーク（AlexNet）が、大差で優勝しました。\nこれをきっかけに、ディープラーニングが画像認識の主流になりました。","related":["W-052","W-248","W-003","W-202","W-132","W-182"],"sources":[{"title":"Olga Russakovsky ほか \"ImageNet Large Scale Visual Recognition Challenge\" (arXiv:1409.0575)","url":"https://arxiv.org/abs/1409.0575"},{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-054","term":"アルファ碁（AlphaGo）","aliases":["AlphaGo","アルファ碁"],"category":2,"short":"ディープマインドが開発した囲碁のAI。2016年に世界トップクラスの棋士に4勝1敗で勝った。","body":"囲碁は打ち方の組み合わせがとても多く、AIが人間に勝つにはまだ時間がかかると考えられていたため、大きな驚きを与えました。\nディープラーニングと強化学習を組み合わせた方法（深層強化学習）と、モンテカルロ木探索を使っていました。\n後に作られたAlphaZeroは、人間の対局の記録を使わずに、自分どうしの対戦だけで学んで、さらに強くなりました。","related":["W-026","W-058","W-003","W-311"],"sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"}]},{"id":"W-055","term":"生成AI","aliases":["生成系AI","ジェネレーティブAI"],"category":2,"short":"文章や画像、音声などを新しく作り出せるAIのこと。","body":"2022年に公開された対話型のAI「ChatGPT」をきっかけに、特に注目されるようになりました。\n大量のデータで学習した大規模なモデル（基盤モデルや大規模言語モデル）の登場と、計算機の性能向上が背景にあります。\n普通の言葉で指示するだけで使えるのが特徴です。","example":"「夏の海の絵を描いて」と頼むと画像を作ったり、「この文章を短くまとめて」と頼むと要約を書いたりします。","related":["W-285","W-358","W-336","W-218"],"sources":[{"title":"総務省 令和6年版 情報通信白書「生成AIの急速な進化と普及」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131210.html"}]},{"id":"W-056","term":"教師あり学習","category":3,"short":"「問題」と「正解」の組をたくさん見せて、正解の出し方をAIに学ばせる方法。","body":"機械学習の代表的な学び方の一つです。\n学習に使うデータには、それぞれ正解（ラベル）が付いています。これを教師データと呼ぶこともあります。\nAIは、データと正解の関係を学び、正解のわからない新しいデータに対して答えを予測します。\n予測したいものが数値なら回帰問題、種類（カテゴリ）なら分類問題といいます。","example":"「猫」「犬」と名前が付いた写真をたくさん見せて学ばせ、新しい写真が猫か犬かを当てさせる方法です。","related":["W-060","W-061","W-057","W-058","W-059"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Ting Chen ほか \"A Simple Framework for Contrastive Learning of Visual Representations\" (arXiv:2002.05709)","url":"https://arxiv.org/abs/2002.05709"},{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"}]},{"id":"W-057","term":"教師なし学習","category":3,"short":"正解の付いていないデータだけを使って、データの中にある構造やまとまりを見つけさせる方法。","body":"機械学習の代表的な学び方の一つです。\n正解（ラベル）は使いません。データそのものの特徴から、似たもの同士をまとめたり、データを少ない数の特徴で表したりします。\n似たものをまとめるクラスタリングや、特徴の数を減らす次元削減が代表例です。","example":"お客さんの買い物の記録だけから、「よく似た買い方をするグループ」を自動で見つけ出すのが一例です。","related":["W-080","W-084","W-056","W-058"],"sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"},{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}]},{"id":"W-058","term":"強化学習","category":3,"short":"試行錯誤しながら、もらえるごほうび（報酬）の合計が大きくなるような行動の仕方を学ぶ方法。","body":"機械学習の代表的な学び方の一つです。\n学ぶ主体（エージェント）が、周りの環境の中で行動し、その結果として報酬を受け取ります。\n正解を教わるのではなく、報酬を手がかりに、よい行動の仕方（方策）を自分で見つけていきます。\nゲームやロボットの制御などで使われています。","example":"ゲームのAIが、勝てばプラス、負ければマイナスの報酬を受け取りながら、何度も対戦して強い打ち方を身につけるのが一例です。","related":["W-094","W-098","W-100","W-005","W-056"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-059","term":"特徴量","category":3,"short":"データの特徴を表す数値や項目のこと。AIは特徴量をもとに予測や判断をする。","body":"機械学習では、データを、そのデータをよく表す項目の組で表します。この一つひとつの項目が特徴量です。\nどの特徴量を使うかで、予測の精度は大きく変わります。\nディープラーニングより前は、特徴量を人が考えて決めていました。ディープラーニングは、特徴量をデータから自分で見つけ出せます。","example":"家の値段を予測するなら、「広さ」「駅からの距離」「築年数」などが特徴量になります。","related":["W-056","W-003","W-047"],"sources":[{"title":"JDLA「G検定の試験出題範囲（シラバス）G2024#6～」","url":"https://www.jdla.org/download/g%e6%a4%9c%e5%ae%9a%e3%81%ae%e8%a9%a6%e9%a8%93%e5%87%ba%e9%a1%8c%e7%af%84%e5%9b%b2-%ef%bc%88%e3%82%b7%e3%83%a9%e3%83%90%e3%82%b9%ef%bc%89g20246%ef%bd%9ev1-4/"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"Pádraig Cunningham ほか \"Feature Selection Tutorial with Python Examples\" (arXiv:2106.06437)","url":"https://arxiv.org/abs/2106.06437"}]},{"id":"W-060","term":"回帰問題","aliases":["回帰"],"category":3,"short":"気温や売上のような、連続した数値を予測する問題。","body":"教師あり学習で扱う問題の一つです。\n予測したい答えが、「明日の最高気温」のように、連続した数値になるものを回帰問題といいます。\n答えが「迷惑メールかどうか」のような種類になるものは、分類問題と呼んで区別します。","example":"過去の気象データから、明日の最高気温を「28.5度」のように数値で予測する問題です。","related":["W-061","W-063","W-056"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-061","term":"分類問題","aliases":["分類"],"category":3,"short":"データがどの種類（クラス）に当てはまるかを予測する問題。","body":"教師あり学習で扱う問題の一つです。\n答えが、「迷惑メールか、そうでないか」のような種類になるものを分類問題といいます。\n2つの種類に分けるものを2値分類、3つ以上に分けるものを多クラス分類といいます。","example":"写真に写っている動物が、犬・猫・鳥のどれかを当てる問題です。","related":["W-060","W-062","W-066","W-111","W-056"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-062","term":"多クラス分類","category":3,"short":"データを3つ以上の種類（クラス）のどれかに分ける分類問題。","body":"「犬・猫・鳥」のように、3つ以上のクラスに分ける問題です。\n2つに分ける方法を組み合わせて実現することもできます。\nたとえば「犬か、それ以外か」「猫か、それ以外か」を判定する仕組みをクラスの数だけ作り、組み合わせます（One-vs-Rest）。","related":["W-061","W-138"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-063","term":"線形回帰","category":3,"short":"予測したい値を、特徴量にそれぞれ係数を掛けて足し合わせた式で表す、回帰の方法。","body":"「売上 ＝ a × 気温 ＋ b × 広告費 ＋ c」のような、足し算と掛け算だけの式（一次式）で予測します。\n係数（a、bなど）は、実際の値と予測値の差をなるべく小さくするように決めます。代表的な決め方が最小二乗法です。\n使う特徴量が1つなら単回帰分析、2つ以上なら重回帰分析といいます。","related":["W-064","W-065","W-406","W-060","W-059"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-064","term":"単回帰分析","category":3,"short":"1つの特徴量（説明変数）だけを使って、ある値を予測する線形回帰。","body":"予測に使う値（説明変数）が1つだけの線形回帰です。\nグラフにすると、データの点の集まりの中を通る1本の直線を求めることになります。","example":"気温だけを使って、アイスクリームの売上を予測するのが単回帰分析です。","related":["W-065","W-063","W-059"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-065","term":"重回帰分析","category":3,"short":"2つ以上の特徴量（説明変数）を使って、ある値を予測する線形回帰。","body":"予測に使う値（説明変数）が2つ以上ある線形回帰です。\n複数の要因を同時に考えて予測できます。","example":"気温、曜日、広告費を使って、売上を予測するのが重回帰分析です。","related":["W-064","W-063","W-059"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-066","term":"ロジスティック回帰","category":3,"short":"名前に「回帰」と付くが、あるクラスに当てはまる確率を出して、分類に使う方法。","body":"特徴量から計算した値を、0から1の間の数に変換して、「あるクラスに当てはまる確率」として出します。\nこの変換に使う関数を、シグモイド関数（ロジスティック関数）といいます。\n確率が決めた境目（ふつうは0.5）より大きいかどうかで、クラスを判定します。","example":"メールが迷惑メールである確率を「0.9」と出し、0.5より大きいので迷惑メールと判定する、という使い方です。","related":["W-061","W-134","W-060","W-059"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-067","term":"サポートベクターマシン（SVM）","aliases":["サポートベクターマシン","SVM"],"category":3,"short":"クラスの境目となる線を、両側のデータからできるだけ離れた位置に引いて分類する方法。","body":"分類などに使える教師あり学習の方法です。\n境目の線と、それに一番近いデータとの距離（マージン）が最も大きくなるように、境目を決めます（マージン最大化）。\n境目を決めるのに使われる、境目の近くにあるデータを、サポートベクターと呼びます。\n直線で分けられないデータも、カーネルトリックという工夫で扱えます。","related":["W-068","W-070","W-069","W-061","W-056"],"sources":[{"title":"scikit-learn User Guide 1.4 Support Vector Machines","url":"https://scikit-learn.org/stable/modules/svm.html"}]},{"id":"W-068","term":"マージン最大化","category":3,"short":"クラスの境目と、それに一番近いデータとの距離（マージン）が、できるだけ大きくなるように境目を決める考え方。","body":"サポートベクターマシンの基本となる考え方です。\nマージンが大きいほど、新しいデータに対しても間違えにくくなると考えられています。","example":"2つのグループの間に道を通すとき、どちらのグループからもできるだけ離れた、幅の広い道を選ぶイメージです。","related":["W-067"],"sources":[{"title":"scikit-learn User Guide 1.4 Support Vector Machines","url":"https://scikit-learn.org/stable/modules/svm.html"}]},{"id":"W-069","term":"カーネル","aliases":["カーネル関数"],"category":3,"short":"サポートベクターマシンで、データどうしの近さを計算するための関数。畳み込みでは小さな重みの表を指す。","body":"機械学習では、「カーネル」という言葉が2つの意味で使われます。\nサポートベクターマシンでは、データを高い次元の空間に移したときの近さ（内積）を計算する関数のことです。多項式カーネルやRBF（ガウス）カーネルがあります。\n畳み込みニューラルネットワークでは、画像の上をずらしながら掛け算に使う、小さな重みの表（フィルタ）のことを指します。","related":["W-070","W-067","W-185","W-184","W-180","W-182"],"sources":[{"title":"scikit-learn User Guide 1.4 Support Vector Machines","url":"https://scikit-learn.org/stable/modules/svm.html"},{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-070","term":"カーネルトリック","category":3,"short":"データを高い次元の空間に移したときの計算を、実際に移さずにカーネル関数で済ませる工夫。","body":"直線では分けられないデータも、より高い次元の空間に移すと分けられるようになることがあります。\nしかし、実際に高い次元に移して計算すると、計算量がとても大きくなります。\nカーネルトリックは、移した先での近さの計算を、カーネル関数で直接求めることで、この手間を省きます。","example":"平面の上で円の内側と外側に分かれているデータは、直線では分けられません。「中心からの距離」という高さを加えて立体にすると、平らな板で上下に分けられるようになる、というイメージです。","related":["W-069","W-067"],"sources":[{"title":"scikit-learn User Guide 1.4 Support Vector Machines","url":"https://scikit-learn.org/stable/modules/svm.html"}]},{"id":"W-071","term":"決定木","category":3,"short":"「もし〜なら」という質問を木の枝のようにつなげて、予測や分類をする方法。","body":"データの特徴量について「もし〜なら左、そうでなければ右」という質問を重ねていき、最後にたどり着いた先で答えを出します。\n分類にも回帰にも使えます。\nどういう理由で判断したかを、人が追いかけやすいのが長所です。\n一方、木を複雑にしすぎると過学習しやすく、データが少し変わるだけで大きく違う木ができやすいという弱点があります。","example":"「気温が25度以上？」→「はい」→「雨？」→「いいえ」→「アイスがよく売れる」のように、質問をたどって答えを出します。","related":["W-075","W-077","W-072","W-106","W-061","W-059","W-060"],"sources":[{"title":"scikit-learn User Guide 1.10 Decision Trees","url":"https://scikit-learn.org/stable/modules/tree.html"}]},{"id":"W-072","term":"アンサンブル学習","category":3,"short":"複数のモデルの予測を組み合わせて、1つのモデルよりよい予測をする方法。","body":"「三人寄れば文殊の知恵」のように、複数のモデルの答えをまとめます。\nまとめ方には、複数のモデルの予測を平均したり多数決をとったりする方法（バギングなど）があります。\nまた、モデルを順番に追加して、前のモデルの間違いを補っていく方法（ブースティング）もあります。\nランダムフォレストや勾配ブースティングが代表例です。","related":["W-074","W-076","W-075","W-077"],"sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}]},{"id":"W-073","term":"ブートストラップサンプリング","category":3,"short":"元のデータから、同じデータを何度選んでもよいというルールで、ランダムにデータを取り出す方法。","body":"取り出したデータを元に戻してから次を選ぶので、同じデータが何度も選ばれることがあります（復元抽出）。\nこうして作ったデータの集まりを、ブートストラップ標本といいます。\nバギングやランダムフォレストで、少しずつ違う学習データを作るのに使われます。","example":"袋に番号札を10枚入れ、1枚引いて番号を書き留めたら袋に戻す、を10回繰り返すと、同じ番号が2回出ることもあります。","related":["W-074","W-075"],"sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}]},{"id":"W-074","term":"バギング","category":3,"short":"ブートストラップサンプリングで作った少しずつ違うデータで、同じ種類のモデルを複数作り、予測をまとめる方法。","body":"アンサンブル学習の方法の一つです。\nそれぞれのモデルの予測を、平均や多数決でまとめます。\n決定木のように、データによって結果がぶれやすいモデルの予測を安定させられます。\n各モデルは別々に作れるので、同時に並行して学習できます。","related":["W-073","W-075","W-076","W-072","W-071"],"sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}]},{"id":"W-075","term":"ランダムフォレスト","category":3,"short":"たくさんの決定木を、少しずつ違うデータと特徴量で作り、その予測をまとめる方法。","body":"「フォレスト」は森という意味で、決定木（木）をたくさん集めたものです。\nそれぞれの木は、ブートストラップサンプリングで作ったデータで学習します。\nさらに、木の枝分かれを決めるたびに、使う特徴量の一部をランダムに選びます。\nこうして木どうしを違ったものにし、予測を多数決（分類）や平均（回帰）でまとめることで、1本の木より安定した予測ができます。","related":["W-071","W-074","W-073","W-072","W-059","W-061","W-060"],"sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}]},{"id":"W-076","term":"ブースティング","category":3,"short":"弱いモデルを順番に追加し、前のモデルが間違えたところを次のモデルが補うようにして、強いモデルを作る方法。","body":"アンサンブル学習の方法の一つです。\n前の結果を使って次のモデルを作るので、順番に学習させます。\n代表的なAdaBoostでは、前のモデルが間違えたデータの重みを大きくして、次のモデルがそのデータを重視するようにします。\n最後に、すべてのモデルの予測を重みを付けてまとめます。","example":"テストで間違えた問題を中心に復習し、次のテストに備える、ということを繰り返していくイメージです。","related":["W-077","W-074","W-072","W-180"],"sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}]},{"id":"W-077","term":"勾配ブースティング","aliases":["勾配ブースティング決定木"],"category":3,"short":"決定木を1本ずつ足していき、それまでの予測の誤差を小さくするように新しい木を学習させる方法。","body":"ブースティングの考え方を、いろいろな誤差の測り方に使えるように広げた方法です。\n小さめの決定木を順番に足していき、新しい木は、それまでの予測のずれを小さくするように学習します。\n表の形のデータで、特に高い性能を出すことが知られています。","related":["W-076","W-071","W-072"],"sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}]},{"id":"W-078","term":"自己回帰モデル（ARモデル）","aliases":["自己回帰モデル","ARモデル"],"category":3,"short":"ある時系列の今の値を、その時系列自身の過去の値から予測するモデル。","body":"時間の順に並んだデータ（時系列データ）を分析するためのモデルです。\n今日の値を、昨日やおとといの値を使った式で表します。\n何日前までの値を使うか（次数）は、AICなどの基準を使って決めます。","example":"今日の売上を、昨日とおとといの売上から予測するのが一例です。","related":["W-079","W-203","W-119"],"sources":[{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"},{"title":"statsmodels Vector Autoregressions (tsa.vector_ar)","url":"https://www.statsmodels.org/stable/vector_ar.html"}]},{"id":"W-079","term":"ベクトル自己回帰モデル（VARモデル）","aliases":["ベクトル自己回帰モデル","VARモデル"],"category":3,"short":"複数の時系列を同時に扱い、それぞれの今の値を、すべての時系列の過去の値から予測するモデル。","body":"自己回帰モデル（ARモデル）を、複数の時系列に広げたものです。\n互いに影響し合う時系列の関係を分析するのに使われます。","example":"売上と広告費のように、互いに影響し合う2つの時系列を、まとめて分析する場合に使います。","related":["W-078","W-203"],"sources":[{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"},{"title":"statsmodels Vector Autoregressions (tsa.vector_ar)","url":"https://www.statsmodels.org/stable/vector_ar.html"}]},{"id":"W-080","term":"クラスタリング","category":3,"short":"正解のないデータを、似ているもの同士のグループ（クラスタ）に自動で分けること。","body":"教師なし学習の代表的な方法です。\nデータどうしの似ている度合い（近さ）をもとに、グループを作ります。\n代表的な方法に、k-means法や階層的クラスタリング（ウォード法など）があります。","example":"お客さんの購入履歴から、「よく似た買い方をする人たち」のグループを見つけるのに使えます。","related":["W-081","W-082","W-083","W-057"],"sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"}]},{"id":"W-081","term":"k-means法","aliases":["k平均法"],"category":3,"short":"グループの数kをあらかじめ決めておき、各データを一番近いグループの中心に割り当てることを繰り返す方法。","body":"クラスタリングの代表的な方法です。\nまずグループの数kを人が決めます。\n各データを一番近い中心（重心）のグループに割り当て、グループごとに中心を計算し直す、という手順を繰り返します。\n大量のデータにも使いやすい方法です。","related":["W-080","W-082"],"sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"}]},{"id":"W-082","term":"ウォード法","category":3,"short":"階層的クラスタリングで、まとめたときにグループの中のばらつきの増え方が最も小さい組から順にまとめる方法。","body":"階層的クラスタリングは、最初は1つずつのデータをグループとし、似たグループどうしを順にまとめていく方法です。\nどのグループどうしをまとめるかの決め方の一つが、ウォード法です。\nまとめる過程は、デンドログラム（樹形図）という図で表せます。","related":["W-083","W-080","W-081"],"sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"}]},{"id":"W-083","term":"デンドログラム（樹形図）","aliases":["デンドログラム","樹形図"],"category":3,"short":"階層的クラスタリングで、データがまとめられていく順番を、木の形で表した図。","body":"葉（木の先）が1つひとつのデータで、根（木の元）がすべてのデータを含む1つのグループです。\n下から上へ、似たものどうしがまとめられていく様子を見ることができます。\n図をどの高さで切るかで、グループの数を決められます。","related":["W-082","W-080"],"sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"}]},{"id":"W-084","term":"次元削減","category":3,"short":"データを表す特徴の数（次元）を、情報をできるだけ失わないように減らすこと。","body":"特徴の数が多すぎると、計算が大変になったり、次元の呪いが起きたりします。\nそこで、データの大事な情報を残したまま、少ない数の特徴で表します。\nデータをグラフにして眺めたり（可視化）、機械学習の前処理に使ったりします。\n主成分分析、t-SNE、オートエンコーダなどが使われます。","related":["W-085","W-087","W-086","W-047","W-224","W-223"],"sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"},{"title":"scikit-learn User Guide 2.2 Manifold learning","url":"https://scikit-learn.org/stable/modules/manifold.html"}]},{"id":"W-085","term":"主成分分析（PCA）","aliases":["主成分分析","PCA"],"category":3,"short":"データのばらつきを最もよく表す方向を順に見つけ、少ない数の方向でデータを表す次元削減の方法。","body":"データが最も大きくばらついている方向を第1主成分、それと直角で次に大きくばらつく方向を第2主成分…と順に求めます。\n上位のいくつかの主成分だけを使うことで、情報をあまり失わずに次元を減らせます。\n正解のラベルは使わない、教師なし学習の方法です。","example":"国語・数学・英語など5教科の点数を、「文系の力」「理系の力」のような2つの軸にまとめて表すイメージです。","related":["W-084","W-086","W-057"],"sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}]},{"id":"W-086","term":"特異値分解（SVD）","aliases":["特異値分解","SVD"],"category":3,"short":"表（行列）を3つの行列の掛け算に分解する方法。大きい成分だけ残すと次元を減らせる。","body":"分解して得られる「特異値」の大きいものだけを残すと、元の情報をなるべく保ったまま次元を減らせます。\n文書に出てくる単語の回数の表に使うと、単語や文書の意味の近さをとらえられます（潜在意味解析）。\n推薦システムなどでも、同じように表を分解する考え方が使われます。","related":["W-085","W-084","W-089","W-046"],"sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}]},{"id":"W-087","term":"t-SNE","aliases":["ティースニー"],"category":3,"short":"高い次元のデータを、近いものどうしの関係を保ったまま2次元や3次元に写す、可視化によく使われる方法。","body":"データどうしの近さを確率で表し、写した先でもその関係がなるべく保たれるように配置します。\n特に、近いデータどうしの関係（まとまり）をよく保つので、いくつかのグループがある様子を1枚の図で見せるのに向いています。\n主成分分析と違い、まっすぐな変換ではない（非線形の）方法です。","related":["W-084","W-085","W-088"],"sources":[{"title":"scikit-learn User Guide 2.2 Manifold learning","url":"https://scikit-learn.org/stable/modules/manifold.html"}]},{"id":"W-088","term":"多次元尺度構成法（MDS）","aliases":["多次元尺度構成法","MDS"],"category":3,"short":"データどうしの「似ていなさ（距離）」が、なるべくそのまま保たれるように、データを平面などに配置する方法。","body":"物どうしの似ていなさを表すデータから、それらを地図のような図に並べます。\n次元削減の方法の一つです。","example":"「この商品とこの商品はどれくらい似ていないか」の評価から、商品どうしの関係を2次元の地図に描く、という使い方があります。","related":["W-084","W-087"],"sources":[{"title":"scikit-learn User Guide 2.2 Manifold learning","url":"https://scikit-learn.org/stable/modules/manifold.html"}]},{"id":"W-089","term":"トピックモデル","category":3,"short":"たくさんの文書から、その背後にある話題（トピック）を自動で見つけ出すためのモデル。","body":"「各文書はいくつかの話題が混ざってできていて、話題ごとに出てきやすい単語がある」と考えます。\n文書に出てくる単語から、どんな話題があり、各文書がどの話題をどれくらい含むかを推定します。\n代表的な方法に、潜在的ディリクレ配分法（LDA）があります。","example":"ニュース記事の集まりから、「スポーツ」「政治」「経済」のような話題を自動で見つけ出すのに使えます。","related":["W-090","W-086"],"sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}]},{"id":"W-090","term":"潜在的ディリクレ配分法（LDA）","aliases":["潜在的ディリクレ配分法","LDA"],"category":3,"short":"文書の集まりから、背後にある話題（トピック）とその混ざり具合を推定する、代表的なトピックモデル。","body":"確率を使って、文書がどのように作られるかを考えるモデル（生成モデル）です。\n正解のラベルを使わない、教師なし学習です。\n同じ「LDA」という略称で、線形判別分析という別の方法もあるので注意が必要です。","related":["W-089","W-057"],"sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}]},{"id":"W-091","term":"協調フィルタリング","category":3,"short":"好みが似ている人が高く評価したものを勧める、推薦の方法。","body":"たくさんの利用者の評価を集め、自分と好みの似た人を探します。\nその人たちが高く評価していて、自分がまだ知らないものを勧めます。\n新しい利用者や新しい商品には評価の記録がないため、うまく勧められないという弱点があります（コールドスタート問題）。","example":"「あなたと同じ本を好きな人は、この本も気に入っています」と勧めるのが協調フィルタリングです。","related":["W-092","W-093","W-046"],"sources":[{"title":"人工知能学会「人工知能の話題: 協調フィルタリング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics2.html"},{"title":"Frédéric Guillou ほか \"Cold-start Problems in Recommendation Systems via Contextual-bandit Algorithms\" (arXiv:1405.7544)","url":"https://arxiv.org/abs/1405.7544"}]},{"id":"W-092","term":"コンテンツベースフィルタリング","aliases":["内容に基づくフィルタリング"],"category":3,"short":"商品の内容（ジャンル、作者など）をもとに、その人の好みに合うものを勧める推薦の方法。","body":"商品そのものの情報を使うので、まだ誰も評価していない新しい商品も勧められます。\nそのため、協調フィルタリングと組み合わせて、コールドスタート問題を和らげるのにも使われます。","example":"よく推理小説を読む人に、同じジャンルの新刊を勧めるのがコンテンツベースフィルタリングです。","related":["W-091","W-093","W-046"],"sources":[{"title":"人工知能学会「人工知能の話題: 協調フィルタリング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics2.html"},{"title":"Frédéric Guillou ほか \"Cold-start Problems in Recommendation Systems via Contextual-bandit Algorithms\" (arXiv:1405.7544)","url":"https://arxiv.org/abs/1405.7544"}]},{"id":"W-093","term":"コールドスタート問題","category":3,"short":"新しい利用者や新しい商品には評価の記録がないため、協調フィルタリングでうまく勧められない問題。","body":"協調フィルタリングは、評価の記録をもとに好みの似た人を探します。\nそのため、記録のない新しい利用者には、似た人を見つけられません。\n新しく追加された商品も、誰かが評価するまで勧められません。\n商品の内容を使うコンテンツベースフィルタリングを組み合わせることで、この問題を和らげられます。","related":["W-091","W-092"],"sources":[{"title":"Frédéric Guillou ほか \"Cold-start Problems in Recommendation Systems via Contextual-bandit Algorithms\" (arXiv:1405.7544)","url":"https://arxiv.org/abs/1405.7544"},{"title":"人工知能学会「人工知能の話題: 協調フィルタリング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics2.html"}]},{"id":"W-094","term":"マルコフ決定過程","category":3,"short":"強化学習の問題を数学的に表すための枠組み。状態、行動、状態の移り変わり、報酬、割引率からなる。","body":"エージェントがある状態で行動すると、ある確率で次の状態に移り、報酬を受け取る、という形で表します。\n次の状態が「今の状態と行動」だけで決まり、それより前の経緯には左右されないと考えるのが特徴です（マルコフ性）。","related":["W-058","W-095","W-096","W-097","W-005"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-095","term":"割引率","category":3,"short":"強化学習で、将来の報酬をどれくらい重視するかを表す、0から1の間の値。","body":"将来にもらえる報酬を、今の価値に直すときに、どれくらい割り引くかを表します。\n小さいほど目先の報酬を重視し、1に近いほど遠い将来の報酬も重視します。","example":"「今日の100円」と「1年後の100円」なら、多くの人は今日の100円を選びます。将来の報酬を少し割り引いて考えるのと同じ考え方です。","related":["W-094","W-058"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-096","term"
