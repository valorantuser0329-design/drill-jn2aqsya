:"状態価値関数","category":3,"short":"ある状態から始めて、決まった行動の仕方（方策）に従ったとき、将来までにもらえる報酬の合計の見込み。","body":"「今いる状態がどれくらいよい状態か」を表します。\n直前の報酬だけでなく、将来にわたる報酬の合計の平均的な値（期待値）を表すのがポイントです。","related":["W-097","W-094","W-413"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-097","term":"行動価値関数","aliases":["Q関数","Q値"],"category":3,"short":"ある状態で、ある行動をとったとき、その後に将来までにもらえる報酬の合計の見込み。","body":"「この状態でこの行動をとるのは、どれくらいよいか」を表します。Q関数とも呼ばれます。\n同じ状態での行動どうしを比べて、どれを選ぶのがよいかを決めるのに使えます。\nQ学習やSARSAは、この行動価値関数を学習する方法です。","related":["W-096","W-098","W-099"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-098","term":"Q学習","aliases":["Q-Learning"],"category":3,"short":"行動価値関数（Q値）を、実際の経験から少しずつ直していく強化学習の方法。次の状態で一番よい行動の価値を使って直す。","body":"行動して報酬を受け取るたびに、Q値を少しずつ更新します。\n更新には、次の状態で最も価値の高い行動の値を使います。実際に次にとった行動とは関係なく最善の値を使うので、方策オフ型と呼ばれます。\n環境の仕組み（モデル）がわからなくても、経験から学べます。","related":["W-099","W-097","W-312","W-058"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-099","term":"SARSA","aliases":["サルサ"],"category":3,"short":"行動価値関数を、実際に選んだ次の行動の価値を使って少しずつ直していく強化学習の方法。","body":"名前は、更新に使う「状態・行動・報酬・次の状態・次の行動」の頭文字（State-Action-Reward-State-Action）から来ています。\n実際に次に選んだ行動の価値を使って更新します。更新と行動の決め方が同じなので、方策オン型と呼ばれます。","related":["W-098","W-097","W-058"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-100","term":"方策勾配法","category":3,"short":"行動の仕方（方策）そのものを、報酬の合計の見込みが大きくなるように直接直していく強化学習の方法。","body":"Q学習のように行動の価値を学ぶのではなく、方策を数値（パラメータ）で表し、それを直接調整します。\n報酬の合計の見込みが大きくなる向き（勾配）に、パラメータを少しずつ動かします。\n代表的な方法にREINFORCEがあります。","related":["W-101","W-102","W-322","W-058","W-098","W-123","W-126"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-101","term":"REINFORCE","category":3,"short":"方策勾配法の代表的な方法。実際に得た報酬の合計をもとに、よかった行動が選ばれやすくなるように方策を直す。","body":"実際に行動して得た報酬の合計（収益）から、方策をどちらに直せばよいかを見積もります。\n収益が大きかった行動ほど、選ばれる確率が高くなるように方策を更新します。","related":["W-100","W-102"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-102","term":"Actor-Critic","aliases":["アクタークリティック"],"category":3,"short":"行動を決める役（Actor）と、その行動を評価する役（Critic）を組み合わせて学習する強化学習の方法。","body":"Actorは方策（行動の仕方）、Criticは価値関数（行動のよさの見積もり）を担当します。\nCriticの評価を使ってActorの方策を直すことで、報酬の合計だけを使う方法より安定して学べると期待されます。\nロボットの制御などで広く使われています。","example":"演技する役者（Actor）と、演技を評価する批評家（Critic）が組んで、演技を上達させていくイメージです。","related":["W-100","W-101","W-317","W-058"],"sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}]},{"id":"W-103","term":"バンディットアルゴリズム","aliases":["多腕バンディット問題"],"category":3,"short":"結果のわからない複数の選択肢から繰り返し選び、得られる報酬の合計を大きくするための考え方や方法。","body":"いくつものスロットマシン（腕）の中から、当たりやすい台を探しながら遊ぶ問題（多腕バンディット問題）がもとになっています。\nこれまでよかった選択肢を選び続ける「活用」と、まだよくわからない選択肢を試す「探索」のバランスが大切です。\n広告の表示やニュースのおすすめなどに応用されています。","related":["W-104","W-105","W-058"],"sources":[{"title":"Aleksandrs Slivkins \"Introduction to Multi-Armed Bandits\" (arXiv:1904.07272)","url":"https://arxiv.org/abs/1904.07272"}]},{"id":"W-104","term":"ε-greedy方策","aliases":["イプシロングリーディ方策"],"category":3,"short":"決めた小さな確率εでランダムに選んで試し、それ以外はこれまで一番よかった選択肢を選ぶ方法。","body":"εは「イプシロン」と読む、小さな値を表す記号です。\n確率εでは、まだよくわからない選択肢も試します（探索）。\n残りの確率では、これまでの平均の報酬が最も高い選択肢を選びます（活用）。","example":"ε＝0.1なら、10回に1回くらいは新しいお店を試し、残りの9回はお気に入りのお店に行く、というイメージです。","related":["W-103","W-105"],"sources":[{"title":"Aleksandrs Slivkins \"Introduction to Multi-Armed Bandits\" (arXiv:1904.07272)","url":"https://arxiv.org/abs/1904.07272"}]},{"id":"W-105","term":"UCB方策","category":3,"short":"まだ試した回数が少ない選択肢ほど、よいかもしれないと高めに見積もって選ぶ方法。","body":"「よくわからないときは、楽観的に考える」という考え方に基づいています。\nこれまでの平均の報酬に、試した回数が少ないほど大きくなる上乗せを足して、その合計が最も大きい選択肢を選びます。\n十分に試して、よくないとわかった選択肢は、自然と選ばれなくなります。","related":["W-103","W-104"],"sources":[{"title":"Aleksandrs Slivkins \"Introduction to Multi-Armed Bandits\" (arXiv:1904.07272)","url":"https://arxiv.org/abs/1904.07272"}]},{"id":"W-106","term":"過学習","aliases":["オーバーフィッティング"],"category":3,"short":"学習に使ったデータに合わせすぎて、新しいデータではうまく予測できなくなる状態。","body":"AIは、たくさんの例（学習データ）を見て、答え方のくせを覚えます。\nこのとき例に合わせすぎると、例に含まれる細かい偶然まで覚えてしまいます。\nすると、見たことのない新しいデータでは、かえって間違いが増えます。これを過学習といいます。\n新しいデータでもうまく予測できる力を汎化性能と呼びます。機械学習では、これを高めることが目標です。","example":"過去問の答えを丸暗記した人は、同じ問題なら満点を取れます。でも、少し形を変えた問題が出ると解けません。","related":["W-107","W-108","W-146","W-152","W-173"],"sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"title":"scikit-learn User Guide 1.10 Decision Trees","url":"https://scikit-learn.org/stable/modules/tree.html"}]},{"id":"W-107","term":"汎化性能","category":3,"short":"学習に使っていない新しいデータに対して、どれくらい正しく予測できるかという性能。","body":"機械学習の目的は、この汎化性能を高めることです。\n学習に使ったデータでの成績がよくても、汎化性能が低ければ、実際には役に立ちません。\nそのため、学習に使わずに取っておいたデータで性能を確かめます。","related":["W-106","W-108","W-109"],"sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"title":"scikit-learn User Guide 1.10 Decision Trees","url":"https://scikit-learn.org/stable/modules/tree.html"}]},{"id":"W-108","term":"ホールドアウト検証","category":3,"short":"手元のデータを、学習用とテスト用に分け、学習に使わなかったテスト用のデータで性能を確かめる方法。","body":"モデルの性能を、学習に使ったデータで確かめると、実際より良く見えてしまいます。\nそこで、データの一部をテスト用に取っておき（ホールドアウト）、学習には使わずに、性能の確認だけに使います。","related":["W-109","W-110","W-107"],"sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"title":"scikit-learn User Guide 1.10 Decision Trees","url":"https://scikit-learn.org/stable/modules/tree.html"}]},{"id":"W-109","term":"交差検証","aliases":["クロスバリデーション"],"category":3,"short":"データを分けて、学習用と確認用を入れ替えながら何度も性能を確かめ、その平均で評価する方法。","body":"データを一度だけ学習用と確認用に分けるホールドアウト検証では、分け方によって結果がぶれることがあります。\n交差検証では、確認用にするデータを入れ替えながら何度も確かめ、その平均を性能とします。\n代表的な方法にk-分割交差検証があります。","related":["W-110","W-108"],"sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"}]},{"id":"W-110","term":"k-分割交差検証","category":3,"short":"データをk個に分け、そのうち1個を確認用、残りを学習用にすることを、確認用を入れ替えながらk回繰り返す方法。","body":"k回の確認の結果の平均を、モデルの性能とします。\nすべてのデータが一度は確認用に使われるので、データが少ないときでも評価のぶれを抑えやすくなります。\nkをデータの数と同じにしたものを、一つ抜き交差検証といいます。","example":"データを5つに分けるなら、①を確認用に②〜⑤で学習、次は②を確認用に…と5回繰り返して、成績を平均します。","related":["W-109","W-108"],"sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"}]},{"id":"W-111","term":"混同行列","category":3,"short":"分類モデルの予測の結果を、実際の答えと予測の組み合わせごとに数えて表にしたもの。","body":"2つのクラス（陽性と陰性）に分ける場合は、次の4つに分けて数えます。\n真陽性（正しく陽性と予測）、偽陽性（陰性なのに陽性と予測）、偽陰性（陽性なのに陰性と予測）、真陰性（正しく陰性と予測）です。\nこの表から、正解率や適合率、再現率などの指標を計算します。","related":["W-112","W-113","W-114","W-061"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-112","term":"偽陽性・偽陰性","aliases":["偽陽性","偽陰性","FP","FN"],"category":3,"short":"偽陽性は「本当は陰性なのに陽性と予測した」間違い、偽陰性は「本当は陽性なのに陰性と予測した」間違い。","body":"「陽性・陰性」は予測の中身、「偽」は予測が間違っていたことを表します。\n偽陽性（FP）は、いわば「空振り」の間違いです。\n偽陰性（FN）は、いわば「見逃し」の間違いです。\nどちらの間違いをより避けたいかは、使う場面によって変わります。","example":"病気の検査で、健康な人を「病気」と判定するのが偽陽性、病気の人を「健康」と判定して見逃すのが偽陰性です。","related":["W-113","W-111","W-114"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-113","term":"真陽性・真陰性","aliases":["真陽性","真陰性","TP","TN"],"category":3,"short":"真陽性は「陽性を正しく陽性と予測した」もの、真陰性は「陰性を正しく陰性と予測した」もの。","body":"「真」は、予測が正しかったことを表します。\n真陽性（TP）と真陰性（TN）は、どちらも正しい予測です。","example":"病気の検査で、病気の人を「病気」と判定するのが真陽性、健康な人を「健康」と判定するのが真陰性です。","related":["W-112","W-111"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-114","term":"正解率・適合率・再現率・F値","aliases":["正解率","適合率","再現率","F値","Accuracy","Precision","Recall","F1スコア"],"category":3,"short":"分類モデルの成績をはかる代表的な指標。何を重視するかによって使い分ける。","body":"正解率：全体のうち、予測が当たったものの割合です。\n適合率：「陽性」と予測したもののうち、本当に陽性だったものの割合です。空振りの少なさを表します。\n再現率：本当に陽性のもののうち、「陽性」と予測できたものの割合です。見逃しの少なさを表します。\nF値：適合率と再現率の調和平均で、両方のバランスを見る指標です。どちらか一方だけが高くても、大きな値になりにくい性質があります。","example":"陽性と予測した50件のうち40件が本当に陽性なら、適合率は40÷50＝0.8です。本当の陽性が60件なら、再現率は40÷60≒0.67です。","related":["W-111","W-112","W-115","W-061"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-115","term":"ROC曲線・AUC","aliases":["ROC曲線","AUC"],"category":3,"short":"ROC曲線は、判定の境目を変えたときの見逃しと空振りの関係を描いた線。AUCはその線の下の面積で、1に近いほどよい。","body":"分類モデルは、ふつう「陽性らしさ」の点数を出し、決めた境目（しきい値）より高ければ陽性と判定します。\nこの境目をいろいろ変えながら、横軸に偽陽性率（空振りの割合）、縦軸に真陽性率（見逃さなかった割合）をとって描いたのがROC曲線です。\nAUCは、ROC曲線の下の面積で、0から1の値をとります。ランダムに判定するモデルでは、およそ0.5になります。\n境目を1つに決めなくても、モデルどうしの性能を比べられるのが長所です。","related":["W-114","W-112","W-061","W-113"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-116","term":"平均二乗誤差（MSE）","aliases":["平均二乗誤差","MSE","Mean Squared Error"],"category":3,"short":"予測と実際の値の差（誤差）を2乗して平均した値。回帰モデルの成績をはかるのに使う。","body":"誤差をそのまま平均すると、プラスとマイナスが打ち消し合ってしまいます。そこで2乗してから平均します。\n2乗するので、大きな誤差ほど重く評価されます。そのため、他から大きく外れた値（外れ値）の影響を受けやすくなります。\n値が小さいほど、予測が正確です。","example":"誤差が 1、−1、2、−2 なら、（1＋1＋4＋4）÷4＝2.5 です。","related":["W-117","W-118","W-141","W-060","W-398"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-117","term":"二乗平均平方根誤差（RMSE）","aliases":["二乗平均平方根誤差","RMSE"],"category":3,"short":"平均二乗誤差（MSE）の平方根をとった値。予測したい値と同じ単位で誤差の大きさを表せる。","body":"MSEは誤差を2乗しているので、単位も2乗になってしまいます。\n平方根をとることで、元のデータと同じ単位で「だいたいどれくらいずれているか」を表せます。","example":"MSEが2.5なら、RMSEは √2.5 ≒ 1.58 です。","related":["W-116","W-118"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-118","term":"平均絶対値誤差（MAE）","aliases":["平均絶対値誤差","平均絶対誤差","MAE"],"category":3,"short":"予測と実際の値の差（誤差）の大きさ（絶対値）を平均した値。","body":"誤差のプラスやマイナスを取り除いて、大きさだけを平均します。\n2乗しないので、MSEやRMSEに比べて、外れ値の影響を受けにくいという特徴があります。","example":"誤差が 1、−1、2、−2 なら、（1＋1＋2＋2）÷4＝1.5 です。","related":["W-116","W-117","W-398"],"sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-119","term":"赤池情報量規準（AIC）","aliases":["赤池情報量規準","AIC"],"category":3,"short":"データへの当てはまりのよさと、モデルの複雑さの両方を考えて、よいモデルを選ぶための指標。値が小さいほどよい。","body":"モデルのパラメータ（調整できる数値）を増やせば、データへの当てはまりはよくなります。\nしかし、複雑すぎるモデルは過学習しやすくなります。\nAICは、当てはまりのよさに、パラメータの数に応じた罰（ペナルティ）を加えた値です。","related":["W-120","W-121","W-106","W-123"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"}]},{"id":"W-120","term":"ベイズ情報量規準（BIC）","aliases":["ベイズ情報量規準","BIC"],"category":3,"short":"AICと同じく、当てはまりのよさと複雑さの両方からモデルを選ぶ指標。データが多いと複雑なモデルを強く罰する。","body":"AICと同じように、値が小さいモデルほどよいとされます。\nパラメータの数に対する罰が、データの数に応じて大きくなります。\nそのため、データが多いときは、AICよりもパラメータの多いモデルを選びにくくなります。","related":["W-119","W-121","W-123"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"}]},{"id":"W-121","term":"オッカムの剃刀","category":3,"short":"データを同じくらいうまく説明できるなら、より単純なモデルを選ぶほうがよいという考え方。","body":"もともとは「必要以上に多くの仮定を置くべきではない」という考え方です。\n複雑すぎるモデルは、学習データの偶然のばらつきまで覚えてしまい、過学習しやすくなります。\nAICやBIC、正則化は、この考え方を具体的な方法にしたものといえます。","related":["W-106","W-119","W-146","W-120"],"sources":[{"title":"Tom F. Sterkenburg \"Statistical learning theory and Occam's razor: The argument from empirical risk minimization\" (arXiv:2312.13842)","url":"https://arxiv.org/abs/2312.13842"},{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-122","term":"ニューラルネットワーク","aliases":["Neural Network"],"category":4,"short":"脳の神経回路の仕組みを手本にした計算の仕組み。層を重ねたものがディープラーニング。","body":"数値を受け取って計算し、次へ渡す小さな計算の単位（ニューロン、ユニット）を、たくさんつないだものです。\nユニットは層の形に並べられ、入力層、隠れ層、出力層の順に情報が流れます。\nユニットどうしのつながりの強さ（重み）を、データに合わせて調整することで学習します。\n隠れ層をたくさん重ねたものが、ディープラーニングです。","related":["W-130","W-180","W-003","W-049","W-129"],"sources":[{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-123","term":"パラメータ","category":4,"short":"モデルの中にあって、学習によって自動で調整される数値。ニューラルネットワークでは重みなど。","body":"モデルは、たくさんの数値を使って計算しています。学習とは、この数値をデータに合わせて調整することです。\nニューラルネットワークでは、ユニットどうしのつながりの強さ（重み）などがパラメータです。\n一方、学習を始める前に人が決める設定値（学習率や層の数など）は、ハイパーパラメータと呼んで区別します。","example":"「売上＝a×気温＋b」という式なら、aとbがパラメータで、データから一番よい値が決まります。","related":["W-174","W-180","W-155","W-122","W-156"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"scikit-learn User Guide 3.2 Tuning the hyper-parameters of an estimator","url":"https://scikit-learn.org/stable/modules/grid_search.html"}]},{"id":"W-124","term":"活性化関数","category":4,"short":"ニューラルネットワークの各ユニットで、受け取った値を変換してから次へ渡すための関数。","body":"各ユニットは、受け取った値に重みを掛けて足し合わせた後、活性化関数で変換して次の層へ渡します。\n活性化関数が、まっすぐな変換（線形）ではないことで、ネットワークは複雑な関係を表せるようになります。\n代表的なものに、シグモイド関数、tanh関数、ReLU関数、ソフトマックス関数があります。","related":["W-134","W-135","W-136","W-138","W-139","W-122","W-180"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-125","term":"誤差関数","aliases":["損失関数"],"category":4,"short":"モデルの予測が、正解からどれくらいずれているかを数値で表す関数。学習ではこの値を小さくする。","body":"損失関数とも呼ばれます。\n学習では、誤差関数の値が小さくなるように、パラメータを少しずつ調整します。\n問題の種類に合ったものを選びます。回帰問題では平均二乗誤差、分類問題では交差エントロピーがよく使われます。","related":["W-141","W-142","W-155","W-123","W-060","W-116","W-061"],"sources":[{"title":"PyTorch Documentation torch.nn.MSELoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.MSELoss.html"},{"title":"PyTorch Documentation torch.nn.CrossEntropyLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html"}]},{"id":"W-126","term":"勾配","category":4,"short":"誤差関数の値が、パラメータを少し動かしたときにどれくらい、どちら向きに変わるかを表す値（傾き）。","body":"誤差関数を山や谷の地形にたとえると、勾配は、今いる場所の坂の傾きと向きにあたります。\n勾配の逆向き（坂を下る向き）にパラメータを動かすと、誤差を小さくできます。これが勾配降下法です。\nニューラルネットワークでは、誤差逆伝播法で勾配を効率よく計算します。","related":["W-155","W-127","W-139","W-125","W-123","W-122"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-127","term":"誤差逆伝播法","aliases":["バックプロパゲーション","Backpropagation"],"category":4,"short":"出力の誤差を、出力層から入力層へ逆向きに伝えながら、各重みをどれだけ直せばよいか（勾配）を効率よく求める方法。","body":"ニューラルネットワークを学習させるための、基本となる方法です。\nまず入力から出力へ計算して予測を出し（順伝播）、正解とのずれ（誤差）を求めます。\n次に、その誤差を出力側から入力側へ、層を1つずつさかのぼって伝え、各重みの勾配を順に計算します。\nこの計算の土台になっているのが、微分の規則である連鎖律です。","related":["W-153","W-126","W-155","W-139","W-154","W-130","W-180","W-122"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-128","term":"単純パーセプトロン","category":4,"short":"入力層と出力層だけからなる、最も単純なニューラルネットワーク。直線で分けられる問題しか解けない。","body":"入力に重みを掛けて足し合わせた値で、出力を決めます。\nそのため、クラスを1本の直線（平面）で分けられる問題しか解けません。\n1960年代の終わりに、ミンスキーとパパートがこの限界を指摘しました。","related":["W-129","W-122","W-130","W-180"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-129","term":"多層パーセプトロン","category":4,"short":"入力層と出力層の間に、隠れ層をはさんだニューラルネットワーク。直線で分けられない問題も学習できる。","body":"隠れ層で活性化関数による変換を行うことで、複雑な関係（非線形な関係）も学習できます。\n学習には誤差逆伝播法が使われます。\n隠れ層をたくさん重ねたものが、ディープラーニングです。","related":["W-128","W-130","W-127","W-122","W-124"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-130","term":"隠れ層・入力層・出力層","aliases":["隠れ層","入力層","出力層","中間層"],"category":4,"short":"ニューラルネットワークを作る3種類の層。入力を受け取る層、途中で計算する層、答えを出す層。","body":"入力層：データ（特徴量）を受け取る層です。\n隠れ層：前の層の値に重みを掛けて足し合わせ、活性化関数で変換して次へ渡す層です。1層以上置けます。\n出力層：最後に、予測の答えを出す層です。\n層と層の間の重みは、学習によって調整されます。","related":["W-129","W-122","W-124","W-059","W-180"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-131","term":"CPU","aliases":["Central Processing Unit","中央処理装置"],"category":4,"short":"コンピュータの中心となる処理装置。いろいろな処理を順番にこなすのが得意。","body":"さまざまな種類の処理を、順序立てて行う、汎用の処理装置です。\n複雑な処理は得意ですが、同時に行える計算の数はGPUより少なくなります。\nそのため、ディープラーニングで必要な大量の行列（数を縦横に並べた表）の計算には、GPUやTPUのほうが向いています。","related":["W-132","W-133"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"Norman P. Jouppi ほか \"In-Datacenter Performance Analysis of a Tensor Processing Unit\" (arXiv:1704.04760)","url":"https://arxiv.org/abs/1704.04760"},{"title":"総務省 令和6年版 情報通信白書「生成AIの急速な進化と普及」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131210.html"}]},{"id":"W-132","term":"GPU","aliases":["Graphics Processing Unit"],"category":4,"short":"もともと画像の処理のために作られた処理装置。たくさんの計算を同時にこなせ、ディープラーニングの学習を大きく速くした。","body":"たくさんの計算を同時に（並列に）行えるのが特徴です。\nニューラルネットワークの学習で必要な、大量の行列（数を縦横に並べた表）やベクトル（数の並び）の掛け算を速く計算できます。\nゲーム市場が大きかったことから安く手に入るようになり、ディープラーニングの成功を支えました。","related":["W-131","W-133","W-122"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"Norman P. Jouppi ほか \"In-Datacenter Performance Analysis of a Tensor Processing Unit\" (arXiv:1704.04760)","url":"https://arxiv.org/abs/1704.04760"},{"title":"総務省 令和6年版 情報通信白書「生成AIの急速な進化と普及」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131210.html"}]},{"id":"W-133","term":"TPU","aliases":["Tensor Processing Unit"],"category":4,"short":"グーグルが、ニューラルネットワークの計算のために専用に開発した半導体。","body":"大規模な行列（数を縦横に並べた表）の掛け算を行う回路を持っています。\n論文では、推論（学習済みのモデルで予測する処理）で、同じ時期のGPUやCPUの約15〜30倍の速さと報告されています。","related":["W-132","W-131","W-122"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"Norman P. Jouppi ほか \"In-Datacenter Performance Analysis of a Tensor Processing Unit\" (arXiv:1704.04760)","url":"https://arxiv.org/abs/1704.04760"},{"title":"総務省 令和6年版 情報通信白書「生成AIの急速な進化と普及」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131210.html"}]},{"id":"W-134","term":"シグモイド関数","aliases":["ロジスティック関数"],"category":4,"short":"入力の値を0から1の間の値に変換する関数。確率を表すのにも使われる。","body":"グラフは、なだらかなS字の形をしています。\n出力が0から1の間に収まるので、ロジスティック回帰などで確率を表すのに使われます。\nただし、入力が大きい（または小さい）と傾きがほとんど0になり、深いネットワークでは勾配消失問題の原因になります。","related":["W-135","W-136","W-139","W-066","W-124"],"sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-135","term":"tanh関数","aliases":["ハイパボリックタンジェント","双曲線正接関数"],"category":4,"short":"シグモイド関数に似た形で、入力の値を−1から1の間の値に変換する関数。","body":"0を中心に上下対称な、S字の形をしています。\nシグモイド関数と同じく、入力が大きい（または小さい）と傾きがほとんど0になり、勾配消失問題の原因になります。","related":["W-134","W-136","W-139","W-124"],"sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-136","term":"ReLU関数","aliases":["ReLU","ランプ関数","正規化線形関数"],"category":4,"short":"入力が0以上ならそのまま出し、マイナスなら0を出す関数。深いネットワークで広く使われる。","body":"計算がとても簡単です。\n入力がプラスのときの傾きは常に1なので、シグモイド関数のように傾きが小さくなって学習が止まる問題が起きにくくなります。\nただし、入力がマイナスのときは傾きが0になり、その部分では学習が進みません。","example":"入力が 3 なら 3、入力が −2 なら 0 を出します。","related":["W-137","W-134","W-139","W-124"],"sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-137","term":"Leaky ReLU関数","aliases":["Leaky ReLU"],"category":4,"short":"ReLU関数を改良し、入力がマイナスのときも小さな傾きを持たせた関数。","body":"ReLU関数は、入力がマイナスのとき傾きが0になり、学習が進まなくなることがあります。\nLeaky ReLU関数は、マイナスのときにも「入力の0.01倍」のような小さな値を出すことで、これを和らげます。\n「Leaky」は「少し漏れる」という意味です。","example":"入力が −2 なら、0 ではなく −0.02 を出します。","related":["W-136","W-124"],"sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-138","term":"ソフトマックス関数","category":4,"short":"複数の値を、すべて0以上で合計が1になる値に変換する関数。各クラスの確率として使う。","body":"多クラス分類のニューラルネットワークで、出力層によく使われます。\n各クラスの点数を、確率として読める値に変換します。点数が大きいクラスほど、大きな確率になります。\n多クラス分類では、ソフトマックス関数の出力と正解との間の交差エントロピーを、誤差関数として使うのが一般的です。","example":"「犬・猫・鳥」の点数を変換して、「犬0.7、猫0.2、鳥0.1」のように、合計1の確率にします。","related":["W-062","W-142","W-124","W-122","W-130","W-125"],"sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"},{"title":"PyTorch Documentation torch.nn.CrossEntropyLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html"}]},{"id":"W-139","term":"勾配消失問題","category":4,"short":"層の多いニューラルネットワークで、学習の手がかりが入力側まで届かず、学習が進まなくなる問題。","body":"ニューラルネットワークは、答えの間違いの大きさをもとに、中の数値（重み）を少しずつ直して学びます。\n直す量の手がかりを「勾配」といい、出力側から入力側へ順に伝えます（誤差逆伝播法）。\n伝えるたびに小さな数を掛けるので、層が多いと手がかりがどんどん小さくなります。\n入力に近い層にはほとんど届かず、その層が学習できなくなります。\n対策には、ReLU関数を使う、ResNetのように層を飛び越える道を作る、LSTMを使う、などがあります。","example":"伝言ゲームで人数が多いと、最初の人のところに着くころには声がとても小さくなり、聞こえなくなるようなものです。","related":["W-140","W-127","W-134","W-136","W-202","W-209","W-122","W-180","W-126"],"sources":[{"title":"Razvan Pascanu ほか \"On the difficulty of training Recurrent Neural Networks\" (arXiv:1211.5063)","url":"https://arxiv.org/abs/1211.5063"},{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-140","term":"勾配爆発問題","category":4,"short":"層の多いネットワークで、学習の手がかり（勾配）が層をさかのぼるうちに大きくなりすぎ、学習が不安定になる問題。","body":"勾配消失問題とは逆に、勾配を何度も掛け合わせるうちに、値が極端に大きくなってしまう問題です。\nパラメータが大きく動きすぎて、学習がうまく進まなくなります。\n勾配の大きさが決めた上限を超えたら縮める「勾配クリッピング」が、対策として使われます。","related":["W-139","W-127","W-204","W-126","W-123"],"sources":[{"title":"Razvan Pascanu ほか \"On the difficulty of training Recurrent Neural Networks\" (arXiv:1211.5063)","url":"https://arxiv.org/abs/1211.5063"},{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}]},{"id":"W-141","term":"平均二乗誤差関数","category":4,"short":"予測と正解の差を2乗して平均した値を誤差とする関数。回帰問題の学習によく使われる。","body":"回帰問題（数値を予測する問題）で、誤差関数としてよく使われます。\n差を2乗するので、大きくずれた予測ほど重く罰せられます。\nモデルの成績をはかる指標として使うときは、平均二乗誤差（MSE）と呼ぶことが多いです。","related":["W-116","W-142","W-125","W-060"],"sources":[{"title":"PyTorch Documentation torch.nn.MSELoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.MSELoss.html"},{"title":"PyTorch Documentation torch.nn.CrossEntropyLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html"},{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}]},{"id":"W-142","term":"交差エントロピー","aliases":["クロスエントロピー"],"category":4,"short":"予測した確率が、正解からどれくらい離れているかを表す値。分類問題の学習によく使われる誤差関数。","body":"分類問題で、誤差関数としてよく使われます。\n正解のクラスに高い確率を出せていれば小さく、低い確率しか出せていなければ大きくなります。\n多クラス分類では、出力層にソフトマックス関数を置き、その出力との交差エントロピーを使うのが一般的です。","related":["W-138","W-143","W-141","W-125","W-061","W-062","W-130"],"sources":[{"title":"PyTorch Documentation torch.nn.MSELoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.MSELoss.html"},{"title":"PyTorch Documentation torch.nn.CrossEntropyLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html"}]},{"id":"W-143","term":"カルバック・ライブラー情報量（KL）","aliases":["KLダイバージェンス","カルバック・ライブラー情報量","KL情報量"],"category":4,"short":"2つの確率の分布が、どれくらい違うかを表す量。同じなら0で、違うほど大きくなる。","body":"予測の分布を、正解の分布に近づけたいときの誤差関数として使われます。\n変分オートエンコーダ（VAE）の学習などにも出てきます。\n2つの分布を入れ替えると値が変わる（対称ではない）ため、厳密な意味での「距離」ではありません。","related":["W-142","W-226","W-411","W-125"],"sources":[{"title":"PyTorch Documentation torch.nn.KLDivLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.KLDivLoss.html"}]},{"id":"W-144","term":"Contrastive Loss","aliases":["コントラスティブ損失"],"category":4,"short":"データの組（ペア）を使い、似たもの同士は近く、似ていないもの同士は遠くに置くように学習させる誤差関数。","body":"データどうしの「似ている度合い」を学ぶ、距離学習（メトリック学習）で使われます。\n似ている組は距離が小さくなるように、似ていない組は距離が決めた幅（マージン）以上になるように学習します。","example":"同じ人の顔写真の組は近くに、別の人の顔写真の組は遠くに置くように学習させ、顔認証に使います。","related":["W-145","W-125"],"sources":[{"title":"\"Comparing Contrastive and Triplet Loss: Variance Analysis and Optimization Behavior\" (arXiv:2510.02161)","url":"https://arxiv.org/abs/2510.02161"},{"title":"Florian Schroff ほか \"FaceNet: A Unified Embedding for Face Recognition and Clustering\" (arXiv:1503.03832)","url":"https://arxiv.org/abs/1503.03832"}]},{"id":"W-145","term":"Triplet Loss","aliases":["トリプレット損失"],"category":4,"short":"基準・同じ種類・違う種類の3つ組を使い、同じ種類は基準の近くに、違う種類は遠くに置くように学習させる誤差関数。","body":"基準のデータ（アンカー）、それと同じ種類のデータ（ポジティブ）、違う種類のデータ（ネガティブ）の3つを1組にして使います。\n基準とポジティブの距離が、基準とネガティブの距離より、決めた幅以上小さくなるように学習します。\n顔認識のFaceNetで使われました。","related":["W-144","W-125"],"sources":[{"title":"\"Comparing Contrastive and Triplet Loss: Variance Analysis and Optimization Behavior\" (arXiv:2510.02161)","url":"https://arxiv.org/abs/2510.02161"},{"title":"Florian Schroff ほか \"FaceNet: A Unified Embedding for Face Recognition and Clustering\" (arXiv:1503.03832)","url":"https://arxiv.org/abs/1503.03832"}]},{"id":"W-146","term":"正則化","category":4,"short":"モデルが複雑になりすぎないように罰（ペナルティ）を加えて、過学習を防ぐ方法。","body":"誤差関数に、重みの大きさに応じた罰の項を足します。\nこれにより、重みが大きくなりすぎるのを抑え、学習データに合わせすぎるのを防ぎます。\n代表的なものに、L1正則化とL2正則化があります。","related":["W-147","W-148","W-149","W-106","W-152","W-125","W-180"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-147","term":"L1正則化","category":4,"short":"重みの絶対値の合計を罰として加える正則化。一部の重みをちょうど0にしやすい。","body":"一部の重みがちょうど0になり、その特徴量は使われなくなります（スパース性）。\nそのため、役に立つ特徴量を選ぶ働きもします。\n線形回帰にL1正則化を加えたものを、ラッソ回帰といいます。","related":["W-148","W-150","W-146","W-180","W-059","W-063"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-148","term":"L2正則化","category":4,"short":"重みの2乗の合計を罰として加える正則化。重み全体を小さくするが、ちょうど0にはなりにくい。","body":"重み全体を、0に近づけるように小さくします。\n線形回帰にL2正則化を加えたものを、リッジ回帰といいます。","related":["W-147","W-151","W-146","W-180","W-063"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-149","term":"L0正則化","category":4,"short":"0でない重みの「個数」を罰にする正則化。重みを0にしやすいが、そのままでは学習の計算（微分）ができない。","body":"重みをちょうど0にして、ネットワークの不要な部分を取り除くことが期待できます。\nただし、個数は重みについて微分できないため、ふつうの学習（勾配を使う方法）にはそのまま使えません。\nそのため、確率を使って近似するなどの工夫が提案されています。","related":["W-147","W-146","W-180","W-126"],"sources":[{"title":"Christos Louizos ほか \"Learning Sparse Neural Networks through L0 Regularization\" (arXiv:1712.01312)","url":"https://arxiv.org/abs/1712.01312"},{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-150","term":"ラッソ回帰","aliases":["Lasso回帰","Lasso"],"category":4,"short":"線形回帰にL1正則化を加えたもの。一部の係数がちょうど0になり、特徴量を選ぶ働きもある。","body":"予測に役立たない特徴量の係数が0になり、使われなくなります。\nそのため、たくさんの特徴量の中から、大事なものを選び出すのにも使えます。","related":["W-147","W-151","W-063","W-059"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-151","term":"リッジ回帰","aliases":["Ridge回帰","Ridge"],"category":4,"short":"線形回帰にL2正則化を加えたもの。係数全体を小さく抑えて、過学習を防ぐ。","body":"係数が大きくなりすぎるのを防ぎ、予測を安定させます。\nラッソ回帰と違い、係数はちょうど0にはなりにくい性質があります。","related":["W-148","W-150","W-063","W-106"],"sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}]},{"id":"W-152","term":"ドロップアウト","category":4,"short":"学習のたびに、ニューロンの一部をランダムに休ませて学習させ、過学習を防ぐ方法。","body":"ヒントンらが提案しました。\n学習のたびに、隠れ層などのユニットの一部（例えば半分）をランダムに選んで、使わないようにします。\nすると、特定のユニットに頼りきることがなくなり、どんな場合にも役立つ特徴を学ぶようになります。\n予測（推論）のときは、すべてのユニットを使います。","example":"チームの練習で、毎回ランダムに何人かを休ませると、特定の人に頼らず誰でも活躍できるチームになる、というイメージです。","related":["W-106","W-146","W-122","W-130"],"sources":[{"title":"Geoffrey E. Hinton ほか \"Improving neural networks by preventing co-adaptation of feature detectors\" (arXiv:1207.0580)","url":"https://arxiv.org/abs/1207.0580"}]},{"id":"W-153","term":"連鎖律","category":4,"short":"いくつもの関数を組み合わせた関数（合成関数）を微分するときの規則。誤差逆伝播法の土台になっている。","body":"ニューラルネットワークは、層ごとの計算を順につなげた、大きな合成関数とみなせます。\n連鎖律を使うと、ある重みについての勾配を、その先の層の勾配を掛け合わせることで求められます。\nこれを出力側から順に計算していくのが、誤差逆伝播法です。","related":["W-127","W-126","W-122","W-180"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-154","term":"信用割当問題","aliases":["クレジット・アサインメント問題"],"category":4,"short":"結果の成功や失敗に、システムのどの部分がどれだけ関わったのかを決めるのが難しいという問題。","body":"ミンスキーが1963年に取り上げた問題です。\nニューラルネットワークでは、出力の誤差に、たくさんの層にある多数の重みがそれぞれどれだけ関わったのかを決める必要があります。\n誤差逆伝播法は、各重みの勾配を求めることで、この問題に答える方法の一つといえます。","example":"チームが試合に負けたとき、誰のどのプレーがどれだけ負けにつながったのかを決めるのは難しい、というのと同じような問題です。","related":["W-127","W-122","W-180","W-126"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-155","term":"勾配降下法","category":4,"short":"誤差関数の勾配（傾き）と逆の向きに、パラメータを少しずつ動かして、誤差を小さくしていく方法。","body":"誤差関数を地形にたとえると、坂を下る向きに少しずつ進んで、谷底（誤差が最小の場所）を目指すイメージです。\n1回にどれだけ進むかを決めるのが、学習率です。\n使うデータの量によって、バッチ学習、ミニバッチ学習、確率的勾配降下法（SGD）に分けられます。","related":["W-156","W-126","W-159","W-163","W-166","W-125","W-123","W-157","W-158"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-156","term":"学習率","category":4,"short":"勾配降下法で、1回の更新でパラメータをどれだけ動かすかを決める値。","body":"学習率が小さすぎると、谷底にたどり着くまでにとても時間がかかります。\n大きすぎると、谷底を行き過ぎて行ったり来たりしたり、かえって誤差が大きくなったり（発散）します。\n学習の前に人が決めるハイパーパラメータの一つです。学習の進み具合に応じて小さくしていく方法もあります。","example":"山を下るときの一歩の大きさです。小またすぎると時間がかかり、大またすぎると谷を飛び越えてしまいます。","related":["W-155","W-174","W-123"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-157","term":"バッチ学習","category":4,"short":"学習データをすべて使って勾配を計算してから、パラメータを1回更新する学習のやり方。","body":"全部のデータを見てから更新するので、更新の向きは安定しています。\nただし、1回の更新に時間がかかり、メモリに収まらないほど大量のデータには使いにくいという欠点があります。","related":["W-158","W-159","W-160","W-126","W-123"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-158","term":"ミニバッチ学習","category":4,"short":"学習データを少しずつのまとまり（ミニバッチ）に分け、まとまりごとに勾配を計算して更新する学習のやり方。","body":"全部のデータを使うバッチ学習と、1件ずつ使う確率的勾配降下法の、中間のやり方です。\n更新のばらつきを抑えつつ、まとめて計算することで速さも生かせるため、ディープラーニングで最もよく使われます。","related":["W-157","W-159","W-162","W-126"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-159","term":"確率的勾配降下法（SGD）","aliases":["確率的勾配降下法","SGD"],"category":4,"short":"学習データを1件ずつ（または少しずつ）ランダムに使い、そのたびにパラメータを更新する勾配降下法。","body":"1件ごとに更新するので、1回の更新が速く、新しいデータが届くたびに学ぶオンライン学習にも使えます。\n更新のたびに向きがばらつきますが、そのばらつきのおかげで、よりよい解に移れることもあります。\n実際には、ミニバッチ学習のこともSGDと呼ぶことが多いです。","related":["W-158","W-157","W-160","W-166","W-123","W-155"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-160","term":"オンライン学習","category":4,"short":"データが届くたびに、そのデータを使ってモデルを少しずつ更新していく学習のやり方。","body":"最初にすべての学習データをそろえる必要がありません。\nデータが次々に届く場合や、データが大きすぎて一度にメモリに収まらない場合に向いています。\n1件ずつ更新する確率的勾配降下法が使えます。","related":["W-159","W-157"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-161","term":"エポック","category":4,"short":"学習データ全体を、ひととおり1回ずつ使い切る単位。","body":"「10エポック学習する」とは、学習データの一つひとつを、10回ずつ学習に使うことを意味します。","example":"学習データが1000件なら、1000件をすべて使い終わったところで1エポックです。","related":["W-162","W-158","W-173"],"sources":[{"title":"scikit-learn API sklearn.neural_network.MLPClassifier","url":"https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html"},{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-162","term":"イテレーション","category":4,"short":"パラメータを1回更新する単位。ミニバッチ学習では、1つのミニバッチで1回の更新になる。","body":"1エポックの中に、何回のイテレーションがあるかは、ミニバッチの大きさで決まります。","example":"学習データが1000件で、ミニバッチが100件なら、1エポックは 1000÷100＝10イテレーションです。","related":["W-161","W-158","W-123"],"sources":[{"title":"scikit-learn API sklearn.neural_network.MLPClassifier","url":"https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html"},{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-163","term":"局所最適解","category":4,"short":"周りの範囲では誤差が一番小さいが、全体で見ると一番とは限らない点。","body":"誤差関数の地形に、谷がいくつもある場合を考えます。\n局所最適解は、そのうちの1つの谷の底です。すぐ近くでは一番低いものの、もっと深い谷がほかにあるかもしれません。\nニューラルネットワークの誤差関数には谷がたくさんあるため、勾配降下法で一番深い谷にたどり着ける保証はありません。","related":["W-164","W-165","W-155","W-125","W-122"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"Yann Dauphin ほか \"Identifying and attacking the saddle point problem in high-dimensional non-convex optimization\" (arXiv:1406.2572)","url":"https://arxiv.org/abs/1406.2572"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-164","term":"大域最適解","category":4,"short":"誤差関数の全体の中で、誤差が最も小さくなる点。","body":"すべての谷の中で、一番深い谷の底にあたります。\n学習の理想の目標ですが、実際にたどり着けるとは限りません。","related":["W-163","W-165","W-125"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"Yann Dauphin ほか \"Identifying and attacking the saddle point problem in high-dimensional non-convex optimization\" (arXiv:1406.2572)","url":"https://arxiv.org/abs/1406.2572"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-165","term":"鞍点","aliases":["あんてん"],"category":4,"short":"ある向きには上り坂、別の向きには下り坂になっている点。勾配がほぼ0になり、学習が止まりやすい。","body":"馬の鞍（くら）のような形をしていることから、こう呼ばれます。\n鞍点の周りは平らになっていることが多く、どの向きにも勾配がほぼ0になるため、勾配降下法がそこから抜け出しにくくなります。\n次元の高い問題では、学習の難しさの原因は、局所最適解よりも鞍点にあるという指摘もあります。","related":["W-163","W-164","W-166","W-126","W-155"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"Yann Dauphin ほか \"Identifying and attacking the saddle point problem in high-dimensional non-convex optimization\" (arXiv:1406.2572)","url":"https://arxiv.org/abs/1406.2572"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}]},{"id":"W-166","term":"モーメンタム","category":4,"short":"前回の更新の勢いを今回の更新に加えることで、進む向きを加速させ、行ったり来たりの揺れを抑える工夫。","body":"確率的勾配降下法（SGD）を改良する方法です。\n今回の更新量に、前回の更新量の一定の割合を足します。\n同じ向きに進み続けるときは加速し、行ったり来たりする向きの動きは打ち消し合って小さくなります。","example":"坂を転がるボールが勢いをつけて進み、小さなくぼみでは止まらずに進んでいくイメージです。","related":["W-159","W-170","W-165"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-167","term":"AdaGrad","aliases":["アダグラッド"],"category":4,"short":"パラメータごとに学習率を自動で調整する方法。よく更新されてきたパラメータほど学習率を小さくする。","body":"これまでの勾配の2乗を足し合わせ、その値が大きいパラメータほど、学習率を小さくします。\nまれにしか現れない特徴に関わるパラメータは、大きく更新されます。\nただし、足し続けるので、学習が進むと学習率がどんどん小さくなり、やがて学習がほとんど進まなくなる欠点があります。","related":["W-168","W-169","W-170","W-123","W-156","W-126"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-168","term":"RMSprop","category":4,"short":"AdaGradの欠点を和らげるため、古い勾配の影響を少しずつ薄めながら、パラメータごとに学習率を調整する方法。","body":"AdaGradのように過去の勾配の2乗をすべて足すのではなく、古いものほど影響を小さくした平均（指数移動平均）を使います。\nこれにより、学習率が小さくなりすぎて学習が止まるのを防ぎます。\nヒントンが講義の中で提案した方法です。","related":["W-167","W-169","W-170","W-126","W-123","W-156","W-407"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-169","term":"AdaDelta","aliases":["アダデルタ"],"category":4,"short":"RMSpropとほぼ同じ時期に考えられた、AdaGradの欠点を和らげる学習率の調整方法。","body":"RMSpropと同じく、古い勾配の影響を少しずつ薄めた平均を使って、学習率が小さくなりすぎるのを防ぎます。","related":["W-167","W-168","W-170","W-156","W-126"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}]},{"id":"W-170","term":"Adam","aliases":["アダム"],"category":4,"short":"モーメンタムとRMSpropの考え方を組み合わせて、パラメータごとに学習率を調整する方法。","body":"過去の勾配そのものの平均（モーメンタムの考え方）と、過去の勾配の2乗の平均（RMSpropの考え方）の両方を使います。\nディープラーニングで広く使われています。\n改良した方法として、AMSGrad、AdaBound、AMSBoundなどが提案されています。","related":["W-166","W-168","W-171","W-172","W-123","W-156","W-126"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"Liangchen Luo ほか \"Adaptive Gradient Methods with Dynamic Bound of Learning Rate\" (arXiv:1902.09843)","url":"https://arxiv.org/abs/1902.09843"}]},{"id":"W-171","term":"AdaBound","category":4,"short":"Adamの学習率に、学習の進み具合とともに変わる上限と下限を設け、だんだんSGDのような動きに移していく方法。","body":"Adamのような方法は、学習の初めは速く進みますが、SGDに比べて新しいデータへの性能が劣ることがあると指摘されてきました。\nAdaBoundは、学習率が極端な値にならないように範囲を決め、学習が進むにつれて、その範囲をSGDのように狭めていきます。\n初めの速さと、SGDのような性能の両立を目指しています。\n名前が似ている「AdaBoost」は、アンサンブル学習の方法で、まったく別のものです。","related":["W-172","W-170","W-159","W-156","W-072"],"sources":[{"title":"Liangchen Luo ほか \"Adaptive Gradient Methods with Dynamic Bound of Learning Rate\" (arXiv:1902.09843)","url":"https://arxiv.org/abs/1902.09843"}]},{"id":"W-172","term":"AMSBound","category":4,"short":"AMSGrad（Adamの改良版）に、AdaBoundと同じく学習率の上限と下限を設けた方法。","body":"AdaBoundと同じ考え方で、学習率が極端な値にならないようにし、だんだんSGDのような動きに移していきます。","related":["W-171","W-170","W-156","W-159"],"sources":[{"title":"Liangchen Luo ほか \"Adaptive Gradient Methods with Dynamic Bound of Learning Rate\" (arXiv:1902.09843)","url":"https://arxiv.org/abs/1902.09843"}]},{"id":"W-173","term":"早期終了","aliases":["Early Stopping","アーリーストッピング"],"category":4,"short":"学習中に、確認用のデータでの成績を見張り、よくならなくなったところで学習を止めて、過学習を防ぐ方法。","body":"学習を続けると、学習データでの誤差は下がり続けても、新しいデータでの性能は悪くなっていくことがあります（過学習）。\nそこで、学習用とは別に取り分けたデータでの誤差を見張り、何エポックか続けてよくならなければ学習を止めます。\n追加の手間がほとんどなく簡単に使えるため、ヒントンは「美しいただ飯（free lunch）」と表現しました。","related":["W-106","W-161"],"sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"scikit-learn API sklearn.neural_network.MLPClassifier","url":"https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html"}]},{"id":"W-174","term":"ハイパーパラメータ","category":4,"short":"学習で自動的に決まるのではなく、学習を始める前に人が決める設定値。","body":"学習率、層の数、正則化の強さなどがあります。\n学習によって決まる重みなどの「パラメータ」とは区別します。\nよい値を見つけるには、いろいろな候補を試して性能を比べます。そのやり方に、グリッドサーチやランダムサーチがあります。","related":["W-175","W-176","W-123","W-156","W-146","W-180"],"sources":[{"title":"scikit-learn User Guide 3.2 Tuning the hyper-parameters of an estimator","url":"https://scikit-learn.org/stable/modules/grid_search.html"}]},{"id":"W-175","term":"グリッドサーチ","category":4,"short":"ハイパーパラメータの候補の値の組み合わせを、すべて試してよいものを探す方法。","body":"確実ですが、ハイパーパラメータや候補の数が増えると、試す組み合わせの数が一気に増えます。","example":"学習率の候補が3つ、層の数の候補が4つなら、3×4＝12通りをすべて試します。","related":["W-176","W-174","W-156"],"sources":[{"title":"scikit-learn User Guide 3.2 Tuning the hyper-parameters of an estimator","url":"https://scikit-learn.org/stable/modules/grid_search.html"}]},{"id":"W-176","term":"ランダムサーチ","category":4,"short":"ハイパーパラメータの値をランダムに選んで試し、よいものを探す方法。","body":"試す回数を、ハイパーパラメータの数とは関係なく決められます。\n性能にあまり影響しないハイパーパラメータが混ざっていても、効率が落ちにくいという利点があります。","related":["W-175","W-174"],"sources":[{"title":"scikit-learn User Guide 3.2 Tuning the hyper-parameters of an estimator","url":"https://scikit-learn.org/stable/modules/grid_search.html"}]},{"id":"W-177","term":"二重降下現象","aliases":["ダブルディセント"],"category":4,"short":"モデルを大きくしていくと、テストの誤差がいったん悪くなった後、さらに大きくすると再びよくなっていく現象。","body":"従来は、モデルを大きく（複雑に）しすぎると、過学習で誤差が上がり続けると考えられていました。\nところがディープラーニングでは、さらに大きくすると、誤差が再び下がっていく現象が見られます。\nモデルの大きさだけでなく、学習のエポック数を増やしたときにも起きることが報告されています。","related":["W-106","W-161"],"sources":[{"title":"Preetum Nakkiran ほか \"Deep Double Descent: Where Bigger Models and More Data Hurt\" (arXiv:1912.02292)","url":"https://arxiv.org/abs/1912.02292"}]},{"id":"W-178","term":"ノーフリーランチの定理","category":4,"short":"あらゆる問題を平均すると、どの最適化の方法も性能は同じになり、どんな問題でも一番よい万能の方法はない、という定理。","body":"ウォルパートとマクレディが示しました。\nある種類の問題で成績がよい方法は、そのぶん別の問題では成績が劣ることになります。\n機械学習では、「どんなデータにも最適な方法はないので、問題の性質に合った方法を選ぶ必要がある」という意味で使われます。","example":"「ただ飯（フリーランチ）はない」ということわざのように、何にでも効く楽な方法はない、という意味です。","related":["W-121"],"sources":[{"title":"Christian Igel, Marc Toussaint \"Recent Results on No-Free-Lunch Theorems for Optimization\" (arXiv:cs/0303032)","url":"https://arxiv.org/abs/cs/0303032"}]},{"id":"W-179","term":"全結合層","category":5,"short":"前の層のすべてのユニットと、次の層のすべてのユニットがつながっている層。","body":"次の層の各ユニットは、前の層のすべての値に重みを掛けて足し合わせ、多くの場合は活性化関数で変換して出力します。\n重みの数は、おおよそ「前の層のユニット数×次の層のユニット数」になるので、入力が大きいと重みがとても多くなります。\n畳み込みニューラルネットワークの最後の、分類を行う部分などで使われます。","related":["W-180","W-181","W-183","W-130","W-124","W-182","W-061"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-180","term":"重み","aliases":["ウェイト"],"category":5,"short":"ニューラルネットワークで、ユニットどうしのつながりの強さを表す数値。学習で調整される。","body":"前の層から受け取った値に、重みを掛けてから足し合わせます。\n重みが大きいつながりほど、その入力が結果に強く影響します。\n学習とは、よい予測ができるように、この重みを少しずつ調整していくことです。","example":"「テストの点＝0.7×勉強時間＋0.3×睡眠時間」なら、0.7と0.3が重みで、勉強時間のほうが強く影響することを表します。","related":["W-123","W-179","W-181","W-122"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-181","term":"線形関数","aliases":["一次関数","線形変換"],"category":5,"short":"値にそれぞれ係数（重み）を掛けて足し合わせるだけの、まっすぐな関係を表す関数。","body":"全結合層では、前の層の値に重みを掛けて足し合わせます。この計算が線形関数です。\n線形関数だけを何層重ねても、全体は1つの線形関数にしかならず、複雑な関係は表せません。\nそのため、層の間に活性化関数という「まっすぐでない（非線形の）」変換をはさみます。","related":["W-179","W-180","W-124"],"sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}]},{"id":"W-182","term":"畳み込みニューラルネットワーク（CNN）","aliases":["畳み込みニューラルネットワーク","CNN","Convolutional Neural Network"],"category":5,"short":"画像の小さな範囲ごとに特徴を取り出す「畳み込み層」を使う、画像の扱いが得意なニューラルネットワーク。","body":"畳み込み層で画像の小さな範囲から特徴を取り出し、プーリング層で要点をまとめる、ということを繰り返します。\n同じフィルタを画像全体で使い回すので、全結合層だけのネットワークより重みの数が少なくて済みます。\n画像のように、近くの値どうしに関係があるデータに向いています。","related":["W-183","W-184","W-185","W-196","W-050","W-051","W-122","W-179","W-180"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-183","term":"畳み込み層","category":5,"short":"小さなフィルタを画像の上でずらしながら掛け算と足し算をして、画像の特徴を取り出す層。","body":"畳み込みニューラルネットワーク（CNN）の中心となる層です。\nフィルタの重みは学習で自動的に決まります。縦の線や丸い形など、いろいろな特徴を取り出すフィルタが学習されます。\n同じフィルタを画像全体で使い回すので、画像のどこに特徴があっても見つけられます。","related":["W-184","W-185","W-186","W-187","W-188","W-179","W-182","W-180"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-184","term":"畳み込み操作","aliases":["畳み込み"],"category":5,"short":"フィルタを入力の上でずらしながら、重なった部分の掛け算の合計を順に計算していく操作。","body":"フィルタ（小さな重みの表）を、入力の左上から順にずらしていきます。\nそれぞれの位置で、フィルタと入力の重なった部分を掛け合わせ、その合計を出力します。\nこうして得られた出力を、特徴マップといいます。","example":"5×5の画像に3×3のフィルタを、1マスずつずらして当てると、縦横3か所ずつ当てられるので、3×3の特徴マップができます。","related":["W-185","W-186","W-187","W-188","W-180"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-185","term":"フィルタ","aliases":["カーネル（畳み込み）"],"category":5,"short":"畳み込み操作で使う、小さな重みの表。どんな特徴を取り出すかを決める。","body":"カーネルとも呼ばれます。\nフィルタの値（重み）は、学習によって自動的に決まります。\n1つの畳み込み層で、たくさんのフィルタを使って、いろいろな特徴を取り出します。","related":["W-184","W-186","W-069","W-180","W-183"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-186","term":"特徴マップ","category":5,"short":"畳み込み操作の結果として得られる出力。入力のどこに、どんな特徴があるかを表す。","body":"フィルタごとに1枚の特徴マップができます。\n「この位置に、このフィルタが見つける特徴が強く出ている」という情報を表しています。","related":["W-184","W-185","W-196"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-187","term":"ストライド","category":5,"short":"畳み込み操作で、フィルタを1回にずらす間隔。大きくすると出力が小さくなる。","body":"ストライドが1なら1マスずつ、2なら2マスずつずらします。\nずらす間隔を大きくすると、フィルタを当てる回数が減るので、出力の特徴マップは小さくなります。","example":"5×5の入力に3×3のフィルタを、ストライド2で当てると、出力は2×2になります。","related":["W-188","W-184","W-185","W-186"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-188","term":"パディング","category":5,"short":"畳み込みの前に、入力の周りに値（多くは0）を足して、出力の大きさを調整すること。","body":"畳み込みをすると、ふつうは出力が入力より小さくなります。\n周りに値を足しておくと、出力の大きさを入力と同じにしたり、画像の端の情報も使いやすくしたりできます。\n0を足すものを、ゼロパディングといいます。","example":"5×5の入力の周りに幅1の0を足してから3×3のフィルタを当てると、出力も5×5になります。","related":["W-187","W-184","W-185"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-189","term":"Dilated Convolution","aliases":["拡張畳み込み"],"category":5,"short":"フィルタの要素の間にすき間を空けて広げることで、重みを増やさずに、一度に見る範囲を広げる畳み込み。","body":"フィルタの大きさ（重みの数）はそのままで、より広い範囲をまとめて見られます。\n画像を小さくせずに広い範囲の情報を集められるので、画素ごとに分類するセマンティックセグメンテーションで使われます。\nDeepLabでは、同じ考え方をAtrous Convolutionと呼んでいます。","example":"3×3のフィルタの要素を1マスずつ空けて配置すると、5×5の範囲を、9個の重みだけで見られます。","related":["W-190","W-268","W-244","W-185","W-180","W-184","W-061"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"},{"title":"Fisher Yu, Vladlen Koltun \"Multi-Scale Context Aggregation by Dilated Convolutions\" (arXiv:1511.07122)","url":"https://arxiv.org/abs/1511.07122"},{"title":"Liang-Chieh Chen ほか \"DeepLab: Semantic Image Segmentation with Deep Convolutional Nets, Atrous Convolution, and Fully Connected CRFs\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}]},{"id":"W-190","term":"Atrous Convolution","aliases":["アトラス畳み込み"],"category":5,"short":"Dilated Convolutionと同じもの。DeepLabでの呼び方。","body":"フィルタの要素の間にすき間を空けて、一度に見る範囲を広げる畳み込みです。\nDeepLabでは、すき間の幅が違うAtrous Convolutionを並べて、いろいろな大きさの範囲の情報を集める仕組み（ASPP）も使っています。","related":["W-189","W-268","W-185","W-184"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"},{"title":"Fisher Yu, Vladlen Koltun \"Multi-Scale Context Aggregation by Dilated Convolutions\" (arXiv:1511.07122)","url":"https://arxiv.org/abs/1511.07122"},{"title":"Liang-Chieh Chen ほか \"DeepLab: Semantic Image Segmentation with Deep Convolutional Nets, Atrous Convolution, and Fully Connected CRFs\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}]},{"id":"W-191","term":"Depthwise Separable Convolution","aliases":["深さ方向に分離可能な畳み込み"],"category":5,"short":"ふつうの畳み込みを2段階に分けて、計算量と重みの数を大きく減らす方法。MobileNetの土台。","body":"1段目では、入力のチャンネル（色など）ごとに、1枚ずつフィルタをかけます（Depthwise畳み込み）。\n2段目では、1×1の畳み込みで、チャンネルどうしの値を組み合わせます（Pointwise畳み込み）。\nふつうの畳み込みが一度に行う2つの仕事を分けることで、計算を大きく減らせます。\nスマートフォンなどで動かす軽いモデル（MobileNet）に使われています。","related":["W-257","W-184","W-180","W-185"],"sources":[{"title":"Andrew G. Howard ほか \"MobileNets: Efficient Convolutional Neural Networks for Mobile Vision Applications\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}]},{"id":"W-192","term":"バッチ正規化","aliases":["Batch Normalization"],"category":5,"short":"ミニバッチごとに、層への入力の平均と分散をそろえて、学習を速く安定させる方法。","body":"深いネットワークでは、学習の途中で前の層が変わるため、各層への入力の分布も変わり続け、学習が遅くなります。\nバッチ正規化は、ミニバッチの中の平均と分散を使って入力をそろえ、その後に学習できる値で調整します。\n大きな学習率が使えるようになり、学習が速く安定します。\nただし、ミニバッチが小さいと平均や分散の見積もりが不正確になるという弱点があります。","related":["W-193","W-194","W-195","W-158","W-156"],"sources":[{"title":"Sergey Ioffe, Christian Szegedy \"Batch Normalization\" (arXiv:1502.03167)","url":"https://arxiv.org/abs/1502.03167"},{"title":"Yuxin Wu, Kaiming He \"Group Normalization\" (arXiv:1803.08494)","url":"https://arxiv.org/abs/1803.08494"}]},{"id":"W-193","term":"レイヤー正規化","aliases":["Layer Normalization"],"category":5,"short":"1つのデータの中で、層のすべてのユニットの値の平均と分散をそろえる正規化。Transformerでも使われる。","body":"ミニバッチの他のデータを使わないので、ミニバッチの大きさに左右されにくいのが特徴です。\nリカレントニューラルネットワーク（RNN）にも使いやすい方法です。","related":["W-192","W-194","W-195","W-218","W-204"],"sources":[{"title":"Jimmy Lei Ba ほか \"Layer Normalization\" (arXiv:1607.06450)","url":"https://arxiv.org/abs/1607.06450"},{"title":"Dmitry Ulyanov ほか \"Instance Normalization: The Missing Ingredient for Fast Stylization\" (arXiv:1607.08022)","url":"https://arxiv.org/abs/1607.08022"},{"title":"Yuxin Wu, Kaiming He \"Group Normalization\" (arXiv:1803.08494)","url":"https://arxiv.org/abs/1803.08494"}]},{"id":"W-194","term":"インスタンス正規化","aliases":["Instance Normalization"],"category":5,"short":"1つのデータの、チャンネルごとに値の平均と分散をそろえる正規化。画像のスタイル変換で効果があった。","body":"1枚の画像の中で、チャンネル（色の成分など）ごとに正規化します。\n画像の雰囲気を変える「スタイル変換」で、バッチ正規化の代わりに使うと画質がよくなりました。","related":["W-192","W-193","W-195"],"sources":[{"title":"Jimmy Lei Ba ほか \"Layer Normalization\" (arXiv:1607.06450)","url":"https://arxiv.org/abs/1607.06450"},{"title":"Dmitry Ulyanov ほか \"Instance Normalization: The Missing Ingredient for Fast Stylization\" (arXiv:1607.08022)","url":"https://arxiv.org/abs/1607.08022"},{"title":"Yuxin Wu, Kaiming He \"Group Normalization\" (arXiv:1803.08494)","url":"https://arxiv.org/abs/1803.08494"}]},{"id":"W-195","term":"グループ正規化","aliases":["Group Normalization"],"category":5,"short":"チャンネル（色の成分や特徴マップの1枚1枚）をグループに分け、グループごとに平均と分散をそろえる正規化。","body":"レイヤー正規化とインスタンス正規化の中間にあたる方法です。\nミニバッチが小さくても、安定した性能が出ます。","related":["W-192","W-193","W-194","W-186"],"sources":[{"title":"Jimmy Lei Ba ほか \"Layer Normalization\" (arXiv:1607.06450)","url":"https://arxiv.org/abs/1607.06450"},{"title":"Dmitry Ulyanov ほか \"Instance Normalization: The Missing Ingredient for Fast Stylization\" (arXiv:1607.08022)","url":"https://arxiv.org/abs/1607.08022"},{"title":"Yuxin Wu, Kaiming He \"Group Normalization\" (arXiv:1803.08494)","url":"https://arxiv.org/abs/1803.08494"}]},{"id":"W-196","term":"プーリング層","aliases":["プーリング"],"category":5,"short":"特徴マップを小さな範囲に分け、それぞれを1つの値にまとめて、特徴マップを小さくする層。","body":"範囲の中の最大値をとる最大値プーリングや、平均値をとる平均値プーリングがあります。\n入力が少しずれても、出力が変わりにくくなります（不変性の獲得）。\n計算するだけなので、学習する重みはありません。","related":["W-197","W-198","W-199","W-200","W-186","W-180"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-197","term":"最大値プーリング","aliases":["Max Pooling"],"category":5,"short":"プーリングで、各範囲の中の最大値をとる方法。最もよく使われる。","body":"各範囲で一番強く出ている特徴だけを残します。","example":"2×2の範囲に 1、5、3、2 が並んでいれば、5 を残します。","related":["W-198","W-196"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-198","term":"平均値プーリング","aliases":["Average Pooling"],"category":5,"short":"プーリングで、各範囲の値の平均をとる方法。","body":"各範囲の特徴を、平均してならした値で表します。","example":"2×2の範囲に 1、5、3、3 が並んでいれば、平均の 3 にします。","related":["W-197","W-196","W-200"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-199","term":"不変性の獲得","category":5,"short":"プーリングによって、入力が少しずれても出力がほとんど変わらない性質を得ること。","body":"範囲の中の最大値や平均値だけを残すので、特徴の位置が少しずれても、同じ結果になりやすくなります。\nそのため、写っている物の位置が少しずれた画像でも、同じように認識しやすくなります。","related":["W-196","W-197"],"sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}]},{"id":"W-200","term":"グローバルアベレージプーリング（GAP）","aliases":["グローバルアベレージプーリング","GAP"],"category":5,"short":"最後の特徴マップを、1枚（1チャンネル）ごとに全体で平均して1つの値にする方法。全結合層の代わりに使う。","body":"Network In Networkという研究で提案されました。\n全結合層は重みが多く、過学習しやすいという問題がありました。GAPは重みを持たないので、過学習しにくくなります。\n特徴マップとクラスの対応がわかりやすく、解釈しやすいという利点もあります。ResNetなどで使われています。","related":["W-198","W-179","W-202","W-361","W-186","W-180","W-106"],"sources":[{"title":"Min Lin ほか \"Network In Network\" (arXiv:1312.4400)","url":"https://arxiv.org/abs/1312.4400"},{"title":"Kaiming He ほか \"Deep Residual Learning for Image Recognition\" (arXiv:1512.03385)","url":"https://arxiv.org/abs/1512.03385"}]},{"id":"W-201","term":"スキップ結合","aliases":["ショートカット結合","残差接続"],"category":5,"short":"いくつかの層を飛び越えて、入力をそのまま出力に足し合わせるつなぎ方。とても深いネットワークを学習しやすくする。","body":"層を飛び越える近道を作ることで、学習の手がかり（勾配）が、入力側まで伝わりやすくなります。\n各部分は、入力そのものではなく、入力との差（残差）を学べばよくなります。\nResNetで導入され、その後の多くのモデルで使われています。","related":["W-202","W-139","W-126"],"sources":[{"title":"Kaiming He ほか \"Deep Residual Learning for Image Recognition\" (arXiv:1512.03385)","url":"https://arxiv.org/abs/1512.03385"}]},{"id":"W-202","term":"ResNet","aliases":["残差ネットワーク","Residual Network"],"category":5,"short":"スキップ結合を取り入れて、100層を超えるとても深いネットワークでも学習できるようにしたモデル。","body":"ネットワークを深くすると、かえって精度が下がることがありました。\nResNetは、層を飛び越えて入力を出力に足すスキップ結合を使い、入力との差（残差）を学ぶようにしました。\n152層という深さでも学習でき、2015年の画像認識のコンテスト（ILSVRC）の分類部門で1位になりました。","related":["W-201","W-251","W-252","W-053","W-139","W-061"],"sources":[{"title":"Kaiming He ほか \"Deep Residual Learning for Image Recognition\" (arXiv:1512.03385)","url":"https://arxiv.org/abs/1512.03385"}]},{"id":"W-203","term":"時系列データ","category":5,"short":"時間の順番に沿って並んだデータ。前後の順番に意味がある。","body":"株価、気温、音声、文章（単語の並び）などが、時系列データの例です。\n前のデータが後のデータに影響するため、順番を考えて扱う必要があります。\nリカレントニューラルネットワーク（RNN）は、このようなデータを扱うのに向いています。","example":"毎日の気温を日付の順に並べたものは、時系列データです。","related":["W-204","W-078","W-407"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"},{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"},{"title":"statsmodels Vector Autoregressions (tsa.vector_ar)","url":"https://www.statsmodels.org/stable/vector_ar.html"}]},{"id":"W-204","term":"リカレントニューラルネットワーク（RNN）","aliases":["リカレントニューラルネットワーク","RNN","回帰結合層"],"category":5,"short":"前の時刻の情報を次の時刻に戻して使う仕組みを持つ、時系列データの扱いが得意なニューラルネットワーク。","body":"前の時刻の隠れ層の値を、次の時刻の入力と一緒に使います。このつながりを回帰結合といいます。\nこれにより、それまでの流れ（文脈）を覚えながら処理できます。\n文章、音声、株価などの時系列データを扱うのに向いています。\nただし、長い系列では、勾配消失問題や勾配爆発問題が起きやすくなります。","related":["W-203","W-209","W-210","W-207","W-205","W-206","W-122","W-130","W-139","W-140"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"},{"title":"Razvan Pascanu ほか \"On the difficulty of training Recurrent Neural Networks\" (arXiv:1211.5063)","url":"https://arxiv.org/abs/1211.5063"}]},{"id":"W-205","term":"エルマンネットワーク","category":5,"short":"隠れ層の値を次の時刻の隠れ層に戻して使う、初期のリカレントニューラルネットワーク。","body":"1990年に発表されました。\n隠れ層の値を「文脈ユニット」に保存し、次の時刻の隠れ層に戻します。\n今の一般的なRNNの形に近いものです。","related":["W-206","W-204","W-130"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-206","term":"ジョルダンネットワーク","category":5,"short":"出力層の値を次の時刻の隠れ層に戻して使う、初期のリカレントニューラルネットワーク。","body":"1986年に発表されました。\n出力層の値を特別なユニットに送り、次の時刻の隠れ層に戻します。\n隠れ層の値を戻すエルマンネットワークとの違いに注意しましょう。","related":["W-205","W-204","W-130"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-207","term":"BPTT","aliases":["通時的誤差逆伝播法","Backpropagation Through Time"],"category":5,"short":"RNNを時間の方向に展開して、誤差逆伝播法で学習させる方法。","body":"RNNは、時刻ごとに同じ重みを使う、深いネットワークとみなせます。\nこの展開したネットワークに誤差逆伝播法を使って学習するのが、BPTTです。\n時間をさかのぼるほど勾配を何度も掛け合わせるため、長い系列では勾配消失や勾配爆発が起きやすくなります。","related":["W-204","W-127","W-139","W-140","W-180","W-126"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"},{"title":"Razvan Pascanu ほか \"On the difficulty of training Recurrent Neural Networks\" (arXiv:1211.5063)","url":"https://arxiv.org/abs/1211.5063"}]},{"id":"W-208","term":"ゲート機構","category":5,"short":"情報をどれだけ通すか、どれだけ忘れるかを、学習によって調整する仕組み。LSTMやGRUで使われる。","body":"「ゲート」は門という意味で、情報の出入りを開け閉めして調整します。\nこの仕組みで、必要な情報は長く覚え、いらない情報は忘れられるようになり、長い系列の関係を学びやすくなります。","related":["W-209","W-210"],"sources":[{"title":"Junyoung Chung ほか \"Empirical Evaluation of Gated Recurrent Neural Networks on Sequence Modeling\" (arXiv:1412.3555)","url":"https://arxiv.org/abs/1412.3555"},{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-209","term":"LSTM","aliases":["Long Short-Term Memory","長短期記憶"],"category":5,"short":"記憶を保つセルと、情報の出入りを調整するゲートを持つRNN。長い系列の関係を学びやすい。","body":"入力ゲート、出力ゲート、忘却ゲートという3つのゲートを持ちます。\n忘却ゲートは、セルに保っている内容をどれだけ残すか（忘れるか）を調整します。\nこれにより、ふつうのRNNでは難しい、離れた時刻どうしの関係を学べるようになりました。","related":["W-210","W-208","W-294","W-204","W-139"],"sources":[{"title":"Junyoung Chung ほか \"Empirical Evaluation of Gated Recurrent Neural Networks on Sequence Modeling\" (arXiv:1412.3555)","url":"https://arxiv.org/abs/1412.3555"},{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-210","term":"GRU","aliases":["Gated Recurrent Unit"],"category":5,"short":"LSTMより仕組みを簡単にした、ゲートを持つRNN。","body":"LSTMと同じく、ゲートで情報の出入りを調整し、長い系列の関係を学びやすくしています。\n比べた実験では、LSTMと同じくらいの性能を示しました。","related":["W-209","W-208","W-204"],"sources":[{"title":"Junyoung Chung ほか \"Empirical Evaluation of Gated Recurrent Neural Networks on Sequence Modeling\" (arXiv:1412.3555)","url":"https://arxiv.org/abs/1412.3555"},{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-211","term":"双方向RNN（Bidirectional RNN）","aliases":["双方向RNN","Bidirectional RNN"],"category":5,"short":"系列を前から後ろ、後ろから前の両方向で処理し、前後の文脈を使って各時刻の出力を決めるRNN。","body":"ふつうのRNNは、それより前の情報だけを使います。\n双方向RNNは、後ろの情報も使えるので、文章の中の単語の意味を前後から判断するような場面で役立ちます。\nただし、未来の情報を使うので、入力が届くたびにすぐ答えを出す必要がある処理には、そのままでは使えません。","related":["W-204","W-282"],"sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}]},{"id":"W-212","term":"教師強制","aliases":["Teacher Forcing"],"category":5,"short":"RNNの学習で、前の時刻の予測の代わりに、正解の値を次の時刻の入力として与える方法。","body":"系列を作るRNNは、ふつう、ある時刻の出力を次の時刻の入力として使います。\n学習の初めは予測がでたらめなので、正解の値を入力として与えることで、学習を速く安定させます。\nただし、実際に使うとき（生成時）は正解がないため、学習時との違いから、間違いが積み重なりやすいという課題があります。","related":["W-204","W-213"],"sources":[{"title":"Alex Lamb ほか \"Professor Forcing: A New Algorithm for Training Recurrent Networks\" (arXiv:1610.09038)","url":"https://arxiv.org/abs/1610.09038"}]},{"id":"W-213","term":"Seq2Seq","aliases":["系列変換モデル","Sequence to Sequence","エンコーダ・デコーダモデル"],"category":5,"short":"ある系列を別の系列に変換するモデル。エンコーダで入力をまとめ、デコーダで出力を1つずつ作る。","body":"エンコーダが入力の系列（例：英語の文）を読み込んで、決まった長さのベクトル（数値の並び）にまとめます。\nデコーダが、そのベクトルから出力の系列（例：フランス語の文）を1語ずつ作ります。\n入力と出力の長さが違ってもよいので、翻訳、要約、対話などに使われます。\n長い文では、1つのベクトルに情報を詰め込みきれないという課題があり、Attentionで改善されました。","related":["W-214","W-204","W-290"],"sources":[{"title":"Ilya Sutskever ほか \"Sequence to Sequence Learning with Neural Networks\" (arXiv:1409.3215)","url":"https://arxiv.org/abs/1409.3215"},{"title":"Dzmitry Bahdanau ほか \"Neural Machine Translation by Jointly Learning to Align and Translate\" (arXiv:1409.0473)","url":"https://arxiv.org/abs/1409.0473"}]},{"id":"W-214","term":"Attention","aliases":["アテンション","注意機構"],"category":5,"short":"たくさんの情報の中から、今の作業に関係の深い部分に注目して使う仕組み。","body":"文章を翻訳するとき、人は訳している単語に対応する、元の文の部分をよく見ます。Attentionは、これをAIにさせる仕組みです。\n訳語を1つ作るたびに、元の文のどこがどれだけ関係するかを計算し、関係の深い部分を重く使います。\n長い文でも必要な部分を取り出せるので、翻訳の精度が大きく上がりました。\nAttentionだけで組み立てたモデルがTransformerで、今の大規模言語モデル（LLM）の土台です。","example":"教科書の長い文章から答えを探すとき、関係のありそうな段落にマーカーを引いて読むようなものです。","related":["W-218","W-219","W-220","W-215","W-216","W-217","W-213","W-285"],"sources":[{"title":"Dzmitry Bahdanau ほか \"Neural Machine Translation by Jointly Learning to Align and Translate\" (arXiv:1409.0473)","url":"https://arxiv.org/abs/1409.0473"},{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-215","term":"クエリ","aliases":["Query"],"category":5,"short":"Attentionで、「何を探しているか」を表すベクトル。","body":"Attentionでは、クエリ・キー・バリューという3種類のベクトルを使います。\nクエリを、各要素のキーと比べて、どれくらい合っているか（適合度）を計算します。\n合っている要素のバリューほど、強く取り込まれます。","example":"図書館で本を探すとき、「探したいテーマ」がクエリ、各本の「タイトル」がキー、「本の中身」がバリューにあたります。","related":["W-216","W-217","W-214"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-216","term":"キー","aliases":["Key"],"category":5,"short":"Attentionで、各要素の「見出し」にあたり、クエリと比べられるベクトル。","body":"クエリとキーの適合度（内積などで計算）から、それぞれの要素をどれくらい重視するかの重みを決めます。","related":["W-215","W-217","W-214","W-180"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-217","term":"バリュー","aliases":["Value"],"category":5,"short":"Attentionで、各要素の「中身」にあたるベクトル。重みを付けて足し合わせたものが出力になる。","body":"クエリとキーの適合度から決めた重みで、バリューを重み付けして足し合わせます。\nその結果が、Attentionの出力になります。","related":["W-215","W-216","W-214","W-180"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-218","term":"Transformer","aliases":["トランスフォーマー"],"category":5,"short":"RNNを使わず、Attentionだけで組み立てたモデル。今の大規模言語モデルの土台になっている。","body":"2017年の論文「Attention Is All You Need」で発表されました。\n順番に処理するRNNを使わないので、計算を並列に進めやすく、学習時間を大きく短くできました。\n順番の情報は、位置エンコーディングで補います。\nBERTやGPTなど、多くのモデルの土台になっています。","related":["W-214","W-219","W-221","W-222","W-283","W-285","W-204"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-219","term":"Self-Attention","aliases":["自己注意機構"],"category":5,"short":"クエリ・キー・バリューを、すべて同じ系列から作るAttention。文の中の離れた単語どうしの関係もとらえられる。","body":"系列の各要素が、同じ系列のすべての要素に注目できます。\nそのため、文の中で離れた位置にある単語どうしの関係も、直接とらえられます。","example":"「彼は疲れていたので、それを明日にした」という文で、「それ」が何を指すかを、文の中の他の単語との関係から判断するのに役立ちます。","related":["W-220","W-221","W-214","W-218","W-215","W-216","W-217"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-220","term":"Source-Target Attention","aliases":["エンコーダ・デコーダAttention","Encoder-Decoder Attention"],"category":5,"short":"クエリを出力側（デコーダ）から、キーとバリューを入力側（エンコーダ）から作るAttention。","body":"出力を1つ作るたびに、入力の系列のどこに注目するかを決めます。\n翻訳なら、訳語を作るときに、元の文のどの単語に注目するかを決める働きをします。","related":["W-219","W-214","W-213","W-215","W-216","W-217"],"sources":[{"title":"Dzmitry Bahdanau ほか \"Neural Machine Translation by Jointly Learning to Align and Translate\" (arXiv:1409.0473)","url":"https://arxiv.org/abs/1409.0473"},{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-221","term":"Multi-Head Attention","aliases":["マルチヘッドアテンション"],"category":5,"short":"複数のAttentionを並べて同時に計算し、いろいろな観点の関係を同時にとらえる仕組み。","body":"それぞれのAttention（ヘッド）が、違う観点で関係に注目します。\n1つのAttentionだけでは平均されて埋もれてしまう情報も、同時にとらえられます。\n結果をつなぎ合わせて、次の処理に渡します。","related":["W-219","W-218","W-214"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-222","term":"位置エンコーディング","aliases":["Positional Encoding"],"category":5,"short":"Transformerで、各単語が何番目にあるかという位置の情報を、入力に足し込む仕組み。","body":"Attentionは、要素の並び順を考えずに処理するので、そのままでは語順がわかりません。\nそこで、位置を表す値を、各単語のベクトルに足してから処理します。\n論文では、周期の違うサイン・コサインの関数を使った値が使われました。","example":"「犬が猫を追う」と「猫が犬を追う」は、使う単語が同じでも意味が違います。この違いを区別するために位置の情報が必要です。","related":["W-218","W-214"],"sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}]},{"id":"W-223","term":"オートエンコーダ","aliases":["自己符号化器"],"category":5,"short":"入力をいったん小さく圧縮し、そこから元の入力を復元するように学習するニューラルネットワーク。","body":"入力を小さな表現に変える部分（エンコーダ）と、そこから入力を復元する部分（デコーダ）からなります。\n真ん中の小さな表現には、入力の大事な特徴がまとめられます。\n正解のラベルを使わない、教師なし学習です。次元削減や特徴の取り出しに使われます。","related":["W-224","W-226","W-084","W-122","W-057"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-224","term":"積層オートエンコーダ","category":5,"short":"オートエンコーダを何段も重ねて、1層ずつ順に学習させる方法。深いネットワークの事前学習に使われた。","body":"1層目のオートエンコーダで学んだ表現を、2層目の入力にする、ということを繰り返して層を重ねます。\nこうして層ごとに学習させた重みを初期値にし、その後に全体を教師あり学習で調整しました（事前学習）。\n深いネットワークを学習しやすくするための方法として使われました。","related":["W-223","W-225","W-180","W-056"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"}]},{"id":"W-225","term":"事前学習","aliases":["プレトレーニング","Pre-training"],"category":5,"short":"本番の課題の前に、別のデータや課題でモデルをあらかじめ学習させておくこと。","body":"以前は、積層オートエンコーダで層ごとに学習させて、深いネットワークの重みの初期値を作る方法として使われました。\n今では、大量のデータで大きなモデルをあらかじめ学習させ、それを個々の課題に合わせて調整する使い方が主流です。\nこの「あらかじめ学習させたモデル」を、事前学習済みモデルといいます。","related":["W-224","W-343","W-342","W-341","W-180"],"sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}]},{"id":"W-226","term":"変分オートエンコーダ（VAE）","aliases":["変分オートエンコーダ","VAE"],"category":5,"short":"入力を確率の分布として表すオートエンコーダ。新しいデータを生成できる。","body":"入力を1つの点ではなく、「このあたりにありそう」という確率の分布（平均とばらつき）で表します。\nその分布から取り出した値から、デコーダが入力を復元します。\n学習後は、分布から値を取り出してデコーダに入れることで、学習データに似た新しいデータを作れます。\n2013年にキングマとウェリングが提案しました。","related":["W-223","W-227","W-143","W-332"],"sources":[{"title":"Diederik P. Kingma, Max Welling \"Auto-Encoding Variational Bayes\" (arXiv:1312.6114)","url":"https://arxiv.org/abs/1312.6114"},{"title":"Christopher P. Burgess ほか \"Understanding disentangling in β-VAE\" (arXiv:1804.03599)","url":"https://arxiv.org/abs/1804.03599"}]},{"id":"W-227","term":"VQ-VAE・info VAE・β-VAE","aliases":["VQ-VAE","info VAE","β-VAE","InfoVAE"],"category":5,"short":"変分オートエンコーダ（VAE）を目的に応じて改良した派生モデル。","body":"β-VAE：学習の目的の一部（KL情報量の項）に係数βを掛け、データの特徴（顔の向き、明るさなど）ごとに分かれた、わかりやすい表現を得やすくしたものです。\nVQ-VAE：中間の表現を、連続した数値ではなく、決まった候補の中から選ぶ形（離散的なコード）で表すものです。画像・動画・音声の高品質な生成に使われます。\ninfo VAE：学習の目的を見直し、表現力の高いデコーダと組み合わせても、中間の表現がきちんと使われるようにしたものです。","related":["W-226","W-143"],"sources":[{"title":"Christopher P. Burgess ほか \"Understanding disentangling in β-VAE\" (arXiv:1804.03599)","url":"https://arxiv.org/abs/1804.03599"},{"title":"Aaron van den Oord ほか \"Neural Discrete Representation Learning\" (arXiv:1711.00937)","url":"https://arxiv.org/abs/1711.00937"},{"title":"Shengjia Zhao ほか \"InfoVAE: Information Maximizing Variational Autoencoders\" (arXiv:1706.02262)","url":"https://arxiv.org/abs/1706.02262"}]},{"id":"W-228","term":"データ拡張","aliases":["Data Augmentation"],"category":5,"short":"手元の学習データに、回転や色の変更などの加工をして、学習データを水増しする方法。","body":"データを少しずつ変えたものを増やすことで、モデルがいろいろな見え方に強くなり、過学習を防げます。\n画像では、回転、反転、切り抜き、明るさの変更などがあります。\n文章では、同じ意味の言葉への置き換えなどがあります。","related":["W-229","W-230","W-231","W-232","W-233","W-234","W-236","W-238","W-239","W-240","W-106"],"sources":[{"title":"Terrance DeVries, Graham W. Taylor \"Improved Regularization of Convolutional Neural Networks with Cutout\" (arXiv:1708.04552)","url":"https://arxiv.org/abs/1708.04552"},{"title":"Zhun Zhong ほか \"Random Erasing Data Augmentation\" (arXiv:1708.04896)","url":"https://arxiv.org/abs/1708.04896"},{"title":"Ekin D. Cubuk ほか \"RandAugment: Practical automated data augmentation with a reduced search space\" (arXiv:1909.13719)","url":"https://arxiv.org/abs/1909.13719"},{"title":"Jason Wei, Kai Zou \"EDA: Easy Data Augmentation Techniques for Boosting Performance on Text Classification Tasks\" (arXiv:1901.11196)","url":"https://arxiv.org/abs/1901.11196"}]},{"id":"W-229","term":"Rotate","aliases":["回転"],"category":5,"short":"画像を回転させる、データ拡張の基本的な方法。","body":"少し傾いて写った物でも認識できるように、学習画像を回転させたものを加えます。\nRandAugmentなどの自動のデータ拡張でも、変換の候補の一つになっています。","related":["W-228","W-238"],"sources":[{"title":"Ekin D. Cubuk ほか \"RandAugment: Practical automated data augmentation with a reduced search space\" (arXiv:1909.13719)","url":"https://arxiv.org/abs/1909.13719"}]},{"id":"W-230","term":"Random Flip","aliases":["反転","フリップ"],"category":5,"short":"画像をランダムに左右（または上下）に反転させる、データ拡張の基本的な方法。","body":"左向きの物と右向きの物を、同じように認識できるようにします。\nRandom Erasingなど、ほかのデータ拡張と組み合わせてよく使われます。","related":["W-228","W-235"],"sources":[{"title":"Terrance DeVries, Graham W. Taylor \"Improved Regularization of Convolutional Neural Networks with Cutout\" (arXiv:1708.04552)","url":"https://arxiv.org/abs/1708.04552"},{"title":"Zhun Zhong ほか \"Random Erasing Data Augmentation\" (arXiv:1708.04896)","url":"https://arxiv.org/abs/1708.04896"}]},{"id":"W-231","term":"Crop","aliases":["切り抜き","クロップ"],"category":5,"short":"画像の一部を切り抜いて使う、データ拡張の基本的な方法。","body":"画像のいろいろな部分をランダムに切り抜くことで、写っている物の位置や大きさの違いに強くします。\nRandom Erasingなど、ほかのデータ拡張と組み合わせてよく使われます。","related":["W-228","W-235"],"sources":[{"title":"Terrance DeVries, Graham W. Taylor \"Improved Regularization of Convolutional Neural Networks with Cutout\" (arXiv:1708.04552)","url":"https://arxiv.org/abs/1708.04552"},{"title":"Zhun Zhong ほか \"Random Erasing Data Augmentation\" (arXiv:1708.04896)","url":"https://arxiv.org/abs/1708.04896"}]},{"id":"W-232","term":"Brightness","aliases":["明るさの変更"],"category":5,"short":"画像の明るさを変える、データ拡張の基本的な方法。","body":"明るい場所で撮った写真と暗い場所で撮った写真を、同じように認識できるようにします。\nRandAugmentなどの自動のデータ拡張でも、変換の候補の一つになっています。","related":["W-233","W-228","W-238"],"sources":[{"title":"Ekin D. Cubuk ほか \"RandAugment: Practical automated data augmentation with a reduced search space\" (arXiv:1909.13719)","url":"https://arxiv.org/abs/1909.13719"}]},{"id":"W-233","term":"Contrast","aliases":["コントラストの変更"],"category":5,"short":"画像の明るい部分と暗い部分の差（コントラスト）を変える、データ拡張の基本的な方法。","body":"くっきりした画像やぼんやりした画像など、写り方の違いに強くします。\nRandAugmentなどの自動のデータ拡張でも、変換の候補の一つになっています。","related":["W-232","W-228","W-238"],"sources":[{"title":"Ekin D. Cubuk ほか \"RandAugment: Practical automated data augmentation with a reduced search space\" (arXiv:1909.13719)","url":"https://arxiv.org/abs/1909.13719"}]},{"id":"W-234","term":"Cutout","aliases":["カットアウト"],"category":5,"short":"学習画像の一部の正方形の領域をランダムに隠して学習させる、データ拡張の方法。","body":"物の一部が隠れた画像でも学習させることで、隠れ（遮蔽）に強くなり、過学習も抑えられます。","related":["W-235","W-237","W-228","W-106"],"sources":[{"title":"Terrance DeVries, Graham W. Taylor \"Improved Regularization of Convolutional Neural Networks with Cutout\" (arXiv:1708.04552)","url":"https://arxiv.org/abs/1708.04552"},{"title":"Zhun Zhong ほか \"Random Erasing Data Augmentation\" (arXiv:1708.04896)","url":"https://arxiv.org/abs/1708.04896"}]},{"id":"W-235","term":"Random Erasing","aliases":["ランダムイレージング"],"category":5,"short":"学習画像の長方形の領域をランダムに選び、ランダムな値で塗りつぶす、データ拡張の方法。","body":"Cutoutと同じく、物の一部が隠れた画像でも認識できるようにします。\n切り抜き（Crop）や左右反転（Random Flip）など、ほかのデータ拡張と組み合わせて使えます。","related":["W-234","W-231","W-230","W-228"],"sources":[{"title":"Terrance DeVries, Graham W. Taylor \"Improved Regularization of Convolutional Neural Networks with Cutout\" (arXiv:1708.04552)","url":"https://arxiv.org/abs/1708.04552"},{"title":"Zhun Zhong ほか \"Random Erasing Data Augmentation\" (arXiv:1708.04896)","url":"https://arxiv.org/abs/1708.04896"}]},{"id":"W-236","term":"Mixup","aliases":["ミックスアップ"],"category":5,"short":"2枚の学習画像とそのラベルを、同じ割合で混ぜ合わせて新しい学習データを作る方法。","body":"画像全体を重ね合わせ、ラベルも同じ割合で混ぜます。\n学習データの間でも、なめらかな予測をするようになる効果があります。","example":"犬の画像を70％、猫の画像を30％の割合で重ね、ラベルも「犬0.7、猫0.3」にします。","related":["W-237","W-228"],"sources":[{"title":"Hongyi Zhang ほか \"mixup: Beyond Empirical Risk Minimization\" (arXiv:1710.09412)","url":"https://arxiv.org/abs/1710.09412"},{"title":"Sangdoo Yun ほか \"CutMix: Regularization Strategy to Train Strong Classifiers with Localizable Features\" (arXiv:1905.04899)","url":"https://arxiv.org/abs/1905.04899"}]},{"id":"W-237","term":"CutMix","aliases":["カットミックス"],"category":5,"short":"ある画像の一部を切り取って別の画像に貼り付け、ラベルも貼り付けた面積の割合で混ぜる方法。","body":"Cutoutのように一部を塗りつぶすのではなく、別の画像で埋めるので、画素の情報を捨てずに使えるのが利点です。","example":"犬の画像の4分の1を猫の画像で置き換えたら、ラベルを「犬0.75、猫0.25」にします。","related":["W-236","W-234","W-228"],"sources":[{"title":"Hongyi Zhang ほか \"mixup: Beyond Empirical Risk Minimization\" (arXiv:1710.09412)","url":"https://arxiv.org/abs/1710.09412"},{"title":"Sangdoo Yun ほか \"CutMix: Regularization Strategy to Train Strong Classifiers with Localizable Features\" (arXiv:1905.04899)","url":"https://arxiv.org/abs/1905.04899"}]},{"id":"W-238","term":"RandAugment","aliases":["ランドオーグメント","RandAugument"],"category":5,"short":"回転や明るさなどの変換の候補から毎回ランダムに選んで使う、設定の少ない自動のデータ拡張の方法。","body":"以前の自動のデータ拡張は、どの変換をどの強さで使うかを、別の段階で長い時間をかけて探す必要がありました。\nRandAugmentは、変換を毎回ランダムに選び、設定を「使う変換の数」と「変換の強さ」の2つ程度に絞りました。\nそのため、別の探索の段階なしに、目的の課題で直接調整できます。","related":["W-228","W-229","W-232","W-233"],"sources":[{"title":"Ekin D. Cubuk ほか \"RandAugment: Practical automated data augmentation with a reduced search space\" (arXiv:1909.13719)","url":"https://arxiv.org/abs/1909.13719"}]},{"id":"W-239","term":"noising","aliases":["ノイジング"],"category":5,"short":"文章の単語に手を加えてノイズを入れ、学習データを増やす、文章のデータ拡張の考え方。","body":"単語をランダムに入れ替えたり、消したり、差し込んだりして、少しだけ違う文を作ります。\n意味が大きく変わらない程度にとどめることが大切です。","example":"「今日はとても良い天気だ」から「とても」を消して「今日は良い天気だ」にするのが一例です。","related":["W-240","W-228"],"sources":[{"title":"Jason Wei, Kai Zou \"EDA: Easy Data Augmentation Techniques for Boosting Performance on Text Classification Tasks\" (arXiv:1901.11196)","url":"https://arxiv.org/abs/1901.11196"}]},{"id":"W-240","term":"paraphrasing","aliases":["パラフレーズ","言い換え"],"category":5,"short":"同じ意味の別の言い方に言い換えて、学習データを増やす、文章のデータ拡張の考え方。","body":"単語を同じ意味の言葉（同義語）に置き換えたり、文を別の言語に訳してから元の言語に戻したり（逆翻訳）して作ります。\n元の文と意味がほぼ同じで、表現だけが違う文を作るのがポイントです。","example":"「この映画は面白い」を「この映画は楽しい」に言い換えるのが一例です。","related":["W-239","W-228"],"sources":[{"title":"Jason Wei, Kai Zou \"EDA: Easy Data Augmentation Techniques for Boosting Performance on Text Classification Tasks\" (arXiv:1901.11196)","url":"https://arxiv.org/abs/1901.11196"}]},{"id":"W-241","term":"物体識別","aliases":["画像分類"],"category":6,"short":"画像に写っている物が何かを、クラス（種類）として答える画像認識の課題。","body":"画像全体を見て、「犬」「猫」のように、写っている物の種類を答えます。\n画像分類とも呼ばれます。物がどこに写っているか（位置）は求めません。","related":["W-242","W-243","W-052"],"sources":[{"title":"Alexander Kirillov ほか \"Panoptic Segmentation\" (arXiv:1801.00868)","url":"https://arxiv.org/abs/1801.00868"},{"title":"Shaoqing Ren ほか \"Faster R-CNN\" (arXiv:1506.01497)","url":"https://arxiv.org/abs/1506.01497"},{"title":"Kaiming He ほか \"Mask R-CNN\" (arXiv:1703.06870)","url":"https://arxiv.org/abs/1703.06870"}]},{"id":
