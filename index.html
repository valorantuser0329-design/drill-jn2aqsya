}

function activeQuestions(questions) {
  return questions.filter((q) => q.status === 'active');
}

function indexQuestions(questions) {
  return new Map(questions.map((q) => [q.id, q]));
}

// 有効な問題だけを探す。廃止された問題や存在しない番号は null。
function findActive(questionMap, id) {
  const q = questionMap.get(id);
  return q && q.status === 'active' ? q : null;
}

// ---- src/lib/storage.js ----
// ブラウザ内の保存。localStorage が使えないときや、途中で失敗したときはメモリだけで続ける。

const SCHEMA_VERSION = 1;
const STORAGE_KEYS = {
  meta: 'gkmd:meta',
  records: 'gkmd:records',
  bookmarks: 'gkmd:bookmarks',
  exam: 'gkmd:exam',
  lastExam: 'gkmd:lastExam',
  daily: 'gkmd:daily',
  wordViews: 'gkmd:wordViews',
  wordBookmarks: 'gkmd:wordBookmarks',
  wordLast: 'gkmd:wordLast',
  ui: 'gkmd:ui',
};

function isPlainObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function isRecordEntry(r) {
  return isPlainObject(r) && Number.isInteger(r.c) && Number.isInteger(r.w) && (r.last === 'c' || r.last === 'w');
}

// 各データの初期値と、読み込んだ値の形の確かめ方。
const STORED_SHAPES = {
  records: {
    initial: () => ({}),
    valid: (v) => isPlainObject(v) && Object.values(v).every(isRecordEntry),
  },
  bookmarks: {
    initial: () => [],
    valid: (v) => Array.isArray(v) && v.every((id) => typeof id === 'string'),
  },
  exam: {
    initial: () => null,
    valid: (v) => v === null || (isPlainObject(v) && Number.isFinite(v.startedAt) && Number.isFinite(v.durationMs) && Array.isArray(v.items)),
  },
  lastExam: {
    initial: () => null,
    valid: (v) => v === null || (isPlainObject(v) && Number.isFinite(v.score) && Number.isFinite(v.total)),
  },
  daily: {
    initial: () => null,
    valid: (v) => v === null || (isPlainObject(v) && typeof v.date === 'string' && typeof v.id === 'string'),
  },
  // 単語集（詳細設計書 3.1、版数1.4・1.6）
  // 用語を見た回数 { 用語番号: 回数 }（版数1.6。「覚えた」の印の代わり）
  wordViews: {
    initial: () => ({}),
    valid: (v) => isPlainObject(v) && Object.values(v).every((n) => Number.isInteger(n) && n >= 0),
  },
  wordBookmarks: {
    initial: () => [],
    valid: (v) => Array.isArray(v) && v.every((id) => typeof id === 'string'),
  },
  wordLast: {
    initial: () => null,
    valid: (v) => v === null || typeof v === 'string',
  },
  // 画面の設定（詳細設計書 11.8）。書き出しとリセットの対象外。
  ui: {
    initial: () => ({}),
    valid: (v) => isPlainObject(v) && Object.values(v).every((x) => typeof x === 'boolean'),
  },
};

// 記録の書き出し・読み込みの対象（詳細設計書 11.5）。画面の設定（ui）と meta は含めない。
const TRANSFER_NAMES = ['records', 'bookmarks', 'exam', 'lastExam', 'daily', 'wordViews', 'wordBookmarks', 'wordLast'];

function isValidStored(name, value) {
  return Object.prototype.hasOwnProperty.call(STORED_SHAPES, name) && STORED_SHAPES[name].valid(value);
}

const STORED_NAMES = Object.keys(STORED_SHAPES);

// 保存形式の変換。schema 1 が最初の形式なので、今は変換がない。
// 形式を変えるときは、ここに「fromVersion が n なら n+1 の形に直す」処理を順に足す。
function migrate(values, fromVersion) {
  if (fromVersion >= SCHEMA_VERSION) return values;
  return values;
}

function probeStorage(backend) {
  if (!backend) return false;
  try {
    backend.setItem('gkmd:probe', '1');
    backend.removeItem('gkmd:probe');
    return true;
  } catch (e) {
    return false;
  }
}

function defaultBackend() {
  try {
    return globalThis.localStorage || null;
  } catch (e) {
    return null;
  }
}

function readSchema(backend) {
  try {
    const meta = JSON.parse(backend.getItem(STORAGE_KEYS.meta) || 'null');
    return isPlainObject(meta) && Number.isInteger(meta.schema) ? meta.schema : SCHEMA_VERSION;
  } catch (e) {
    return SCHEMA_VERSION;
  }
}

// backend は localStorage と同じ形（getItem、setItem、removeItem）。null ならメモリだけで動く。
function createStorage(backend) {
  let available = probeStorage(backend);
  const brokenNames = [];
  let values = {};

  for (const name of STORED_NAMES) {
    const shape = STORED_SHAPES[name];
    values[name] = shape.initial();
    if (!available) continue;
    let raw = null;
    try {
      raw = backend.getItem(STORAGE_KEYS[name]);
    } catch (e) {
      available = false;
      continue;
    }
    if (raw === null) continue;
    try {
      const parsed = JSON.parse(raw);
      if (shape.valid(parsed)) values[name] = parsed;
      else brokenNames.push(name);
    } catch (e) {
      brokenNames.push(name);
    }
  }
  if (available) values = migrate(values, readSchema(backend));

  function persist(key, text) {
    if (!available) return;
    try {
      if (text === null) backend.removeItem(key);
      else backend.setItem(key, text);
    } catch (e) {
      available = false;
    }
  }

  function write(name, value) {
    values[name] = value;
    persist(STORAGE_KEYS[name], value === null ? null : JSON.stringify(value));
  }

  persist(STORAGE_KEYS.meta, JSON.stringify({ schema: SCHEMA_VERSION }));
  for (const name of brokenNames) persist(STORAGE_KEYS[name], null);

  return {
    get available() {
      return available;
    },
    brokenNames,
    read(name) {
      return values[name];
    },
    write,
    // 学習記録、ブックマーク、前回の模擬試験の結果、今日の1問、単語集の印を消す（要件 F11）。受験中の試験は残す。
    resetLearning() {
      for (const name of ['records', 'bookmarks', 'lastExam', 'daily', 'wordViews', 'wordBookmarks', 'wordLast']) write(name, STORED_SHAPES[name].initial());
    },
    // 他のタブで変わった値（storage イベント）を取り込む。取り込んだデータの名前を返し、関係ないキーや壊れた値なら null。
    applyExternalChange(key, newValue) {
      const name = STORED_NAMES.find((n) => STORAGE_KEYS[n] === key);
      if (!name) return null;
      try {
        const parsed = newValue === null ? STORED_SHAPES[name].initial() : JSON.parse(newValue);
        if (!STORED_SHAPES[name].valid(parsed)) return null;
        values[name] = parsed;
        return name;
      } catch (e) {
        return null;
      }
    },
  };
}

// ---- src/lib/random.js ----
// 乱数とシャッフル。乱数は引数で受け取り、テストで固定できるようにする。

function shuffle(array, rng = Math.random) {
  const result = array.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

// FNV-1a（32ビット）。文字列を UTF-16 のコード単位ごとに処理する。
function fnv1a(text) {
  let hash = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash >>> 0;
}

// 種から決まる乱数（mulberry32）。0以上1未満の数を返す関数を返す。
function seededRng(seed) {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffledOrder(rng = Math.random) {
  return shuffle([0, 1, 2, 3], rng);
}

// ---- src/lib/records.js ----
// 学習記録。records は { 問題番号: { c, w, last, at } } の形。

function applyAnswer(records, id, correct, now = Date.now()) {
  const prev = records[id] || { c: 0, w: 0 };
  const next = {
    c: prev.c + (correct ? 1 : 0),
    w: prev.w + (correct ? 0 : 1),
    last: correct ? 'c' : 'w',
    at: now,
  };
  return { ...records, [id]: next };
}

function emptyTally() {
  return { total: 0, answered: 0, correctNow: 0, rate: null };
}

function finishTally(tally) {
  tally.rate = tally.answered > 0 ? tally.correctNow / tally.answered : null;
  return tally;
}

// 有効な問題だけを対象に集計する。rate は解答済みが0なら null。
function summarize(records, questions) {
  const overall = emptyTally();
  const byCategory = {};
  for (const q of questions) {
    if (q.status !== 'active') continue;
    const cat = byCategory[q.category] || (byCategory[q.category] = emptyTally());
    overall.total++;
    cat.total++;
    const r = records[q.id];
    if (!r) continue;
    overall.answered++;
    cat.answered++;
    if (r.last === 'c') {
      overall.correctNow++;
      cat.correctNow++;
    }
  }
  finishTally(overall);
  for (const key of Object.keys(byCategory)) finishTally(byCategory[key]);
  return { ...overall, byCategory };
}

function reviewIds(records, questions) {
  return questions
    .filter((q) => q.status === 'active' && records[q.id] && records[q.id].last === 'w')
    .map((q) => q.id);
}

function activeBookmarks(bookmarks, questions) {
  const active = new Set(questions.filter((q) => q.status === 'active').map((q) => q.id));
  return bookmarks.filter((id) => active.has(id));
}

function toggleBookmark(bookmarks, id) {
  return bookmarks.includes(id) ? bookmarks.filter((b) => b !== id) : [...bookmarks, id];
}

// ---- src/lib/practice.js ----
// 練習の出題リスト。各項目は { id, order }。order は画面の上から順に並べた元の選択肢の位置。

const PRACTICE_MODES = ['category', 'random', 'review', 'bookmark', 'retry'];

// モードごとの出題対象の問題番号。
function practiceTargets(mode, ctx) {
  const active = ctx.questions.filter((q) => q.status === 'active');
  switch (mode) {
    case 'category':
      return active.filter((q) => q.category === ctx.categoryId).map((q) => q.id);
    case 'random':
      return active.map((q) => q.id);
    case 'review':
      return reviewIds(ctx.records, ctx.questions);
    case 'bookmark':
      return activeBookmarks(ctx.bookmarks, ctx.questions);
    case 'retry': {
      const activeIds = new Set(active.map((q) => q.id));
      return (ctx.retryIds || []).filter((id) => activeIds.has(id));
    }
    default:
      throw new Error(`unknown practice mode: ${mode}`);
  }
}

function buildPractice(mode, ctx, rng = Math.random) {
  let ids = shuffle(practiceTargets(mode, ctx), rng);
  if (mode === 'random') ids = ids.slice(0, ctx.randomCount);
  return ids.map((id) => ({ id, order: shuffledOrder(rng) }));
}

// choice は元の選択肢の位置。
function isCorrect(question, choice) {
  return choice === question.answer;
}

// ---- src/lib/exam.js ----
// 模擬試験。配分、問題の選択、残り時間、採点。

// 最大剰余法で total 問を分野に割り振る。available は { 分野番号: 有効な問題数 }。
// 割り当てが有効な問題数を超える分野は上限で止め、不足数を shortfall として返す。
function allocate(categories, available, total) {
  const quotaSum = categories.reduce((sum, c) => sum + c.quota, 0);
  const rows = categories.map((c) => {
    const exact = (c.quota * total) / quotaSum;
    return { id: c.id, count: Math.floor(exact), frac: exact - Math.floor(exact) };
  });
  let rest = total - rows.reduce((sum, r) => sum + r.count, 0);
  const byFrac = rows.slice().sort((a, b) => b.frac - a.frac || a.id - b.id);
  for (let i = 0; rest > 0; i = (i + 1) % byFrac.length, rest--) byFrac[i].count++;
  const counts = {};
  let shortfall = 0;
  for (const r of rows) {
    const cap = available[r.id] || 0;
    counts[r.id] = Math.min(r.count, cap);
    shortfall += r.count - counts[r.id];
  }
  return { counts, shortfall };
}

// 有効な問題が既定の問題数に満たないときの、問題数と制限時間。時間は分に切り上げる。
function examSize(activeCount, config) {
  const { questionCount, minutes } = config.exam;
  if (activeCount >= questionCount) return { count: questionCount, minutes };
  return { count: activeCount, minutes: Math.ceil((minutes * activeCount) / questionCount) };
}

function createExam({ questions, categories, config, now = Date.now(), rng = Math.random }) {
  const active = questions.filter((q) => q.status === 'active');
  const { count, minutes } = examSize(active.length, config);
  const available = {};
  for (const q of active) available[q.category] = (available[q.category] || 0) + 1;
  const { counts, shortfall } = allocate(categories, available, count);

  const chosen = [];
  const leftover = [];
  for (const c of categories) {
    const pool = shuffle(active.filter((q) => q.category === c.id), rng);
    chosen.push(...pool.slice(0, counts[c.id]));
    leftover.push(...pool.slice(counts[c.id]));
  }
  chosen.push(...shuffle(leftover, rng).slice(0, shortfall));

  return {
    startedAt: now,
    durationMs: minutes * 60 * 1000,
    version: config.version,
    current: 0,
    items: shuffle(chosen, rng).map((q) => ({ id: q.id, order: shuffledOrder(rng), choice: null, flag: false })),
  };
}

function remainingMs(exam, now = Date.now()) {
  return Math.max(0, exam.startedAt + exam.durationMs - now);
}

function unansweredCount(exam) {
  return exam.items.filter((item) => item.choice === null).length;
}

// reason は 'submit' か 'timeout'。現在のデータで廃止・削除された問題は除外して採点する。
function finishExam(exam, questionMap, reason, now = Date.now()) {
  const deadline = exam.startedAt + exam.durationMs;
  const finishedAt = reason === 'timeout' ? deadline : Math.min(now, deadline);
  const items = [];
  const byCategory = {};
  let excluded = 0;
  let score = 0;
  let unanswered = 0;
  for (const item of exam.items) {
    const q = questionMap.get(item.id);
    if (!q || q.status !== 'active') {
      excluded++;
      continue;
    }
    const correct = item.choice !== null && isCorrect(q, item.choice);
    if (correct) score++;
    if (item.choice === null) unanswered++;
    const cat = byCategory[q.category] || (byCategory[q.category] = { correct: 0, total: 0 });
    cat.total++;
    if (correct) cat.correct++;
    items.push({ id: item.id, order: item.order, choice: item.choice, flag: item.flag, correct });
  }
  return {
    reason,
    startedAt: exam.startedAt,
    finishedAt,
    elapsedMs: finishedAt - exam.startedAt,
    score,
    total: items.length,
    excluded,
    unanswered,
    byCategory,
    items,
  };
}

// ---- src/ui/dom.js ----
// 要素を作る補助関数。文章は必ず textContent で入れ、HTML として解釈させない。

// h('button', { class: 'btn', on: { click: fn }, attrs: { 'aria-label': '…' } }, '文字', 子要素, …)
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'text') el.textContent = value;
    else if (key === 'on') for (const [type, fn] of Object.entries(value)) el.addEventListener(type, fn);
    else if (key === 'attrs') for (const [name, v] of Object.entries(value)) {
      if (v !== undefined && v !== null && v !== false) el.setAttribute(name, v === true ? '' : String(v));
    }
    else if (key === 'hidden' || key === 'disabled') el[key] = Boolean(value);
    else el[key] = value;
  }
  appendChildren(el, children);
  return el;
}

function appendChildren(el, children) {
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

// 改行（\n）を含む文章を、段落の中の改行として表示する。
function multiline(text) {
  const parts = String(text).split('\n');
  const out = [];
  parts.forEach((part, i) => {
    if (i > 0) out.push(document.createElement('br'));
    out.push(document.createTextNode(part));
  });
  return out;
}

function percent(rate) {
  return rate === null || rate === undefined ? '－' : `${Math.round(rate * 100)}%`;
}

// 外部サイトへのリンク。Artifact の中では新しいタブで開く。
function externalLink(href, text, className) {
  return h('a', { class: className, href, target: '_blank', rel: 'noopener noreferrer', text });
}

// 押すと文字を選択するだけの入力欄に内容を出す（クリップボードが使えないとき用）。
function selectText(el) {
  el.focus();
  if (typeof el.select === 'function') el.select();
}

// クリップボードにコピーする。成功したら true。ボタンを押した処理の中で呼ぶ。
async function copyToClipboard(text) {
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) return false;
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false;
  }
}

// ---- src/lib/glossary.js ----
// 単語集の検索と絞り込み、進み具合、前後の用語、問題への用語のつなぎ付け（詳細設計書 5.7）。

// 全角・半角、大文字・小文字の違いをなくし、空白を取り除く。
function normalize(text) {
  return String(text || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
}

function indexTerms(terms) {
  return new Map(terms.map((t) => [t.id, t]));
}

function matchesQuery(term, q) {
  if (q === '') return true;
  if (normalize(term.term).includes(q)) return true;
  if ((term.aliases || []).some((a) => normalize(a).includes(q))) return true;
  return normalize(term.short).includes(q);
}

// category が 0 ならすべての分野。並び順は分野の番号順、同じ分野の中では用語番号順。
// viewed は一度でも見た用語番号の配列（viewedIds の結果）。
function filterTerms(terms, { category = 0, query = '', onlyUnviewed = false, onlyBookmarked = false } = {}, viewed = [], bookmarks = []) {
  const q = normalize(query);
  const viewedSet = new Set(viewed);
  const bookmarkSet = new Set(bookmarks);
  return terms
    .filter((t) => (category === 0 || t.category === category)
      && matchesQuery(t, q)
      && (!onlyUnviewed || !viewedSet.has(t.id))
      && (!onlyBookmarked || bookmarkSet.has(t.id)))
    .sort((a, b) => a.category - b.category || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
}

// { total, viewed, byCategory: { 分野番号: { total, viewed } } }。存在しない用語番号は数えない。
function progress(terms, viewed) {
  const viewedSet = new Set(viewed);
  const byCategory = {};
  let count = 0;
  for (const t of terms) {
    const c = byCategory[t.category] || (byCategory[t.category] = { total: 0, viewed: 0 });
    c.total++;
    if (viewedSet.has(t.id)) {
      c.viewed++;
      count++;
    }
  }
  return { total: terms.length, viewed: count, byCategory };
}

// 見た回数（{ 用語番号: 回数 }）。addView は元のオブジェクトを変えずに1回足す。
function addView(views, id) {
  return { ...views, [id]: (views[id] || 0) + 1 };
}

function viewedIds(views) {
  return Object.keys(views).filter((id) => views[id] > 0);
}

// 絞り込んだ一覧（用語番号の配列）の中での前と次。端では null。
function neighbors(ids, id) {
  const i = ids.indexOf(id);
  if (i < 0) return { prev: null, next: null };
  return { prev: i > 0 ? ids[i - 1] : null, next: i < ids.length - 1 ? ids[i + 1] : null };
}

function toggleId(list, id) {
  return list.includes(id) ? list.filter((x) => x !== id) : [...list, id];
}

// 問題ごとに、問題文・選択肢・解説に出てくる用語を探す（ビルドで使う）。
// 長い言葉を先に探し、すでに見つかった範囲に重なる短い言葉は数えない。出てくる順に最大 max 語。
// カタカナ語や英数字の語の途中で一致したものは除く（「ミンスキー」の中の「キー」、「OpenAI」の中の「AI」など。「ILSVRC2014」のような英字と数字の境目は区切りとみなす）
const KANA = /[ァ-ヶ]/;
const KANA_OR_BAR = /[ァ-ヶー]/;
const ALPHA = /[a-z]/;
const DIGIT = /[0-9]/;

function atWordEdge(text, at, len) {
  const first = text[at];
  const last = text[at + len - 1];
  const before = text[at - 1] || '';
  const after = text[at + len] || '';
  if (KANA.test(first) && KANA_OR_BAR.test(before)) return false;
  if (KANA_OR_BAR.test(last) && KANA.test(after)) return false;
  for (const kind of [ALPHA, DIGIT]) {
    if (kind.test(first) && kind.test(before)) return false;
    if (kind.test(last) && kind.test(after)) return false;
  }
  return true;
}

function linkTerms(questions, terms, max = 6) {
  const words = [];
  for (const t of terms) {
    if (t.autoLink === false) continue;
    for (const w of [t.term, ...(t.aliases || [])]) {
      const n = normalize(w);
      if (n.length >= 2) words.push({ id: t.id, word: n });
    }
  }
  words.sort((a, b) => b.word.length - a.word.length);

  const result = {};
  for (const q of questions) {
    const text = normalize([q.question, ...(q.choices || []), q.explanation].join('\n'));
    const used = new Array(text.length).fill(false);
    const found = new Map(); // 用語番号 → 最初の位置
    for (const { id, word } of words) {
      let from = 0;
      for (;;) {
        const at = text.indexOf(word, from);
        if (at < 0) break;
        from = at + 1;
        if (!atWordEdge(text, at, word.length)) continue;
        let overlap = false;
        for (let k = at; k < at + word.length; k++) if (used[k]) { overlap = true; break; }
        if (overlap) continue;
        for (let k = at; k < at + word.length; k++) used[k] = true;
        if (!found.has(id) || found.get(id) > at) found.set(id, at);
      }
    }
    const ids = [...found.entries()].sort((a, b) => a[1] - b[1]).map(([id]) => id).slice(0, max);
    if (ids.length > 0) result[q.id] = ids;
  }
  return result;
}

// ---- src/lib/report.js ----
// 誤り報告。Googleフォームの事前入力URLと、コピー用の報告文。

const REPORT_TYPES = [
  '正解が違う',
  '解説が違う・不十分',
  '問題文や選択肢がわかりにくい',
  'アプリへの要望・感想',
  'その他',
];

const FEEDBACK_TYPE = 'アプリへの要望・感想';
const NO_QUESTION = 'なし';

function hasText(value) {
  return typeof value === 'string' && value.trim() !== '';
}

// form が null（未設定）のときは null を返す。
function buildFormUrl(form, { questionId, version, type, comment }) {
  if (!form) return null;
  const params = [
    ['usp', 'pp_url'],
    [form.entries.questionId, questionId],
    [form.entries.version, version],
    [form.entries.type, type],
  ];
  if (hasText(comment)) params.push([form.entries.comment, comment]);
  const query = params.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
  return `${form.url}?${query}`;
}

function buildReportText({ questionId, version, type, comment }) {
  return [
    '【G検定マークドリル 報告】',
    `問題番号: ${questionId}`,
    `バージョン: ${version}`,
    `報告の種類: ${type}`,
    `コメント: ${hasText(comment) ? comment : 'なし'}`,
  ].join('\n');
}

// ---- src/ui/dialogs.js ----
// ダイアログ（D01〜D04）。ブラウザ標準の confirm は Artifact では出ないため、すべて画面内に作る。

// <dialog> で開く。Esc で閉じ、閉じたら開く前の要素にフォーカスを戻す。
function openDialog(app, { title, content = [], actions = [], initialFocus = null, labelId = 'dialog-title' }) {
  const opener = document.activeElement;
  const closeButton = h('button', { class: 'dialog-x', type: 'button', attrs: { 'aria-label': '閉じる' }, text: '×' });
  const dialog = h('dialog', { class: 'dialog', attrs: { 'aria-labelledby': labelId } },
    h('div', { class: 'dialog-head' }, h('h2', { id: labelId, text: title }), closeButton),
    h('div', { class: 'dialog-body' }, content),
    actions.length > 0 ? h('div', { class: 'dialog-actions' }, actions) : null,
  );
  const close = () => {
    if (dialog.open && typeof dialog.close === 'function') dialog.close();
    else dialog.dispatchEvent(new Event('close'));
  };
  closeButton.addEventListener('click', close);
  dialog.addEventListener('close', () => {
    dialog.remove();
    app.dialogOpen = false;
    if (opener && typeof opener.focus === 'function' && document.contains(opener)) opener.focus();
  });
  document.body.append(dialog);
  app.dialogOpen = true;
  if (typeof dialog.showModal === 'function') dialog.showModal();
  else dialog.setAttribute('open', '');
  (initialFocus || closeButton).focus();
  return { dialog, close };
}

// D04 確認ダイアログ。初期のフォーカスは「やめる」に置く。
function confirmDialog(app, { title, message, confirmLabel, danger = false, onConfirm }) {
  const cancel = h('button', { class: 'btn btn-sub', type: 'button', text: 'やめる' });
  const ok = h('button', { class: danger ? 'btn btn-danger' : 'btn', type: 'button', text: confirmLabel });
  const d = openDialog(app, { title, content: [h('p', {}, multiline(message))], actions: [cancel, ok], initialFocus: cancel, labelId: 'confirm-title' });
  cancel.addEventListener('click', d.close);
  ok.addEventListener('click', () => {
    d.close();
    onConfirm();
  });
  return d;
}

// D01 報告ダイアログ。questionId が null なら「要望・感想」として開く。
function reportDialog(app, { questionId = null } = {}) {
  const feedback = questionId === null;
  const version = app.config.version;
  const shownId = feedback ? NO_QUESTION : questionId;
  const types = feedback ? [FEEDBACK_TYPE] : REPORT_TYPES.filter((t) => t !== FEEDBACK_TYPE);
  let type = feedback ? FEEDBACK_TYPE : null;

  const radios = types.map((t, i) => {
    const id = `report-type-${i}`;
    const input = h('input', { type: 'radio', name: 'report-type', id, value: t, checked: t === type });
    input.addEventListener('change', () => {
      type = t;
      update();
    });
    return h('div', { class: 'radio' }, input, h('label', { attrs: { for: id }, text: t }));
  });
  const comment = h('textarea', { id: 'report-comment', rows: 3, maxLength: 1000 });
  comment.addEventListener('input', () => update());
  const copyArea = h('textarea', { id: 'report-copy', class: 'copy-area', readOnly: true, rows: 5, hidden: true, attrs: { 'aria-label': '報告内容' } });
  const status = h('p', { class: 'form-status', attrs: { 'aria-live': 'polite' } });

  const copyButton = h('button', { class: 'btn btn-sub', type: 'button', text: '報告内容をコピー' });
  const formLink = app.config.form ? externalLink('#', 'Googleフォームを開く ↗', 'btn') : null;
  const fields = () => ({ questionId: shownId, version, type: type || '', comment: comment.value });

  function update() {
    const ready = type !== null;
    copyButton.disabled = !ready;
    if (formLink) {
      if (ready) {
        formLink.href = buildFormUrl(app.config.form, fields());
        formLink.removeAttribute('aria-disabled');
      } else {
        formLink.removeAttribute('href');
        formLink.setAttribute('aria-disabled', 'true');
      }
    }
    status.textContent = ready ? '' : '報告の種類を選んでください。';
  }

  copyButton.addEventListener('click', async () => {
    const text = buildReportText(fields());
    if (await copyToClipboard(text)) {
      copyArea.hidden = true;
      status.textContent = 'コピーしました。';
    } else {
      copyArea.value = text;
      copyArea.hidden = false;
      selectText(copyArea);
      status.textContent = '自動でコピーできませんでした。選択された文字をコピーしてください。';
    }
  });

  const content = [
    h('p', { class: 'dialog-meta num', text: `${feedback ? 'アプリへの要望・感想' : `問題 ${shownId}`}（${version}）` }),
    h('fieldset', { class: 'radios' }, h('legend', { text: '報告の種類' }), radios),
    h('label', { class: 'field-label', attrs: { for: 'report-comment' }, text: 'コメント（任意）' }),
    h('p', { class: 'note', attrs: { 'data-note': 'privacy' }, text: '名前やメールアドレスなど、個人を特定できる情報は書かないでください。' }),
    comment,
    copyArea,
    status,
    h('p', { class: 'note' }, app.config.form
      ? 'フォームが新しいタブで開きます。内容を確かめて「送信」を押すと報告が届きます。メールアドレスなどの個人情報は集めません。'
      : '報告フォームは準備中です。「報告内容をコピー」を使ってください。'),
  ];
  const d = openDialog(app, {
    title: feedback ? '要望・感想を送る' : 'この問題を報告',
    content,
    actions: [copyButton, formLink],
    initialFocus: feedback ? comment : null,
    labelId: 'report-title',
  });
  update();
  return d;
}

// ---- src/ui/glossary.js ----
// S07 単語集、S08 用語の説明、D05 用語の説明ダイアログ（詳細設計書 5.7、6.2、6.3。版数1.4・1.6）

const DEFAULT_GLOSSARY_FILTER = { category: 0, query: '', onlyUnviewed: false, onlyBookmarked: false };

function filteredIds(app) {
  return filterTerms(app.glossary, app.glossaryFilter, viewedIds(app.storage.read('wordViews')), app.storage.read('wordBookmarks')).map((t) => t.id);
}

// 用語を表示したときに、見た回数を1回足し、続きからの用語にする。足した後の回数を返す。
function recordView(app, id) {
  const views = addView(app.storage.read('wordViews'), id);
  app.storage.write('wordViews', views);
  app.storage.write('wordLast', id);
  return views[id];
}

function viewCountLine(count) {
  return h('p', { class: 'term-views muted num', attrs: { 'data-views': String(count) }, text: `この用語を見た回数: ${count}回` });
}

// 単語集の進み具合（全体と、その用語の分野）。S08 と D05 の上に出す（版数1.7）
function termProgressLine(app, term) {
  const p = progress(app.glossary, viewedIds(app.storage.read('wordViews')));
  const cp = p.byCategory[term.category] || { total: 0, viewed: 0 };
  return h('div', { class: 'progress-line term-progress', attrs: { 'data-progress': 'term' } },
    h('span', { class: 'num', text: `見た用語 ${p.viewed} / ${p.total}` }),
    h('span', { class: 'bar bar-wide', attrs: { 'aria-hidden': 'true' } }, h('span', { class: 'bar-fill', style: `width:${p.total ? Math.round((p.viewed / p.total) * 100) : 0}%` })),
    h('span', { class: 'num muted', text: `分野${String(term.category).padStart(2, '0')} ${cp.viewed} / ${cp.total}` }),
  );
}

// 「あとで見直す」のボタン。
function laterButton(app, id) {
  const button = h('button', { class: 'btn-flag', type: 'button', attrs: { 'data-mark': 'wordBookmarks' } });
  const paint = () => {
    const on = app.storage.read('wordBookmarks').includes(id);
    button.textContent = on ? '★ あとで見直す' : '☆ あとで見直す';
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
  };
  button.addEventListener('click', () => {
    app.storage.write('wordBookmarks', toggleId(app.storage.read('wordBookmarks'), id));
    paint();
  });
  paint();
  return button;
}

// 関連する用語をたどってきたときの「元の用語に戻る」ボタン。trail はたどってきた用語番号の並び。
function backButton(app, trail, onBack) {
  if (trail.length === 0) return null;
  const from = app.termMap.get(trail[trail.length - 1]);
  if (!from) return null;
  return h('button', { class: 'btn btn-sub btn-small term-back', type: 'button', attrs: { 'data-action': 'term-back' }, text: `← ${from.term}に戻る`, on: { click: onBack } });
}

// 用語の説明の本文（S08 と D05 で共用）。onRelated(id) で関連する用語へ移る。
function termContent(app, term, { onRelated }) {
  const related = (term.related || []).map((id) => app.termMap.get(id)).filter(Boolean);
  return [
    h('p', { class: 'term-meta muted' },
      (term.aliases && term.aliases.length > 0) ? `${term.aliases.join('、')}　` : '',
      h('span', { class: 'num', text: `分野${String(term.category).padStart(2, '0')} ${app.categoryName(term.category)}` }),
    ),
    h('section', { class: 'term-block term-short' }, h('h3', { text: 'ひとことで' }), h('p', { text: term.short })),
    h('section', { class: 'term-block' }, h('h3', { text: 'くわしく' }), String(term.body).split('\n').map((line) => h('p', { text: line }))),
    term.example ? h('section', { class: 'term-block' }, h('h3', { text: 'たとえば' }), h('p', {}, multiline(term.example))) : null,
    term.timeSensitive ? h('p', { class: 'note num', text: `この用語の説明は ${app.config.asOf} 時点の情報に基づきます。` }) : null,
    related.length > 0 ? h('section', { class: 'term-block' },
      h('h3', { text: '関連する用語' }),
      h('div', { class: 'term-chips' }, related.map((r) => h('button', { class: 'chip', type: 'button', text: r.term, on: { click: () => onRelated(r.id) } }))),
    ) : null,
    h('div', { class: 'sources' },
      h('span', { class: 'sources-label', text: '出典' }),
      h('ul', {}, term.sources.map((s) => h('li', {}, externalLink(s.url, s.title)))),

  if (ids.length === 0) return null;
  return h('div', { class: 'q-terms' },
    h('span', { class: 'sources-label', text: 'この問題の用語' }),
    h('div', { class: 'term-chips' }, ids.map((id) => h('button', { class: 'chip', type: 'button', text: app.termMap.get(id).term, on: { click: () => termDialog(app, id) } }))),

// D05 用語の説明ダイアログ。関連する用語を押すと中身を切り替え、「〜に戻る」で元の用語に戻る。
function termDialog(app, id) {
  const trail = [];
  const backSlot = h('div', { class: 'term-back-slot' });
  const body = h('div', { class: 'term' });
  const actions = h('div', { class: 'row' });
  const title = h('span');
  const d = openDialog(app, { title: '', content: [backSlot, body], actions: [actions], labelId: 'term-dialog-title' });
  const heading = d.dialog.querySelector('#term-dialog-title');
  heading.replaceChildren(title);

  function show(termId) {
    const term = app.termMap.get(termId);
    if (!term) return;
    const count = recordView(app, term.id);
    title.textContent = term.term;
    const onRelated = (rid) => { trail.push(term.id); show(rid); };
    const onBack = () => show(trail.pop());
    backSlot.replaceChildren(...[backButton(app, trail, onBack)].filter(Boolean));
    body.replaceChildren(termProgressLine(app, term), viewCountLine(count), ...termContent(app, term, { onRelated }).filter(Boolean));
    actions.replaceChildren(laterButton(app, term.id));
    d.dialog.scrollTop = 0;
  }
  d.dialog.addEventListener('keydown', (event) => {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    const tag = event.target && event.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const key = event.key.toLowerCase();
    if (key === 'b') actions.querySelector('[data-mark="wordBookmarks"]').click();
    else if (event.key === 'Backspace' && trail.length > 0) { event.preventDefault(); show(trail.pop()); }
  });
  show(id);
  return d;
}

// S07 単語集
function renderGlossary(app) {
  const f = app.glossaryFilter;
  const views = app.storage.read('wordViews');
  const viewed = viewedIds(views);
  const bookmarks = app.storage.read('wordBookmarks');
  const p = progress(app.glossary, viewed);
  app.termTrail = [];
  const last = app.storage.read('wordLast');
  const lastTerm = last ? app.termMap.get(last) : null;

  const header = h('header', { class: 'top' },
    h('h1', { class: 'brand', text: '単語集' }),
    h('button', { class: 'btn btn-sub btn-small', type: 'button', text: 'ホームへ', on: { click: () => app.go('home') } }),
  );

  const summary = h('section', { class: 'intro' },
    h('p', { class: 'lead', text: 'G検定のシラバスに出てくる用語を、やさしい言葉で説明しています。用語を開くたびに、見た回数が記録されます。' }),
    h('div', { class: 'progress-line' },
      h('span', { class: 'num', text: `見た用語 ${p.viewed} / ${p.total}` }),
      h('span', { class: 'bar bar-wide', attrs: { 'aria-hidden': 'true' } }, h('span', { class: 'bar-fill', style: `width:${p.total ? Math.round((p.viewed / p.total) * 100) : 0}%` })),
      h('span', { class: 'num muted', text: percent(p.total ? p.viewed / p.total : null) }),
    ),
    lastTerm ? h('div', {}, h('button', { class: 'btn', type: 'button', attrs: { 'data-action': 'resume' }, text: `続きから: ${lastTerm.term}`, on: { click: () => app.go('term', { id: lastTerm.id }) } })) : null,
  );

  const categorySelect = h('select', { id: 'gl-category' },
    h('option', { value: '0', text: `すべて（${p.viewed} / ${p.total}）` }),
    app.categories.map((c) => {
      const cp = p.byCategory[c.id] || { total: 0, viewed: 0 };
      return h('option', { value: String(c.id), text: `${String(c.id).padStart(2, '0')} ${c.name}（${cp.viewed} / ${cp.total}）` });
    }),
  );
  categorySelect.value = String(f.category);
  const search = h('input', { id: 'gl-search', type: 'search', value: f.query, attrs: { placeholder: '用語を検索', autocomplete: 'off' } });
  const unviewed = h('input', { id: 'gl-unviewed', type: 'checkbox', checked: f.onlyUnviewed });
  const onlyLater = h('input', { id: 'gl-later', type: 'checkbox', checked: f.onlyBookmarked });

  const list = h('ul', { class: 'term-list' });
  const count = h('p', { class: 'muted num', attrs: { 'aria-live': 'polite' } });

  function paintList() {
    const items = filterTerms(app.glossary, f, viewed, bookmarks);
    count.textContent = `${items.length}語`;
    if (items.length === 0) {
      list.replaceChildren(h('li', { class: 'term-empty muted', text: '条件に合う用語はありません' }));
      return;
    }
    const laterSet = new Set(bookmarks);
    list.replaceChildren(...items.map((t) => h('li', {},
      h('button', { class: 'term-row', type: 'button', attrs: { 'data-term': t.id }, on: { click: () => app.go('term', { id: t.id }) } },
        h('span', { class: 'term-marks', attrs: { 'aria-hidden': 'true' } }, laterSet.has(t.id) ? '☆' : ''),
        h('span', { class: 'term-name', text: t.term }),
        h('span', { class: 'term-count num muted', text: views[t.id] ? `${views[t.id]}回` : '未読' }),
        h('span', { class: 'term-short-line', text: t.short }),
        h('span', { class: 'visually-hidden', text: laterSet.has(t.id) ? 'あとで見直す' : '' }),
      ),
    )));
  }

  categorySelect.addEventListener('change', () => { f.category = Number(categorySelect.value); paintList(); });
  search.addEventListener('input', () => { f.query = search.value; paintList(); });
  unviewed.addEventListener('change', () => { f.onlyUnviewed = unviewed.checked; paintList(); });
  onlyLater.addEventListener('change', () => { f.onlyBookmarked = onlyLater.checked; paintList(); });

  const filters = h('section', { class: 'panel', attrs: { 'aria-labelledby': 'gl-filter-title' } },
    h('h2', { id: 'gl-filter-title', class: 'section-title', text: '用語を探す' }),
    h('div', { class: 'gl-filters' },
      h('label', { class: 'field-label', attrs: { for: 'gl-category' }, text: '分野' }), categorySelect,
      h('label', { class: 'field-label', attrs: { for: 'gl-search' }, text: '検索' }), search,
    ),
    h('div', { class: 'row' },
      h('label', { class: 'check' }, unviewed, ' まだ見ていない用語だけ'),
      h('label', { class: 'check' }, onlyLater, ' あとで見直す用語だけ'),
    ),
    count,
    list,
  );

  paintList();
  const el = h('div', { class: 'screen glossary' }, header, summary, filters);
  return { el, focus: header.querySelector('h1') };
}

// S08 用語の説明
function renderTerm(app, params) {
  const term = app.termMap.get(params.id);
  if (!term) return renderGlossary(app);
  const count = recordView(app, term.id);
  const ids = filteredIds(app);
  const { prev, next } = neighbors(ids.includes(term.id) ? ids : app.glossary.map((t) => t.id), term.id);
  // 前後の用語へ移るときは、たどってきた道（app.termTrail）を捨てる
  const trail = app.termTrail || [];
  const goTerm = (id) => { app.termTrail = []; app.go('term', { id }); };
  const goRelated = (id) => { app.termTrail = [...trail, term.id]; app.go('term', { id }); };
  const goBack = () => { app.termTrail = trail.slice(0, -1); app.go('term', { id: trail[trail.length - 1] }); };

  const later = laterButton(app, term.id);
  const header = h('header', { class: 'top' },
    h('button', { class: 'btn btn-sub btn-small', type: 'button', text: '一覧へ', on: { click: () => app.go('glossary') } }),
    h('button', { class: 'btn btn-sub btn-small', type: 'button', text: 'ホームへ', on: { click: () => app.go('home') } }),
  );
  const title = h('h1', { class: 'term-title', text: term.term });
  const prevButton = h('button', { class: 'btn btn-sub', type: 'button', disabled: !prev, text: '← 前の用語', on: { click: () => prev && goTerm(prev) } });
  const nextButton = h('button', { class: 'btn', type: 'button', disabled: !next, text: '次の用語 →', on: { click: () => next && goTerm(next) } });

  const el = h('div', { class: 'screen term-screen' },
    header,
    termProgressLine(app, term),
    backButton(app, trail, goBack),
    h('article', { class: 'panel term' },
      title,
      viewCountLine(count),
      termContent(app, term, { onRelated: goRelated }),
      h('div', { class: 'row' }, later),
    ),
    h('div', { class: 'row row-between nav' }, prevButton, nextButton),
  );
  return {
    el,
    focus: title,
    onKey(event) {
      if (event.key === 'ArrowLeft' && prev) { goTerm(prev); return true; }
      if (event.key === 'ArrowRight' && next) { goTerm(next); return true; }
      if (event.key === 'Backspace' && trail.length > 0) { goBack(); return true; }
      if (event.key.toLowerCase() === 'b') { later.click(); return true; }
      return false;
    },
  };
}

// ---- src/ui/app.js ----
// 画面の状態と切り替え、キー操作の振り分け（詳細設計書 6.1、6.3）。
// 各画面は screens に登録された関数で、(app, params) を受け取り { el, onKey, cleanup, focus } を返す。

function createApp({ data, storage, screens, root }) {
  const live = h('div', { class: 'visually-hidden', attrs: { 'aria-live': 'polite', role: 'status' } });
  const main = h('main', { class: 'app' });
  root.replaceChildren(main, live);

  const app = {
    data,
    target: data.target,
    config: data.config,
    categories: data.categories,
    questions: data.questions,
    questionMap: indexQuestions(data.questions),
    active: activeQuestions(data.questions),
    glossary: data.glossary,
    termMap: indexTerms(data.glossary),
    questionTerms: data.questionTerms,
    glossaryFilter: { ...DEFAULT_GLOSSARY_FILTER },
    termTrail: [], // 関連する用語をたどってきた道（S08 の「〜に戻る」）
    storage,
    notices: [],
    current: null,
    dialogOpen: false,

    categoryName(id) {
      const c = data.categories.find((cat) => cat.id === id);
      return c ? c.name : `分野${id}`;
    },

    // ホームに出すお知らせ。同じ id は1つだけ。
    addNotice(id, text) {
      if (!app.notices.some((n) => n.id === id)) app.notices.push({ id, text });
    },
    dismissNotice(id) {
      app.notices = app.notices.filter((n) => n.id !== id);
    },

    go(name, params = {}) {
      if (app.current && app.current.cleanup) app.current.cleanup();
      const render = screens[name];
      const view = render(app, params);
      app.current = { name, params, ...view };
      main.replaceChildren(view.el);
      window.scrollTo(0, 0);
      const target = view.focus || view.el.querySelector('h1, h2');
      if (target) {
        if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
        target.focus({ preventScroll: true });
      }
    },

    rerender() {
      if (app.current) app.go(app.current.name, app.current.params);
    },

    // 画面読み上げ用に知らせる。
    announce(text) {
      live.textContent = '';
      window.setTimeout(() => {
        live.textContent = text;
      }, 50);
    },
  };

  document.addEventListener('keydown', (event) => {
    if (app.dialogOpen || !app.current || !app.current.onKey) return;
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    const tag = event.target && event.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (app.current.onKey(event) === true) event.preventDefault();
  });

  // 他のタブでの変更（詳細設計書 3.3）
  window.addEventListener('storage', (event) => {
    const name = storage.applyExternalChange(event.key, event.newValue);
    if (!name || !app.current) return;
    if (name === 'exam' && storage.read('exam') === null && app.current.name === 'exam') {
      app.addNotice('exam-other-tab', '別のタブで試験が終了しました。');
      app.go('home');
    } else if (['home', 'practiceMenu', 'glossary'].includes(app.current.name)) {
      app.rerender();
    }
  });

  return app;
}

// ---- src/lib/transfer.js ----
// 記録の書き出し・読み込み（要件 F21、詳細設計書 11.5）。
// 形式は「GKMD1.」＋ JSON を UTF-8 にして base64url にした文字列。中身は問題番号・用語番号と回数などだけ（SEC1）。

const TRANSFER_PREFIX = 'GKMD1.';
const TRANSFER_MAX_LENGTH = 500000;
const QUESTION_ID = /^Q-\d{1,6}$/;
const TERM_ID = /^W-\d{1,6}$/;

function toBase64Url(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromBase64Url(text) {
  if (!/^[A-Za-z0-9_-]*$/.test(text)) throw new Error('bad characters');
  const padded = text.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (text.length % 4)) % 4);
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
}

function exportRecords(read) {
  const data = {};
  for (const name of TRANSFER_NAMES) data[name] = read(name);
  return TRANSFER_PREFIX + toBase64Url(JSON.stringify({ v: 1, app: 'gkmd', data }));
}

function isTransferObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

// 番号の形が正しいものだけを残す（それ以外の番号の記録は捨てる）。
function cleanIds(name, value) {
  const pickKeys = (obj, re) => Object.fromEntries(Object.entries(obj).filter(([k]) => re.test(k)));
  switch (name) {
    case 'records': return pickKeys(value, QUESTION_ID);
    case 'bookmarks': return value.filter((id) => QUESTION_ID.test(id));
    case 'wordViews': return pickKeys(value, TERM_ID);
    case 'wordBookmarks': return value.filter((id) => TERM_ID.test(id));
    case 'wordLast': return value !== null && TERM_ID.test(value) ? value : null;
    case 'daily': return value !== null && QUESTION_ID.test(value.id) ? value : null;
    default: return value;
  }
}

// 読み込む文字列を確かめる。{ ok: true, data } か { ok: false, reason }。
function parseImport(text) {
  const s = String(text || '').trim();
  if (s === '') return { ok: false, reason: '文字列を貼り付けてください。' };
  if (s.length > TRANSFER_MAX_LENGTH) return { ok: false, reason: '文字列が長すぎます。このアプリで書き出した文字列を貼り付けてください。' };
  if (!s.startsWith(TRANSFER_PREFIX)) return { ok: false, reason: 'このアプリで書き出した文字列ではありません（「GKMD1.」で始まる文字列を貼り付けてください）。' };
  let parsed;
  try {
    parsed = JSON.parse(fromBase64Url(s.slice(TRANSFER_PREFIX.length)));
  } catch (e) {
    return { ok: false, reason: '文字列が途中で切れているか、壊れています。もう一度コピーしてください。' };
  }
  if (!isTransferObject(parsed) || parsed.v !== 1 || parsed.app !== 'gkmd' || !isTransferObject(parsed.data)) {
    return { ok: false, reason: 'このアプリの記録の形ではありません。' };
  }
  const data = {};
  for (const name of TRANSFER_NAMES) {
    if (!Object.prototype.hasOwnProperty.call(parsed.data, name)) continue;
    const value = parsed.data[name];
    if (!isValidStored(name, value)) return { ok: false, reason: '記録の中身が壊れています。もう一度書き出してください。' };
    data[name] = cleanIds(name, value);
  }
  if (Object.keys(data).length === 0) return { ok: false, reason: '読み込める記録がありません。' };
  return { ok: true, data };
}

// 書き出しに含まれる項目を丸ごと置き換える（混ぜ合わせない）。
function applyImport(write, data) {
  for (const name of TRANSFER_NAMES) if (Object.prototype.hasOwnProperty.call(data, name)) write(name, data[name]);
}

// ---- src/ui/site.js ----
// Webサイト版の仕組み（要件 F22、F23、SEC2、SEC9、詳細設計書 11.3、11.4、11.7）。
// claude.ai 版（target が artifact）では、永続化の要求と移行の案内だけを使う。

// 他のサイトに埋め込まれていたら中身を出さない（ページの中の CSP では埋め込みを禁止できないため）。
function isFramed() {
  try {
    return window.top !== window.self;
  } catch (e) {
    return true;
  }
}

function framedNotice(root) {
  root.replaceChildren(h('p', { class: 'notice', text: 'このアプリは、他のページの中では開けません。アプリのURLを直接開いてください。' }));
}

// ブラウザに記録を消さないよう求める（F22）。結果は画面に出さない。
function requestPersistence() {
  try {
    const s = navigator.storage;
    if (!s || typeof s.persist !== 'function') return;
    Promise.resolve(typeof s.persisted === 'function' ? s.persisted() : false)
      .then((already) => (already ? true : s.persist()))
      .catch(() => {});
  } catch (e) {
    // 使えない環境では何もしない
  }
}

function isStandalone() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  } catch (e) {
    return false;
  }
}

function deviceKind() {
  const ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'other';
}

const INSTALL_STEPS = {
  ios: 'Safari の共有ボタン（四角から矢印が出ているマーク）を押し、「ホーム画面に追加」を選んでください。',
  android: 'Chrome のメニュー（︙）を押し、「ホーム画面に追加」または「アプリをインストール」を選んでください。',
  other: 'ブラウザのアドレスバーにあるインストールのボタン、またはメニューの「アプリをインストール」から追加できます。',
};

// ホーム画面への追加の案内（F22）。ホーム画面から開いているときと、閉じた後は出さない。
function installHint(app) {
  if (app.target !== 'site' || isStandalone()) return null;
  const ui = app.storage.read('ui');
  if (ui.installHintClosed) return null;
  const box = h('section', { class: 'notice install-hint', attrs: { 'aria-label': 'ホーム画面に追加', 'data-hint': 'install' } });
  const close = h('button', { class: 'btn-text', type: 'button', text: '閉じる', on: { click: () => {
    app.storage.write('ui', { ...app.storage.read('ui'), installHintClosed: true });
    box.remove();
  } } });
  box.append(
    h('p', { text: `記録を消えにくくするために、ホーム画面に追加して使うのがおすすめです。${INSTALL_STEPS[deviceKind()]}` }),
    h('p', { class: 'note', text: 'ホーム画面から開いたアプリと、ブラウザで開いたページは、記録が別々になります。今の記録を移すときは「記録の書き出し・読み込み」を使ってください。' }),
    close,
  );
  return box;
}

// claude.ai 版のホームに出す、新しいURLへの案内。
function migrationNotice(app) {
  const url = app.config.siteUrl;
  if (app.target !== 'artifact' || typeof url !== 'string' || url === '') return null;
  return h('section', { class: 'notice migrate', attrs: { 'data-hint': 'migrate' } },
    h('p', { text: 'アプリは新しいURLに移りました。こちらのページでは、ブラウザによって記録が残らないことがあります。' }),
    h('p', {}, externalLink(url, '新しいURLを開く ↗', 'btn')),
    h('p', { class: 'note', text: '今までの記録を移すには、このページの「記録の書き出し・読み込み」で書き出し、新しいURLで読み込んでください。' }),
  );
}

// オフライン用のプログラムを登録し、新しい版があれば知らせる（F23）。
function registerWorker(app) {
  if (app.target !== 'site' || !('serviceWorker' in navigator)) return;
  const container = navigator.serviceWorker;
  let userAsked = false;
  let url = './sw.js';
  try {
    if (window.trustedTypes && typeof window.trustedTypes.createPolicy === 'function') {
      const policy = window.trustedTypes.createPolicy('gkmd-sw', {
        createScriptURL: (u) => {
          if (u === './sw.js') return u;
          throw new TypeError('このURLは使えません');
        },
      });
      url = policy.createScriptURL('./sw.js');
    }
  } catch (e) {
    return;
  }

  function showUpdate(worker) {
    if (document.querySelector('.update-bar')) return;
    const bar = h('div', { class: 'update-bar', attrs: { role: 'status' } },
      h('span', { text: '新しい版があります' }),
      h('button', { class: 'btn btn-small', type: 'button', attrs: { 'data-action': 'update' }, text: '更新する', on: { click: () => {
        userAsked = true;
        worker.postMessage('skipWaiting');
      } } }),
      h('button', { class: 'btn-text', type: 'button', text: 'あとで', on: { click: () => bar.remove() } }),
    );
    document.body.append(bar);
  }

  container.addEventListener('controllerchange', () => {
    if (userAsked) window.location.reload();
  });
  container.register(url, { scope: './' }).then((reg) => {
    const check = () => {
      if (reg.waiting && container.controller) showUpdate(reg.waiting);
    };
    check();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') check(); });
    });
  }).catch(() => {});
}

// ---- src/lib/date.js ----
// 日本時間の日付と、時間の表示形式。

const JST_OFFSET_MS = 9 * 60 * 60 * 1000;

function jstDateString(now = Date.now()) {
  return new Date(now + JST_OFFSET_MS).toISOString().slice(0, 10);
}

// ミリ秒を「mm:ss」にする。1秒未満は切り上げ、残り時間が 0:00 になるのを実際に0になったときだけにする。
function formatDuration(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

// ---- src/ui/question.js ----
// 問題の表示。練習と今日の1問で使う「解答できる問題」と、結果画面で使う「振り返り」。

// 選択肢の行。mark はマークシートの楕円（中に番号）。
function choiceRow({ number, text, tag = 'button', state = '', label = '' }) {
  const cls = `choice${state ? ` is-${state}` : ''}`;
  const children = [
    h('span', { class: 'mark', attrs: { 'aria-hidden': 'true' }, text: String(number) }),
    h('span', { class: 'choice-text' }, multiline(text)),
    label ? h('span', { class: 'choice-tag', text: label }) : null,
  ];
  if (tag === 'button') return h('button', { class: cls, type: 'button', attrs: { 'aria-label': `選択肢${number}: ${text}` } }, children);
  return h('li', { class: cls }, children);
}

// 解答後の表示の状態。correct は元の正解の位置、choice は選んだ元の位置。
function rowState(original, question, choice) {
  if (original === question.answer) return { state: 'correct', label: original === choice ? '正解・あなたの解答' : '正解' };
  if (original === choice) return { state: 'wrong', label: 'あなたの解答' };
  return { state: '', label: '' };
}

function bookmarkButton(app, id) {
  const button = h('button', { class: 'btn-flag', type: 'button' });
  const paint = () => {
    const on = app.storage.read('bookmarks').includes(id);
    button.textContent = on ? '★ 見直す' : '☆ 見直す';
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
    button.setAttribute('aria-label', on ? 'ブックマークを外す' : 'ブックマークする（あとで見直す）');
  };
  button.addEventListener('click', () => {
    app.storage.write('bookmarks', toggleBookmark(app.storage.read('bookmarks'), id));
    paint();
  });
  paint();
  return button;
}

function reportButton(app, id) {
  return h('button', { class: 'btn-text', type: 'button', text: 'この問題を報告', on: { click: () => reportDialog(app, { questionId: id }) } });
}

// 解説、出典、基準日の注意。
function explanationBlock(app, question) {
  return h('div', { class: 'explain' },
    h('p', { class: 'explain-text' }, multiline(question.explanation)),
    question.timeSensitive ? h('p', { class: 'note num', text: `この問題は ${app.config.asOf} 時点の情報に基づきます。` }) : null,
    h('div', { class: 'sources' },
      h('span', { class: 'sources-label', text: '出典' }),
      h('ul', {}, question.sources.map((s) => h('li', {}, externalLink(s.url, s.title)))),
    ),
    questionTermsBlock(app, question.id),
  );
}

// 解答できる問題。onAnswer(choice) は1回だけ呼ぶ。initialChoice があれば解答済みとして表示する。
function answerableQuestion(app, { question, order, initialChoice = null, heading, onAnswer }) {
  let choice = initialChoice;
  const list = h('div', { class: 'choices', attrs: { role: 'group', 'aria-label': '選択肢' } });
  const feedback = h('div', { class: 'feedback', attrs: { 'aria-live': 'polite' } });
  const buttons = order.map((original, i) => {
    const b = choiceRow({ number: i + 1, text: question.choices[original] });
    b.addEventListener('click', () => answer(i));
    return b;
  });
  list.append(...buttons);

  function paint() {
    if (choice === null) return;
    order.forEach((original, i) => {
      const { state, label } = rowState(original, question, choice);
      const b = buttons[i];
      b.disabled = true;
      b.className = `choice${state ? ` is-${state}` : ''}`;
      const old = b.querySelector('.choice-tag');
      if (old) old.remove();
      if (label) b.append(h('span', { class: 'choice-tag', text: label }));
    });
    const correct = choice === question.answer;
    feedback.replaceChildren(
      h('p', { class: `verdict ${correct ? 'is-correct' : 'is-wrong'}`, text: correct ? '○ 正解' : '× 不正解' }),
      explanationBlock(app, question),
      h('div', { class: 'row row-end' }, reportButton(app, question.id)),
    );
  }

  function answer(displayIndex) {
    if (choice !== null || displayIndex < 0 || displayIndex >= order.length) return false;
    choice = order[displayIndex];
    paint();
    onAnswer(choice);
    return true;
  }

  paint();
  const el = h('article', { class: 'question' },
    h('div', { class: 'q-head' }, h('h2', { class: 'q-text' }, heading ? h('span', { class: 'q-no num', text: heading }) : null, multiline(question.question)), bookmarkButton(app, question.id)),
    list,
    feedback,
  );
  return { el, answer, answered: () => choice !== null };
}

// 結果画面の振り返り。<details> で開閉する。
function reviewItem(app, { question, order, choice, open = false, number = null }) {
  const correct = choice !== null && choice === question.answer;
  const mark = correct ? '○' : '×';
  const status = choice === null ? '未解答' : correct ? '正解' : '不正解';
  const rows = order.map((original, i) => {
    const { state, label } = rowState(original, question, choice);
    return choiceRow({ number: i + 1, text: question.choices[original], tag: 'li', state, label });
  });
  return h('details', { class: `review ${correct ? 'is-correct' : 'is-wrong'}`, open },
    h('summary', {},
      h('span', { class: 'review-mark', attrs: { 'aria-label': status }, text: mark }),
      h('span', { class: 'review-id num', text: number !== null ? `問${number} ${question.id}` : question.id }),
      h('span', { class: 'review-q', text: question.question.split('\n')[0] }),
    ),
    h('div', { class: 'review-body' },
      h('p', { class: 'q-text' }, multiline(question.question)),
      choice === null ? h('p', { class: 'note', text: 'この問題は未解答でした。' }) : null,
      h('ol', { class: 'choices choices-static' }, rows),
      explanationBlock(app, question),
      h('div', { class: 'row row-between' }, bookmarkButton(app, question.id), reportButton(app, question.id)),
    ),
  );
}

// ---- src/lib/daily.js ----
// 今日の1問。日付から全利用者に同じ問題と選択肢の並びを決める。

function dailyOrder(dateString, id) {
  return shuffledOrder(seededRng(fnv1a(`${dateString}:${id}`)));
}

function compareIds(a, b) {
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

function pickDaily(questions, dateString) {
  const active = questions.filter((q) => q.status === 'active').sort(compareIds);
  if (active.length === 0) return null;
  const question = active[fnv1a(dateString) % active.length];
  return { question, order: dailyOrder(dateString, question.id) };
}

// その日に解答済みで、その問題がまだ有効なら、解答した問題を出し続ける。
function resolveDaily(saved, questions, dateString) {
  if (saved && saved.date === dateString) {
    const question = questions.find((q) => q.id === saved.id && q.status === 'active');
    if (question) return { question, order: dailyOrder(dateString, question.id), saved };
  }
  const picked = pickDaily(questions, dateString);
  return picked ? { ...picked, saved: null } : null;
}

// ---- src/ui/practice.js ----
// S02 練習、S03 練習の結果

const MODE_LABELS = { random: 'ランダム10問', review: '復習', bookmark: 'ブックマーク', retry: '解き直し' };

function practiceLabel(app, params) {
  return params.mode === 'category' ? `分野別: ${app.categoryName(params.categoryId)}` : MODE_LABELS[params.mode];
}

function renderPractice(app, params) {
  const items = params.items || buildPractice(params.mode, {
    questions: app.questions,
    records: app.storage.read('records'),
    bookmarks: app.storage.read('bookmarks'),
    categoryId: params.categoryId,
    retryIds: params.retryIds,
    randomCount: app.config.practice.randomCount,
  });
  const label = practiceLabel(app, params);
  if (items.length === 0) {
    app.addNotice('practice-empty', `${label}の対象になる問題がありません。`);
    return renderEmpty(app);
  }

  const choices = items.map(() => null);
  let index = 0;
  let view = null;

  const counter = h('span', { class: 'counter num' });
  const progress = h('span', { class: 'progress-fill' });
  const meta = h('span', { class: 'q-meta num' });
  const slot = h('div', { class: 'q-slot' });
  const quit = h('button', { class: 'btn btn-sub', type: 'button', text: '中断して練習問題へ', on: { click: () => app.go('practiceMenu') } });
  const next = h('button', { class: 'btn', type: 'button', hidden: true, on: { click: () => goNext() } });

  function show() {
    const item = items[index];
    const question = app.questionMap.get(item.id);
    counter.textContent = `${label} ${index + 1} / ${items.length}`;
    progress.style.width = `${(index / items.length) * 100}%`;
    meta.textContent = `${app.categoryName(question.category)}　${question.id}`;
    next.hidden = true;
    next.textContent = index === items.length - 1 ? '結果を見る' : '次の問題へ';
    view = answerableQuestion(app, {
      question,
      order: item.order,
      heading: `問${index + 1}`,
      onAnswer(choice) {
        choices[index] = choice;
        const correct = choice === question.answer;
        app.storage.write('records', applyAnswer(app.storage.read('records'), question.id, correct));
        progress.style.width = `${((index + 1) / items.length) * 100}%`;
        next.hidden = false;
        next.focus({ preventScroll: true });
      },
    });
    slot.replaceChildren(view.el);
  }

  function goNext() {
    if (choices[index] === null) return;
    if (index < items.length - 1) {
      index++;
      show();
      window.scrollTo(0, 0);
      const heading = slot.querySelector('h2');
      if (heading) {
        heading.setAttribute('tabindex', '-1');
        heading.focus({ preventScroll: true });
      }
    } else {
      app.go('practiceResult', { mode: params.mode, categoryId: params.categoryId, label, items, choices });
    }
  }

  show();
  const el = h('div', { class: 'screen practice' },
    h('div', { class: 'q-bar' }, meta, counter),
    h('div', { class: 'progress', attrs: { 'aria-hidden': 'true' } }, progress),
    slot,
    h('div', { class: 'row row-between nav' }, quit, next),
  );
  return {
    el,
    onKey(event) {
      const n = Number(event.key);
      if (n >= 1 && n <= 4) return view.answer(n - 1);
      if (event.key === 'Enter' && choices[index] !== null) {
        const tag = event.target && event.target.tagName;
        if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return false;
        goNext();
        return true;
      }
      if (event.key === 'b' || event.key === 'B') {
        const flag = slot.querySelector('.btn-flag');
        if (flag) flag.click();
        return true;
      }
      return false;
    },
  };
}

function renderEmpty(app) {
  const back = h('button', { class: 'btn', type: 'button', text: '練習問題へ', on: { click: () => app.go('practiceMenu') } });
  return { el: h('div', { class: 'screen' }, h('h1', { text: '出題できる問題がありません' }), back) };
}

function resultComment(rate) {
  if (rate >= 0.8) return 'この調子です';
  if (rate >= 0.6) return 'あと一歩です';
  return '解説を読んで復習しましょう';
}

function renderPracticeResult(app, params) {
  const { items, choices, label } = params;
  const rows = items.map((item, i) => ({ item, choice: choices[i], question: app.questionMap.get(item.id) }))
    .filter((r) => r.choice !== null && r.question);
  const score = rows.filter((r) => r.choice === r.question.answer).length;
  const rate = rows.length > 0 ? score / rows.length : 0;
  const wrongIds = rows.filter((r) => r.choice !== r.question.answer).map((r) => r.question.id);

  const marks = h('p', { class: 'marks', attrs: { 'aria-label': `${rows.length}問中${score}問正解` } },
    rows.map((r) => h('span', { class: `dot ${r.choice === r.question.answer ? 'is-correct' : 'is-wrong'}`, attrs: { 'aria-hidden': 'true' } })));

  const el = h('div', { class: 'screen result' },
    h('h1', { text: `${label}の結果` }),
    h('div', { class: 'score' },
      h('span', { class: 'score-main num' }, `${score}`, h('small', { text: ` / ${rows.length}` })),
      h('span', { class: 'score-rate num', text: percent(rate) }),
      h('span', { class: 'score-comment', text: resultComment(rate) }),
    ),
    marks,
    h('div', { class: 'row' },
      h('button', { class: 'btn btn-sub', type: 'button', text: '練習問題へ', on: { click: () => app.go('practiceMenu') } }),
      wrongIds.length > 0 ? h('button', { class: 'btn', type: 'button', text: `間違えた${wrongIds.length}問を解き直す`, on: { click: () => app.go('practice', { mode: 'retry', retryIds: wrongIds }) } }) : null,
    ),
    h('section', { class: 'panel', attrs: { 'aria-labelledby': 'review-title' } },
      h('h2', { id: 'review-title', class: 'section-title', text: '解答の振り返り' }),
      h('div', { class: 'reviews' }, rows.map((r, i) => reviewItem(app, { question: r.question, order: r.item.order, choice: r.choice, open: r.choice !== r.question.answer, number: i + 1 }))),
    ),
  );
  return { el };
}

// ---- src/ui/exam.js ----
// S04 模擬試験の開始、S05 模擬試験、S06 模擬試験の結果

const WARN_MS = 5 * 60 * 1000;
const ANNOUNCE_AT_MIN = [10, 5, 1];

// 試験を終えて、学習記録と前回の結果を保存し、結果画面に進む。
function completeExam(app, reason) {
  const exam = app.storage.read('exam');
  if (!exam) return;
  const result = finishExam(exam, app.questionMap, reason);
  let records = app.storage.read('records');
  for (const item of result.items) {
    if (item.choice !== null) records = applyAnswer(records, item.id, item.correct, result.finishedAt);
  }
  app.storage.write('records', records);
  app.storage.write('lastExam', { finishedAt: result.finishedAt, score: result.score, total: result.total });
  app.storage.write('exam', null);
  app.go('examResult', { result });
}

function renderExamStart(app) {
  const exam = app.storage.read('exam');
  const { count, minutes } = examSize(app.active.length, app.config);

      h('p', { class: 'notice num', text: `受験中の試験があります（残り ${formatDuration(remainingMs(exam))}）` }),

        back,
        h('div', { class: 'row' },
          h('button', { class: 'btn btn-sub btn-danger-text', type: 'button', text: '破棄する', on: {
            click: () => confirmDialog(app, {
              title: '受験中の試験を破棄',
              message: '受験中の試験を破棄します。解答は学習記録に残りません。',
              confirmLabel: '破棄する',
              danger: true,
              onConfirm: () => {
                app.storage.write('exam', null);
                app.go('examStart');
              },
            }),
          } }),
          h('button', { class: 'btn', type: 'button', text: '再開する', on: { click: () => app.go('exam') } }),
        ),
      ),
    );
  } else {
    actions = h('div', { class: 'row row-between' }, back,
      h('button', { class: 'btn', type: 'button', text: '開始する', disabled: count === 0, on: {
        click: () => {

  }

  const el = h('div', { class: 'screen exam-start' },
    h('h1', { text: 'ハーフ模試' }),
    h('p', { class: 'lead num', text: `${app.config.exam.questionCount}問・${app.config.exam.minutes}分（本番の半分の規模。1問あたり約41秒）` }),
    reduced && count > 0 ? h('p', { class: 'notice num', text: `現在の問題数では ${count}問・${minutes}分で実施します。` }) : null,
    h('ul', { class: 'rules' },
      h('li', { text: '分野の配分に沿って、収録問題からランダムに出題します。' }),
      h('li', { text: '解答中は正誤と解説を表示しません。終了後にまとめて確認できます。' }),
      h('li', { text: '問題の移動、解答の変更、見直し用の印付けができます。' }),
      h('li', { text: '時間切れになると自動で終了します。' }),
      h('li', { text: '画面を閉じても時間は進みます。同じブラウザで開き直すと続きから再開できます。' }),
    ),
    actions,
  );
  return { el };
}

function renderExam(app) {
  const exam = app.storage.read('exam');
  if (!exam) return renderExamStart(app);
  const total = exam.items.length;
  const announced = new Set();

  const timer = h('span', { class: 'timer num', attrs: { role: 'timer', 'aria-label': '残り時間' } });
  const answeredLabel = h('span', { class: 'answered num' });
  const panelButton = h('button', { class: 'btn btn-sub btn-small', type: 'button', text: '問題一覧', attrs: { 'aria-expanded': 'false', 'aria-controls': 'exam-panel' } });
  const grid = h('div', { class: 'grid' });
  const panel = h('div', { id: 'exam-panel', class: 'exam-panel', hidden: true },
    grid,
    h('p', { class: 'note', text: '塗りつぶし＝解答済み、枠のみ＝未解答、⚑＝見直し印' }),
    h('button', { class: 'btn btn-sub btn-small', type: 'button', text: '未解答の最初の問題へ', on: {
      click: () => {
        const i = exam.items.findIndex((it) => it.choice === null);
        if (i >= 0) goTo(i);
      },
    } }),
  );
  panelButton.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    panelButton.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
  });

  const slot = h('div', { class: 'q-slot' });
  const prev = h('button', { class: 'btn btn-sub', type: 'button', text: '← 前へ', on: { click: () => goTo(exam.current - 1) } });
  const next = h('button', { class: 'btn btn-sub', type: 'button', text: '次へ →', on: { click: () => goTo(exam.current + 1) } });
  let choiceButtons = [];
  let flagButton = null;

  function save() {
    app.storage.write('exam', exam);
  }

  function paintStatus() {
    answeredLabel.textContent = `解答済み ${total - unansweredCount(exam)} / ${total}`;
    grid.replaceChildren(...exam.items.map((it, i) => h('button', {
      class: `cell${it.choice !== null ? ' is-done' : ''}${i === exam.current ? ' is-current' : ''}`,
      type: 'button',
      attrs: { 'aria-label': `問${i + 1}${it.choice !== null ? ' 解答済み' : ' 未解答'}${it.flag ? ' 見直し印あり' : ''}`, 'aria-current': i === exam.current ? 'true' : null },
      on: { click: () => goTo(i) },
    }, `${i + 1}`, it.flag ? h('span', { class: 'cell-flag', attrs: { 'aria-hidden': 'true' }, text: '⚑' }) : null)));
  }

  function paintChoices() {
    const item = exam.items[exam.current];
    choiceButtons.forEach((b, i) => {
      const on = item.choice === item.order[i];
      b.classList.toggle('is-selected', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    flagButton.textContent = item.flag ? '⚑ 見直し印あり' : '⚐ あとで見直す';
    flagButton.setAttribute('aria-pressed', item.flag ? 'true' : 'false');
  }

  function choose(displayIndex) {
    const item = exam.items[exam.current];
    if (displayIndex < 0 || displayIndex >= item.order.length) return false;
    item.choice = item.order[displayIndex];
    save();
    paintChoices();
    paintStatus();
    return true;
  }

  function toggleFlag() {
    const item = exam.items[exam.current];
    item.flag = !item.flag;
    save();
    paintChoices();
    paintStatus();
  }

  function show() {
    const item = exam.items[exam.current];
    const question = app.questionMap.get(item.id);
    flagButton = h('button', { class: 'btn-flag', type: 'button', on: { click: toggleFlag } });
    if (!question || question.status !== 'active') {
      choiceButtons = [];
      slot.replaceChildren(h('article', { class: 'question' },
        h('div', { class: 'q-head' }, h('h2', { class: 'q-text' }, h('span', { class: 'q-no num', text: `問${exam.current + 1}` }), 'この問題は更新により廃止されたため、採点から除外します。'), flagButton)));
    } else {
      choiceButtons = item.order.map((original, i) => h('button', {
        class: 'choice',
        type: 'button',
        attrs: { 'aria-label': `選択肢${i + 1}: ${question.choices[original]}` },
        on: { click: () => choose(i) },
      }, h('span', { class: 'mark', attrs: { 'aria-hidden': 'true' }, text: String(i + 1) }), h('span', { class: 'choice-text' }, multiline(question.choices[original]))));
      slot.replaceChildren(h('article', { class: 'question' },
        h('div', { class: 'q-meta num', text: app.categoryName(question.category) }),
        h('div', { class: 'q-head' }, h('h2', { class: 'q-text' }, h('span', { class: 'q-no num', text: `問${exam.current + 1}` }), multiline(question.question)), flagButton),
        h('div', { class: 'choices', attrs: { role: 'group', 'aria-label': '選択肢' } }, choiceButtons),
      ));
    }
    prev.disabled = exam.current === 0;
    next.disabled = exam.current === total - 1;
    if (choiceButtons.length > 0) paintChoices();
    else flagButton.textContent = exam.items[exam.current].flag ? '⚑ 見直し印あり' : '⚐ あとで見直す';
    paintStatus();
  }

  function goTo(i) {
    if (i < 0 || i >= total || i === exam.current) return;
    exam.current = i;
    save();
    show();
    window.scrollTo(0, 0);
    const heading = slot.querySelector('h2');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  }

  function tick() {
    const left = remainingMs(exam);
    timer.textContent = `残り ${formatDuration(left)}`;
    timer.classList.toggle('is-warn', left < WARN_MS);
    for (const min of ANNOUNCE_AT_MIN) {
      if (left <= min * 60000 && left > (min * 60000 - 60000) && !announced.has(min)) {
        announced.add(min);
        app.announce(`残り${min}分です`);
      }
    }
    if (left <= 0) completeExam(app, 'timeout');
  }

  const submit = h('button', { class: 'btn', type: 'button', text: '解答を終了', on: {
    click: () => {
      const left = unansweredCount(exam);
      confirmDialog(app, {
        title: '解答を終了',
        message: left > 0 ? `未解答が ${left}問あります。解答を終了しますか？` : '解答を終了しますか？',
        confirmLabel: '終了する',
        onConfirm: () => completeExam(app, 'submit'),
      });
    },
  } });
  const quit = h('button', { class: 'btn btn-sub', type: 'button', text: '中断してホームへ', on: { click: () => app.go('home') } });

  // 開いた時点で残っている時間より上の区切りは、読み上げ済みとして扱う
  for (const min of ANNOUNCE_AT_MIN) if (remainingMs(exam) <= min * 60000 - 60000) announced.add(min);
  show();
  timer.textContent = `残り ${formatDuration(remainingMs(exam))}`;
  // 最初の確認は画面の表示が終わってから行う（表示中に時間切れで画面を切り替えないため）
  const firstTick = window.setTimeout(tick, 0);
  const interval = window.setInterval(tick, 1000);
  const onVisible = () => {
    if (document.visibilityState === 'visible') tick();
  };
  document.addEventListener('visibilitychange', onVisible);

  const el = h('div', { class: 'screen exam' },
    h('div', { class: 'exam-bar' }, timer, answeredLabel, panelButton),
    panel,
    h('h1', { class: 'visually-hidden', text: 'ハーフ模試' }),
    slot,
    h('div', { class: 'row row-between nav' }, prev, next),
    h('div', { class: 'row row-between' }, quit, submit),
  );
  return {
    el,
    focus: slot.querySelector('h2'),
    cleanup() {
      window.clearTimeout(firstTick);
      window.clearInterval(interval);
      document.removeEventListener('visibilitychange', onVisible);
    },
    onKey(event) {
      const n = Number(event.key);
      if (n >= 1 && n <= 4) return choiceButtons.length > 0 ? choose(n - 1) : false;
      if (event.key === 'ArrowLeft') {
        goTo(exam.current - 1);
        return true;
      }
      if (event.key === 'ArrowRight') {
        goTo(exam.current + 1);
        return true;
      }
      if (event.key === 'f' || event.key === 'F') {
        toggleFlag();
        return true;
      }
      return false;
    },
  };
}

function renderExamResult(app, { result }) {
  const rate = result.total > 0 ? result.score / result.total : null;
  const cats = Object.entries(result.byCategory)
    .map(([id, v]) => ({ id: Number(id), ...v, rate: v.total > 0 ? v.correct / v.total : 0 }))
    .sort((a, b) => a.rate - b.rate || a.id - b.id);

  let filter = 'all';
  const list = h('div', { class: 'reviews' });
  const filters = [['all', 'すべて'], ['wrong', '不正解のみ'], ['flag', '見直し印のみ']];
  const filterButtons = filters.map(([key, label]) => h('button', { class: 'chip', type: 'button', text: label, on: { click: () => setFilter(key) } }));

  function setFilter(key) {
    filter = key;
    filterButtons.forEach((b, i) => b.setAttribute('aria-pressed', filters[i][0] === key ? 'true' : 'false'));
    const shown = result.items
      .map((item, i) => ({ item, number: i + 1 }))
      .filter(({ item }) => filter === 'all' || (filter === 'wrong' && !item.correct) || (filter === 'flag' && item.flag));
    list.replaceChildren(...(shown.length > 0
      ? shown.map(({ item, number }) => reviewItem(app, { question: app.questionMap.get(item.id), order: item.order, choice: item.choice, open: !item.correct && filter !== 'all', number }))
      : [h('p', { class: 'muted', text: '該当する問題はありません。' })]));
  }
  setFilter('all');

  const el = h('div', { class: 'screen result' },
    h('h1', { text: 'ハーフ模試の結果' }),
    h('p', { class: 'muted num', text: `${jstDateString(result.finishedAt)}　所要時間 ${formatDuration(result.elapsedMs)}${result.reason === 'timeout' ? '（時間切れ）' : ''}` }),
    h('div', { class: 'score' },
      h('span', { class: 'score-main num' }, `${result.score}`, h('small', { text: ` / ${result.total}` })),
      h('span', { class: 'score-rate num', text: percent(rate) }),
      h('span', { class: 'score-comment num', text: `未解答 ${result.unanswered}` }),
    ),
    result.excluded > 0 ? h('p', { class: 'notice num', text: `受験中に廃止された ${result.excluded}問を採点から除外しました。` }) : null,
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', text: 'ホームへ', on: { click: () => app.go('home') } })),
    h('section', { class: 'panel', attrs: { 'aria-labelledby': 'cat-rate-title' } },
      h('h2', { id: 'cat-rate-title', class: 'section-title', text: '分野別の正答率' }),
      h('ol', { class: 'cats' }, cats.map((c) => h('li', { class: 'cat' },
        h('span', { class: 'cat-no num', text: String(c.id).padStart(2, '0') }),
        h('span', { class: 'cat-name', text: app.categoryName(c.id) }),
        h('span', { class: 'cat-stat num' },
          h('span', { class: 'bar', attrs: { 'aria-hidden': 'true' } }, h('span', { class: 'bar-fill', style: `width:${Math.round(c.rate * 100)}%` })),
          h('span', { class: 'cat-rate', text: percent(c.rate) }),
          h('span', { class: 'cat-count', text: `${c.correct}/${c.total}` })),
      ))),
    ),
    h('section', { class: 'panel', attrs: { 'aria-labelledby': 'exam-review-title' } },
      h('h2', { id: 'exam-review-title', class: 'section-title', text: '解答の振り返り' }),
      h('div', { class: 'row chips', attrs: { role: 'group', 'aria-label': '絞り込み' } }, filterButtons),
      list,
    ),
  );
  return { el };
}

// ---- src/ui/main.js ----
// 起動処理。データを読み、保存領域を用意して、最初の画面を出す（基本設計書 3.2）。

function start() {
  const root = document.getElementById('app');
  let data;
  try {
    data = parseAppData(document.getElementById('app-data').textContent);
  } catch (e) {
    root.textContent = 'データを読み込めませんでした。ページを再読み込みしてください。';
    return;
  }
  // Webサイト版は、他のサイトに埋め込まれていたら中身を出さない（詳細設計書 11.3）
  if (data.target === 'site' && isFramed()) {
    framedNotice(root);
    return;
  }
  const storage = createStorage(defaultBackend());
  requestPersistence();
  const app = createApp({
    data,
    storage,
    root,
    screens: {
      home: renderHome,
      practiceMenu: renderPracticeMenu,
      glossary: renderGlossary,
      term: renderTerm,
      practice: renderPractice,
      practiceResult: renderPracticeResult,
      examStart: renderExamStart,
      exam: renderExam,
      examResult: renderExamResult,
    },
  });

  // 受験中の模擬試験があれば再開する。中断中に時間が切れていれば、その時点で終了する。
  const exam = storage.read('exam');
  if (exam && remainingMs(exam) <= 0) completeExam(app, 'timeout');
  else if (exam) app.go('exam');
  else app.go('home');
  registerWorker(app);
}

start();
})();
</script>
