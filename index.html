<title>G検定マークドリル</title>
<style>
/* G検定マークドリル。色は基本設計書 3.4、書き方は詳細設計書 8.1、8.3。 */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --text: #17202A;
  --muted: #5A666E;
  --line: #D5DCDB;
  --accent: #1D6B87;
  --on-accent: #FFFFFF;
  --print: #D4828D;
  --print-soft: #F7E4E6;
  --pencil: #2A2F33;
  --on-pencil: #FFFFFF;
  --ok: #2B7A4B;
  --ok-soft: #E3F1E8;
  --ng: #B53A3A;
  --ng-soft: #F8E5E4;
  --focus: #D4828D;
  --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, "BIZ UDGothic", monospace;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11171B;
    --surface: #192126;
    --text: #E5EBED;
    --muted: #98A6AD;
    --line: #2B363C;
    --accent: #62B4D0;
    --on-accent: #0E1417;
    --print: #B06A75;
    --print-soft: #33242A;
    --pencil: #E5EBED;
    --on-pencil: #11171B;
    --ok: #6CC08D;
    --ok-soft: #1B3326;
    --ng: #E57C75;
    --ng-soft: #3A2323;
    --focus: #E09AA4;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11171B;
  --surface: #192126;
  --text: #E5EBED;
  --muted: #98A6AD;
  --line: #2B363C;
  --accent: #62B4D0;
  --on-accent: #0E1417;
  --print: #B06A75;
  --print-soft: #33242A;
  --pencil: #E5EBED;
  --on-pencil: #11171B;
  --ok: #6CC08D;
  --ok-soft: #1B3326;
  --ng: #E57C75;
  --ng-soft: #3A2323;
  --focus: #E09AA4;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.75 var(--font);
  padding-inline: 16px;
  padding-block: 20px 48px;
}

.app { max-width: 760px; margin: 0 auto; }
.screen { display: grid; gap: 16px; }

h1, h2, h3 { text-wrap: balance; line-height: 1.45; }
h1 { font-size: 21px; margin: 0; }
h2 { font-size: 17px; margin: 0; }
h3 { font-size: 15px; margin: 0; }
p { margin: 0; }
small { font-size: 0.7em; color: var(--muted); font-weight: 400; }
a { color: var(--accent); text-underline-offset: 3px; }

.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

/* ボタン */
.btn, .btn-sub {
  font: inherit; font-weight: 700; min-height: 44px; padding: 0 18px;
  border-radius: var(--radius); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--on-accent);
}
.btn-sub { background: transparent; color: var(--accent); }
.btn-small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn-danger { background: var(--ng); border-color: var(--ng); color: var(--surface); }
.btn-danger-text { color: var(--ng); border-color: var(--ng); }
.btn:disabled, .btn-sub:disabled, .mode:disabled, a.btn[aria-disabled="true"] {
  opacity: 0.45; cursor: not-allowed;
}
.btn-text {
  font: inherit; font-size: 14px; background: none; border: 0; padding: 8px 4px;
  color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.btn-flag {
  font: inherit; font-size: 13px; white-space: nowrap; flex: none;
  min-height: 36px; padding: 0 10px; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--line);
}
.btn-flag[aria-pressed="true"] { color: var(--text); border-color: var(--print); background: var(--print-soft); }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-between { justify-content: space-between; }
.row-end { justify-content: flex-end; }

/* 面 */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: grid; gap: 12px;
}
.section-title {
  font-size: 15px; padding-bottom: 6px; border-bottom: 1.5px solid var(--print);
  letter-spacing: 0.04em;
}
.notice {
  border-left: 4px solid var(--print); background: var(--print-soft);
  padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 14px;
}

/* ホーム */
.top {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-bottom: 10px; border-bottom: 2px solid var(--print);
}
.brand { font-size: 19px; letter-spacing: 0.02em; }
.version {
  font: 700 13px/1 var(--mono); padding: 8px 10px; min-height: 36px; border-radius: 999px;
  border: 1.5px solid var(--print); background: transparent; color: var(--text); cursor: pointer;
}
.intro { display: grid; gap: 12px; }
.lead { color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 0; }
.stats dt { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.stats dd { margin: 0; font: 700 28px/1.2 var(--mono); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode {
  font: inherit; text-align: left; cursor: pointer; min-height: 64px;
  display: grid; gap: 2px; padding: 10px 14px; border-radius: var(--radius);
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
}
.mode:not(:disabled):hover { border-color: var(--accent); }
.mode-label { font-weight: 700; }
.mode-sub { font-size: 13px; color: var(--muted); }

.cats { list-style: none; margin: 0; padding: 0; display: grid; }
.cat {
  display: grid; grid-template-columns: 2.2em 1fr auto auto; gap: 10px; align-items: center;
  padding: 8px 0; border-top: 1px dashed var(--line);
}
.cat:first-child { border-top: 0; }
.cat-no { font: 700 13px var(--mono); color: var(--print); }
.cat-stat { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cat-rate { width: 3.2em; text-align: right; }
.cat-count { width: 3.8em; text-align: right; color: var(--muted); }
.bar { width: 72px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); }
.result .cat { grid-template-columns: 2.2em 1fr auto; }

.foot { display: grid; gap: 12px; padding-top: 8px; }
.disclaimer { font-size: 12px; color: var(--muted); }

/* 問題 */
.q-bar { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress-fill { display: block; height: 100%; background: var(--accent); transition: width 0.2s; }
.question { display: grid; gap: 12px; }
.q-meta { font-size: 13px; color: var(--muted); }
.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.q-text { font-size: 16px; font-weight: 500; line-height: 1.8; }
.q-no { font: 700 14px var(--mono); color: var(--print); margin-right: 8px; }

.choices { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.choice {
  font: inherit; color: var(--text); text-align: left; width: 100%;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  min-height: 52px; padding: 10px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
}
button.choice { cursor: pointer; }
button.choice:not(:disabled):hover { border-color: var(--pencil); }
button.choice:disabled { cursor: default; }
.mark {
  width: 22px; height: 34px; border-radius: 50%;
  border: 1.5px solid var(--print); color: var(--print);
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 12px var(--mono); flex: none;
}
.choice-text { overflow-wrap: anywhere; }
.choice-tag { font-size: 12px; font-weight: 700; white-space: nowrap; }
.choice.is-selected { border-color: var(--pencil); }
.choice.is-selected .mark { background: var(--pencil); border-color: var(--pencil); color: var(--on-pencil); }
.choice.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.is-correct .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.choice.is-correct .choice-tag { color: var(--ok); }
.choice.is-wrong { border-color: var(--ng); background: var(--ng-soft); }
.choice.is-wrong .mark { background: var(--ng); border-color: var(--ng); color: var(--surface); }
.choice.is-wrong .choice-tag { color: var(--ng); }

.feedback { display: grid; gap: 10px; }
.feedback:empty { display: none; }
.verdict { font-size: 18px; font-weight: 700; }
.verdict.is-correct { color: var(--ok); }
.verdict.is-wrong { color: var(--ng); }
.explain {
  display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--print);
}
.sources { font-size: 13px; }
.sources-label { font-weight: 700; color: var(--muted); }
.sources ul { margin: 2px 0 0; padding-left: 1.2em; }
.sources a { overflow-wrap: anywhere; }
.nav { padding-top: 4px; }

/* 結果 */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
.score-main { font: 700 44px/1 var(--mono); }
.score-rate { font: 700 24px var(--mono); color: var(--accent); }
.score-comment { color: var(--muted); }
.marks { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 14px; height: 22px; border-radius: 50%; border: 1.5px solid var(--print); }
.dot.is-correct { background: var(--pencil); border-color: var(--pencil); }
.reviews { display: grid; gap: 8px; }
.review { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.review summary {
  cursor: pointer; list-style: none; display: grid; grid-template-columns: auto auto 1fr; gap: 10px;
  align-items: center; padding: 10px 12px; min-height: 44px;
}
.review summary::-webkit-details-marker { display: none; }
.review-mark { font-weight: 700; width: 1.2em; text-align: center; }
.review.is-correct .review-mark { color: var(--ok); }
.review.is-wrong .review-mark { color: var(--ng); }
.review-id { font: 700 12px var(--mono); color: var(--muted); white-space: nowrap; }
.review-q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-body { display: grid; gap: 12px; padding: 4px 12px 14px; }
.chip {
  font: inherit; font-size: 13px; min-height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--text); border: 1px solid var(--line);
}
.chip[aria-pressed="true"] { background: var(--pencil); border-color: var(--pencil); color: var(--on-pencil); }

/* 模擬試験 */
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.resume { display: grid; gap: 12px; }
.exam-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-inline: -16px; padding: 10px 16px;
  background: var(--bg); border-bottom: 2px solid var(--print);
}
.timer { font: 700 18px var(--mono); }
.timer.is-warn { color: var(--ng); font-weight: 800; }
.answered { font-size: 13px; color: var(--muted); margin-right: auto; }
.exam-panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; display: grid; gap: 10px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.cell {
  position: relative; font: 700 13px var(--mono); min-height: 40px; cursor: pointer;
  border-radius: var(--radius); background: transparent; color: var(--text);
  border: 1.5px solid var(--print);
}
.cell.is-done { background: var(--pencil); border-color: var(--pencil); color: var(--on-pencil); }
.cell.is-current { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell-flag { position: absolute; top: -4px; right: -2px; font-size: 12px; color: var(--ng); }

/* ダイアログ */
.dialog {
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--text);
}
.dialog::backdrop { background: rgba(10, 15, 18, 0.55); }
.dialog-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 14px 16px; border-bottom: 1.5px solid var(--print);
}
.dialog-x {
  font: inherit; font-size: 22px; line-height: 1; width: 40px; height: 40px; cursor: pointer;
  border: 0; border-radius: var(--radius); background: transparent; color: var(--muted);
}
.dialog-body { padding: 16px; display: grid; gap: 12px; }
.dialog-actions {
  padding: 12px 16px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;
}
.dialog-meta { font-weight: 700; }
.radios { border: 0; margin: 0; padding: 0; display: grid; gap: 4px; }
.radios legend { font-weight: 700; margin-bottom: 4px; padding: 0; }
.radio { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.radio input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.field-label { font-weight: 700; }
textarea {
  font: inherit; width: 100%; padding: 8px 10px; border-radius: var(--radius);
  background: var(--bg); color: var(--text); border: 1px solid var(--line); resize: vertical;
}
.form-status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.log { display: grid; gap: 4px; }
.log ul { margin: 0; padding-left: 1.3em; }


/* ホームの入口（版数1.4） */
.entries { display: grid; gap: 12px; }
.entry {
  font: inherit; text-align: left; cursor: pointer; width: 100%;
  display: grid; gap: 4px; padding: 18px 20px; border-radius: 10px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line); border-left: 6px solid var(--accent);
}
.entry:not(:disabled):hover { border-color: var(--accent); }
.entry:disabled { opacity: 0.5; cursor: not-allowed; }
.entry-label { font-size: 20px; font-weight: 700; }
.entry-lead { color: var(--muted); font-size: 14px; }
.entry-status { font-size: 14px; font-weight: 700; color: var(--accent); }
.foot-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.btn-danger-link { color: var(--ng); }

/* 単語集（版数1.4） */
.progress-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-weight: 700; }
.bar-wide { width: 160px; }
.gl-filters { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
select, input[type="search"] {
  font: inherit; width: 100%; min-height: 44px; padding: 6px 10px; border-radius: var(--radius);
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
}
.check { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.term-list { list-style: none; margin: 0; padding: 0; display: grid; }
.term-list > li { border-top: 1px dashed var(--line); }
.term-list > li:first-child { border-top: 0; }
.term-row {
  font: inherit; color: var(--text); text-align: left; width: 100%; cursor: pointer;
  display: grid; grid-template-columns: 1.6em minmax(7em, auto) auto 1fr; gap: 10px; align-items: baseline;
  padding: 10px 4px; min-height: 44px; background: transparent; border: 0;
}
.term-row:hover .term-name { color: var(--accent); }
.term-marks { color: var(--ok); font-weight: 700; white-space: nowrap; }
.term-count { font-size: 12px; white-space: nowrap; }
.term-views { font-size: 13px; }
.term-back { justify-self: start; }
.term-back-slot:empty { display: none; }
.term-back-slot { margin-bottom: 8px; }
.term-name { font-weight: 700; }
.term-short-line { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.term-empty { padding: 12px 4px; }
.term { display: grid; gap: 12px; }
.term-title { font-size: 22px; }
.term-meta { font-size: 13px; }
.term-block { display: grid; gap: 4px; }
.term-block h3 { font-size: 13px; color: var(--muted); letter-spacing: 0.06em; }
.term-short p { font-size: 16px; font-weight: 700; }
.term-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.q-terms { display: grid; gap: 4px; font-size: 13px; }

/* スマートフォン */
@media (max-width: 560px) {
  body { font-size: 14.5px; }
  .modes { grid-template-columns: 1fr; }
  .cat { grid-template-columns: 2em 1fr auto; row-gap: 4px; }
  .cat-stat { grid-column: 2 / 3; }
  .cat .btn-small { grid-row: 1 / 3; grid-column: 3; }
  .bar { width: 56px; }
  .row-between > .btn, .row-between > .btn-sub { flex: 1 1 auto; }
  .q-head { flex-direction: column; }
  .term-row { grid-template-columns: 1.6em 1fr auto; row-gap: 2px; }
  .term-short-line { grid-column: 2 / 4; white-space: normal; }
  .gl-filters { grid-template-columns: 1fr; }
  .entry-label { font-size: 18px; }
  .score-main { font-size: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* Webサイト版（詳細設計書 11.7） */
.install-hint, .migrate { display: grid; gap: 6px; }
.install-hint .btn-text { justify-self: end; }
.transfer-block { display: grid; gap: 8px; margin-top: 12px; }
.transfer-block h3 { font-size: 15px; }
.update-bar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; max-width: calc(100% - 32px);
  background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
}
</style>
</head>

<div id="app" class="app"></div>
<script type="application/json" id="app-data">{"target":"site","config":{"appName":"G検定マークドリル（非公式）","version":"α0.3","asOf":"2026-09-26","siteUrl":"https://valorantuser0329-design.github.io/drill-jn2aqsya/","exam":{"questionCount":72,"minutes":50},"practice":{"randomCount":10},"form":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSds-okBz4KrO4cF_lLzR8Y6eRlhDMb0VxAxJ4a4J-rucHT-qA/viewform","entries":{"questionId":"entry.1705847984","version":"entry.1564915346","type":"entry.269637810","comment":"entry.1235583590"}}},"categories":[{"id":1,"name":"人工知能とは","quota":8},{"id":2,"name":"人工知能をめぐる動向","quota":10},{"id":3,"name":"機械学習の概要","quota":16},{"id":4,"name":"ディープラーニングの概要","quota":14},{"id":5,"name":"ディープラーニングの要素技術","quota":18},{"id":6,"name":"ディープラーニングの応用例","quota":18},{"id":7,"name":"AIの社会実装に向けて","quota":8},{"id":8,"name":"AIに必要な数理・統計知識","quota":8},{"id":9,"name":"AIに関する法律と契約","quota":12},{"id":10,"name":"AI倫理・AIガバナンス","quota":8}],"questions":[{"id":"Q-001","category":1,"question":"人工知能（AI）の定義に関する説明として、最も適切なものはどれか。","choices":["研究者によって定義が異なり、広く統一された定義は定まっていない","ロボットなどの身体に搭載されていることが、定義上の必須条件である","人間の脳と同じ仕組みで動いていることが、定義上の必須条件である","1980年代に日本の国家プロジェクトの中で、初めて名付けられた言葉である"],"answer":0,"explanation":"人工知能の定義は研究者によって異なり、統一されたものはありません。そもそも「知能」自体の定義が難しいことが背景にあります。人工知能学会が紹介しているマッカーシーの説明では、「知的な機械，特に，知的なコンピュータプログラムを作る科学と技術」とされています。\nロボットなどへの搭載は必須ではありません。人工知能は「考える」という目に見えない働きを対象にした研究分野です。\n人間の脳と同じ仕組みで動く必要もありません。人間と同じような知的な結果が得られれば、その原理が人間と同じかコンピュータ独自のものかは問わないとされます。\n「人工知能」という言葉は、1956年のダートマス会議でジョン・マッカーシーが使ったのが始まりです。1980年代の日本の国家プロジェクト（第五世代コンピュータ）とは関係ありません。","sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"人工知能学会「人工知能のFAQ」","url":"https://www.ai-gakkai.or.jp/whatsai/AIfaq.html"}],"status":"active"},{"id":"Q-002","category":1,"question":"人工知能を「単純な制御プログラム」「古典的な人工知能」「機械学習を取り入れた人工知能」「ディープラーニングを取り入れた人工知能」の4つのレベルに分けて考えるとき、ディープラーニングを取り入れた人工知能の特徴として、最も適切なものはどれか。","choices":["対象を見分ける手がかりとなる特徴量を、データから自ら獲得できる","人が記述した知識とルールだけを使って、推論や探索を行う","決められた入力に対して、あらかじめ決めた動作だけを行う","特徴量は人が設計し、データからは入力と出力の関係を学ぶ"],"answer":0,"explanation":"ディープラーニングを取り入れた人工知能は、対象を見分けるときにどこに注目すればよいか（特徴量）を、データから自ら獲得できる点が特徴です。ディープラーニングが登場する前は、特徴量を人が設計していました。\n「特徴量は人が設計し、データから入力と出力の関係を学ぶ」のは、機械学習を取り入れた人工知能の説明です。\n「人が記述した知識とルールで推論や探索を行う」のは、古典的な人工知能の説明です。第二次AIブームのエキスパートシステムがその例です。\n「決められた入力に対して決めた動作だけを行う」のは、単純な制御プログラムの説明です。","sources":[{"title":"JDLA「G検定の試験出題範囲（シラバス）G2024#6～」","url":"https://www.jdla.org/download/g%e6%a4%9c%e5%ae%9a%e3%81%ae%e8%a9%a6%e9%a8%93%e5%87%ba%e9%a1%8c%e7%af%84%e5%9b%b2-%ef%bc%88%e3%82%b7%e3%83%a9%e3%83%90%e3%82%b9%ef%bc%89g20246%ef%bd%9ev1-4/"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"}],"status":"active"},{"id":"Q-003","category":1,"question":"ダートマス会議の説明として、最も適切なものはどれか。","choices":["1956年に米国で開かれた研究会で、「人工知能」という言葉が初めて使われた","1980年代にエキスパートシステムの実用化について話し合った国際会議である","2012年に深層学習の有効性が示された、画像認識の性能を競うコンテストである","1980年代に第五世代コンピュータを開発するために日本で開かれた会議である"],"answer":0,"explanation":"ダートマス会議は、1956年に米国のダートマス大学で開かれた夏期の研究会です。ここでジョン・マッカーシーが「Artificial Intelligence（人工知能）」という言葉を使ったのが、この言葉の始まりとされます。発起人には、マッカーシーのほか、マービン・ミンスキー、クロード・シャノン、ナサニエル・ロチェスターがいました。また、アレン・ニューウェルとハーバート・サイモンが、最初の人工知能プログラムといわれる「Logic Theorist（ロジック・セオリスト）」を披露しました。\nエキスパートシステムが盛んに作られたのは、1980年代の第二次AIブームです。\n深層学習の有効性が示された画像認識のコンテストは、ILSVRC（2012年）です。\n第五世代コンピュータは、1980年代に日本政府が進めた国家プロジェクトで、ダートマス会議とは関係ありません。","sources":[{"title":"人工知能学会「人工知能の話題: ダートマス会議」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics5.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}],"status":"active"},{"id":"Q-004","category":1,"question":"第一次AIブーム（1950年代後半〜1960年代）が終わり、冬の時代を迎えた主な理由として、最も適切なものはどれか。","choices":["迷路や定理の証明のような限られた問題は解けても、複雑な現実の課題は解けなかった","専門家の知識をすべて人が記述して与える必要があり、その作業が膨大になりすぎた","ディープラーニングの学習に必要な計算資源と大量のデータが、まったく足りなかった","多くの国で法律によりAIの研究開発が禁止され、研究を続けられなくなってしまった"],"answer":0,"explanation":"第一次AIブームでは、コンピュータによる「推論」や「探索」ができるようになり、特定の問題に答えを出せるようになりました。しかし、迷路の解き方や定理の証明のような、ルールがはっきりした限られた問題（トイ・プロブレム）は解けても、さまざまな要因が絡み合う現実の課題は解けないことがわかり、ブームは下火になりました。\n知識を人が記述して与える作業が膨大になったのは、第二次AIブーム（1980年代）のエキスパートシステムの課題です。\nディープラーニングが注目されたのは第三次AIブーム（2000年代〜）で、第一次ブームの時代にはまだ使われていません。\nAIの研究開発を法律で禁止したという事実はありません。","sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}],"status":"active"},{"id":"Q-005","category":1,"question":"第二次AIブーム（1980年代）に数多く作られたエキスパートシステムが直面した課題として、最も適切なものはどれか。","choices":["必要な知識を人が記述して与える必要があり、扱える知識の範囲が限られた","大量のデータに合わせすぎてしまい、未知のデータにうまく対応できなかった","画像から特徴量を自動で学習する処理に、膨大な計算時間がかかった","同じ質問をしても推論の結果が毎回変わり、答えが一定にならなかった"],"answer":0,"explanation":"エキスパートシステムは、専門分野の知識を取り込んで推論し、その分野の専門家のようにふるまうプログラムです。当時のコンピュータは必要な情報を自ら集めることができず、人が知識をコンピュータにわかる形で記述して与える必要がありました。世の中の膨大な知識をすべて記述することはできないため、扱える知識は特定の分野に限られました。このように知識を集めて記述する作業が壁になることを「知識獲得のボトルネック」と呼びます。\n「データに合わせすぎて未知のデータに対応できない」のは、機械学習で問題になる過学習の説明です。\n画像から特徴量を自動で学習するのはディープラーニングの特徴で、エキスパートシステムは特徴量の学習を行いません。\nエキスパートシステムは記述されたルールに従って推論するため、同じ入力には同じ答えを返すのが基本です。","sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}],"status":"active"},{"id":"Q-006","category":1,"question":"チューリングテストの説明として、最も適切なものはどれか。","choices":["判定者が、対話の相手が人間か機械かを区別できなければ、機械に知能があるとみなす","機械が人間の専門家よりも速く正確に計算できれば、その機械に知能があるとみなす","機械の内部を調べて、人間の脳と同じ構造をしていれば、知能があるとみなす","機械が自分自身のプログラムを書き換えられれば、その機械に知能があるとみなす"],"answer":0,"explanation":"チューリングテストは、数学者のアラン・チューリングが1950年に論文「Computing Machinery and Intelligence」で提案した、機械に知能があるかを判定する方法です。判定者は、姿や声がわからないように画面と文字を通して、人間と機械の両方と対話します。判定者がどちらが人間かを区別できなければ、その機械には知能があるとみなします。\nこのテストが見るのは、外から見た受け答えだけです。計算の速さや正確さ、内部の仕組みが脳と同じか、自分のプログラムを書き換えられるかは、判定の基準ではありません。\nなお、このテストに合格しても本当に知能があるとは言えない、という反論として、サールの「中国語の部屋」が知られています。","sources":[{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"},{"title":"人工知能学会「人工知能のFAQ」","url":"https://www.ai-gakkai.or.jp/whatsai/AIfaq.html"}],"status":"active"},{"id":"Q-007","category":1,"question":"哲学者ジョン・サールが「中国語の部屋」という思考実験で主張しようとしたこととして、最も適切なものはどれか。","choices":["知能があるような受け答えができても、意味を理解しているとは限らない","文字の種類が多い中国語のような言語は、機械では正しく翻訳できない","十分な計算能力があれば、機械はいずれ必ず人間と同じ心を持つようになる","機械の知能は、人間が機械と気づかずに会話できるかどうかで測るべきである"],"answer":0,"explanation":"中国語の部屋は、次のような思考実験です。中国語がわからない人が部屋の中にいて、中国語の文字をどう並べ替えて返せばよいかを書いた完璧な手順書を持っています。この人は手順書どおりに作業するだけで、中国語の質問に中国語で正しく答えられます。しかし、この人は中国語の意味を理解していません。サールはこの例から、知能があるように見える受け答えができても、意味を理解しているとは限らないと主張しました。これはチューリングテストへの反論です。\nサールは、本当に心を持つ「強いAI」と、知的に見える働きをするだけの「弱いAI」を区別し、強いAIは実現できないと主張しました。\n「計算能力があれば必ず人間と同じ心を持つ」は、サールが否定した強いAIの立場に近い考え方です。\n「人間が機械と気づかずに会話できるかで測る」はチューリングテストの考え方で、サールはこれを批判しました。\n機械翻訳ができるかどうかは、この思考実験の論点ではありません。","sources":[{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"}],"status":"active"},{"id":"Q-008","category":1,"question":"人工知能における「フレーム問題」の説明として、最も適切なものはどれか。","choices":["無数にある事柄の中から、これからの行動に関係することだけを選び出すのが難しいという問題","記号や言葉を、それが指す現実の対象や体験と、機械が結び付けられないという問題","学習に使うデータが少ないと、モデルが未知のデータにうまく対応できないという問題","画像の枠（フレーム）の外にある物体を、機械がまったく認識できないという問題"],"answer":0,"explanation":"フレーム問題は、1969年にジョン・マッカーシーとパトリック・ヘイズが指摘した問題です。現実の世界で何か行動しようとすると、考えられる事柄は無数にあります。その中から、今の行動に関係のあることだけを選び出すのは、実はとても難しいという問題です。たとえば、「机の上のコップを取ってきて」と頼まれたロボットが、コップを動かしたら何が起きるかをすべて確かめようとすると、関係のない事柄まで考え続けることになり、いつまでも動けません。チェスのように扱う範囲が限られた課題ではこの問題は起きませんが、さまざまな状況に対応するAIでは避けて通れません。\n「記号を現実の対象と結び付けられない」のは、シンボルグラウンディング問題の説明です。\n「データが少ないと未知のデータに対応できない」のは、機械学習における汎化性能の問題です。\n画像の枠（フレーム）とは関係ありません。名前が似ているだけです。","sources":[{"title":"人工知能学会「人工知能の話題: フレーム問題」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics1.html"},{"title":"Stevan Harnad \"The Symbol Grounding Problem\" (arXiv:cs/9906002)","url":"https://arxiv.org/abs/cs/9906002"}],"status":"active"},{"id":"Q-009","category":1,"question":"「AI効果」の説明として、最も適切なものはどれか。","choices":["AIがある課題を解けるようになると、その課題は知能が必要な問題とみなされなくなっていく現象","AIを導入した企業で、導入する前と比べて業務の効率が大きく向上するという現象","AIの能力が人間を上回り、その後の技術の進歩を人間が予測できなくなるという現象","AIと長く会話を続けるうちに、人間が相手を本物の人間だと思い込んでしまう現象"],"answer":0,"explanation":"AI効果とは、AIがある課題を解けるようになると、その課題が「知能が必要な問題」とはみなされなくなっていく現象です。多くの課題は、本格的な知能がなくても解けてしまいます。解ける仕組みがわかると「ただの計算」「ただの自動化」と受け止められ、AIの成果として数えられなくなります。その結果、「AI」と呼ばれるものは、いつもまだ解けていない課題の側に移っていきます。\n「業務の効率が向上する」は、AIを導入した効果の一般的な説明で、AI効果という用語の意味ではありません。\n「AIが人間を上回り、進歩を予測できなくなる」は、シンギュラリティ（技術的特異点）の説明です。\n「会話の相手を本物の人間だと思い込む」は、人間が機械に人間らしさを感じてしまう傾向の話で、AI効果とは別の現象です。","sources":[{"title":"José Hernández-Orallo \"AI Evaluation: past, present and future\" (arXiv:1408.6908) p.1","url":"https://arxiv.org/abs/1408.6908"}],"status":"active"},{"id":"Q-010","category":1,"question":"人工知能の分野でいう「エージェント」の説明として、最も適切なものはどれか。","choices":["周囲の環境の状況に応じて、自らの判断で行動するプログラムやシステム","人間の代わりに契約を結ぶ権限を、法律で特別に認められたAIのこと","学習に使うデータに、正解のラベルを付ける作業を担当する人のこと","ネットワークにつながらず、1台の計算機の中だけで動くプログラム"],"answer":0,"explanation":"エージェントとは、周囲の環境（外界）の状況に応じて、自らの判断で行動するプログラムやシステムのことです。人工知能を「計算機の中で答えを出すもの」ではなく「外界で自分の判断で行動するもの」として捉え直す考え方で、Webから情報を集めるプログラムからロボットまで、幅広いものがエージェントと呼ばれます。複数のエージェントが関わり合うシステムは、マルチエージェントシステムと呼ばれます。\nAIに契約を結ぶ権限を法律で認める制度はありません。\nデータに正解のラベルを付ける作業はアノテーションと呼ばれ、エージェントとは関係ありません。\nエージェントは1台の計算機の中にとどまらず外界で行動するものとして考えられており、「1台の計算機の中だけで動く」ことは定義ではありません。","sources":[{"title":"人工知能学会「私のブックマーク: 知的エージェント（WWWを中心に）」（学会誌 Vol.14 No.5, 1999）","url":"https://www.ai-gakkai.or.jp/resource/my-bookmark/my-bookmark_vol14-no5/"}],"status":"active"},{"id":"Q-011","category":1,"question":"「シンギュラリティ（技術的特異点）」に関する説明として、最も適切なものはどれか。","choices":["人間を超える人工知能が実現する時点を指す言葉で、カーツワイルはそれが2045年に訪れると予測した","「人工知能」という言葉が初めて使われた時点を指す言葉で、1956年のダートマス会議がそれにあたる","深層学習が初めて画像認識のコンテストで優勝した時点を指す言葉で、2012年がそれにあたるとされる","第二次AIブームが終わって冬の時代に入った時点を指す言葉で、1995年ごろがそれにあたるとされる"],"answer":0,"explanation":"シンギュラリティ（技術的特異点）は、人間を超える人工知能が実現する時点を指す言葉です。レイ・カーツワイル博士は、シンギュラリティに到達するのは2045年だと予測しました。\nこの予測には異論もあります。たとえば総務省の研究会（2015年）では、2045年の時点では、一部の能力で人間を上回るAIはできても、人間の身体や社会の中で人間と同じように働けるAIは実現しないという認識が主でした。ただし、より長い期間で見れば人間を超えるAIが実現し得るとしています。\n「人工知能」という言葉が初めて使われたのは1956年のダートマス会議ですが、これはシンギュラリティとは関係ありません。\n深層学習が画像認識コンテストで注目を集めたのは2012年のILSVRCで、これもシンギュラリティとは別の出来事です。\n第二次AIブームは1995年ごろに終わりましたが、これもシンギュラリティとは関係ありません。","sources":[{"title":"総務省「インテリジェント化が加速するICTの未来像に関する研究会 報告書2015」（2015年6月）pp.5, 7","url":"https://www.soumu.go.jp/main_content/000363712.pdf"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）研究の歴史」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142120.html"}],"status":"active"},{"id":"Q-012","category":1,"question":"人工知能の議論で「身体性」が重視される理由として、最も適切なものはどれか。","choices":["言葉や概念の意味を理解するには、身体を通して外界を感じ取り、働きかける経験が重要だと考えられるため","人間と同じ見た目のロボットにしないと、利用者がAIの判断を信用しないことが実験で確かめられたため","身体を持つロボットに組み込まないと、AIの計算の速さが十分に上がらないことがわかっているため","AIは物理的な身体を持つ機械に必ず組み込んで使うことが、法律で義務づけられているため"],"answer":0,"explanation":"身体性とは、知能や意味の理解には、身体を通して外界を感じ取り、外界に働きかける経験が重要だという考え方です。たとえば、記号だけを扱うコンピュータは、「りんご」という記号を別の記号で説明することはできても、りんごを見たり触ったりした経験と結び付けることはできません（シンボルグラウンディング問題）。この問題に取り組んだハルナッドは、記号の意味は、感覚から得られる表現に根ざしている必要があると論じました。こうした背景から、ロボットなどの身体を通してAIが経験を得られるようになるかが、研究の課題の一つとされています。\n見た目が人間に似ているかどうかで信頼が決まるという実験結果が、身体性が重視される理由ではありません。\nAIの計算の速さは身体の有無では決まりません。AIがロボットなどの特定の形に組み込まれている必要もありません。\nAIを必ず身体を持つ機械に組み込むよう義務づける法律はありません。","sources":[{"title":"Stevan Harnad \"The Symbol Grounding Problem\" (arXiv:cs/9906002)","url":"https://arxiv.org/abs/cs/9906002"},{"title":"総務省 平成28年版 情報通信白書「代表的な研究テーマ」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142130.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}],"status":"active"},{"id":"Q-013","category":1,"question":"機械翻訳の方式に関する説明として、最も適切なものはどれか。","choices":["統計的機械翻訳は、大量の対訳データから翻訳の規則や確率を自動的に学ぶ方式である","ルールベース機械翻訳は、大量の対訳データから翻訳の規則を自動的に学ぶ方式である","統計的機械翻訳は、人が書いた文法の規則と辞書だけを使って翻訳する方式である","ルールベース機械翻訳は、ニューラル機械翻訳より後に登場した新しい方式である"],"answer":0,"explanation":"統計的機械翻訳は、ある言語の文と別の言語の訳文を対にした大量のデータ（対訳コーパス）から、翻訳の規則やその確からしさを統計的に自動で学ぶ方式です。\nルールベース機械翻訳は、人が翻訳の規則（ルール）と辞書を書き、それに従って翻訳する方式です。人が矛盾なく書ける規則の数には限りがあり、多様な表現に対応するのは難しいという限界がありました。\n情報通信研究機構（NICT）の音声翻訳の研究では、1986年ごろはルールベースが主流で、2000年代ごろにコーパスを使う統計的な方式が主流になり、2010年代半ばからはニューラルネットワークを使う方式（ニューラル機械翻訳）が主流になりました。ルールベースは、ニューラル機械翻訳より前の方式です。\n「統計的機械翻訳が人の書いた規則と辞書だけで翻訳する」は、ルールベース機械翻訳の説明と入れ替わっています。","sources":[{"title":"情報通信研究機構研究報告 Vol.68 No.2（2022）「2-1 多言語コミュニケーション技術の概要」p.4","url":"https://www.nict.go.jp/publication/shuppan/kihou-journal/houkoku68-2_HTML/2022U-02-01.pdf"},{"title":"Felix Stahlberg \"Neural Machine Translation: A Review and Survey\" (arXiv:1912.02047)","url":"https://arxiv.org/abs/1912.02047"}],"status":"active"},{"id":"Q-014","category":1,"question":"ローブナーコンテスト（ローブナー賞）の説明として、最も適切なものはどれか。","choices":["チューリングテストの考え方にもとづき、人間らしく会話できるプログラムを競った大会","囲碁や将棋などのゲームで、人間のトップ棋士に勝てるプログラムを競った大会","大量の画像を使って、画像の中の物体を分類する正確さをプログラムで競った大会","自動運転車が、市街地のコースを無人で走り切れるかどうかを競った大会"],"answer":0,"explanation":"ローブナーコンテストは、チューリングテストを実際の大会の形にしたもので、1991年から2019年まで毎年開かれました。判定者が文字で会話し、相手がプログラムか人間かを見分けます。人間らしく会話できるプログラムほど高く評価されました。一方で、知能よりも判定者をだますことが重視される、短時間の判定に頼っている、といった批判もありました。\n囲碁や将棋でトップ棋士に勝つことを目指したプログラムの例には、2016年に囲碁のトップ棋士に勝ったアルファ碁がありますが、ローブナーコンテストとは関係ありません。\n画像の分類の正確さを競う大会や、自動運転車の走行を競う大会は、会話の人間らしさを競うローブナーコンテストとは別のものです。","sources":[{"title":"Avraham Rahimov, Orel Zamler, Amos Azaria \"The Turing Test is More Relevant Than Ever\" (arXiv:2505.02558)","url":"https://arxiv.org/abs/2505.02558"},{"title":"人工知能学会「人工知能の話題: チューリングテストと中国語の部屋」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics3.html"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}],"status":"active"},{"id":"Q-015","category":2,"question":"探索木を使った探索の方法に関する説明として、最も適切なものはどれか。","choices":["幅優先探索は、出発点に近いものから順に調べるため、最短の経路を見つけるのに使える","幅優先探索は、一つの枝を行き止まりまでたどってから、次の枝へ戻って調べる方法である","深さ優先探索は、出発点に近いものから順に調べるため、必ず最短の経路が見つかる","深さ優先探索は、すべての枝を同時に同じ深さまで調べるため、最も多くの記憶を使う"],"answer":0,"explanation":"探索は、問題をコンピュータが扱える形に表し、探索木などを使って解を探す方法で、第一次AIブームの中心的な研究テーマでした。\n幅優先探索は、出発点のすぐ隣、その隣、さらにその隣というように、出発点から近いものから順に調べます。近い順に見つかるので、最短の経路を求めるのに使えます。調べる候補は、先に入れたものから順に取り出す「キュー」で管理します。\n深さ優先探索は、一つの枝を行き止まりまでたどってから戻り、次の枝を調べる方法です。候補は、最後に入れたものから取り出す「スタック」で管理します（再帰的な処理でも書けます）。最初に見つかった経路が最短とは限りません。\n「一つの枝を行き止まりまでたどる」のは深さ優先探索の説明で、「近いものから順に調べる」のは幅優先探索の説明です。","sources":[{"title":"Pat Morin \"Open Data Structures\" 12.3 Graph Traversal（CC BY）","url":"https://opendatastructures.org/ods-python/12_3_Graph_Traversal.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}],"status":"active"},{"id":"Q-016","category":2,"question":"3本の棒と大きさの異なる円盤を使う「ハノイの塔」で、円盤が4枚のとき、すべての円盤を別の棒に移すのに必要な最少の移動回数はどれか。ただし、一度に動かせるのは一番上の円盤1枚だけで、小さい円盤の上に大きい円盤を置くことはできない。","choices":["15回","8回","16回","31回"],"answer":0,"explanation":"円盤がn枚のハノイの塔は、最少で「2のn乗−1」回の移動で解けることが知られています。4枚なら 2^4 − 1 = 16 − 1 = 15回です。\n考え方は再帰的です。n枚を移すには、①上のn−1枚を補助の棒へ移す、②一番大きい円盤を目的の棒へ移す、③n−1枚を目的の棒へ移す、という順で行います。1枚なら1回、2枚なら3回、3枚なら7回、4枚なら15回と増えていきます。\n16回は2^4をそのまま計算した場合、31回は円盤が5枚の場合の回数です。8回では足りません。\nハノイの塔は、ルールがはっきりした「トイ・プロブレム」の代表例で、探索の例題としてよく使われます。","sources":[{"title":"\"The weighted Tower of Hanoi\" (arXiv:2208.06705)","url":"https://arxiv.org/abs/2208.06705"}],"status":"active"},{"id":"Q-017","category":2,"question":"対戦ゲームの探索で使われるMini-Max法とαβ法に関する説明として、最も適切なものはどれか。","choices":["αβ法は、Mini-Max法で調べる必要のない枝の探索を打ち切り、計算量を減らす工夫である","αβ法は、盤面の評価をやめて、ランダムに打った結果の勝率だけで手を選ぶ方法である","Mini-Max法は、相手がこちらに都合のよい手を選んでくれると仮定して、手を選ぶ方法である","Mini-Max法は、ゲームの木を最後まで調べられない場合には、まったく使うことができない"],"answer":0,"explanation":"Mini-Max法は、自分の番では評価が最大になる手を、相手の番では（相手にとって最善の、つまり自分にとって）評価が最小になる手を選ぶと考えて、ゲームの木をさかのぼって最善手を決める方法です。最後まで読み切れない場合は、決めた深さまで探索し、そこで評価関数を使って盤面の良し悪しを見積もります。\nαβ法は、Mini-Max法の結果に影響しないことがわかった枝の探索を途中で打ち切る（枝刈りする）ことで、同じ結果をより少ない計算で得る工夫です。\n「ランダムに打った結果の勝率で手を選ぶ」のは、モンテカルロ法（モンテカルロ木探索）の説明です。\nMini-Max法は、相手がこちらに都合のよい手を選んでくれるとは仮定しません。相手は相手にとって最善の手（こちらにとって最も不利な手）を選ぶと考えます。","sources":[{"title":"Aske Plaat \"Deep Reinforcement Learning\" (arXiv:2201.02135) 17.1 Move-Level Self-Play","url":"https://arxiv.org/abs/2201.02135"},{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"}],"status":"active"},{"id":"Q-018","category":2,"question":"囲碁のプログラムで使われるモンテカルロ法（モンテカルロ木探索）の説明として、最も適切なものはどれか。","choices":["ある局面から終局までランダムに打つ試行を多数行い、その結果の勝率をもとに手を選ぶ","すべての指し手の組み合わせを最後まで調べ尽くして、必ず勝てる手順を見つけ出す","専門家が作った評価関数で盤面の良し悪しを計算し、評価の最も高い手だけを選ぶ","過去のプロの対局の棋譜を丸ごと記憶しておき、同じ局面で打たれた手をそのまま打つ"],"answer":0,"explanation":"モンテカルロ法（モンテカルロ木探索）は、ある局面から終局までランダムに打ち進める試行（プレイアウト）を多数行い、勝った割合の高い手を有望とみなして選ぶ方法です。専門家が作った評価関数がなくても、ゲームのルールさえわかれば使えるのが特徴で、盤面の評価が難しい囲碁のプログラムを大きく強くしました。さらに、アルファ碁はモンテカルロ木探索と深層強化学習を組み合わせました。\n「すべての組み合わせを調べ尽くす」のは、ブルートフォース（しらみつぶし）の考え方です。囲碁は組み合わせが膨大なため、現実的な時間では調べ尽くせません。\n「専門家が作った評価関数で最も高い手を選ぶ」のは、モンテカルロ法以前に主流だった、Mini-Max法と評価関数による方法の説明です。\n棋譜をそのまま記憶して打つ方法は、モンテカルロ法ではありません。","sources":[{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"},{"title":"Aske Plaat \"Deep Reinforcement Learning\" (arXiv:2201.02135) 17.1 Move-Level Self-Play","url":"https://arxiv.org/abs/2201.02135"}],"status":"active"},{"id":"Q-019","category":2,"question":"自動計画（プランニング）の研究で知られるSTRIPSの説明として、最も適切なものはどれか。","choices":["行動を「前提条件」「追加される事実」「削除される事実」の組で表し、計画を立てる枠組み","積み木の世界で、人間が英語で出した指示を理解して、ロボットアームで積み木を動かすシステム","人間の神経細胞の働きをまねた人工ニューロンを組み合わせて、画像の中の文字を認識する方式","専門家の知識をルールとして蓄え、患者の症状から病気を診断して治療法を助言するシステム"],"answer":0,"explanation":"STRIPSは、1971年にファイクスとニルソンが発表した自動計画（プランニング）の枠組みです。それぞれの行動を、その行動を行うために成り立っている必要がある「前提条件」と、行動した結果として新しく成り立つ事実（追加リスト）、成り立たなくなる事実（削除リスト）の組で表します。これを使って、初めの状態から目標の状態にたどり着くための行動の並びを探します。STRIPSの考え方は、その後の計画記述言語に大きな影響を与えました。\n「積み木の世界で英語の指示を理解してロボットアームを動かす」のは、ウィノグラードのSHRDLUの説明です。\n「人工ニューロンを組み合わせて文字を認識する」のは、ニューラルネットワークの説明です。\n「ルールで症状から病気を診断する」のは、MYCINのようなエキスパートシステムの説明です。","sources":[{"title":"Diego Aineto ほか \"Learning Strips Action Models with Classical Planning\" (arXiv:1903.01153)","url":"https://arxiv.org/abs/1903.01153"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}],"status":"active"},{"id":"Q-020","category":2,"question":"1971年にテリー・ウィノグラードがデモを行ったSHRDLUの説明として、最も適切なものはどれか。","choices":["積み木の世界について英語で指示を受け、その内容を理解してロボットアームを動かした","精神科医のように受け答えし、利用者の言葉の一部を使って質問を返す会話プログラムである","化合物の質量スペクトルを解析し、その化合物の構造を推定した知識ベースのプログラムである","人間の常識をすべて記述してコンピュータに蓄えることを目指した、長期の研究プロジェクトである"],"answer":0,"explanation":"SHRDLUは、1971年にウィノグラードがデモを行ったプログラムです。積み木が置かれた限られた世界（積み木の世界）を対象に、人間が英語で出した指示を理解し、指示どおりにロボットアームを動かしました。限られた世界の中とはいえ、自然言語の理解と行動を結び付けた点で注目されました。\n「精神科医のように受け答えする会話プログラム」は、ワイゼンバウムのELIZA（イライザ）です。\n「化合物の質量スペクトルを解析した知識ベースのプログラム」は、DENDRALです。\n「人間の常識をすべて記述して蓄えるプロジェクト」は、1984年にレナートが始めたCycプロジェクトです。","sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}],"status":"active"},{"id":"Q-021","category":2,"question":"1960年代半ばにジョセフ・ワイゼンバウムが開発したELIZA（イライザ）の説明として、最も適切なものはどれか。","choices":["入力文のパターンに合わせて決まった形で応答し、意味を理解せずに会話しているように見せた","大量の文章から学習した言語モデルを使い、質問の意味を理解して新しい文章を生成して答えた","専門家の知識をルールとして蓄え、患者の症状を聞き取って病気を診断し、治療法を助言した","英語で出された指示を理解し、積み木の世界でロボットアームを動かして指示どおりに並べた"],"answer":0,"explanation":"ELIZAは、ワイゼンバウムが開発した初期の会話プログラムです。入力された文を決まったパターンに当てはめ、利用者の言葉の一部を使って応答を組み立てることで、いろいろな話題について会話しているように見せました。精神科医（セラピスト）をまねたバージョンが特に知られています。ただし、ELIZAは入力の意味を理解していたわけではありません。それでも多くの人が、まるで理解してくれているかのように感じたことが話題になりました。\n「大量の文章から学習した言語モデルで文章を生成する」のは、近年の大規模言語モデル（LLM）の説明です。\n「ルールで症状から病気を診断する」のは、MYCINのようなエキスパートシステムの説明です。\n「積み木の世界でロボットアームを動かす」のは、SHRDLUの説明です。","sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"\"Deep Learning and Machine Learning - Natural Language Processing: From Theory to Application\" (arXiv:2411.05026) 1.1","url":"https://arxiv.org/abs/2411.05026"}],"status":"active"},{"id":"Q-022","category":2,"question":"DENDRALの説明として、最も適切なものはどれか。","choices":["化合物の質量スペクトルを解析して構造を推定し、科学の分析で成功した初期の知識ベースのプログラム","患者の症状や検査結果から病気を診断し、治療法を助言する、最初のエキスパートシステムとされる","積み木の世界で英語の指示を理解し、ロボットアームを動かした自然言語理解の初期のシステム","人間の常識をすべて記述して蓄えることを目指し、1984年に始まった大規模な知識ベースの計画"],"answer":0,"explanation":"DENDRALは、1967年にファイゲンバウムらが開発したプログラムで、化合物の質量スペクトル（分子を分解したときにできる破片の重さの分布）を解析し、化合物の構造を推定しました。専門家の知識を使って科学的な分析に成功した、最初期の知識ベースのプログラムとされます。のちのMeta-DENDRALは、化学の分野で新しい結果を得ました。\n「症状から病気を診断し治療法を助言する、最初のエキスパートシステム」は、1974年ごろのMYCINの説明です。\n「積み木の世界で英語の指示を理解する」のは、SHRDLUの説明です。\n「人間の常識をすべて記述して蓄える計画」は、Cycプロジェクトの説明です。","sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}],"status":"active"},{"id":"Q-023","category":2,"question":"MYCIN（マイシン）の説明として、最も適切なものはどれか。","choices":["医療診断の分野で、知識をルールとして表し推論するシステムの有効性を示したエキスパートシステム","大量の画像を学習した深層学習のモデルで、レントゲン写真から病気を自動で見つけるシステム","患者と会話して悩みを聞き出す精神科医のまねをした、パターン照合による会話プログラム","ウェブ上の医学論文を自動で集め、リンクの構造から重要な論文を見つけ出すシステム"],"answer":0,"explanation":"MYCINは、1974年ごろにショートリフが示したシステムで、医療診断の分野で、知識をルール（「もし〜ならば〜」の形）で表し、それを使って推論するルールベースシステムの有効性を示しました。最初のエキスパートシステムと呼ばれています。MYCINの知識表現と推論の仕組みを一般化したEMYCINは、その後の多くのエキスパートシステムを作るための道具（シェル）の原型になりました。\nエキスパートシステムは、専門家の知識を人が記述して与える必要があるため、知識を集めて記述する作業が壁になりました（知識獲得のボトルネック）。\n「深層学習で画像から病気を見つける」のは、第三次AIブーム以降の技術で、MYCINとは関係ありません。\n「精神科医のまねをした会話プログラム」はELIZAです。\n「リンクの構造から重要な論文を見つける」のは、Web構造マイニングのような技術の説明です。","sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"}],"status":"active"},{"id":"Q-024","category":2,"question":"知識表現で使われる概念どうしの関係について、最も適切なものはどれか。","choices":["「エンジンは自動車の一部」「自動車は車両の一種」のように、part-ofとis-aは異なる関係として区別する","is-aの関係は推移律が成り立たないため、「AはBの一種」「BはCの一種」から「AはCの一種」とは言えない","part-ofの関係は推移律が成り立たないため、「AはBの一部」「BはCの一部」から「AはCの一部」とは言えない","「エンジンは自動車の一部」という関係は、「エンジンは自動車の一種」とis-aで表しても意味は変わらない"],"answer":0,"explanation":"知識表現では、概念どうしの関係を区別して表します。「自動車は車両の一種」のような上位と下位の関係は is-a（〜の一種）、「エンジンは自動車の一部」のような全体と部分の関係は part-of（〜の一部）です。この二つを混同すると、「車両一般に言えることはエンジンにも言える」といった誤った推論につながるため、区別する必要があります。\nis-a の関係には推移律が成り立ちます。「AはBの一種」「BはCの一種」なら「AはCの一種」です。\n基本的な part-of の関係にも推移律が成り立つとされます。「AはBの一部」「BはCの一部」なら「AはCの一部」です。\n概念をノード、関係を矢印で結んで知識を表す方法は意味ネットワークと呼ばれ、1966年にキリアンがデモを行いました。","sources":[{"title":"W3C \"Simple part-whole relations in OWL Ontologies\"","url":"https://www.w3.org/2001/sw/BestPractices/OEP/SimplePartWhole/"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}],"status":"active"},{"id":"Q-025","category":2,"question":"オントロジーの説明として、最も適切なものはどれか。","choices":["ある分野の知識を表すための概念と概念どうしの関係を、コンピュータで扱える形で定義したもの","大量のデータから、まだ知られていない規則性や傾向を自動的に見つけ出すための分析の手法","ある局面から終局までランダムに打つ試行を繰り返して、勝率の高い手を選ぶゲームの探索手法","入力文のパターンに合わせて決まった形の応答を返すことで、人と会話しているように見せる仕組み"],"answer":0,"explanation":"オントロジーは、ある分野（医療、製造、金融など）の知識を表すために使う用語、つまり基本的な概念とそれらの関係を、コンピュータで扱える形で定義したものです。人、データベース、アプリケーションが、分野の情報を共通の意味で共有し、再利用できるようにするために使われます。ウェブ上のデータに意味を持たせて共有するセマンティックWebでは、オントロジーを記述するための言語（OWL）が標準化されています。\n「大量のデータから規則性を見つける」のは、データマイニングの説明です。\n「ランダムに打つ試行で手を選ぶ」のは、モンテカルロ法の説明です。\n「パターンに合わせて応答し会話に見せる」のは、ELIZAのような会話プログラムの説明です。","sources":[{"title":"W3C \"OWL Web Ontology Language Use Cases and Requirements\"","url":"https://www.w3.org/TR/webont-req/"},{"title":"W3C Semantic Web Activity \"What is the Semantic Web?\"","url":"https://www.w3.org/2001/sw/"}],"status":"active"},{"id":"Q-026","category":2,"question":"W3Cが推進してきたセマンティックWebの説明として、最も適切なものはどれか。","choices":["ウェブ上のデータに意味を与え、アプリケーションや組織の垣根を越えて共有・再利用できるようにする取り組み","ウェブページどうしのリンクのつながり方を調べ、ページの重要度や利用者の集団を見つけ出す研究","ウェブ上の画像を大量に集め、物体を分類する正確さを競うコンテストを毎年開く取り組み","利用者の閲覧や購入の記録をもとに、その人が興味を持ちそうな商品を画面に表示する仕組み"],"answer":0,"explanation":"セマンティックWebは、W3C（ウェブの標準を定める団体）が中心となって進めてきた取り組みで、ウェブを文書だけでなく「データのウェブ」にすることを目指します。データに意味を与える共通の枠組み（RDF）や、概念とその関係を定義するオントロジーの言語（OWL）を使い、データをアプリケーションや組織、コミュニティの垣根を越えて共有・再利用できるようにします。\n「リンクのつながり方からページの重要度や集団を見つける」のは、Web構造マイニングの説明です。\n「画像を集めて分類の正確さを競うコンテスト」は、ImageNetを使ったILSVRCのような取り組みです。\n「閲覧や購入の記録から商品を勧める」のは、レコメンデーション（推薦システム）の説明です。","sources":[{"title":"W3C Semantic Web Activity \"What is the Semantic Web?\"","url":"https://www.w3.org/2001/sw/"},{"title":"W3C \"OWL Web Ontology Language Use Cases and Requirements\"","url":"https://www.w3.org/TR/webont-req/"}],"status":"active"},{"id":"Q-027","category":2,"question":"1984年にダグラス・レナートが始めたCycプロジェクトの説明として、最も適切なものはどれか。","choices":["人間が持っている一般常識をコンピュータに蓄えることを目指した、長期にわたる知識ベースの構築","大量の画像データを集めてラベルを付け、物体認識の研究のための共通のデータセットを作る計画","大学の入学試験を題材に、AIがどこまで問題を解けるようになるかを調べる日本の研究プロジェクト","人間の脳の神経回路をすべて測定して、コンピュータの上でそのまま再現することを目指した計画"],"answer":0,"explanation":"Cycプロジェクトは、1984年にレナートが始めた、人間の一般常識をコンピュータに蓄えることを目指すプロジェクトです。専門分野に限ったエキスパートシステムでは扱えない、誰もが当たり前に知っている常識を大量の知識として記述しようとしました。人が知識を記述していく方式のため、膨大な作業が必要になりました。\n「画像を集めてラベルを付けたデータセット」は、ImageNetの説明です。\n「大学入試を題材にした日本の研究プロジェクト」は、国立情報学研究所などによる「ロボットは東大に入れるか」（東ロボくん）です。\n「脳の神経回路をすべて測定して再現する」計画は、Cycプロジェクトの目的ではありません。","sources":[{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}],"status":"active"},{"id":"Q-028","category":2,"question":"IBMのワトソン（Watson）に関する説明として、最も適切なものはどれか。","choices":["2011年に米国のクイズ番組で歴代の強豪チャンピオンに勝ち、質問応答の技術の進歩を示した","1997年にチェスの世界チャンピオンに勝ち、コンピュータが初めて人間の王者を破った例となった","2016年に囲碁のトップ棋士に4勝1敗で勝ち、深層学習と強化学習を組み合わせた力を示した","1960年代に精神科医をまねた会話を行い、人がコンピュータとの会話に引き込まれることを示した"],"answer":0,"explanation":"ワトソンは、IBMが開発した質問応答（Question-Answering）システムです。2011年、米国のクイズ番組「ジェパディ！」で、歴代の強豪チャンピオン2人に勝ちました。自然な言葉で出される難しい問題に、幅広い知識をもとに素早く、高い精度で答え、自分の答えにどれだけ自信があるかも見積もる必要があり、そのために質問応答の技術を大きく進歩させる必要がありました。\n1997年にチェスの世界チャンピオンに勝ったのは、同じIBMのディープ・ブルーです。\n2016年に囲碁のトップ棋士に4勝1敗で勝ったのは、ディープマインドのアルファ碁です。\n1960年代の精神科医をまねた会話プログラムは、ELIZAです。","sources":[{"title":"Gerald Tesauro ほか \"Analysis of Watson's Strategies for Playing Jeopardy!\" (arXiv:1402.0571)","url":"https://arxiv.org/abs/1402.0571"},{"title":"Santanu Acharjee, Upashana Gogoi \"The limit of human intelligence\" (arXiv:2310.10792)","url":"https://arxiv.org/abs/2310.10792"},{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"}],"status":"active"},{"id":"Q-029","category":2,"question":"国立情報学研究所などが2011年に始めた「ロボットは東大に入れるか」プロジェクト（東ロボくん）の説明として、最も適切なものはどれか。","choices":["大学入試をベンチマークとして、AIの要素技術の精度を高め、AIに何ができるかを明らかにしようとした","人間と同じ見た目のロボットを作り、実際に大学に通わせて人間の学生と一緒に授業を受けさせた","すべての教科の教科書と問題集を丸暗記させ、同じ問題が出たときに答えをそのまま書き出させた","大学の入学試験の採点をAIに任せ、人間の採点者を置き換えることを最終的な目的としていた"],"answer":0,"explanation":"「ロボットは東大に入れるか」は、国立情報学研究所が中心となって2011年に始めた人工知能のプロジェクトで、AIは「東ロボくん」と呼ばれました。大学入試をベンチマーク（性能を測る基準）として、自然言語処理や数式の処理などAIの各要素技術の精度を高め、AIや技術の導入で社会がどう変わるかを明らかにすることを目的としました。2016年にセンター入試で高得点を取り、2021年に東大の入試を突破することを目標に掲げていました。\n人間と同じ見た目のロボットを大学に通わせる計画ではありません。\n教科書を丸暗記して答えを書き出す方法ではなく、問題文を理解して解くための技術を研究しました。\n入試の採点をAIに任せることは目的ではありません。","sources":[{"title":"文部科学省 中央教育審議会 資料3-1 新井紀子「AIが大学入試を突破する時代に求められる人材育成」（2016年6月30日）","url":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo14/shiryo/__icsFiles/afieldfile/2016/07/04/1373986_3_1.pdf"}],"status":"active"},{"id":"Q-030","category":2,"question":"データマイニングとウェブマイニングに関する説明として、最も適切なものはどれか。","choices":["ウェブマイニングはデータマイニングの一分野で、ウェブの内容、リンクの構造、閲覧の記録などから知識を見つける","データマイニングは、専門家へのインタビューで得た知識をルールとして書き出し、知識ベースを作る作業である","ウェブマイニングは、ウェブ上の文章を翻訳するために、人が書いた文法規則と辞書を使う方法である","データマイニングは、1950年代の第一次AIブームの中で生まれ、探索と推論を中心とする手法である"],"answer":0,"explanation":"データマイニングは、大量のデータの中に埋もれている規則性や知識を見つけ出す技術で、1990年代半ばに生まれました。マイニングは「鉱山から掘り出す」という意味です。\nウェブマイニングはデータマイニングの一分野で、ウェブに書かれた内容から情報を取り出す「Web内容マイニング」、ページどうしのリンクの構造を調べる「Web構造マイニング」、閲覧の記録を扱う「Web利用マイニング」などがあります。Web構造マイニングの研究は、検索結果の表示順を決める技術などにも使われています。\n「専門家へのインタビューで知識をルールにする」のは、エキスパートシステムを作るときの知識獲得の作業で、データマイニングとは異なります。\n「文法規則と辞書で翻訳する」のは、ルールベース機械翻訳の説明です。\nデータマイニングが生まれたのは1990年代半ばで、第一次AIブームの手法ではありません。","sources":[{"title":"人工知能学会「人工知能の話題: Web構造マイニング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics6.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"}],"status":"active"},{"id":"Q-031","category":2,"question":"第三次AIブームで機械学習が進化した背景として、最も適切なものはどれか。","choices":["インターネットの普及で大量のデータ（ビッグデータ）が手に入り、計算能力も向上したこと","専門家の知識をルールとして記述する作業が自動化され、エキスパートシステムが復活したこと","迷路やパズルのような問題を探索木で解く手法が完成し、現実の問題に応用されたこと","各国の政府がデータの収集を法律で禁止したことで、少ないデータで学ぶ手法が発達したこと"],"answer":0,"explanation":"1990年代にウェブが広まり、2000年代に家庭にもネットワークが普及すると、流通するデータの量が飛躍的に増え、研究に使えるデータを大量に手に入れられるようになりました。さらに、コンピュータの計算能力が向上して膨大なデータ（ビッグデータ）を処理できるようになりました。これらが大きな要因となって機械学習が進化し、第三次AIブームを迎えました。\n機械学習は、入力されたデータからコンピュータがパターンやルールを見つけ出し、新しいデータの識別や予測に使う手法です。人がルールを書くのではなく、データから学ぶ点が、それまでの方法と異なります。\nエキスパートシステムは第二次AIブームの中心で、第三次ブームの背景ではありません。\n探索木で迷路やパズルを解く手法は、第一次AIブームの中心でした。\nデータの収集を法律で禁止したという事実はありません。","sources":[{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}],"status":"active"},{"id":"Q-032","category":2,"question":"機械学習を使ったスパムフィルタ（迷惑メールの振り分け）の説明として、最も適切なものはどれか。","choices":["迷惑メールと通常のメールに分けた大量の例から、振り分けの規則を自動的に学習する","人が考えた禁止語の一覧だけを使い、学習をせずにメールを迷惑メールと判定する","メールを受け取るたびに送信者へ電話で確認し、その結果を人が手で登録していく","メールの本文は見ずに、受信した時刻だけを手がかりにして迷惑メールかどうかを決める"],"answer":0,"explanation":"機械学習を使ったスパムフィルタは、あらかじめ「迷惑メール」と「通常のメール」に分けられた大量のメールを学習用データとして使い、どのような特徴のメールが迷惑メールかという規則を自動的に学びます。学習したモデルを使って、新しく届いたメールを振り分けます。単純ベイズ分類器（ナイーブベイズ）などがスパムフィルタに使えることが、早くから研究されてきました。学習に使うメールの量が性能に影響することも調べられています。\n「人が考えた禁止語の一覧だけで判定する」のは、学習を使わないキーワードによる方法で、機械学習によるスパムフィルタの説明ではありません。\n送信者へ電話で確認する方法や、受信時刻だけで判定する方法は、機械学習によるスパムフィルタではありません。","sources":[{"title":"Ion Androutsopoulos ほか \"An evaluation of Naive Bayesian anti-spam filtering\" (arXiv:cs/0006013)","url":"https://arxiv.org/abs/cs/0006013"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}],"status":"active"},{"id":"Q-033","category":2,"question":"レコメンデーション（推薦システム）の方式の一つである協調フィルタリングの説明として、最も適切なものはどれか。","choices":["多くの利用者の評価を集め、好みが似ている利用者が高く評価したものを勧める","商品の監督や作者、ジャンルといった内容の情報だけをもとに、似た商品を勧める","利用者の評価は使わず、売上の多い商品から順番にすべての利用者に同じものを勧める","専門家が一つ一つの商品について書いた推薦のルールに従って、決まった商品を勧める"],"answer":0,"explanation":"レコメンデーション（推薦システム）は、利用者が興味を持ちそうなものを選んで勧める仕組みで、電子商取引のサイトなどで使われています。主な方式には次の二つがあります。\n協調フィルタリングは、たくさんの利用者から「これは良かった」「つまらなかった」という評価を集め、その利用者と好みが似ている人が高く評価したものを勧める方式です。好みの近さは、評価どうしの相関などで測ります。\n内容に基づくフィルタリング（コンテンツベースフィルタリング）は、監督や俳優、ジャンルなど商品の内容の情報をもとに、利用者の好みに合うものを勧める方式です。二つを組み合わせる方法も研究されています。\n売上順に全員に同じものを勧める方法や、専門家が書いたルールで決まった商品を勧める方法は、協調フィルタリングではありません。","sources":[{"title":"人工知能学会「人工知能の話題: 協調フィルタリング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics2.html"}],"status":"active"},{"id":"Q-034","category":2,"question":"機械学習における「次元の呪い」の説明として、最も適切なものはどれか。","choices":["データを表す特徴量（次元）の数が増えると、よいモデルを作るのに必要なデータ量が急激に増える","特徴量（次元）の数を減らすほど、モデルが学習データに合わせすぎて過学習を起こしやすくなる","画像や音声のように次元の高いデータは、機械学習ではまったく扱えないことが証明されている","ニューラルネットワークの層を増やすほど、学習の計算が速く終わるようになるという性質"],"answer":0,"explanation":"次元の呪いは、1961年にリチャード・ベルマンが名付けた言葉で、多くの特徴量で表されたデータに関して起きるさまざまな現象を指します。機械学習で特に問題になるのは、特徴量（次元）の数が増えると、よいモデルを作るのに必要なデータの量が指数関数的に増えることです。次元が増えるほどデータは空間の中でまばらになり、限られたデータでは空間を十分に覆えなくなります。そのため、役に立つ特徴量を選んで次元を減らす工夫（特徴選択や次元削減）が行われます。\n特徴量を減らすほど過学習しやすくなるわけではありません。むしろ特徴量が多すぎると過学習しやすくなります。\n次元の高いデータも、工夫すれば機械学習で扱えます。画像や音声は深層学習の代表的な対象です。\n層を増やすと計算が速くなるという性質はありません。","sources":[{"title":"Pádraig Cunningham ほか \"Feature Selection Tutorial with Python Examples\" (arXiv:2106.06437)","url":"https://arxiv.org/abs/2106.06437"}],"status":"active"},{"id":"Q-035","category":2,"question":"統計的自然言語処理の説明として、最も適切なものはどれか。","choices":["大量の文章（コーパス）から確率的なモデルを学習し、言語の多様な表現に対応しようとする方法","言語学者が手で書いた文法の規則と辞書だけを使い、統計や学習をまったく使わずに処理する方法","文章を画像として読み取り、文字の形の特徴だけから意味を判断して処理する方法","人間の脳の言語野を電極で測定し、その信号をそのままコンピュータで再現して処理する方法"],"answer":0,"explanation":"自然言語処理は、かつては専門家が手で書いた規則（ルール）に基づく方法が中心でした。しかし、現実の言語の複雑さに手書きの規則で対応するには限界がありました。そこで、大量の文章の集まり（コーパス）から確率的なモデルを学習する統計的な方法に移っていきました。隠れマルコフモデルなどが音声認識や品詞の推定に使われ、1990年代には教師あり学習などの機械学習が広く使われるようになりました。2010年代以降は深層学習が主流になっています。\n「手で書いた規則と辞書だけを使う」のは、ルールベースの方法の説明です。\n文字の形だけから意味を判断する方法や、脳の信号をそのまま再現する方法は、統計的自然言語処理ではありません。","sources":[{"title":"\"Deep Learning and Machine Learning - Natural Language Processing: From Theory to Application\" (arXiv:2411.05026) 1.1","url":"https://arxiv.org/abs/2411.05026"}],"status":"active"},{"id":"Q-036","category":2,"question":"ニューラルネットワークと人間の神経回路の関係に関する説明として、最も適切なものはどれか。","choices":["ニューラルネットワークは、脳の神経回路の仕組みを手本にした計算モデルで、ディープラーニングはこれを発展させたものである","ニューラルネットワークは、脳の神経細胞をすべて正確に再現しており、人間と同じ仕組みで考えている","ニューラルネットワークは、2010年代に初めて考え出されたもので、それ以前には研究されていなかった","ニューラルネットワークは、神経回路と関係がなく、人が書いたルールで推論する仕組みの別名である"],"answer":0,"explanation":"ニューラルネットワークは、人間の脳の神経回路の仕組みを手本にした計算モデルです。ディープラーニング（深層学習）は、このニューラルネットワークの考え方を発展させ、多数の層を重ねたものです。\nニューラルネットワークの研究の歴史は長く、1943年にマカロックとピッツが人工ニューロンのモデルを提案し、その後ローゼンブラットのパーセプトロンなどが続きました。2010年代に初めて考え出されたわけではありません。\nニューラルネットワークは脳の仕組みを「手本」にしたもので、脳の神経細胞をすべて正確に再現しているわけではありません。\n人が書いたルールで推論する仕組みは、エキスパートシステムのようなルールベースの方法で、ニューラルネットワークとは異なります。","sources":[{"title":"総務省 令和6年版 情報通信白書「第1〜3次AIブームと冬の時代」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131110.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}],"status":"active"},{"id":"Q-037","category":2,"question":"福島邦彦のネオコグニトロンと、ルカンらによる畳み込みニューラルネットワーク（LeNet）に関する説明として、最も適切なものはどれか。","choices":["ネオコグニトロンは畳み込みやサブサンプリングを取り入れた初期の深いネットワークで、ルカンらは誤差逆伝播法で学習するCNNを手書き数字の認識に使った","ネオコグニトロンは誤差逆伝播法を使って学習するCNNで、ルカンらのLeNetは畳み込みを使わない全結合のネットワークである","ネオコグニトロンは2012年の画像認識コンテストで優勝したネットワークで、LeNetはその後に作られた改良版である","ネオコグニトロンは文章を生成するためのネットワークで、LeNetは囲碁の次の一手を予測するためのネットワークである"],"answer":0,"explanation":"ネオコグニトロンは、福島邦彦が1979年ごろに発表したニューラルネットワークです。畳み込み、同じ重みの繰り返し利用、サブサンプリング（のちのプーリングにあたる処理）を組み合わせており、「深い」と呼べる最初期のネットワークとされ、現在の畳み込みニューラルネットワーク（CNN）とよく似た構造を持っていました。\nルカンらは1989年、誤差逆伝播法で学習するCNNを手書きの郵便番号（数字）の認識に使いました。この流れのネットワークはLeNetとして知られ、手書き数字のデータセットMNISTも有名になりました。\n誤差逆伝播法でCNNを学習させたのはルカンらで、LeNetは畳み込みを使うネットワークです。\n2012年の画像認識コンテストILSVRCで優勝したのは、クリジェフスキーらの深層CNNです。\n文章の生成や囲碁の手の予測は、どちらのネットワークの目的でもありません。","sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}],"status":"active"},{"id":"Q-038","category":2,"question":"ImageNetと、それを使った画像認識コンテストILSVRCに関する説明として、最も適切なものはどれか。","choices":["ILSVRCは2010年から毎年開かれ、2012年に深層の畳み込みニューラルネットワークが大差で優勝した","ILSVRCは2012年に一度だけ開かれ、ルールベースの画像認識システムが優勝して注目された","ImageNetは約20種類の物体の画像だけを集めた、小規模な画像のデータセットである","ILSVRCは、囲碁や将棋などのゲームで、プログラムどうしの強さを競うコンテストである"],"answer":0,"explanation":"ImageNetは、大量の画像に物体の名前を付けた大規模なデータセットです。これを使った画像認識のコンテストILSVRC（ImageNet Large Scale Visual Recognition Challenge）は2010年から毎年開かれ、1000種類の物体を分類する課題などで性能を競いました。\n2012年のILSVRCでは、クリジェフスキーらのチーム（SuperVision）が、GPUで学習させた大規模な深層の畳み込みニューラルネットワークで、分類の課題などで優勝しました。このネットワークはAlexNetとして知られ、深層学習が画像認識の主流になるきっかけになりました。\nILSVRCは毎年開かれたコンテストで、2012年の優勝は深層学習によるものです。\n約20種類の物体を扱うのは、それ以前のPASCAL VOCのようなデータセットの規模で、ImageNetはその何十倍もの種類を扱います。\nゲームの強さを競うコンテストではありません。","sources":[{"title":"Olga Russakovsky ほか \"ImageNet Large Scale Visual Recognition Challenge\" (arXiv:1409.0575)","url":"https://arxiv.org/abs/1409.0575"},{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828) 5.4, 5.21","url":"https://arxiv.org/abs/1404.7828"}],"status":"active"},{"id":"Q-039","category":2,"question":"ディープマインドが開発したアルファ碁（AlphaGo）に関する説明として、最も適切なものはどれか。","choices":["2016年に囲碁のトップ棋士に4勝1敗で勝ち、深層学習や強化学習とモンテカルロ木探索を組み合わせていた","1997年にチェスの世界チャンピオンに勝ち、専門家が作った評価関数と全幅探索だけで強くなった","2011年に米国のクイズ番組でチャンピオンに勝ち、自然言語の質問に答える技術を示した","囲碁のすべての局面を調べ尽くして、どの局面からでも必ず勝てる手順を完全に求めていた"],"answer":0,"explanation":"アルファ碁は、グーグルの子会社ディープマインドが開発した囲碁のプログラムです。2016年3月、トップ棋士の一人である李九段（韓国）との5番勝負に4勝1敗で勝ちました。囲碁はチェスや将棋より盤面が広く、打ち方の組み合わせが桁違いに多いため、AIが人間を上回るにはまだ時間がかかると考えられていたことから、大きな衝撃を与えました。アルファ碁は、深層学習と強化学習を組み合わせた深層強化学習と、モンテカルロ木探索を組み合わせていました。その後継のAlphaZeroは、人間どうしの対局の棋譜を使わずに強化学習だけで、当初のアルファ碁を大きく上回る強さを実現しました。\n1997年にチェスの世界チャンピオンに勝ったのは、IBMのディープ・ブルーです。\n2011年にクイズ番組で勝ったのは、IBMのワトソンです。\n囲碁の局面の数は膨大で、すべてを調べ尽くすことはできません。","sources":[{"title":"総務省 平成28年版 情報通信白書「人工知能（AI）とは」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h28/html/nc142110.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Maciej Świechowski ほか \"Monte Carlo Tree Search: A Review of Recent Modifications and Applications\" (arXiv:2103.04931)","url":"https://arxiv.org/abs/2103.04931"}],"status":"active"},{"id":"Q-040","category":2,"question":"生成AIに関する説明として、最も適切なものはどれか。","choices":["テキストや画像、音声などを生成できるAI技術の総称で、2022年のChatGPTの公開を機に特に注目された","人が書いたルールと辞書だけを使って、決まった形の文章を組み立てて出力する技術の総称である","1960年代にワイゼンバウムが開発した、精神科医をまねて会話する特定のプログラムの名前である","大量のデータの中から、まだ知られていない規則性や傾向を見つけ出すための分析手法の総称である"],"answer":0,"explanation":"生成AIは、テキスト、画像、音声などを生成できるAI技術の総称です。2022年にOpenAIが対話型AI「ChatGPT」を公開したことをきっかけに特に注目され、ChatGPTは公開から2か月で利用者が1億人を超えました。背景には、ディープラーニングやトランスフォーマーのモデルの大規模化、大量のデータで学習して幅広い課題に使える基盤モデルや大規模言語モデル（LLM）の登場、GPUなどの計算資源の拡充があります。自然な言葉で指示するだけで使え、テキスト、画像、映像など多様な形式で出力できることも特徴です。\n「ルールと辞書で決まった形の文章を組み立てる」のは、生成AIの説明ではありません。\n「精神科医をまねて会話するプログラム」はELIZAです。\n「データから規則性を見つける分析手法」は、データマイニングの説明です。","sources":[{"title":"総務省 令和6年版 情報通信白書「生成AIの急速な進化と普及」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131210.html"}],"status":"active"},{"id":"Q-041","category":3,"question":"教師あり学習で扱う問題のうち、「回帰問題」にあたるものとして、最も適切なものはどれか。","choices":["過去の気象データから、明日の最高気温を数値で予測する","受信したメールが、迷惑メールかどうかを判定する","写真に写っている動物が、犬・猫・鳥のどれかを判定する","顧客が来月サービスを解約するかどうかを判定する"],"answer":0,"explanation":"教師あり学習では、正解のラベルが付いたデータから入力と出力の関係を学びます。出力が気温や売上のような連続した数値のときは「回帰問題」、出力が「迷惑メールかどうか」「犬・猫・鳥」のようなカテゴリ（クラス）のときは「分類問題」と呼びます。\n明日の最高気温は連続した数値なので回帰問題です。\n迷惑メールかどうか、解約するかどうかは、2つのクラスに分ける分類問題（2値分類）です。\n犬・猫・鳥のどれかを判定するのは、3つ以上のクラスに分ける分類問題（多クラス分類）です。","sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}],"status":"active"},{"id":"Q-042","category":3,"question":"線形回帰に関する説明として、最も適切なものはどれか。","choices":["説明変数が1つのものを単回帰分析、2つ以上のものを重回帰分析と呼ぶ","説明変数が2つ以上のものを単回帰分析、1つのものを重回帰分析と呼ぶ","線形回帰は、予測値と実際の値の差の絶対値の最大値を最小にする","線形回帰は、出力がカテゴリのときにだけ使える分類の手法である"],"answer":0,"explanation":"線形回帰は、目的変数（予測したい値）を説明変数の一次式（係数を掛けて足し合わせた式）で表すモデルです。代表的な最小二乗法では、実際の値と予測値の差（残差）を2乗して合計した値が最も小さくなるように係数を決めます。\n説明変数が1つのもの（例: 気温から売上を予測）を単回帰分析、2つ以上のもの（例: 気温と曜日と広告費から売上を予測）を重回帰分析と呼びます。\n最小二乗法で最小にするのは差の2乗の合計で、差の絶対値の最大値ではありません。\n線形回帰は連続した数値を予測する回帰の手法です。","sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}],"status":"active"},{"id":"Q-043","category":3,"question":"ロジスティック回帰に関する説明として、最も適切なものはどれか。","choices":["名前に「回帰」と付くが、確率を出力し、しきい値で区切ることで分類に使われる","名前のとおり、気温や売上のような連続した数値を予測する回帰だけに使われる","決定木を多数組み合わせて多数決をとる、アンサンブル学習の手法の一つである","正解のラベルがないデータを、似たもの同士のグループに分ける手法である"],"answer":0,"explanation":"ロジスティック回帰は、名前に「回帰」と付きますが、機械学習では分類の手法として使われます。入力の一次式をロジスティック関数（シグモイド関数）に通して0〜1の値に変換し、あるクラスに属する確率として出力します。この確率をしきい値（標準では0.5）で区切ることで、クラスを判定します。2クラスの分類のほか、多クラスの分類にも拡張できます。\n連続した数値を予測するのは、線形回帰などの回帰の手法です。\n決定木を多数組み合わせて多数決をとるのは、ランダムフォレストです。\n正解のラベルがないデータをグループに分けるのは、教師なし学習のクラスタリングです。","sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}],"status":"active"},{"id":"Q-044","category":3,"question":"3つ以上のクラスに分ける「多クラス分類」に関する説明として、最も適切なものはどれか。","choices":["2クラス分類のモデルを「あるクラスかそれ以外か」で複数作り、組み合わせる方法（One-vs-Rest）がある","多クラス分類は、2クラス分類のモデルをどう組み合わせても実現できないことがわかっている","多クラス分類では、出力が連続した数値になるため、評価には平均二乗誤差だけを使う","多クラス分類は、正解のラベルを使わない教師なし学習の一種として位置づけられる"],"answer":0,"explanation":"多クラス分類は、写真の動物を「犬・猫・鳥」に分けるように、3つ以上のクラスに分類する問題です。2クラス分類のモデルを使う方法として、「あるクラスか、それ以外か」を判定するモデルをクラスの数だけ作って組み合わせるOne-vs-Rest（一対他）という方法があります。ロジスティック回帰は、One-vs-Restのほか、複数のクラスの確率を同時に出す多項ロジスティック回帰としても使えます。\n2クラス分類の組み合わせで多クラス分類はできます。\n多クラス分類の出力はクラス（カテゴリ）で、連続した数値ではありません。評価には正解率や混同行列などを使います。\n多クラス分類は、正解のラベルを使う教師あり学習です。","sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}],"status":"active"},{"id":"Q-045","category":3,"question":"サポートベクターマシン（SVM）の「マージン最大化」の説明として、最も適切なものはどれか。","choices":["クラスを分ける境界と、それに最も近い学習データとの距離ができるだけ大きくなるように境界を決める","学習データをすべて境界の上に並べることで、境界と学習データの距離を0にするように境界を決める","誤って分類された学習データの重みを大きくしながら、弱い学習器を順番に追加していく","データを学習する前に、特徴量の数をできるだけ増やして、境界を複雑にしておく"],"answer":0,"explanation":"SVMは、分類や回帰などに使える教師あり学習の手法です。分類では、クラスを分ける境界（超平面）と、それに最も近い各クラスの学習データとの距離（マージン）ができるだけ大きくなるように境界を決めます。一般に、マージンが大きいほど未知のデータに対する誤り（汎化誤差）が小さくなると考えられるためです。境界の決定に使われる、マージンの境目やその内側にある学習データをサポートベクターと呼びます。\n境界と学習データの距離を0にするのは、マージン最大化と逆の考え方です。\n「誤分類したデータの重みを大きくしながら弱い学習器を追加する」のは、ブースティング（AdaBoost）の説明です。\nマージン最大化は、特徴量を増やして境界を複雑にすることではありません。","sources":[{"title":"scikit-learn User Guide 1.4 Support Vector Machines","url":"https://scikit-learn.org/stable/modules/svm.html"}],"status":"active"},{"id":"Q-046","category":3,"question":"サポートベクターマシンで使われる「カーネルトリック」の説明として、最も適切なものはどれか。","choices":["データを高次元の空間へ写したときの計算を、写像を直接求めずにカーネル関数で行う工夫","学習データの一部をランダムに取り出して、複数のモデルを並行して学習させる工夫","学習に使うデータを減らすために、次元の数を2次元まで必ず減らしてから学習する工夫","誤差を出力側から入力側へ順に伝えて、ニューラルネットワークの重みを調整する工夫"],"answer":0,"explanation":"直線（超平面）では分けられないデータも、より高い次元の空間へ写すと分けられるようになることがあります。しかし、高次元の空間への写像を実際に計算すると、計算量が非常に大きくなります。カーネルトリックは、写した先の空間での内積をカーネル関数で直接計算することで、写像そのものを求めずに高次元の空間での分類と同じ結果を得る工夫です。代表的なカーネルに、多項式カーネルやRBF（ガウス）カーネルがあります。\n「データの一部をランダムに取り出して複数のモデルを学習させる」のは、バギングの説明です。\nカーネルトリックは次元を減らす工夫ではなく、むしろ高次元の空間を扱う工夫です。\n「誤差を出力側から入力側へ伝えて重みを調整する」のは、ニューラルネットワークの誤差逆伝播法の説明です。","sources":[{"title":"scikit-learn User Guide 1.4 Support Vector Machines","url":"https://scikit-learn.org/stable/modules/svm.html"}],"status":"active"},{"id":"Q-047","category":3,"question":"決定木に関する説明として、最も適切なものはどれか。","choices":["「もし〜なら」という単純な判断の規則を木の形に組み合わせて予測し、分類にも回帰にも使える","木を深くすればするほど、未知のデータに対する予測の精度が必ず上がり続ける","決定木は回帰には使えず、2つのクラスに分ける分類問題だけに使える手法である","決定木は、データの小さな変化に対しても、必ず同じ形の木ができるという性質を持つ"],"answer":0,"explanation":"決定木は、データの特徴量から「もし〜なら」という単純な判断の規則を学び、それを木の形に組み合わせて予測する手法で、分類にも回帰にも使えます。どのような規則で判断したかを人が追いやすい点が特徴です。\n一方で、木を複雑にしすぎると学習データに合わせすぎて、未知のデータにうまく対応できなくなります（過学習）。これを防ぐため、枝刈りや、木の深さの上限、葉に含まれるデータ数の下限などを設定します。\nまた、データが少し変わるだけで大きく異なる木ができることがあり、不安定になりやすいという弱点があります。この弱点は、複数の木を組み合わせるアンサンブル学習（ランダムフォレストなど）で和らげられます。","sources":[{"title":"scikit-learn User Guide 1.10 Decision Trees","url":"https://scikit-learn.org/stable/modules/tree.html"}],"status":"active"},{"id":"Q-048","category":3,"question":"アンサンブル学習の説明として、最も適切なものはどれか。","choices":["複数のモデルの予測を組み合わせることで、1つのモデルより汎化性能や頑健性を高める方法","1つのモデルだけを、学習データを変えずに何度も繰り返し学習させて精度を上げる方法","正解のラベルがないデータを、似たもの同士のグループに自動で分ける教師なし学習の方法","多くの特徴量の中から、最も重要な1つだけを選んでモデルを作る特徴選択の方法"],"answer":0,"explanation":"アンサンブル学習は、複数のモデル（ベースとなる学習器）の予測を組み合わせることで、1つのモデルよりも未知のデータに対する性能（汎化性能）や頑健性を高める方法です。代表的な例に、勾配ブースティング木とランダムフォレストがあります。組み合わせ方には、複数のモデルの予測を平均したり多数決をとったりする方法（バギング、投票など）と、モデルを順番に追加して前のモデルの誤りを補っていく方法（ブースティング）があります。\n1つのモデルを繰り返し学習させるだけでは、アンサンブル学習とはいいません。\n似たもの同士のグループに分けるのは、クラスタリングです。\n重要な特徴量を選ぶのは特徴選択で、アンサンブル学習とは別の考え方です。","sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"status":"active"},{"id":"Q-049","category":3,"question":"バギングに関する説明として、最も適切なものはどれか。","choices":["学習データから重複を許してランダムに取り出したデータで複数のモデルを作り、予測をまとめる","前のモデルが誤ったデータの重みを大きくしながら、モデルを1つずつ順番に追加していく","学習データを重複なく k 個に分け、k−1 個で学習して残りの1個で評価することを繰り返す","データを高次元の空間へ写したときの内積を、カーネル関数を使って直接計算する"],"answer":0,"explanation":"バギングは、元の学習データからランダムに取り出した部分集合（サブセット）を使って同じ種類のモデルを複数作り、それらの予測を平均や多数決でまとめる方法です。データを取り出すときに、同じデータが何度選ばれてもよい（重複を許す、復元抽出）取り出し方をブートストラップサンプリングといい、得られたデータをブートストラップ標本と呼びます。モデル作りにランダムさを加えて組み合わせることで、決定木のような不安定なモデルの予測のばらつき（分散）を小さくできます。各モデルは互いに独立に作れるので、並行して学習できます。\n「誤ったデータの重みを大きくしながら順番に追加する」のは、ブースティングの説明です。\n「重複なくk個に分けて学習と評価を繰り返す」のは、k-分割交差検証の説明です。\n「カーネル関数で内積を計算する」のは、カーネルトリックの説明です。","sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"status":"active"},{"id":"Q-050","category":3,"question":"ランダムフォレストの説明として、最も適切なものはどれか。","choices":["ブートストラップ標本で決定木を作り、さらに分岐ごとに一部の特徴量をランダムに選んで使う","すべての決定木に同じ学習データと同じ特徴量を使い、まったく同じ木を多数作る","決定木を1本だけ作り、その枝をランダムに切り落とすことで過学習を防ぐ手法である","決定木を順番に追加し、前の木の予測の誤差を次の木が小さくするように学習する"],"answer":0,"explanation":"ランダムフォレストは、決定木を多数作って組み合わせるアンサンブル学習の手法です。それぞれの木は、学習データから重複を許してランダムに取り出したデータ（ブートストラップ標本）で作ります。さらに、木の各分岐（ノード）で分け方を探すときには、すべての特徴量ではなく、ランダムに選んだ一部の特徴量の中から最もよい分け方を選びます。こうして木どうしの違いを大きくし、それらの予測をまとめる（分類では多数決、回帰では平均）ことで、1本の決定木より安定した予測ができます。\n同じデータと同じ特徴量で作ると同じ木ばかりになり、組み合わせる意味がありません。\n1本の決定木の枝を切るのは枝刈りで、ランダムフォレストではありません。\n「前の木の誤差を次の木が小さくするように順番に追加する」のは、勾配ブースティングの説明です。","sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"status":"active"},{"id":"Q-051","category":3,"question":"ブースティングの代表的な手法であるAdaBoostの説明として、最も適切なものはどれか。","choices":["弱い学習器を順番に学習させ、前の段階で誤って予測したデータの重みを大きくしていく","学習データからランダムに取り出したデータで、複数の学習器を互いに独立に学習させる","学習器を1つだけ使い、学習データの順番を毎回入れ替えながら繰り返し学習させる","正解のラベルがないデータを、決められた数のグループに分けるクラスタリングの手法"],"answer":0,"explanation":"ブースティングは、弱い学習器（ランダムに当てるより少しだけよい程度の、小さな決定木のようなモデル）を順番に学習させ、それらを組み合わせて強い予測を作る方法です。AdaBoostは1995年にフロイントとシャピレが発表した代表的な手法で、最初はすべてのデータの重みを等しくして学習し、以降の段階では、それまでのモデルが誤って予測したデータの重みを大きく、正しく予測したデータの重みを小さくして学習し直します。最後に、すべての学習器の予測を重み付きの多数決でまとめます。\n「ランダムに取り出したデータで複数の学習器を独立に学習させる」のは、バギングの説明です。ブースティングは前の結果を使うため、順番に学習させます。\n学習器を1つだけ使う方法は、アンサンブル学習ではありません。\nクラスタリングは教師なし学習で、ブースティングとは関係ありません。","sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"status":"active"},{"id":"Q-052","category":3,"question":"勾配ブースティング（勾配ブースティング決定木）の説明として、最も適切なものはどれか。","choices":["決定木を1本ずつ順番に足していき、それまでのモデルの誤差（損失）を小さくするように新しい木を学習する","すべての決定木を同時に独立に学習させ、それぞれの予測の平均をとって最終的な予測とする","決定木を使わず、データを高次元の空間へ写してマージンが最大になる境界を探す手法である","正解のラベルを使わずに、データの分散が最大になる方向を順番に見つけて次元を減らす手法である"],"answer":0,"explanation":"勾配ブースティングは、ブースティングの考え方を、微分できるさまざまな損失関数に一般化した手法です。決まった大きさの決定木を弱い学習器として使い、1本ずつ順番に足していきます（加法モデル）。新しく足す木は、それまでのモデルの予測の誤差（損失）を小さくするように学習します。回帰にも分類にも使え、特に表形式のデータで高い性能を発揮することが知られています。\n「すべての木を同時に独立に学習させて平均する」のは、ランダムフォレストのようなバギングの考え方です。\n「高次元の空間でマージンが最大になる境界を探す」のは、サポートベクターマシンの説明です。\n「分散が最大になる方向を見つけて次元を減らす」のは、主成分分析の説明です。","sources":[{"title":"scikit-learn User Guide 1.11 Ensembles","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"status":"active"},{"id":"Q-053","category":3,"question":"時系列データの分析に使われる自己回帰モデル（ARモデル）とベクトル自己回帰モデル（VARモデル）に関する説明として、最も適切なものはどれか。","choices":["ARモデルは1つの時系列を自身の過去の値で表し、VARモデルは複数の時系列をそれぞれの過去の値を使って同時に表す","ARモデルは複数の時系列を同時に扱い、VARモデルは1つの時系列だけを自身の過去の値で表す","ARモデルもVARモデルも、過去の値を使わずに、同じ時点の他の変数だけから値を予測する","ARモデルもVARモデルも、時系列ではない画像データを分類するために考えられた手法である"],"answer":0,"explanation":"自己回帰モデル（ARモデル）は、ある時系列の現在の値を、その時系列自身の過去の値（ラグ）の一次式で表すモデルです。たとえば、今日の売上を、昨日やおとといの売上から予測します。\nベクトル自己回帰モデル（VARモデル）は、ARモデルを複数の時系列に広げたもので、複数の時系列を同時に扱い、それぞれの現在の値を、すべての時系列の過去の値を使って表します。たとえば、売上と広告費のように互いに影響し合う時系列の関係を分析するのに使われます。\nARモデルが1つの時系列、VARモデルが複数の時系列を扱います。\nどちらも過去の値を使うモデルで、時系列データのためのものです。\nなお、ARモデルで何期前までの値を使うか（次数）を決めるときには、AICやBICなどの情報量規準が使われます。","sources":[{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"},{"title":"statsmodels Vector Autoregressions (tsa.vector_ar)","url":"https://www.statsmodels.org/stable/vector_ar.html"}],"status":"active"},{"id":"Q-054","category":3,"question":"k-means法に関する説明として、最も適切なものはどれか。","choices":["分けたいクラスタの数 k をあらかじめ決めておき、各データを最も近い中心（重心）のクラスタに割り当てる","クラスタの数を決める必要がなく、データの分布から最適なクラスタの数を必ず自動で決める","正解のラベルが付いたデータを使って、新しいデータのクラスを予測する教師あり学習の手法である","データを1つずつのクラスタから始め、似たクラスタを順に統合して樹形図を作る手法である"],"answer":0,"explanation":"k-means法は、教師なし学習のクラスタリングの代表的な手法です。あらかじめクラスタの数 k を決めておき、各データを最も近い中心（そのクラスタに属するデータの平均で、重心やセントロイドと呼ばれる）のクラスタに割り当てることと、中心を計算し直すことを繰り返します。各クラスタ内のデータと中心との距離の2乗の合計（クラスタ内平方和）が小さくなるように分けます。大量のデータにも使いやすく、さまざまな分野で使われています。\nk-means法では、クラスタの数 k を人が指定する必要があります。\n正解のラベルは使いません。\n「1つずつのクラスタから始めて統合し、樹形図を作る」のは、階層的クラスタリング（ウォード法など）の説明です。","sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"}],"status":"active"},{"id":"Q-055","category":3,"question":"階層的クラスタリングとウォード法に関する説明として、最も適切なものはどれか。","choices":["データを1つずつのクラスタから始めて順に統合し、その過程をデンドログラム（樹形図）で表す。ウォード法は統合の基準の一つである","階層的クラスタリングでは、最初にクラスタの数 k を決め、各データを最も近い重心に割り当てることを繰り返す","ウォード法は、正解のラベルを使ってクラスタの良し悪しを判定する、教師あり学習の評価指標である","デンドログラムは、ROC曲線と同じように、分類モデルのしきい値ごとの性能を表す図である"],"answer":0,"explanation":"階層的クラスタリングは、クラスタを順に統合（または分割）していくことで、入れ子になったクラスタの階層を作る手法です。よく使われる凝集型（ボトムアップ型）では、まず各データを1つずつのクラスタとし、似たクラスタどうしを順に統合していきます。この統合の過程は、デンドログラム（樹形図）と呼ばれる木の形で表せます。木の根はすべてのデータを含む1つのクラスタ、葉は1つのデータだけのクラスタです。\nどのクラスタどうしを統合するかを決める基準（連結法）の一つがウォード法で、統合したときのクラスタ内の差の2乗の合計の増え方が最も小さくなる組を選びます。分散を小さくする考え方で、k-means法の目的と似ています。\n「クラスタの数 k を決めて重心に割り当てる」のは、k-means法の説明です。\nウォード法は教師なし学習のクラスタリングの手法で、デンドログラムは分類の性能を表す図ではありません。","sources":[{"title":"scikit-learn User Guide 2.3 Clustering","url":"https://scikit-learn.org/stable/modules/clustering.html"}],"status":"active"},{"id":"Q-056","category":3,"question":"主成分分析（PCA）の説明として、最も適切なものはどれか。","choices":["データのばらつき（分散）をできるだけ多く説明する、互いに直交する方向を順に求め、少ない次元で表す","正解のラベルを使って、クラスどうしをできるだけよく分ける境界を学習する教師あり学習の手法である","データを決められた数のグループに分け、各グループの中心との距離の合計を小さくする手法である","データの次元を増やすことで、直線では分けられないデータを分けられるようにする手法である"],"answer":0,"explanation":"主成分分析（PCA）は、教師なし学習の次元削減の代表的な手法です。多くの変数を持つデータについて、データのばらつき（分散）をできるだけ多く説明する方向（第1主成分）を求め、次にそれと直交する方向の中から分散を最も多く説明する方向（第2主成分）を求める、というように、互いに直交する成分を順に求めます。上位の少数の主成分だけでデータを表すことで、情報をできるだけ失わずに次元を減らせます。データの可視化や、機械学習の前処理に使われます。\nPCAは正解のラベルを使いません。\n「データをグループに分けて中心との距離を小さくする」のは、k-means法の説明です。\n「次元を増やして分けられるようにする」のは、カーネル法の考え方で、PCAは次元を減らす手法です。","sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}],"status":"active"},{"id":"Q-057","category":3,"question":"特異値分解（SVD）の機械学習での利用に関する説明として、最も適切なものはどれか。","choices":["行列を分解して大きい特異値の成分だけを残すことで次元を減らせ、単語と文書の行列に使うと潜在意味解析になる","特異値分解は正解のラベルが必要な手法で、分類問題の学習にだけ使われる","特異値分解は画像を生成するための手法で、文章のデータには使うことができない","特異値分解は、データの次元を減らすことはできず、必ず次元を増やす手法である"],"answer":0,"explanation":"特異値分解（SVD）は、行列を3つの行列の積に分解する方法です。分解で得られる特異値の大きいものから k 個だけを残す（切り詰めた特異値分解）と、元の情報をできるだけ保ったまま次元を減らせます。データの各特徴量の平均を引いてから切り詰めた特異値分解を行うと、主成分分析（PCA）と同じ結果になります。\n文書に出てくる単語の回数を並べた「単語と文書の行列」に切り詰めた特異値分解を使う方法は、潜在意味解析（LSA）と呼ばれ、単語や文書の意味的な近さを捉えるのに使われます。推薦システムなどでも、行列を分解する考え方が使われます。\n特異値分解は正解のラベルを必要としない手法です。\n文章のデータにも使え、次元を減らすために使われます。","sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}],"status":"active"},{"id":"Q-058","category":3,"question":"t-SNEの説明として、最も適切なものはどれか。","choices":["高次元のデータの近さの関係を確率で表して低次元に写す手法で、特に近いデータどうしの局所的な構造をよく保つ","高次元のデータを、元のデータの分散が最大になる直交する方向へ、線形に写す手法である","正解のラベルを使って、クラスごとに異なる色を付けるための教師あり学習の手法である","データを高次元の空間へ写して、マージンが最大になる境界を求める分類の手法である"],"answer":0,"explanation":"t-SNE（t分布型確率的近傍埋め込み）は、高次元のデータを2次元や3次元に写して可視化するためによく使われる次元削減の手法です。データどうしの近さを確率で表し、元の空間ではガウス分布、写した先の空間ではt分布を使って、その確率の分布ができるだけ一致するように配置します。特に、近いデータどうしの関係（局所的な構造）をよく保つため、複数のクラスタがある様子などを一枚の図で見せるのに向いています。\n「分散が最大になる直交する方向へ線形に写す」のは、主成分分析（PCA）の説明です。t-SNEは非線形の手法です。\nt-SNEは正解のラベルを使わない手法です。\n「マージンが最大になる境界を求める」のは、サポートベクターマシンの説明です。","sources":[{"title":"scikit-learn User Guide 2.2 Manifold learning","url":"https://scikit-learn.org/stable/modules/manifold.html"}],"status":"active"},{"id":"Q-059","category":3,"question":"多次元尺度構成法（MDS）の説明として、最も適切なものはどれか。","choices":["データどうしの距離（非類似度）ができるだけ保たれるように、データを低次元の空間に配置する手法","データを1つずつのクラスタから始めて順に統合し、樹形図を作るクラスタリングの手法","学習データを k 個に分けて、学習と評価を k 回繰り返す、モデルの評価の手法","文書の集まりから、その背後にある話題（トピック）を見つけ出す確率的なモデル"],"answer":0,"explanation":"多次元尺度構成法（MDS）は、データどうしの距離が、元の高次元の空間での距離にできるだけ近くなるように、データを低次元の空間に配置する次元削減の手法です。一般に、物どうしの「似ていなさ」（非類似度）のデータを分析するのに使われます。たとえば、商品どうしの似ていなさの評価や、国どうしの貿易の指標をもとに、それらを地図のような2次元の図に配置できます。\n「1つずつのクラスタから始めて統合し、樹形図を作る」のは、階層的クラスタリングの説明です。\n「データをk個に分けて学習と評価を繰り返す」のは、k-分割交差検証の説明です。\n「文書の背後にある話題を見つける確率的なモデル」は、トピックモデル（潜在的ディリクレ配分法など）の説明です。","sources":[{"title":"scikit-learn User Guide 2.2 Manifold learning","url":"https://scikit-learn.org/stable/modules/manifold.html"}],"status":"active"},{"id":"Q-060","category":3,"question":"トピックモデルの代表的な手法である潜在的ディリクレ配分法（LDA）の説明として、最も適切なものはどれか。","choices":["文書の集まりから、その背後にある抽象的な話題（トピック）を見つけ出す、確率的な生成モデル","正解のラベルが付いた文書を使って、文書を決められたクラスに分類する教師あり学習の手法","単語の並びを入力として、次に来る単語を予測するように学習するニューラルネットワーク","文書を、書かれた日付の順に並べて、時系列として将来の文書の数を予測する手法"],"answer":0,"explanation":"潜在的ディリクレ配分法（LDA）は、文書の集まり（コーパス）のような離散的なデータのための確率的な生成モデルで、文書の背後にある抽象的な話題（トピック）を見つけ出すトピックモデルとして使われます。「各文書はいくつかのトピックが混ざってできており、各トピックはそれぞれ特有の単語の出やすさを持つ」と考え、文書に出てくる単語から、トピックとその混ざり具合を推定します。正解のラベルを使わない教師なし学習です。\n正解のラベルで文書を分類するのは、教師あり学習の文書分類です。\n次の単語を予測するニューラルネットワークは、言語モデルの説明です。\n文書の数を時系列で予測する手法ではありません。\nなお、同じ「LDA」という略称で、線形判別分析（Linear Discriminant Analysis）という別の手法もあるので注意が必要です。","sources":[{"title":"scikit-learn User Guide 2.5 Decomposing signals in components","url":"https://scikit-learn.org/stable/modules/decomposition.html"}],"status":"active"},{"id":"Q-061","category":3,"question":"推薦システムの「コールドスタート問題」の説明として、最も適切なものはどれか。","choices":["新しい利用者や新しい商品には評価などの履歴がないため、協調フィルタリングではうまく推薦できない問題","推薦システムを起動した直後は、サーバーの温度が低いため計算が遅くなるという問題","利用者の評価が多すぎて、推薦に使うデータを保存しきれなくなるという問題","商品の内容の情報がないと、内容に基づくフィルタリングが一切使えないという問題"],"answer":0,"explanation":"協調フィルタリングは、多くの利用者の評価を集め、好みが似ている利用者が高く評価したものを勧める方式です。そのため、評価などの履歴がまだない新しい利用者には、好みの似た利用者を見つけられません（新規利用者の問題）。また、新しく追加された商品は、誰かが評価するまで推薦されません（新規アイテムの問題）。このように、履歴がない状態からうまく推薦を始められないことを、コールドスタート問題と呼びます。\n商品の監督やジャンルなどの内容の情報を使う内容に基づくフィルタリング（コンテンツベースフィルタリング）は、評価の履歴が少ない新しい商品にも使えるため、協調フィルタリングと組み合わせてコールドスタート問題を和らげる方法が使われます。\nサーバーの温度や、データの保存容量の問題ではありません。","sources":[{"title":"Frédéric Guillou ほか \"Cold-start Problems in Recommendation Systems via Contextual-bandit Algorithms\" (arXiv:1405.7544)","url":"https://arxiv.org/abs/1405.7544"},{"title":"人工知能学会「人工知能の話題: 協調フィルタリング」","url":"https://www.ai-gakkai.or.jp/whatsai/AItopics2.html"}],"status":"active"},{"id":"Q-062","category":3,"question":"強化学習を定式化するマルコフ決定過程における「割引率」の説明として、最も適切なものはどれか。","choices":["将来の報酬をどれだけ重視するかを表す0〜1の値で、小さいほど目先の報酬を重視する","学習のたびにパラメータをどれだけ大きく更新するかを表す値で、学習率と同じものである","行動を選ぶときに、ランダムに行動する確率を表す値で、探索の度合いを決める","状態が次の状態へ移る確率を表す値で、環境の不確かさの大きさを示す"],"answer":0,"explanation":"強化学習は、エージェントが環境の中で行動し、得られる報酬の合計が大きくなるような行動の仕方（方策）を学ぶ枠組みです。これを数学的に表したものがマルコフ決定過程で、状態の集合、行動の集合、ある状態である行動をとったときに次の状態へ移る確率（遷移）、報酬の関数、割引率から成ります。\n割引率 γ は0〜1の値で、将来にもらえる報酬を現在の価値に直すときにどれだけ割り引くかを表します。γ が小さいほど目先の報酬を重視し、1に近いほど将来の報酬も重視します。\n「パラメータをどれだけ大きく更新するか」は学習率で、割引率とは別の値です。\n「ランダムに行動する確率」は、ε-greedy方策の ε の説明です。\n「次の状態へ移る確率」は、状態遷移確率の説明です。","sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}],"status":"active"},{"id":"Q-063","category":3,"question":"強化学習における「状態価値関数」と「行動価値関数」の説明として、最も適切なものはどれか。","choices":["状態価値関数はある状態から方策に従ったときの報酬の合計の期待値で、行動価値関数は最初の行動も指定したときの期待値である","状態価値関数は最初の行動も指定したときの期待値で、行動価値関数は状態だけを指定したときの期待値である","どちらの関数も、直前の1回の行動で得られた報酬の値だけを表し、将来の報酬は含まない","どちらの関数も、正解のラベルと予測の差を表す関数で、教師あり学習の損失関数と同じものである"],"answer":0,"explanation":"状態価値関数 V(s) は、ある状態 s から始めて、その後ある方策 π に従って行動したときに得られる報酬の合計（収益）の期待値です。\n行動価値関数 Q(s, a) は、状態 s で最初に行動 a をとり、その後は方策 π に従ったときの収益の期待値です。Q関数とも呼ばれ、ある状態でどの行動をとるのがよいかを比べるのに使えます。Q学習やSARSAは、この行動価値関数を学習する手法です。\n状態価値関数と行動価値関数の説明が入れ替わっている選択肢は誤りです。\nどちらの関数も、将来にわたる報酬の合計の期待値を表し、直前の報酬だけではありません。\n教師あり学習の損失関数とは別のものです。","sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}],"status":"active"},{"id":"Q-064","category":3,"question":"Q学習とSARSAの違いに関する説明として、最も適切なものはどれか。","choices":["Q学習は次の状態で最も価値の高い行動を使って更新する方策オフ型、SARSAは実際に選んだ次の行動を使って更新する方策オン型である","Q学習は実際に選んだ次の行動を使って更新する方策オン型、SARSAは最も価値の高い行動を使って更新する方策オフ型である","Q学習もSARSAも、行動価値関数を使わずに、方策のパラメータを勾配で直接更新する手法である","Q学習もSARSAも、環境のモデルが完全にわかっているときにだけ使える、探索の手法である"],"answer":0,"explanation":"Q学習とSARSAは、どちらも行動価値関数 Q(s, a) を、実際の経験から少しずつ更新していく手法です。更新の目標となる値の作り方が異なります。\nSARSAは、「状態・行動・報酬・次の状態・次の行動（State-Action-Reward-State-Action）」の名前のとおり、実際に選んだ次の行動の価値を使って更新します。更新に使う行動と、実際に行動を決める方策が同じなので、方策オン型と呼ばれます。\nQ学習は、次の状態で最も価値の高い行動の価値（最大値）を使って更新します。実際にとった行動とは関係なく最適な行動価値関数を直接近づけるため、方策オフ型と呼ばれます。\n説明が入れ替わっている選択肢は誤りです。\n方策のパラメータを勾配で直接更新するのは、方策勾配法です。\nQ学習とSARSAは、環境のモデルがなくても経験から学べる手法です。","sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}],"status":"active"},{"id":"Q-065","category":3,"question":"強化学習の方策勾配法とREINFORCEに関する説明として、最も適切なものはどれか。","choices":["方策をパラメータで表し、報酬の合計の期待値が大きくなるように勾配を使って直接更新する。REINFORCEはその代表的な手法である","方策勾配法は行動価値関数だけを学習し、方策は最も価値の高い行動を選ぶことで間接的に決める","REINFORCEは、正解のラベルが付いた行動のデータを使って、方策を教師あり学習で学ぶ手法である","方策勾配法は、環境のモデルを使って、すべての行動の組み合わせをしらみつぶしに調べる手法である"],"answer":0,"explanation":"方策勾配法は、価値関数を経由せずに、方策そのものを直接学ぶ方法（方策探索）の一つです。方策をパラメータ θ を持つ関数で表し、得られる報酬の合計（収益）の期待値が大きくなるように、勾配を使って θ を更新します。\nREINFORCEは、方策勾配法の代表的な手法です。実際に行動して得た収益をもとに勾配を見積もり、収益が大きかった行動ほど、その行動をとる確率が高くなるように方策を更新します。\n「行動価値関数だけを学習し、最も価値の高い行動を選ぶ」のは、Q学習のような価値ベースの手法の説明です。\nREINFORCEは報酬をもとに学ぶ強化学習の手法で、正解のラベルを使う教師あり学習ではありません。\n方策勾配法は、すべての組み合わせをしらみつぶしに調べる手法ではありません。","sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}],"status":"active"},{"id":"Q-066","category":3,"question":"強化学習のActor-Criticの説明として、最も適切なものはどれか。","choices":["行動を決める方策（Actor）と、その行動を評価する価値関数（Critic）を組み合わせて学習する手法","環境の中で行動するエージェントを使わずに、正解のラベルだけから行動を学ぶ手法","2つのニューラルネットワークを競わせて、本物そっくりの画像を生成する手法","すべての行動を同じ確率でランダムに選び続けることで、最適な行動を見つける手法"],"answer":0,"explanation":"Actor-Criticは、方策を直接学ぶ方策ベースの手法と、価値関数を学ぶ価値ベースの手法の利点を組み合わせた手法です。行動を決める方策の部分を Actor（行動する役）、その行動がどれだけよかったかを見積もる価値関数の部分を Critic（評価する役）と呼びます。Critic の評価を使って Actor の方策を更新することで、報酬の合計だけを使う方策勾配法（REINFORCEなど）より安定して学習できることが期待されます。深層強化学習でも、ロボットの制御などで広く使われています。\n強化学習は、環境の中での行動と報酬から学ぶ方法で、正解のラベルだけから学ぶものではありません。\n「2つのネットワークを競わせて画像を生成する」のは、敵対的生成ネットワーク（GAN）の説明です。\nすべての行動をランダムに選び続けるだけでは、よい行動を学べません。","sources":[{"title":"Kai Arulkumaran ほか \"A Brief Survey of Deep Reinforcement Learning\" (arXiv:1708.05866)","url":"https://arxiv.org/abs/1708.05866"}],"status":"active"},{"id":"Q-067","category":3,"question":"多腕バンディット問題で使われるε-greedy方策の説明として、最も適切なものはどれか。","choices":["確率 ε でランダムに選択肢を選んで探索し、それ以外はこれまでの平均報酬が最も高い選択肢を選ぶ","確率 ε でこれまでの平均報酬が最も高い選択肢を選び、それ以外は必ずランダムに選ぶ","最初に一度だけすべての選択肢を試し、その後は二度と探索をせずに1つの選択肢だけを選び続ける","各選択肢の報酬の見込みに、不確かさに応じた上乗せをして、その合計が最大の選択肢を選ぶ"],"answer":0,"explanation":"多腕バンディット問題は、報酬の出方がわからない複数の選択肢（スロットマシンの腕）から繰り返し1つを選び、報酬の合計をできるだけ大きくする問題です。これまでに良かった選択肢を選び続ける「活用」と、まだよくわからない選択肢を試す「探索」のバランス（探索と活用のトレードオフ）が課題になります。広告の表示やニュースの推薦、医療の試験などへの応用があります。\nε-greedy方策は、毎回、確率 ε でランダムに選択肢を選んで探索し、残りの確率（1−ε）では、これまでの平均報酬が最も高い選択肢を選んで活用します。探索を時間全体に散らして行えるのが特徴です。\nε の確率で行うのは探索（ランダムな選択）で、活用ではありません。\n最初に試した後に探索をやめる方法は、ε-greedy方策ではありません。\n「不確かさに応じた上乗せをして最大の選択肢を選ぶ」のは、UCB方策の説明です。","sources":[{"title":"Aleksandrs Slivkins \"Introduction to Multi-Armed Bandits\" (arXiv:1904.07272)","url":"https://arxiv.org/abs/1904.07272"}],"status":"active"},{"id":"Q-068","category":3,"question":"多腕バンディット問題で使われるUCB方策の考え方として、最も適切なものはどれか。","choices":["まだ試した回数が少なく不確かな選択肢ほど、報酬の見込みを高めに見積もって選ぶ（不確かなときは楽観的に考える）","これまでの平均報酬が最も高い選択肢だけを選び続け、ほかの選択肢は二度と試さない","毎回すべての選択肢を同じ確率でランダムに選び、報酬の情報はまったく使わない","最も試した回数が多い選択肢ほど不確かだと考え、その選択肢を優先して選ぶ"],"answer":0,"explanation":"UCB（Upper Confidence Bound）方策は、「不確かなときは楽観的に考える」という考え方に基づく方策です。各選択肢について、これまでの平均報酬に、試した回数が少ないほど大きくなる上乗せの値を足した値（信頼区間の上限）を計算し、それが最大の選択肢を選びます。試した回数が少ない選択肢は、本当は良いかもしれないと高めに見積もられるため自然に探索され、十分に試して平均報酬が低いとわかった選択肢は選ばれなくなります。\n平均報酬が最も高い選択肢だけを選び続けると、まだ試していない良い選択肢を見逃すおそれがあります。\nすべてをランダムに選ぶ方法は、報酬の情報を活用しません。\n試した回数が多い選択肢ほど見積もりは確かになるので、UCBではむしろ上乗せが小さくなります。","sources":[{"title":"Aleksandrs Slivkins \"Introduction to Multi-Armed Bandits\" (arXiv:1904.07272)","url":"https://arxiv.org/abs/1904.07272"}],"status":"active"},{"id":"Q-069","category":3,"question":"過学習と汎化性能に関する説明として、最も適切なものはどれか。","choices":["学習に使ったデータでは高い性能が出るのに、未知のデータでは性能が低くなる状態を過学習という","学習に使ったデータでも未知のデータでも、同じように高い性能が出る状態を過学習という","汎化性能とは、学習に使ったデータに対してどれだけ正確に予測できるかを表す性能のことである","モデルの性能は、学習に使ったデータでそのまま評価するのが最も正しい方法である"],"answer":0,"explanation":"汎化性能とは、学習に使っていない未知のデータに対して、どれだけ正確に予測できるかを表す性能です。機械学習の目的は、この汎化性能を高めることです。\n過学習は、モデルが学習データに合わせすぎてしまい、学習データでは高い性能が出るのに、未知のデータでは性能が低くなる状態です。極端な例では、学習データの正解をそのまま覚えるだけのモデルは、学習データでは満点になっても、新しいデータの予測には役に立ちません。\nそのため、モデルの性能を学習に使ったデータで評価するのは誤りです。手元のデータの一部をテスト用に取り分けて（ホールドアウトして）学習には使わず、そのデータで評価するのが一般的です。この方法をホールドアウト検証といいます。","sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"},{"title":"scikit-learn User Guide 1.10 Decision Trees","url":"https://scikit-learn.org/stable/modules/tree.html"}],"status":"active"},{"id":"Q-070","category":3,"question":"k-分割交差検証の説明として、最も適切なものはどれか。","choices":["データを k 個に分け、k−1 個で学習して残りの1個で評価することを k 回繰り返し、評価の平均をとる","データを k 個に分け、そのうち1個だけで学習して、残りの k−1 個はまったく使わずに評価を終える","同じデータで学習と評価を k 回繰り返し、最も評価が高かった回の結果だけを報告する","データから重複を許して k 回取り出し、それぞれで作ったモデルの予測を多数決でまとめる"],"answer":0,"explanation":"k-分割交差検証は、手元のデータを k 個のグループ（フォールド）にほぼ同じ大きさで分け、そのうち k−1 個で学習し、残りの1個で評価することを、評価に使うグループを入れ替えながら k 回繰り返す方法です。最後に k 回の評価の平均を、モデルの性能とします。すべてのデータが一度は評価に使われるため、データを一度だけ学習用と評価用に分けるホールドアウト検証に比べて、データが少ないときでも評価のばらつきを抑えやすくなります。k をデータの数と同じにしたものを、一つ抜き交差検証（Leave-One-Out）と呼びます。\n1個だけで学習して残りを使わない方法ではありません。\n同じデータで学習と評価をすると過学習を見逃します。また、最も良い回だけを報告するのは適切な評価ではありません。\n「重複を許して取り出したデータでモデルを作り、多数決でまとめる」のは、バギングの説明です。","sources":[{"title":"scikit-learn User Guide 3.1 Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html"}],"status":"active"},{"id":"Q-071","category":3,"question":"2クラス分類の評価で使う混同行列に関する説明として、最も適切なものはどれか。","choices":["実際は陰性なのに陽性と予測したものを偽陽性（FP）、実際は陽性なのに陰性と予測したものを偽陰性（FN）という","実際は陽性なのに陰性と予測したものを偽陽性（FP）、実際は陰性なのに陽性と予測したものを偽陰性（FN）という","実際も予測も陽性のものを真陰性（TN）、実際も予測も陰性のものを真陽性（TP）という","混同行列は、回帰問題の予測値と実際の値の差の2乗を、表の形にまとめたものである"],"answer":0,"explanation":"混同行列は、分類モデルの予測結果を、実際のクラスと予測したクラスの組み合わせごとに数えて表にしたものです。2クラス分類では、次の4つに分けます。\n・真陽性（TP）: 実際は陽性で、陽性と予測した（正しい）\n・偽陽性（FP）: 実際は陰性
