なのに、陽性と予測した（誤り）\n・偽陰性（FN）: 実際は陽性なのに、陰性と予測した（誤り、見逃し）\n・真陰性（TN）: 実際は陰性で、陰性と予測した（正しい）\n「陽性・陰性」は予測の内容を、「真・偽」はその予測が正しかったかどうかを表します。たとえば病気の検査で、健康な人を病気と判定するのが偽陽性、病気の人を見逃すのが偽陰性です。\n偽陽性と偽陰性、真陽性と真陰性の説明が入れ替わっている選択肢は誤りです。\n混同行列は分類問題の評価に使うもので、回帰問題の誤差の表ではありません。","sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}],"status":"active"},{"id":"Q-072","category":3,"question":"ある2クラス分類モデルをテストデータで評価したところ、真陽性（TP）が40件、偽陽性（FP）が10件、偽陰性（FN）が20件、真陰性（TN）が30件だった。このモデルの適合率（Precision）として、正しいものはどれか。","choices":["0.80","0.67","0.70","0.73"],"answer":0,"explanation":"適合率（Precision）は、陽性と予測したもののうち、実際に陽性だったものの割合で、TP ÷（TP + FP）で計算します。\n40 ÷（40 + 10）= 40 ÷ 50 = 0.80 です。\n0.67 は再現率（Recall）です。再現率は、実際に陽性のもののうち、陽性と予測できたものの割合で、TP ÷（TP + FN）= 40 ÷ 60 ≒ 0.67 です。\n0.70 は正解率（Accuracy）です。正解率は、全体のうち予測が正しかったものの割合で、（TP + TN）÷ 全体 = 70 ÷ 100 = 0.70 です。\n0.73 はF値です。F値は適合率と再現率の調和平均で、2 × 0.80 × 0.67 ÷（0.80 + 0.67）≒ 0.73 です。","sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}],"status":"active"},{"id":"Q-073","category":3,"question":"分類モデルの評価指標であるF値（F1スコア）の説明として、最も適切なものはどれか。","choices":["適合率と再現率の調和平均で、どちらか一方だけが高くても値が大きくなりにくい","適合率と再現率の算術平均（足して2で割った値）で、一方が0でも0.5になり得る","全体のデータのうち、予測が正しかったデータの割合をそのまま表した値である","予測値と実際の値の差の2乗の平均で、回帰問題の評価に使われる値である"],"answer":0,"explanation":"F値（F1スコア）は、適合率（陽性と予測したもののうち実際に陽性の割合）と再現率（実際に陽性のもののうち陽性と予測できた割合）の調和平均で、2 × 適合率 × 再現率 ÷（適合率 + 再現率）で計算します。値は0〜1で、1が最も良い値です。\n適合率と再現率は、しきい値の調整などで一方を上げると他方が下がる関係になりやすい指標です。調和平均は小さいほうの値に引っ張られるため、F値は、どちらか一方だけが高くても大きな値になりにくく、両方のバランスを見るのに向いています。\n算術平均ではありません。算術平均なら、再現率が1で適合率が0でも0.5になってしまいます。\n「予測が正しかった割合」は正解率（Accuracy）の説明です。\n「差の2乗の平均」は平均二乗誤差（MSE）の説明です。","sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}],"status":"active"},{"id":"Q-074","category":3,"question":"ROC曲線とAUCに関する説明として、最も適切なものはどれか。","choices":["ROC曲線は、しきい値を変えたときの偽陽性率と真陽性率の関係を描いたもので、AUCはその曲線の下の面積である","ROC曲線は、学習の回数と損失の関係を描いたもので、AUCは損失が最も小さくなった回数である","ROC曲線は、回帰問題で予測値と実際の値の関係を描いたもので、AUCは平均二乗誤差の別名である","AUCの値が小さいほど分類の性能が高く、最も良いモデルではAUCが0になる"],"answer":0,"explanation":"ROC曲線は、2クラス分類モデルで「陽性と判定するしきい値」をいろいろ変えたときに、横軸に偽陽性率（実際は陰性のもののうち、誤って陽性と判定した割合）、縦軸に真陽性率（実際は陽性のもののうち、正しく陽性と判定した割合。再現率と同じ）をとって描いた曲線です。\nAUC（Area Under the Curve）は、ROC曲線の下の面積で、曲線の情報を1つの数値にまとめたものです。0〜1の値をとり、1に近いほど陽性と陰性をよく見分けられるモデルです。ランダムに判定するモデルのAUCはおよそ0.5になります。しきい値を1つに決めなくても性能を比べられるのが特徴です。\n学習の回数と損失の関係は、学習曲線の説明です。\nROC曲線は分類モデルの評価に使うもので、回帰問題の評価には使いません。\nAUCは大きいほど性能が高い指標です。","sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}],"status":"active"},{"id":"Q-075","category":3,"question":"ある回帰モデルの4つのデータに対する誤差（実際の値 − 予測値）が、1、−1、2、−2 だった。このときの平均二乗誤差（MSE）として、正しいものはどれか。","choices":["2.5","1.5","1.58","0"],"answer":0,"explanation":"平均二乗誤差（MSE）は、誤差を2乗してから平均した値です。\n（1² + (−1)² + 2² + (−2)²）÷ 4 =（1 + 1 + 4 + 4）÷ 4 = 10 ÷ 4 = 2.5 です。\n1.5 は平均絶対誤差（MAE）です。MAEは誤差の絶対値の平均で、（1 + 1 + 2 + 2）÷ 4 = 1.5 です。\n1.58 は二乗平均平方根誤差（RMSE）です。RMSEはMSEの平方根で、√2.5 ≒ 1.58 です。平方根をとるので、予測したい値と同じ単位で誤差の大きさを表せます。\n0 は誤差をそのまま平均した値です。正と負の誤差が打ち消し合うため、誤差の大きさの評価には使えません。\nMSEやRMSEは誤差を2乗するため、大きな誤差をより重く評価します。外れ値の影響を受けやすいのに対し、MAEは誤差の大きさをそのまま平均するため、外れ値の影響を比較的受けにくいという違いがあります。","sources":[{"title":"scikit-learn User Guide 3.4 Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html"}],"status":"active"},{"id":"Q-076","category":3,"question":"モデルの選択に使われる赤池情報量規準（AIC）とベイズ情報量規準（BIC）に関する説明として、最も適切なものはどれか。","choices":["どちらもデータへの当てはまりのよさに、パラメータの数に応じた罰則を加えた指標で、値が小さいモデルほどよいとされる","どちらもパラメータの数が多いモデルほど値が小さくなる指標で、複雑なモデルを選びやすくする","どちらも分類モデルの予測の正解率をそのまま表した指標で、値が大きいモデルほどよいとされる","BICはAICと異なり、パラメータの数をまったく考慮せず、当てはまりのよさだけで決まる指標である"],"answer":0,"explanation":"AICとBICは、複数のモデルの中からよいモデルを選ぶための指標（情報量規準）です。どちらも、モデルのデータへの当てはまりのよさ（最大尤度）を表す項に、パラメータの数に応じた罰則の項を加えたもので、値が小さいモデルほどよいとされます。AICは「−2 × 最大対数尤度 + 2 × パラメータ数」で、BICは罰則の係数2をデータ数 N の対数（log N）に置き換えたものです。データ数が多いときは、BICのほうがパラメータの多いモデルを強く罰します。\nパラメータを増やせば当てはまりはよくなりますが、複雑になりすぎると過学習するため、罰則で複雑さを抑えます。これは、同じくらい説明できるなら単純なモデルを選ぶべきだという「オッカムの剃刀」の考え方に通じます。\nAICやBICはパラメータの多いモデルを罰する指標で、正解率そのものではありません。\nBICもパラメータの数を考慮します。","sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"title":"statsmodels Time Series analysis (tsa)","url":"https://www.statsmodels.org/stable/tsa.html"}],"status":"active"},{"id":"Q-077","category":3,"question":"機械学習のモデル選択でいわれる「オッカムの剃刀」の考え方として、最も適切なものはどれか。","choices":["データを同じくらいうまく説明できるなら、より単純なモデルを選ぶほうがよいという考え方","モデルは複雑であればあるほど、未知のデータに対しても必ず高い性能を出すという考え方","学習データに対する誤差が0になるまで、モデルを複雑にし続けるべきだという考え方","モデルの性能は、学習にかかった時間が長いほど高くなるので、時間をかけるべきだという考え方"],"answer":0,"explanation":"オッカムの剃刀は、「ある現象を説明するのに、必要以上に多くの仮定を置くべきではない」という考え方で、機械学習では「データを同じくらいうまく説明できるなら、より単純なモデルを選ぶほうがよい」という指針として使われます。単純さを好む傾向（単純さへのバイアス）は、よい学習方法に共通する性質だと昔からいわれてきました。複雑すぎるモデルは学習データの偶然のばらつきまで覚えてしまい、過学習しやすいためです。\nパラメータの数に罰則を加えるAICやBIC、モデルの複雑さを抑える正則化などは、この考え方を具体的な方法にしたものといえます。\n複雑なモデルほど必ず性能が高いわけではなく、過学習のおそれがあります。\n学習データの誤差を0にしようとすると、過学習につながります。\n学習時間の長さは、オッカムの剃刀の考え方とは関係ありません。","sources":[{"title":"Tom F. Sterkenburg \"Statistical learning theory and Occam's razor: The argument from empirical risk minimization\" (arXiv:2312.13842)","url":"https://arxiv.org/abs/2312.13842"},{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}],"status":"active"},{"id":"Q-078","category":4,"question":"単純パーセプトロンと多層パーセプトロンに関する説明として、最も適切なものはどれか。","choices":["単純パーセプトロンは直線（超平面）で分けられる問題しか解けないが、隠れ層を持つ多層パーセプトロンは非線形な関係も学習できる","単純パーセプトロンは隠れ層を何層も持つため、多層パーセプトロンよりも複雑な非線形の関係を学習できる","多層パーセプトロンは隠れ層を持たず、入力層から出力層へ直接つながる、最も単純なネットワークである","単純パーセプトロンも多層パーセプトロンも、線形な関係しか学習できない点でまったく同じ能力を持つ"],"answer":0,"explanation":"単純パーセプトロンは、入力層と出力層だけからなる最も単純なニューラルネットワークです。入力に重みを掛けて足し合わせた値で出力を決めるため、クラスを直線（超平面）で分けられる問題（線形分離可能な問題）しか解けません。1960年代末にミンスキーとパパートがこの限界を指摘しました。\n多層パーセプトロン（MLP）は、入力層と出力層の間に、非線形の活性化関数を持つ隠れ層を1層以上はさんだネットワークです。隠れ層を持つことで、非線形な関係を学習でき、分類にも回帰にも使えます。学習には誤差逆伝播法が使われます。隠れ層を多く重ねたものがディープラーニング（深層学習）です。\n隠れ層を持つのは多層パーセプトロンのほうです。\n多層パーセプトロンは非線形な関係も学習できるので、単純パーセプトロンと同じ能力ではありません。","sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"人工知能学会「人工知能の歴史」","url":"https://www.ai-gakkai.or.jp/whatsai/AIhistory.html"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"}],"status":"active"},{"id":"Q-079","category":4,"question":"多層パーセプトロンの層に関する説明として、最も適切なものはどれか。","choices":["入力層は特徴量を受け取り、隠れ層は前の層の値に重みを掛けて足し合わせ活性化関数で変換し、出力層が最終的な値を出す","入力層で活性化関数による変換を行い、隠れ層は何も計算せずに、値をそのまま出力層へ渡す","出力層は特徴量を受け取る層で、入力層が最終的な予測値を出力する層である","隠れ層は学習には関わらない層で、その重みは学習の前に決めた値から変化しない"],"answer":0,"explanation":"多層パーセプトロンは、次の3種類の層からなります。\n・入力層: 入力の特徴量を表すニューロンの集まりです。\n・隠れ層: 前の層の値に重みを掛けて足し合わせ（重み付きの線形和）、それを非線形の活性化関数（tanhなど）で変換して次の層へ渡します。1層以上置くことができます。\n・出力層: 最後の隠れ層の値を受け取り、最終的な出力の値に変換します。\n層と層の間の重みは、学習によって調整されます。隠れ層の重みも学習の対象です。\n入力層は変換を行わずに特徴量を受け取る層で、計算を行うのは隠れ層と出力層です。\n入力層と出力層の役割が入れ替わっている選択肢は誤りです。","sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}],"status":"active"},{"id":"Q-080","category":4,"question":"ディープラーニングで使われる計算機（CPU、GPU、TPU）に関する説明として、最も適切なものはどれか。","choices":["GPUは多数の演算を並列に処理でき、行列やベクトルの掛け算が速いため、ニューラルネットワークの学習を大きく速くした","GPUはもともと文字の入力を処理するために作られたもので、行列の計算は苦手なため深層学習には向かない","TPUは、ディープラーニングとは関係のない、表計算ソフトの計算を速くするために作られた専用の半導体である","CPUはGPUよりも同時に処理できる演算の数がはるかに多いため、深層学習の学習にはCPUだけが使われる"],"answer":0,"explanation":"GPU（Graphics Processing Unit）は、もともと画像処理のために作られた半導体で、多数の演算を並列に処理できます。ゲーム市場の大きさから安価になり、ニューラルネットワークの学習に必要な行列やベクトルの掛け算を高速に行えるため、学習を50倍以上速くすることもありました。これが深層学習の成功を支えました。\nTPU（Tensor Processing Unit）は、グーグルがニューラルネットワークの計算のために開発した専用の半導体（ASIC）で、大規模な行列の掛け算の回路を持ちます。論文では、推論の処理で、同じ時期のGPUやCPUの約15〜30倍の速さと報告されています。\nCPU（Central Processing Unit）は、さまざまな処理を順序立てて行う汎用的な処理装置です。複雑な処理は得意ですが、同時に行える演算の数はGPUより少なく、大量の行列計算にはGPUやTPUのほうが向いています。\nGPUは画像処理用で、行列の計算は得意です。\nTPUはニューラルネットワークのための半導体です。","sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"Norman P. Jouppi ほか \"In-Datacenter Performance Analysis of a Tensor Processing Unit\" (arXiv:1704.04760)","url":"https://arxiv.org/abs/1704.04760"},{"title":"総務省 令和6年版 情報通信白書「生成AIの急速な進化と普及」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd131210.html"}],"status":"active"},{"id":"Q-081","category":4,"question":"シグモイド関数とtanh関数に関する説明として、最も適切なものはどれか。","choices":["シグモイド関数の出力は0から1の範囲、tanh関数の出力は−1から1の範囲で、どちらも入力が大きいと勾配が0に近づく","シグモイド関数の出力は−1から1の範囲、tanh関数の出力は0から1の範囲で、どちらも勾配消失を起こさない","シグモイド関数もtanh関数も、入力が正なら入力をそのまま出力し、負なら0を出力する関数である","シグモイド関数もtanh関数も、出力が0から無限大までの範囲をとり、上限がない関数である"],"answer":0,"explanation":"シグモイド関数（ロジスティック関数）は、1 ÷（1 + e^(−x)）で表され、出力を0から1の範囲に押し込めます。tanh関数（双曲線正接関数）は、シグモイド関数と似た形ですが、出力は−1から1の範囲で、0を中心に対称です。どちらも、ニューラルネットワークに非線形性を持たせるため、初期から使われてきました。\nただし、どちらも入力の値が大きい（または小さい）と出力が飽和し、勾配（傾き）が0に近づきます。層を重ねた深いネットワークでは、誤差逆伝播のときに勾配がどんどん小さくなって、入力に近い層のパラメータがほとんど更新されなくなる「勾配消失問題」の原因になります。\n出力の範囲が入れ替わっている選択肢は誤りです。\n「正なら入力をそのまま、負なら0を出力する」のは、ReLU関数の説明です。","sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}],"status":"active"},{"id":"Q-082","category":4,"question":"ReLU関数とLeaky ReLU関数に関する説明として、最も適切なものはどれか。","choices":["ReLUは入力が負のとき0を出力し勾配も0になるが、Leaky ReLUは負の入力に対しても小さな傾きを持たせる","ReLUは入力が負のときも入力に比例した値を出力し、Leaky ReLUは負の入力に対して必ず0を出力する","ReLUもLeaky ReLUも出力を0から1の範囲に押し込める関数で、確率を表すのに使われる","ReLUは計算が複雑なため、深層学習ではほとんど使われず、シグモイド関数が主流である"],"answer":0,"explanation":"ReLU（Rectified Linear Unit、正規化線形関数）は、入力が0以上ならそのまま出力し、負なら0を出力する関数です。出力の範囲は0から無限大で、正の入力に対する勾配は1、負の入力に対する勾配は0です。計算が簡単で、シグモイド関数やtanh関数のように正の側で勾配が小さくなることがないため、深層学習の活性化関数として広く使われています（AlexNetでも使われました）。\n一方、ReLUは負の入力に対して勾配が0になるため、負の入力の情報を生かせず、その部分で学習が進まなくなることがあります。Leaky ReLUはこれを改良したもので、負の入力に対して小さな傾き（例: 0.01 × x）の値を出力します。傾きを学習で決めるParametric ReLU（PReLU）という派生もあります。\nReLUとLeaky ReLUの説明が入れ替わっている選択肢は誤りです。\n出力を0から1に押し込めるのは、シグモイド関数です。","sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}],"status":"active"},{"id":"Q-083","category":4,"question":"ソフトマックス関数の説明として、最も適切なものはどれか。","choices":["複数の値を、すべて0以上で合計が1になる値に変換し、多クラス分類の出力層で各クラスの確率として使われる","入力が負なら0、正ならそのまま出力する関数で、隠れ層の活性化関数として広く使われる","予測値と正解の値の差を2乗して平均する関数で、回帰問題の誤差関数として使われる","学習の途中でニューロンの一部をランダムに無効にして、過学習を防ぐための関数である"],"answer":0,"explanation":"ソフトマックス関数は、複数の値（各クラスのスコア）を、すべて0以上で合計が1になる値に変換する関数です。変換した値は、カテゴリーごとの確率の分布として解釈できるため、多クラス分類のニューラルネットワークの出力層でよく使われます。スコアが大きいクラスほど大きな確率になります。多クラス分類では、ソフトマックス関数の出力と正解との間の交差エントロピーを誤差関数として使うのが一般的です。\n「負なら0、正ならそのまま出力する」のは、ReLU関数の説明です。\n「差を2乗して平均する」のは、平均二乗誤差の説明です。\n「ニューロンの一部をランダムに無効にする」のは、ドロップアウトの説明です。","sources":[{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"},{"title":"PyTorch Documentation torch.nn.CrossEntropyLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html"}],"status":"active"},{"id":"Q-084","category":4,"question":"深いニューラルネットワークの学習で起きる「勾配消失問題」と「勾配爆発問題」の説明として、最も適切なものはどれか。","choices":["誤差逆伝播で勾配が層をさかのぼるうちに、極端に小さくなるのが勾配消失、極端に大きくなるのが勾配爆発である","誤差逆伝播で勾配が層をさかのぼるうちに、極端に大きくなるのが勾配消失、極端に小さくなるのが勾配爆発である","勾配消失は学習データが多すぎると起き、勾配爆発は学習データが少なすぎると起きる問題である","どちらも、活性化関数を使わないネットワークだけで起き、活性化関数を使えば必ず起きない問題である"],"answer":0,"explanation":"誤差逆伝播法では、出力側から入力側へ勾配を順に掛け合わせながら伝えていきます。層が深くなると、この掛け合わせによって勾配が指数関数的に変化することがあります。\n勾配消失問題は、入力に近い層ほど勾配が極端に小さく（0に近く）なり、パラメータがほとんど更新されなくなる問題です。シグモイド関数やtanh関数のように勾配が1より小さくなりやすい活性化関数を使うと起きやすくなります。リカレントニューラルネットワークでは、時間的に離れた出来事の関係を学べない原因になります。ReLU関数の利用や、スキップ結合、LSTMなどが対策になります。\n勾配爆発問題は、逆に勾配の大きさが極端に大きくなり、学習が不安定になる問題です。勾配の大きさが決めた上限を超えたら縮める「勾配クリッピング」が対策として使われます。\n勾配消失と勾配爆発の説明が入れ替わっている選択肢は誤りです。\nどちらもデータの量で決まる問題ではありません。","sources":[{"title":"Razvan Pascanu ほか \"On the difficulty of training Recurrent Neural Networks\" (arXiv:1211.5063)","url":"https://arxiv.org/abs/1211.5063"},{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning: A Comprehensive Survey and Benchmark\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"}],"status":"active"},{"id":"Q-085","category":4,"question":"ニューラルネットワークの誤差関数の選び方として、最も適切なものはどれか。","choices":["回帰問題には平均二乗誤差、分類問題には交差エントロピーがよく使われる","回帰問題には交差エントロピー、分類問題には平均二乗誤差だけが使われる","分類問題では誤差関数を使わず、正解率を直接最大にするように学習する","誤差関数はどの問題でも同じものを使い、タスクに応じて選ぶ必要はない"],"answer":0,"explanation":"誤差関数（損失関数）は、モデルの予測と正解とのずれを表す関数で、学習ではこれを小さくするようにパラメータを調整します。タスクに応じて適切なものを選びます。\n回帰問題では、予測値と正解の値の差を2乗して平均する平均二乗誤差（MSE）がよく使われます。\n分類問題では、予測した各クラスの確率と正解のクラスとのずれを表す交差エントロピーがよく使われます。多クラス分類では、出力層にソフトマックス関数を置き、その出力と正解との交差エントロピーを使うのが一般的です。\n正解率は微分できないため、誤差関数として直接最適化するのには向きません。\nタスクによって適した誤差関数は異なります。","sources":[{"title":"PyTorch Documentation torch.nn.MSELoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.MSELoss.html"},{"title":"PyTorch Documentation torch.nn.CrossEntropyLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html"}],"status":"active"},{"id":"Q-086","category":4,"question":"カルバック・ライブラー情報量（KLダイバージェンス）の説明として、最も適切なものはどれか。","choices":["2つの確率分布がどれだけ異なるかを表す量で、分布が一致するとき0になり、誤差関数としても使われる","2つの確率分布の平均値の差の絶対値を表す量で、分布の形は一切考慮しない","2つの確率分布がどれだけ異なるかを表す量で、分布が一致するときに最大の値をとる","学習データの件数を表す量で、多いほど値が大きくなり、モデルの性能を直接表す"],"answer":0,"explanation":"カルバック・ライブラー情報量（KLダイバージェンス）は、2つの確率分布がどれだけ異なるかを表す量です。正解の分布を p、予測の分布を q とすると、p × log(p ÷ q) を足し合わせたもので表され、2つの分布が一致するときに0になり、異なるほど大きくなります。ただし、p と q を入れ替えると値が変わる（対称ではない）ため、厳密な意味での距離ではありません。\n予測の分布を正解の分布に近づけたいときの誤差関数として使われ、変分オートエンコーダ（VAE）の学習などにも登場します。交差エントロピーとも深い関係があります。\n平均値の差だけを見る量ではありません。\n分布が一致するときに0（最小）になります。\n学習データの件数とは関係ありません。","sources":[{"title":"PyTorch Documentation torch.nn.KLDivLoss","url":"https://docs.pytorch.org/docs/2.14/generated/torch.nn.KLDivLoss.html"}],"status":"active"},{"id":"Q-087","category":4,"question":"距離学習（メトリック学習）で使われるContrastive LossとTriplet Lossに関する説明として、最も適切なものはどれか。","choices":["Contrastive Lossはペアを、Triplet Lossは基準・同類・異類の3つ組を使い、似たものを近くに配置する","Contrastive Lossは3つ組を、Triplet Lossはペアを使い、どちらも似たものほど遠くに配置するように学習する","どちらも回帰問題で予測値と正解の値の差を2乗して平均する誤差関数で、距離とは関係がない","どちらも正解のクラスの確率だけを使う誤差関数で、データどうしの近さはまったく考慮しない"],"answer":0,"explanation":"Contrastive LossとTriplet Lossは、ニューラルネットワークがデータを埋め込む空間で、意味の似たデータどうしを近くに、異なるデータどうしを遠くに配置するように学習する、距離学習の誤差関数です。顔認証など、データどうしの似ている度合いを測りたい場面で使われます。\nContrastive Lossは、ハドセルらが提案したもので、データの組（ペア）を使います。似ている組（正例のペア）は距離が小さくなるように、似ていない組（負例のペア）は距離が決めた幅（マージン）以上になるように学習します。\nTriplet Lossは、基準となるデータ（アンカー）、それと同じ種類のデータ（ポジティブ）、異なる種類のデータ（ネガティブ）の3つ組を使い、アンカーとポジティブの距離が、アンカーとネガティブの距離よりマージン以上小さくなるように学習します。顔認識のFaceNetで使われました。\nペアと3つ組の説明が入れ替わっている選択肢は誤りです。\nどちらも距離（近さ）に基づく誤差関数です。","sources":[{"title":"\"Comparing Contrastive and Triplet Loss: Variance Analysis and Optimization Behavior\" (arXiv:2510.02161)","url":"https://arxiv.org/abs/2510.02161"},{"title":"Florian Schroff ほか \"FaceNet: A Unified Embedding for Face Recognition and Clustering\" (arXiv:1503.03832)","url":"https://arxiv.org/abs/1503.03832"}],"status":"active"},{"id":"Q-088","category":4,"question":"L1正則化とL2正則化に関する説明として、最も適切なものはどれか。","choices":["L1正則化を使うラッソ回帰は一部の係数をちょうど0にしやすく、L2正則化を使うリッジ回帰は係数全体を小さくする","L2正則化を使うラッソ回帰は一部の係数をちょうど0にしやすく、L1正則化を使うリッジ回帰は係数を大きくする","L1正則化もL2正則化も、係数を大きくすることで学習データへの当てはまりを強め、過学習を促す","L1正則化とL2正則化は、どちらも誤差関数に何も加えずに、学習データの数を増やす手法である"],"answer":0,"explanation":"正則化は、誤差関数にモデルの複雑さに応じた罰則（正則化項）を加えて、係数（重み）が大きくなりすぎるのを抑え、過学習を防ぐ方法です。\nL1正則化は、係数の絶対値の和を罰則として加えます。線形回帰にL1正則化を加えたものがラッソ回帰（Lasso）で、一部の係数をちょうど0にする性質（スパース性）があります。0になった係数の特徴量は使われなくなるため、特徴量を選ぶ働きもします。\nL2正則化は、係数の2乗の和を罰則として加えます。線形回帰にL2正則化を加えたものがリッジ回帰（Ridge）で、係数全体を0に近づけるように小さくしますが、ちょうど0にはなりにくい性質があります。\nどちらも、罰則の強さを決める係数（ハイパーパラメータ）を大きくするほど、係数は小さく抑えられます。\nラッソ回帰とリッジ回帰の正則化の種類が入れ替わっている選択肢は誤りです。\n正則化は過学習を防ぐための方法です。","sources":[{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}],"status":"active"},{"id":"Q-089","category":4,"question":"L0正則化の説明として、最も適切なものはどれか。","choices":["0でない重みの個数を罰則にする正則化で、重みをちょうど0にしやすいが、そのままでは微分できない","重みの2乗の和を罰則にする正則化で、重み全体を小さくするが、ちょうど0にはなりにくい","重みの絶対値の和を罰則にする正則化で、リッジ回帰とも呼ばれる","学習率を0にして、学習を止めることで過学習を防ぐ正則化の方法である"],"answer":0,"explanation":"L0正則化は、0でない重みの個数（L0ノルム）を罰則として加える正則化です。重みをちょうど0にすることで、ネットワークの不要な部分を取り除き（枝刈り）、学習や推論を速くしたり、汎化性能を高めたりすることが期待されます。モデル選択の基準であるAICやBICは、L0正則化の特別な場合とみなせます。\nただし、0でない重みの個数は重みについて微分できないため、そのままでは誤差関数に加えて勾配法で最適化することができません。そのため、確率的なゲートを使って近似するなどの工夫が提案されています。\n「重みの2乗の和を罰則にする」のはL2正則化です。\n「重みの絶対値の和を罰則にする」のはL1正則化で、線形回帰に加えたものはラッソ回帰です（リッジ回帰はL2正則化です）。\n学習率を0にする方法は正則化ではありません。","sources":[{"title":"Christos Louizos ほか \"Learning Sparse Neural Networks through L0 Regularization\" (arXiv:1712.01312)","url":"https://arxiv.org/abs/1712.01312"},{"title":"scikit-learn User Guide 1.1 Linear Models","url":"https://scikit-learn.org/stable/modules/linear_model.html"}],"status":"active"},{"id":"Q-090","category":4,"question":"ドロップアウトの説明として、最も適切なものはどれか。","choices":["学習のたびにニューロンの一部をランダムに無効にして学習し、特定のニューロンどうしの依存を防いで過学習を抑える","学習の最初に不要なニューロンを永久に取り除き、推論のときにも取り除いたままにしておく方法","学習の途中で、学習データの一部をランダムに捨てることで、計算の量を減らす方法","ニューロンの出力を平均0、分散1になるように正規化して、学習を安定させる方法"],"answer":0,"explanation":"ドロップアウトは、ヒントンらが提案した、ニューラルネットワークの過学習を抑える方法です。学習のたびに、隠れ層などのニューロンの一部（例: 半分）をランダムに選んで無効にして学習します。これにより、あるニューロンが他の特定のニューロンがあるときだけ役に立つ、という複雑な依存関係（共適応）ができにくくなり、どのような状況でも役に立つ特徴を学ぶようになります。多数の異なるネットワークを学習して平均するのに近い効果があります。\n推論（テスト）のときは、すべてのニューロンを使い、学習時に無効にした割合に応じて重みを調整します。\n永久にニューロンを取り除くのは、ドロップアウトではありません。推論のときはすべてのニューロンを使います。\n学習データを捨てる方法ではありません。\n「出力を平均0、分散1に正規化する」のは、バッチ正規化などの正規化の説明です。","sources":[{"title":"Geoffrey E. Hinton ほか \"Improving neural networks by preventing co-adaptation of feature detectors\" (arXiv:1207.0580)","url":"https://arxiv.org/abs/1207.0580"}],"status":"active"},{"id":"Q-091","category":4,"question":"誤差逆伝播法と連鎖律に関する説明として、最も適切なものはどれか。","choices":["出力の誤差を出力層から入力層へ逆向きに伝え、合成関数の微分の規則である連鎖律を使って各層の重みの勾配を効率よく求める","入力層から出力層へ向かって誤差を伝え、各層の重みをランダムな値に置き換えることで学習を進める","連鎖律は、ニューラルネットワークの層をつなぐ順番を決める規則で、微分とは関係がない","誤差逆伝播法は、正解のラベルを使わない教師なし学習のためだけに考え出された手法である"],"answer":0,"explanation":"誤差逆伝播法（バックプロパゲーション）は、ニューラルネットワークの学習で、誤差関数の各重みについての勾配を効率よく求める方法です。出力層で求めた誤差を、出力層から入力層へ向かって逆向きに伝えながら、各層の重みの勾配を順に計算します。\nこの計算の土台になっているのが、合成関数の微分の規則である連鎖律です。ニューラルネットワークは層ごとの関数を重ねた合成関数なので、ある重みについての勾配は、その先の層の勾配を掛け合わせることで求められます。求めた勾配を使って、勾配降下法で重みを更新します。\n入力層から出力層へ向かうのは、予測を計算する順伝播です。重みをランダムに置き換える方法ではありません。\n連鎖律は微分の規則です。\n誤差逆伝播法は、教師あり学習の多層パーセプトロンの学習などで広く使われています。","sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}],"status":"active"},{"id":"Q-092","category":4,"question":"機械学習でいう「信用割当問題」の説明として、最も適切なものはどれか。","choices":["学習システムの結果の成功や失敗に、どの部分がどれだけ貢献したのかを決めるのが難しいという問題","学習データの正解のラベルが、どれだけ信用できるかを判定するのが難しいという問題","利用者の信用情報を学習に使うときに、個人情報の保護が必要になるという問題","クラウド上の計算資源を、どの利用者にどれだけ割り当てるかを決める問題"],"answer":0,"explanation":"信用割当問題（クレジット・アサインメント問題）は、「学習システムのどの変更可能な部分が、その成功や失敗に責任を持つのか。それらをどう変えれば性能がよくなるのか」という問題で、ミンスキーが1963年に取り上げました。\nニューラルネットワークでは、出力の誤差に対して、多くの層にある多数の重みがそれぞれどれだけ関わっているかを決める必要があります。誤差逆伝播法は、連鎖律を使って各重みの勾配を求めることで、この問題に答える方法の一つといえます。強化学習でも、最終的な報酬に、過去のどの行動がどれだけ貢献したかを決める問題として現れます。\n正解のラベルの信頼性、個人の信用情報、計算資源の割り当てのことではありません。","sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"}],"status":"active"},{"id":"Q-093","category":4,"question":"勾配降下法と学習率に関する説明として、最も適切なものはどれか。","choices":["誤差関数の勾配と逆の方向にパラメータを更新する方法で、学習率が小さすぎると収束が遅く、大きすぎると発散することがある","誤差関数の勾配と同じ方向にパラメータを更新する方法で、学習率は大きいほど必ず速く正確に収束する","学習率は、学習データの件数を表す値で、パラメータの更新の大きさとは関係がない","勾配降下法は、誤差関数の値をできるだけ大きくするように、パラメータを調整する方法である"],"answer":0,"explanation":"勾配降下法は、誤差関数の値を小さくするために、パラメータについての勾配（傾き）と逆の方向に、パラメータを少しずつ更新していく方法です。誤差関数を地形にたとえると、坂を下る方向に進んで谷底を目指すイメージです。\n1回の更新でどれだけ進むかを決めるのが学習率です。学習率が小さすぎると収束がとても遅くなり、大きすぎると最小値の付近で行ったり来たりしたり、発散したりします。学習の進み具合に応じて学習率を下げていく方法（学習率のスケジュール）もあります。学習率は人が決めるハイパーパラメータの一つです。\n勾配と同じ方向に進むと、誤差関数は大きくなってしまいます。\n学習率は更新の大きさを決める値で、データの件数ではありません。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}],"status":"active"},{"id":"Q-094","category":4,"question":"バッチ学習、ミニバッチ学習、確率的勾配降下法（SGD）に関する説明として、最も適切なものはどれか。","choices":["バッチ学習は全データで勾配を計算して1回更新し、SGDは1件ごとに更新し、ミニバッチ学習は少数のデータのまとまりごとに更新する","バッチ学習は1件ごとに更新し、SGDは全データで勾配を計算して1回だけ更新する方法である","ミニバッチ学習は、全データの中からランダムに1件だけ選び、その1件だけで学習を終える方法である","SGDは全データで勾配を計算するため、データが多いほど1回の更新が速く、メモリも少なくて済む"],"answer":0,"explanation":"勾配降下法は、1回の更新に使うデータの量によって、次のように分けられます。\n・バッチ学習（バッチ勾配降下法）: 学習データ全体で勾配を計算してから、パラメータを1回更新します。1回の更新に時間がかかり、メモリに収まらない大量のデータには使いにくいという欠点があります。\n・確率的勾配降下法（SGD）: 学習データを1件ずつ使って、そのたびにパラメータを更新します。更新が速く、新しいデータが届くたびに学習するオンライン学習にも使えます。更新のばらつきが大きく、誤差が大きく揺れますが、その揺れによって、よりよい局所解に移れることもあります。\n・ミニバッチ学習: 少数のデータのまとまり（ミニバッチ）ごとに勾配を計算して更新します。更新のばらつきを抑えつつ、行列計算による高速化も生かせるため、深層学習で最もよく使われます（実際には、これもSGDと呼ばれることが多いです）。\nバッチ学習とSGDの説明が入れ替わっている選択肢は誤りです。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}],"status":"active"},{"id":"Q-095","category":4,"question":"ニューラルネットワークの学習における「エポック」と「イテレーション」の説明として、最も適切なものはどれか。","choices":["エポックは学習データ全体を1回使い切る単位で、イテレーションはパラメータを1回更新する単位である","エポックはパラメータを1回更新する単位で、イテレーションは学習データ全体を1回使い切る単位である","エポックもイテレーションも、ニューラルネットワークの層の数を表す言葉である","エポックは学習にかかった時間を秒で表したもので、イテレーションはデータの件数を表す"],"answer":0,"explanation":"エポックは、学習データ全体を1回ずつ使い切る単位です。たとえば「10エポック学習する」とは、各データを10回ずつ学習に使うことを意味します。\nイテレーションは、パラメータを1回更新する単位です。ミニバッチ学習では、1回のイテレーションで1つのミニバッチを使います。\nたとえば、学習データが1000件でミニバッチの大きさが100件なら、1エポックは1000 ÷ 100 = 10イテレーションになります。\nエポックとイテレーションの説明が入れ替わっている選択肢は誤りです。\n層の数、時間、データの件数を表す言葉ではありません。","sources":[{"title":"scikit-learn API sklearn.neural_network.MLPClassifier","url":"https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html"},{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}],"status":"active"},{"id":"Q-096","category":4,"question":"学習データが時間とともに次々と届く場合に、届いたデータを使ってそのつどモデルを更新していく学習の方法として、最も適切なものはどれか。","choices":["オンライン学習","バッチ学習","ホールドアウト検証","グリッドサーチ"],"answer":0,"explanation":"オンライン学習は、新しいデータが届くたびに、そのデータを使ってモデルを少しずつ更新していく学習の方法です。学習データ全体を最初にそろえる必要がないため、データが次々に届く場合や、データが大きすぎて一度にメモリに収まらない場合に向いています。確率的勾配降下法（SGD）は、1件ごとに更新するため、オンライン学習に使えます。\nバッチ学習は、学習データ全体を使って勾配を計算してから更新する方法で、新しいデータが届くたびに更新することはできません。\nホールドアウト検証は、データの一部を評価用に取り分けてモデルを評価する方法です。\nグリッドサーチは、ハイパーパラメータの候補の組み合わせをすべて試す方法です。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}],"status":"active"},{"id":"Q-097","category":4,"question":"最適化における局所最適解、大域最適解、鞍点に関する説明として、最も適切なものはどれか。","choices":["鞍点はある方向には上り、別の方向には下りになっている点で、周りが平らなため勾配が0に近く、学習が停滞しやすい","大域最適解は、周りの一部の範囲でだけ最も小さくなる点で、全体で最も小さい点は局所最適解と呼ばれる","鞍点では勾配が非常に大きくなるため、パラメータが大きく更新されて、学習がすぐに発散する","勾配降下法を使えば、どのような誤差関数でも必ず大域最適解にたどり着くことが保証されている"],"answer":0,"explanation":"大域最適解は、誤差関数の全体の中で値が最も小さくなる点です。局所最適解は、その周りの範囲では最も小さいものの、全体で見れば最小とは限らない点です。ニューラルネットワークの誤差関数は凸ではなく、局所最適解が多数あるため、勾配降下法で大域最適解にたどり着ける保証はありません。\n鞍点は、ある方向には上り坂、別の方向には下り坂になっている点（馬の鞍のような形）です。鞍点の周りは誤差がほとんど変わらない平らな領域になっていることが多く、どの方向にも勾配が0に近いため、確率的勾配降下法がそこから抜け出しにくくなります。高次元の問題では、学習の難しさの原因は局所最適解よりも鞍点にあるという指摘もあります。モーメンタムなどの工夫は、こうした停滞から抜け出す助けになります。\n大域最適解と局所最適解の説明が入れ替わっている選択肢は誤りです。\n鞍点では勾配は0に近く、大きくはなりません。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"Yann Dauphin ほか \"Identifying and attacking the saddle point problem in high-dimensional non-convex optimization\" (arXiv:1406.2572)","url":"https://arxiv.org/abs/1406.2572"},{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"}],"status":"active"},{"id":"Q-098","category":4,"question":"勾配降下法の改良であるモーメンタムの説明として、最も適切なものはどれか。","choices":["前回の更新の向きと大きさの一部を今回の更新に加えることで、進むべき方向への移動を加速し、振動を抑える","パラメータごとに、これまでの勾配の2乗の合計を使って学習率を調整し、よく更新されるパラメータの学習率を下げる","学習の途中で検証データの誤差が改善しなくなったら、学習を止めて過学習を防ぐ","学習率を毎回ランダムな値に変えることで、局所最適解に閉じ込められないようにする"],"answer":0,"explanation":"モーメンタムは、確率的勾配降下法（SGD）を改良する方法です。今回の更新量に、前回の更新量（更新の向きと大きさ）の一定の割合を加えます。物理でいう慣性（勢い）のように働き、同じ方向に進み続ける場合は移動が加速し、行ったり来たりする方向の動きは打ち消し合って振動が抑えられます。これにより、谷のような地形でも効率よく最小値に近づけます。\n「これまでの勾配の2乗の合計を使ってパラメータごとに学習率を調整する」のは、AdaGradの説明です。\n「検証データの誤差が改善しなくなったら学習を止める」のは、早期終了の説明です。\n学習率を毎回ランダムに変える方法ではありません。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}],"status":"active"},{"id":"Q-099","category":4,"question":"AdaGrad、RMSprop、AdaDeltaに関する説明として、最も適切なものはどれか。","choices":["AdaGradはパラメータごとに学習率を調整するが学習率が小さくなり続けるため、RMSpropとAdaDeltaは過去の勾配の影響を徐々に薄めてこれを和らげる","AdaGradはすべてのパラメータで同じ学習率を使い続け、RMSpropとAdaDeltaは学習率を大きくし続ける手法である","RMSpropとAdaDeltaは、前回の更新量の一部を今回の更新に加えるだけの手法で、学習率の調整は行わない","AdaGradは、学習データの件数に応じて学習率を決める手法で、パラメータごとの違いはない"],"answer":0,"explanation":"AdaGradは、パラメータごとに学習率を自動で調整する手法です。これまでの勾配の2乗を足し合わせ、その値が大きい（よく更新されてきた）パラメータほど学習率を小さくします。まれにしか現れない特徴に対応するパラメータは大きく更新されるため、疎なデータに向いています。ただし、勾配の2乗を足し続けるため、学習が進むと学習率がどんどん小さくなり、やがて学習がほとんど進まなくなるという欠点があります。\nRMSpropとAdaDeltaは、この欠点を和らげるために、ほぼ同じ時期に別々に考えられた手法です。過去の勾配の2乗をすべて足すのではなく、古い勾配の影響を徐々に薄めた平均（指数移動平均）を使います。RMSpropはヒントンが講義で提案した手法です。\nどれもパラメータごとに学習率を調整する手法です。\n「前回の更新量の一部を加える」のは、モーメンタムの説明です。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"}],"status":"active"},{"id":"Q-100","category":4,"question":"最適化手法Adamの説明として、最も適切なものはどれか。","choices":["モーメンタムのような勾配の移動平均に、RMSpropのような勾配の2乗の移動平均を組み合わせて、パラメータごとに学習率を調整する","過去の勾配をまったく使わずに、その時点の勾配だけでパラメータを更新する、最も単純な勾配降下法である","学習率を決める必要がないように、すべてのパラメータの更新量を常に同じ一定の値にする手法である","学習データを全件使って勾配を計算し、1エポックに1回だけパラメータを更新する手法である"],"answer":0,"explanation":"Adam（Adaptive Moment Estimation）は、パラメータごとに学習率を調整する手法の一つです。RMSpropやAdaDeltaと同じように過去の勾配の2乗の指数移動平均を使うことに加えて、モーメンタムと同じように過去の勾配そのものの指数移動平均も使います。つまり、モーメンタムとRMSpropの考え方を組み合わせた手法といえ、深層学習で広く使われています。\nAdamの改良として、学習率が極端な値になることを防ぐAMSGradや、学習率に上限と下限を設けて、学習の進行とともにSGDに近づけていくAdaBound（AdamのAdaBound版）、AMSBound（AMSGradのAdaBound版）が提案されています。\nその時点の勾配だけを使うのは、単純なSGDです。\nAdamも学習率のハイパーパラメータを持ちます。\n全件で勾配を計算して1エポックに1回更新するのは、バッチ学習です。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"Liangchen Luo ほか \"Adaptive Gradient Methods with Dynamic Bound of Learning Rate\" (arXiv:1902.09843)","url":"https://arxiv.org/abs/1902.09843"}],"status":"active"},{"id":"Q-101","category":4,"question":"AdaBoundとAMSBoundの説明として、最も適切なものはどれか。","choices":["AdamとAMSGradの学習率に動的な上限と下限を設け、学習が進むにつれてSGDのような振る舞いへ滑らかに移っていく手法","AdaBoostとAMSGradを組み合わせ、弱い学習器を順番に追加していくアンサンブル学習の手法","学習率を学習の最初から最後まで一定に保ち、上限や下限を一切設けないことで学習を安定させる手法","学習率を0にしておき、勾配の符号だけを使ってパラメータを更新する手法"],"answer":0,"explanation":"Adamのような学習率を自動で調整する手法は、学習の初めは速く進む一方で、SGDに比べて汎化性能が劣ったり、学習率が極端な値になって収束しなかったりすることが指摘されてきました。\nAdaBoundとAMSBoundは、それぞれAdamとAMSGradを改良した手法です。学習率に、学習の進行とともに変わる上限と下限（動的な範囲）を設けることで極端な学習率を防ぎ、学習が進むにつれてSGDのような振る舞いへ滑らかに移っていきます。これにより、学習の初めの速さと、SGDのような汎化性能の両立を目指しています。\nAdaBoostは、ブースティングの手法で、最適化手法のAdaBoundとは別のものです。名前が似ているので注意が必要です。\n上限と下限を設けることがAdaBoundとAMSBoundの特徴です。\n勾配の符号だけを使う手法ではありません。","sources":[{"title":"Liangchen Luo ほか \"Adaptive Gradient Methods with Dynamic Bound of Learning Rate\" (arXiv:1902.09843)","url":"https://arxiv.org/abs/1902.09843"}],"status":"active"},{"id":"Q-102","category":4,"question":"早期終了（Early Stopping）の説明として、最も適切なものはどれか。","choices":["学習中に検証データでの誤差を監視し、改善しなくなったところで学習を止めることで、過学習を防ぐ","学習の最初の数エポックだけで学習を必ず打ち切り、それ以降のデータはまったく使わない","学習データでの誤差が0になるまで、どれだけ時間がかかっても学習を続ける","推論のときに、出力が決まる前に計算を途中で止めて、処理を速くする"],"answer":0,"explanation":"早期終了は、学習を続けると学習データへの誤差は下がり続けても、未知のデータへの性能（汎化性能）が悪くなっていく過学習を防ぐ方法です。学習用とは別に取り分けた検証データでの誤差（または性能）を学習中に監視し、一定の回数（エポック）続けて改善しなくなったら学習を止めます。追加の計算がほとんどいらず、簡単に使えるため、ヒントンは「美しいただ飯（free lunch）」と表現しました。\n決まったエポックで必ず打ち切る方法ではなく、検証データの結果を見て止めます。\n学習データの誤差が0になるまで続けると、過学習につながります。\n推論の計算を途中で止める方法ではありません。","sources":[{"title":"Sebastian Ruder \"An overview of gradient descent optimization algorithms\" (arXiv:1609.04747)","url":"https://arxiv.org/abs/1609.04747"},{"title":"scikit-learn API sklearn.neural_network.MLPClassifier","url":"https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html"}],"status":"active"},{"id":"Q-103","category":4,"question":"ハイパーパラメータの探索方法に関する説明として、最も適切なものはどれか。","choices":["グリッドサーチは候補の値の組み合わせをすべて試し、ランダムサーチは候補の分布からランダムに選んだ組み合わせを試す","グリッドサーチは候補の分布からランダムに選び、ランダムサーチは候補の組み合わせをすべて順番に試す","ハイパーパラメータは学習によって自動的に決まるため、探索する必要はまったくない","ランダムサーチでは、性能に影響しないハイパーパラメータを加えるほど、探索の効率が必ず下がる"],"answer":0,"explanation":"ハイパーパラメータは、学習によって直接決まるのではなく、学習の前に人が決める値です。学習率、層の数、正則化の強さ、サポートベクターマシンのCやカーネルの種類などがあります。よい値を見つけるために、候補を試して交差検証などで性能を比べる探索が行われます。\nグリッドサーチは、各ハイパーパラメータの候補の値を決め、その組み合わせをすべて試す方法です。確実ですが、ハイパーパラメータや候補が増えると、組み合わせの数が急激に増えます。\nランダムサーチは、各ハイパーパラメータの値を分布からランダムに選んで試す方法です。試す回数（予算）をハイパーパラメータの数とは関係なく決められ、性能に影響しないハイパーパラメータを加えても効率が落ちないという利点があります。\nグリッドサーチとランダムサーチの説明が入れ替わっている選択肢は誤りです。\nハイパーパラメータは学習では決まらないため、探索が必要です。","sources":[{"title":"scikit-learn User Guide 3.2 Tuning the hyper-parameters of an estimator","url":"https://scikit-learn.org/stable/modules/grid_search.html"}],"status":"active"},{"id":"Q-104","category":4,"question":"深層学習で報告されている「二重降下現象（ダブルディセント）」の説明として、最も適切なものはどれか。","choices":["モデルの大きさを増やしていくと、テストの誤差がいったん悪化した後、さらに大きくすると再び改善していく現象","モデルの大きさを増やすほど、テストの誤差が必ず単調に改善し続けるという現象","学習率を2倍にするたびに、学習にかかる時間が半分になっていくという現象","同じモデルを2回学習させると、テストの誤差がちょうど半分になるという現象"],"answer":0,"explanation":"従来の考え方では、モデルを大きく（複雑に）していくと、はじめはテストの誤差が下がるものの、ある程度を超えると過学習によって誤差が上がり続けると考えられていました。\nところが深層学習では、モデルの大きさを増やしていくと、テストの誤差がいったん悪化した後、さらに大きくすると再び改善していく現象が見られます。これを二重降下現象（ダブルディセント）と呼びます。ナッキランらは、この現象がモデルの大きさだけでなく、学習のエポック数を増やしたときにも起きること、また、ある条件では学習データを増やすとかえってテストの性能が悪くなる場合があることを示しました。\nモデルを大きくするほど必ず単調に改善するわけではありません。\n学習率や学習の回数と誤差が単純に比例する現象ではありません。","sources":[{"title":"Preetum Nakkiran ほか \"Deep Double Descent: Where Bigger Models and More Data Hurt\" (arXiv:1912.02292)","url":"https://arxiv.org/abs/1912.02292"}],"status":"active"},{"id":"Q-105","category":4,"question":"「ノーフリーランチ定理」が示す内容として、最も適切なものはどれか。","choices":["あらゆる問題を平均すると、どの最適化の手法も性能は同じで、すべての問題で最も優れた万能の手法は存在しない","ある一つの最適化の手法が、あらゆる問題で他のすべての手法より必ず優れていることを示した定理である","学習データを増やせば増やすほど、どのモデルでも必ずテストの誤差が0に近づくことを示した定理である","計算機の性能が上がれば、学習にかかる費用が必ず0になることを示した定理である"],"answer":0,"explanation":"ノーフリーランチ定理は、ウォルパートとマクレディが示した最適化や探索についての定理で、「すべての問題（ある条件を満たす問題の集まり）について平均すると、どの最適化の手法も性能は同じになる」という内容です。つまり、ある種類の問題でよい性能を出す手法は、その分ほかの問題では性能が劣ることになり、あらゆる問題で最も優れた万能の手法は存在しません。\n機械学習では、「どんなデータにも最適なモデルや手法はないので、問題の性質に合った手法を選ぶ必要がある」という意味で引き合いに出されます。実際の問題には、なめらかさなどの偏った性質があるため、その性質に合った手法が有利になります。\n一つの手法があらゆる問題で優れているという内容は、この定理と逆です。\nデータの量や計算の費用についての定理ではありません。","sources":[{"title":"Christian Igel, Marc Toussaint \"Recent Results on No-Free-Lunch Theorems for Optimization\" (arXiv:cs/0303032)","url":"https://arxiv.org/abs/cs/0303032"}],"status":"active"},{"id":"Q-106","category":5,"question":"全結合層の説明として、最も適切なものはどれか。","choices":["前の層のすべてのユニットの値に重みを掛けて足し合わせ（線形関数）、次の層の各ユニットの入力とする層","入力画像の小さな領域だけにフィルタをかけ、同じ重みを画像全体で使い回す層","部分領域の最大値や平均値だけを取り出して、特徴マップを小さくする層","前の時刻の隠れ層の値を、次の時刻の隠れ層の入力として戻す層"],"answer":0,"explanation":"全結合層は、前の層のすべてのユニットと次の層のすべてのユニットがつながっている層です。次の層の各ユニットは、前の層の値に重みを掛けて足し合わせた値（重み付きの線形和。線形関数）を計算し、多くの場合はそれを活性化関数で変換して出力します。多層パーセプトロンの隠れ層や、CNNの最後の分類部分などで使われます。\n全結合層のパラメータ（重み）の数は、おおよそ「前の層のユニット数 × 次の層のユニット数」になるため、入力が大きいとパラメータが非常に多くなります。\n「小さな領域にフィルタをかけ、重みを使い回す」のは畳み込み層の説明です。\n「最大値や平均値を取り出して小さくする」のはプーリング層の説明です。\n「前の時刻の隠れ層を戻す」のは回帰結合層（RNN）の説明です。","sources":[{"title":"scikit-learn User Guide 1.17 Neural network models (supervised)","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html"},{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}],"status":"active"},{"id":"Q-107","category":5,"question":"畳み込み層で、縦横5×5の入力に3×3のカーネル（フィルタ）を、パディングなし、ストライド1で適用したとき、出力される特徴マップの縦横の大きさとして、正しいものはどれか。","choices":["3×3","5×5","2×2","4×4"],"answer":0,"explanation":"畳み込みの出力の大きさ o は、入力の大きさ i、カーネルの大きさ k、パディング p、ストライド s を使って、o = ⌊(i + 2p − k) ÷ s⌋ + 1 で求められます（⌊ ⌋ は小数点以下の切り捨て）。\nこの問題では i = 5、k = 3、p = 0、s = 1 なので、o =（5 + 0 − 3）÷ 1 + 1 = 3 となり、出力は3×3です。3×3のカーネルは、5×5の入力の上を縦横それぞれ3か所ずつずらしながら置けることからもわかります。\n5×5（入力と同じ大きさ）にするには、周りに幅1のパディング（p = 1）を加える必要があります。\n2×2はストライドを2にした場合（⌊2 ÷ 2⌋ + 1 = 2）の大きさです。","sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}],"status":"active"},{"id":"Q-108","category":5,"question":"畳み込みニューラルネットワーク（CNN）の畳み込み層に関する用語の説明として、最も適切なものはどれか。","choices":["ストライドはカーネルをずらす間隔で、パディングは入力の周りに値（多くは0）を足して出力の大きさを調整すること","ストライドは入力の周りに0を足すことで、パディングはカーネルをずらす間隔のことである","特徴マップは、学習の前に人が手で描いておくカーネルの模様のことである","カーネル（フィルタ）の重みは学習では変化せず、あらかじめ決めた値のまま使われる"],"answer":0,"explanation":"畳み込み層では、カーネル（フィルタ）と呼ばれる小さな重みの行列を入力の上でずらしながら、重なった部分との積の和を計算します（畳み込み操作）。その結果として得られる出力を特徴マップと呼びます。\n・ストライド: カーネルをずらす間隔です。ストライドを大きくすると、出力の特徴マップは小さくなります。\n・パディング: 入力の周りに値（多くの場合0。ゼロパディング）を足すことです。出力の大きさを入力と同じにしたり、端の情報を使いやすくしたりするために使います。\nカーネルの重みは、学習によって自動的に決まります。同じカーネルを画像全体で使い回すため、全結合層に比べてパラメータの数が少なくて済み、画像のように近くの値どうしに関係があるデータに向いています。\nストライドとパディングの説明が入れ替わっている選択肢は誤りです。\n特徴マップは畳み込みの出力で、人が描くものではありません。","sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}],"status":"active"},{"id":"Q-109","category":5,"question":"Dilated Convolution（Atrous Convolution）の説明として、最も適切なものはどれか。","choices":["カーネルの要素の間に隙間を入れて広げることで、パラメータを増やさずに受容野を広げる畳み込み","カーネルを1×1にして、チャンネルどうしの値を組み合わせるだけの畳み込み","入力のチャンネルごとに別々のフィルタをかけ、その後に1×1の畳み込みで組み合わせる方法","出力の特徴マップを入力より大きくするために、畳み込みを逆向きに行う操作"],"answer":0,"explanation":"Dilated Convolution（拡張畳み込み）は、カーネルの要素の間に隙間（拡張率が d なら d−1 個）を入れて、カーネルを「膨らませて」適用する畳み込みです。カーネルの大きさ（パラメータの数）や計算量を増やさずに、一度に見る範囲（受容野）を広げられます。解像度を落とさずに広い範囲の文脈を集められるため、画素ごとに分類するセマンティックセグメンテーションで使われます。DeepLabでは、同じ考え方をAtrous Convolutionと呼び、拡張率の異なる畳み込みを並べるASPPという仕組みも提案しました。\n「1×1で チャンネルを組み合わせる」のは、pointwise（1×1）畳み込みの説明です。\n「チャンネルごとにフィルタをかけてから1×1で組み合わせる」のは、Depthwise Separable Convolutionの説明です。\n「出力を大きくするために逆向きに行う」のは、転置畳み込みの説明です。","sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"},{"title":"Fisher Yu, Vladlen Koltun \"Multi-Scale Context Aggregation by Dilated Convolutions\" (arXiv:1511.07122)","url":"https://arxiv.org/abs/1511.07122"},{"title":"Liang-Chieh Chen ほか \"DeepLab: Semantic Image Segmentation with Deep Convolutional Nets, Atrous Convolution, and Fully Connected CRFs\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}],"status":"active"},{"id":"Q-110","category":5,"question":"MobileNetsで使われているDepthwise Separable Convolutionの説明として、最も適切なものはどれか。","choices":["通常の畳み込みを、チャンネルごとにフィルタをかける畳み込みと、1×1の畳み込みに分けて、計算量とパラメータを減らす","カーネルの要素の間に隙間を入れて広げることで、受容野を広げるための畳み込みである","畳み込みの後に、ミニバッチごとに値を正規化して、学習を安定させる方法である","カーネルの大きさを入力画像と同じにして、画像全体を一度に1回だけ畳み込む方法である"],"answer":0,"explanation":"Depthwise Separable Convolution（深さ方向に分離可能な畳み込み）は、通常の畳み込みを2つの段階に分解する方法です。\n① Depthwise畳み込み: 入力のチャンネルごとに、1枚ずつフィルタをかけます。\n② Pointwise畳み込み: 1×1の畳み込みで、①の出力のチャンネルどうしを組み合わせます。\n通常の畳み込みは「空間方向のフィルタ」と「チャンネルの組み合わせ」を一度に行いますが、これを分けることで計算量とパラメータの数を大きく減らせます。スマートフォンなどの機器で動かす軽量なモデルであるMobileNetsの土台になっています。\n「カーネルの要素の間に隙間を入れる」のは、Dilated Convolutionの説明です。\n「ミニバッチごとに正規化する」のは、バッチ正規化の説明です。","sources":[{"title":"Andrew G. Howard ほか \"MobileNets: Efficient Convolutional Neural Networks for Mobile Vision Applications\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}],"status":"active"},{"id":"Q-111","category":5,"question":"バッチ正規化（Batch Normalization）に関する説明として、最も適切なものはどれか。","choices":["ミニバッチごとに層への入力を正規化することで、大きな学習率を使えるようにし、学習を速く安定させる","学習データ全体を1回だけ正規化しておけば、各層の入力はその後も変化しないため、途中の層では何もしない","ミニバッチの大きさが小さいほど、平均や分散の見積もりが正確になり、性能が上がる手法である","ニューロンの一部をランダムに無効にする手法で、正規化の計算は行わない"],"answer":0,"explanation":"深いニューラルネットワークでは、学習中に前の層のパラメータが変わるため、各層への入力の分布も変わり続けます（内部共変量シフト）。これにより、小さな学習率や慎重な初期値の設定が必要になり、学習が遅くなります。\nバッチ正規化は、ミニバッチごとに層への入力の平均と分散を計算して正規化し、その後に学習可能な値で調整する手法です。大きな学習率が使えるようになり、初期値にもあまり敏感でなくなって、学習が速く安定します。正則化のような効果もあり、ドロップアウトが不要になる場合もあります。\n一方、ミニバッチの統計を使うため、ミニバッチが小さいと平均や分散の見積もりが不正確になり、誤差が急に増えるという弱点があります。\nデータ全体を一度正規化するだけの方法ではありません。\n「ニューロンの一部を無効にする」のはドロップアウトです。","sources":[{"title":"Sergey Ioffe, Christian Szegedy \"Batch Normalization\" (arXiv:1502.03167)","url":"https://arxiv.org/abs/1502.03167"},{"title":"Yuxin Wu, Kaiming He \"Group Normalization\" (arXiv:1803.08494)","url":"https://arxiv.org/abs/1803.08494"}],"status":"active"},{"id":"Q-112","category":5,"question":"レイヤー正規化、インスタンス正規化、グループ正規化に関する説明として、最も適切なものはどれか。","choices":["いずれもミニバッチの方向には平均をとらず、1つのデータの中で正規化するため、ミニバッチの大きさに左右されにくい","いずれもミニバッチの中の全データで平均と分散をとるため、ミニバッチが大きいほど効果がある","レイヤー正規化はチャンネルごと、インスタンス正規化は層の全体をまとめて正規化する手法である","グループ正規化は、学習データをいくつかのグループに分けて、グループごとに別のモデルを学習する手法である"],"answer":0,"explanation":"バッチ正規化はミニバッチの方向に平均と分散をとるため、ミニバッチが小さいと不安定になります。次の3つは、1つのデータの中で平均と分散をとる正規化で、ミニバッチの大きさに左右されにくい方法です。\n・レイヤー正規化: 1つのデータについて、層のすべてのユニット（画像ならすべてのチャンネル・縦・横）で平均と分散をとります。RNNにも使いやすく、Transformerでも使われます。\n・インスタンス正規化: 1つのデータの、チャンネルごとに（縦・横の方向で）平均と分散をとります。画像のスタイル変換で、バッチ正規化をこれに替えることで画質が改善しました。\n・グループ正規化: チャンネルをいくつかのグループに分け、1つのデータのグループごとに平均と分散をとります。レイヤー正規化とインスタンス正規化の中間にあたり、小さなミニバッチでも安定した性能が出ます。\nレイヤー正規化とインスタンス正規化の説明が入れ替わっている選択肢は誤りです。\nグループ正規化は、チャンネルをグループに分ける正規化で、データを分けてモデルを作る方法ではありません。","sources":[{"title":"Jimmy Lei Ba ほか \"Layer Normalization\" (arXiv:1607.06450)","url":"https://arxiv.org/abs/1607.06450"},{"title":"Dmitry Ulyanov ほか \"Instance Normalization: The Missing Ingredient for Fast Stylization\" (arXiv:1607.08022)","url":"https://arxiv.org/abs/1607.08022"},{"title":"Yuxin Wu, Kaiming He \"Group Normalization\" (arXiv:1803.08494)","url":"https://arxiv.org/abs/1803.08494"}],"status":"active"},{"id":"Q-113","category":5,"question":"CNNのプーリング層に関する説明として、最も適切なものはどれか。","choices":["部分領域ごとに最大値や平均値をとって特徴マップを小さくし、入力の小さな位置ずれに対する不変性をもたらす","部分領域ごとに学習した重みを掛けて足し合わせるため、畳み込み層よりも多くのパラメータを持つ","特徴マップを大きくするための層で、画像の解像度を元の2倍に上げることが主な目的である","プーリング層を入れると、入力の小さな位置ずれに対して出力が大きく変わるようになる"],"answer":0,"explanation":"プーリング層は、特徴マップを小さな部分領域に分け、各領域を1つの値で要約することで、特徴マップを小さくする層です。\n・最大値プーリング: 各領域の最大値をとります。最もよく使われます。\n・平均値プーリング: 各領域の平均値をとります。\nプーリングには、入力が少しずれても出力が変わりにくくなる、つまり小さな平行移動に対する不変性を得る働きがあります。また、特徴マップが小さくなることで計算量も減ります。プーリングは最大値や平均値を計算するだけなので、学習するパラメータはありません。\n学習した重みを掛けて足し合わせるのは畳み込み層です。\nプーリングは特徴マップを小さくする操作です。\nプーリングは位置ずれに強くするためのもので、ずれに敏感にするものではありません。","sources":[{"title":"Vincent Dumoulin, Francesco Visin \"A guide to convolution arithmetic for deep learning\" (arXiv:1603.07285)","url":"https://arxiv.org/abs/1603.07285"}],"status":"active"},{"id":"Q-114","category":5,"question":"グローバルアベレージプーリング（GAP）の説明として、最も適切なものはどれか。","choices":["最後の特徴マップをチャンネルごとに全体で平均して1つの値にし、全結合層の代わりに使う。解釈しやすく過学習しにくい","特徴マップの中で最も大きい1つの値だけを残し、残りのチャンネルはすべて捨ててしまう処理である","入力画像全体の平均の明るさを求め、画像の明るさをそろえるために使うデータ拡張の手法である","特徴マップを平均するのではなく、同じ大きさのまま次の全結合層にすべての値を渡す処理である"],"answer":0,"explanation":"グローバルアベレージプーリング（GAP）は、Network In Network（NIN）で提案された方法で、最後の畳み込み層が出力した特徴マップを、チャンネルごとに空間全体（縦・横すべて）で平均して、1つの値にします。分類するクラスの数だけチャンネルを用意すれば、各チャンネルの平均値をそのままそのクラスの確信度として使えます。\n従来のCNNでは最後に全結合層を置いていましたが、全結合層はパラメータが多く過学習しやすく、中で何が起きているかもわかりにくいものでした。GAPはパラメータを持たず、特徴マップとクラスの対応がわかりやすいため、解釈しやすく過学習しにくいという利点があります。ResNetなど、その後の多くのモデルで使われています。\n最大値を1つだけ残す処理や、明るさをそろえる処理ではありません。","sources":[{"title":"Min Lin ほか \"Network In Network\" (arXiv:1312.4400)","url":"https://arxiv.org/abs/1312.4400"},{"title":"Kaiming He ほか \"Deep Residual Learning for Image Recognition\" (arXiv:1512.03385)","url":"https://arxiv.org/abs/1512.03385"}],"status":"active"},{"id":"Q-115","category":5,"question":"ResNetとスキップ結合に関する説明として、最も適切なものはどれか。","choices":["層の入力をそのまま出力に足すスキップ結合で、入力との差（残差）を学習させ、非常に深いネットワークでも学習しやすくした","ネットワークの層を減らして浅くすることで、勾配消失を避けて学習しやすくしたモデルである","入力を直接出力に足すと学習が不安定になるため、層どうしのつながりをすべて切り離したモデルである","スキップ結合は、学習の途中で一部の層の学習をランダムに飛ばして計算を省くための仕組みである"],"answer":0,"explanation":"ネットワークを深くすると、学習が難しくなり、かえって精度が下がることがありました。ResNet（残差ネットワーク）は、いくつかの層をまたいで、入力をそのまま出力に足し合わせるスキップ結合（ショートカット接続）を導入しました。これにより、各ブロックは入力そのものではなく、入力との差分（残差）を学習すればよくなります。スキップ結合を通って勾配が伝わりやすくなるため、非常に深いネットワークでも最適化しやすくなります。\nResNetは、VGGの8倍にあたる152層という深さでも学習でき、2015年のILSVRCの分類部門で1位になりました。\nResNetは層を減らしたのではなく、深くしても学習できるようにしたモデルです。\nスキップ結合は、層をランダムに飛ばす仕組みではありません。","sources":[{"title":"Kaiming He ほか \"Deep Residual Learning for Image Recognition\" (arXiv:1512.03385)","url":"https://arxiv.org/abs/1512.03385"}],"status":"active"},{"id":"Q-116","category":5,"question":"リカレントニューラルネットワーク（RNN）の初期のモデルであるジョルダンネットワークとエルマンネットワークに関する説明として、最も適切なものはどれか。","choices":["ジョルダンネットワークは出力層の値を、エルマンネットワークは隠れ層の値を、次の時刻の隠れ層へ戻して使う","ジョルダンネットワークは隠れ層の値を、エルマンネットワークは出力層の値を、次の時刻の隠れ層へ戻して使う","どちらも過去の値を一切使わず、各時刻の入力だけから出力を計算するネットワークである","どちらも画像の分類のために考えられたネットワークで、時系列データには使えない"],"answer":0,"explanation":"リカレントニューラルネットワーク（RNN）は、前の時刻の情報を次の時刻に戻して使う回帰結合を持つネットワークで、文章、音声、株価のような時系列データを扱うのに向いています。1980年代に基礎的な研究が行われました。\n・ジョルダンネットワーク（1986年）: 出力層の値を特別なユニットに送り、それを次の時刻の隠れ層へ戻します。\n・エルマンネットワーク（1990年）: 隠れ層の値を文脈ユニットに保存し、それを次の時刻の隠れ層へ戻します。現在の一般的なRNNの形に近いものです。\nジョルダンとエルマンの説明が入れ替わっている選択肢は誤りです。\nどちらも過去の情報を使うネットワークで、時系列データのためのものです。","sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}],"status":"active"},{"id":"Q-117","category":5,"question":"RNNの学習に関する説明として、最も適切なものはどれか。","choices":["時間方向に展開したネットワークに誤差逆伝播法を適用するBPTTで学習し、系列が長いと勾配消失や勾配爆発が起きやすい","RNNは誤差逆伝播法を使わず、各時刻の出力を人が手で調整することで学習する","系列が長くなるほど、遠い過去の情報から勾配が大きく安定して伝わるため、長期の関係を学びやすい","BPTTは、学習データの時間の順番をランダムに並べ替えてから学習する手法である"],"answer":0,"explanation":"RNNは、時間方向にネットワークを展開すると、同じ重みを共有した深いネットワークとみなせます。この展開したネットワークに誤差逆伝播法を適用して学習する方法を、BPTT（Backpropagation Through Time、通時的誤差逆伝播法）といいます。ワーボスが1990年にまとめ、現在使われている多くのRNNで使われています。\nただし、時間をさかのぼるほど勾配を何度も掛け合わせるため、系列が長いと勾配が極端に小さくなる勾配消失や、極端に大きくなる勾配爆発が起きやすくなります。勾配消失は遠い過去との関係を学べない原因になり、勾配爆発には勾配の大きさを制限する勾配クリッピングが使われます。長期の関係を学べるようにした工夫が、LSTMやGRUです。\n遠い過去の情報ほど勾配は伝わりにくくなります。\nBPTTは時間の順番を保ったまま学習する方法です。","sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"},{"title":"Razvan Pascanu ほか \"On the difficulty of training Recurrent Neural Networks\" (arXiv:1211.5063)","url":"https://arxiv.org/abs/1211.5063"}],"status":"active"},{"id":"Q-118","category":5,"question":"LSTMとGRUに関する説明として、最も適切なものはどれか。","choices":["どちらも情報をどれだけ通すかを調整するゲート機構を持ち、通常のRNNより長期の依存関係を学習しやすい","どちらもゲート機構を持たない単純なRNNで、長期の依存関係はまったく学習できない","GRUはLSTMよりゲートの数が多く、必ずLSTMより大幅に高い精度が出ることが証明されている","LSTMの忘却ゲートは、学習が終わった後にモデルの重みをすべて消去するための仕組みである"],"answer":0,"explanation":"LSTM（Long Short-Term Memory）は、記憶を保持するセルと、情報をどれだけ通すかを調整するゲートを持つRNNです。入力ゲート、出力ゲート、忘却ゲートがあり、忘却ゲートは、セルに保持している内容をどれだけ残すか（忘れるか）を学習によって調整します。これにより、通常のRNNでは難しい長期の依存関係を学習しやすくなりました。\nGRU（Gated Recurrent Unit）も、ゲート機構を持つRNNで、LSTMより構造が簡単です。比較の実験では、ゲート機構を持つLSTMとGRUはどちらも従来のtanhのユニットより優れ、GRUはLSTMと同程度の性能を示しました。\nLSTMとGRUはゲート機構を持つRNNです。\nGRUが必ずLSTMより大幅に優れるわけではありません。\n忘却ゲートは学習中・推論中にセルの内容を調整する仕組みで、重みを消去するものではありません。","sources":[{"title":"Junyoung Chung ほか \"Empirical Evaluation of Gated Recurrent Neural Networks on Sequence Modeling\" (arXiv:1412.3555)","url":"https://arxiv.org/abs/1412.3555"},{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}],"status":"active"},{"id":"Q-119","category":5,"question":"双方向RNN（Bidirectional RNN）の説明として、最も適切なものはどれか。","choices":["系列を過去から未来へ、未来から過去へという2つの向きで処理し、前後の文脈を使って各時刻の出力を決める","系列の最初の時刻だけを2回処理して、その結果を平均することで精度を高めるRNNである","2つのRNNを交互に学習させ、一方が生成した系列をもう一方が本物かどうか判定するモデルである","時系列の未来の値だけを使い、過去の値は一切使わずに出力を決めるRNNである"],"answer":0,"explanation":"通常のRNNは、ある時刻の状態を、それより前の時刻の情報だけから計算します。双方向RNNは、系列を前から後ろへ処理するRNNと、後ろから前へ処理するRNNを組み合わせ、過去と未来の両方の情報を使って各時刻の出力を決めます。文章の中の単語の意味を前後の文脈から判断するときのように、系列全体が手元にある場合に有効です。1997年にシュスターとパリワルが提案しました。\nただし、未来の情報を使うため、入力が届くたびにすぐ出力する必要のある処理（リアルタイムの予測など）には、そのままでは使えません。\n最初の時刻を2回処理する方法ではありません。\n「一方が生成し、もう一方が判定する」のは、敵対的生成ネットワーク（GAN）の考え方です。\n未来の値だけを使うのではなく、過去と未来の両方を使います。","sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}],"status":"active"},{"id":"Q-120","category":5,"question":"RNNの学習で使われる「教師強制（Teacher Forcing）」の説明として、最も適切なものはどれか。","choices":["学習のときに、前の時刻の出力の代わりに、正解の系列の値を次の時刻の入力として与える方法","学習のときに、前の時刻にモデル自身が予測した値だけを、次の時刻の入力として与える方法","教師データを使わずに、正解のラベルがない系列だけでRNNを学習させる方法","学習率を教師（人）がエポックごとに手で決めて、強制的に学習を進める方法"],"answer":0,"explanation":"系列を生成するRNNは、ある時刻の出力を次の時刻の入力として使います。教師強制は、学習のときに、モデルが前の時刻に予測した値ではなく、正解の系列の値（観測された値）を次の時刻の入力として与える方法です。学習の初めのうち予測が不正確でも、正しい入力をもとに学習できるため、学習が速く安定します。\n一方、生成（推論）のときには正解がないため、モデル自身の予測を次の入力として使います。学習時と生成時で入力の性質が違うため、生成時に誤りが積み重なりやすいという課題があり、これを和らげる方法（Professor Forcingなど）も研究されています。\n「モデル自身が予測した値だけを入力にする」のは、教師強制を使わない場合や生成時のやり方です。\n教師強制は正解の系列を使う方法で、教師なし学習ではありません。\n学習率を人が決める方法のことではありません。","sources":[{"title":"Alex Lamb ほか \"Professor Forcing: A New Algorithm for Training Recurrent Networks\" (arXiv:1610.09038)","url":"https://arxiv.org/abs/1610.09038"}],"status":"active"},{"id":"Q-121","category":5,"question":"Seq2Seq（系列変換モデル）の説明として、最も適切なものはどれか。","choices":["エンコーダで入力の系列を固定長のベクトルに変換し、デコーダでそのベクトルから出力の系列を生成する","入力の系列と出力の系列の長さが必ず同じでなければ使えない、画像の分類のためのモデルである","入力の系列の各要素を、それぞれ独立に1対1で別の記号に置き換えるだけの、規則に基づく変換である","系列を使わずに、1枚の画像から1つのクラスを予測するためのモデルである"],"answer":0,"explanation":"Seq2Seq（Sequence to Sequence）は、系列を別の系列に変換するモデルです。代表的な例では、エンコーダ（多層のLSTM）が入力の系列（例: 英語の文）を読み込んで固定長のベクトルに変換し、デコーダ（別のLSTM）がそのベクトルから出力の系列（例: フランス語の文）を1語ずつ生成します。入力と出力の長さが違ってもよいため、機械翻訳、文書の要約、対話などに使われます。\nただし、入力の情報を1つの固定長ベクトルに押し込めるため、長い文では情報が失われやすいという課題があり、これを解決するためにAttentionが導入されました。\n入力と出力の長さは違っていてもかまいません。\n規則による置き換えではなく、データから学習するニューラルネットワークです。\n画像の分類のモデルではありません。","sources":[{"title":"Ilya Sutskever ほか \"Sequence to Sequence Learning with Neural Networks\" (arXiv:1409.3215)","url":"https://arxiv.org/abs/1409.3215"},{"title":"Dzmitry Bahdanau ほか \"Neural Machine Translation by Jointly Learning to Align and Translate\" (arXiv:1409.0473)","url":"https://arxiv.org/abs/1409.0473"}],"status":"active"},{"id":"Q-122","category":5,"question":"エンコーダ・デコーダモデルにAttentionを導入した目的として、最も適切なものはどれか。","choices":["入力を1つの固定長ベクトルにまとめることが性能の壁になるため、出力のたびに入力の関係する部分に注目できるようにした","モデルのパラメータの数を0にして、学習をしなくても翻訳ができるようにするために導入した","入力の系列の順番をランダムに入れ替えて、データ拡張の代わりにするために導入した","出力を必ず入力と同じ長さにそろえて、計算を簡単にするために導入した"],"answer":0,"explanation":"エンコーダ・デコーダモデル（Seq2Seq）では、入力の系列全体を1つの固定長のベクトルに変換してからデコーダに渡します。バーダナウらは、この固定長ベクトルが性能向上のボトルネックになっていると考え、デコーダが出力の単語を1つ予測するたびに、入力の系列の中で関係する部分を自動で探して重み付けして使う仕組みを提案しました。これがAttention（注意機構）です。デコーダ側の状態をもとに、エンコーダ側（入力）のどこに注目するかを決めるこのようなAttentionは、Source-Target Attention（エンコーダ・デコーダAttention）とも呼ばれます。\n長い文でも必要な情報を取り出せるようになり、翻訳の性能が向上しました。のちのTransformerは、このAttentionだけでモデルを組み立てました。\nパラメータを0にする、順番を入れ替える、長さをそろえる、といった目的ではありません。","sources":[{"title":"Dzmitry Bahdanau ほか \"Neural Machine Translation by Jointly Learning to Align and Translate\" (arXiv:1409.0473)","url":"https://arxiv.org/abs/1409.0473"},{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}],"status":"active"},{"id":"Q-123","category":5,"question":"Transformerで使われるAttentionの「クエリ・キー・バリュー」に関する説明として、最も適切なものはどれか。","choices":["クエリとそれぞれのキーの適合度から重みを求め、その重みでバリューを重み付けして足し合わせた値を出力する","キーとバリューの適合度から重みを求め、その重みでクエリを重み付けして足し合わせた値を出力する","クエリ・キー・バリューは、学習データを3つに分けたときの学習用・検証用・テスト用のデータの呼び名である","クエリだけを使って出力を計算し、キーとバリューは学習が終わった後の評価のときにだけ使う"],"answer":0,"explanation":"Transformerの論文では、Attentionを「クエリと、キーとバリューの組の集まりを、出力に写す関数」として説明しています。クエリ、キー、バリュー、出力はすべてベクトルです。\n出力は、バリューの重み付きの和として計算され、各バリューの重みは、クエリと、そのバリューに対応するキーとの適合度（内積などで測る）から決まります。つまり、クエリが「何を探しているか」、キーが「各要素の見出し」、バリューが「各要素の中身」にあたり、クエリに合うキーを持つ要素のバリューほど強く取り込まれます。Transformerでは、内積を次元の平方根で割って調整するScaled Dot-Product Attentionを使います。\nクエリとバリューの役割が入れ替わっている選択肢は誤りです。\nデータの分け方の呼び名ではありません。","sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}],"status":"active"},{"id":"Q-124","category":5,"question":"TransformerのSelf-AttentionとMulti-Head Attentionに関する説明として、最も適切なものはどれか。","choices":["Self-Attentionはクエリ・キー・バリューが同じ系列から作られ、Multi-Head Attentionは複数のAttentionを並列に使って異なる観点の情報を同時に捉える","Self-Attentionはクエリがデコーダから、キーとバリューがエンコーダから来るAttentionで、Multi-Head Attentionは1つのAttentionだけを使う","Self-Attentionは系列の各要素が自分自身だけに注目する仕組みで、他の要素の情報は一切使わない","Multi-Head Attentionは、同じAttentionを何度も順番に繰り返して計算する仕組みで、並列には計算できない"],"answer":0,"explanation":"Self-Attention（自己注意機構）は、クエリ・キー・バリューがすべて同じ系列（例: エンコーダの前の層の出力）から作られるAttentionです。系列の各要素が、同じ系列のすべての要素に注目できるため、文の中の離れた単語どうしの関係も直接捉えられます。\nMulti-Head Attentionは、複数のAttention（ヘッド）を並列に計算して結果をつなげる仕組みです。それぞれのヘッドが異なる表現の部分空間に注目するため、1つのAttentionでは平均されて埋もれてしまう、異なる観点の情報を同時に捉えられます。\nクエリがデコーダから、キーとバリューがエンコーダから来るのは、エンコーダ・デコーダAttention（Source-Target Attention）です。\nSelf-Attentionは、自分自身だけでなく系列のすべての要素の情報を使います。\nMulti-Head Attentionは並列に計算します。","sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}],"status":"active"},{"id":"Q-125","category":5,"question":"Transformerで「位置エンコーディング」が必要な理由として、最も適切なものはどれか。","choices":["再帰や畳み込みを使わないため、そのままでは系列の順番がわからず、各要素の位置の情報を入力に加える必要がある","入力の単語の数が多すぎるため、位置の情報を使って単語の一部を捨てて計算を減らす必要がある","学習データの順番をランダムに並べ替えるために、各データに番号を振っておく必要がある","出力の文章の長さを必ず入力と同じにするために、位置の情報で長さを固定する必要がある"],"answer":0,"explanation":"RNNは系列を順番に処理し、CNNは近くの要素をまとめて処理するため、どちらも自然に要素の順番（位置）の情報を扱えます。一方、Transformerは再帰も畳み込みも使わず、Attentionだけで系列を処理します。Attentionは要素の集まりを並べ方に関係なく扱うため、そのままでは「どの単語が何番目にあるか」がわかりません。\nそこでTransformerでは、各要素の位置を表す値（位置エンコーディング）を、入力の埋め込みベクトルに足し合わせてから処理します。論文では、周期の異なるサイン・コサインの関数を使った位置エンコーディングが使われました。再帰を使わないため計算を並列化しやすく、学習時間を大きく短くできたことも、Transformerの特徴です。\n単語を捨てる、データの順番を並べ替える、出力の長さを固定するためのものではありません。","sources":[{"title":"Ashish Vaswani ほか \"Attention Is All You Need\" (arXiv:1706.03762)","url":"https://arxiv.org/abs/1706.03762"}],"status":"active"},{"id":"Q-126","category":5,"question":"オートエンコーダと積層オートエンコーダに関する説明として、最も適切なものはどれか。","choices":["入力を自分自身に写すように学習し、隠れ層に入力の特徴を圧縮した表現を得る。これを重ねて層ごとに学習させる方法は事前学習に使われた","入力とまったく関係のない正解のラベルを出力するように学習する、教師あり学習の分類モデルである","積層オートエンコーダは、学習済みのモデルを複数並べて多数決をとるアンサンブル学習の手法である","オートエンコーダの隠れ層は、入力よりも必ず次元の大きい表現になり、次元削減には使えない"],"answer":0,"explanation":"オートエンコーダ（自己符号化器）は、入力をそのまま出力として再現するように学習するニューラルネットワークです。入力を小さな次元の表現に変換する部分（エンコーダ）と、そこから入力を復元する部分（デコーダ）からなり、隠れ層には入力の特徴を圧縮した表現が得られます。正解のラベルを使わない教師なし学習で、次元削減や特徴の抽出に使われます。\n積層オートエンコーダは、1層のオートエンコーダで学習した隠れ層の表現を、次のオートエンコーダの入力にする、ということを繰り返して層を重ねる方法です。層ごとに順に学習させたネットワークの重みを初期値として使い、その後に教師あり学習で全体を調整する「事前学習」の方法として、深いネットワークを学習しやすくするために使われました。\nオートエンコーダは入力自身を再現するように学習するもので、ラベルは使いません。\n複数のモデルで多数決をとる手法ではありません。\n隠れ層は入力より小さな次元にすることが多く、次元削減に使えます。","sources":[{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"}],"status":"active"},{"id":"Q-127","category":5,"question":"変分オートエンコーダ（VAE）に関する説明として、最も適切なものはどれか。","choices":["入力を潜在変数の確率分布として表す生成モデルで、潜在空間からサンプリングして新しいデータを生成できる","入力をまったく圧縮せずに、そのままの大きさでコピーするだけのモデルで、新しいデータは生成できない","正解のラベルが付いた画像を使って、画像をクラスに分類するためだけに使う教師あり学習のモデルである","2つのネットワークを競わせて学習する生成モデルで、潜在変数の確率分布は一切使わない"],"answer":0,"explanation":"変分オートエンコーダ（VAE）は、キングマとウェリングが2013年に提案した生成モデルです。エンコーダは入力を1つの値に写すのではなく、潜在変数の確率分布（例: 正規分布の平均と分散）として表し、デコーダはその分布からサンプリングした潜在変数から入力を復元します。学習では、復元の誤差と、潜在変数の分布を事前分布（標準正規分布など）に近づけるためのKL情報量の項からなる目的関数（変分下限）を最適化します。サンプリングを含む計算を微分できるようにする「再パラメータ化トリック」により、確率的勾配法で学習できます。\n学習後は、潜在空間から値を取り出してデコーダに入れることで、学習データに似た新しいデータを生成できます。\n入力をそのままコピーするだけのモデルではありません。\n分類のための教師あり学習のモデルではありません。\n「2つのネットワークを競わせる」のは敵対的生成ネットワーク（GAN）です。","sources":[{"title":"Diederik P. Kingma, Max Welling \"Auto-Encoding Variational Bayes\" (arXiv:1312.6114)","url":"https://arxiv.org/abs/1312.6114"},{"title":"Christopher P. Burgess ほか \"Understanding disentangling in β-VAE\" (arXiv:1804.03599)","url":"https://arxiv.org/abs/1804.03599"}],"status":"active"},{"id":"Q-128","category":5,"question":"VAEの派生モデルであるβ-VAE、VQ-VAE、info VAEに関する説明として、最も適切なものはどれか。","choices":["β-VAEはKL情報量の項に係数βを掛けて分離された表現を目指し、VQ-VAEは潜在変数を連続ではなく離散のコードで表す","β-VAEは潜在変数を離散のコードで表し、VQ-VAEはKL情報量の項に係数βを掛けて分離された表現を目指す","info VAEは、VAEのデコーダを取り除き、エンコーダだけで新しい画像を生成するモデルである","どのモデルも、VAEとは関係のない、決定木を使った分類モデルである"],"answer":0,"explanation":"VAEには、目的に応じたさまざまな派生モデルがあります。\n・β-VAE: 目的関数のKL情報量の項に係数βを掛けます。βを1より大きくすると、潜在変数がデータの生成要因（例: 顔の向き、明るさ）ごとに分かれた、解釈しやすい表現（disentangledな表現）を得やすくなります。β = 1のときは元のVAEと同じです。\n・VQ-VAE: エンコーダが連続値ではなく離散のコードを出力し、ベクトル量子化の考え方を使います。事前分布も学習します。表現力の高いデコーダと組み合わせたときに潜在変数が無視されてしまう問題（事後分布の崩壊）を避けられ、画像・動画・音声の高品質な生成に使われます。\n・info VAE: VAEの目的関数を見直し、表現力の高いデコーダと組み合わせても潜在変数を有効に使えるようにしたモデルです。\nβ-VAEとVQ-VAEの説明が入れ替わっている選択肢は誤りです。\ninfo VAEもエンコーダとデコーダを持ちます。","sources":[{"title":"Christopher P. Burgess ほか \"Understanding disentangling in β-VAE\" (arXiv:1804.03599)","url":"https://arxiv.org/abs/1804.03599"},{"title":"Aaron van den Oord ほか \"Neural Discrete Representation Learning\" (arXiv:1711.00937)","url":"https://arxiv.org/abs/1711.00937"},{"title":"Shengjia Zhao ほか \"InfoVAE: Information Maximizing Variational Autoencoders\" (arXiv:1706.02262)","url":"https://arxiv.org/abs/1706.02262"}],"status":"active"},{"id":"Q-129","category":5,"question":"画像のデータ拡張の手法であるCutoutとRandom Erasingの説明として、最も適切なものはどれか。","choices":["学習画像の一部の領域をランダムに選んで隠す（塗りつぶす）ことで、遮蔽に強くし、過学習を抑える","2枚の学習画像とそのラベルを、一定の割合で混ぜ合わせた画像で学習する手法である","画像の一部を切り取って別の画像に貼り付け、ラベルも貼り付けた面積の比率で混ぜる手法である","画像の明るさやコントラストを変えるだけで、画像の一部を隠す操作は含まない手法である"],"answer":0,"explanation":"CutoutとRandom Erasingは、学習画像の一部の領域をランダムに選んで隠す（塗りつぶす）データ拡張の手法です。物体の一部が隠れた画像でも学習させることで、モデルが遮蔽に強くなり、過学習も抑えられます。\n・Cutout: 学習中に、入力画像の正方形の領域をランダムにマスクします。\n・Random Erasing: 画像の長方形の領域をランダムに選び、ランダムな値で塗りつぶします。ランダムな切り抜き（Crop）や左右反転（Flip）など、よく使われる拡張と組み合わせて使えます。\n「2枚の画像とラベルを割合で混ぜる」のはMixupです。\n「一部を切り取って別の画像に貼り付け、ラベルも面積比で混ぜる」のはCutMixです。\n明るさやコントラストを変えるのは、色に関する別のデータ拡張です。","sources":[{"title":"Terrance DeVries, Graham W. Taylor \"Improved Regularization of Convolutional Neural Networks with Cutout\" (arXiv:1708.04552)","url":"https://arxiv.org/abs/1708.04552"},{"title":"Zhun Zhong ほか \"Random Erasing Data Augmentation\" (arXiv:1708.04896)","url":"https://arxiv.org/abs/1708.04896"}],"status":"active"},{"id":"Q-130","category":5,"question":"データ拡張の手法であるMixupとCutMixの説明として、最も適切なものはどれか。","choices":["Mixupは2つの画像とラベルを全体で混ぜ合わせ、CutMixは画像の一部を別の画像に貼り付けてラベルを面積の比率で混ぜる","Mixupは画像の一部を別の画像に貼り付け、CutMixは2つの画像とラベルを全体で混ぜ合わせる手法である","どちらも画像を左右に反転させるだけの手法で、ラベルは元の画像のものをそのまま使う","どちらも文章のデータ拡張の手法で、単語を同義語に置き換える操作のことである"],"answer":0,"explanation":"MixupとCutMixは、2枚の学習画像を組み合わせて新しい学習データを作るデータ拡張の手法です。\n・Mixup: 2つの学習データとそのラベルを、同じ割合で混ぜ合わせた（凸結合した）データで学習します。例えば、犬の画像を70%、猫の画像を30%の割合で重ね、ラベルも「犬0.7、猫0.3」とします。学習データの間でなめらかな振る舞いをするように正則化する効果があります。\n・CutMix: ある画像の一部の領域を切り取って別の画像に貼り付け、ラベルは貼り付けた領域の面積の比率で混ぜます。一部を黒などで塗りつぶすCutoutのような方法と違い、画素の情報を捨てずに使えるのが利点です。\nMixupとCutMixの説明が入れ替わっている選択肢は誤りです。\n左右反転（Random Flip）とは別の手法で、ラベルも混ぜる点が特徴です。\n文章の拡張ではありません。","sources":[{"title":"Hongyi Zhang ほか \"mixup: Beyond Empirical Risk Minimization\" (arXiv:1710.09412)","url":"https://arxiv.org/abs/1710.09412"},{"title":"Sangdoo Yun ほか \"CutMix: Regularization Strategy to Train Strong Classifiers with Localizable Features\" (arXiv:1905.04899)","url":"https://arxiv.org/abs/1905.04899"}],"status":"active"},{"id":"Q-131","category":5,"question":"RandAugmentの説明として、最も適切なものはどれか。","choices":["回転、明るさ、コントラストなどの変換の候補から、少ない設定値でランダムに選んで適用し、別の探索の段階を不要にした自動データ拡張","学習の前に長い時間をかけて、最適な変換の組み合わせを別の小さなモデルで探索してから適用する手法","画像の一部をランダムに選んで、ランダムな値で塗りつぶすことだけを行うデータ拡張の手法","文章の中の単語をランダムに入れ替えたり削除したりする、文章のためのデータ拡張の手法"],"answer":0,"explanation":"データ拡張の効果を高めるため、どの変換をどの強さで適用するかを自動で探す手法（自動データ拡張）が研究されてきました。しかし、従来の手法は、学習とは別に変換の方針を探す段階が必要で、計算量が大きく、小さなモデルで探した方針を大きなモデルに使うといった問題がありました。\nRandAugmentは、変換の候補（恒等変換、回転、明るさ、コントラスト、せん断、平行移動など）から、毎回ランダムに選んで適用する方法で、設定値を「適用する変換の数」と「変換の強さ」の2つ程度に絞りました。探索の空間が大幅に小さくなったため、別の探索の段階なしに、対象のタスクで直接調整できます。\n「別の小さなモデルで長い時間をかけて探索する」のは、RandAugmentが解消しようとした従来の自動データ拡張の方法です。\n「ランダムな値で塗りつぶす」のはRandom Erasingです。","sources":[{"title":"Ekin D. Cubuk ほか \"RandAugment: Practical automated data augmentation with a reduced search space\" (arXiv:1909.13719)","url":"https://arxiv.org/abs/1909.13719"}],"status":"active"},{"id":"Q-132","category":5,"question":"文章のデータ拡張に関する説明として、最も適切なものはどれか。","choices":["単語を同義語に置き換えたり、単語をランダムに挿入・入れ替え・削除したりして、意味をほぼ保ったまま新しい文を作る","画像を回転させたり明るさを変えたりする手法を、文章にもそのまま当てはめて使う","文章のデータ拡張では、元の文の意味を大きく変える操作だけを行うことが望ましい","文章は画像と違ってデータ拡張がまったくできないため、学習データを増やす方法はない"],"answer":0,"explanation":"文章のデータ拡張は、元の文の意味をほぼ保ったまま、表現を少し変えた新しい文を作って学習データを増やす方法です。代表的な手法であるEDA（Easy Data Augmentation）は、次の4つの簡単な操作からなります。\n・同義語への置き換え\n・単語のランダムな挿入\n・単語のランダムな入れ替え\n・単語のランダムな削除\nこのほか、文の単語に手を加えてノイズを入れる方法（noising）や、いったん別の言語に翻訳してから元の言語に戻す逆翻訳のように、同じ意味の別の表現を作る方法（言い換え、paraphrasing）も研究されています。特に学習データが少ないときに効果が大きいとされています。\n画像の回転や明るさの変更は、文章にはそのまま使えません。\n意味を大きく変えると、ラベルと合わなくなるおそれがあります。\n文章でもデータ拡張は行えます。","sources":[{"title":"Jason Wei, Kai Zou \"EDA: Easy Data Augmentation Techniques for Boosting Performance on Text Classification Tasks\" (arXiv:1901.11196)","url":"https://arxiv.org/abs/1901.11196"}],"status":"active"},{"id":"Q-133","category":6,"question":"画像認識のタスクの説明として、最も適切なものはどれか。","choices":["インスタンスセグメンテーションは、物体を1つずつ区別して、それぞれの領域を画素単位で求める","セマンティックセグメンテーションは、同じクラスの物体どうしも1つずつ区別して領域を求める","物体検出は、画像全体に対して1つのクラスだけを答え、物体の位置は求めない","パノプティックセグメンテーションは、画像を分類するだけで、画素ごとの処理は行わない"],"answer":0,"explanation":"画像認識には、目的に応じて次のようなタスクがあります。\n・物体識別（画像分類）: 画像に写っている物体が何かを、クラスとして答えます。さまざまな種類の物体を認識することは、一般物体認識とも呼ばれます。\n・物体検出: 画像の中の物体の位置を矩形（バウンディングボックス）で求め、それぞれのクラスを答えます。\n・セマンティックセグメンテーション: 画素ごとにクラスのラベルを付けます。同じクラスの物体どうしは区別しません。\n・インスタンスセグメンテーション: 物体を1つずつ検出し、それぞれの物体の領域を画素単位で求めます。\n・パノプティックセグメンテーション: セマンティックセグメンテーションとインスタンスセグメンテーションを統合したタスクで、画像のすべての画素にラベルを付けつつ、物体は1つずつ区別します。\nセマンティックとインスタンスの説明が入れ替わっている選択肢や、物体検出・パノプティックセグメンテーションの説明は誤りです。","sources":[{"title":"Alexander Kirillov ほか \"Panoptic Segmentation\" (arXiv:1801.00868)","url":"https://arxiv.org/abs/1801.00868"},{"title":"Shaoqing Ren ほか \"Faster R-CNN\" (arXiv:1506.01497)","url":"https://arxiv.org/abs/1506.01497"},{"title":"Kaiming He ほか \"Mask R-CNN\" (arXiv:1703.06870)","url":"https://arxiv.org/abs/1703.06870"}],"status":"active"},{"id":"Q-134","category":6,"question":"2012年のILSVRCで優勝したAlexNetに関する説明として、最も適切なものはどれか。","choices":["GPUで学習させた大規模な深層の畳み込みニューラルネットワークで、活性化関数にReLU、過学習の対策にドロップアウトを使った","ルールベースの画像認識システムで、ニューラルネットワークは使わずに人が手で特徴量を設計した","層を100層以上に深くするためにスキップ結合を初めて導入したモデルで、2015年に優勝した","画像を16×16の小さな領域に分け、Transformerだけで分類したモデルである"],"answer":0,"explanation":"AlexNetは、クリジェフスキーらのチーム（SuperVision）が2012年のILSVRCで使った、大規模な深層の畳み込みニューラルネットワーク（CNN）です。約6000万のパラメータを持ち、GPUを使った効率的な実装で学習させました。活性化関数にReLUを使い、過学習の対策としてドロップアウトを使いました。分類の課題で大差をつけて優勝し、深層学習が画像認識の主流になるきっかけになりました。\nAlexNetはニューラルネットワークで、特徴量を人が手で設計するのではなく、データから学習します。\nスキップ結合を導入して2015年に優勝したのはResNetです。\n画像を小さな領域に分けてTransformerで分類するのは、Vision Transformerです。","sources":[{"title":"Olga Russakovsky ほか \"ImageNet Large Scale Visual Recognition Challenge\" (arXiv:1409.0575)","url":"https://arxiv.org/abs/1409.0575"},{"title":"Shiv Ram Dubey ほか \"Activation Functions in Deep Learning\" (arXiv:2109.14545)","url":"https://arxiv.org/abs/2109.14545"},{"title":"Jürgen Schmidhuber \"Deep Learning in Neural Networks: An Overview\" (arXiv:1404.7828)","url":"https://arxiv.org/abs/1404.7828"}],"status":"active"},{"id":"Q-135","category":6,"question":"ILSVRC 2014で好成績を収めたVGGとGoogLeNetに関する説明として、最も適切なものはどれか。","choices":["VGGは3×3の小さなフィルタを重ねて16〜19層に深くし、GoogLeNetはInceptionと呼ばれる構造で計算量を抑えつつ深さと幅を増やした","VGGはInceptionと呼ばれる構造を使い、GoogLeNetは3×3の小さなフィルタだけを重ねて深くしたモデルである","VGGとGoogLeNetは、どちらも畳み込み層を使わずに全結合層だけで構成されたモデルである","VGGとGoogLeNetは、どちらも物体の領域を画素単位で求めるセグメンテーションのためのモデルである"],"answer":0,"explanation":"VGGは、オックスフォード大学のシモニャンとジッサーマンが提案したモデルで、3×3という小さなフィルタの畳み込み層を重ねて、重みを持つ層を16〜19層まで深くすることで精度を高めました。ILSVRC 2014では、位置の特定の部門で1位、分類の部門で2位になりました。構造が単純なため、その後のモデルの土台としても広く使われています。\nGoogLeNetは、Inceptionと呼ばれる構造を持つモデルで、大きさの異なる畳み込みを並列に組み合わせたモジュールを重ねることで、計算量を一定に保ったままネットワークの深さと幅を増やしました。ILSVRC 2014の分類と検出で最高の成績を収めました。\nVGGとGoogLeNetの説明が入れ替わっている選択肢は誤りです。\nどちらも畳み込みニューラルネットワークで、画像の分類などに使われます。","sources":[{"title":"Karen Simonyan, Andrew Zisserman \"Very Deep Convolutional Networks for Large-Scale Image Recognition\" (arXiv:1409.1556)","url":"https://arxiv.org/abs/1409.1556"},{"title":"Christian Szegedy ほか \"Going Deeper with Convolutions\" (arXiv:1409.4842)","url":"https://arxiv.org/abs/1409.4842"}],"status":"active"},{"id":"Q-136","category":6,"question":"ResNetを発展させたモデルに関する説明として、最も適切なものはどれか。","choices":["Wide ResNetは層を浅くする代わりに幅を広げ、DenseNetは各層をそれより後のすべての層と直接つなぐ","Wide ResNetは各層をそれより後のすべての層とつなぎ、DenseNetは層を浅くする代わりに幅を広げる","Wide ResNetもDenseNetも、スキップ結合をすべて取り除いて、層を順番に一直線につないだモデルである","Wide ResNetもDenseNetも、画像ではなく文章を扱うために考えられた言語モデルである"],"answer":0,"explanation":"ResNetはスキップ結合によって非常に深いネットワークを学習できるようにしましたが、精度をわずかに上げるために層の数をほぼ倍にする必要があり、学習にも時間がかかるという課題がありました。\n・Wide ResNet: ResNetのブロックの構造を詳しく調べ、層を浅くする代わりに、各層の幅（チャンネルの数）を広げたモデルです。深く細いResNetより優れた性能を示しました。\n・DenseNet: 各層を、それより後のすべての層と直接つなぐモデルです。L層のネットワークでは L(L+1)/2 本の直接のつながりがあり、各層は、それより前のすべての層の特徴マップを入力として使います。\nほかに、チャンネルごとの特徴の重要度を学習して重み付けし直すSE（Squeeze-and-Excitation）ブロックを加えたSENetなどもあります。\n説明が入れ替わっている選択肢は誤りです。\nどちらもスキップ結合の考え方を生かした画像のモデルです。","sources":[{"title":"Sergey Zagoruyko, Nikos Komodakis \"Wide Residual Networks\" (arXiv:1605.07146)","url":"https://arxiv.org/abs/1605.07146"},{"title":"Gao Huang ほか \"Densely Connected Convolutional Networks\" (arXiv:1608.06993)","url":"https://arxiv.org/abs/1608.06993"},{"title":"Kaiming He ほか \"Deep Residual Learning for Image Recognition\" (arXiv:1512.03385)","url":"https://arxiv.org/abs/1512.03385"}],"status":"active"},{"id":"Q-137","category":6,"question":"SENet（Squeeze-and-Excitation Networks）の特徴として、最も適切なものはどれか。","choices":["チャンネルどうしの関係に注目し、チャンネルごとの特徴の重要度を学習して、特徴の強さを重み付けし直す","画像の空間方向だけに注目し、チャンネルの情報はすべて捨ててしまう構造である","畳み込みを使わずに、画像を小さな領域に分けてTransformerで処理する構造である","物体の位置を矩形で求めるための、領域の候補を出すネットワークである"],"answer":0,"explanation":"CNNの畳み込みは、局所的な範囲で空間方向とチャンネル方向の情報をまとめて特徴を作ります。これまでの多くの研究は空間方向の改良に注目してきましたが、SENetはチャンネルどうしの関係に注目しました。\nSE（Squeeze-and-Excitation）ブロックは、各チャンネルの特徴マップを要約し（Squeeze）、そこからチャンネルごとの重要度を学習して、特徴の強さを重み付けし直します（Excitation）。重要なチャンネルを強め、そうでないチャンネルを弱めることで、表現力を高めます。既存のCNNに組み込みやすく、ILSVRC 2017の分類で1位になりました。\n空間方向だけに注目してチャンネルを捨てる構造ではありません。\nTransformerで処理するのはVision Transformerです。\n領域の候補を出すのは、Faster R-CNNの領域提案ネットワーク（RPN）です。","sources":[{"title":"Jie Hu ほか \"Squeeze-and-Excitation Networks\" (arXiv:1709.01507)","url":"https://arxiv.org/abs/1709.01507"}],"status":"active"},{"id":"Q-138","category":6,"question":"ネットワークの構造の自動設計（NAS）と、それを使ったモデルに関する説明として、最も適切なものはどれか。","choices":["NASは構造を自動で探索する方法で、MnasNetは速度も考えてモバイル向けに探索し、EfficientNetは深さ・幅・解像度を均等に拡大した","NASは人が手でネットワークの構造を一つずつ設計する方法の名前で、自動で探索する仕組みは含まない","EfficientNetは、ネットワークの深さだけを大きくし、幅や入力画像の解像度は変えずに精度を高めるモデルである","MnasNetは、処理速度を考えずに精度だけを最大にするよう探索するため、サーバーでの利用だけを想定している"],"answer":0,"explanation":"NAS（Neural Architecture Search）は、ニューラルネットワークの構造（層の種類や数、つなぎ方など）を自動で探索する方法です。最初の研究では、RNNがネットワークの構造の記述を生成し、それを検証データでの精度が高くなるように強化学習で学習させました。人が設計した最良の構造に匹敵する構造を見つけました。\n・MnasNet: モバイル機器向けに、精度に加えて実際の機器での処理速度（レイテンシ）も探索の目的に含めたNASです。\n・EfficientNet: ネットワークの深さ、幅、入力画像の解像度を、1つの係数（複合係数）でバランスよく同時に拡大する方法を提案しました。さらにNASで設計した基本のネットワークを拡大して、少ないパラメータで高い精度を実現しました。\nほかに、Depthwise Separable Convolutionで軽量化したMobileNetもモバイル向けのモデルとして知られています。\nNASは自動で探索する方法です。EfficientNetは深さだけでなく幅と解像度も拡大します。MnasNetは処理速度も考慮します。","sources":[{"title":"Barret Zoph, Quoc V. Le \"Neural Architecture Search with Reinforcement Learning\" (arXiv:1611.01578)","url":"https://arxiv.org/abs/1611.01578"},{"title":"Mingxing Tan ほか \"MnasNet: Platform-Aware Neural Architecture Search for Mobile\" (arXiv:1807.11626)","url":"https://arxiv.org/abs/1807.11626"},{"title":"Mingxing Tan, Quoc V. Le \"EfficientNet: Rethinking Model Scaling for Convolutional Neural Networks\" (arXiv:1905.11946)","url":"https://arxiv.org/abs/1905.11946"},{"title":"Andrew G. Howard ほか \"MobileNets\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}],"status":"active"},{"id":"Q-139","category":6,"question":"物体検出のモデルであるR-CNNの系列に関する説明として、最も適切なものはどれか。","choices":["Faster R-CNNは領域の候補を出す処理もネットワーク（RPN）で行って高速化し、Mask R-CNNはそれに物体ごとのマスクを予測する枝を加えた","Faster R-CNNは領域の候補を出す処理をなくし、画像全体を1回見るだけで物体の位置を回帰で直接求める","Mask R-CNNは、物体検出の機能をなくして、画素ごとのクラス分類だけを行うセマンティックセグメンテーションのモデルである","R-CNNは、畳み込みニューラルネットワークを使わずに、人が設計した特徴量だけで物体を検出する"],"answer":0,"explanation":"R-CNNは、画像から物体がありそうな領域の候補を選び出し、それぞれの領域にCNNを適用して特徴を取り出し、物体を分類する方法で、物体検出の精度を大きく向上させました。\n・Fast R-CNN: 領域の候補をCNNで効率よく分類できるようにし、R-CNNより学習と推論を大幅に速くしました。\n・Faster R-CNN: 残っていたボトルネックである領域の候補を出す処理も、検出のネットワークと特徴を共有する領域提案ネットワーク（RPN）で行うことで、ほぼ追加の計算なしに候補を出せるようにしました。\n・Mask R-CNN: Faster R-CNNに、物体ごとのマスク（領域）を予測する枝を並列に加え、インスタンスセグメンテーションを行えるようにしました。姿勢推定などにも拡張できます。\n「画像全体を1回見るだけで位置を回帰で求める」のはYOLOの考え方です。\nMask R-CNNは物体を検出したうえで、物体ごとの領域を求めます。\nR-CNNはCNNを使います。","sources":[{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Ross Girshick \"Fast R-CNN\" (arXiv:1504.08083)","url":"https://arxiv.org/abs/1504.08083"},{"title":"Shaoqing Ren ほか \"Faster R-CNN\" (arXiv:1506.01497)","url":"https://arxiv.org/abs/1506.01497"},{"title":"Kaiming He ほか \"Mask R-CNN\" (arXiv:1703.06870)","url":"https://arxiv.org/abs/1703.06870"}],"status":"active"},{"id":"Q-140","category":6,"question":"物体検出のモデルであるYOLOとSSDに関する説明として、最も適切なものはどれか。","choices":["どちらも1つのネットワークで画像全体から物体の位置とクラスを一度に予測し、領域の候補を別に出す処理を必要としないため高速である","どちらも領域の候補を別の処理で数千個出し、それぞれを別々のネットワークで分類するため、処理に時間がかかる","YOLOとSSDは、物体の位置は求めず、画像全体に1つのクラスだけを答える画像分類のモデルである","YOLOとSSDは、静止画にだけ使え、動画の処理には原理的に使うことができない"],"answer":0,"explanation":"YOLOとSSDは、1つのネットワークで画像全体から物体の位置とクラスを一度に予測する物体検出のモデルです。R-CNNの系列のように領域の候補を別に出してから分類する方法（2段階の方法）に比べて、処理を一度で済ませるため高速です。\n・YOLO（You Only Look Once）: 物体検出を、画像の空間ごとのバウンディングボックスとクラスの確率を求める回帰問題として扱い、画像全体を1回処理するだけで予測します。基本のモデルでも1秒に45枚の画像を処理でき、リアルタイムで検出できます。\n・SSD（Single Shot MultiBox Detector）: 特徴マップの各位置に、縦横比や大きさの異なる基準の枠（デフォルトボックス）を用意し、それぞれについて物体の有無とクラス、枠のずれを予測します。解像度の異なる複数の特徴マップの予測を組み合わせ、さまざまな大きさの物体に対応します。\nまた、深いCNNの階層を生かして、上の層の意味の強い特徴を下の層へ伝える特徴ピラミッド（FPN）は、さまざまな大きさの物体を検出する多くのモデルで使われています。\n候補を別に出して分類するのは2段階の方法です。YOLOとSSDは位置も求める物体検出のモデルです。","sources":[{"title":"Joseph Redmon ほか \"You Only Look Once: Unified, Real-Time Object Detection\" (arXiv:1506.02640)","url":"https://arxiv.org/abs/1506.02640"},{"title":"Wei Liu ほか \"SSD: Single Shot MultiBox Detector\" (arXiv:1512.02325)","url":"https://arxiv.org/abs/1512.02325"},{"title":"Tsung-Yi Lin ほか \"Feature Pyramid Networks for Object Detection\" (arXiv:1612.03144)","url":"https://arxiv.org/abs/1612.03144"}],"status":"active"},{"id":"Q-141","category":6,"question":"セマンティックセグメンテーションのモデルに関する説明として、最も適切なものはどれか。","choices":["FCNは全結合層を使わず畳み込み層だけで画素ごとに予測し、U-Netは縮小する経路と拡大する経路を対称に組み合わせて位置を正確に求める","FCNは全結合層だけで構成され、入力の画像は必ず決められた大きさにしなければならない","U-Netは、医療画像のように学習データが少ない分野では使えず、何百万枚もの画像が必要なモデルである","SegNetは、エンコーダだけで構成され、低い解像度の特徴マップを元の大きさに戻す仕組みを持たない"],"answer":0,"explanation":"セマンティックセグメンテーションでは、画素ごとにクラスを予測するため、特徴を取り出しながら小さくした特徴マップを、元の解像度に戻す仕組みが必要です。\n・FCN（Fully Convolutional Network）: 画像分類のCNN（AlexNet、VGG、GoogLeNetなど）の全結合層を畳み込み層に置き換え、畳み込み層だけで構成したネットワークです。任意の大きさの画像を入力でき、それに対応する大きさの出力を画素ごとに得られます。\n・SegNet: エンコーダ（VGG16の畳み込み層と同じ構造）と、それに対応するデコーダからなり、デコーダが低い解像度の特徴マップを元の解像度に戻して画素ごとに分類します。\n・U-Net: 文脈をとらえる縮小の経路と、正確な位置を求める拡大の経路を対称に組み合わせたU字型のネットワークです。データ拡張を積極的に使うことで、少ない画像からでも学習でき、医療画像などで広く使われています。\nほかに、異なる範囲の文脈を集めるピラミッドプーリングを使うPSPNetや、Atrous Convolutionを使うDeepLabがあります。","sources":[{"title":"Jonathan Long ほか \"Fully Convolutional Networks for Semantic Segmentation\" (arXiv:1411.4038)","url":"https://arxiv.org/abs/1411.4038"},{"title":"Vijay Badrinarayanan ほか \"SegNet\" (arXiv:1511.00561)","url":"https://arxiv.org/abs/1511.00561"},{"title":"Olaf Ronneberger ほか \"U-Net: Convolutional Networks for Biomedical Image Segmentation\" (arXiv:1505.04597)","url":"https://arxiv.org/abs/1505.04597"},{"title":"Hengshuang Zhao ほか \"Pyramid Scene Parsing Network\" (arXiv:1612.01105)","url":"https://arxiv.org/abs/1612.01105"},{"title":"Liang-Chieh Chen ほか \"DeepLab\" (arXiv:1606.00915)","url":"https://arxiv.org/abs/1606.00915"}],"status":"active"},{"id":"Q-142","category":6,"question":"OpenPoseで使われているPart Affinity Fieldsに関する説明として、最も適切なものはどれか。","choices":["体の部位どうしのつながりを表し、複数の人が写っていても部位を人ごとに結び付けて姿勢を推定できる","画像の中の物体を矩形で囲み、そのクラスを答えるための、物体検出の基準の枠のことである","画像の各画素に、空や道路などのクラスのラベルを付けるための、セグメンテーションの手法である","文章の中の単語どうしの関係を表すための、自然言語処理の手法である"],"answer":0,"explanation":"姿勢推定は、画像や動画に写っている人の関節などの体の部位（キーポイント）の位置を求め、その人の姿勢を推定するタスクです。\nOpenPoseの元になった研究では、体の部位の位置と、部位どうしのつながりを同時に学習します。部位どうしのつながりを表す表現を Part Affinity Fields（PAFs）と呼び、これを使うことで、画像の中の多数の部位を、どの人のものかに正しく結び付けられます。画像全体の文脈を使ってボトムアップに組み立てるため、写っている人数に関係なくリアルタイムで処理でき、COCO 2016のキーポイントの課題で1位になりました。\n矩形で囲むのは物体検出、画素にラベルを付けるのはセグメンテーションの説明です。\n自然言語処理の手法ではありません。","sources":[{"title":"Zhe Cao ほか \"Realtime Multi-Person 2D Pose Estimation using Part Affinity Fields\" (arXiv:1611.08050)","url":"https://arxiv.org/abs/1611.08050"}],"status":"active"},{"id":"Q-143","category":6,"question":"Vision Transformer（ViT）の説明として、最も適切なものはどれか。","choices":["画像を小さなパッチに分けた系列を、畳み込みを使わずにTransformerで処理して分類する","画像を1画素ずつRNNに入力し、最後の時刻の出力で画像を分類するモデルである","畳み込み層だけで構成され、Attentionの仕組みは一切使わないモデルである","画像を生成するためのモデルで、画像の分類には使うことができない"],"answer":0,"explanation":"Transformerは自然言語処理で標準的なモデルになりましたが、画像では、Attentionは畳み込みニューラルネットワークと組み合わせて使うのが一般的でした。\nVision Transformer（ViT）は、画像を小さな領域（例: 16×16画素のパッチ）に分け、それらを単語の列のように並べた系列として、畳み込みを使わない純粋なTransformerで処理して画像を分類します。大量のデータで事前学習してから、ImageNetなどの中小規模のデータセットに転移すると、優れたCNNに匹敵する、または上回る精度を、少ない計算資源で達成しました。\n1画素ずつRNNに入力するモデルではありません。\nViTはAttention（Transformer）を使うモデルです。\n画像の分類に使われるモデルです。","sources":[{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}],"status":"active"},{"id":"Q-144","category":6,"question":"文章を数値のベクトルで表す方法に関する説明として、最も適切なものはどれか。","choices":["Bag-of-Wordsは単語の出現回数で文書を表し、語順の情報は使わない。TF-IDFは多くの文書に現れる単語の重みを下げる","Bag-of-Wordsは単語の並び順を正確に保って文書を表すため、語順の違う文は必ず別のベクトルになる","TF-IDFは、多くの文書に共通して現れる単語ほど重みを大きくする方法である","ワンホットベクトルは、意味の似た単語どうしが近いベクトルになるように学習された表現である"],"answer":0,"explanation":"機械学習で文章を扱うには、文章を数値のベクトルに変換する必要があります。\n・ワンホットベクトル: 語彙の数だけの次元を持ち、その単語に対応する次元だけが1、ほかは0のベクトルです。単語どうしの意味の近さは表せません。\n・Bag-of-Words（BoW）: 文書を単語に分け（トークン化）、各単語の出現回数を数えて表します。単語の位置（語順）の情報は無視します。連続するn個の単語の組（n-gram）を数える「Bag of n-grams」にすると、局所的な語順の情報を少し取り込めます。\n・TF-IDF: 単語の出現頻度（TF）に、逆文書頻度（IDF）を掛けて重み付けする方法です。「the」「a」のように多くの文書に現れる単語は、文書の内容を表す情報が少ないため重みを下げ、特定の文書にだけ現れる単語の重みを相対的に上げます。\nBoWは語順を使いません。TF-IDFは共通の単語の重みを下げます。意味の近さを表せるのは、word2vecなどで学習した分散表現です。","sources":[{"title":"scikit-learn User Guide 8.2.3 Text feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}],"status":"active"},{"id":"Q-145","category":6,"question":"word2vecのCBOWとスキップグラムに関する説明として、最も適切なものはどれか。","choices":["CBOWは周りの単語から中心の単語を予測し、スキップグラムは中心の単語から周りの単語を予測することで、単語の分散表現を学習する","CBOWは中心の単語から周りの単語を予測し、スキップグラムは周りの単語から中心の単語を予測する","CBOWもスキップグラムも、単語をワンホットベクトルのまま扱い、意味の近さを表すベクトルは学習しない","CBOWもスキップグラムも、文書を肯定的か否定的かに分類するためだけのモデルである"],"answer":0,"explanation":"word2vecは、ミコロフらが提案した、大量の文章から単語のベクトル表現（分散表現、単語埋め込み）を効率よく学習する方法です。「同じような文脈に現れる単語は意味も似ている」という考えに基づき、意味の似た単語が近いベクトルになります。次の2つのモデルがあります。\n・CBOW（Continuous Bag-of-Words）: 周りの単語（文脈）から、中心の単語を予測するように学習します。周りの単語のベクトルは平均されるため、語順は影響しません（Bag-of-Wordsと呼ばれる理由）。\n・スキップグラム: 中心の単語から、その前後の一定範囲の単語を予測するように学習します。\n16億語のデータからでも1日以内で高品質な単語ベクトルを学習できました。\n説明が入れ替わっている選択肢は誤りです。\nどちらも意味を表すベクトルを学習する方法です。","sources":[{"title":"Tomas Mikolov ほか \"Efficient Estimation of Word Representations in Vector Space\" (arXiv:1301.3781)","url":"https://arxiv.org/abs/1301.3781"},{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}],"status":"active"},{"id":"Q-146","category":6,"question":"fastTextとELMoに関する説明として、最も適切なものはどれか。","choices":["fastTextは単語を文字のn-gramの集まりとして表して珍しい単語にも対応し、ELMoは文脈によって変わる単語の表現を双方向の言語モデルから得る","fastTextは文脈によって変わる単語の表現を得るモデルで、ELMoは単語を文字のn-gramの集まりとして表すモデルである","fastTextもELMoも、同じ単語には文脈に関係なく必ず1つの同じベクトルを割り当てる","fastTextもELMoも、画像を分類するための畳み込みニューラルネットワークである"],"answer":0,"explanation":"・fastText: word2vecのように単語ごとに別々のベクトルを割り当てると、単語の形（語形の変化など）が考慮されず、語彙が多く珍しい単語が多い言語では不利になります。fastTextは、スキップグラムをもとに、単語を文字のn-gramの集まりとして表し、単語のベクトルをn-gramのベクトルの和で表します。これにより、学習データにない単語や珍しい単語にもベクトルを作れます。\n・ELMo: 深い双方向の言語モデル（biLM）を大量の文章で事前学習し、その内部の状態から単語の表現を作ります。同じ単語でも文脈によって異なる表現になるため、多義語の意味の違いも表せます（文脈化された単語表現）。既存のモデルに加えるだけで、多くのタスクの性能が向上しました。\n説明が入れ替わっている選択肢は誤りです。\nELMoは文脈によって表現が変わります。\nどちらも自然言語処理のモデルです。","sources":[{"title":"Piotr Bojanowski ほか \"Enriching Word Vectors with Subword Information\" (arXiv:1607.04606)","url":"https://arxiv.org/abs/1607.04606"},{"title":"Matthew E. Peters ほか \"Deep contextualized word representations\" (arXiv:1802.05365)","url":"https://arxiv.org/abs/1802.05365"}],"status":"active"},{"id":"Q-147","category":6,"question":"BERTの説明として、最も適切なものはどれか。","choices":["Transformerで、ラベルのない大量の文章から前後の文脈を同時に使って事前学習し、各タスクにファインチューニングする","文の左側の文脈だけを使って次の単語を予測するように学習し、ファインチューニングはできないモデルである","RNNを使い、正解のラベルが付いた少量の文章だけで、最初から各タスク専用に学習するモデルである","画像と文章の組み合わせを学習して、文章から画像を生成するためのモデルである"],"answer":0,"explanation":"BERT（Bidirectional Encoder Representations from Transformers）は、グーグルが2018年に発表した言語モデルです。Transformerのエンコーダを使い、ラベルのない大量の文章を使って、文の左右両方の文脈を同時に考慮する深い双方向の表現を事前学習します。\n事前学習したBERTに出力層を1つ加えてファインチューニングするだけで、質問応答や文の関係の推論など、多くのタスクで当時の最高の性能を達成しました。タスクごとにモデルの構造を大きく変える必要がないのが特徴です。\nこのように、大量のデータで事前学習したモデルを、個々のタスクに合わせて調整して使う方法は、自然言語処理の標準的なやり方になりました。自然言語理解の性能を複数のタスクで総合的に評価するベンチマークとして、GLUEがよく使われます。\n左側の文脈だけを使うのは、GPTのような左から右への言語モデルの特徴です。\nBERTはTransformerを使い、ラベルのない文章で事前学習します。\n文章から画像を生成するモデルではありません。","sources":[{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Alex Wang ほか \"GLUE: A Multi-Task Benchmark and Analysis Platform for Natural Language Understanding\" (arXiv:1804.07461)","url":"https://arxiv.org/abs/1804.07461"}],"status":"active"},{"id":"Q-148","category":6,"question":"GLUEの説明として、最も適切なものはどれか。","choices":["複数の自然言語理解のタスクでモデルの性能を評価・分析するためのベンチマーク","文章から画像を生成するための、大規模な画像と説明文のデータセット","大量の文章から単語の分散表現を学習するための、ニューラルネットワークの構造","音声を文字に変換する音声認識の性能を競うための、音声のデータセット"],"answer":0,"explanation":"GLUE（General Language Understanding Evaluation）は、自然言語理解（NLU）のモデルを評価・分析するためのベンチマークです。特定の1つのタスクやデータセットに特化するのではなく、既存のさまざまな自然言語理解のタスク（文の分類、文どうしの関係の推論など）をまとめて、モデルがどれだけ汎用的に言語を処理できるかを評価します。モデルの構造は問わず、タスクの間で知識を共有できるモデルが有利になるように作られています。BERTなどの事前学習済みモデルの性能を比べるのによく使われました。\n画像と説明文のデータセット、単語の表現を学習するネットワークの構造、音声のデータセットではありません。","sources":[{"title":"Alex Wang ほか \"GLUE: A Multi-Task Benchmark and Analysis Platform for Natural Language Understanding\" (arXiv:1804.07461)","url":"https://arxiv.org/abs/1804.07461"}],"status":"active"},{"id":"Q-149","category":6,"question":"大規模言語モデル（LLM）に関する説明として、最も適切なものはどれか。","choices":["大量の文章で事前学習した巨大な言語モデルで、GPT-3やPaLMは、少数の例を示すだけで多くのタスクをこなせることを示した","パラメータの数を小さくするほど性能が上がることがわかっており、数百万程度のパラメータのモデルが主流である","タスクごとに数万件のラベル付きデータで必ずファインチューニングしなければ、一切のタスクをこなせない","文章を扱うことはできず、画像の分類のためだけに作られたモデルである"],"answer":0,"explanation":"大規模言語モデル（LLM）は、Transformerを大量の文章で事前学習した、非常に多くのパラメータを持つ言語モデルです。言語モデルは統計的なモデルからニューラルネットワークのモデルへと発展し、事前学習済みの言語モデルを大規模にすることで、大きな能力を示すようになりました。\n・GPT-3（2020年）: 1750億のパラメータを持つモデルで、パラメータを更新するファインチューニングを行わず、文章で課題と少数の例を示すだけ（few-shot）で、翻訳、質問応答などの多くのタスクで高い性能を示しました。人が書いた記事と見分けにくいニュース記事を生成できることも報告されています。\n・PaLM（2022年）: グーグルが開発した5400億のパラメータを持つモデルで、TPU v4を6144個使って学習し、規模を大きくすることでfew-shotの性能が高まることを示しました。\nパラメータを増やすことで性能が向上してきました。\nfew-shotなど、ファインチューニングなしでもタスクをこなせます。\nLLMは文章を扱うモデルです。","sources":[{"title":"Wayne Xin Zhao ほか \"A Survey of Large Language Models\" (arXiv:2303.18223)","url":"https://arxiv.org/abs/2303.18223"},{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Aakanksha Chowdhery ほか \"PaLM: Scaling Language Modeling with Pathways\" (arXiv:2204.02311)","url":"https://arxiv.org/abs/2204.02311"}],"status":"active"},{"id":"Q-150","category":6,"question":"自然言語処理のタスクのうち、「商品のレビューの文章が、肯定的な意見か否定的な意見かを判定する」タスクとして、最も適切なものはどれか。","choices":["感情分析","形態素解析","構文解析","文書要約"],"answer":0,"explanation":"感情分析（センチメント分析）は、文章に表れている意見や感情が、肯定的か否定的か（あるいは中立か）などを判定するタスクです。商品のレビューやSNSの投稿の分析などに使われます。\n自然言語処理には、ほかに次のようなタスクがあります。\n・形態素解析: 文を意味を持つ最小の単位（形態素）に分け、品詞などを判定します。日本語のように単語の間に空白がない言語では、最初に行う重要な処理です。\n・構文解析: 文の中の単語どうしの文法的な関係（係り受けなど）を解析します。\n・文書要約: 長い文章の要点を短くまとめます。\n・機械翻訳: ある言語の文を別の言語の文に変換します。\n・質問応答: 質問に対する答えを返します。\n・情報検索: 大量の文書の中から、求める情報を含む文書を探し出します。","sources":[{"title":"Tom Young ほか \"Recent Trends in Deep Learning Based Natural Language Processing\" (arXiv:1708.02709)","url":"https://arxiv.org/abs/1708.02709"}],"status":"active"},{"id":"Q-151","category":6,"question":"LSTMの「CEC（Constant Error Carousel）」の説明として、最も適切なものはどれか。","choices":["記憶セルの内部状態が重み1で自分自身につながる経路で、誤差が時間を越えて消失も爆発もせずに伝わるようにする","LSTMの出力を、次の時刻の入力層に必ず戻すための経路で、誤差を大きくする働きがある","学習データの順番をランダムに入れ替え続けることで、誤差を一定に保つ学習の方法である","LSTMのすべての重みを学習の間ずっと0に固定しておくための仕組みである"],"answer":0,"explanation":"LSTMの記憶セルの内部状態には、重み1（固定）で自分自身につながる回帰の経路があります。この経路は隣り合う時刻を一定の重みでつなぐため、誤差が時間をさかのぼって伝わるときにも、消失したり爆発したりせずに伝わります。この経路をCEC（Constant Error Carousel、定誤差カルーセル）と呼びます。通常のRNNで起きやすい勾配消失の問題を和らげ、長期の依存関係を学習できるようにする、LSTMの中心的な仕組みです。のちに、内部状態の内容を忘れられるようにする忘却ゲートが加えられました。\n出力を入力層に戻す経路ではなく、誤差を大きくする働きもありません。\n学習データの順番や重みを0に固定することとは関係ありません。","sources":[{"title":"Zachary C. Lipton ほか \"A Critical Review of Recurrent Neural Networks for Sequence Learning\" (arXiv:1506.00019)","url":"https://arxiv.org/abs/1506.00019"}],"status":"active"},{"id":"Q-152","category":6,"question":"音声をコンピュータで扱うためのA-D変換（アナログ-デジタル変換）に関する説明として、最も適切なものはどれか。","choices":["音の波形を一定の時間間隔で測り（標本化）、決まった段階の数値にする（量子化）処理である","音の波形を測る時間間隔は、長くするほど元の音を細かく正確に表せるため、1秒に1回測るのが一般的である","A-D変換は、デジタルの数値を人が聞けるアナログの音に戻す処理のことである","A-D変換では、音の波形の値は測らず、音の高さだけを記録する"],"answer":0,"explanation":"音声は、空気の振動が連続的に変化するアナログの信号です。コンピュータで処理するには、デジタルの数値の列に変換する必要があり、これをA-D変換（アナログ-デジタル変換）といいます。\n・標本化（サンプリング）: 信号の大きさ（振幅）を、一定の時間間隔で測ります。1秒間に測る回数をサンプリングレート（標本化周波数）といい、これが大きいほど細かく記録できます。\n・量子化: 測った値を、決まった段階の数値に丸めます。\nこのように標本化・量子化した値をそのまま数値の列として記録する方式を、パルス符号変調（PCM）といいます。\n測る間隔は短いほど細かく表せます。\nデジタルからアナログに戻す処理はD-A変換です。\nA-D変換では波形の値を測ります。","sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}],"status":"active"},{"id":"Q-153","category":6,"question":"音声の特徴を表すスペクトル包絡とフォルマントに関する説明として、最も適切なものはどれか。","choices":["スペクトル包絡の山にあたるフォルマントは、声道の共鳴によるもので母音の違いを特徴づける","フォルマントは音声の大きさ（音量）を表す値で、母音の違いとは関係がない","スペクトル包絡は、音声の波形を時間ごとに並べたもので、周波数とは関係がない","フォルマント周波数は、話す人や母音に関係なく、すべての音声で同じ値になる"],"answer":0,"explanation":"音声を周波数ごとの成分に分けたものをスペクトルといいます。音声の波形は、フーリエ変換（高速に計算する方法が高速フーリエ変換、FFT）によってスペクトルに変換できます。\nスペクトル包絡は、スペクトルの細かい凹凸をならした、周波数ごとの強さの大まかな形です。音声の場合、声帯で作られた音が、のど・口・鼻などの声道を通るときの響き方の特徴を表します。\nフォルマントは、声を出すときの声道の共鳴によって、スペクトル包絡に現れる山（強い周波数の帯）です。周波数の低いほうから第1フォルマント、第2フォルマントと呼び、その周波数（フォルマント周波数）の組み合わせが、「あ」「い」などの母音の違いを特徴づけます。口の開き方や舌の位置によって変わり、話す人によっても異なります。\nフォルマントは音量ではなく、周波数の特徴です。スペクトル包絡は周波数ごとの強さを表します。","sources":[{"title":"Ryan Cotterell, Jason Eisner \"A Deep Generative Model of Vowel Formant Typology\" (arXiv:1807.02745)","url":"https://arxiv.org/abs/1807.02745"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Te
