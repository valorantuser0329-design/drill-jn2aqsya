chniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"},{"title":"NumPy Documentation \"Discrete Fourier Transform (numpy.fft)\"","url":"https://numpy.org/doc/stable/reference/routines.fft.html"}],"status":"active"},{"id":"Q-154","category":6,"question":"メル尺度とメル周波数ケプストラム係数（MFCC）に関する説明として、最も適切なものはどれか。","choices":["メル尺度は人の聴覚の感じ方をまねた尺度で、MFCCはそれを使う音声の特徴量である","メル尺度は、すべての周波数を同じ細かさで扱う尺度で、人の聴覚とは関係がない","MFCCは、音声の波形をそのまま並べた値で、周波数の情報は含まれていない","MFCCは画像の特徴量で、音声の処理には使われない"],"answer":0,"explanation":"人の耳は、低い周波数の音の違いには敏感で、高い周波数の音の違いには比較的鈍感です。メル尺度は、このような人の聴覚の周波数の感じ方をまねた尺度で、低い周波数を細かく、高い周波数を粗く区切ります。音声のパワースペクトルをメル尺度に変換したものをメルスペクトログラムといいます。\nメル周波数ケプストラム係数（MFCC）は、メル尺度で表したパワースペクトルの対数に、コサイン変換を行って計算する係数です。短い時間ごとの音のスペクトルの特徴（スペクトル包絡の形）をコンパクトに表せるため、音声認識や話者識別などで広く使われてきました。\nメル尺度は人の聴覚に基づく尺度です。\nMFCCは周波数の情報を表す特徴量で、音声の処理に使われます。","sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}],"status":"active"},{"id":"Q-155","category":6,"question":"音声認識で使われる隠れマルコフモデル（HMM）とCTCに関する説明として、最も適切なものはどれか。","choices":["HMMは隠れた状態の並びと観測を組み合わせて音声の確率をモデル化し、CTCは空白の記号を使って長さの違う入力と出力の対応を学習する","HMMは空白の記号を使って入力と出力の対応を学習し、CTCは隠れた状態の並びで音声の確率をモデル化する","CTCは、入力の音声と出力の文字列が必ず同じ長さでなければ使えない方法である","HMMは、音声の波形を直接生成するための、自己回帰型のニューラルネットワークである"],"answer":0,"explanation":"音声認識では、音声の特徴量の系列を、音素（言葉の意味を区別する音の最小の単位）や文字の系列に変換します。\n・隠れマルコフモデル（HMM）: 直接は観測できない「隠れた状態」の時間的な並びと、各状態から生じる観測（音声の特徴量）を組み合わせて、音声の確率の分布をモデル化します。長い間、音声認識の中心的な手法として使われ、ガウス混合モデル（GMM）やニューラルネットワークと組み合わせて使われてきました。学習にはバウム・ウェルチ法（EMアルゴリズムの一種）が使われます。\n・CTC（Connectionist Temporal Classification）: 入力（音声のフレームの系列）と出力（文字の系列）の長さが違う場合に、その対応づけを学習する方法です。出力の記号の間を表す「空白」の記号を導入し、考えられるすべての対応のしかたの確率を足し合わせて損失を計算します。事前に音声と文字の位置を合わせておかなくても学習できます。\n説明が入れ替わっている選択肢は誤りです。\nCTCは長さの違う系列を扱うための方法です。\n波形を生成する自己回帰型のネットワークは、WaveNetなどです。","sources":[{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}],"status":"active"},{"id":"Q-156","category":6,"question":"WaveNetの説明として、最も適切なものはどれか。","choices":["波形を1サンプルずつ、それまでのサンプルから予測して生成する自己回帰型の音声合成モデル","音声を文字に変換する音声認識のためのモデルで、音声を生成することはできない","画像を生成するための敵対的生成ネットワークで、音声は扱わない","話者を識別するために、音声からメル尺度の特徴量だけを計算する手法である"],"answer":0,"explanation":"WaveNetは、ディープマインドが2016年に発表した、音声の生の波形を生成する深層ニューラルネットワークです。波形の各サンプルを、それより前のすべてのサンプルを条件として確率的に予測する自己回帰型のモデルで、1秒に数万サンプルある音声のデータでも効率よく学習できます。テキストから音声を作る音声合成に使うと、従来の方式より人が聞いてはるかに自然な音声になりました。話す人の特徴を変えたり、音楽を生成したりすることもできます。\n音声処理には、音声合成のほかに、音声を文字に変換する音声認識、話している人が誰かを判定する話者識別、声から感情を推定する感情分析（感情認識）などのタスクがあります。\nWaveNetは音声を生成するモデルです。\n画像を生成するGANではありません。","sources":[{"title":"Aaron van den Oord ほか \"WaveNet: A Generative Model for Raw Audio\" (arXiv:1609.03499)","url":"https://arxiv.org/abs/1609.03499"},{"title":"Ambuj Mehrish ほか \"A Review of Deep Learning Techniques for Speech Processing\" (arXiv:2305.00359)","url":"https://arxiv.org/abs/2305.00359"}],"status":"active"},{"id":"Q-157","category":6,"question":"DQN（Deep Q-Network）の説明として、最も適切なものはどれか。","choices":["Q学習と畳み込みニューラルネットワークを組み合わせ、ゲームの画面の画素をそのまま入力として行動価値を学習した","人が設計したゲームの特徴量だけを入力にして、決定木で行動を選ぶ手法である","正解の行動のラベルが付いたデータを使い、教師あり学習だけで行動を学習する手法である","連続した値の行動だけを扱う手法で、ゲームのように行動の選択肢が決まっている問題には使えない"],"answer":0,"explanation":"DQN（Deep Q-Network）は、ディープマインドが提案した深層強化学習の手法です。畳み込みニューラルネットワークでQ学習の行動価値関数を近似し、ゲーム（Atari 2600）の画面の画素をそのまま入力として、将来の報酬の見込みを出力するように学習しました。構造や学習方法をゲームごとに調整しなくても、多くのゲームで従来の手法を上回り、一部では人間の熟練者も上回りました。高次元の感覚の入力から直接、行動の方策を学習できることを示した最初の深層学習のモデルです。\n人が設計した特徴量や決定木を使う手法ではありません。\n正解のラベルではなく、報酬から学習する強化学習の手法です。\n連続値の行動を扱う手法には、DDPGなどがあります。","sources":[{"title":"Volodymyr Mnih ほか \"Playing Atari with Deep Reinforcement Learning\" (arXiv:1312.5602)","url":"https://arxiv.org/abs/1312.5602"}],"status":"active"},{"id":"Q-158","category":6,"question":"DQNを改良した手法に関する説明として、最も適切なものはどれか。","choices":["ダブルDQNは行動価値の過大評価を抑え、デュエリングネットワークは状態の価値と行動ごとの有利さを分けて推定する","ダブルDQNは状態の価値と行動の有利さを分けて推定し、デュエリングネットワークは行動価値の過大評価を抑える","ノイジーネットワークは、ネットワークの重みからノイズを完全に取り除くことで、探索をやめて活用だけを行う","Rainbowは、DQNの改良をすべて取り除いた最も単純なDQNのことである"],"answer":0,"explanation":"DQNには、さまざまな改良が提案されてきました。\n・ダブルDQN: Q学習には、条件によって行動価値を過大に評価してしまう性質があり、DQNでもそれが性能を下げていました。ダブルDQNは、行動の選択と評価に別々のネットワークを使うダブルQ学習の考え方で、過大評価を抑えました。\n・デュエリングネットワーク: ネットワークの出力を、状態そのものの価値（状態価値関数）と、その状態での各行動の相対的な有利さ（アドバンテージ関数）の2つに分けて推定し、組み合わせて行動価値を求めます。\n・ノイジーネットワーク: ネットワークの重みに学習可能なノイズを加え、それによる方策のランダムさを探索に使います。ε-greedyなどの探索の工夫の代わりに使えます。\n・Rainbow: DQNに対する6つの改良を組み合わせ、Atariのゲームで高い性能を示しました。\n説明が入れ替わっている選択肢は誤りです。\nノイジーネットワークはノイズを探索に生かす手法です。","sources":[{"title":"Hado van Hasselt ほか \"Deep Reinforcement Learning with Double Q-learning\" (arXiv:1509.06461)","url":"https://arxiv.org/abs/1509.06461"},{"title":"Ziyu Wang ほか \"Dueling Network Architectures for Deep Reinforcement Learning\" (arXiv:1511.06581)","url":"https://arxiv.org/abs/1511.06581"},{"title":"Meire Fortunato ほか \"Noisy Networks for Exploration\" (arXiv:1706.10295)","url":"https://arxiv.org/abs/1706.10295"},{"title":"Matteo Hessel ほか \"Rainbow: Combining Improvements in Deep Reinforcement Learning\" (arXiv:1710.02298)","url":"https://arxiv.org/abs/1710.02298"}],"status":"active"},{"id":"Q-159","category":6,"question":"深層強化学習の学習を並列化・分散化した手法に関する説明として、最も適切なものはどれか。","choices":["A3Cは複数のエージェントが非同期に学習し、Ape-Xは多数のactorの経験を共有して優先度付きで学習する","A3Cは1つのエージェントだけが順番に学習する手法で、並列化は一切行わない","Ape-Xは、経験を保存せずに、その場で得た経験を一度だけ使って捨てる手法である","A3CもApe-Xも、環境との相互作用を行わずに、ラベル付きデータで学習する教師あり学習の手法である"],"answer":0,"explanation":"・A3C（Asynchronous Advantage Actor-Critic）: 複数のエージェント（actor-learner）が、それぞれ環境とやり取りしながら非同期にネットワークを更新する手法です。並列に学習することで学習が安定し、Actor-Criticの非同期版は、1台の計算機のCPUでも、GPUを使う従来の手法より短い時間で高い性能を示しました。\n・Ape-X: 行動する部分と学習する部分を分けた分散型の手法です。多数のactorが、それぞれの環境で共有のネットワークに従って行動し、得た経験を共有の経験再生メモリにためます。学習する部分（learner）は、重要な経験を優先的に取り出して学習する「優先度付き経験再生」を使ってネットワークを更新します。従来よりけた違いに多くのデータから学習できます。\nA3Cは並列に学習する手法です。\nApe-Xは経験をメモリにためて再利用します。\nどちらも環境とのやり取りから学ぶ強化学習の手法です。","sources":[{"title":"Volodymyr Mnih ほか \"Asynchronous Methods for Deep Reinforcement Learning\" (arXiv:1602.01783)","url":"https://arxiv.org/abs/1602.01783"},{"title":"Dan Horgan ほか \"Distributed Prioritized Experience Replay\" (arXiv:1803.00933)","url":"https://arxiv.org/abs/1803.00933"}],"status":"active"},{"id":"Q-160","category":6,"question":"ゲームで人間を上回った深層強化学習のエージェントに関する説明として、最も適切なものはどれか。","choices":["Agent57はAtariの57のゲームすべてで人間の基準を上回り、OpenAI Fiveはeスポーツのゲーム（Dota 2）で世界王者に勝った","Agent57は囲碁で世界王者に勝ったエージェントで、OpenAI Fiveはチェスで世界王者に勝ったエージェントである","AlphaStarは、将棋だけを対象としたエージェントで、リアルタイムのゲームは扱えない","OpenAI Fiveは、1体のエージェントだけで遊ぶ、情報がすべて見えるボードゲームを対象としていた"],"answer":0,"explanation":"・Agent57: ディープマインドが開発したエージェントで、強化学習の標準的なベンチマークであるAtariの57のゲームすべてで、人間の基準の成績を初めて上回りました。\n・OpenAI Five: 2019年4月、eスポーツのゲームであるDota 2で世界王者に勝ちました。Dota 2は、長い時間にわたる判断、見えない情報がある状況（不完全情報）、複雑で連続的な状態と行動を扱う必要があり、大規模な分散学習によって実現しました。5人のチームで戦うゲームです。\n・AlphaStar: ディープマインドが開発した、リアルタイムの戦略ゲームStarCraft IIのエージェントで、高い性能を示しました。StarCraft IIは、各プレイヤーが限られた情報しか見えない複数のエージェントのゲームとして定式化され、マルチエージェント強化学習の研究の舞台にもなっています。\n囲碁で世界王者に勝ったのはアルファ碁、チェスで勝ったのはディープ・ブルーです。","sources":[{"title":"Adrià Puigdomènech Badia ほか \"Agent57: Outperforming the Atari Human Benchmark\" (arXiv:2003.13350)","url":"https://arxiv.org/abs/2003.13350"},{"title":"OpenAI \"Dota 2 with Large Scale Deep Reinforcement Learning\" (arXiv:1912.06680)","url":"https://arxiv.org/abs/1912.06680"},{"title":"Kaiqing Zhang ほか \"Multi-Agent Reinforcement Learning: A Selective Overview of Theories and Algorithms\" (arXiv:1911.10635)","url":"https://arxiv.org/abs/1911.10635"}],"status":"active"},{"id":"Q-161","category":6,"question":"強化学習の手法であるPPO（Proximal Policy Optimization）の説明として、最も適切なものはどれか。","choices":["方策勾配法の一種で、方策が大きく変わりすぎない目的関数を使い、同じデータで複数回更新できる","行動価値関数だけを学習する価値ベースの手法で、方策を直接更新することはない","環境とやり取りせずに、あらかじめ集めたデータだけで学習するオフライン強化学習の手法である","行動の選択肢が2つの場合にしか使えない、最も単純な強化学習の手法である"],"answer":0,"explanation":"PPO（Proximal Policy Optimization）は、2017年にOpenAIのシュルマンらが提案した方策勾配法の一種です。環境とやり取りしてデータを集めることと、集めたデータで代わりの目的関数（サロゲート目的関数）を最適化することを交互に行います。\n通常の方策勾配法は、データ1つにつき1回しか更新できませんが、PPOは方策が一度に大きく変わりすぎないようにした目的関数を使うことで、同じデータで複数回（複数エポック）のミニバッチ更新ができます。TRPOという手法の利点の一部を持ちつつ、実装がずっと簡単で、多くの問題でよい性能を示すため、広く使われています。大規模言語モデルを人間のフィードバックで調整する強化学習（RLHF）でも使われています。\nPPOは方策を直接更新する手法です。\n環境とのやり取りで集めたデータを使います。","sources":[{"title":"John Schulman ほか \"Proximal Policy Optimization Algorithms\" (arXiv:1707.06347)","url":"https://arxiv.org/abs/1707.06347"},{"title":"Long Ouyang ほか \"Training language models to follow instructions with human feedback\" (arXiv:2203.02155)","url":"https://arxiv.org/abs/2203.02155"}],"status":"active"},{"id":"Q-162","category":6,"question":"深層強化学習で、ロボットの関節の角度のような連続した値の行動を扱う連続値制御に関する説明として、最も適切なものはどれか。","choices":["DDPGは決定論的な方策勾配に基づくActor-Criticの手法で、DQNの考え方を連続した値の行動に広げた","DQNは、連続した値の行動をそのまま出力できるため、連続値制御の問題にはDQNだけが使われる","連続値制御では、行動を必ず2つの選択肢に分けてから、ε-greedy方策で選ぶ必要がある","連続値制御は、報酬を使わない教師なし学習の問題として解く"],"answer":0,"explanation":"DQNは、行動の選択肢が決まっている（離散的な）問題を扱う手法で、行動価値が最大の行動を選ぶため、行動が連続した値をとる問題にはそのままでは使えません。\nDDPG（Deep Deterministic Policy Gradient）は、DQNの成功の考え方を連続した値の行動に広げた手法です。決定論的な方策勾配に基づくActor-Criticの手法で、環境のモデルを使わず（モデルフリー）、連続した行動の空間を扱えます。同じ学習方法とネットワークで、振り子の振り上げ、物のつかみ上げ、脚による移動、車の運転など、20以上の物理シミュレーションの課題を解きました。\nDQNは連続値の行動をそのまま扱えません。\n行動を2つに分ける必要はありません。\n連続値制御も報酬を使う強化学習の問題です。","sources":[{"title":"Timothy P. Lillicrap ほか \"Continuous control with deep reinforcement learning\" (arXiv:1509.02971)","url":"https://arxiv.org/abs/1509.02971"},{"title":"Volodymyr Mnih ほか \"Playing Atari with Deep Reinforcement Learning\" (arXiv:1312.5602)","url":"https://arxiv.org/abs/1312.5602"}],"status":"active"},{"id":"Q-163","category":6,"question":"ロボットの強化学習で使われるsim2realとドメインランダマイゼーションの説明として、最も適切なものはどれか。","choices":["シミュレータの見た目などの条件をランダムに変えて学習させ、学習したモデルを現実に移しやすくする","シミュレータは使わずに、現実のロボットだけで何百万回も試行錯誤させて学習させる方法である","シミュレータの条件を1つに固定し、現実とまったく同じになるまで調整してから学習させる方法である","現実の環境で集めたデータを使って、シミュレータの中の画像を生成する方法のことである"],"answer":0,"explanation":"現実のロボットで強化学習を行うと、時間や費用がかかり、故障の危険もあります。そこで、シミュレータの中で学習したモデルを現実のロボットに移す方法が研究されており、これをsim2real（シミュレーションから現実へ）と呼びます。しかし、シミュレータと現実の間には見た目や物理の差（リアリティギャップ）があり、そのままではうまく動かないことがあります。\nドメインランダマイゼーションは、シミュレータの中で、物体の色や質感、照明などの描画の条件をランダムに変えながら学習させる方法です。十分に多様な条件で学習すれば、モデルにとって現実の世界も「変化のひとつ」に見えるようになり、現実に移しやすくなります。\n現実のロボットだけで学習する方法ではありません。\n条件を1つに固定するのとは逆の考え方です。","sources":[{"title":"Josh Tobin ほか \"Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World\" (arXiv:1703.06907)","url":"https://arxiv.org/abs/1703.06907"}],"status":"active"},{"id":"Q-164","category":6,"question":"強化学習の手法や考え方に関する説明として、最も適切なものはどれか。","choices":["オフライン強化学習は、新たに環境とやり取りせず、あらかじめ集めたデータだけから方策を学習する","オフライン強化学習は、インターネットに接続していない計算機で学習させる強化学習のことである","報酬成形は、報酬をすべて取り除いて、エージェントが自由に行動するようにする方法である","状態表現学習は、画像などの高次元の入力をそのまま使い、低次元の表現はあえて学習しない方法である"],"answer":0,"explanation":"・オフライン強化学習: 新たに環境とやり取りしてデータを集めることをせず、あらかじめ集められたデータだけを使って方策を学習する強化学習です。実際に試行錯誤させるのが危険だったり費用がかかったりする分野で、大量のデータを判断に役立てる方法として期待されています。\n・報酬成形: 学習を助けるために、本来の報酬に補助的な報酬を加える方法です。報酬がまれにしか得られない問題で、解き方についての事前の知識を取り込めます。ポテンシャルに基づく報酬成形は、最適な方策を変えないことが保証されています。\n・状態表現学習: エージェントの行動によって変化する環境の様子を、低次元の表現として学習する方法です。ロボットの制御などに向いています。\n・残差強化学習: 従来の制御の方法でうまく解ける部分と、接触や摩擦のようにモデル化が難しい残りの部分（残差）に分け、残差を強化学習で学ぶ方法です。最終的な制御は両方の信号を足し合わせたものになります。\nオフライン強化学習は、インターネット接続の有無のことではありません。\n報酬成形は報酬を補う方法で、取り除く方法ではありません。","sources":[{"title":"Sergey Levine ほか \"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems\" (arXiv:2005.01643)","url":"https://arxiv.org/abs/2005.01643"},{"title":"Henrik Müller, Daniel Kudenko \"Improving the Effectiveness of Potential-Based Reward Shaping in Reinforcement Learning\" (arXiv:2502.01307)","url":"https://arxiv.org/abs/2502.01307"},{"title":"Timothée Lesort ほか \"State Representation Learning for Control: An Overview\" (arXiv:1802.04181)","url":"https://arxiv.org/abs/1802.04181"},{"title":"Tobias Johannink ほか \"Residual Reinforcement Learning for Robot Control\" (arXiv:1812.03201)","url":"https://arxiv.org/abs/1812.03201"}],"status":"active"},{"id":"Q-165","category":6,"question":"大規模言語モデルの調整に使われるRLHF（人間のフィードバックによる強化学習）の説明として、最も適切なものはどれか。","choices":["人がモデルの出力を比べて順位を付けたデータを使い、人の意図に合う出力をするように、強化学習でモデルを調整する","モデルのパラメータの数を増やすだけで、人の意図に合う出力をするように自然に調整される仕組みのことである","人が関わらずに、モデルどうしを対戦させて勝った方の出力だけを学習データにする方法である","モデルが出力した文章を、人がすべて手で書き直してから公開する運用のことである"],"answer":0,"explanation":"言語モデルを大きくするだけでは、利用者の意図に沿った出力をするようにはなりません。事実と異なる内容や有害な内容、役に立たない内容を出力することがあります。\nRLHF（Reinforcement Learning from Human Feedback）は、人のフィードバックを使ってモデルを利用者の意図に合わせる（アラインメント）方法です。InstructGPTの研究では、①人が望ましい出力の例を書いたデータでモデルを教師あり学習で調整し、②モデルの複数の出力を人が比べて順位を付けたデータを集め、③それをもとに強化学習でモデルをさらに調整しました。その結果、パラメータが100分の1の13億のモデルの出力が、1750億のGPT-3の出力より人に好まれ、事実に即した出力が増え、有害な出力が減りました。\nパラメータを増やすだけでは意図に沿うようになりません。\nモデルどうしの対戦ではなく、人のフィードバックを使います。\n人が出力を書き直す運用のことではありません。","sources":[{"title":"Long Ouyang ほか \"Training language models to follow instructions with human feedback\" (arXiv:2203.02155)","url":"https://arxiv.org/abs/2203.02155"}],"status":"active"},{"id":"Q-166","category":6,"question":"マルチエージェント強化学習（MARL）の説明として、最も適切なものはどれか。","choices":["複数のエージェントが同じ環境の中で、協力したり競い合ったりしながら、それぞれ強化学習で行動を学ぶ","1つのエージェントが複数の計算機を使って学習することだけを指し、エージェントは常に1つである","複数の教師あり学習のモデルを組み合わせて多数決をとる、アンサンブル学習の一種である","報酬を使わずに、複数のエージェントの行動をすべて人が決める方法である"],"answer":0,"explanation":"マルチエージェント強化学習（MARL）は、複数のエージェントが同じ環境の中で相互に影響し合いながら、それぞれ強化学習で行動を学ぶ枠組みです。エージェントどうしが協力する場合、競い合う場合、その両方が混ざる場合があります。囲碁やポーカーのようなゲーム、ロボット、自動運転など、強化学習が成功している応用の多くには複数のエージェントが関わるため、単一のエージェントの強化学習の進歩とともに改めて注目されています。StarCraft IIのように、各エージェントが一部の情報しか見えない問題も研究の対象になっています。\n1つのエージェントの並列学習のことではありません。\nアンサンブル学習とは別の考え方です。\nMARLも報酬から学ぶ強化学習です。","sources":[{"title":"Kaiqing Zhang ほか \"Multi-Agent Reinforcement Learning: A Selective Overview of Theories and Algorithms\" (arXiv:1911.10635)","url":"https://arxiv.org/abs/1911.10635"}],"status":"active"},{"id":"Q-167","category":6,"question":"敵対的生成ネットワーク（GAN）の説明として、最も適切なものはどれか。","choices":["データを生成する生成器と、本物のデータか生成されたデータかを見分ける識別器を、競わせながら同時に学習させる","1つのネットワークだけで、正解のラベルを使ってデータを分類する教師あり学習のモデルである","データにノイズを少しずつ加える過程と、それを取り除く過程を学習する生成モデルである","入力を潜在変数の確率分布として表し、復元の誤差とKL情報量で学習するモデルである"],"answer":0,"explanation":"GAN（Generative Adversarial Networks）は、2014年にグッドフェローらが提案した生成モデルの枠組みです。次の2つのモデルを同時に学習させます。\n・生成器（G）: 学習データの分布をとらえて、本物そっくりのデータを生成します。\n・識別器（D）: 入力が学習データ（本物）か、生成器が作ったもの（偽物）かを見分けます。\n生成器は識別器をだますように、識別器は見破るように学習し、2者の対戦（ミニマックスゲーム）として定式化されます。理想的には、生成器は学習データの分布を再現し、識別器はどちらにも1/2を出力する状態になります。\n画像の生成などに広く使われ、畳み込みニューラルネットワークを使ったDCGANなど、多くの発展形があります。\n分類のためのモデルではありません。\n「ノイズを加えて取り除く過程を学習する」のは拡散モデルです。\n「潜在変数の確率分布とKL情報量で学習する」のはVAEです。","sources":[{"title":"Ian J. Goodfellow ほか \"Generative Adversarial Networks\" (arXiv:1406.2661)","url":"https://arxiv.org/abs/1406.2661"},{"title":"Alec Radford ほか \"Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks\" (arXiv:1511.06434)","url":"https://arxiv.org/abs/1511.06434"}],"status":"active"},{"id":"Q-168","category":6,"question":"画像から画像への変換を行うPix2PixとCycleGANに関する説明として、最も適切なものはどれか。","choices":["Pix2Pixは入力と出力の画像の組（ペア）で学習し、CycleGANはペアのない2つの画像の集まりの間の変換を学習する","Pix2Pixはペアのない画像の集まりで学習し、CycleGANは入力と出力の画像のペアが必ず必要である","Pix2PixもCycleGANも、画像を生成することはできず、画像を分類するだけのモデルである","Pix2PixもCycleGANも、文章から画像を生成するためのモデルである"],"answer":0,"explanation":"どちらも、ある種類の画像を別の種類の画像に変換する（画像から画像への変換）ためのGANの発展形です。\n・Pix2Pix: 条件付きのGANを使い、入力の画像と、それに対応する出力の画像の組（ペア）で学習します。変換だけでなく、変換を学ぶための損失関数も学習するため、ラベルの地図から写真を作る、線画から物体を復元する、白黒の画像に色を付けるなど、さまざまな変換に同じ方法で対応できます。\n・CycleGAN: 多くの変換では、対応するペアの画像を集めることができません。CycleGANは、ペアのない2つの画像の集まり（2つの領域）の間の変換を学習します。変換した画像を元に戻すと元の画像になるという「サイクル一貫性」の条件を加えることで、ペアがなくても学習できます。\n説明が入れ替わっている選択肢は誤りです。\nどちらも画像を生成（変換）するモデルで、入力は文章ではなく画像です。","sources":[{"title":"Phillip Isola ほか \"Image-to-Image Translation with Conditional Adversarial Networks\" (arXiv:1611.07004)","url":"https://arxiv.org/abs/1611.07004"},{"title":"Jun-Yan Zhu ほか \"Unpaired Image-to-Image Translation using Cycle-Consistent Adversarial Networks\" (arXiv:1703.10593)","url":"https://arxiv.org/abs/1703.10593"}],"status":"active"},{"id":"Q-169","category":6,"question":"拡散モデル（Diffusion Model）の説明として、最も適切なものはどれか。","choices":["データにノイズを加える過程の逆に、ノイズを少しずつ取り除く過程を学習して画像などを生成する","生成器と識別器を競わせて学習させるモデルで、ノイズを取り除く過程は含まない","画像を分類するためのモデルで、新しい画像を生成することはできない","入力の画像を小さなパッチに分けて、Transformerで分類するモデルである"],"answer":0,"explanation":"拡散モデルは、データに少しずつノイズを加えていくと、最終的には純粋なノイズになる過程（拡散過程）を考え、その逆に、ノイズを少しずつ取り除いてデータを復元する過程を学習する生成モデルです。学習後は、ランダムなノイズから始めてノイズを取り除いていくことで、新しい画像などを生成できます。\nホーらのDDPM（Denoising Diffusion Probabilistic Models、2020年）は、拡散モデルで高品質な画像を生成できることを示しました。現在、文章から画像を生成するサービスなどで広く使われています。\n「生成器と識別器を競わせる」のはGANです。\n拡散モデルは画像を生成するモデルです。\n「パッチに分けてTransformerで分類する」のはVision Transformerです。","sources":[{"title":"Jonathan Ho ほか \"Denoising Diffusion Probabilistic Models\" (arXiv:2006.11239)","url":"https://arxiv.org/abs/2006.11239"}],"status":"active"},{"id":"Q-170","category":6,"question":"NeRF（Neural Radiance Fields）の説明として、最も適切なものはどれか。","choices":["空間の位置と見る方向から色と密度を出すネットワークで場面を表し、新しい視点の画像を合成する","1枚の画像に写っている物体のクラスを答える、画像分類のためのネットワークである","文章を入力として、その内容に合う音声を生成する音声合成のモデルである","画像の中の物体を矩形で囲み、そのクラスを答える物体検出のモデルである"],"answer":0,"explanation":"NeRF（Neural Radiance Fields）は、いくつかの視点から撮影した画像をもとに、場面を3次元的に表現し、撮影していない新しい視点から見た画像を合成する方法です。場面を、空間の位置（x, y, z）と見る方向を入力とし、その位置の密度（どれだけ物がつまっているか）と、その方向に放たれる色を出力する全結合のネットワークで表します。見る方向に沿って光線をたどりながらネットワークに問い合わせて色を積み重ねることで、画像を描きます。複雑な場面でも、写真のようにリアルな新しい視点の画像を作れます。\n画像分類や物体検出のモデルではありません。\n音声合成のモデルではありません。","sources":[{"title":"Ben Mildenhall ほか \"NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis\" (arXiv:2003.08934)","url":"https://arxiv.org/abs/2003.08934"}],"status":"active"},{"id":"Q-171","category":6,"question":"転移学習とファインチューニングに関する説明として、最も適切なものはどれか。","choices":["大量のデータで事前学習した事前学習済みモデルを土台にし、少ないデータで目的のタスクに合わせて調整する","どのタスクでも、事前学習済みモデルは使わずに、ランダムな初期値から毎回すべてを学習し直す","ファインチューニングでは、事前学習済みモデルの重みを一切変えずに、そのまま目的のタスクに使う","転移学習は、学習済みのモデルを別の計算機に移動させる作業のことである"],"answer":0,"explanation":"転移学習は、あるタスクやデータで学習した知識を、別のタスクに生かす方法です。深層学習では、大量のデータで事前学習した事前学習済みモデルを土台として使い、目的のタスクのデータで調整するのが一般的です。事前学習済みモデルの重みを初期値として、目的のタスクのデータで重みを更新して調整することを、ファインチューニングといいます。一部の層の重みを固定して、出力に近い層だけを学習し直す方法もあります。\n目的のタスクのデータが少なくても高い性能を出しやすいため、画像認識（ImageNetで事前学習したCNNやViTなど）でも、自然言語処理（BERTなど）でも広く使われています。R-CNNの研究でも、ラベル付きデータが少ないときに、大きなデータセットで事前学習してからファインチューニングすることが有効だと示されました。\n毎回ランダムな初期値から学習し直すのは転移学習ではありません。\nファインチューニングでは重みを更新します。\n計算機の間でモデルを移動させることではありません。","sources":[{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"},{"title":"Ross Girshick ほか \"Rich feature hierarchies for accurate object detection and semantic segmentation\" (arXiv:1311.2524)","url":"https://arxiv.org/abs/1311.2524"},{"title":"Alexey Dosovitskiy ほか \"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale\" (arXiv:2010.11929)","url":"https://arxiv.org/abs/2010.11929"}],"status":"active"},{"id":"Q-172","category":6,"question":"大規模言語モデルの使い方で、Zero-shot、One-shot、Few-shotの違いの説明として、最も適切なものはどれか。","choices":["Zero-shotは課題の説明だけを与え、One-shotは例を1つ、Few-shotは例をいくつか与えて、モデルの重みは更新せずに課題を解かせる","Zero-shotは例をいくつか与え、Few-shotは課題の説明だけを与えて、どちらもモデルの重みを大きく更新する","One-shotは、学習データを1回だけ使ってモデルをゼロから学習させる方法である","Few-shotは、数万件のラベル付きデータでファインチューニングしてから課題を解かせる方法である"],"answer":0,"explanation":"GPT-3の論文では、モデルの重みを更新せずに、文章（プロンプト）の中で課題を示して解かせる方法を、例の数によって次のように分けています。\n・Few-shot: 課題の説明に加えて、いくつかの例（入力と答えの組）を示します。\n・One-shot: 例を1つだけ示します。人に課題を伝えるときのやり方に最も近いものです。\n・Zero-shot: 例を示さず、課題を説明する自然な言葉の指示だけを与えます。最も手軽ですが、最も難しい設定です。\nいずれの場合も、ファインチューニングのような重みの更新は行いません。画像の分野でも、CLIPのように、学習時に見ていないクラスの分類を説明文だけで行うことをZero-shotと呼びます。\n例の数の説明が入れ替わっている選択肢は誤りです。\nOne-shotやFew-shotは、重みを更新して学習し直す方法ではありません。","sources":[{"title":"Tom B. Brown ほか \"Language Models are Few-Shot Learners\" (arXiv:2005.14165)","url":"https://arxiv.org/abs/2005.14165"},{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"}],"status":"active"},{"id":"Q-173","category":6,"question":"自己教師あり学習と半教師あり学習に関する説明として、最も適切なものはどれか。","choices":["自己教師あり学習はデータ自体から作った課題で学び、半教師あり学習は少量のラベル付きと大量のラベルなしデータを使う","自己教師あり学習は大量のラベル付きデータだけを使い、半教師あり学習はラベルを一切使わない学習である","自己教師あり学習と半教師あり学習は、どちらも人が1件ずつ正解を教える、通常の教師あり学習の別名である","半教師あり学習は、学習の途中で人の半分がモデルを監視する運用のことである"],"answer":0,"explanation":"・自己教師あり学習: 人が付けたラベルを使わずに、データ自体から自動的に作った課題（例: 文の一部を隠して当てる、同じ画像から作った2つの変形が同じ画像由来かを見分ける）を解くことで、データのよい表現を学習する方法です。例えばSimCLRは、同じ画像にデータ拡張を施した2つの画像の表現が近くなり、別の画像の表現とは遠くなるように学習する（対照学習）ことで、ラベルなしで画像の表現を学びました。BERTやGPTの事前学習も、文章から作った課題で学ぶ自己教師あり学習です。\n・半教師あり学習: 少量のラベル付きデータと、大量のラベルなしデータを組み合わせて学習する方法で、教師あり学習と教師なし学習を組み合わせたものです。ラベル付けの手間を減らせます。\n説明が入れ替わっている選択肢は誤りです。\nどちらも、人が付けたラベルをすべてのデータに必要とする通常の教師あり学習とは異なります。","sources":[{"title":"Ting Chen ほか \"A Simple Framework for Contrastive Learning of Visual Representations\" (arXiv:2002.05709)","url":"https://arxiv.org/abs/2002.05709"},{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"Jacob Devlin ほか \"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding\" (arXiv:1810.04805)","url":"https://arxiv.org/abs/1810.04805"}],"status":"active"},{"id":"Q-174","category":6,"question":"ニューラルネットワークの「破滅的忘却」の説明として、最も適切なものはどれか。","choices":["新しいタスクを学習すると、以前に学習したタスクの性能が大きく下がってしまう現象","学習データが多すぎて、モデルが学習データをすべて記憶しきれなくなる現象","学習が終わったモデルの重みを保存し忘れて、学習の結果がすべて失われる事故","推論の結果を利用者が忘れてしまい、同じ質問を何度も繰り返す現象"],"answer":0,"explanation":"破滅的忘却は、ニューラルネットワークにタスクを順番に学習させると、新しいタスクを学習したときに、以前に学習したタスクの知識が上書きされて、その性能が大きく下がってしまう現象です。人のように、タスクを次々に学びながら古い知識も保つ（継続学習）ことは、ニューラルネットワークにとって難しい課題とされてきました。\nこれに対して、以前のタスクにとって重要な重みの学習を選択的に遅くすることで、古いタスクの知識を保つ方法（EWC）などが提案されています。ファインチューニングで元の能力が失われる場合にも問題になります。\n学習データを記憶しきれない現象、重みの保存忘れ、利用者の忘れのことではありません。","sources":[{"title":"James Kirkpatrick ほか \"Overcoming catastrophic forgetting in neural networks\" (arXiv:1612.00796)","url":"https://arxiv.org/abs/1612.00796"}],"status":"active"},{"id":"Q-175","category":6,"question":"CLIPの説明として、最も適切なものはどれか。","choices":["大量の画像と説明文の組で、どの説明文がどの画像に合うかを当てるように学習し、Zero-shotで分類できる","決められたクラスのラベルが付いた画像だけで学習し、新しいクラスを分類するには必ず追加のラベル付きデータが必要なモデルである","音声を文字に変換するための音声認識のモデルで、画像は扱わない","文章を入力として、その内容に合う画像を1画素ずつ生成する画像生成のモデルである"],"answer":0,"explanation":"従来の画像認識のモデルは、決められたクラスを予測するように学習するため、新しい種類の物体を認識させるには、追加のラベル付きデータが必要でした。\nCLIPは、OpenAIが2021年に発表したモデルで、インターネット上の大量の画像と説明文（キャプション）の組を使い、「どの説明文がどの画像に対応するか」を当てるという単純な課題で、画像と文章の表現を同時に学習しました。学習後は、クラスの名前を説明文として与えるだけで、学習時に見ていないクラスの画像も分類できます（Zero-shot）。このように、画像と文章のように複数の種類のデータ（モダリティ）を扱うことを、マルチモーダルといいます。\nラベル付きデータが必須のモデルではありません。\n音声認識や、画像を生成するモデルではありません。","sources":[{"title":"Alec Radford ほか \"Learning Transferable Visual Models From Natural Language Supervision\" (arXiv:2103.00020)","url":"https://arxiv.org/abs/2103.00020"}],"status":"active"},{"id":"Q-176","category":6,"question":"マルチモーダルなモデルに関する説明として、最も適切なものはどれか。","choices":["DALL-Eは文章と画像をまとめて扱うTransformerで画像を生成し、Flamingoは画像と文章の入力を少数例で扱う","DALL-Eは画像から説明文を生成するモデルで、文章から画像を生成することはできない","Flamingoは、画像だけを入力として受け付け、文章は一切扱うことができないモデルである","Unified-IOは、1つのタスクだけを専門に処理するモデルで、複数のタスクには使えない"],"answer":0,"explanation":"・DALL-E: 文章から画像を生成する（Text-To-Image）モデルです。文章のトークンと画像のトークンを1つの系列として、Transformerで自己回帰的にモデル化しました。十分なデータと規模があれば、特定のデータセットに合わせて作ったモデルに、Zero-shotで匹敵することを示しました。\n・Flamingo: 画像と文章が任意に混ざった系列を入力として扱える視覚言語モデル（VLM）です。事前学習済みの画像のモデルと言語のモデルを橋渡しする工夫により、少数の例（Few-shot）を示すだけで、新しいタスクに素早く対応できます。\n・Unified-IO: 姿勢推定、物体検出、画像生成などの画像のタスク、画像の領域の説明文の生成などの画像と言語のタスク、質問応答などの自然言語処理のタスクを、1つのモデルでこなします。\nDALL-Eは文章から画像を生成します。\nFlamingoは画像と文章の両方を扱います。\nUnified-IOは多くのタスクを1つのモデルで扱います。","sources":[{"title":"Aditya Ramesh ほか \"Zero-Shot Text-to-Image Generation\" (arXiv:2102.12092)","url":"https://arxiv.org/abs/2102.12092"},{"title":"Jean-Baptiste Alayrac ほか \"Flamingo: a Visual Language Model for Few-Shot Learning\" (arXiv:2204.14198)","url":"https://arxiv.org/abs/2204.14198"},{"title":"Jiasen Lu ほか \"Unified-IO: A Unified Model for Vision, Language, and Multi-Modal Tasks\" (arXiv:2206.08916)","url":"https://arxiv.org/abs/2206.08916"}],"status":"active"},{"id":"Q-177","category":6,"question":"画像と言語を組み合わせたタスクに関する説明として、最も適切なものはどれか。","choices":["Image Captioningは画像の内容を説明する文章を生成し、Visual Question Answeringは画像とそれについての質問から答えを返す","Image Captioningは文章から画像を生成し、Visual Question Answeringは画像を複数のクラスに分類するだけのタスクである","Visual Question Answeringでは、質問は必ず「はい」か「いいえ」で答えられるものに限られ、画像は使わない","Image Captioningは、画像の中の物体の位置を矩形で囲むだけのタスクで、文章は生成しない"],"answer":0,"explanation":"・Image Captioning（画像説明文生成）: 画像の内容を説明する自然な文章を自動で生成するタスクです。コンピュータビジョンと自然言語処理をつなぐ基本的な問題で、例えばShow and Tellでは、CNNで画像の特徴を取り出し、RNNで文章を生成するモデルが提案されました。\n・Visual Question Answering（VQA、視覚的質問応答）: 画像と、その画像についての自然な言葉の質問を与えて、正確な答えを自然な言葉で返すタスクです。質問も答えも自由な形式で、画像の細かい部分や背景、文脈まで理解する必要があります。目の見えない人を支援するような、現実の場面を想定しています。\n説明が入れ替わっている、または誤った内容の選択肢は誤りです。\nVQAの答えは「はい・いいえ」に限らず、画像を使います。\nImage Captioningは文章を生成します。","sources":[{"title":"Oriol Vinyals ほか \"Show and Tell: A Neural Image Caption Generator\" (arXiv:1411.4555)","url":"https://arxiv.org/abs/1411.4555"},{"title":"Aishwarya Agrawal ほか \"VQA: Visual Question Answering\" (arXiv:1505.00468)","url":"https://arxiv.org/abs/1505.00468"}],"status":"active"},{"id":"Q-178","category":6,"question":"基盤モデルとマルチタスク学習に関する説明として、最も適切なものはどれか。","choices":["基盤モデルは大規模に学習して多くのタスクに適応でき、マルチタスク学習は複数のタスクを同時に学ぶ","基盤モデルは1つのタスク専用に小さなデータで学習したモデルのことで、ほかのタスクには使えない","マルチタスク学習は、1つのタスクを複数の計算機で並列に学習させることだけを指す","基盤モデルは、利点だけがあり、リスクについて議論する必要はないとされている"],"answer":0,"explanation":"・基盤モデル（Foundation Model）: BERT、DALL-E、GPT-3のように、幅広いデータを使って大規模に学習し、さまざまな下流のタスクに適応できるモデルのことです。スタンフォード大学の研究者らが、その中心的でありながら未完成な性格を強調するためにこう名付けました。能力（言語、画像、ロボット、推論など）と同時に、偏りや悪用などのリスクについても議論されています。\n・マルチタスク学習: 関連する複数のタスクを1つのモデルで同時に学習する方法です。タスクの間で知識を共有することで、それぞれのタスクの性能を高めることを目指します。自然言語処理、音声認識、コンピュータビジョン、創薬など多くの分野で成果を上げています。\n基盤モデルは多くのタスクに使えるモデルです。\nマルチタスク学習は、複数のタスクを同時に学ぶ方法です。\n基盤モデルにはリスクもあります。","sources":[{"title":"Rishi Bommasani ほか \"On the Opportunities and Risks of Foundation Models\" (arXiv:2108.07258)","url":"https://arxiv.org/abs/2108.07258"},{"title":"Sebastian Ruder \"An Overview of Multi-Task Learning in Deep Neural Networks\" (arXiv:1706.05098)","url":"https://arxiv.org/abs/1706.05098"}],"status":"active"},{"id":"Q-179","category":6,"question":"画像認識のCNNの判断の根拠を可視化するCAMとGrad-CAMに関する説明として、最も適切なものはどれか。","choices":["どちらも予測に重要な画像の領域を示す手法で、Grad-CAMは勾配を使うため多くのCNNに適用できる","どちらもCNNの判断の根拠を数値の表だけで示す手法で、画像の領域を示すことはできない","CAMは勾配を使うためどのようなCNNにも使えるが、Grad-CAMはグローバルアベレージプーリングを持つCNNにしか使えない","どちらも画像を生成するための手法で、判断の根拠の説明とは関係がない"],"answer":0,"explanation":"・CAM（Class Activation Mapping）: グローバルアベレージプーリング（GAP）を持つCNNでは、画像全体のラベルだけで学習しても、物体の位置を特定する能力が備わることを示し、あるクラスの予測に重要だった画像の領域を可視化しました。ただし、GAPを持つ構造が必要です。\n・Grad-CAM（Gradient-weighted CAM）: 予測したいクラスについての勾配が、最後の畳み込み層にどのように流れ込むかを使って、予測に重要だった領域をおおまかに示す地図を作ります。全結合層を持つCNNなど、構造を変えずに多くの種類のCNNに使えます。\nこのような手法は、モデルがなぜその判断をしたかを人に示す、説明可能AI（XAI）の技術の一つです。\n画像の領域を示す手法です。\n勾配を使って多くのCNNに使えるのはGrad-CAMのほうです。","sources":[{"title":"Bolei Zhou ほか \"Learning Deep Features for Discriminative Localization\" (arXiv:1512.04150)","url":"https://arxiv.org/abs/1512.04150"},{"title":"Ramprasaath R. Selvaraju ほか \"Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization\" (arXiv:1610.02391)","url":"https://arxiv.org/abs/1610.02391"}],"status":"active"},{"id":"Q-180","category":6,"question":"モデルの予測を説明する手法であるLIMEとSHAPに関する説明として、最も適切なものはどれか。","choices":["LIMEは説明したい予測の周りで解釈しやすいモデルを学習して近似し、SHAPはシャープレイ値の考え方で各特徴量の予測への貢献を求める","LIMEはシャープレイ値の考え方で各特徴量の貢献を求め、SHAPは予測の周りで解釈しやすいモデルを学習して近似する","LIMEとSHAPは、特定の種類のニューラルネットワークにしか使えず、決定木などのモデルには使えない","LIMEとSHAPは、モデルの予測の精度を上げるための手法で、予測の理由は説明しない"],"answer":0,"explanation":"・LIME: どのような分類モデルの予測にも使える説明の手法です。説明したい1つの予測の周り（局所的な範囲）で、線形モデルのような解釈しやすいモデルを学習してもとのモデルを近似し、どの特徴量がその予測に効いたかを示します。\n・SHAP（SHapley Additive exPlanations）: 協力ゲーム理論のシャープレイ値の考え方を使い、ある予測について、各特徴量がどれだけ貢献したかを表す値を求めます。いくつかの既存の説明手法を統一的に扱える枠組みで、望ましい性質を持つ唯一の解があることが示されています。\nどちらも、アンサンブル学習や深層学習のような、専門家でも解釈が難しい複雑なモデルの予測を、人が理解できるようにするための、説明可能AI（XAI）の手法です。\n説明が入れ替わっている選択肢は誤りです。\nどちらもモデルの種類を問わずに使えます。\n精度を上げる手法ではありません。","sources":[{"title":"Marco Tulio Ribeiro ほか \"Why Should I Trust You?: Explaining the Predictions of Any Classifier\" (arXiv:1602.04938)","url":"https://arxiv.org/abs/1602.04938"},{"title":"Scott Lundberg, Su-In Lee \"A Unified Approach to Interpreting Model Predictions\" (arXiv:1705.07874)","url":"https://arxiv.org/abs/1705.07874"}],"status":"active"},{"id":"Q-181","category":6,"question":"Permutation Importance（順列重要度）の説明として、最も適切なものはどれか。","choices":["ある特徴量の値だけをランダムに並べ替えたときに、学習済みのモデルの性能がどれだけ下がるかで、その特徴量の重要度を測る","すべての特徴量の値を削除して、モデルを最初から学習し直したときの学習時間で、重要度を測る","特徴量の名前をアルファベット順に並べ替えて、先頭にあるものほど重要だとみなす方法である","学習データの件数を並べ替えて、多いクラスほど重要だとみなす方法である"],"answer":0,"explanation":"Permutation Importance（順列重要度、並べ替えによる特徴量の重要度）は、学習済みのモデルが、各特徴量にどれだけ頼っているかを調べる手法です。ある特徴量の値だけをランダムに並べ替える（シャッフルする）と、その特徴量と正解との関係が壊れます。そのときにモデルの性能がどれだけ下がるかで、その特徴量の重要度を測ります。性能が大きく下がる特徴量ほど、モデルが重要視していると考えられます。\nモデルの中身がわかりにくい非線形のモデルや、ブラックボックスのモデルにも使えるのが特徴で、説明可能AI（XAI）の手法の一つです。\nモデルを学習し直したり、名前やデータの件数を並べ替えたりする方法ではありません。","sources":[{"title":"scikit-learn User Guide 4.2 Permutation feature importance","url":"https://scikit-learn.org/stable/modules/permutation_importance.html"},{"title":"Alejandro Barredo Arrieta ほか \"Explainable Artificial Intelligence (XAI): Concepts, Taxonomies, Opportunities and Challenges toward Responsible AI\" (arXiv:1910.10045)","url":"https://arxiv.org/abs/1910.10045"}],"status":"active"},{"id":"Q-182","category":6,"question":"モデルの軽量化の手法である知識の蒸留の説明として、最も適切なものはどれか。","choices":["大きな教師モデルが学んだ知識を小さな生徒モデルに移し、少ない計算で近い性能を出せるようにする","小さなモデルの知識を大きなモデルに移し、モデルをより大きくすることで性能を上げる方法である","モデルの重みを、決まった値より小さいものから順に削除していく方法である","学習データから不要なデータを取り除いて、データの量を減らす方法である"],"answer":0,"explanation":"多くのモデルの予測を平均するアンサンブルは性能を上げる簡単な方法ですが、多数の大きなモデルで予測するのは計算の負担が大きく、多くの利用者に提供するには向きません。\n知識の蒸留は、大きなモデル（教師モデル）やアンサンブルが学んだ知識を、扱いやすい小さなモデル（生徒モデル）に移す方法です。生徒モデルは、正解のラベルだけでなく、教師モデルの出力（各クラスの確率）もまねるように学習します。ヒントンらは、この方法で、広く使われている商用システムの音響モデルの性能を大きく向上させました。\n小さなモデルから大きなモデルへ移す方法ではありません。\n「小さな重みから削除する」のはプルーニング（枝刈り）です。\nデータを減らす方法ではありません。","sources":[{"title":"Geoffrey Hinton ほか \"Distilling the Knowledge in a Neural Network\" (arXiv:1503.02531)","url":"https://arxiv.org/abs/1503.02531"}],"status":"active"},{"id":"Q-183","category":6,"question":"プルーニング（枝刈り）と宝くじ仮説に関する説明として、最も適切なものはどれか。","choices":["プルーニングは不要な結合を除いてモデルを小さくし、宝くじ仮説は大きなネットワークによく学習できる小さな部分があるという考え","プルーニングは、モデルの層や結合を増やしてモデルを大きくする方法である","宝くじ仮説は、学習データをくじ引きのようにランダムに選べば、必ず精度が上がるという考えである","宝くじ仮説は、どのような初期値から学習しても、小さなネットワークは必ず大きなネットワークより高い精度になるという考えである"],"answer":0,"explanation":"・プルーニング（枝刈り）: 学習したネットワークから、重要でない結合（重み）を取り除いて、モデルを小さくする方法です。パラメータの数を90%以上減らしても、精度を落とさずに、記憶に必要な容量を減らし、推論を速くできることがあります。\n・宝くじ仮説: ランダムな初期値の大きなネットワークの中には、単独で学習させても、元のネットワークと同じくらいの回数で同じくらいの精度に達する小さな部分ネットワーク（「当たりくじ」）が含まれている、という仮説です。当たりくじは、学習に特に向いた初期値の結合を持っていると考えられます。フランクルとカービンは、元の10〜20%以下の大きさの当たりくじを見つけました。\nプルーニングはモデルを小さくする方法です。\n宝くじ仮説は、学習データの選び方の話ではなく、また、どのような初期値でもよいという考えでもありません。","sources":[{"title":"Jonathan Frankle, Michael Carbin \"The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks\" (arXiv:1803.03635)","url":"https://arxiv.org/abs/1803.03635"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"}],"status":"active"},{"id":"Q-184","category":6,"question":"量子化とエッジAIに関する説明として、最も適切なものはどれか。","choices":["量子化は重みなどを少ないビット数の整数などで表してモデルを小さく速くする方法で、スマートフォンなどの端末で推論するエッジAIに役立つ","量子化は重みを必ず64ビットの浮動小数点数に変換して、モデルを大きくする方法である","エッジAIとは、すべての推論をデータセンターの大規模なサーバーで行い、端末では一切計算しない方式のことである","モデルを軽量化すると、必ず精度が大きく下がるため、エッジAIでは軽量化は行わない"],"answer":0,"explanation":"・量子化: モデルの重みや計算の値を、32ビットの浮動小数点数ではなく、8ビットの整数のような少ないビット数で表す方法です。モデルの大きさを小さくし、整数だけの計算で推論できるようにすることで、計算を速くし、消費電力も減らせます。学習の方法を工夫して、量子化した後も精度を保つ手法も提案されています。\n・エッジAI: スマートフォンや家電、自動車などの端末（エッジ）の側でAIの推論を行う方式です。通信の遅れがなく、データを外部に送らずに済むといった利点がありますが、端末の計算資源は限られるため、モデルを小さく速くする必要があります。\nプルーニング、量子化、ハフマン符号化を組み合わせてモデルの容量を35〜49分の1にした「Deep Compression」のように、複数の軽量化（モデル圧縮）の手法を組み合わせることもあります。\n量子化はビット数を減らしてモデルを小さくします。\nエッジAIは端末側で推論します。\n工夫すれば、精度をほぼ保ったまま軽量化できます。","sources":[{"title":"Benoit Jacob ほか \"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference\" (arXiv:1712.05877)","url":"https://arxiv.org/abs/1712.05877"},{"title":"Song Han ほか \"Deep Compression: Compressing Deep Neural Networks with Pruning, Trained Quantization and Huffman Coding\" (arXiv:1510.00149)","url":"https://arxiv.org/abs/1510.00149"},{"title":"Andrew G. Howard ほか \"MobileNets\" (arXiv:1704.04861)","url":"https://arxiv.org/abs/1704.04861"}],"status":"active"},{"id":"Q-185","category":7,"question":"データ分析のプロセスモデルであるCRISP-DMと、それを機械学習向けに拡張したCRISP-ML(Q)に関する説明として、最も適切なものはどれか。","choices":["CRISP-DMはビジネス理解から展開までの段階からなり、CRISP-ML(Q)は展開後の監視と保守の段階を加えている","CRISP-DMは展開後の監視と保守を中心とするモデルで、ビジネス理解の段階は含まれていない","CRISP-ML(Q)は、品質保証の考え方を取り除き、モデルの作成だけに絞ったプロセスモデルである","CRISP-DMもCRISP-ML(Q)も、プロジェクトを一度だけ進めて終わる一方向の手順である"],"answer":0,"explanation":"CRISP-DM（Cross-Industry Standard Process for Data Mining）は、データマイニングのプロジェクトの進め方を示したプロセスモデルで、産業界で事実上の標準とされてきました。ビジネス理解、データ理解、データ準備、モデリング、評価、展開（デプロイ）の段階からなり、必要に応じて前の段階に戻りながら進めます。\nCRISP-ML(Q)は、CRISP-DMを機械学習のアプリケーション向けに拡張したプロセスモデルです。データが使えるかどうかがプロジェクトの実現可能性を左右することが多いため、ビジネス理解とデータ理解を1つの段階にまとめています。また、環境の変化によってモデルの性能が下がる危険があるため、展開した後の監視と保守の段階を加えました。各段階には、品質を保証するための方法も示しています。\nCRISP-DMにはビジネス理解の段階があります。\nCRISP-ML(Q)は品質保証を重視しています。\nどちらも、段階を行き来しながら進めるモデルです。","sources":[{"title":"Stefan Studer ほか \"Towards CRISP-ML(Q): A Machine Learning Process Model with Quality Assurance Methodology\" (arXiv:2003.05155)","url":"https://arxiv.org/abs/2003.05155"}],"status":"active"},{"id":"Q-186","category":7,"question":"MLOpsの説明として、最も適切なものはどれか。","choices":["機械学習の製品を開発して本番の環境に素早く届け、自動化して運用し続けるための考え方や実践の集まり","機械学習のモデルを一度作ったら、その後は性能を確認せずに使い続けるための運用の方針","機械学習の研究論文を書くときの、文章の書き方についての決まりごと","データサイエンティストだけで完結し、開発や運用の担当者とは関わらない作業の進め方"],"answer":0,"explanation":"産業界の機械学習のプロジェクトの最終的な目標は、機械学習の製品を開発し、素早く本番の環境で使えるようにすることです。しかし、機械学習の製品を自動化して運用することは非常に難しく、多くのプロジェクトが期待どおりの成果を出せていません。\nMLOps（Machine Learning Operations）は、この課題に取り組むための考え方で、ベストプラクティス、概念、開発の文化などを含みます。機械学習のモデルの開発から、本番環境への展開、運用までを自動化し、継続的に回していくことを目指します。展開後も、環境の変化でモデルの性能が下がっていないかを監視し、必要に応じて再学習することが重要です。\n一度作ったら確認せずに使い続けるのは、MLOpsの考え方と逆です。\n論文の書き方の決まりではありません。\nMLOpsは、データサイエンティスト、開発者、運用者などが協力して進めるものです。","sources":[{"title":"Dominik Kreuzberger ほか \"Machine Learning Operations (MLOps): Overview, Definition, and Architecture\" (arXiv:2205.02302)","url":"https://arxiv.org/abs/2205.02302"},{"title":"Stefan Studer ほか \"Towards CRISP-ML(Q): A Machine Learning Process Model with Quality Assurance Methodology\" (arXiv:2003.05155)","url":"https://arxiv.org/abs/2003.05155"}],"status":"active"},{"id":"Q-187","category":7,"question":"経済産業省の「AI・データの利用に関する契約ガイドライン（AI編）」が推奨する「探索的段階型」の開発方式の段階の順番として、正しいものはどれか。","choices":["アセスメント → PoC → 開発 → 追加学習","PoC → 開発 → アセスメント → 追加学習","開発 → アセスメント → 追加学習 → PoC","追加学習 → 開発 → PoC → アセスメント"],"answer":0,"explanation":"学習済みモデルの開発は、契約の時点では何ができあがるかを予測しにくく、試行錯誤が欠かせないため、経済産業省の契約ガイドライン（AI編）は、段階を分けて進める「探索的段階型」の開発方式を推奨しています。\n① アセスメント: 一定量のデータを使って、学習済みモデルを作れる可能性があるかを事前に検証します。成果物はレポートなど、契約は秘密保持契約などです。\n② PoC（概念実証）: 学習用データを使って、ユーザが希望する精度の学習済みモデルを作れるかを検証します。成果物はレポートやパイロット版のモデルなど、契約は導入検証契約などです。\n③ 開発: 学習済みモデルを作ります。契約はソフトウェア開発契約です。\n④ 追加学習: 納品した学習済みモデルに、追加の学習用データで学習させます。\n各段階は必ずしも明確に分かれるものではなく、1つの段階を何回かに分けて行うこともあります。アセスメント段階で成功の見込みがないとわかれば、そこで終えることもあります。","sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"status":"active"},{"id":"Q-188","category":7,"question":"ソフトウェアの開発方式に関する説明として、最も適切なものはどれか。","choices":["ウォーターフォール型は工程を順に詳細化し、アジャイル型は優先度の高い機能から短い期間で開発を繰り返す","ウォーターフォール型は短い期間で開発とリリースを何度も繰り返し、アジャイル型は仕様を最初にすべて固める","ウォーターフォール型は、開発の途中で仕様を変更しやすいことが最大の特徴である","学習済みモデルの開発には、試行錯誤が不要なため、ウォーターフォール型が最も適している"],"answer":0,"explanation":"・ウォーターフォール型: 開発の過程を「要件定義」「システム設計」「プログラミング」「テスト」などの工程に分け、前の工程の結果をもとに次の工程を詳細化していく方式です。仕様を開発の初期に確定するため、後から仕様を変えるのは難しいことが多い方式です。\n・アジャイル型: ウォーターフォール型に当てはまらない開発方式（非ウォーターフォール型）の代表で、顧客の要求に応じて優先度の高い機能から、要求・開発・テスト・リリースを短い期間で繰り返しながら、動くソフトウェアを作り上げていきます。\n経済産業省の契約ガイドライン（AI編）は、学習済みモデルの開発は、何ができあがるかを事前に予測しにくく、試行錯誤を何度も重ねる必要があり、後戻りが避けられないため、あらかじめ確定した要件定義を前提とするウォーターフォール型は実態に合わない場合が多く、非ウォーターフォール型の開発が適していると述べています。\nウォーターフォール型とアジャイル型の説明が入れ替わっている選択肢は誤りです。","sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"status":"active"},{"id":"Q-189","category":7,"question":"AIプロジェクトの初期段階（アセスメント段階）で重要なこととして、最も適切なものはどれか。","choices":["AIで何を解決したいのかという事業上の課題を設定し、達成を評価する指標（KPI）を明確にすること","課題を決めずに「とりあえずAIを導入したい」という方針で、まずモデルの開発を委託すること","事業上の課題の設定はすべてベンダに任せ、ユーザは関わらないようにすること","データの有無を確かめずに、まず大規模なシステムの開発契約を結んでしまうこと"],"answer":0,"explanation":"経済産業省の契約ガイドライン（AI編）は、アセスメント段階でまず重要なのは、ユーザがAIの導入で何を解決したいのか、つまり課題を設定することだと述べています。AIへの理解不足や過度な期待から、「とりあえずAIを導入したい」という漠然とした問題意識だけで開発を委託するケースが少なくありませんが、AIはあくまで道具にすぎず、重要なのはそれを使ってどのような事業上の課題を解決するかという視点です。\nまた、課題がどのような場合に達成できたと評価するか、つまり評価の指標（KPI）を設定できる場合は、それを明確にすることも重要です。課題が明らかになって初めて、どのようなデータが必要か、足りているか、集められるかをユーザとベンダで検討できます。\n課題やKPIの設定は事業の内容によるため、ユーザが責任を持って行い、ベンダがそれを支援する役割分担が実情に合うとされています。学習済みモデルの開発には、ユーザ（利害関係者）の積極的な関与が欠かせません。","sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）第4 3（開発方式）pp.41-46","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"status":"active"},{"id":"Q-190","category":7,"question":"機械学習における「データリーケージ」の説明として、最も適切なものはどれか。","choices":["予測の時点では手に入らないはずの情報がモデルの作成に使われ、評価が実際より良く見えてしまうこと","学習データの一部が外部の攻撃者に盗まれ、インターネット上に流出してしまう情報漏えいのこと","モデルの学習中に、計算機のメモリが足りなくなって学習が途中で止まってしまうこと","学習データの件数が少なすぎるため、モデルが学習データを覚えられないこと"],"answer":0,"explanation":"データリーケージ（データ漏洩）は、予測を行う時点では手に入らないはずの情報が、モデルを作るときに使われてしまうことです。その結果、交差検証などの評価の結果が実際より楽観的になり、本番の環境で本当に新しいデータを予測するときには、性能が低くなってしまいます。\nよくある原因は、学習用のデータとテスト用のデータを分けずに扱うことです。テスト用のデータは、モデルについての判断に使ってはいけません。例えば、前処理（標準化など）の統計量を、テスト用のデータも含めた全体から計算してしまうと、テスト用のデータの情報が学習に漏れてしまいます。\n言葉が似ていますが、外部への情報流出（情報漏えい）とは別の意味です。\nメモリ不足やデータ不足のことではありません。","sources":[{"title":"scikit-learn User Guide 11. Common pitfalls and recommended practices（Data leakage）","url":"https://scikit-learn.org/stable/common_pitfalls.html"}],"status":"active"},{"id":"Q-191","category":7,"question":"機械学習のためのデータに関する用語の説明として、最も適切なものはどれか。","choices":["アノテーションは学習用データに正解のラベルを付ける作業で、コーパスは言語の研究や処理のために集めたテキストの集まりである","アノテーションは学習済みのモデルを圧縮する作業で、コーパスは画像だけを集めたデータの集まりである","オープンデータセットは、特定の企業の社員だけが使える、外部には一切公開されないデータのことである","コーパスは、学習用データから個人を特定できる情報を取り除く作業のことである"],"answer":0,"explanation":"・アノテーション: 学習用データに、正解のラベル（例: この画像は「ネコ」）を付ける作業です。教師あり学習には欠かせませんが、手間がかかるため、データ活用の難しさの一因になります。\n・コーパス: 言語の研究や自然言語処理のために集めた、1つまたは複数の言語のテキストの集まりです。統計的機械翻訳などでは、対訳のコーパスが使われます。\n・オープンデータセット: 誰でも利用できるように公開されているデータセットです。画像認識のImageNetや、手書き数字のMNISTなどがあり、機械学習の研究や開発に広く使われています。ただし、利用条件（ライセンス）を確認して使う必要があります。\nまた、機械学習に使うデータは、そのままでは使えないことが多く、不要なものを取り除くクレンジングや、データを増やすデータ拡張などの前処理が必要になります。\nアノテーションはモデルの圧縮ではなく、コーパスは画像のデータではありません。\nオープンデータセットは公開されたデータです。","sources":[{"title":"総務省 令和元年版 情報通信白書「AIに関する基本的な仕組み」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r01/html/nd113210.html"},{"title":"内山将夫（情報通信研究機構）「コーパスベースの機械翻訳」","url":"https://www2.nict.go.jp/astrec-att/member/mutiyama/corpmt/cbmt.pdf"}],"status":"active"},{"id":"Q-192","category":7,"question":"Dockerの説明として、最も適切なものはどれか。","choices":["アプリケーションを実行環境ごとコンテナという隔離された環境にまとめ、開発・配布・実行しやすくする仕組み","機械学習のモデルの精度を自動で上げるための、学習アルゴリズムの一種である","文章や画像を生成するための、大規模な事前学習済みのモデルの名前である","データに正解のラベルを付けるための、アノテーション専用の表計算ソフトである"],"answer":0,"explanation":"Dockerは、アプリケーションを開発し、届け（配布し）、実行するためのオープンなプラットフォームです。アプリケーションを、それが動くための環境ごと「コンテナ」と呼ばれる、ほかから緩やかに隔離された環境にまとめて実行します。コンテナは、イメージ（環境の設計図）から作られる実行中のインスタンスで、1台の計算機の上で多数のコンテナを同時に動かせます。\nアプリケーションを動かす環境の違いによる問題を減らし、開発した環境と同じ状態で本番の環境でも動かしやすくなるため、コードを書いてから本番で動かすまでの時間を大きく短くできます。機械学習のモデルの開発や展開でも、ライブラリのバージョンなどの環境をそろえるためによく使われます。\n学習アルゴリズム、生成モデル、アノテーションのソフトではありません。","sources":[{"title":"Docker Docs \"What is Docker?\"（Apache License 2.0）","url":"https://docs.docker.com/get-started/docker-overview/"}],"status":"active"},{"id":"Q-193","category":7,"question":"データ分析や機械学習の開発で使われるJupyter NotebookとPythonに関する説明として、最も適切なものはどれか。","choices":["Jupyter Notebookはコードと説明、結果の図を1つの文書にまとめられ、Pythonは学びやすい言語である","Jupyter Notebookは紙のノートのことで、コンピュータのプログラムとは関係がない","Pythonは、機械学習のモデルを動かすための専用の計算機の名前である","Jupyter Notebookでは、プログラムを実行することはできず、文章を書くことしかできない"],"answer":0,"explanation":"・Jupyter Notebook: コンピュータのコード、普通の言葉による説明、データ、グラフなどの可視化、対話的な操作部品を、1つの共有できる文書（ノートブック）にまとめられるウェブベースのアプリケーションです。コードを少しずつ実行して結果をすぐに確かめられるため、試作やデータ分析、機械学習の実験に広く使われています。後継のJupyterLabもあります。\n・Python: 学びやすく、強力なプログラミング言語です。文法が簡潔で、インタプリタ型であることから、多くの分野で素早くアプリケーションを作るのに向いています。機械学習やデータ分析のライブラリ（scikit-learn、PyTorchなど）が豊富で、AIの開発で最もよく使われる言語の一つです。\nJupyter Notebookはプログラムを実行できるツールで、Pythonは計算機ではなくプログラミング言語です。","sources":[{"title":"Project Jupyter Documentation","url":"https://docs.jupyter.org/en/latest/"},{"title":"Python Documentation \"The Python Tutorial\"","url":"https://docs.python.org/3/tutorial/index.html"}],"status":"active"},{"id":"Q-194","category":7,"question":"Web APIとクラウドに関する説明として、最も適切なものはどれか。","choices":["APIは複雑な機能を簡単に使えるようにする窓口で、クラウドはネットワークを通じて共有の計算資源を必要なときに使えるようにする仕組みである","APIは、コンピュータの部品を物理的につなぐケーブルの規格で、ソフトウェアとは関係がない","クラウドは、すべての計算資源を自社の建物の中にだけ置き、ネットワークは一切使わない仕組みである","Web APIを使うと、提供されている機能を使うたびに、その機能のプログラムをすべて自分で書き直す必要がある"],"answer":0,"explanation":"・API（Application Programming Interface）: 開発者が複雑な機能を簡単に使えるように用意された仕組み（窓口）です。複雑な処理の中身を隠し、より簡単な呼び出し方を提供します。家の電化製品を、電線に直接つながずにコンセントに差すだけで使えるのに似ています。ネットワークを通じて呼び出せるものはWeb APIと呼ばれ、AIの機能（画像認識、翻訳など）をサービスとして提供するのにもよく使われます。\n・クラウド（クラウドコンピューティング）: 米国立標準技術研究所（NIST）の定義では、ネットワーク、サーバー、ストレージ、アプリケーションなどの共有の計算資源の集まりに、ネットワークを通じていつでも便利に必要なときにアクセスでき、最小限の管理の手間ですばやく使い始めたり、やめたりできるようにするモデルです。5つの本質的な特徴、3つのサービスモデル、4つの配備モデルからなります。深層学習の大量の計算にも、クラウドのGPUなどがよく使われます。\nAPIはソフトウェアの仕組みで、クラウドはネットワークを通じて計算資源を使う仕組みです。\nAPIを使えば、機能のプログラムを自分で書く必要はありません。","sources":[{"title":"MDN Web Docs \"Introduction to web APIs\"（CC BY-SA 2.5）","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Client-side_APIs/Introduction"},{"title":"NIST SP 800-145 \"The NIST Definition of Cloud Computing\"","url":"https://csrc.nist.gov/pubs/sp/800/145/final"}],"status":"active"},{"id":"Q-195","category":7,"question":"AIのビジネス活用を進めるための連携に関する説明として、最も適切なものはどれか。","choices":["外部の知識や技術、社外の人材を取り込むオープン・イノベーションが期待されている","AIの開発は、自社の中だけで完結させる「自前主義」を徹底することが、最も望ましいとされている","大学や研究機関との連携（産学連携）は、AIの分野では認められていない","AIの導入は、他企業や他業種と一切情報を交換せずに進めることが推奨されている"],"answer":0,"explanation":"情報通信白書は、新たな技術を介して産業や分野を越えて需要者と供給者のビジネスを結び付けるには、企業の枠を超えた新規事業の開発や、高度な専門スキルを持つ社外の人材の起用など、いわゆる「オープン・イノベーション」の推進が期待されると述べています。産業界でも、自前主義を脱却した本格的なオープン・イノベーションの取組が進みつつあり、ベンチャー企業との連携（産産連携）なども重視されています。\nAIの開発には、データ、専門的な技術、人材、業務の知識など、多くの要素が必要です。大学や研究機関との産学連携や、他企業・他業種との連携によって、自社だけでは得られない知識や技術を取り込むことができます。\n自前主義の徹底が最も望ましいわけではありません。\n産学連携はAIの分野でも活発に行われています。","sources":[{"title":"総務省 平成29年版 情報通信白書「オープンイノベーションの進展」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h29/html/nc131220.html"}],"status":"active"},{"id":"Q-196","category":7,"question":"業務にAIなどのデジタル技術を導入する際の「BPR（ビジネス・プロセス・リエンジニアリング、業務改革）」の考え方として、最も適切なものはどれか。","choices":["一部の業務をデジタル化するだけでなく、利用者の目線で業務のやり方そのものを見直し、つくり直す","今の業務の手順を一切変えずに、その一部をそのままAIに置き換えることだけを目指す","新しい技術は導入せず、紙の書類を増やして業務の確認を厳しくする取り組みのことである","業務の手順を見直す前に、まず最新のAIを購入することを最優先にする考え方である"],"answer":0,"explanation":"BPR（ビジネス・プロセス・リエンジニアリング、業務改革）は、業務の内容や手順（業務プロセス）を根本から見直し、つくり直す取り組みです。\n総務省の「自治体DX全体手順書」では、DXでは単に新しい技術を導入するのではなく、デジタル技術やデータも活用して、個別の業務プロセスの一部のデジタル化にとどまらず、利用者の目線で業務の効率化や改善を行うことが求められるとしています。国の方針でも「サービスデザイン・業務改革（BPR）の徹底」が掲げられ、「利用者のニーズから出発する」「情報システムではなくサービスを作る」などの考え方が示されています。\nAIの導入でも、今の業務の一部をそのまま置き換えるだけでは効果が限られることがあり、業務全体の流れを見直すことが重要です。\n手順を変えずに一部を置き換えるだけ、紙を増やす、技術の購入を最優先にする、といった考え方ではありません。","sources":[{"title":"総務省「自治体DX全体手順書【第4.0版】」（2025年3月）pp.6-7","url":"https://www.soumu.go.jp/main_content/000944054.pdf"}],"status":"active"},{"id":"Q-197","category":7,"question":"情報通信白書が示す、日本企業がAIの導入にあたって課題と感じている点として、最も適切なものはどれか。","choices":["AIの導入による効果が不透明であることや、AIの導入を先導する組織・人材が不足していること","AIの導入による効果がすでに完全に明らかで、検討すべき課題は一つもないこと","AIを導入すると、必ずすべての業務の人手が不要になってしまうこと","AIに関する人材が余っており、社内で担当する仕事が見つからないこと"],"answer":0,"explanation":"平成30年版情報通信白書によると、企業がAIの導入にあたって課題と感じている点としては、「AIの分析結果を担保できない」「有用な結果が得られるか不明」など、AIの導入による効果が不透明であるという回答が多くなっています。その背景として、AIの普及がまだ初期の段階にあることが挙げられています。\nまた、日本企業では、「AIの導入を先導する組織・人材の不足」という回答が、他国の企業と比べて高いという特徴があります。データを分析してビジネスの課題の解決に生かすデータサイエンティストのような、AIの活用を担う人材の確保・育成が重要になります。\nこうした課題があるため、アセスメントやPoCで効果を段階的に確かめながら進めることや、社内外の人材の育成・活用が重要になります。\n効果が完全に明らかというわけではありません。\n人材は不足しており、余っているわけではありません。","sources":[{"title":"総務省 平成30年版 情報通信白書「AI・IoTの導入にあたっての課題」","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h30/html/nd132220.html"}],"status":"active"},{"id":"Q-198","category":8,"question":"次の5つのデータの中央値として、正しいものはどれか。\n3、5、5、7、100","choices":["5","24","7","3"],"answer":0,"explanation":"中央値は、データを小さい順に並べたときに真ん中にくる値です。データの個数が奇数のときは真ん中の値、偶数のときは真ん中の2つの値の平均になります。\nこのデータは小さい順に 3、5、5、7、100 と並んでいて、5個なので、3番目の値の 5 が中央値です。\n24 は平均値です。（3 + 5 + 5 + 7 + 100）÷ 5 = 120 ÷ 5 = 24 です。\n最も多く現れる値（最頻値）も 5 です。\nこの例のように、100 という他から大きく離れた値（外れ値）があると、平均値は大きく引っ張られますが、中央値や最頻値はほとんど影響を受けません。","sources":[{"title":"総務省統計局「なるほど統計学園」中心的な傾向を捉える","url":"https://www.stat.go.jp/naruhodo/5_tokucho/chushin.html"}],"status":"active"},{"id":"Q-199","category":8,"question":"データの代表値（平均値、中央値、最頻値）に関する説明として、最も適切なものはどれか。","choices":["外れ値が加わったとき、3つの中で最も大きく影響を受けやすいのは平均値である","外れ値が加わったとき、3つの中で最も大きく影響を受けやすいのは最頻値である","中央値は、データの中で最も多く現れる値のことである","最頻値は、すべてのデータの値を足して、データの個数で割った値のことである"],"answer":0,"explanation":"代表値は、データの集団の中心的な傾向を表す値です。\n・平均値（算術平均）: すべてのデータの値の合計を、データの個数で割った値です。\n・中央値（メディアン）: データを小さい順に並べたときに真ん中にくる値です。\n・最頻値（モード）: 最も多く現れる値（度数が最も多い値）です。\n3つの違いが最もはっきり出るのは、外れ値（他の多くのデータから大きく離れた値）の影響です。平均値はすべての値を使って計算するため、外れ値の影響を最も受けやすくなります。中央値は並べたときの真ん中の値なので、外れ値が加わっても多くの場合あまり影響を受けません。最頻値は最も多く現れる値なので、外れ値の影響はほとんど受けません。そのため、分布の形によっては、中央値や最頻値を代表値として使います。\n中央値と最頻値、最頻値と平均値の説明が入れ替わっている選択肢は誤りです。","sources":[{"title":"総務省統計局「なるほど統計学園」中心的な傾向を捉える","url":"https://www.stat.go.jp/naruhodo/5_tokucho/chushin.html"}],"status":"active"},{"id":"Q-200","category":8,"question":"次の4つのデータの分散として、正しいものはどれか。ここで分散は、各データと平均との差（偏差）を2乗した値の平均とする。\n2、4、6、8","choices":["5","20","10","0"],"answer":0,"explanation":"分散は、データの散らばりの大きさを表す値で、各データと平均値との差（偏差）を2乗した値の平均です。\n平均は（2 + 4 + 6 + 8）÷ 4 = 5 です。偏差はそれぞれ −3、−1、1、3 で、2乗すると 9、1、1、9 になります。その合計（偏差二乗和）は 20 で、これを個数の 4 で割った 5 が分散です。\n20 は偏差二乗和で、個数で割る前の値です。\n10 は偏差二乗和を2で割った値で、分散ではありません。\nなお、分散の正の平方根を標準偏差といい、この例では √5（約2.24）です。標準偏差は元のデータと単位がそろうため、散らばりの程度を表すのによく使われます。\n偏差をそのまま足すと、正と負が打ち消し合って 0 になるため、2乗してから平均します。","sources":[{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"}],"status":"active"},{"id":"Q-201","category":8,"question":"度数分布とヒストグラムに関する説明として、最も適切なものはどれか。","choices":["データを階級に分けて度数を数えたものが度数分布で、それを柱状のグラフにしたものがヒストグラムである","ヒストグラムは、時間の経過に沿ったデータの変化を線でつないで表すグラフである","ヒストグラムは、全体に対する各項目の割合を円の中の扇形の大きさで表すグラフである","度数分布は、2つの変数の関係を点の散らばりで表したものである"],"answer":0,"explanation":"度数分布は、量的なデータをいくつかの区間（階級）に分け、それぞれの階級に含まれるデータの数（度数）を数えたものです。それを表にしたものを度数分布表といいます。\nヒストグラムは、度数分布を柱状のグラフで表したもので、横軸に階級、縦軸に度数をとります。データの分布の様子（どのあたりに多く集まっているか、左右対称か、偏っているかなど）を見るのに使われます。階級の数は5〜10くらいから試して、分布の様子が見やすいように調整します。\n時間に沿った変化を線で表すのは折れ線グラフ、割合を扇形で表すのは円グラフ、2つの変数の関係を点で表すのは散布図です。","sources":[{"title":"総務省統計局「なるほど統計学園」ヒストグラム","url":"https://www.stat.go.jp/naruhodo/4_graph/shokyu/histogram.html"}],"status":"active"},{"id":"Q-202","category":8,"question":"相関係数に関する説明として、最も適切なものはどれか。","choices":["−1から1までの値をとり、2つの変数の共分散を、それぞれの標準偏差の積で割って求める","0から100までの値をとり、2つの変数の平均値の差を百分率で表したものである","相関係数が0であれば、2つの変数の間には、どのような関係も絶対にないといえる","相関係数が1に近ければ、一方の変数が他方の変数の原因であると必ずいえる"],"answer":0,"explanation":"相関係数は、2つの変数が比例的な（直線的な）関係をどれだけ持っているかを表す値で、−1から1までの値をとります。正の相関が強いほど1に近づき、負の相関が強いほど−1に近づき、0の付近は相関がないことを表します。2つの変数 x と y の共分散を、x の標準偏差と y の標準偏差の積で割って求めます。共分散は、2つの変数が一緒にどう変化するかを表し、同じ方向に動く傾向があれば正、逆の方向に動く傾向があれば負になります。\n相関係数は比例的な関係の強さを表す指標なので、相関係数が0でも、曲線的な関係など、何らかの関係がある場合があります。\nまた、相関係数が1や−1に近くても、それだけで因果関係があるとはいえません。まったく関係のない変数でも、偶然に相関があるように見えることがあります（見せかけの相関）。散布図を作って、データの様子を目で確かめることも大切です。","sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"}],"status":"active"},{"id":"Q-203","category":8,"question":"「アイスクリームの売上と水難事故の件数には正の相関がある」というデータについての解釈として、最も適切なものはどれか。","choices":["気温のような第3の変数が2つの変数に影響している可能性があり、その影響を除いた偏相関係数などで確かめる必要がある","アイスクリームを食べると水難事故が起きやすくなるという因果関係が、このデータだけで証明された","相関係数が正であれば、2つの変数の間には必ず直接の因果関係があると判断してよい","水難事故を減らすためには、アイスクリームの販売を禁止することが最も効果的である"],"answer":0,"explanation":"2つの変数に相関があっても、一方が他方の原因であるとは限りません。この例では、気温が高い日にはアイスクリームがよく売れ、同時に海や川で泳ぐ人が増えて水難事故も増える、というように、気温という第3の変数が2つの変数に影響している可能性があります。このように、直接の関係がないのに相関があるように見えることを、見せかけの相関（疑似相関）といいます。\nこのような場合には、第3の変数の影響を取り除いた（その変数を固定した）うえで2つの変数の関係を測る偏相関係数を使ったり、データの背景を検討したりして、関係を確かめる必要があります。\n相関だけでは因果関係は証明できません。\n因果関係が確かめられていないのに販売を禁止しても、事故は減らない可能性があります。","sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"},{"title":"\"Bayes Factor Functions for Testing Partial Correlation Coefficients\" (arXiv:2503.10787)","url":"https://arxiv.org/abs/2503.10787"}],"status":"active"},{"id":"Q-204","category":8,"question":"ある店の月ごとの売上が、1月 10、2月 20、3月 30、4月 40 だった。3月を中心とした3か月の中央移動平均（2月・3月・4月の平均）として、正しいものはどれか。","choices":["30","25","20","90"],"answer":0,"explanation":"移動平均は、時系列データのある時点の値の代わりに、その時点を含む一定期間の平均値を使う方法です。細かな変動をならして、全体の傾向をとらえやすくします。その月と前後の月の平均を使うものを中央移動平均といいます。\n3月を中心とした3か月の中央移動平均は、2月・3月・4月の売上の平均で、（20 + 30 + 40）÷ 3 = 90 ÷ 3 = 30 です。\n25 は1月から4月の4か月の平均、20 は1月・2月・3月の平均（2月を中心とした移動平均）、90 は3か月の合計です。\n移動平均は、季節による変動をならして傾向を見る方法（季節調整）の一つとしても使われます。","sources":[{"title":"総務省統計局「なるほど統計学園」その他のデータ分析手法","url":"https://www.stat.go.jp/naruhodo/10_tokucho/sonota.html"}],"status":"active"},{"id":"Q-205","category":8,"question":"回帰分析で使われる最小二乗法の説明として、最も適切なものはどれか。","choices":["実際の値と予測値の差（残差）を2乗して合計した値が最も小さくなるように、回帰式を決める方法","実際の値と予測値の差をそのまま合計した値が、ちょうど0になるように回帰式を決める方法","予測値が実際の値を必ず上回るように、回帰式をできるだけ上に引く方法","データの中で最も大きい値と最も小さい値の2点だけを結んで、回帰式を決める方法"],"answer":0,"explanation":"回帰分析は、複数の変数の関係を最もよく表す線（回帰直線など）を求めて数式にする分析手法です。回帰直線は「散布図の各点の真ん中を通る線」とイメージでき、実際の値（実測値）と回帰直線上の値（予測値）の差を誤差（残差）といいます。\n最小二乗法は、残差を2乗して合計した値（残差平方和）が最も小さくなるように、回帰式の係数を決める方法です。残差をそのまま足すと、正と負が打ち消し合ってしまうため、2乗してから合計します。線形回帰の代表的な求め方です。\n残差をそのまま合計する方法、予測値を上に偏らせる方法、2点だけで決める方法ではありません。","sources":[{"title":"総務省統計局「なるほど統計学園」複数の変数の関係性を見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/hukusu.html"},{"title":"scikit-learn User Guide 1.1 Linear Models（Ordinary Least Squares）","url":"https://scikit-learn.org/stable/modules/linear_model.html"}],"status":"active"},{"id":"Q-206","category":8,"question":"統計的仮説検定に関する説明として、最も適切なものはどれか。","choices":["確かめたい仮説（対立仮説）と反対の仮説（帰無仮説）を立て、帰無仮説のもとで結果がまれにしか起きないなら帰無仮説を棄却する","確かめたい仮説を帰無仮説とし、それが正しいことを直接証明するために検定を行う","有意水準とは、帰無仮説が正しいと判断するための基準の確率で、通常は0.95や0.99が使われる","仮説検定では、データを集める前に結論を決めておき、データはその結論を補強するためだけに使う"],"answer":0,"explanation":"統計的仮説検定では、まず確かめたい主張を対立仮説とし、それと反対の仮説を帰無仮説として立てます。例えば「公表されている重さと違うのではないか」を確かめたいなら、「公表どおりの重さである」を帰無仮説にします。\n次に、帰無仮説を棄却する（誤りと判断する）基準の確率である有意水準を決めます。0.05（5%）や0.01（1%）がよく使われます。データから計算した結果が、帰無仮説が正しいとしたときに有意水準以下の確率でしか起きない、非常にまれなことであれば、帰無仮説を棄却し、対立仮説を採択します。\n確かめたい仮説は対立仮説のほうで、帰無仮説を直接証明するものではありません。\n有意水準は帰無仮説を棄却する基準で、0.05や0.01が多く使われます。\n結論を先に決めてデータで補強するのは、仮説検定の考え方ではありません。","sources":[{"title":"総務省統計局「なるほど統計学園」統計的推定と統計的仮説検定","url":"https://www.stat.go.jp/naruhodo/11_tokusei/kentei.html"}],"status":"active"},{"id":"Q-207","category":8,"question":"1から6の目が等しい確率で出るサイコロを1回振ったときに出る目の期待値として、正しいものはどれか。","choices":["3.5","2.5","10.5","21"],"answer":0,"explanation":"サイコロを振ったときに出る目のように、とる値が確率的に決まる変数を確率変数といいます。\n期待値は、確率変数がとる値に、その値をとる確率を掛けて足し合わせた値で、確率変数の平均的な値を表します（連続的な確率変数の場合は、値と確率密度を掛けて積分します）。\nサイコロの目は1〜6の値をそれぞれ1/6の確率でとるので、期待値は\n1 × 1/6 + 2 × 1/6 + 3 × 1/6 + 4 × 1/6 + 5 × 1/6 + 6 × 1/6 = 21 ÷ 6 = 3.5\nです。\n期待値は、実際に出る目（1〜6の整数）である必要はありません。\n21 は目の合計で、10.5 はそれを2で割った値です。","sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（か行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/ka-gyo.html"},{"title":"SciPy Documentation scipy.stats.rv_continuous.expect","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.expect.html"}],"status":"active"},{"id":"Q-208","category":8,"question":"ある会社の社員100人のうち、60人がスマートフォンで社内アプリを使っており、そのうち30人が毎日使っている。社内アプリを使っている社員の中から1人を選んだとき、その人が毎日使っている確率（条件付き確率）として、正しいものはどれか。","choices":["0.5","0.3","0.6","0.18"],"answer":0,"explanation":"条件付き確率 P(B|A) は、「Aが起きたという条件のもとで、Bが起きる確率」で、P(B|A) = P(AかつB) ÷ P(A) で求められます。\nこの問題では、Aを「社内アプリを使っている」、Bを「毎日使っている」とします。P(A) = 60 ÷ 100 = 0.6、P(AかつB) = 30 ÷ 100 = 0.3 なので、\nP(B|A) = 0.3 ÷ 0.6 = 0.5\nです。つまり、使っている60人のうち30人なので、30 ÷ 60 = 0.5 と考えても同じです。\n0.3 は社員全体の中で毎日使っている人の割合 P(AかつB)、0.6 は使っている人の割合 P(A) です。\n条件付き確率は、ベイズの定理の基礎になり、単純ベイズ分類器などの機械学習の手法でも使われます。","sources":[{"title":"scikit-learn User Guide 1.9 Naive Bayes","url":"https://scikit-learn.org/stable/modules/naive_bayes.html"}],"status":"active"},{"id":"Q-209","category":8,"question":"正規分布に関する説明として、最も適切なものはどれか。","choices":["平均値を中心に左右対称の釣鐘の形をした分布で、平均値から離れるほどその値をとる確率（密度）が小さくなる","平均値の片側だけにデータが集まり、左右が大きく非対称になる分布である","サイコロの目のように、決まった有限個の値だけを等しい確率でとる分布である","平均値から離れるほど、その値をとる確率（密度）が大きくなっていく分布である"],"answer":0,"explanation":"正規分布は、データが平均値のまわりに最も多く集まり、平均値から大きい方にも小さい方にも同じように離れるにしたがって少なくなっていく分布です。グラフは平均値を中心に左右対称の釣鐘の形になります。平均と標準偏差（ばらつきの大きさ）の2つで形が決まり、自然や社会の多くの現象の分布を近似するのに使われます。\n連続した値をとる確率変数の分布は、確率密度関数で表します。標準正規分布（平均0、標準偏差1）の確率密度関数は exp(−x²/2) ÷ √(2π) です。\nテストの偏差値は、成績の分布が正規分布であると仮定して、平均が50、標準偏差が10になるように変換した値です。\n片側に偏った分布、有限個の値を等しい確率でとる分布（一様分布の一種）、平均値から離れるほど密度が大きくなる分布は、正規分布ではありません。","sources":[{"title":"総務省統計局「なるほど統計学園」統計用語辞典（さ行）","url":"https://www.stat.go.jp/naruhodo/13_yougo/sa-gyo.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"title":"総務省統計局「なるほど統計学園」データの散らばりを見る","url":"https://www.stat.go.jp/naruhodo/10_tokucho/chirabari.html"}],"status":"active"},{"id":"Q-210","category":8,"question":"表が出る確率が0.5のコインを3回投げたとき、表がちょうど2回出る確率として、正しいものはどれか。","choices":["0.375","0.25","0.5","0.125"],"answer":0,"explanation":"成功（例: 表が出る）の確率が p の試行を独立に n 回行ったときの成功の回数は、二項分布に従います。成功がちょうど k 回になる確率は\nnCk × p^k × (1 − p)^(n−k)\nです（nCk は n 個から k 個を選ぶ組み合わせの数）。\nこの問題では n = 3、k = 2、p = 0.5 なので、\n3C2 × 0.5² × 0.5¹ = 3 × 0.125 = 0.375\nです。表が2回出る並び方は「表表裏」「表裏表」「裏表表」の3通りで、それぞれの確率が 0.5³ = 0.125 だからです。\n0.125 は並び方の1通りだけの確率です。\n1回だけの試行で、成功（1）か失敗（0）かをとる分布をベルヌーイ分布といい、二項分布はベルヌーイ試行を n 回繰り返したときの成功の回数の分布にあたります。","sources":[{"title":"SciPy Documentation scipy.stats.binom","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.binom.html"},{"title":"SciPy Documentation scipy.stats.bernoulli","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bernoulli.html"}],"status":"active"},{"id":"Q-211","category":8,"question":"ポアソン分布の説明として、最も適切なものはどれか。","choices":["一定の時間や範囲の中で、まれな出来事が起きる回数の分布で、平均の回数（μ）だけで形が決まる","連続した値をとり、平均値を中心に左右対称の釣鐘の形になる分布である","1回の試行で成功か失敗のどちらかだけが起きる、2つの値だけをとる分布である","身長や体重のように、負の値もとりうる連続した量の分布である"],"answer":0,"explanation":"ポアソン分布は、一定の時間や範囲の中で、ある出来事が起きる回数（0回、1回、2回…）の分布です。1時間に店に来る客の数、1日に起きる事故の件数のように、起きる確率は小さいものの機会が多い、まれな出来事の回数を表すのに使われます。\n平均の回数 μ だけで形が決まり、ちょうど k 回起きる確率は exp(−μ) × μ^k ÷ k! で表されます。とる値は0以上の整数です。\n左右対称の釣鐘の形の連続した分布は正規分布です。\n成功か失敗の2つの値だけをとる分布はベルヌーイ分布です。\nポアソン分布は回数（0以上の整数）の分布で、負の値はとりません。","sources":[{"title":"SciPy Documentation scipy.stats.poisson","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.poisson.html"},{"title":"SciPy Documentation scipy.stats.norm","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.norm.html"},{"title":"SciPy Documentation scipy.stats.bernoulli","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bernoulli.html"}],"status":"active"},{"id":"Q-212","category":8,"question":"確率分布のパラメータをデータから推定する最尤法（最尤推定）の説明として、最も適切なものはどれか。","choices":["観測されたデータが得られる確率（尤度）が最も大きくなるように、分布のパラメータを決める方法","データの中で最も大きい値を、そのまま分布の平均のパラメータとする方法","データを使わずに、分析者が最も好ましいと考える値をパラメータとする方法","観測されたデータが得られる確率が最も小さくなるように、パラメータを決める方法"],"answer":0,"explanation":"最尤法（最尤推定、Maximum Likelihood Estimation）は、ある確率分布のパラメータ（例: 正規分布の平均と標準偏差）を、観測されたデータから推定する代表的な方法です。「そのパラメータのもとで、実際に観測されたデータが得られる確率（尤度）」を考え、それが最も大きくなるようなパラメータを推定値とします。統計のライブラリで分布をデータに当てはめるときも、標準的に最尤法が使われます。\n最大値をそのまま使う方法や、データを使わない方法ではありません。\n尤度は最大にするもので、最小にするものではありません。","sources":[{"title":"SciPy Documentation scipy.stats.rv_continuous.fit","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.fit.html"}],"status":"active"},{"id":"Q-213","category":8,"question":"相互情報量の説明として、最も適切なものはどれか。","choices":["2つの確率変数の依存の度合いを表す0以上の値で、2つが独立のとき、またそのときに限り0になる","2つの確率変数の平均値の差を表す値で、負の値をとることも多い","2つの確率変数が比例の関係にあるときだけ値が大きくなり、曲線的な関係は捉えられない","1つの確率変数だけのばらつきを表す値で、分散と同じものである"],"answer":0,"explanation":"相互情報量は、2つの確率変数がどれだけ依存し合っているか（一方を知ることで、もう一方についての不確かさがどれだけ減るか）を表す値です。常に0以上の値をとり、2つの確率変数が独立のとき、またそのときに限り0になります。値が大きいほど依存の度合いが大きいことを表します。\n相関係数が比例的な（直線的な）関係しか捉えられないのに対し、相互情報量は曲線的な関係など、より一般的な依存関係も捉えられます。機械学習では、目的変数との関係が深い特徴量を選ぶ（特徴選択）ときなどに使われます。\n平均値の差、比例関係だけを捉える値、1つの変数のばらつきではありません。","sources":[{"title":"scikit-learn API sklearn.feature_selection.mutual_info_classif","url":"https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.mutual_info_classif.html"}],"status":"active"},{"id":"Q-214","category":8,"question":"2次元の平面上の2点 A(1, 2) と B(4, 6) のユークリッド距離として、正しいものはどれか。","choices":["5","7","25","3"],"answer":0,"explanation":"ユークリッド距離は、いわゆる直線距離で、各座標の差を2乗して合計し、その平方根をとって求めます。\nA(1, 2) と B(4, 6) の各座標の差は、x が 4 − 1 = 3、y が 6 − 2 = 4 なので、\n√(3² + 4²) = √(9 + 16) = √25 = 5\nです。\n7 は差の絶対値をそのまま足した値（3 + 4）で、これはマンハッタン距離と呼ばれます。\n25 は平方根をとる前の値です。","sources":[{"title":"SciPy Documentation scipy.spatial.distance.euclidean","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.euclidean.html"},{"title":"SciPy Documentation scipy.spatial.distance.cityblock","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.cityblock.html"}],"status":"active"},{"id":"Q-215","category":8,"question":"コサイン類似度とマハラノビス距離に関する説明として、最も適切なものはどれか。","choices":["コサイン類似度は2つのベクトルの向きの近さを表し、マハラノビス距離はデータの分散や変数間の相関（共分散）を考慮した距離である","コサイン類似度は2つのベクトルの長さの差だけを表し、向きはまったく考慮しない","マハラノビス距離は、変数間の相関を無視して、各座標の差を単純に2乗して足した距離である","コサイン類似度は、2つのベクトルが同じ向きのとき −1 になり、逆向きのとき 1 になる"],"answer":0,"explanation":"・コサイン類似度: 2つのベクトルのなす角のコサインで、2つのベクトルの内積を、それぞれの長さ（ノルム）の積で割って求めます。ベクトルの長さではなく向きの近さを表し、同じ向きなら1、直交すれば0、逆向きなら−1になります。文書や単語のベクトルの類似度を測るのによく使われます。なお、1からコサイン類似度を引いたものをコサイン距離と呼ぶことがあります。\n・マハラノビス距離: データの分散や変数どうしの相関を表す共分散行列を使って計算する距離です。ばらつきの大きい方向の差は小さく、ばらつきの小さい方向の差は大きく評価されるため、データの分布の形を考慮した距離になります。\nコサイン類似度は向きを表します。\n相関を無視して差を2乗して足すのは、ユークリッド距離です。\n同じ向きで1、逆向きで−1です。","sources":[{"title":"SciPy Documentation scipy.spatial.distance.cosine","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.cosine.html"},{"title":"SciPy Documentation scipy.spatial.distance.mahalanobis","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.mahalanobis.html"}],"status":"active"},{"id":"Q-216","category":9,"question":"日本の個人情報保護法における「個人情報」に関する説明として、最も適切なものはどれか。","choices":["顔の特徴を認証のためにデータ化したもののように、特定の個人を識別できる個人識別符号を含む情報は、それだけで個人情報に当たる","亡くなった人に関する情報も、生存する個人に関する情報と同じように、すべて個人情報に当たる","氏名を含まない情報は、他の情報と容易に照合して特定の個人を識別できる場合でも、個人情報に当たらない","会社の名称や所在地などの法人に関する情報は、すべて個人情報に当たる"],"answer":0,"explanation":"個人情報保護法では、「個人情報」を、生存する個人に関する情報で、次のどちらかに当たるものと定めています（第2条第1項）。\n・氏名、生年月日などの記述等によって特定の個人を識別できるもの（他の情報と容易に照合でき、それによって特定の個人を識別できるものを含む）\n・個人識別符号が含まれるもの\n「個人識別符号」は、①顔や指紋などの身体の特徴をコンピュータで使うために変換した符号で本人を識別できるもの、②旅券番号や運転免許証番号のように、個人ごとに割り当てられた番号などのうち、政令で定めるものです（第2条第2項）。個人識別符号を含む情報は、それだけで個人情報になります。\n対象は生存する個人なので、亡くなった人の情報は原則として個人情報に当たりません。\n氏名がなくても、他の情報と容易に照合して特定の個人を識別できれば個人情報です。\n法人そのものの情報は、個人に関する情報ではありません。\nなお、2026年7月に個人情報保護法の改正法が公布されています（2028年7月16日までに施行予定）。この問題は、基準日時点で施行されている条文にもとづいています。","sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true,"status":"active"},{"id":"Q-217","category":9,"question":"個人情報保護法における「個人情報」「個人データ」「保有個人データ」の関係に関する説明として、最も適切なものはどれか。","choices":["個人データは個人情報データベース等を構成する個人情報で、保有個人データは事業者が開示や訂正、消去などを行う権限を持つ個人データである","個人データは個人情報よりも広い概念で、個人情報に当たらない情報もすべて個人データに含まれる","保有個人データは、事業者が外部の委託先から一時的に預かっているだけの個人データのことである","個人情報、個人データ、保有個人データは同じものを指す言葉で、法律上の義務にも違いはない"],"answer":0,"explanation":"個人情報保護法では、次のように範囲の異なる言葉を使い分けています（第16条）。\n・個人情報データベース等: 個人情報を含む情報の集合物で、特定の個人情報をコンピュータで検索できるように体系的に構成したものなど\n・個人データ: 個人情報データベース等を構成する個人情報\n・保有個人データ: 個人情報取扱事業者が、開示、内容の訂正・追加・削除、利用の停止、消去、第三者への提供の停止を行う権限を持つ個人データ（政令で定めるものを除く）\nつまり、個人情報 ⊃ 個人データ ⊃ 保有個人データ という関係になります。義務もこの区分に応じて定められていて、例えば第三者提供の制限は個人データ、本人からの開示請求などは保有個人データが対象です。\n個人データは個人情報の一部です。委託先として預かっているだけで開示などの権限がないものは、委託先にとっての保有個人データには当たりません。\nなお、2026年7月に個人情報保護法の改正法が公布されています（2028年7月16日までに施行予定）。この問題は、基準日時点で施行されている条文にもとづいています。","sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true,"status":"active"},{"id":"Q-218","category":9,"question":"個人情報保護法における「要配慮個人情報」に関する説明として、最も適切なものはどれか。","choices":["本人の病歴や犯罪の経歴などを含む個人情報で、取得するには法令に基づく場合などを除き、あらかじめ本人の同意が必要である","氏名と電話番号だけからなる個人情報のことで、本人の同意がなくても自由に第三者に提供できる","要配慮個人情報は、本人が拒否しない限り提供できるオプトアウトの手続で第三者に提供してよい","個人を識別できないように加工した情報のことで、個人情報には当たらない"],"answer":0,"explanation":"「要配慮個人情報」は、本人の人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実など、本人に対する不当な差別や偏見などの不利益が生じないように、取扱いに特に配慮が必要なものとして政令で定める記述等を含む個人情報です（第2条第3項）。\n個人情報取扱事業者は、法令に基づく場合などの例外を除き、あらかじめ本人の同意を得ないで要配慮個人情報を取得してはいけません（第20条第2項）。また、本人の求めに応じて提供を停止することを条件に同意なしで第三者に提供する「オプトアウト」の手続は、要配慮個人情報には使えません（第27条第2項ただし書）。\n個人を識別できないように加工した情報は、仮名加工情報や匿名加工情報の説明です。\nなお、2026年7月に個人情報保護法の改正法が公布されています（2028年7月16日までに施行予定）。この問題は、基準日時点で施行されている条文にもとづいています。","sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true,"status":"active"},{"id":"Q-219","category":9,"question":"個人情報保護法における「利用目的」に関するルールの説明として、最も適切なものはどれか。","choices":["利用目的はできる限り特定し、取得時は原則として通知か公表をし、目的外の取扱いには原則として本人の同意が必要である","利用目的は事業者の社内で決めておけばよく、本人に通知したり公表したりする必要はまったくない","一度特定した利用目的は、どのような理由や事情があっても、あとから変更することは一切できない","「事業活動に利用するため」のように、利用目的はできるだけ広く抽象的に定めることが求められている"],"answer":0,"explanation":"個人情報保護法では、利用目的について次のようなルールを定めています。\n・個人情報を取り扱うときは、利用目的をできる限り特定しなければならない（第17条第1項）\n・利用目的の変更は、変更前の利用目的と関連性があると合理的に認められる範囲を超えてはならない（第17条第2項）\n・あらかじめ本人の同意を得ないで、特定した利用目的の達成に必要な範囲を超えて個人情報を取り扱ってはならない（第18条第1項。法令に基づく場合などの例外あり）\n・個人情報を取得したときは、あらかじめ利用目的を公表している場合を除き、速やかに本人に通知するか公表しなければならない（第21条第1項）\nそのため、社内で決めるだけでは足りません。変更は一定の範囲で認められます。「できる限り特定」が求められるので、広く抽象的な定め方は趣旨に合いません。\nなお、2026年7月に個人情報保護法の改正法が公布されています（2028年7月16日までに施行予定）。この問題は、基準日時点で施行されている条文にもとづいています。","sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true,"status":"active"},{"id":"Q-220","category":9,"question":"ある会社が、自社の顧客の個人データを使ったAIモデルの開発を外部のベンダに依頼し、その個人データをベンダに渡す。個人情報保護法の考え方として、最も適切なものはどれか。","choices":["利用目的の達成に必要な範囲で個人データの取扱いを委託する場合は、委託先は第三者に当たらないが、委託元は委託先を監督する必要がある","個人データを社外に渡す場合は、委託であっても、すべての本人から必ず事前に同意を得なければならない","委託先に渡した個人データは、委託先が自社の別のサービスのAI学習に自由に使ってよい","AIの開発目的であれば、個人データを誰に提供しても、個人情報保護法の規制はまったく受けない"],"answer":0,"explanation":"個人情報取扱事業者は、法令に基づく場合などの例外を除き、あらかじめ本人の同意を得ないで個人データを第三者に提供してはいけません（第27条第1項）。\nただし、利用目的の達成に必要な範囲内で個人データの取扱いの全部または一部を委託することに伴って個人データを渡す場合は、その委託先は「第三者」に当たらないとされています（第27条第5項第1号）。このとき、委託元は、委託先で個人データが安全に管理されるよう、必要かつ適切な監督をしなければなりません（第25条）。\n経済産業省の「AIの利用・開発に関する契約チェックリスト」も、ベンダによる学習が委託に当たらないと評価される場合には、例外事由に当たらない限り、本人の同意なく個人データを渡すことが個人情報保護法に違反するおそれがあると注意しています。例えば、委託先がその個人データを自社の別のサービスの学習に使うことは、委託の範囲を超えます。\nなお、2026年7月に個人情報保護法の改正法が公布されています（2028年7月16日までに施行予定）。この問題は、基準日時点で施行されている条文にもとづいています。","sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"},{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-221","category":9,"question":"個人情報保護法における「仮名加工情報」と「匿名加工情報」に関する説明として、最も適切なものはどれか。","choices":["仮名加工情報は照合しない限り個人を識別できず、原則として第三者提供が禁止される。匿名加工情報は個人を識別できず復元もできない","仮名加工情報は、氏名などを削除してあるので、本人の同意がなくても自由に第三者に提供してよいとされている","匿名加工情報は、作成した事業者であれば、本人を識別するために他の情報と照合してもよいとされている","匿名加工情報は、必要なときに元の個人情報に復元できるように加工したものでなければならないとされている"],"answer":0,"explanation":"・仮名加工情報: 氏名などの記述の一部や個人識別符号を削除する（元に戻せる規則性のない方法で置き換えることを含む）などの措置をして、他の情報と照合しない限り特定の個人を識別できないように加工した情報です（第2条第5項）。社内での分析などに使うことが想定されていて、仮名加工情報である個人データは、法令に基づく場合を除き第三者に提供してはいけません（第41条第6項）。本人を識別するために他の情報と照合することも禁止されています（第41条第7項）。\n・匿名加工情報: 特定の個人を識別できないように加工し、かつ元の個人情報を復元できないようにした情報です（第2条第6項）。作成したときは、含まれる情報の項目を公表し（第43条第3項）、第三者に提供するときは、項目と提供の方法を公表し、提供先に匿名加工情報であることを明示します（第43条第4項）。この手続により、本人の同意なしで第三者に提供できます。作成した事業者も、本人を識別するために他の情報と照合してはいけません（第43条第5項）。\nなお、2026年7月に個人情報保護法の改正法が公布されています（2028年7月16日までに施行予定）。この問題は、基準日時点で施行されている条文にもとづいています。","sources":[{"title":"e-Gov法令検索「個人情報の保護に関する法律」（平成15年法律第57号）","url":"https://laws.e-gov.go.jp/law/415AC0000000057"}],"timeSensitive":true,"status":"active"},{"id":"Q-222","category":9,"question":"EUの一般データ保護規則（GDPR）に関する説明として、最も適切なものはどれか。","choices":["EU域内に拠点がない事業者でも、EU域内の人に商品やサービスを提供する場合などには、その人の個人データの取扱いにGDPRが適用される","GDPRはEU域内に拠点がある事業者だけに適用され、日本の企業には一切適用されない","GDPRでは、オンライン識別子や位置データは個人データに含まれないとされている","GDPRでは、人間が関与しない自動処理だけによる重要な決定についても、本人を保護する規定は置かれていない"],"answer":0,"explanation":"GDPR（General Data Protection Regulation、一般データ保護規則）は、EUの個人データ保護のルールです。\n・適用範囲: EU域内に拠点がない管理者や処理者でも、EU域内にいる人に商品やサービスを提供する場合（支払いの有無を問わない）や、EU域内での行動を監視する場合には、その人の個人データの取扱いにGDPRが適用されます（第3条第2項）。そのため、日本の企業にも適用されることがあります。\n・個人データ: 識別された、または識別可能な自然人に関するあらゆる情報で、氏名、識別番号、位置データ、オンライン識別子なども識別の手がかりとして挙げられています（第4条第1号）。\n・自動化された意思決定: 本人は、プロファイリングを含む自動処理だけにもとづく決定で、法的な効果などの重大な影響を及ぼすものの対象とされない権利を持ちます（第22条。例外あり）。AIによる審査などに関係する規定です。\nなお、EUは2019年に、日本が十分なレベルの個人データ保護を確保しているとする「十分性認定」を行っています。","sources":[{"title":"EUR-Lex \"Regulation (EU) 2016/679 (General Data Protection Regulation)\"","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679"},{"title":"EUR-Lex \"Commission Implementing Decision (EU) 2019/419\"（日本の十分性認定）","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019D0419"}],"timeSensitive":true,"status":"active"},{"id":"Q-223","category":9,"question":"著作権法における著作物と著作者、AI生成物の関係に関する説明として、最も適切なものはどれか。","choices":["著作物は思想または感情を創作的に表現したもので、AIは法的な人格を持たないため著作者にはならない","AIが自律的に生成したものは、人間の関与がなくても、そのAI自身が著作者として著作権を持つ","著作物として保護されるためには、文化庁への登録などの手続を行うことが必ず必要である","事実のデータやアイデアそのものも、創作的な表現でなくても著作物として保護される"],"answer":0,"explanation":"著作権法は、「著作物」を「思想又は感情を創作的に表現したものであつて、文芸、学術、美術又は音楽の範囲に属するもの」と定めています（第2条第1項第1号）。単なる事実やデータ、表現に至らないアイデアは著作物に当たりません。著作物であるためには、表現に創作性があることが必要です。\n「著作者」は著作物を創作する者です（同項第2号）。文化庁の「AIと著作権に関する考え方について」は、AIは法的な人格を持たないので「創作する者」には当たらず、AI生成物が著作物と認められる場合も、AIを利用して著作物を創作した人が著作者になるとしています。\n著作権は、著作物を創作した時点で発生し（第51条第1項）、登録などの手続は必要ありません（第17条第2項。無方式主義）。","sources":[{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-224","category":9,"question":"文化庁の「AIと著作権に関する考え方について」が示す、AI生成物の著作物性の判断に関する説明として、最も適切なものはどれか。","choices":["生成AIへの指示が表現に至らないアイデアにとどまる場合、そのAI生成物に著作物性は認められないと考えられる","指示の文章が長ければ、その内容がアイデアにとどまっていても、AI生成物に必ず著作物性が認められる","生成を何百回も試行すれば、それだけで創作的寄与があるとして、著作物性が認められる","人間がAI生成物に創作的な加筆や修正を加えても、その部分に著作物性が認められることはない"],"answer":0,"explanation":"文化庁の「AIと著作権に関する考え方について」（令和6年3月）は、AI生成物の著作物性について次のように整理しています。\n・生成AIへの指示が表現に至らないアイデアにとどまる場合には、AI生成物に著作物性は認められないと考えられる\n・著作物性は個別の事例に応じて判断され、単なる労力ではなく、創作的寄与があるといえるものがどの程度積み重なっているかなどを総合的に考慮する\n・判断の要素の例: ①指示・入力（プロンプトなど）の分量と内容（創作的表現を具体的に示す詳細な指示は創作的寄与の可能性を高めるが、長くてもアイデアを示すだけの指示は影響しない）、②生成の試行回数（回数が多いこと自体は影響しないが、生成物を確認して指示を修正しながら繰り返す場合は認められることもある）、③複数の生成物からの選択（単なる選択自体は影響しない）\n・人間がAI生成物に創作的表現といえる加筆・修正を加えた部分には、通常、著作物性が認められる","sources":[{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-225","category":9,"question":"著作権法第30条の4とAIの開発・学習の関係に関する説明として、最も適切なものはどれか。","choices":["享受を目的としない情報解析などの利用は原則として許諾なく行えるが、著作権者の利益を不当に害する場合は除かれる","AI学習の目的であれば、どのような場合でも、著作権者の利益とは関係なく自由に著作物を利用できる","AI学習に著作物を利用するには、必ずすべての著作権者から事前に個別の許諾を得なければならない","学習の目的に、学習データの著作物を人に鑑賞させる享受の目的が含まれていても、第30条の4は適用される"],"answer":0,"explanation":"著作権法第30条の4は、著作物に表現された思想や感情を自ら享受したり他人に享受させたりすることを目的としない場合には、必要と認められる限度で、どのような方法でも著作物を利用できると定めています。その例として「情報解析（大量の情報から要素に係る情報を抽出し、比較、分類その他の解析を行うこと）の用に供する場合」が挙げられています（第2号）。文化庁の「AIと著作権に関する考え方について」は、AI学習のために行われるものを含め、情報解析の用に供する場合はこれに当たると考えられるとしています。\nただし、次の点に注意が必要です。\n・ただし書: 著作物の種類や用途、利用の態様に照らして著作権者の利益を不当に害することとなる場合は除かれます。考え方では、情報解析に活用できる形で整理したデータを有償のAPIで提供しているのに、それを使わずに閲覧用の記事から、データベースの著作物の創作的表現が認められる情報のまとまりを複製する行為は、これに当たる場合があり得るとしています。\n・享受目的の併存: 複数の目的のうち一つでも享受の目的が含まれていれば、第30条の4は適用されません。","sources":[{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-226","category":9,"question":"生成AIで作った画像が既存の著作物の著作権を侵害するかどうかの考え方として、最も適切なものはどれか。","choices":["人間がAIを使わずに創作する場合と同様に、既存の著作物との類似性と依拠性が認められるかどうかで判断される","AIが生成したものは、既存の著作物とどれほど似ていても、著作権侵害になることはない","既存の著作物と作風や画風が似ていれば、表現が似ていなくても、それだけで必ず著作権侵害になる","生成した画像を自分で見るために生成しただけでも、すべて刑事罰の対象になる"],"answer":0,"explanation":"文化庁の「AIと著作権に関する考え方について」は、生成AIで生成物を出力し利用する段階（生成・利用段階）の著作権侵害について、人間がAIを使わずに行う創作活動の場合と同様に考える必要があるとしています。\n既存の判例では、ある作品に、既存の著作物との類似性と依拠性の両者が認められる場合に、著作権侵害となるとされています。\n・類似性: 既存の著作物の表現上の本質的な特徴を直接感得できるかどうか。表現ではないアイデアや、表現上の創作性がない部分が同じであるだけでは、類似性は認められません。作風や画風のようなアイデアが似ているだけでは、類似性は認められないと考えられます。\n・依拠性: 既存の著作物をもとにして作ったかどうか\n類似性と依拠性が認められれば、著作権者は、生成や利用の行為について差止請求や損害賠償請求ができ、故意による侵害には刑事罰が適用されることもあります。\nなお、私的使用のための複製など、著作権法の権利制限規定に当たる場合は、許諾なく利用できることがあります。","sources":[{"title":"文化審議会著作権分科会法制度小委員会「AIと著作権に関する考え方について」（令和6年3月15日）","url":"https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/pdf/94037901_01.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-227","category":9,"question":"特許法における発明と特許の要件に関する説明として、最も適切なものはどれか。","choices":["発明は自然法則を利用した技術的思想の創作のうち高度のもので、新規性や進歩性が特許の要件となる","特許法の発明には、自然法則を利用していないゲームのルールや計算の決め事そのものも含まれる","出願前にインターネットで公開した発明でも、新規性を失うことはなく、例外なくそのまま特許を受けられる","特許権は、特許庁への出願や審査がなくても、発明をした時点で自動的に発生して保護される"],"answer":0,"explanation":"特許法は、「発明」を「自然法則を利用した技術的思想の創作のうち高度のもの」と定めています（第2条第1項）。自然法則を利用していない人為的な取決め（ゲームのルールなど）そのものは、発明に当たりません。\n特許を受けるための主な要件は次のとおりです（第29条）。\n・産業上利用することができること\n・新規性: 出願前に、日本国内または外国で、公然知られた発明、公然実施された発明、刊行物に記載された発明やインターネットなどで公衆に利用可能となった発明ではないこと（第1項）\n・進歩性: その分野の通常の知識を持つ人が、出願前の公知の発明にもとづいて容易に発明できたものではないこと（第2項）\n特許権は、出願して審査を経て、設定の登録により発生します。存続期間は、原則として出願の日から20年です（第67条第1項）。\nなお、出願前に自ら公開した場合でも、一定の条件のもとで新規性を失わないものとみなす例外の規定（第30条）があります。","sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true,"status":"active"},{"id":"Q-228","category":9,"question":"特許法の職務発明に関する説明として、最も適切なものはどれか。","choices":["あらかじめ勤務規則などで定めれば、職務発明の特許を受ける権利を会社に帰属させられ、従業者は相当の利益を受ける権利を持つ","職務発明の特許を受ける権利は、会社の勤務規則などにどのような定めがあっても、必ず発明をした従業者だけに帰属する","会社は、職務発明を会社のものにした場合でも、発明をした従業者に何らかの利益を与える必要は一切ない","従業者が会社の業務とまったく関係なく私的に行った発明も、すべて職務発明として自動的に会社のものになる"],"answer":0,"explanation":"職務発明は、従業者などがした発明のうち、その性質上会社などの使用者の業務範囲に属し、かつ、発明をするに至った行為がその使用者における従業者の現在または過去の職務に属するものです（第35条第1項）。\n・契約、勤務規則その他の定めで、あらかじめ使用者に特許を受ける権利を取得させることを定めたときは、その権利は発生した時から使用者に帰属します（第35条第3項）。\n・この場合、従業者は、相当の金銭その他の経済上の利益（相当の利益）を受ける権利を持ちます（第35条第4項）。\n・職務発明でない発明について、あらかじめ使用者に権利を取得させる定めは無効です（第35条第2項）。\n発明者は、実際に発明をした人です。特許を受ける権利は、原則として発明者に発生し、職務発明については上記の定めによって使用者に帰属させることができます。","sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"}],"timeSensitive":true,"status":"active"},{"id":"Q-229","category":9,"question":"AIに関する技術やデータを保護する方法として、特許権、著作権、営業秘密を比べた説明として、最も適切なものはどれか。","choices":["特許権は出願と登録が必要で内容は公開される。著作権は創作と同時に発生する。営業秘密は秘密として管理する間保護される","特許権も著作権も、特許庁や文化庁での登録の手続がなければ発生せず、登録を受けた後に初めて保護される","営業秘密として保護を受けるためには、その内容を特許庁に届け出て、広く一般に公開しなければならない","著作権はアイデアそのものを保護する権利で、文章や図などで表現されていない技術的なアイデアも保護する"],"answer":0,"explanation":"いずれも知的財産を保護する仕組みですが、発生の仕方や保護の対象が異なります。\n・特許権: 発明（技術的思想の創作）を保護します。特許庁に出願し、審査を経て登録されることで発生します。出願から1年6か月が経つと出願の内容が公開されます（特許法第64条）。発明の内容を公開する代わりに、一定期間（原則として出願から20年）、独占的に実施できる権利です（第68条）。\n・著作権: 思想や感情の創作的な表現を保護します。著作物を創作した時点で、手続なしに発生します（著作権法第17条第2項、第51条第1項）。アイデアそのものは保護しません。\n・営業秘密: 不正競争防止法で保護されます。登録や公開は必要なく、秘密として管理されている有用な情報で公然と知られていないものが、不正な取得や使用などから保護されます。公開しないで保護できる一方、秘密でなくなれば保護を受けられなくなります。\nAIの開発では、学習手法などを特許で守るか、営業秘密として秘匿するかを選ぶことがあります。","sources":[{"title":"e-Gov法令検索「特許法」（昭和34年法律第121号）","url":"https://laws.e-gov.go.jp/law/334AC0000000121"},{"title":"e-Gov法令検索「著作権法」（昭和45年法律第48号）","url":"https://laws.e-gov.go.jp/law/345AC0000000048"},{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true,"status":"active"},{"id":"Q-230","category":9,"question":"不正競争防止法の「営業秘密」として保護されるための要件の組み合わせとして、最も適切なものはどれか。","choices":["秘密として管理されていること、事業活動に有用な情報であること、公然と知られていないこと","特許庁に登録されていること、事業活動に有用な情報であること、公然と知られていないこと","秘密として管理されていること、特許の要件である新規性と進歩性を満たすこと","業として特定の者に提供されていること、電磁的方法で相当量蓄積されていること"],"answer":0,"explanation":"不正競争防止法は、「営業秘密」を「秘密として管理されている生産方法、販売方法その他の事業活動に有用な技術上又は営業上の情報であつて、公然と知られていないもの」と定めています（第2条第6項）。ここから、次の3つの要件が導かれます。\n・秘密管理性: 秘密として管理されていること\n・有用性: 事業活動に有用な技術上または営業上の情報であること\n・非公知性: 公然と知られていないこと\n営業秘密は、登録の手続なしに保護されます。AIの学習用データや学習済みモデル、ノウハウなども、要件を満たせば営業秘密として保護されます。\n業として特定の者に提供されていることなどは、限定提供データの要件です。\n新規性と進歩性は特許の要件です。","sources":[{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true,"status":"active"},{"id":"Q-231","category":9,"question":"不正競争防止法の「限定提供データ」に関する説明として、最も適切なものはどれか。","choices":["業として特定の者に提供する情報として、電磁的方法で相当量蓄積・管理された技術上または営業上の情報（営業秘密を除く）","誰でも無償で自由に利用できるように、インターネット上で広く一般に公開されているオープンなデータのこと","秘密として管理されている情報だけが対象で、不正競争防止法の営業秘密とまったく同じものを指している","紙の帳簿に記録された顧客名簿のように、電磁的な方法では管理されていない情報のことを指している"],"answer":0,"explanation":"限定提供データは、データを他の事業者などに提供して利活用が進むことを想定して設けられた保護の仕組みです。不正競争防止法は、「限定提供データ」を「業として特定の者に提供する情報として電磁的方法により相当量蓄積され、及び管理されている技術上又は営業上の情報（営業秘密を除く。）」と定めています（第2条第7項）。\nここから、次のような要件が導かれます。\n・限定提供性: 業として特定の者に提供する情報であること\n・相当蓄積性: 電磁的方法により相当量蓄積されていること\n・電磁的管理性: 電磁的方法により管理されていること\n例えば、会員に対して有償で提供している大量のデータなどが想定されます。こうしたデータを不正に取得したり使用したりする行為は、不正競争に当たります。\n営業秘密に当たる情報は除かれているため、営業秘密と限定提供データは重なりません。\n誰でも自由に使えるように公開されたデータや、電磁的に管理されていない情報は対象ではありません。","sources":[{"title":"e-Gov法令検索「不正競争防止法」（平成5年法律第47号）","url":"https://laws.e-gov.go.jp/law/405AC0000000047"}],"timeSensitive":true,"status":"active"},{"id":"Q-232","category":9,"question":"独占禁止法が禁止する行為と、その違法性の判断の基準に関する説明として、最も適切なものはどれか。","choices":["私的独占や不当な取引制限は競争の実質的な制限が、不公正な取引方法は公正競争阻害性が、違法性の判断の基準となる","独占禁止法は、競争を避けるために、事業者どうしが商品の価格を共同で決めることを積極的に奨励している","不公正な取引方法に当たるかどうかは、競争への影響とは関係なく、取引の金額の大きさだけで判断される","独占禁止法は、AIやアルゴリズムを使って行われる事業活動には適用されず、別の法律だけが適用される"],"answer":0,"explanation":"独占禁止法（私的独占の禁止及び公正取引の確保に関する法律）は、公正かつ自由な競争を促進することなどを目的として、主に次の行為を禁止しています（第1条、第3条、第19条）。\n・私的独占: 他の事業者の事業活動を排除したり支配したりすることで、公共の利益に反して、一定の取引分野における競争を実質的に制限すること（第2条第5項）\n・不当な取引制限: 他の事業者と共同して価格を決めるなど、相互に事業活動を拘束して、一定の取引分野における競争を実質的に制限すること（いわゆるカルテルなど。第2条第6項）\n・不公正な取引方法: 公正な競争を阻害するおそれがあるもの（公正競争阻害性）として定められた行為（第2条第9項）\nこのように、私的独占や不当な取引制限では「競争の実質的な制限（競争制限）」、不公正な取引方法では「公正競争阻害性」が、違法かどうかを判断する基準になります。\n独占禁止法は、AIやアルゴリズムを使った事業活動にも適用されます。","sources":[{"title":"e-Gov法令検索「私的独占の禁止及び公正取引の確保に関する法律」（昭和22年法律第54号）","url":"https://laws.e-gov.go.jp/law/322AC0000000054"}],"timeSensitive":true,"status":"active"},{"id":"Q-233","category":9,"question":"公正取引委員会の「生成AIに関する実態調査報告書 ver.2.0」（2026年4月）が、生成AIを巡る独占禁止法・競争政策上の論点として例示しているものとして、最も適切なものはどれか。","choices":["生成AIの基礎となるデータやアルゴリズムが共通になることで、事業者の価格戦略などが同一または類似になり、競争に影響を及ぼす可能性がある","生成AIは競争を必ず活発にするため、生成AIを巡って競争上の問題が生じることはないと結論づけている","生成AIの市場は1つの層だけで構成されており、計算資源やデータは競争に関係しないとしている","生成AIの事業者どうしの連携は、どのような目的や形であっても競争に影響しないとしている"],"answer":0,"explanation":"公正取引委員会は、2024年10月に「生成AIを巡る競争」（ディスカッションペーパー）を公表し、2025年6月に実態調査報告書ver.1.0、2026年4月にver.2.0を公表しました。報告書は、生成AI関連の市場を、インフラストラクチャー（計算資源、データ、専門人材）、モデル、アプリケーションの3つの層に整理しています。\n独占禁止法・競争政策上の論点として、モバイルOS上の専用ソフトウェアに関する制限行為や、既存のデジタルサービスに生成AIを統合する行為を検討しているほか、次のような論点を例示しています。\n・自社優遇: 生成AIモデルの提供事業者が、推論結果で自社の商品やサービスを有利に扱うようにモデルを開発する場合\n・生成AIを用いた並行行為: 生成AIによる価格調査などで価格競争が活発になる場合がある一方、基礎となるデータやアルゴリズムが共通になることで、価格戦略や生産目標などが同一または類似になる状況が想定される場合\n・パートナーシップによる高度専門人材の獲得: 専門人材の囲い込みを企図したパートナーシップで、実質的に事業譲渡と同様の効果を生じさせる場合","sources":[{"title":"公正取引委員会「生成AIに関する実態調査報告書 ver.2.0」（令和8年4月）","url":"https://www.jftc.go.jp/houdou/pressrelease/2026/apr/260416_generativeai02.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-234","category":9,"question":"経済産業省の「AI・データの利用に関する契約ガイドライン（AI編）」が示す、探索的段階型の開発の各段階と、そこで締結する契約の組み合わせとして、最も適切なものはどれか。","choices":["アセスメント段階は秘密保持契約（NDA）、PoC段階は導入検証契約、開発段階はソフトウェア開発契約","アセスメント段階はソフトウェア開発契約、PoC段階は秘密保持契約（NDA）、開発段階は保守契約","アセスメント段階は保守契約、PoC段階はソフトウェア開発契約、開発段階は秘密保持契約（NDA）","すべての段階をまとめて、最初に1つの請負契約だけを締結する"],"answer":0,"explanation":"契約ガイドライン（AI編）は、学習済みモデルの開発を、アセスメント、PoC、開発、追加学習の段階に分けて進める「探索的段階型」の開発方式を推奨しています。各段階の概要は次のとおりです。\n・アセスメント段階: 一定量のデータを使って、学習済みモデルを生成できる可能性を検証する。ベンダはユーザと秘密保持契約（NDA）を締結したうえで、ユーザからデータを受け取る。成果物はレポートなど\n・PoC（Proof of Concept、概念実証）段階: 学習用データセットを使って、ユーザが希望する精度の学習済みモデルを生成できるかを検証する。導入検証契約などを締結する。成果物はレポートやパイロット版の学習済みモデルなど\n・開発段階: 学習済みモデルを生成する。ソフトウェア開発契約を締結する\n・追加学習段階: 納品した学習済みモデルに、追加の学習用データセットで学習させる。保守運用契約の中に定めるなど、さまざまな契約が考えられる\nなお、PoC段階の成果物の知的財産権はベンダに帰属させ、開発段階の成果物はユーザに帰属させるといったように、段階ごとに権利の帰属や利用条件をあらかじめ検討しておくことが望ましいとされています。","sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-235","category":9,"question":"契約ガイドライン（AI編）が示す、学習済みモデルの生成を委託する契約の考え方として、最も適切なものはどれか。","choices":["学習済みモデルの生成では、どの段階でも準委任型の契約が親和的で、未知の入力に対する性能（精度）の保証は難しいとされている","学習済みモデルの生成は、完成品を約束する請負契約が最もなじみやすく、未知の入力に対しても性能を必ず保証すべきだとされている","学習済みモデルの性能は学習用データに依存しないため、ユーザがデータを準備する役割は小さいとされている","ベンダは、ユーザがどのようなデータを持っているかを契約前に必ず把握しているとされている"],"answer":0,"explanation":"契約ガイドライン（AI編）は、学習済みモデルの生成について次のように整理しています。\n・従来型のソフトウェア開発では、要件定義の段階では準委任型、内容が特定された設計・開発の段階では請負型の契約が親和的であることが多いとされる\n・学習済みモデルの生成では、どの段階でも準委任型の契約が親和的である。アセスメントやPoCはモデルの完成を目的とする段階ではない。開発段階でも、契約締結時までに仕様や検収基準を確定することが難しく、未知の入力（データ）に対してモデルが想定外の挙動をしないことを保証することも難しいため、仕事の完成を目的とし、一定の責任を伴う請負型の契約にはなじみにくい\n・既知の入力に対する性能については、評価の条件を適切に設定・限定できれば、性能保証に合理性が認められる場合もある\n・学習済みモデルの性能は学習用データセットに大きく依存し、生データはユーザの管理下にあることが多いため、ユーザの果たす役割が大きい\n請負契約は仕事の完成を目的とする契約、準委任契約は一定の事務の処理（業務の遂行）を目的とする契約です。","sources":[{"title":"経済産業省「AI・データの利用に関する契約ガイドライン（AI編）」（平成30年6月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20180615001-3.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-236","category":9,"question":"経済産業省の「AIの利用・開発に関する契約チェックリスト」（2025年2月）の内容として、最も適切なものはどれか。","choices":["インプットが汎用的なAI学習に使われる場合、モデルからの情報の除去は困難なため、不必要な情報を含めないことが基本とされている","生成AIサービスなど汎用的なAIサービスを利用する契約では、インプットとして提供するデータの扱いを確認する必要はないとされている","AIサービスにインプットした営業秘密は、その内容が外部に漏えいした場合でも、営業秘密としての保護を失わないとされている","利用型契約とは、新たなソフトウェアやデータベース、システムなどの開発を伴う契約のことであるとされている"],"answer":0,"explanation":"契約チェックリストは、生成AIの普及などを踏まえ、AI関連サービスを利用するユーザが、提供するインプット（プロンプトや学習用の生データなど）とアウトプット（AI生成物や成果物など）の扱いを契約時に確認できるように取りまとめたものです。既存のAIサービスを利用する「利用型契約」と、ソフトウェアやシステムなどの開発を伴う「開発型契約」を想定しています。\nインプットの扱いについては、汎用的なAI学習目的に利用される場合、ユーザへのサービス提供に必要な範囲でのみ学習に利用される場合、学習に利用されない場合などに分けて、リスクが異なるとしています。汎用的なAI学習に利用される場合には、一度学習済みモデルに取り込まれた情報の除去は一般に困難で、事後的な是正も難しいため、不必要な情報をできる限りインプットに含めないことが基本的な対応方針だとしています。\nまた、インプットの内容が漏えいする可能性があり、営業秘密に当たる情報が公知になると、以後の保護が失われる可能性があると注意しています。","sources":[{"title":"経済産業省「AIの利用・開発に関する契約チェックリスト」（令和7年2月）","url":"https://www.meti.go.jp/policy/mono_info_service/connected_industries/sharing_and_utilization/20250218003-ar.pdf"}],"timeSensitive":true,"status":"active"},{"id":"Q-237","category":9,"question":"SaaS型のAIサービスを利用規約に基づいて利用する場合の留意点として、最も適切なものはどれか。","choices":["利用規約は定期的に変更され得るため、ユーザは変更の条件や準拠法を確認し、変更状況を随時確認する体制を整えることが望ましい","利用規約は、一度同意すれば、サービスの提供者が変更することは法律上一切できない","日本の民法では、利用規約の変更は、ユーザ全員から個別に同意を得なければ必ず無効になる","海外の事業者が提供するサービスの利用規約でも、準拠法は常に日本法になるので、確認する必要はない"],"answer":0,"explanation":"SaaS（Software as a Service）型のAIサービスでは、提供者（ベンダ）が定めた利用規約に基づいてサービスが提供されることが多くあります。契約チェックリストは、利用規約は定期的に変更され得るため、ユーザは変更の状況を随時確認することが必要だとして
